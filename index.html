<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>World Empire</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#06131d;
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
}

#app{
  width:100%;
  max-width:1400px;
  margin:auto;
  min-height:100vh;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#071925;
  border-bottom:1px solid #214357;
  padding:9px;
}

.title{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.stats{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:3px;
}

.stat{
  min-width:115px;
  flex:1;
  background:#102b3c;
  border:1px solid #234c63;
  border-radius:10px;
  padding:8px;
  text-align:center;
}

.stat small{
  display:block;
  color:#9db4c2;
  margin-bottom:4px;
}

.stat strong{
  font-size:16px;
}

/* MAP */

.mapBox{
  position:relative;
  margin:10px;
  height:calc(100vh - 245px);
  min-height:420px;
  max-height:760px;
  border:1px solid #244b60;
  border-radius:18px;
  overflow:hidden;
  background:#061722;
  box-shadow:0 0 30px rgba(0,0,0,.3);
}

#map{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.ocean{
  fill:#071c29;
}

.country{
  fill:#31566a;
  stroke:#142c3a;
  stroke-width:.6;
  cursor:pointer;
  transition:fill .15s;
}

.country:hover{
  fill:#47788f;
}

.country.selected{
  fill:#1682a5;
  stroke:#70d7ff;
  stroke-width:1.5;
}

.mapControls{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:5px;
  z-index:5;
}

.mapBtn{
  width:43px;
  height:43px;
  border:0;
  border-radius:10px;
  background:#087ba5;
  color:white;
  font-size:20px;
}

/* COUNTRY INFO */

.countryInfo{
  position:absolute;
  right:10px;
  bottom:10px;
  width:260px;
  max-width:calc(100% - 20px);
  background:rgba(7,25,37,.94);
  border:1px solid #32657d;
  border-radius:13px;
  padding:12px;
  display:none;
  z-index:6;
}

.countryInfo.show{
  display:block;
}

.countryInfo h3{
  margin:0 0 8px;
}

.countryInfo p{
  margin:5px 0;
  color:#b5c8d1;
  font-size:13px;
}

.action{
  width:100%;
  border:0;
  background:#087fa9;
  color:#fff;
  border-radius:8px;
  padding:10px;
  margin-top:8px;
}

/* BOTTOM */

.bottom{
  position:sticky;
  bottom:0;
  z-index:20;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  background:#071925;
  border-top:1px solid #24485c;
  padding:8px;
}

.nav{
  background:#102b3c;
  border:1px solid #244d63;
  color:#fff;
  border-radius:11px;
  padding:8px 3px;
  font-size:12px;
}

.nav span{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

/* PANEL */

.panel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:50;
  display:none;
  align-items:flex-end;
}

.panel.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:88vh;
  overflow:auto;
  background:#081a26;
  border-radius:20px 20px 0 0;
  padding:15px;
  border-top:1px solid #315c70;
}

.sheetHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.close{
  background:#263d49;
  color:#fff;
  border:0;
  border-radius:8px;
  width:38px;
  height:38px;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.card{
  background:#102b3b;
  border:1px solid #244c60;
  border-radius:12px;
  padding:12px;
}

.card h3{
  margin:0 0 7px;
  font-size:15px;
}

.card p{
  color:#a9bdc7;
  font-size:12px;
  line-height:1.7;
  margin:4px 0;
}

.buy{
  width:100%;
  border:0;
  background:#087fa9;
  color:white;
  padding:9px;
  border-radius:8px;
  margin-top:6px;
}

.buy:disabled{
  opacity:.4;
}

/* TRADE */

.tradeBox{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

select,input{
  width:100%;
  padding:11px;
  background:#102b3b;
  color:white;
  border:1px solid #31576b;
  border-radius:8px;
  margin-top:5px;
}

.tradeResult{
  margin-top:12px;
  padding:12px;
  background:#102b3b;
  border-radius:10px;
  line-height:1.8;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#102b3b;
  border:1px solid #4a7080;
  border-radius:10px;
  padding:11px 17px;
  z-index:100;
  display:none;
  white-space:nowrap;
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .stat{
    min-width:105px;
  }

  .mapBox{
    height:calc(100vh - 275px);
  }
}

@media(min-width:800px){
  .mapBox{
    height:650px;
  }
}
</style>
</head>

<header class="header">

  <div class="stats">

    </div>

    <div class="stat">

</div>


<!-- PANEL -->

<div id="panel" class="panel">

<div class="sheet">

  <div class="sheetHeader">
    <h2 id="panelTitle">فروشگاه</h2>
    <button class="close" onclick="closePanel()">×</button>
  </div>

  <div id="panelContent"></div>

</div>

</div>


<div id="toast"></div>


<script>

/* =====================================================
   GAME DATA
===================================================== */

let game = {

  money:8856,
  steel:505,
  oil:509,
  food:505,

  inflation:3.2,

  selectedCountry:null,

  military:{
    fighter:5,
    drone:5,
    tank:5,
    missile:5
  },

  buildings:{
    road:1,
    factory:1,
    power:1,
    steelFactory:0,
    oilRefinery:0,
    port:0,
    research:0
  },

  relations:{}

};


/* =====================================================
   REAL 10m WORLD MAP
===================================================== */

const mapURL =
"https://cdn.jsdelivr.net/npm/world-atlas@2/countries-10m.json";


async function loadMap(){

  try{

    const response = await fetch(mapURL);

    if(!response.ok)
      throw new Error("map");

    const topo = await response.json();

    drawCountries(topo);

  }catch(e){

    /*
      اگر اینترنت CDN در دسترس نبود،
      حداقل یک نقشه ساده پشتیبان نمایش داده می‌شود.
    */

    drawFallback();

  }

}


/*
  تبدیل TopoJSON به SVG بدون نیاز
  به کتابخانه سنگین
*/

function drawCountries(topo){

  const objects = topo.objects;

  let obj =
    objects.countries ||
    objects.land;

  if(!obj){
    drawFallback();
    return;
  }

  /*
   * نسخه سبک:
   * مرزهای کشورها از arcs داده 10m
   * استخراج می‌شوند.
   */

  const svg =
    document.getElementById("countries");

  svg.innerHTML="";

  /*
   * TopoJSON به شکل کامل بدون topojson-client
   * برای سازگاری بیشتر، یک parser کوچک داریم.
   */

  const arcs = topo.arcs;
  const transform = topo.transform;

  function decodeArc(arc){

    let x=0;
    let y=0;
    let result=[];

    for(let p of arc){

      x += p[0];
      y += p[1];

      let xx =
        x * transform.scale[0] +
        transform.translate[0];

      let yy =
        y * transform.scale[1] +
        transform.translate[1];

      result.push([xx,yy]);
    }

    return result;
  }


  const decoded=[];

  for(let a of arcs)
    decoded.push(decodeArc(a));


  function getArc(index){

    if(index>=0)
      return decoded[index];

    let original =
      decoded[~index];

    return original.slice().reverse();

  }


  function ringToPath(ring){

    let points=[];

    for(let index of ring){

      let arc=getArc(index);

      if(points.length)
        arc=arc.slice(1);

      points=points.concat(arc);

    }

    if(!points.length)
      return "";

    let d =
      "M "+points[0][0]+" "+points[0][1];

    for(let i=1;i<points.length;i++){

      d +=
        " L "+points[i][0]+" "+points[i][1];

    }

    return d+" Z";

  }


  function geometryPath(g){

    if(g.type==="Polygon"){

      return g.arcs
        .map(r=>ringToPath(r))
        .join(" ");

    }

    if(g.type==="MultiPolygon"){

      return g.arcs
        .map(poly =>
          poly.map(r=>ringToPath(r)).join(" ")
        )
        .join(" ");

    }

    return "";

  }


  let geometries=obj.geometries || [];

  geometries.forEach((g,index)=>{

    const path=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    path.setAttribute(
      "d",
      geometryPath(g)
    );

    path.setAttribute(
      "class",
      "country"
    );

    let name =
      g.properties?.name ||
      g.properties?.NAME ||
      g.properties?.NAME_LONG ||
      ("کشور "+(index+1));

    path.dataset.name=name;

    path.addEventListener(
      "click",
      function(){

        selectCountry(name,path);

      }
    );

    svg.appendChild(path);

  });

}


/* =====================================================
   FALLBACK MAP
===================================================== */

function drawFallback(){

  const svg=document.getElementById("countries");

  svg.innerHTML="";

  /*
    شکل‌های ساده پشتیبان.
    نقشه اصلی از 10m دریافت می‌شود.
  */

  const shapes=[

    [80,180,170,120,"آمریکای شمالی"],
    [180,310,120,150,"آمریکای جنوبی"],
    [430,190,110,150,"اروپا"],
    [430,260,140,150,"آفریقا"],
    [550,150,260,180,"آسیا"],
    [750,320,150,100,"اقیانوسیه"]

  ];

  shapes.forEach(s=>{

    const r=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

    r.setAttribute("x",s[0]);
    r.setAttribute("y",s[1]);
    r.setAttribute("width",s[2]);
    r.setAttribute("height",s[3]);
    r.setAttribute("rx","30");
    r.setAttribute("class","country");

    r.addEventListener(
      "click",
      ()=>selectCountry(s[4],r)
    );

    svg.appendChild(r);

  });

}


/* =====================================================
   COUNTRY SELECTION
===================================================== */

function selectCountry(name,element){

  document
    .querySelectorAll(".country")
    .forEach(x=>x.classList.remove("selected"));

  element.classList.add("selected");

  game.selectedCountry=name;

  const info=document.getElementById("countryInfo");

  info.innerHTML=`

    <h3>🌍 ${name}</h3>

    <p>وضعیت روابط: ${relationText(name)}</p>

    <p>🏭 اقتصاد: متوسط</p>

    <p>👥 جمعیت: محاسبه‌شده در شبیه‌سازی</p>

    <p>🤝 امکان تجارت و دیپلماسی</p>

    <button class="action"
      onclick="openTradeWith('${name.replace(/'/g,"")}')">
      🤝 پیشنهاد معامله
    </button>

  `;

  info.classList.add("show");

}


/* =====================================================
   RELATIONS
===================================================== */

function relationText(country){

  let r=game.relations[country];

  if(r===undefined)
    return "⚪ عادی";

  if(r>60)
    return "🟢 دوستانه";

  if(r>20)
    return "🔵 خوب";

  if(r<-60)
    return "🔴 خصمانه";

  if(r<0)
    return "🟠 متشنج";

  return "⚪ عادی";

}


/* =====================================================
   STORE
===================================================== */

function openStore(){

  showPanel(
    "🏪 فروشگاه ملی",
    `

    <div class="grid">

      ${buildingCard(
        "🛣️ زیرساخت جاده",
        "افزایش فعالیت اقتصادی و حمل‌ونقل",
        800,
        "road"
      )}

      ${buildingCard(
        "🏭 کارخانه صنعتی",
        "افزایش ظرفیت تولید فولاد",
        1400,
        "factory"
      )}

      ${buildingCard(
        "⚡ نیروگاه",
        "کاهش فشار تولید و افزایش ظرفیت صنعتی",
        1700,
        "power"
      )}

      ${buildingCard(
        "🔩 کارخانه فولاد",
        "تولید خودکار فولاد",
        2200,
        "steelFactory"
      )}

      ${buildingCard(
        "🛢️ پالایشگاه",
        "افزایش ظرفیت فرآوری نفت",
        2600,
        "oilRefinery"
      )}

      ${buildingCard(
        "⚓ بندر تجاری",
        "افزایش ظرفیت تجارت دریایی",
        3000,
        "port"
      )}

      ${buildingCard(
        "🔬 مرکز پژوهش",
        "افزایش سرعت پیشرفت فناوری",
        3500,
        "research"
      )}

    </div>

    <h3 style="margin-top:20px">
      🛡️ تجهیزات نظامی
    </h3>

    <div class="grid">

      ${militaryCard(
        "✈️ جنگنده",
        "هزینه: 900 پول + 30 فولاد",
        "fighter",
        900,
        30
      )}

      ${militaryCard(
        "🛩️ پهپاد",
        "هزینه: 500 پول + 10 فولاد",
        "drone",
        500,
        10
      )}

      ${militaryCard(
        "🛡️ تانک",
        "هزینه: 700 پول + 35 فولاد",
        "tank",
        700,
        35
      )}

      ${militaryCard(
        "🚀 سامانه موشکی",
        "هزینه: 1200 پول + 50 فولاد",
        "missile",
        1200,
        50
      )}

    </div>

    `
  );

}


function buildingCard(title,desc,cost,key){

  return `

  <div class="card">

    <h3>${title}</h3>

    <p>${desc}</p>

    <p>
      قیمت:
      💰 ${cost}
    </p>

    <p>
      ساخته‌شده:
      ${game.buildings[key]}
    </p>

    <button class="buy"
      onclick="buyBuilding('${key}',${cost})">

      خرید / ساخت

    </button>

  </div>

  `;

}


function militaryCard(title,desc,key,moneyCost,steelCost){

  return `

  <div class="card">

    <h3>${title}</h3>

    <p>${desc}</p>

    <p>
      موجودی:
      ${game.military[key]}
    </p>

    <button class="buy"
      onclick="buyMilitary(
        '${key}',
        ${moneyCost},
        ${steelCost}
      )">

      خرید

    </button>

  </div>

  `;

}


function buyBuilding(key,cost){

  const finalCost=
    Math.round(cost*(1+game.inflation/100));

  if(game.money<finalCost){

    toast("❌ پول کافی نیست");
    return;

  }

  game.money-=finalCost;

  game.buildings[key]++;

  updateUI();

  saveGame();

  toast("ساختمان ساخته شد");

  openStore();

}


function buyMilitary(key,moneyCost,steelCost){

  if(game.money<moneyCost){

    toast("❌ پول کافی نیست");
    return;

  }

  if(game.steel<steelCost){

    toast("❌ فولاد کافی نیست");
    return;

  }

  game.money-=moneyCost;
  game.steel-=steelCost;

  game.military[key]++;

  updateUI();

  saveGame();

  toast("تجهیزات خریداری شد");

  openStore();

}


/* =====================================================
   TRADE
===================================================== */

function openTrade(){

  showPanel(
    "🤝 تجارت بین‌المللی",
    `

    <p>
      با کشورهای مختلف قرارداد تجاری ببند.
      نتیجه معامله بر اساس روابط، قیمت منابع
      و وضعیت اقتصادی محاسبه می‌شود.
    </p>

    <div class="tradeBox">

      <div>
        کشور مقصد
        <select id="tradeCountry">

          <option>چین</option>
          <option>هند</option>
          <option>ترکیه</option>
          <option>آلمان</option>
          <option>ژاپن</option>
          <option>برزیل</option>
          <option>کانادا</option>
          <option>مصر</option>
          <option>عربستان</option>
          <option>استرالیا</option>

        </select>
      </div>

      <div>
        منبع
        <select id="tradeResource">

          <option value="oil">نفت</option>
          <option value="steel">فولاد</option>
          <option value="food">غذا</option>
          <option value="money">پول</option>

        </select>
      </div>

    </div>

    <div style="margin-top:10px">

      مقدار

      <input
        id="tradeAmount"
        type="number"
        min="1"
        value="50">

    </div>

    <button class="action"
      onclick="makeTrade()">

      📦 ارسال پیشنهاد معامله

    </button>

    <div id="tradeResult"
         class="tradeResult">

      هنوز پیشنهادی ارسال نشده.

    </div>

    `
  );

}


function openTradeWith(country){

  closePanel();

  setTimeout(()=>{

    openTrade();

    const select=
      document.getElementById("tradeCountry");

    if(select){

      let found=false;

      for(let option of select.options){

        if(option.text===country){

          option.selected=true;
          found=true;

        }

      }

    }

  },100);

}


function makeTrade(){

  const country=
    document.getElementById("tradeCountry").value;

  const resource=
    document.getElementById("tradeResource").value;

  const amount=
    Math.max(
      1,
      Number(
        document.getElementById("tradeAmount").value
      )
    );

  let relation=
    game.relations[country] || 0;

  let chance=
    55+
    relation*.35-
    game.inflation*.7+
    Math.random()*20;

  let accepted=
    chance>=50;


  const result=
    document.getElementById("tradeResult");


  if(!accepted){

    game.relations[country]=
      Math.max(-100,relation-2);

    result.innerHTML=
      "❌ پیشنهاد معامله رد شد.<br>"+
      "کشور مقصد شرایط معامله را مناسب ندانست.";

    saveGame();
    return;

  }


  /*
   * معامله پذیرفته شد.
   * ارزش معامله با تورم تغییر می‌کند.
   */

  let value=
    Math.round(
      amount*
      (1+game.inflation/100)
    );


  if(resource==="oil"){

    if(game.oil<amount){

      result.innerHTML="❌ نفت کافی ندارید.";
      return;

    }

    game.oil-=amount;
    game.money+=value;

  }


  if(resource==="steel"){

    if(game.steel<amount){

      result.innerHTML="❌ فولاد کافی ندارید.";
      return;

    }

    game.steel-=amount;
    game.money+=value;

  }


  if(resource==="food"){

    if(game.food<amount){

      result.innerHTML="❌ غذا کافی ندارید.";
      return;

    }

    game.food-=amount;
    game.money+=value;

  }


  if(resource==="money"){

    if(game.money<amount){

      result.innerHTML="❌ پول کافی ندارید.";
      return;

    }

    game.money-=amount;
    game.food+=
      Math.round(amount*.8);

  }


  game.relations[country]=
    Math.min(
      100,
      relation+5
    );


  result.innerHTML=`

    🟢 معامله پذیرفته شد!

    <br>

    🚢 کشتی تجاری در حال انتقال محموله است...

    <br>

    📦 مقدار: ${amount}

    <br>

    🤝 روابط با ${country} بهتر شد.

  `;


  updateUI();
  saveGame();

  simulateShip(country);

}


/* =====================================================
   SHIP ANIMATION
===================================================== */

function simulateShip(country){

  const svg=document.getElementById("map");

  const ship=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

  ship.textContent="🚢";

  ship.setAttribute("x","150");
  ship.setAttribute("y","400");

  ship.setAttribute(
    "font-size",
    "20"
  );

  svg.appendChild(ship);


  let x=150;
  let y=400;

  let timer=
    setInterval(()=>{

      x+=4;
      y-=1;

      ship.setAttribute("x",x);
      ship.setAttribute("y",y);

      if(x>850){

        clearInterval(timer);

        ship.remove();

        toast(
          "🚢 محموله به مقصد رسید"
        );

      }

    },50);

}

/* =====================================================
   PANEL
===================================================== */

function showPanel(title,content){

  document.getElementById("panelTitle")
    .textContent=title;

  document.getElementById("panelContent")
    .innerHTML=content;

  document.getElementById("panel")
    .classList.add("open");

}


function closePanel(){

  document.getElementById("panel")
    .classList.remove("open");

}


/* =====================================================
   MAP ZOOM
===================================================== */

let mapScale=1;

function zoomMap(value){

  mapScale*=value;

  mapScale=
    Math.max(
      .7,
      Math.min(4,mapScale)
    );

  const svg=
    document.getElementById("countries");

  svg.style.transformOrigin="center";
  svg.style.transform=
    `scale(${mapScale})`;

}


function resetMap(){

  mapScale=1;

  document.getElementById("countries")
    .style.transform="scale(1)";

}


/* =====================================================
   ECONOMY TICK
===================================================== */

setInterval(()=>{

  /*
    تولید منابع
  */

  game.steel +=
    game.buildings.steelFactory*.8;

  game.oil +=
    game.buildings.oilRefinery*.5;

  game.food +=
    .8+
    game.buildings.factory*.1;


  /*
    درآمد اقتصادی
  */

  let income=
    3+
    game.buildings.road*.8+
    game.buildings.factory*1.2+
    game.buildings.power*.8+
    game.buildings.port*.7;


  /*
    تورم پویا
  */

  let pressure=
    game.money>15000 ? .025 : -.01;

  pressure +=
    game.buildings.power <
    game.buildings.factory ? .015 : 0;

  pressure +=
    (Math.random()-.5)*.03;


  game.inflation += pressure;

  game.inflation=
    Math.max(
      .5,
      Math.min(
        30,
        game.inflation
      )
    );


  game.money+=
    income*
    (1-game.inflation/150);


  updateUI();

},1000);


/* =====================================================
   UI
===================================================== */

function updateUI(){

  document.getElementById("money")
    .textContent=Math.floor(game.money);

  document.getElementById("steel")
    .textContent=Math.floor(game.steel);

  document.getElementById("oil")
    .textContent=Math.floor(game.oil);

  document.getElementById("food")
    .textContent=Math.floor(game.food);

  document.getElementById("inflation")
    .textContent=
      game.inflation.toFixed(2)+"%";

}


/* =====================================================
   SAVE / LOAD
===================================================== */

function saveGame(){

  localStorage.setItem(
    "worldEmpireSave",
    JSON.stringify(game)
  );

}


function loadGame(){

  const saved=
    localStorage.getItem(
      "worldEmpireSave"
    );

  if(!saved)
    return;

  try{

    const data=
      JSON.parse(saved);

    game=
      Object.assign(
        game,
        data
      );

  }catch(e){}

}


/* =====================================================
   TOAST
===================================================== */

function toast(message){

  const t=
    document.getElementById("toast");

  t.textContent=message;

  t.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=
    setTimeout(
      ()=>t.style.display="none",
      1800
    );

}


/* =====================================================
   START
===================================================== */

loadGame();

updateUI();

loadMap();


/*
  ذخیره خودکار
*/

setInterval(
  saveGame,
  10000
);


/*
  بستن پنل با لمس بیرون
*/

document.getElementById("panel")
  .addEventListener(
    "click",
    function(e){

      if(e.target===this)
        closePanel();

    }
  );

</script>
