<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>
<meta name="theme-color" content="#07131d">

<title>GLOBAL DOMINION</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root
{
    --bg:
        #030a0f;

    --ocean:
        #071b28;

    --ocean2:
        #0b2a3b;

    --panel:
        rgba(
            5,
            20,
            30,
            .96
        );

    --panel2:
        #102937;

    --line:
        rgba(
            255,
            255,
            255,
            .11
        );

    --line2:
        rgba(
            255,
            255,
            255,
            .22
        );

    --text:
        #effaff;

    --muted:
        #91a8b6;

    --green:
        #39dfa9;

    --blue:
        #52bfff;

    --red:
        #ff5971;

    --purple:
        #a976ff;

    --gold:
        #ffcc66;

    --orange:
        #ff9b50;
}

/* =========================================================
   RESET
========================================================= */

*
{
    box-sizing:
        border-box;

    -webkit-tap-highlight-color:
        transparent;
}

html,
body
{
    width:
        100%;

    height:
        100%;

    margin:
        0;

    overflow:
        hidden;

    background:
        var(
            --bg
        );

    color:
        var(
            --text
        );

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

button,
input,
select
{
    font:
        inherit;
}

button
{
    color:
        inherit;
}

/* =========================================================
   APP
========================================================= */

#app
{
    position:
        fixed;

    inset:
        0;

    overflow:
        hidden;
}

/* =========================================================
   MAP
========================================================= */

#mapViewport
{
    position:
        absolute;

    inset:
        0;

    overflow:
        hidden;

    touch-action:
        none;

    background:
        radial-gradient(
            circle at 48% 40%,
            #10374c,
            #071b29 58%,
            #041018 100%
        );
}

#worldSvg
{
    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    user-select:
        none;
}

#oceanBackground
{
    fill:
        #071c2a;
}

.country-shape
{
    cursor:
        pointer;

    stroke:
        rgba(
            225,
            246,
            255,
            .68
        );

    stroke-width:
        .85;

    vector-effect:
        non-scaling-stroke;

    transition:
        filter .12s ease,
        opacity .12s ease,
        stroke-width .12s ease;
}

.country-shape:hover
{
    filter:
        brightness(
            1.23
        );

    stroke:
        #ffffff;

    stroke-width:
        1.5;
}

.country-shape.selected
{
    stroke:
        #ffe16a;

    stroke-width:
        2.6;

    filter:
        brightness(
            1.28
        )
        drop-shadow(
            0 0 8px
            rgba(
                255,
                220,
                80,
                .70
            )
        );
}

.country-shape.player
{
    stroke:
        #ffffff;

    stroke-width:
        2.5;

    filter:
        brightness(
            1.18
        )
        drop-shadow(
            0 0 8px
            rgba(
                55,
                225,
                170,
                .80
            )
        );
}

.country-shape.enemy
{
    stroke:
        #ff526d;

    stroke-width:
        2.3;

    filter:
        drop-shadow(
            0 0 7px
            rgba(
                255,
                70,
                95,
                .75
            )
        );
}

.country-shape.ally
{
    stroke:
        #59c4ff;

    stroke-width:
        2.2;
}

.country-shape.sanctioned
{
    stroke:
        #ffd15d;

    stroke-width:
        2;

    stroke-dasharray:
        5 3;
}

.micro-country
{
    cursor:
        pointer;

    stroke:
        white;

    stroke-width:
        .8;

    vector-effect:
        non-scaling-stroke;
}

.micro-country:hover
{
    stroke-width:
        2;
}

.micro-country.selected
{
    stroke:
        #ffe16a;

    stroke-width:
        2.5;
}

.micro-country.player
{
    stroke:
        #ffffff;

    stroke-width:
        2.4;
}

#routeLayer path
{
    fill:
        none;

    vector-effect:
        non-scaling-stroke;

    pointer-events:
        none;
}

.route-trade
{
    stroke:
        #3de1ad;

    stroke-width:
        1.5;

    stroke-dasharray:
        6 5;

    opacity:
        .72;

    animation:
        routeMove 1.2s linear infinite;
}

.route-alliance
{
    stroke:
        #59c3ff;

    stroke-width:
        1.7;

    opacity:
        .72;
}

.route-war
{
    stroke:
        #ff536e;

    stroke-width:
        2.6;

    stroke-dasharray:
        8 5;

    opacity:
        .95;

    filter:
        drop-shadow(
            0 0 5px
            rgba(
                255,
                70,
                95,
                .65
            )
        );

    animation:
        routeMove .75s linear infinite;
}

@keyframes routeMove
{
    to
    {
        stroke-dashoffset:
            -30;
    }
}

#mapLoading
{
    position:
        absolute;

    z-index:
        80;

    inset:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        #061824;

    transition:
        opacity .3s;
}

#mapLoading.hidden
{
    opacity:
        0;

    pointer-events:
        none;
}

.loader-card
{
    width:
        min(
            310px,
            calc(
                100% - 30px
            )
        );

    border:
        1px solid
        var(
            --line
        );

    border-radius:
        18px;

    background:
        #0b2534;

    padding:
        20px;

    text-align:
        center;

    box-shadow:
        0 25px 70px
        rgba(
            0,
            0,
            0,
            .5
        );
}

.loader-spinner
{
    width:
        42px;

    height:
        42px;

    margin:
        auto;

    border-radius:
        50%;

    border:
        4px solid
        rgba(
            255,
            255,
            255,
            .08
        );

    border-top-color:
        var(
            --green
        );

    animation:
        spin .8s linear infinite;
}

@keyframes spin
{
    to
    {
        transform:
            rotate(
                360deg
            );
    }
}

.loader-card b
{
    display:
        block;

    margin-top:
        12px;

    font-size:
        12px;
}

.loader-card small
{
    display:
        block;

    color:
        var(
            --muted
        );

    margin-top:
        7px;

    line-height:
        1.8;

    font-size:
        9px;
}

/* =========================================================
   TOP HUD
========================================================= */

#topbar
{
    position:
        absolute;

    z-index:
        60;

    top:
        8px;

    left:
        8px;

    right:
        8px;

    height:
        61px;

    display:
        flex;

    gap:
        7px;

    pointer-events:
        none;
}

.brand
{
    pointer-events:
        auto;

    width:
        185px;

    min-width:
        185px;

    height:
        58px;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    padding:
        8px 11px;

    border:
        1px solid
        var(
            --line

    border-radius:
        17px;

    background:
        rgba(
            5,
            20,
            30,
            .95
        );

    backdrop-filter:
        blur(
            15px

    box-shadow:
        0 12px 40px

            0,
            0,
            0,
            .35

.brand-logo

    height:
        41px;

    border-radius:

        center;

    background:

            145deg,
            #3de1ad,
            #15765a
        );

    color:
        #03110c;

    font-size:
        22px;
}

.brand b
{
    display:
        block;

    font-size:
        11px;
}

.brand small
{
    display:
        block;

    margin-top:
        3px;

    color:
        var(
            --muted
        );

    font-size:
        8px;
}

.resources
{
    pointer-events:
        auto;

    flex:
        1;

    height:
        58px;

    display:
        flex;

    gap:
        6px;

    overflow:
        auto hidden;

    scrollbar-width:
        none;
}

.resource
{
    min-width:
        82px;

    height:
        57px;

    border:
        1px solid
        var(
            --line
        );

    border-radius:
        14px;

    background:
        rgba(
            6,
            22,
            32,
            .95
        );

    padding:
        7px 9px;

    backdrop-filter:
        blur(
            14px
        );
}

.resource small
{
    display:
        block;

    color:
        var(
            --muted
        );

    font-size:
        8px;
}

.resource b
{
    display:
        block;

    margin-top:
        5px;

    font-size:
        11px;

    white-space:
        nowrap;
}

/* =========================================================
   MAP TOOLS
========================================================= */

#mapTools
{
    position:
        absolute;

    z-index:
        65;

    top:
        82px;

    left:
        10px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        5px;
}

.map-tool
{
    width:
        41px;

    height:
        41px;

    border:
        1px solid
        var(
            --line
        );

    border-radius:
        11px;

    background:
        rgba(
            5,
            20,
            30,
            .94
        );

    cursor:
        pointer;

    box-shadow:
        0 8px 25px

            0,
            0,
            0,
            .25
        );
}

.map-tool:hover,
.map-tool.active
{
    background:
        #175a49;

    border-color:
        var(
            --green
        );
}

/* =========================================================
   SIDE PANEL
========================================================= */

#sidePanel
{
    position:
        absolute;

    z-index:
        55;

    right:
        10px;

    top:
        79px;

    bottom:
        89px;

    width:
        284px;

    border:
        1px solid
        var(
            --line
        );

    border-radius:
        18px;

    overflow:
        hidden;

    background:
        rgba(
            5,
            19,
            29,
            .95
        );

    backdrop-filter:
        blur(
            16px

    box-shadow:
        0 20px 50px
        rgba(
            0,
            0,
            0,
            .40

.side-head
{
    height:
        48px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    padding:
        0 13px;

    border-bottom:
        1px solid
        var(
            --line
        );

    font-size:
        10px;
}

#sideBody
{
    position:
        absolute;

    inset:
        49px 0 0;

    overflow:
        auto;

    padding:
        9px;
}

/* =========================================================
   DOCK
========================================================= */

#dock
{
    position:
        absolute;

    z-index:
        70;

    left:
        50%;

    bottom:
        9px;

    transform:
        translateX(

        );

    height:

    max-width:
        calc(
            100% - 18px
        );

    display:
        flex;

    gap:
        5px;

    overflow:
        auto hidden;

    scrollbar-width:
        none;

    padding:
        7px;

    border:
        1px solid
        var(
            --line
        );

    border-radius:
        19px;

    background:
        rgba(
            5,
            18,
            27,
            .97
        );

    backdrop-filter:
        blur(
            17px
        );

    box-shadow:
        0 15px 50px
        rgba(
            0,
            0,
            0,
            .45
        );
}

.dock-btn
{
    min-width:
        67px;

    border:
        0;

    border-radius:
        13px;

    background:
        transparent;

    cursor:
        pointer;
}

.dock-btn:hover
{
    background:
        rgba(
            255,
            255,
            255,
            .07
        );
}

.dock-btn span
{
    display:
        block;

    font-size:
        20px;
}

.dock-btn small
{
    display:
        block;

    color:
        #c7d7df;

    margin-top:
        3px;

    font-size:
        8px;
}

/* =========================================================
   GENERIC COMPONENTS
========================================================= */

.card
{
    width:
        100%;

    display:
        block;

    margin-bottom:
        8px;

    border:
        1px solid
        var(
            --line
        );

    border-radius:
        14px;

    padding:
        10px;

    background:
        linear-gradient(
            145deg,
            rgba(
                20,
                43,
                56,
                .94
            ),
            rgba(
                8,
                27,
                38,
                .94
            )
        );

    text-align:
        right;
}

button.card
{
    cursor:
        pointer;
}

button.card:hover
{
    border-color:
        rgba(
            57,
            223,
            169,
            .45
        );
}

.card-head
{
    display:
        flex;

    align-items:
        center;

    gap:
        8px;
}

.icon
{
    width:
        38px;

    min-width:
        38px;

    height:
        38px;

    border-radius:
        11px;

    display:
        grid;

    place-items:
        center;

    background:
        rgba(
            255,
            255,
            255,
            .07
        );

    font-size:
        19px;
}

.card-title
{
    font-size:
        10px;

    font-weight:
        bold;
}

.card-sub
{
    margin-top:
        3px;

        var(
            --muted
        );

.kpi

.btn.green

    background:

}

.btn.blue

    background:

}

.btn.red

    background:
        #782c40;

.btn.purple

    background:

}

.btn.gold

    background:

/* =========================================================
   START SCREEN
========================================================= */

#startScreen
{
    position:
        fixed;

    inset:
        0;

    z-index:
        700;

    overflow:
        auto;

    padding:
        20px;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(
                37,
                184,
                144,
                .23
            ),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #071824,
            #02090e
        );
}

.start-wrap
{
    width:
        min(
            1120px,
            100%
        );

    margin:
        auto;
}

.hero
{
    text-align:
        center;

    margin:
        18px auto 24px;
}

.hero-logo
{
    width:
        84px;

    height:
        84px;

    margin:
        auto;

    border-radius:
        25px;

    display:
        grid;

    place-items:
        center;

    font-size:
        43px;

    background:
        linear-gradient(
            145deg,
            #3ee2af,
            #17765a
        );

    color:
        #03110c;
}

.hero h1
{
    margin:
        13px 0 5px;

    font-size:
        25px;
}

.hero p
{
    color:
        var(
            --muted
        );

    font-size:
        9px;
}

.start-tools
{
    display:
        grid;

    grid-template-columns:
        1fr 190px;

    gap:
        8px;

    margin-bottom:
        10px;
}

#countryList
{
    display:
        grid;

    grid-template-columns:
        repeat(
            4,
            minmax(
                0,
                1fr
            )
        );

    gap:
        7px;
}

.country-choice
{
    min-height:
        100px;

    border:
        1px solid
        var(
            --line
        );

    border-radius:
        14px;

    padding:
        10px;

    text-align:
        right;

    background:
        linear-gradient(
            145deg,
            #0d2634,
            #081d29
        );

    cursor:
        pointer;
}

.country-choice:hover
{
    border-color:
        var(
            --green
        );
}

.choice-head
{
    display:
        flex;

    align-items:
        center;

    gap:
        8px;
}

.choice-flag
{
    font-size:
        29px;
}

.country-choice b
{
    font-size:
        10px;
}

.country-choice small
{
    display:
        block;

    margin-top:
        5px;

    color:
        var(
            --muted
        );

    font-size:
        8px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(
    max-width:
    900px
)
{
    #sidePanel
    {
        width:
            245px;
    }

    #countryList
    {
        grid-template-columns:
            repeat(
                3,
                minmax(
                    0,
                    1fr
                )
            );
    }
}

@media(
    max-width:
    700px
)
{
    #sidePanel
    {
        display:
            none;
    }

    .brand
    {
        min-width:
            57px;

        width:
            57px;

        padding:
            7px;
    }

    .brand > div:last-child
    {
        display:
            none;
    }

    .resource
    {
        min-width:
            73px;
    }

    #countryList
    {
        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );
    }

    .grid
    {
        grid-template-columns:
            1fr;
    }

    .kpis
    {
        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );
    }

    .start-tools
    {
        grid-template-columns:
            1fr;
    }
}

/* =========================================================

const $=
id=>
document.getElementById(
    id
);

const SVG_NS=
"http://www.w3.org/2000/svg";

const clamp=
(
    value,
    min,
    max
)=>
Math.max(
    min,
    Math.min(
        max,
        Number(
            value
        )||
        0
    )
);

const random=
(
    min,
    max
)=>
Math.random()*
(
    max-
    min
)+
min;

const randomInt=
(
    min,
    max
)=>
Math.floor(
    random(
        min,
        max+
        1
    )
);

const chance=
percentage=>
Math.random()*
100<
clamp(
    percentage,
    0,
    100
);

const pick=
array=>
array[
    Math.floor(
        Math.random()*
        array.length
    )
];

function svgElement(
    tag
)
{
    return document.createElementNS(
        SVG_NS,
        tag
    );
}

function safe(
    value
)
{
    return String(
        value??
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    );
}

function money(
    value
)
{
    const number=
        Number(
            value
        )||
        0;

    if(
        Math.abs(
            number
        )>=
        1e12
    )
    {
        return "$"+
        (
            number/
            1e12
        )
        .toFixed(
            2
        )+
        "T";
    }

    if(
        Math.abs(
            number
        )>=
        1e9
    )
    {
        return "$"+
        (
            number/
            1e9
        )
        .toFixed(
            2
        )+
        "B";
    }

    if(
        Math.abs(
            number
        )>=
        1e6
    )
    {
        return "$"+
        (
            number/
            1e6
        )
        .toFixed(
            1
        )+
        "M";
    }

    if(
        Math.abs(
            number
        )>=
        1e3
    )
    {
        return "$"+
        (
            number/
            1e3
        )
        .toFixed(
            1
        )+
        "K";
    }

    return "$"+
    number
    .toFixed(
        0
    );
}

function shortNumber(
    value,
    digits=
        1
)
{
    const number=
        Number(
            value
        )||
        0;

    if(
        Math.abs(
            number
        )>=
        1e9
    )
    {
        return(
            number/
            1e9
        )
        .toFixed(
            digits
        )+
        "B";
    }

    if(
        Math.abs(
            number
        )>=
        1e6
    )
    {
        return(
            number/
            1e6
        )
        .toFixed(
            digits
        )+
        "M";
    }

    if(
        Math.abs(
            number
        )>=
        1e3
    )
    {
        return(
            number/
            1e3
        )
        .toFixed(
            digits
        )+
        "K";
    }

    return number
    .toFixed(
        digits
    );
}

function percent(
    value
)
{
    return clamp(
        value,
        0,
        100
    )
    .toFixed(
        1
    )+
    "%";
}

function flagEmoji(
    iso2
)
{
    return String(
        iso2
    )
    .toUpperCase()
    .replace(
        /./g,
        character=>
        String.fromCodePoint(
            127397+
            character.charCodeAt(
                0
            )
        )
    );
}

function hashString(
    text
)
{
    let hash=
        2166136261;

    const string=
        String(
            text
        );

    for(
        let index=
            0;
        index<
            string.length;
        index++
    )
    {
        hash^=
            string.charCodeAt(
                index
            );

        hash=
            Math.imul(
                hash,
                16777619
            );
    }

    return hash>>>
    0;
}

function seeded(
    key,
    min,
    max
)
{
    return min+
    (
        hashString(
            key
        )%
        100000
    )/
    100000*
    (
        max-
        min
    );
}

function toast(
    text
)
{
    const element=
        document.createElement(
            "div"
        );

    element.className=
        "toast";

    element.textContent=
        text;

    $("toasts")
    .appendChild(
        element
    );

    setTimeout(
        ()=>
        element.remove(),
        3000
    );
}

function openModal(
    title,
    body
)
{
    $("modalTitle")
    .innerHTML=
        title;

    $("modalBody")
    .innerHTML=
        body;

    $("modal")
    .classList.add(
        "show"
    );
}

function closeModal()
{
    $("modal")
    .classList.remove(
        "show"
    );
}

$("modal")
.addEventListener(
    "click",
    event=>
    {
        if(
            event.target===
            $("modal")
        )
        {
            closeModal();
        }
    }
);

/* =========================================================
   PROJECTION
========================================================= */

function projectCoordinate(
    coordinate
)
{
    let longitude=
        coordinate[
            0
        ];

    const latitude=
        coordinate[
            1
        ];

    if(
        longitude<
        -180
    )
    {
        longitude+=
            360;
    }

    if(
        longitude>
        180
    )
    {
        longitude-=
            360;
    }

    const x=
        (
            longitude+
            180
        )/
        360*
        1600;

    const y=
        (
            90-
            latitude
        )/
        180*
        800;

    return[
        x,
        y
    ];
}

function ringPath(
    ring
)
{
    if(
        !ring||
        ring.length<
        3
    )
    {
        return "";
    }

    let path=
        "";

    let lastX=
        null;

    let segmentStarted=
        false;

    for(
        let index=
            0;
        index<
            ring.length;
        index++
    )
    {
        const projected=
            projectCoordinate(
                ring[
                    index
                ]
            );

        const x=
            projected[
                0
            ];

        const y=
            projected[
                1
            ];

        if(
            lastX!==
            null&&
            Math.abs(
                x-
                lastX
            )>
            700
        )
        {
            path+=
                "Z";

            segmentStarted=
                false;
        }

        if(
            !segmentStarted
        )
        {
            path+=
                `M${x.toFixed(2)},${y.toFixed(2)}`;

            segmentStarted=
                true;
        }
        else
        {
            path+=
                `L${x.toFixed(2)},${y.toFixed(2)}`;
        }

        lastX=
            x;
    }

    path+=
        "Z";

    return path;
}

function geometryPath(
    geometry
)
{
    if(
        !geometry
    )
    {
        return "";
    }

    if(
        geometry.type===
        "Polygon"
    )
    {
        return geometry.coordinates
        .map(
            ringPath
        )
        .join(
            ""
        );
    }

    if(
        geometry.type===
        "MultiPolygon"
    )
    {
        return geometry.coordinates
        .map(
            polygon=>
            polygon
            .map(
                ringPath
            )
            .join(
                ""
            )
        )
        .join(
            ""
        );
    }

    return "";
}

/* =========================================================
   FEATURE COUNTRY CODE
========================================================= */

function featureCountryCode(
    feature
)
{
    const properties=
        feature.properties||
        {};

    const candidates=
    [
        properties.ISO_A2_EH,
        properties.ISO_A2,
        properties.WB_A2,
        properties.POSTAL,
        properties.iso_a2,
        properties.ISO2,
        properties.code,
        properties.COUNTRY
    ];

    for(
        const candidate of
        candidates
    )
    {
        if(
            typeof candidate===
            "string"&&
            /^[A-Z]{2}$/
            .test(
                candidate
                .toUpperCase()
            )
        )
        {
            return candidate
            .toUpperCase();
        }
    }

    const names=
    [
        properties.ADMIN,
        properties.NAME,
        properties.NAME_EN,
        properties.name,
        properties.SOVEREIGNT
    ];

    for(
        const name of
        names
    )
    {
        if(
            NAME_CODE_FIX[
                name
            ]
        )
        {
            return NAME_CODE_FIX[
                name
            ];
        }

        const found=
            COUNTRY_CODES.find(
                code=>
                (
                    COUNTRY_EN[
                        code
                    ]||
                    ""
                )
                .toLowerCase()===
                String(
                    name||
                    ""
                )
                .toLowerCase()
            );

        if(
            found
        )
        {
            return found;
        }
    }

    return null;
}

/* =========================================================
   LOAD REAL MAP
========================================================= */

async function loadRealWorldMap()
{
    $("mapLoadingTitle")
    .textContent=
        "در حال ساخت نقشه واقعی جهان";

    $("mapLoadingText")
    .textContent=
        "مرزهای واقعی کشورها در حال بارگذاری است...";

    try
    {
        const cached=
            localStorage.getItem(
                MAP_CACHE_KEY
            );

        if(
            cached
        )
        {
            const parsed=
                JSON.parse(
                    cached
                );

            if(
                parsed&&
                Array.isArray(
                    parsed.features
                )&&
                parsed.features.length>
                150
            )
            {
                worldGeoJSON=
                    parsed;

                renderRealMap();

                hideMapLoader();

                return;
            }
        }
    }
    catch(
        error
    )
    {
    }

    let lastError=
        null;

    for(
        const url of
        MAP_URLS
    )
    {
        try
        {
            const response=
                await fetch(
                    url,
                    {
                        cache:
                            "force-cache"
                    }
                );

            if(
                !response.ok
            )
            {
                throw new Error(
                    "HTTP "+
                    response.status
                );
            }

            const geoJSON=
                await response.json();

            if(
                !geoJSON||
                !Array.isArray(
                    geoJSON.features
                )||
                geoJSON.features.length<
                150
            )
            {
                throw new Error(
                    "Invalid map"
                );
            }

            worldGeoJSON=
                geoJSON;

            try
            {
                localStorage.setItem(
                    MAP_CACHE_KEY,
                    JSON.stringify(
                        geoJSON
                    )
                );
            }
            catch(
                error
            )
            {
            }

            renderRealMap();

            hideMapLoader();

            return;
        }
        catch(
            error
        )
        {
            lastError=
                error;
        }
    }

    $("mapLoadingTitle")
    .textContent=
        "خطا در بارگذاری نقشه";

    $("mapLoadingText")
    .innerHTML=
        `
        اینترنت را بررسی کن و دوباره صفحه را باز کن.
        <br>
        ${safe(lastError?.message||"")}
        `;
}

function hideMapLoader()
{
    $("mapLoading")
    .classList.add(
        "hidden"
    );

    setTimeout(
        ()=>
        {
            $("mapLoading")
            .style.display=
                "none";
        },
        350
    );
}

/* =========================================================
   REAL MAP RENDER
========================================================= */

const countryElements=
    new Map();

function renderRealMap()
{
    const layer=
        $("countryLayer");

    layer.innerHTML=
        "";

    $("microLayer")
    .innerHTML=
        "";

    countryElements.clear();

    mapFeatureCodes=
        new Set();

    const fragment=
        document.createDocumentFragment();

    for(
        const feature of
        worldGeoJSON.features
    )
    {
        const code=
            featureCountryCode(
                feature
            );

        if(
            !code
        )
        {
            continue;
        }

        const pathData=
            geometryPath(
                feature.geometry
            );

        if(
            !pathData
        )
        {
            continue;
        }

        const path=
            svgElement(
                "path"
            );

        path.setAttribute(
            "d",
            pathData
        );

        path.setAttribute(
            "class",
            "country-shape"
        );

        path.setAttribute(
            "fill-rule",
            "evenodd"
        );

        path.dataset.code=
            code;

        path.addEventListener(
            "click",
            event=>
            {
                event.stopPropagation();

                selectCountry(
                    code
                );
            }
        );

        fragment.appendChild(
            path
        );

        mapFeatureCodes.add(
            code
        );

        if(
            !countryElements.has(
                code
            )
        )
        {
            countryElements.set(
                code,
                []
            );
        }

        countryElements
        .get(
            code
        )
        .push(
            path
        );
    }

    layer.appendChild(
        fragment
    );

    renderMicroCountries();

    updateMapStyles();
}

/* =========================================================
   MICRO COUNTRIES
========================================================= */

function renderMicroCountries()
{
    const layer=
        $("microLayer");

    for(
        const[
            code,
            coordinate
        ]of
        Object.entries(
            MICRO_COUNTRIES
        )
    )
    {
        if(
            mapFeatureCodes.has(
                code
            )
        )
        {
            continue;
        }

        const point=
            projectCoordinate(
                coordinate
            );

        const circle=
            svgElement(
                "circle"
            );

        circle.setAttribute(
            "cx",
            point[
                0
            ]
        );

        circle.setAttribute(
            "cy",
            point[
                1
            ]
        );

        circle.setAttribute(
            "r",
            3.4
        );

        circle.setAttribute(
            "class",
            "micro-country"
        );

        circle.dataset.code=
            code;

        circle.addEventListener(
            "click",
            event=>
            {
                event.stopPropagation();

                selectCountry(
                    code
                );
            }
        );

        layer.appendChild(
            circle
        );

        countryElements.set(
            code,
            [
                circle
            ]
        );
    }
}

/* =========================================================
   REAL COUNTRY CENTERS
========================================================= */

function featureCenter(
    feature
)
{
    const points=
        [];

    function collect(
        coordinates
    )
    {
        if(
            !Array.isArray(
                coordinates
            )
        )
        {
            return;
        }

        if(
            typeof coordinates[
                0
            ]===
            "number"
        )
        {
            points.push(
                coordinates
            );

            return;
        }

        for(
            const child of
            coordinates
        )
        {
            collect(
                child
            );
        }
    }

    collect(
        feature.geometry?.coordinates
    );

    if(
        !points.length
    )
    {
        return[
            800,
            400
        ];
    }

    let x=
        0;

    let y=
        0;

    let count=
        0;

    for(
        let index=
            0;
        index<
            points.length;
        index+=
            Math.max(
                1,
                Math.floor(
                    points.length/
                    250
                )
            )
    )
    {
        const projected=
            projectCoordinate(
                points[
                    index
                ]
            );

        x+=
            projected[
                0
            ];

        y+=
            projected[
                1
            ];

        count++;
    }

    return[
        x/
        count,
        y/
        count
    ];
}

const mapCenters=
    {};

function buildMapCenters()
{
    if(
        !worldGeoJSON
    )
    {
        return;
    }

    for(
        const feature of
        worldGeoJSON.features
    )
    {
        const code=
            featureCountryCode(
                feature
            );

        if(
            !code
        )
        {
            continue;
        }

        if(
            !mapCenters[
                code
            ]
        )
        {
            mapCenters[
                code
            ]=
                featureCenter(
                    feature
                );
        }
    }

    for(
        const[
            code,
            coordinate
        ]of
        Object.entries(
            MICRO_COUNTRIES
        )
    )
    {
        if(
            !mapCenters[
                code
            ]
        )
        {
            mapCenters[
                code
            ]=
                projectCoordinate(
                    coordinate
                );
        }
    }
}

function countryProfile(
    code
)
{
    if(
        MAJOR_PROFILES[
            code
        ]
    )
    {
        return{
            ...MAJOR_PROFILES[
                code
            ]
        };
    }

    const population=
        seeded(
            code+
            "-population",
            .2,
            115
        );

    const industry=
        seeded(
            code+
            "-industry",
            27,
            84
        );

    const technology=
        seeded(
            code+
            "-technology",
            28,
            88
        );

    const military=
        seeded(
            code+
            "-military",
            25,
            82
        );

    const gdp=
        Math.max(
            3000,
            population*
            industry*
            seeded(
                code+
                "-gdp",
                90,
                460
            )
        );

    const oil=
        seeded(
            code+
            "-oil",
            25,
            125
        );

    return{
        population,
        industry,
        technology,
        military,
        gdp,
        oil
    };
}

/* =========================================================
   RELATIONS
========================================================= */

function relation(
    code
)
{
    if(
        !Number.isFinite(
            Number(
                state.relations[
                    code
                ]
            )
        )
    )
    {
        state.relations[
            code
        ]=
            randomInt(
                -10,
                25
            );
    }

    return Number(
        state.relations[
            code
        ]
    );
}

function setRelation(
    code,
    value
)
{
    state.relations[
        code
    ]=
        clamp(
            value,
            -100,
            100
        );
}

function changeRelation(
    code,
    amount
)
{
    setRelation(
        code,
        relation(
            code
        )+
        amount
    );
}

function isAlly(
    code
)
{
    return state.alliances.some(
        item=>
        item.code===
        code
    );
}

function hasTrade(
    code
)
{
    return state.tradeAgreements.some(
        item=>
        item.code===
        code
    );
}

function hasNonAggression(
    code
)
{
    return state.nonAggression.some(
        item=>
        item.code===
        code
    );
}

function isSanctioned(
    code
)
{
    return state.sanctions.some(
        item=>
        item.code===
        code
    );
}

function playerWarAgainst(
    code
)
{
    return state.wars.find(
        war=>
        war.status===
        "active"&&
        (
            (
                war.attacker===
                state.player&&
                war.defender===
                code
            )||
            (
                war.defender===
                state.player&&
                war.attacker===
                code
            )
        )
    )||
    null;
}

/* =========================================================
   MAP COLOR MODES
========================================================= */

function countryFill(
    code
)
{
    if(
        !state.started||
        state.map.mode===
        "political"
    )
    {
        if(
            code===
            state.player
        )
        {
            return "#1ea57d";
        }

        return politicalColor(
            code
        );
    }

    if(
        state.map.mode===
        "economy"
    )
    {
        const value=
            code===
            state.player
            ?
            state.nation.industry
            :
            state.ai[
                code
            ]?.
            economy||
            45;

        const light=
            clamp(
                20+
                value*
                .42,
                20,
                64
            );

        return `hsl(145 54% ${light}%)`;
    }

    if(
        state.map.mode===
        "military"
    )
    {
        const value=
            code===
            state.player
            ?
            calculateMilitaryPower()
            :
            state.ai[
                code
            ]?.
            military||
            45;

        const light=
            clamp(
                22+
                value*
                .29,
                22,
                58
            );

        return `hsl(352 60% ${light}%)`;
    }

    if(
        state.map.mode===
        "diplomacy"
    )
    {
        if(
            code===
            state.player
        )
        {
            return "#27c998";
        }

        const value=
            relation(
                code
            );

        if(
            value>
            60
        )
        {
            return "#408fd0";
        }

        if(
            value>
            20
        )
        {
            return "#478b77";
        }

        if(
            value>
            -20
        )
        {
            return "#6d7881";
        }

        if(
            value>
            -60
        )
        {
            return "#966253";
        }

        return "#ae394c";
    }

    return politicalColor(
        code
    );
}

function updateMapStyles()
{
    countryElements.forEach(
        (
            elements,
            code
        )=>
        {
            for(
                const element of
                elements
            )
            {
                element.setAttribute(
                    "fill",
                    countryFill(
                        code
                    )
                );

                element.classList.toggle(
                    "player",
                    code===
                    state.player
                );

                element.classList.toggle(
                    "selected",
                    code===
                    state.selected
                );

                element.classList.toggle(
                    "enemy",
                    !!playerWarAgainst(
                        code
                    )
                );

                element.classList.toggle(
                    "ally",
                    isAlly(
                        code
                    )
                );

                element.classList.toggle(
                    "sanctioned",
                    isSanctioned(
                        code
                    )
                );
            }
        }
    );

    renderRoutes();
}

========================================================= */

let dragging=
    false;

let dragX=
    0;

let dragY=
    0;

function applyMapTransform()
{
    $("camera")
    .setAttribute(
        "transform",
        `translate(${state.map.x} ${state.map.y}) scale(${state.map.zoom})`
    );
}

function zoomMap(
    multiplier
)
{
    state.map.zoom=
        clamp(
            state.map.zoom*
            multiplier,
            .65,
            5
        );

    applyMapTransform();
}

function resetMap()
{
    state.map.zoom=
        1;

    state.map.x=
        0;

    state.map.y=
        0;

    applyMapTransform();
}

$("worldSvg")
.addEventListener(
    "pointerdown",
    event=>
    {
        dragging=
            true;

        dragX=
            event.clientX;

        dragY=
            event.clientY;
    }
);

$("worldSvg")
.addEventListener(
    "pointermove",
    event=>
    {
        if(
            !dragging
        )
        {
            return;
        }

        state.map.x+=
            (
                event.clientX-
                dragX
            )*
            1600/
            $("worldSvg")
            .clientWidth;

        state.map.y+=
            (
                event.clientY-
                dragY
            )*
            800/
            $("worldSvg")
            .clientHeight;

        dragX=
            event.clientX;

        dragY=
            event.clientY;

        applyMapTransform();
    }
);

$("worldSvg")
.addEventListener(
    "pointerup",
    ()=>
    {
        dragging=
            false;
    }
);

$("worldSvg")
.addEventListener(
    "pointercancel",
    ()=>
    {
        dragging=
            false;
    }
);

$("worldSvg")
.addEventListener(
    "wheel",
    event=>
    {
        event.preventDefault();

        zoomMap(
            event.deltaY<
            0
            ?
            1.12
            :
            .89
        );
    },
    {
        passive:false
    }
);

/* =========================================================
   ECONOMY CORE
========================================================= */

function calculateGDP()
{
    let gdp=
        state.society.population*
        (
            state.nation.industry*
            610+
            state.nation.technology*
            310
        );

    gdp*=
        1+
        (
            state.buildings.civilFactory||
            0
        )*
        .028;

    gdp*=
        1+
        (
            state.buildings.port||
            0
        )*
        .012;

    gdp*=
        1-
        state.economy.unemployment/
        170;

    gdp*=
        1-
        Math.max(
            0,
            state.economy.inflation-
            10
        )/
        500;

    return Math.max(
        1000,
        gdp
    );
}

function calculateGrowth()
{
    let growth=
        2.4;

    growth+=
        (
            state.nation.industry-
            50
        )*
        .032;

    growth+=
        (
            state.nation.technology-
            50
        )*
        .023;

    growth+=
        (
            state.economy.consumerConfidence-
            50
        )*
        .026;

    growth+=
        (
            state.nation.trade-
            50
        )*
        .012;

    growth-=
        state.economy.inflation*
        .085;

    growth-=
        state.economy.unemployment*
        .06;

    growth-=
        state.government.corruption*
        .03;

    growth-=
        state.military.warExhaustion*
        .018;

    if(
        state.resources.energy<
        25
    )
    {
        growth-=
            2.5;
    }

    if(
        state.resources.food<
        20
    )
    {
        growth-=
            2;
    }

    return clamp(
        growth,
        -18,
        18
    );
}

function calculateDailyRevenue()
{
    const tax=
        calculateGDP()*
        state.economy.taxRate/
        100*
        .00075;

    const trade=
        state.tradeAgreements.length*
        (
            8+
            state.nation.trade*
            .08
        );

    const ports=
        (
            state.buildings.port||
            0
        )*
        5;

    return tax+
    trade+
    ports;
}

function calculateMaintenance()
{
    return EQUIPMENT.reduce(
        (
            total,
            equipment
        )=>
        total+
        (
            state.inventory[
                equipment.id
            ]||
            0
        )*
        equipment.maintenance*
        .06,
        0
    );
}

function calculateDailyExpenses()
{
    const populationCost=
        state.society.population*
        (
            state.government.laws.welfare===
            "high"
            ?
            .42
            :
            state.government.laws.welfare===
            "low"
            ?
            .12
            :
            .25
        );

    const military=
        calculateMaintenance()*
        (
            state.government.laws.militaryBudget===
            "high"
            ?
            1.35
            :
            state.government.laws.militaryBudget===
            "low"
            ?
            .75
            :
            1
        );

    const debt=
        state.economy.debt*
        state.economy.interestRate/
        100/
        365;

    return populationCost+
    military+
    debt+
    state.construction.length*
    2+
    state.production.length*
    2;
}

/* =========================================================
   MILITARY POWER
========================================================= */

function equipmentPower()
{
    return EQUIPMENT.reduce(
        (
            total,
            equipment
        )=>
        total+
        (
            state.inventory[
                equipment.id
            ]||
            0
        )*
        equipment.power,
        0
    );
}

function calculateMilitaryPower()
{
    return(
        state.military.basePower+
        equipmentPower()*
        .025+
        state.military.readiness*
        .15+
        state.military.morale*
        .08+
        state.nation.technology*
        .08
    );
}

function resourcePrice(
    id
)
{
    const base=
    {
        food:32,
        energy:50,
        oil:72,
        steel:66,
        electronics:95
    }[
        id
    ];

    const shortage=
        Math.max(
            0,
            50-
            state.resources[
                id
            ]
        );

    return base+
    state.economy.inflation*
    .7+
    shortage*
    .25+
    state.wars.filter(
        war=>
        war.status===
        "active"
    ).length*
    4;
}

function buyResource(
    id,
    amount
)
{
    const cost=
        resourcePrice(
            id
        )*
        amount;

    if(
        state.economy.money<
        cost
    )
    {
        toast(
            "بودجه کافی نیست"
        );

        return;
    }

    state.economy.money-=
        cost;

    state.resources[
        id
    ]+=
        amount;

    state.economy.imports+=
        cost;

    state.economy.inflation+=
        amount*
        .001;

    saveGame();

    renderAll();

    openEconomy(
        "resources"
    );
}

function sellResource(
    id,
    amount
)
{
    if(
        state.resources[
            id
        ]<
        amount
    )
    {
        toast(
            "موجودی کافی نیست"
        );

        return;
    }

    const revenue=
        resourcePrice(
            id
        )*
        amount*
        .90;

    state.resources[
        id
    ]-=
        amount;

    state.economy.money+=
        revenue;

    state.economy.exports+=
        revenue;

    saveGame();

    renderAll();

    openEconomy(
        "resources"
    );
}

function changeTax(
    amount
)
{
    const old=
        state.economy.taxRate;

    state.economy.taxRate=
        clamp(
            old+
            amount,
            0,
            50
        );

    const difference=
        state.economy.taxRate-
        old;

    state.society.approval=
        clamp(
            state.society.approval-
            difference*
            .5,
            0,
            100
        );

    state.economy.consumerConfidence=
        clamp(
            state.economy.consumerConfidence-
            difference*
            .35,
            0,
            100
        );

    saveGame();

    renderAll();

    openEconomy(
        "budget"
    );
}

function changeInterest(
    amount
)
{
    state.economy.interestRate=
        clamp(
            state.economy.interestRate+
            amount,
            0,
            35
        );

    if(
        amount>
        0
    )
    {
        state.economy.inflation=
            Math.max(
                -2,
                state.economy.inflation-
                amount*
                .28
            );

        state.economy.consumerConfidence=
            clamp(
                state.economy.consumerConfidence-
                amount*
                .5,
                0,
                100
            );
    }
    else
    {
        state.economy.consumerConfidence=
            clamp(
                state.economy.consumerConfidence+
                Math.abs(
                    amount
                )*
                .5,
                0,
                100
            );

        state.economy.inflation+=
            Math.abs(
                amount
            )*
            .18;
    }

    saveGame();

    renderAll();

    openEconomy(
        "inflation"
    );
}

function takeLoan(
    amount
)
{
    state.economy.money+=
        amount;

    state.economy.debt+=
        amount;

    state.economy.inflation+=
        amount/
        Math.max(
            calculateGDP(),
            10000
        )*
        12;

    toast(
        "وام دریافت شد"
    );

    saveGame();

    renderAll();

    openEconomy(
        "bank"
    );
}

function repayLoan(
    amount
)
{
    amount=
        Math.min(
            amount,
            state.economy.money,
            state.economy.debt
        );

    if(
        amount<=
        0
    )
    {
        return;
    }

    state.economy.money-=
        amount;

    state.economy.debt-=
        amount;

    toast(
        "بدهی کاهش یافت"
    );

    saveGame();

    renderAll();

    openEconomy(
        "bank"
    );
}

function startConstruction(
    buildingId
)
{
    const building=
        BUILDINGS.find(
            item=>
            item.id===
            buildingId
        );

    if(
        !building
    )
    {
        return;
    }

    const level=
        state.buildings[
            buildingId
        ]||
        0;

    if(
        level>=
        building.max
    )
    {
        return;
    }

    if(
        state.construction.some(
            project=>
            project.buildingId===
            buildingId
        )
    )
    {
        toast(
            "این پروژه در حال ساخت است"
        );

        return;
    }

    const cost=
        Math.round(
            building.cost*
            Math.pow(
                1.16,
                level
            )
        );

    if(
        state.economy.money<
        cost
    )
    {
        toast(
            "بودجه کافی نیست"
        );

        return;
    }

    state.economy.money-=
        cost;

    let days=
        building.days*
        (
            1-
            Math.min(
                .30,
                state.nation.logistics/
                350
            )
        );

    days=
        Math.max(
            3,
            Math.ceil(
                days
            )
        );

    state.construction.push(
        {
            id:
                "BUILD-"+
                Date.now()+
                "-"+
                buildingId,

            buildingId,

            targetLevel:
                level+
                1,

            totalDays:
                days,

            daysLeft:
                days
        }
    );

    addNews(
        "🏗️ پروژه جدید",
        `${building.name} وارد صف ساخت شد.`
    );

    saveGame();

    renderAll();

    openInfrastructure(
        currentInfrastructureCategory
    );
}

            effects.trade;

    if(

        state.nation.logistics+=

    if(

        state.society.education+=

    if(

        effects.stability
    )

        state.society.stability=
            clamp(
                state.society.stability+
                effects.stability,
                0,
                100
            );
    }

    if(
        effects.poverty
    )
    {
        state.society.poverty=
            clamp(
                state.society.poverty+
                effects.poverty,
                0,
                100
            );
    }

    if(
        effects.crime
    )
    {
        state.society.crime=
            clamp(
                state.society.crime+
                effects.crime,
                0,
                100
            );
    }

    if(
        effects.readiness
    )
    {
        state.military.readiness=

                0,

function buyEquipment(
    equipmentId,
    amount=
        1
)
{
    const equipment=
        EQUIPMENT.find(
            item=>
            item.id===
            equipmentId
        );

    if(
        !equipment
    )
    {
        return;
    }

    if(
        state.nation.technology<
        equipment.tech
    )
    {
        toast(
            "فناوری کافی نیست"
        );

        return;
    }

    const totalCost=
        equipment.cost*
        amount;

    const steel=
        equipment.steel*
        amount;

    const oil=
        equipment.oil*
        amount;

    const electronics=
        equipment.electronics*
        amount;

    const manpower=
        equipment.manpower*
        amount;

    if(
        state.economy.money<
        totalCost
    )
    {
        toast(
            "بودجه کافی نیست"
        );

        return;
    }

    if(
        state.resources.steel<
        steel
    )
    {
        toast(
            "فولاد کافی نیست"
        );

        return;
    }

    if(
        state.resources.oil<
        oil
    )
    {
        toast(
            "نفت کافی نیست"
        );

        return;
    }

    if(
        state.resources.electronics<
        electronics
    )
    {
        toast(
            "قطعات الکترونیکی کافی نیست"
        );

        return;
    }

    if(
        state.society.manpower<
        manpower
    )
    {
        toast(
            "نیروی انسانی کافی نیست"
        );

        return;
    }

    state.economy.money-=
        totalCost;

    state.resources.steel-=
        steel;

    state.resources.oil-=
        oil;

    state.resources.electronics-=
        electronics;

    state.society.manpower-=
        manpower;

    state.inventory[
        equipmentId
    ]=
        (
            state.inventory[
                equipmentId
            ]||
            0
        )+
        amount;

    state.military.basePower+=
        equipment.power*
        amount*
        .006;

    addNews(
        "🏪 خرید نظامی",
        `${amount} واحد ${equipment.name} خریداری شد.`
    );

    toast(
        "خرید انجام شد"
    );

    saveGame();

    renderAll();

    openStore(
        currentStoreCategory
    );
}

function sellEquipment(
    equipmentId,
    amount=
        1
)
{
    const equipment=

function requiredFactory(
    equipment
)
{
    if(
        equipment.category===
        "ground"||
        equipment.category===
        "artillery"||
        equipment.category===
        "defense"
    )
    {
        return "groundFactory";
    }

    if(
        equipment.category===
        "air"||
        equipment.category===
        "bomber"||
        equipment.category===
        "drone"||
        equipment.category===
        "helicopter"||
        equipment.category===
        "support"
    )
    {
        return "airFactory";
    }

    if(
        equipment.category===
        "missile"
    )
    {
        return "missileFactory";
    }

    return "navalYard";
}

function produceEquipment(
    equipmentId,
    amount=
        1
)
{
    const equipment=
        EQUIPMENT.find(
            item=>
            item.id===
            equipmentId
        );

    if(
        !equipment
    )
    {
        return;
    }

    const factory=
        requiredFactory(
            equipment
        );

    const factoryLevel=
        state.buildings[
            factory
        ]||
        0;

    if(
        factoryLevel<=
        0
    )
    {
        toast(
            "کارخانه مناسب ساخته نشده"
        );

        return;
    }

    if(
        state.nation.technology<
        equipment.tech
    )
    {
        toast(
            "فناوری کافی نیست"
        );

        return;
    }

    const moneyCost=
        equipment.cost*
        .42*
        amount;

    const steel=
        equipment.steel*
        amount;

    const oil=
        equipment.oil*
        amount;

    const electronics=
        equipment.electronics*
        amount;

    if(
        state.economy.money<
        moneyCost||
        state.resources.steel<
        steel||
        state.resources.oil<
        oil||
        state.resources.electronics<
        electronics
    )
    {
        toast(
            "مواد اولیه کافی نیست"
        );

        return;
    }

    state.economy.money-=
        moneyCost;

    state.resources.steel-=
        steel;

    state.resources.oil-=
        oil;

    state.resources.electronics-=
        electronics;

    const days=
        Math.max(
            4,
            Math.ceil(
                (
                    10+
                    equipment.tech*
                    .22
                )/
                (
                    1+
                    factoryLevel*
                    .35+
                    state.nation.industry/
                    250
                )
            )
        );

    state.production.push(
        {
            id:
                "PROD-"+
                Date.now(),

            equipmentId,

            amount,

            totalDays:
                days,

            daysLeft:
                days
        }
    );

    toast(
        "تولید آغاز شد"
    );

    saveGame();

    openArmy(
        "production"
    );
}

function proposeTrade(
    code
)
{
    if(
        hasTrade(
            code
        )
    )
    {
        toast(
            "قرارداد تجاری فعال است"
        );

        return;
    }

    const acceptance=
        relation(
            code
        )+
        state.nation.reputation*
        .4+
        (
            state.ai[
                code
            ]?.
            tradeInterest||
            40
        )*
        .4;

    if(
        acceptance>
        45||
        chance(
            20
        )
    )
    {
        state.tradeAgreements.push(
            {
                code,

                days:
                    360,

                income:
                    Math.round(
                        10+
                        (
                            state.ai[
                                code
                            ]?.
                            economy||
                            50
                        )*
                        .25
                    )
            }
        );

        changeRelation(
            code,
            7
        );

        toast(
            "قرارداد تجاری پذیرفته شد"
        );
    }
    else
    {
        changeRelation(
            code,
            -1

    saveGame();

    renderAll();

    proposal.id=

            Math.random()
            .toString(

    if(
        state.inbox.length>

    }

    toast(
        "🤖 پیام جدید از "+

            proposal.from

function relativePowerAI(
    code
)
{
    const ai=
        state.ai[
            code
        ];

    if(
        !ai
    )
    {
        return 1;
    }

    const aiPower=
        ai.military*
        (
            .65+
            ai.readiness/
            180
        );

    return aiPower/
    Math.max(
        1,
        calculateMilitaryPower()
    );
}

    const candidates=

            code=>

        );

    const attempts=
        state.difficulty===
        "expert"
        ?
        6
        :
        state.difficulty===
        "hard"
        ?
        5
        :
        3;

    for(
        let index=
            0;
        index<
            attempts;
        index++
    )
    {
        const code=
            pick(
                candidates
            );

        const ai=
            state.ai[
                code
            ];

        if(
            !ai
        )
        {
            continue;
        }

        if(
            chance(
                2.5+
                ai.tradeInterest*
                .012
            )&&
            !hasTrade(
                code
            )
        )
        {
            const score=
                ai.tradeInterest*
                .55+
                relation(
                    code
                )*
                .35;

            if(
                score>
                45
            )
            {
                pushAIProposal(
                    {
                        from:
                            code,

                        type:
                            "trade",

                        title:
                            "پیشنهاد قرارداد تجاری",

                        text:
                            `${countryName(code)} پیشنهاد همکاری تجاری داده است.`,

                        value:
                            Math.round(
                                15+
                                ai.economy*
                                .25
                            )
                    }
                );

                continue;
            }
        }

        if(
            chance(
                1.6
            )&&
            !isAlly(
                code
            )
        )
        {
            const score=
                ai.allianceInterest*
                .50+
                relation(
                    code
                )*
                .45;

            if(
                score>
                65
            )
            {
                pushAIProposal(
                    {
                        from:
                            code,

                        type:
                            "alliance",

                        title:
                            "پیشنهاد اتحاد",

                        text:
                            `${countryName(code)} خواهان ایجاد یک اتحاد سیاسی ـ دفاعی است.`
                    }
                );

                continue;
            }
        }

        if(
            chance(
                1.3
            )&&
            !hasNonAggression(
                code
            )
        )
        {
            if(
                relation(
                    code
                )>
                15||
                relativePowerAI(
                    code
                )<
                .85
            )
            {
                pushAIProposal(
                    {
                        from:
                            code,

                        type:
                            "nonAggression",

                        title:
                            "پیمان عدم تعرض",

                        text:
                            `${countryName(code)} پیشنهاد پیمان عدم تعرض داده است.`
                    }
                );

                continue;
            }
        }

        if(
            chance(
                .8
            )&&
            relation(
                code
            )>
            45
        )
        {
            pushAIProposal(
                {
                    from:
                        code,

                    type:
                        "aid",

                    title:
                        "کمک اقتصادی",

                    text:
                        `${countryName(code)} پیشنهاد کمک اقتصادی داده است.`,

                    value:
                        randomInt(
                            500,
                            2200
                        )
                }
            );

            continue;
        }

        if(
            chance(
                .8
            )&&
            relation(
                code
            )<
            -40
        )
        {
            pushAIProposal(
                {
                    from:
                        code,

                    type:
                        "warning",

                    title:
                        "هشدار دیپلماتیک",

                    text:
                        `${countryName(code)} خواستار کاهش تنش شده است.`
                }
            );
        }
    }
}

function respondProposal(
    id,
    accept
)
{
    const proposal=
        state.inbox.find(
            item=>
            item.id===
            id
        );

    if(
        !proposal||
        proposal.status!==
        "pending"
    )
    {
        return;
    }

    proposal.status=
        accept
        ?
        "accepted"
        :
        "rejected";

    if(
        accept
    )
    {
        if(
            proposal.type===
            "trade"&&
            !hasTrade(
                proposal.from
            )
        )
        {
            state.tradeAgreements.push(
                {
                    code:
                        proposal.from,

                    days:
                        360,

                    income:
                        proposal.value||
                        20
                }
            );

            changeRelation(
                proposal.from,
                8
            );
        }

        if(
            proposal.type===
            "alliance"&&
            !isAlly(
                proposal.from
            )
        )
        {
            state.alliances.push(
                {
                    code:
                        proposal.from
                }
            );

            changeRelation(
                proposal.from,
                15
            );
        }

        if(
            proposal.type===
            "nonAggression"&&
            !hasNonAggression(
                proposal.from
            )
        )
        {
            state.nonAggression.push(
                {
                    code:
                        proposal.from,

                    days:
                        720
                }
            );

            changeRelation(
                proposal.from,
                10
            );
        }

        if(
            proposal.type===
            "aid"
        )
        {
            state.economy.money+=
                proposal.value||
                1000;

            changeRelation(
                proposal.from,
                6
            );
        }

        if(
            proposal.type===
            "warning"
        )
        {
            changeRelation(
                proposal.from,
                8
            );
        }

        toast(
            "پیشنهاد پذیرفته شد"
        );
    }
    else
    {
        changeRelation(
            proposal.from,
            -4
        );

        toast(
            "پیشنهاد رد شد"
        );
    }

    saveGame();

    renderAll();

    openAIInbox();
}

/* =========================================================
   WAR ENGINE
========================================================= */

function activeWarBetween(
    a,
    b
)
{
    return state.wars.some(
        war=>
        war.status===
        "active"&&
        (
            (
                war.attacker===
                a&&
                war.defender===
                b
            )||
            (
                war.attacker===
                b&&
                war.defender===
                a
            )
        )
    );
}

function countryWarPower(
    code
)
{
    if(
        code===
        state.player
    )
    {
        return calculateMilitaryPower()*
        (
            .55+
            state.military.readiness/
            150
        );
    }

    const ai=
        state.ai[
            code
        ];

    if(
        !ai
    )
    {
        return 50;
    }

    return ai.military*
    (
        .55+
        ai.readiness/
        150
    )*
    (
        .85+
        ai.technology/
        400
    );
}

function aiWarScore(
    attacker,
    defender
)
{
    const ai=
        state.ai[
            attacker
        ];

    if(
        !ai
    )
    {
        return -999;
    }

    let score=
        ai.aggression*
        .65+
        ai.risk*
        .35;

    if(
        defender===
        state.player
    )
    {
        score-=
            relation(
                attacker
            )*
            .45;

        score+=
            (
                relativePowerAI(
                    attacker
                )-
                1
            )*
            40;

        if(
            isAlly(
                attacker
            )
        )
        {
            score-=
                100;
        }

        if(
            hasNonAggression(
                attacker
            )
        )
        {
            score-=
                80;
        }
    }
    else
    {
        const target=
            state.ai[
                defender
            ];

        if(
            target
        )
        {
            score+=
                (
                    ai.military-
                    target.military
                )*
                .28;

            score+=
                (
                    ai.economy-
                    target.economy
                )*
                .08;
        }
    }

    score-=
        ai.warWeariness*
        .6;

    return score;
}

function startWar(
    attacker,
    defender,
    type=
        "limited",
    aiStarted=
        false
)
{
    if(
        activeWarBetween(
            attacker,
            defender
        )
    )
    {
        return;
    }

    const warType=
        WAR_TYPES.find(
            item=>
            item.id===
            type
        )||
        WAR_TYPES[
            1
        ];

    state.wars.push(
        {
            id:
                "WAR-"+
                Date.now()+
                "-"+
                Math.random()
                .toString(
                    36
                )
                .slice(
                    2
                ),

            attacker,

            defender,

            type:
                warType.id,

            intensity:
                warType.intensity,

            attackerScore:
                0,

            defenderScore:
                0,

            days:
                0,

            status:
                "active"
        }
    );

    if(
        attacker===
        state.player||
        defender===
        state.player
    )
    {
        state.military.warExhaustion=
            clamp(
                state.military.warExhaustion+
                2,
                0,
                100
            );

        toast(
            "⚔️ کشور وارد جنگ شد"
        );
    }

    addNews(
        "⚔️ جنگ جدید",
        `${countryName(attacker)} و ${countryName(defender)} وارد ${warType.name} شدند.`
    );

    if(
        aiStarted&&
        defender===
        state.player
    )
    {
        pushAIProposal(
            {
                from:
                    attacker,

                type:
                    "war",

                title:
                    "آغاز جنگ",

                text:
                    `${countryName(attacker)} وارد جنگ با کشور شما شده است.`
            }
        );
    }

    updateMapStyles();
}
