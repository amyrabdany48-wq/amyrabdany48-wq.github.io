){

    const state =
        S.factions[
            faction.id
        ];

    if(
        !state
    )
        return faction.color;

    if(
        currentMapMode===
        "economy"
    ){

        const value=
            clamp(
                state.economy,
                20,
                140
            );

        return `hsl(
            ${210-value},
            72%,
            44%
        )`;

    }

    if(
        currentMapMode===
        "military"
    ){

        const value=
            clamp(
                state.military,
                20,
                160
            );

        return `hsl(
            ${125-value*.65},
            76%,
            45%
        )`;

    }

    if(
        currentMapMode===
        "unrest"
    ){

        const value=
            clamp(
                state.unrest||
                0,
                0,
                100
            );

        return `hsl(
            ${120-value*1.15},
            75%,
            45%
        )`;

    }

    if(
        currentMapMode===
        "technology"
    ){

        const value=
            clamp(
                state.technology,
                0,
                160
            );

        return `hsl(
            ${280-value*.7},
            70%,
            48%
        )`;

    }

    return faction.color;

}

function drawFactionNodes(
    ctx
){

    FACTIONS.forEach(
        faction=>{

            const state=
                S.factions[
                    faction.id
                ];

            if(
                !state
            )
                return;

            const radius=
                42+
                faction.population*
                .13;

            const color=
                factionMapColor(
                    faction
                );

            ctx.save();

            ctx.beginPath();

            ctx.arc(
                state.x,
                state.y,
                radius+8,
                0,
                Math.PI*2
            );

            ctx.fillStyle=
                color+
                "18";

            ctx.fill();

            ctx.beginPath();

            ctx.arc(
                state.x,
                state.y,
                radius,
                0,
                Math.PI*2
            );

            ctx.fillStyle=
                color+
                "bb";

            ctx.fill();

            ctx.lineWidth=
                faction.id===
                S.player
                ?
                4
                :
                2;

            ctx.strokeStyle=
                faction.id===
                S.player
                ?
                "#ffffff"
                :
                "rgba(255,255,255,.52)";

            ctx.stroke();

            ctx.textAlign=
                "center";

            ctx.fillStyle=
                "#ffffff";

            ctx.font=
                "bold 12px Tahoma";

            ctx.fillText(
                faction.flag+
                " "+
                faction.name,
                state.x,
                state.y
            );

            ctx.font=
                "9px Tahoma";

            ctx.fillStyle=
                "rgba(255,255,255,.72)";

            let secondary=
                "";

            if(
                currentMapMode===
                "economy"
            )
                secondary=
                    "اقتصاد "+
                    Math.round(
                        state.economy
                    );

            else if(
                currentMapMode===
                "military"
            )
                secondary=
                    "ارتش "+
                    Math.round(
                        state.military
                    );

            else if(
                currentMapMode===
                "unrest"
            )
                secondary=
                    "ناآرامی "+
                    Math.round(
                        state.unrest||
                        0
                    )+
                    "%";

            else if(
                currentMapMode===
                "technology"
            )
                secondary=
                    "فناوری "+
                    Math.round(
                        state.technology
                    );

            else
                secondary=
                    "قدرت "+
                    Math.round(
                        state.economy+
                        state.military+
                        state.technology
                    );

            ctx.fillText(
                secondary,
                state.x,
                state.y+18
            );

            ctx.restore();

        }
    );

}

function drawMilitaryFronts(
    ctx
){

    if(
        !S.wars
    )
        return;

    S.wars
    .filter(
        war=>
            war.status===
            "war"
    )
    .forEach(
        war=>{

            const a=
                S.factions[
                    S.player
                ];

            const b=
                S.factions[
                    war.enemy
                ];

            if(
                !a||
                !b
            )
                return;

            ctx.save();

            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                b.x,
                b.y
            );

            ctx.strokeStyle=
                "rgba(255,75,100,.82)";

            ctx.lineWidth=
                3;

            ctx.setLineDash(
                [
                    8,
                    7
                ]
            );

            ctx.stroke();

            ctx.setLineDash([]);

            ctx.restore();

        }
    );

}

                event.clientY-
                rect.top;

            let target=
                null;

            let distance=
                Infinity;

            FACTIONS.forEach(
                faction=>{

                    const state=
                        S.factions[

                    if(
                        !state

                        return;

                    const d=
                        Math.hypot(
                            x-state.x,
                            y-state.y
                        );

                    if(
                        d<distance
                    ){

                        distance=
                            d;

                        target=
                            faction.id;

                    }

                }
            );

            if(
                target&&
                distance<
                120
            ){

                openFactionProfile(
                    target
                );

            }

        }
    );

}

function refreshWorldRank(){

    setupFactions();

    const sorted =
        FACTIONS
        .slice()
        .sort(
            (
                a,
                b
            )=>{

                const aa=
                    S.factions[a.id];

                const bb=
                    S.factions[b.id];

                return(
                    bb.economy+
                    bb.military+
                    bb.technology
                )-
                (
                    aa.economy+
                    aa.military+
                    aa.technology
                );

            }
        );

    $("worldRanks")
        .innerHTML=
        sorted
        .map(
            (
                f,
                index
            )=>{

                const state=
                    S.factions[
                        f.id
                    ];

                return`

                    <div

function buildIndustry(
    id
){

    const industry =
        INDUSTRIES.find(
            x=>
                x.id===
                id
        );

    if(
        !industry
    )
        return;

    const level =
        S.industries[
            id
        ]||
        0;

    const cost =
        Math.round(
            industry.cost*
            Math.pow(
                1.28,
                level
            )
        );

    if(
        S.money<
        cost
    ){

        toast(
            "💰 بودجه کافی نیست"
        );

        return;

    }

    S.money-=
        cost;

    S.industries[id]=
        level+
        1;

    S.industry+=
        industry.output*
        .32;

    S.economy+=
        (
            industry.economy||
            0
        )*
        .3;

    S.military+=
        (
            industry.military||
            0
        )*
        .3;

    S.technology+=
        (
            industry.technology||
            0
        )*
        .22;

    S.research+=
        (
            industry.research||
            0
        )*
        .3;

    S.influence+=
        (
            industry.influence||
            0
        )*
        .2;

    S.stability+=
        (
            industry.stability||
            0
        )*
        .3;

    S.steel+=
        (
            industry.steel||
            0
        )*
        .7;

    S.oil+=
        (
            industry.oil||
            0
        )*

    S.food+=

            industry.food||
            0
        )*
        .8;

    S.energy+=

            industry.energy||
            0
        )*
        .8;

    addNews(
        "🏭 توسعه صنعتی",
        `${industry.name} به سطح ${level+1} رسید.`,

    );

    normalizeState();

/* =========================================================
   INDUSTRY OUTPUT
   ========================================================= */

function calculateIndustryOutput(){

    let result=
        S.industry*
        .58;

    Object.entries(
        S.industries||
        {}
    )
    .forEach(
        ([id,level])=>{

            const industry =
                INDUSTRIES.find(
                    x=>
                        x.id===
                        id
                );

            if(
                !industry
            )
                return;

            result+=
                industry.output*
                level*
                .42;

        }
    );

    return result;

}

function normalizeBudget(){

function moveBudget(
    sector,
    delta
){

    if(
        !S.budget[sector]
    )
        return;

    const target =
        S.budget[
            sector
        ];

    if(
        delta<0
        &&
        target+
        delta<
        0
    )
        return;

    const keys=
        Object.keys(
            S.budget
        );

    let donor =
        keys.find(
            key=>
                key!==sector&&
                S.budget[key]>=
                Math.abs(delta)
        );

    if(
        delta>0
    ){

        if(
            !donor
        ){

            toast(
                "بخش دیگری بودجه کافی برای انتقال ندارد"
            );

            return;

        }

        S.budget[
            donor
        ]-=
            delta;

    }

    S.budget[
        sector
    ]+=
        delta;

    normalizeBudget();

    render();

    openBudget();

}

/* =========================================================
   DIPLOMATIC ACTION
   ========================================================= */

function diplomaticAction(
    targetId,
    type
){

    const current=
        S.relations[
            targetId
        ]||
        0;

    const settings={

        talk:{

            cost:
                160,

            relation:
                10,

            reputation:
                1

        },

        trade:{

            cost:
                300,

            relation:
                7,

            reputation:
                1

        },

        pressure:{

            cost:
                220,

            relation:
                -10,

            reputation:
                -1

        }

    };

    const action=
        settings[type];

    if(
        !action
    )
        return;

    if(
        S.money<
        action.cost
    ){

        toast(
            "بودجه کافی نیست"
        );

        return;

    }

    S.money-=
        action.cost;

    S.relations[targetId]=
        clamp(
            current+
            action.relation,
            -100,
            100
        );

    S.reputation+=
        action.reputation;

    if(
        type===
        "trade"
    ){

        S.economy+=
            1;

        S.influence+=
            .8;

    }

    if(
        type===
        "talk"
    ){

        S.stability+=
            .25;

    }

    render();

    openDiplomacy();

}

/* =========================================================

   ========================================================= */

let masterLastTick=
    performance.now();

let masterAccumulator=
    0;

function masterGameLoop(
    now
){

    const delta=
        now-
        masterLastTick;

    masterLastTick=
        now;

    if(
        S.started&&
        !S.settings.paused
    ){

        masterAccumulator+=
            delta;

        const interval=
            1450/
            Math.max(
                1,
                S.settings.speed||
                1
            );

        while(
            masterAccumulator>=
            interval
        ){

            masterAccumulator-=
                interval;

            advanceDay();

            masterDailySimulation();

        }

    }

    requestAnimationFrame(
        masterGameLoop
    );

}

requestAnimationFrame(
    masterGameLoop
);


/* =========================================================
   WORLD DATE DISPLAY
   ========================================================= */

function daysInMonth(
    month,
    year
){

    if(
        [
            4,
            6,
            9,
            11
        ]
        .includes(
            month
        )
    )
        return 30;

    if(
        month===
        2
    ){

        return(
            year%4===
            0
        )
        ?
        29
        :
        28;

    }

    return 31;

}


/* =========================================================
   DATE ADVANCEMENT
   ========================================================= */

function advanceDay(){

    S.day++;

    if(
        S.day>
        daysInMonth(
            S.month,

        )

        S.day=1;

        S.month++;

        if(

            S.month=1;

            S.year++;

            addNews(
                "📅 سال جدید",
                `سال ${S.year} آغاز شد.`,
                "world"
            );

        }

    }

}

/* =========================================================
   DEEP MERGE
   ========================================================= */

function deepMergeState(
    base,
    saved
){

    const result=
        cloneObject(
            base
        );

    Object.entries(
        saved||
        {}
    )
    .forEach(
        ([key,value])=>{

            if(
                value&&
                typeof value===
                "object"&&
                !Array.isArray(
                    value
                )&&
                result[key]&&
                typeof result[key]==="object"
            ){

                result[key]=
                    deepMergeState(
                        result[key],
                        value
                    );

            }

            else{

                result[key]=
                    value;

            }

        }
    );

    return result;

}

function cloneObject(
    object
){

    return JSON.parse(
        JSON.stringify(
            object
        )
    );

}

function countActiveProjects(){

    return Object.values(
        S.megaProjects||
        {}
    )
    .reduce(
        (
            total,
            value
        )=>
            total+
            value,
        0
    );

}

function startMegaProject(
    id
){

    const project=
        MEGA_PROJECTS.find(
            p=>
                p.id===
                id
        );

    if(
        !project
    )
        return;

    const level=
        S.megaProjects[id]||
        0;

    const cost=
        Math.round(
            project.cost*
            Math.pow(
                1.27,
                level
            )
        );

    if(
        S.money<
        cost
    ){

        toast(
            "💰 بودجه پروژه کافی نیست"
        );

        return;

    }

    S.money-=
        cost;

    S.megaProjects[id]=
        level+
        1;

    Object.keys(
        project
    )
    .forEach(
        key=>{

            if(
                key==="id"||
                key==="name"||
                key==="icon"||
                key==="cost"||
                key==="time"||
                key==="description"
            )
                return;

            const value=
                project[key];

            if(
                typeof value===
                "number"
                &&
                typeof S[key]==="number"
            ){

                S[key]+=
                    value;

            }

        }
    );

    addNews(
        "🏗️ پروژه ملی",
        `${project.name} به سطح ${level+1} رسید.`,
        "projects"
    );

    normalizeState();

    render();

    openProjects();

    toast(
        "🏗️ پروژه تکمیل شد"
    );

}

function setCityType(
    id,
    typeId
){

    const city=
        S.cities[id];

    const type=
        CITY_TYPES.find(
            x=>
                x.id===
                typeId
        );

    if(
        !city||
        !type
    )
        return;

    city.type=
        type.id;

    Object.keys(
        type
    )
    .forEach(
        key=>{

            if(
                [
                    "id",
                    "name",
                    "icon"
                ]
                .includes(
                    key
                )
            )
                return;

            if(
                typeof type[key]==="number"
                &&
                typeof S[key]==="number"
            ){

                S[key]+=
                    type[key]*
                    .25;

            }

        }
    );

    addNews(
        "🏙️ تخصص شهری",
        `${city.name} به مرکز ${type.name} تبدیل شد.`,
        "city"
    );

    normalizeState();

    render();

    openCities();

    toast(
        "🏙️ تخصص شهر تغییر کرد"
    );

}

            city.population,

function calculateCityDevelopment(){

    const cities=
        Object.values(
            S.cities||
            {}
        );

    if(
        !cities.length
    )
        return 0;

    return cities.reduce(
        (
            total,
            city
        )=>
            total+
            city.development,
        0
    )/
    cities.length;

}

        `

function applyOccupationPolicy(
    provinceId,
    policyId
){

    const province=
        S.provinces[
            provinceId
        ];

    const policy=
        OCCUPATION_POLICIES.find(
            p=>
                p.id===
                policyId
        );

    if(
        !province||
        !policy
    )
        return;

    S.occupationPolicies[
        provinceId
    ]=
        policyId;

    if(
        policy.stability
    ){

        province.loyalty=
            clamp(
                province.loyalty+
                policy.stability,
                0,
                100
            );

    }

    if(
        policy.unrest
    ){

        province.unrest=
            clamp(
                province.unrest+
                policy.unrest,
                0,
                100
            );

    }

    S.economy+=
        policy.economy||
        0;

    S.military+=
        policy.military||
        0;

    addNews(
        "🗺️ سیاست اداره",
        `${policy.name} در ${province.name} اجرا شد.`,
        "territory"
    );

    normalizeState();

    render();

    openOccupation();

}

   ========================================================= */

function attemptTerritoryControl(
    provinceId
){

    const province=
        S.provinces[
            provinceId
        ];

    if(
        !province
    )
        return;

    if(
        S.military<
        55
    ){

        toast(
            "قدرت نظامی برای کنترل کافی نیست"
        );

        return;

    }

    const chance=
        25+
        S.military*
        .22+
        S.intelligence*
        .15-
        province.loyalty*
        .2;

    const success=
        Math.random()*
        100<
        chance;

    if(
        success
    ){

        province.owner=
            S.player;

        province.loyalty=
            45;

        province.unrest=
            25;

        S.influence+=
            4;

        S.economy+=
            3;

        addNews(
            "🗺️ تغییر کنترل",
            `${province.name} تحت کنترل شما قرار گرفت.`,
            "territory"
        );

        toast(
            "✅ کنترل منطقه موفق بود"
        );

    }
    else{

        province.unrest=
            clamp(
                province.unrest+
                12,
                0,
                100
            );

        S.military-=
            1;

        addNews(
            "⚠️ شکست عملیات کنترل",
            `تلاش برای کنترل ${province.name} موفق نبود.`,
            "territory"
        );

        toast(
            "⚠️ عملیات ناموفق بود"
        );

    }

    normalizeState();

    render();

    openOccupation();

}

function missionValue(
    mission
){

    switch(
        mission.type
    ){

        case "economy":
            return S.economy;

        case "military":
            return S.military;

        case "technology":
            return S.technology;

        case "industry":
            return S.industry;

        case "stability":
            return S.stability;

        case "alliances":
            return S.alliances.length;

        case "equipment":
            return totalEquipmentCount();

        case "cities":

            return Object.values(
                S.cities||
                {}
            )
            .filter(
                city=>
                    city.development>=
                    55
            )
            .length;

    }

    return 0;

function aiDevelopmentTick(){

            )

            )
                state.stability+=
                    .2;

            if(
                choice===

            )
                state.unrest+=
                    (
                        Math.random()-
                        .45
                    )*
                    .8;

            if(
                choice===
                5
            )

                    .1;

            if(

            )

                    clamp(

                );

                clamp(

                    1,

                );

                );

function territoryTick(){

    createProvinces();

    Object.values(
        S.provinces
    )
    .forEach(
        province=>{

            if(
                province.owner===
                S.player
            ){

                const policy=
                    S.occupationPolicies[
                        province.id
                    ];

                if(
                    policy
                ){

                    const data=
                        OCCUPATION_POLICIES.find(
                            p=>
                                p.id===
                                policy
                        );

                    if(
                        data
                    ){

                        province.unrest=
                            clamp(
                                province.unrest+
                                (
                                    data.unrest||
                                    0
                                )*
                                .004,
                                0,
                                100
                            );

                    }

                }

                province.loyalty=
                    clamp(
                        province.loyalty+
                        (
                            province.unrest<
                            25
                            ?
                            .015
                            :
                            -.02
                        ),
                        0,
                        100
                    );

            }

        }
    );

}

   CITY TICK
   ========================================================= */

function cityTick(){

    createInitialCities();

    Object.values(
        S.cities
    )
    .forEach(
        city=>{

            city.population+=
                (
                    .0008+
                    city.stability*
                    .00001
                )*
                city.level;

            city.development=
                clamp(
                    city.development+
                    (
                        city.level*
                        .002
                    ),
                    0,
                    100
                );

            if(
                city.type===
                "industrial"
            ){

                S.industry+=
                    .0007*
                    city.level;

            }

            if(
                city.type===
                "research"
            ){

                S.research+=
                    .0008*
                    city.level;

            }

            if(
                city.type===
                "agriculture"
            ){

                S.food+=
                    .003*
                    city.level;

            }

            if(
                city.type===
                "port"
            ){

                S.influence+=
                    .0004*
                    city.level;

            }

            if(
                city.type===
                "military"
            ){

                S.military+=
                    .0005*
                    city.level;

            }

        }
    );

}

function provincePopulationTick(){

    Object.values(
        S.provinces||
        {}
    )
    .forEach(
        province=>{

            let growth=
                .0012;

            if(
                province.loyalty>
                75
            )
                growth+=
                    .0007;

            if(
                province.unrest>

                    .0005;

                    province.population+
                    growth
                );

        }
    );

}

   CITY MAP OVERLAY
   ========================================================= */

function drawCitiesOnMap(){

    if(
        !worldCanvas||
        !worldCtx
    )
        return;

    Object.values(
        S.cities||
        {}
    )
    .forEach(
        city=>{

            const x=
                worldCanvas.width*
                city.x;

            const y=
                worldCanvas.height*
                city.y;

            const radius=
                3+
                city.level*
                .55;

            worldCtx.save();

            worldCtx.beginPath();

            worldCtx.arc(
                x,
                y,
                radius,
                0,
                Math.PI*2
            );

            worldCtx.fillStyle=
                "#f8d65e";

            worldCtx.fill();

            worldCtx.strokeStyle=
                "rgba(255,255,255,.75)";

            worldCtx.lineWidth=
                1;

            worldCtx.stroke();

            worldCtx.font=
                "8px Tahoma";

            worldCtx.textAlign=
                "center";

            worldCtx.fillStyle=
                "rgba(255,255,255,.80)";

            worldCtx.fillText(
                city.name,
                x,
                y-
                radius-
                4
            );

            worldCtx.restore();

        }
    );

}


/* =========================================================
   PROVINCE MAP OVERLAY
   ========================================================= */

function drawProvinceOverlay(){

    if(
        !worldCanvas||
        !worldCtx
    )
        return;

    const provinces=
        Object.values(
            S.provinces||
            {}
        );

    provinces.forEach(
        (
            province,
            index
        )=>{

            const x=
                worldCanvas.width*
                (
                    .08+
                    (
                        index%6
                    )*
                    .15
                );

            const y=
                worldCanvas.height*
                (
                    .38+
                    Math.floor(
                        index/6
                    )*
                    .22
                );

            worldCtx.save();

            worldCtx.beginPath();

            worldCtx.rect(
                x,
                y,
                75,
                38
            );

            worldCtx.strokeStyle=
                province.owner===
                S.player
                ?
                "rgba(53,221,255,.25)"
                :
                "rgba(255,83,111,.18)";

            worldCtx.stroke();

            worldCtx.restore();

        }
    );

}

if(
    !S.projectQueue
){

    S.projectQueue=[];

}

function queueProject(
    projectId
){

    const project=
        MEGA_PROJECTS.find(
            x=>
                x.id===
                projectId
        );

    if(
        !project
    )
        return;

    const duplicate=
        S.projectQueue.some(
            x=>
                x.projectId===
                projectId
        );

    if(
        duplicate
    ){

        toast(
            "این پروژه در صف قرار دارد"
        );

        return;

    }

    S.projectQueue.push({

        projectId:
            projectId,

        remaining:
            project.time

    });

    toast(
        "🏗️ پروژه وارد صف ساخت شد"
    );

}

function projectQueueTick(){

    if(
        !S.projectQueue.length
    )
        return;

    S.projectQueue=
        S.projectQueue
        .filter(
            project=>{

                project.remaining--;

                if(
                    project.remaining<=0
                ){

                    finishQueuedProject(
                        project.projectId
                    );

                    return false;

                }

                return true;

            }
        );

}

function finishQueuedProject(
    projectId
){

    const project=
        MEGA_PROJECTS.find(
            x=>
                x.id===
                projectId
        );

    if(
        !project
    )
        return;

    const level=
        S.megaProjects[id=project.id]||
        0;

    S.megaProjects[
        project.id
    ]=
        level+
        1;

    Object.entries(
        project
    )
    .forEach(
        ([key,value])=>{

            if(
                typeof value!=="number"
            )
                return;

            if(
                [
                    "cost",
                    "time"
                ].includes(
                    key
                )
            )
                return;

            if(
                typeof S[key]==="number"
            ){

                S[key]+=
                    value;

            }

        }
    );

    addNews(
        "🏗️ تکمیل پروژه",
        `${project.name} تکمیل شد.`,
        "projects"
    );

    normalizeState();

}

                id
        );

    if(
        !building
    )
        return;

    const level=
        S.extendedBuildings[
            id
        ]||
        0;

    const cost=
        Math.round(
            building.cost*
            Math.pow(
                1.3,
                level
            )

        S.money<
        cost

        toast(
            "💰 بودجه کافی نیست"

        cost;

    S.extendedBuildings[id]=

        1;

        building
    )
    .forEach(
        ([key,value])=>{

            if(
                [
                    "id",
                    "name",
                    "icon",
                    "cost"
                ]
                .includes(
                    key
                )
            )
                return;

            if(

        }
    );

/* =========================================================
   BACKGROUND VISUAL PARTICLES
   ========================================================= */

const starCanvas=
    document.getElementById(
        "stars"
    );

const starCtx=
    starCanvas
    ?
    starCanvas.getContext(
        "2d"
    )
    :
    null;

const starParticles=[];

function resizeStars(){

    if(
        !starCanvas
    )
        return;

    starCanvas.width=
        innerWidth;

    starCanvas.height=
        innerHeight;

    if(
        starParticles.length===
        0
    ){

        for(
            let i=0;
            i<180;
            i++
        ){

            starParticles.push({

                x:
                    Math.random()*
                    innerWidth,

                y:
                    Math.random()*
                    innerHeight,

                size:
                    Math.random()*
                    1.4+

                    .2,

                speed:
                    Math.random()*
                    .18+

                    .02,

                opacity:
                    Math.random()*
                    .7+

                    .1

            });

        }

    }

}

function drawStars(){

    if(
        !starCanvas||
        !starCtx
    )
        return;

    starCtx.clearRect(
        0,
        0,
        starCanvas.width,
        starCanvas.height
    );

    if(
        S.settings.particles===
        false
    )
        return;

    starParticles.forEach(
        star=>{

            star.y+=
                star.speed;

            if(
                star.y>
                starCanvas.height
            ){

                star.y=
                    -2;

            }

            starCtx.beginPath();

            starCtx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI*2
            );

            starCtx.fillStyle=
                `rgba(
                    140,
                    220,
                    255,
                    ${star.opacity}
                )`;

            starCtx.fill();

        }
    );

    requestAnimationFrame(
        drawStars
    );

}

resizeStars();

window.addEventListener(
    "resize",
    resizeStars
);

requestAnimationFrame(
    drawStars
);

/* =========================================================
   WAR INITIALIZER
   ========================================================= */

function initializeWarObject(
    war
){

    if(
        !war.fronts
    ){

        war.fronts=[];

        FRONT_TYPES
        .slice(
            0,
            3+
            Math.floor(
                Math.random()*
                3
            )
        )
        .forEach(
            front=>{

                war.fronts.push({

                    id:
                        "FRONT_"+
                        Math.random()
                        .toString(
                            36
                        )
                        .slice(
                            2,
                            8
                        ),

                    type:
                        front.id,

                    name:
                        front.name,

                    score:
                        50,

                    pressure:
                        50,

                    supply:
                        100,

                    morale:
                        75,

                    activity:
                        50,

                    days:
                        0

                });

            }
        );

    }

    if(
        typeof war.supply!=="number"
    )
        war.supply=
            100;

    if(
        typeof war.morale!=="number"
    )
        war.morale=
            75;

    if(
        typeof war.air!=="number"
    )
        war.air=
            25;

    if(
        typeof war.naval!=="number"
    )
        war.naval=
            20;

    if(
        typeof war.casualties!=="number"
    )
        war.casualties=
            0;

    if(
        typeof war.days!=="number"
    )
        war.days=
            0;

}

/* =========================================================
   ADVANCED WAR OPERATION
   ========================================================= */

function performWarOperation(
    warId,
    operationId
){

    const war=
        S.wars.find(
            x=>
                x.id===
                warId
        );

    const operation=
        WAR_OPERATIONS.find(
            x=>
                x.id===
                operationId
        );

    if(
        !war||
        !operation
    )
        return;

    initializeWarObject(
        war
    );

    if(
        S.command<
        operation.command
    ){

        toast(
            "🎖️ فرماندهی کافی نیست"
        );

        return;

    }

    if(
        S.oil<
        operation.oil
    ){

        toast(
            "🛢️ سوخت کافی نیست"
        );

        return;

    }

    S.command-=
        operation.command;

    S.oil-=
        operation.oil;

    if(
        operationId===
        "logistics"
    ){

        war.supply=
            clamp(
                war.supply+
                18,
                0,
                100
            );

        war.morale=
            clamp(
                war.morale+
                7,
                0,
                100
            );

        war.fronts.forEach(
            front=>{

                front.supply=
                    clamp(
                        front.supply+
                        15,
                        0,
                        100
                    );

            }
        );

        toast(
            "🚛 تدارکات جبهه تقویت شد"
        );

        normalizeState();

        render();

        openWarCommandCenter();

        return;

    }

    if(
        operationId===
        "recon"
    ){

        war.air+=
            3;

        war.naval+=
            1;

        war.fronts.forEach(
            front=>{

                front.activity=
                    clamp(
                        front.activity+
                        8,
                        0,
                        100
                    );

                front.pressure=
                    clamp(
                        front.pressure+
                        5,
                        0,
                        100
                    );

            }
        );

        S.intelligence+=
            .5;

        toast(
            "🔭 اطلاعات جبهه به‌روزرسانی شد"
        );

        normalizeState();

        render();

        openWarCommandCenter();

        return;

    }

    const enemy=
        S.factions[
            war.enemy
        ];

    const readiness=
        calculateReadiness();

    const inventory=
        calculateEquipmentCombatScore();

    const commanderBonus=
        calculateCommanderBonus();

    const doctrineBonus=
        calculateDoctrineBonus();

    const technologyFactor=
        S.technology*
        .27;

    const ourStrength=
        S.military+
        technologyFactor+
        readiness*
        .26+
        inventory*
        .035+
        commanderBonus+
        doctrineBonus+
        Math.random()*
        50;

    const enemyStrength=
        enemy.military+
        enemy.technology*
        .33+
        enemy.stability*
        .25+
        Math.random()*
        50;

    let advantage=
        (
            ourStrength-
            enemyStrength
        )/
        8;

    advantage+=
        operation.score*
        .45;

    advantage+=
        (
            war.morale-
            50
        )*
        .09;

    advantage+=
        (
            war.supply-
            50
        )*
        .07;

    if(
        operationId===
        "defensive"
    ){

        advantage+=
            3;

    }

    if(
        operationId===
        "air_campaign"
    ){

        advantage+=
            (
                calculateAirPower()/
                160
            );

        war.air+=
            8;

    }

    if(
        operationId===
        "artillery_support"
    ){

        advantage+=
            (
                calculateArtilleryPower()/
                130
            );

    }

    if(
        operationId===
        "naval_pressure"
    ){

        advantage+=
            (
                calculateNavalPower()/
                160
            );

        war.naval+=
            7;

    }

    war.score+=
        advantage;

    war.morale=
        clamp(
            war.morale+
            (
                advantage>
                0
                ?
                3
                :
                -4
            )+
            operation.morale,
            0,
            100
        );

    war.supply=
        clamp(
            war.supply-
            operation.exhaustion*
            .8,
            0,
            100
        );

    war.casualties+=
        Math.round(
            Math.max(
                1,
                Math.abs(
                    advantage
                )*
                1.8+
                Math.random()*
                4
            )
        );

    S.manpower=
        Math.max(
            0,
            S.manpower-
            Math.max(
                .08,
                Math.abs(
                    advantage
                )*
                .06
            )
        );

    S.warExhaustion+=
        operation.exhaustion;

    war.fronts.forEach(
        front=>{

            let frontDelta=
                advantage/
                Math.max(
                    1,
                    war.fronts.length
                );

            front.score+=
                frontDelta;

            front.pressure+=
                advantage>
                0
                ?
                2.2
                :
                -2;

            front.supply=
                clamp(
                    front.supply-
                    operation.exhaustion*
                    .45,
                    0,
                    100
                );

            front.morale=
                clamp(
                    front.morale+
                    (
                        advantage>
                        0
                        ?
                        1.8
                        :
                        -2.2
                    ),
                    0,
                    100
                );

            front.activity=
                clamp(
                    front.activity+
                    Math.abs(
                        advantage
                    )*
                    .15+
                    2,
                    0,
                    100
                );

        }

/* =========================================================
   COMBAT POWER CALCULATION
   ========================================================= */

function calculateEquipmentCombatScore(){

    ensureEquipmentState();

    let result=
        0;

    Object.entries(
        S.equipment
    )
    .forEach(
        ([id,count])=>{

            const item=
                equipmentById(
                    id
                );

            if(
                !item
            )
                return;

            const level=
                getEquipmentLevel(
                    id
                );

            result+=
                item.gamePower*
                count*
                (
                    1+
                    level*
                    .08
                );

        }
    );

    return result;

}

function calculateArtilleryPower(){

    ensureEquipmentState();

    return Object.entries(
        S.equipment
    )
    .reduce(
        (
            total,
            [id,count]
        )=>{

            const item=
                equipmentById(
                    id
                );

            if(
                !item||
                item.category!==
                "artillery"
            )
                return total;

            return total+
                item.gamePower*
                count;

        },
        0
    );

}

function calculateCommanderBonus(){

    return Object.values(
        S.commanders||
        {}
    )
    .reduce(
        (
            total,
            commander
        )=>
            total+
            (
                commander.bonus||
                0
            )*
            .22,
        0
    );

}

function calculateDoctrineBonus(){

    if(
        !S.activeDoctrine
    )
        return 0;

    const doctrine=
        DOCTRINES.find(
            x=>
                x.id===
                S.activeDoctrine
        );

    if(
        !doctrine
    )
        return 0;

    return(
        doctrine.military||
        0
    )*
    .4+
    (
        doctrine.command||
        0
    )*
    .25;

}

   ========================================================= */

function passiveWarTick(){

    S.wars
    .filter(
        war=>
            war.status===
            "war"
    )
    .forEach(
        war=>{

            initializeWarObject(
                war
            );

            war.days+=
                1;

            const enemy=
                S.factions[
                    war.enemy
                ];

            const ourReadiness=
                calculateReadiness();

            const enemyReadiness=
                clamp(
                    enemy.stability+
                    enemy.technology*
                    .2,
                    0,
                    100
                );

            let delta=
                (
                    (
                        S.military+
                        S.technology*
                        .25+
                        ourReadiness*
                        .22
                    )
                    -
                    (
                        enemy.military+
                        enemy.technology*
                        .25+
                        enemyReadiness*
                        .22
                    )
                )/
                130;

            delta+=
                (
                    Math.random()-
                    .5
                )*
                .8;

            if(
                war.supply<
                30
            ){

                delta-=
                    .6;

            }

            if(
                war.morale<
                35
            ){

                delta-=
                    .4;

            }

            if(
                war.supply>
                80
            ){

                delta+=
                    .3;

            }

            war.score+=
                delta;

            war.supply=
                clamp(
                    war.supply-
                    .55,
                    0,
                    100
                );

            war.morale=
                clamp(
                    war.morale+
                    (
                        delta>
                        0
                        ?
                        .04
                        :
                        -.07
                    ),
                    0,
                    100
                );

            war.casualties+=
                Math.random()*
                .8;

            war.fronts
            .forEach(
                front=>{

                    front.score+=
                        delta;

                    front.supply=
                        clamp(
                            front.supply-
                            .15,
                            0,
                            100
                        );

                    front.days+=
                        1;

                }
            );

            evaluateAdvancedWar(
                war
            );

        }
    );

}

function triggerCrisis(
    forcedType=null
){

    const type=
        forcedType
        ?
        CRISIS_TYPES.find(
            x=>
                x.id===
                forcedType
        )
        :
        CRISIS_TYPES[
            Math.floor(
                Math.random()*
                CRISIS_TYPES.length
            )
        ];

    if(
        !type
    )
        return;

    const duplicate=
        S.crises.some(
            crisis=>
                crisis.type===
                type.id
        );

    if(
        duplicate
    )
        return;

    S.crises.push({

        id:
            "CRISIS_"+
            Date.now(),

        type:
            type.id,

        name:
            type.name,

        duration:
            type.duration,

        severity:
            25+
            Math.random()*
            50

    });

    addNews(
        `${type.icon} ${type.name}`,
        "یک بحران مهم در کشور شکل گرفته است.",
        "crisis"
    );

    toast(
        `${type.icon} ${type.name}`
    );

}


function processCrises(){

    S.crises=
        (
            S.crises||
            []
        )
        .filter(
            crisis=>{

                crisis.duration--;

                const severity=
                    crisis.severity;

                if(
                    crisis.type===
                    "economic"
                ){

                    S.economy-=
                        severity*
                        .0008;

                    S.money-=
                        severity*
                        .08;

                    S.unrest+=
                        severity*
                        .0004;

                }

                if(
                    crisis.type===
                    "political"
                ){

                    S.legitimacy-=
                        severity*
                        .0007;

                    S.politicalPower-=
                        severity*
                        .0005;

                    S.unrest+=
                        severity*
                        .0009;

                }

                if(
                    crisis.type===
                    "military"
                ){

                    S.command-=
                        severity*
                        .0007;

                    S.military-=
                        severity*
                        .0004;

                    S.warExhaustion+=
                        severity*
                        .001;

                }

                if(
                    crisis.type===
                    "social"
                ){

                    S.unrest+=
                        severity*
                        .001;

                    S.stability-=
                        severity*
                        .0006;

                }

                if(
                    crisis.type===
                    "energy"
                ){

                    S.energy-=
                        severity*
                        .0005;

                    S.economy-=
                        severity*
                        .0005;

                }

                return(
                    crisis.duration>
                    0
                );

            }
        );

}

function launchSpyMission(
    targetId,
    missionId
){

    const mission=
        SPY_MISSIONS.find(
            x=>
                x.id===
                missionId
        );

    if(
        !mission
    )
        return;

    if(
        S.money<
        mission.cost
    ){

        toast(
            "بودجه اطلاعاتی کافی نیست"
        );

        return;

    }

    S.money-=
        mission.cost;

    const successChance=
        clamp(
            35+
            S.intelligence*
            .45+
            S.technology*
            .12,
            10,
            92
        );

    const success=
        Math.random()*
        100<
        successChance;

    if(
        success
    ){

        const target=
            S.factions[
                targetId
            ];

        if(
            missionId===
            "recon"
        ){

            target.military-=
                mission.intelligence*
                .08;

            S.intelligence+=
                .9;

        }

        if(
            missionId===
            "political"
        ){

            target.stability-=
                mission.intelligence*
                .08;

            target.unrest+=
                mission.intelligence*
                .07;

            S.influence+=
                .8;

        }

        if(
            missionId===
            "economic"
        ){

            target.economy-=
                mission.intelligence*
                .08;

            S.reputation+=
                .3;

        }

        if(
            missionId===
            "counterintelligence"
        ){

            S.intelligence+=
                mission.intelligence*
                .18;

            S.stability+=
                1;

        }

        addNews(
            "🕵️ عملیات اطلاعاتی",
            `ماموریت ${mission.name} علیه ${faction(targetId).name} موفق شد.`,
            "intelligence"

            "🕵️ عملیات موفق بود"

            Math.floor(
                Math.random()*
                candidates.length
            )
        ];

    event.action(
        target.id
    );

    addNews(
        event.title,
        `${event.text} طرف مقابل: ${target.name}.`,
        "diplomacy"
    );

}


/* =========================================================
   MILITARY INDUSTRY AI
   ========================================================= */

function aiMilitaryTick(){

    FACTIONS
    .forEach(
        f=>{

            if(
                f.id===
                S.player
            )
                return;

            const state=
                S.factions[
                    f.id
                ];

            if(
                !state
            )
                return;

            const pressure=
                state.unrest||
                0;

            if(
                pressure>
                60
            ){

                state.stability-=
                    .04;

            }

            if(
                state.economy>
                90
            ){

                state.military+=
                    .06;

            }

            if(
                state.technology>
                90
            ){

                state.military+=
                    .04;

            }

            if(
                state.stability<
                35
            ){

                state.unrest+=
                    .03;

            }

        }
    );

}


/* =========================================================
   AI DIPLOMACY
   ========================================================= */

function aiDiplomaticTick(){

    FACTIONS
    .forEach(
        factionA=>{

            if(
                factionA.id===
                S.player
            )
                return;

            const a=
                S.factions[
                    factionA.id
                ];

            if(
                !a
            )
                return;

            FACTIONS
            .forEach(
                factionB=>{

                    if(
                        factionB.id===
                        factionA.id
                    )
                        return;

                    const relation=
                        S.relations[
                            factionB.id
                        ]||
                        0;

                    if(
                        relation<
                        -60
                    ){

                        a.stability-=
                            .01;

                    }

                    if(
                        relation>
                        60
                    ){

                        a.economy+=
                            .008;

                    }

                }
            );

        }
    );

}

function calculateMilitaryScore(){

    return Math.round(

        S.military*
        1.15+

        S.technology*
        .3+

        calculateEquipmentCombatScore()*
        .018+

        S.command*
        .22+

        calculateReadiness()*
        .2

    );

}

function calculateEconomicScore(){

    return Math.round(

        S.economy*
        1.15+

        S.industry*
        .5+

        S.infrastructure*
        .3+

        S.technology*
        .15

    );

}

function calculateDiplomaticScore(){

    return Math.round(

        (
            S.reputation||
            0
        )*

        1.15+

        (
            S.influence||
            0
        )*

        .9+

        S.alliances.length*
        8

    );

}


/* =========================================================
   WAR EXHAUSTION MANAGEMENT
   ========================================================= */

function warExhaustionTick(){

    const activeWars=
        S.wars.filter(
            war=>
                war.status===
                "war"
        ).length;

    if(
        activeWars===
        0
    ){

        S.warExhaustion=
            Math.max(
                0,
                S.warExhaustion-
                .045
            );

        return;

    }

    S.warExhaustion+=
        activeWars*
        .012;

    if(
        S.warExhaustion>
        75
    ){

        S.unrest+=
            .012;

        S.stability-=
            .008;

    }

}


/* =========================================================
   MANPOWER RECOVERY
   ========================================================= */

function manpowerTick(){

    if(
        S.wars.some(
            war=>
                war.status===
                "war"
        )
    ){

        S.manpower+=
            .006;

    }
    else{

        S.manpower+=
            .035;

    }

    if(
        S.stability>
        70
    ){

        S.manpower+=
            .01;

    }

}


/* =========================================================
   COMMAND RECOVERY
   ========================================================= */

function commandRecoveryTick(){

    S.command+=
        .035+
        S.stability*
        .0008;

    if(
        S.command>
        300
    ){

        S.command=
            300;

    }

}


/* =========================================================
   RESEARCH TICK
   ========================================================= */

function researchTick(){

    const universities=
        Object.values(
            S.cities||
            {}
        )
        .filter(
            city=>
                city.type===
                "research"
        )
        .length;

    S.research+=
        .018+
        universities*
        .025+
        S.technology*
        .0007;

    S.technology+=
        S.research*
        .000018;

}


/* =========================================================
   NATIONAL GROWTH
   ========================================================= */

function nationalGrowthTick(){

    let growth=
        .004;

    growth+=
        S.stability*
        .000025;

    growth+=
        S.economy*
        .000018;

    if(
        S.unrest>
        55
    ){

        growth-=
            .002;

    }

    S.population=
        Math.max(
            1,
            S.population+
            S.population*
            growth*
            .01
        );

}

/* =========================================================
   ADVANCED GAME TIMER
   ========================================================= */

let advancedClockLast=
    performance.now();

let advancedClockAccum=
    0;

function advancedClock(
    now
){

    const delta=
        now-
        advancedClockLast;

    advancedClockLast=
        now;

    if(
        S.started&&
        !S.settings.paused
    ){

        advancedClockAccum+=
            delta;

        const interval=
            1700/
            Math.max(
                1,
                S.settings.speed||
                1
            );

        while(
            advancedClockAccum>=
            interval
        ){

            advancedClockAccum-=
                interval;

            advancedMasterTick();

            advanceDay();

            render();

        }

    }

    requestAnimationFrame(
        advancedClock
    );

}

requestAnimationFrame(
    advancedClock
);
