<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرمانده جهان</title>

<style>
*{
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    margin:0;
    background:#101827;
    color:white;
}

header{
    background:#172338;
    padding:15px;
    text-align:center;
    border-bottom:2px solid #263852;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:7px 0 0;
    color:#aebbd0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.card{
    background:#18263a;
    border:1px solid #2c405c;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
}

h2{
    margin-top:0;
}

select,button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    font-size:16px;
    margin-top:8px;
}

select{
    background:#263852;
    color:white;
}

button{
    background:#18a999;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

button.danger{
    background:#b83b4b;
}

button.blue{
    background:#3977c9;
}

button.gold{
    background:#b78b28;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    background:#111c2c;
    border-radius:12px;
    padding:12px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:20px;
    margin-top:5px;
}

.countries{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.country{
    background:#202f45;
    border-radius:12px;
    padding:12px;
    cursor:pointer;
    border:2px solid transparent;
}

.country:hover{
    border-color:#18a999;
}

.country.selected{
    border-color:#ffd34e;
}

.flag{
    font-size:30px;
}

.log{
    background:#0d1522;
    border-radius:10px;
    padding:10px;
    max-height:200px;
    overflow-y:auto;
}

.log p{
    margin:6px 0;
    padding-bottom:6px;
    border-bottom:1px solid #243247;
    font-size:13px;
}

.progress{
    height:12px;
    background:#0d1522;
    border-radius:20px;
    overflow:hidden;
    margin-top:7px;
}

.progress div{
    height:100%;
    background:#18a999;
}

.hidden{
    display:none;
}

@media(min-width:700px){
    .stats{
        grid-template-columns:repeat(4,1fr);
    }

    .countries{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>🌍 فرمانده جهان</h1>
    <p>یک بازی استراتژیک درباره مدیریت کشور</p>
</header>

<div class="container">

<div class="card" id="startScreen">
    <h2>🎮 شروع بازی</h2>
    <p>کشور خودت را انتخاب کن:</p>

    <select id="countrySelect">
        <option value="iran">🇮🇷 ایران</option>
        <option value="usa">🇺🇸 آمریکا</option>
        <option value="china">🇨🇳 چین</option>
        <option value="russia">🇷🇺 روسیه</option>
        <option value="germany">🇩🇪 آلمان</option>
        <option value="japan">🇯🇵 ژاپن</option>
        <option value="india">🇮🇳 هند</option>
        <option value="brazil">🇧🇷 برزیل</option>
    </select>

    <button onclick="startGame()">شروع بازی 🚀</button>
</div>


<div id="game" class="hidden">

<div class="card">
    <h2 id="countryName">کشور</h2>
    <p>📅 نوبت: <b id="turn">1</b></p>

    <div class="stats">

        <div class="stat">
            💰 خزانه
            <b id="money">0</b>
        </div>

        <div class="stat">
            👥 جمعیت
            <b id="population">0</b>
        </div>

        <div class="stat">
            🪖 قدرت نظامی
            <b id="military">0</b>
        </div>

        <div class="stat">
            📈 اقتصاد
            <b id="economy">0</b>
        </div>

    </div>
</div>


<div class="card">
    <h2>⚙️ مدیریت کشور</h2>

    <button onclick="buildEconomy()">
        🏗️ سرمایه‌گذاری اقتصادی
    </button>

    <button class="blue" onclick="buildMilitary()">
        🪖 تقویت ارتش
    </button>

    <button class="gold" onclick="endTurn()">
        ⏭️ پایان نوبت
    </button>

    <button onclick="saveGame()">
        💾 ذخیره بازی
    </button>
</div>


<div class="card">
    <h2>🌍 کشورهای جهان</h2>
    <div class="countries" id="countries"></div>
</div>


<div class="card">
    <h2>🤝 روابط با کشورها</h2>
    <div id="relations"></div>
</div>


<div class="card">
    <h2>⚔️ اقدامات دیپلماتیک</h2>

    <select id="targetCountry">
    </select>

    <button onclick="makeAlliance()">
        🤝 پیشنهاد اتحاد
    </button>

    <button class="danger" onclick="declareWar()">
        ⚔️ اعلام جنگ
    </button>
</div>


<div class="card">
    <h2>📜 گزارش اتفاقات</h2>
    <div class="log" id="log"></div>
</div>

</div>
</div>


<script>

const countries = {

iran:{
    name:"ایران",
    flag:"🇮🇷",
    money:1200,
    population:89,
    military:70,
    economy:65
},

usa:{
    name:"آمریکا",
    flag:"🇺🇸",
    money:3000,
    population:340,
    military:95,
    economy:95
},

china:{
    name:"چین",
    flag:"🇨🇳",
    money:2800,
    population:1410,
    military:90,
    economy:92
},

russia:{
    name:"روسیه",
    flag:"🇷🇺",
    money:1800,
    population:144,
    military:88,
    economy:72
},

germany:{
    name:"آلمان",
    flag:"🇩🇪",
    money:2100,
    population:84,
    military:60,
    economy:88
},

japan:{
    name:"ژاپن",
    flag:"🇯🇵",
    money:2200,
    population:124,
    military:62,
    economy:86
},

india:{
    name:"هند",
    flag:"🇮🇳",
    money:1900,
    population:1430,
    military:78,
    economy:78
},

brazil:{
    name:"برزیل",
    flag:"🇧🇷",
    money:1500,
    population:216,
    military:58,
    economy:70
}

};


let player=null;
let turn=1;
let relations={};


function startGame(){

    const id=document.getElementById("countrySelect").value;

    player=id;

    turn=1;

    relations={};

    Object.keys(countries).forEach(id=>{
        if(id!==player){
            relations[id]=0;
        }
    });

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    createCountries();
    createTargetList();
    update();

    addLog("🎮 بازی شروع شد.");
    addLog("🌍 کشور خودت را مدیریت کن و اقتصاد و روابطت را توسعه بده.");
}


function update(){

    const c=countries[player];

    document.getElementById("countryName").innerText =
        c.flag+" "+c.name;

    document.getElementById("turn").innerText=turn;

    document.getElementById("money").innerText=
        Math.floor(c.money);

    document.getElementById("population").innerText=
        c.population+" میلیون";

    document.getElementById("military").innerText=
        c.military;

    document.getElementById("economy").innerText=
        c.economy;

    updateRelations();
}


function createCountries(){

    const box=document.getElementById("countries");

    box.innerHTML="";

    Object.keys(countries).forEach(id=>{

        const c=countries[id];

        const div=document.createElement("div");

        div.className="country";

        if(id===player){
            div.classList.add("selected");
        }

        div.innerHTML=`
            <div class="flag">${c.flag}</div>
            <b>${c.name}</b>
            <br>
            💰 ${c.money}
            <br>
            🪖 ${c.military}
        `;

        box.appendChild(div);

    });
}


function createTargetList(){

    const select=document.getElementById("targetCountry");

    select.innerHTML="";

    Object.keys(countries).forEach(id=>{

        if(id!==player){

            const option=document.createElement("option");

            option.value=id;

            option.innerText=
                countries[id].flag+" "+
                countries[id].name;

            select.appendChild(option);
        }

    });
}


function updateRelations(){

    const box=document.getElementById("relations");

    box.innerHTML="";

    Object.keys(relations).forEach(id=>{

        const value=relations[id];

        const c=countries[id];

        let text="خنثی";

        if(value>=60) text="متحد";
        else if(value>=20) text="دوستانه";
        else if(value<=-60) text="دشمن";
        else if(value<=-20) text="تنش";

        box.innerHTML+=`
        <p>
        ${c.flag} <b>${c.name}</b>
        — ${text} (${value})
        </p>
        `;

    });
}


function buildEconomy(){

    const c=countries[player];

    if(c.money<300){

        addLog("❌ پول کافی برای سرمایه‌گذاری نداری.");

        return;
    }

    c.money-=300;

    c.economy+=5;

    addLog(
        "🏗️ 300 واحد پول برای اقتصاد خرج شد. اقتصاد +5"
    );

    update();
}


function buildMilitary(){

    const c=countries[player];

    if(c.money<250){

        addLog("❌ پول کافی برای تقویت ارتش نداری.");

        return;
    }

    c.money-=250;

    c.military+=4;

    addLog(
        "🪖 250 واحد پول برای تقویت نظامی خرج شد. قدرت نظامی +4"
    );

    update();
}


function endTurn(){

    const c=countries[player];

    turn++;

    const income=Math.floor(c.economy*12);

    c.money+=income;

    addLog(
        `📅 نوبت ${turn} شروع شد. درآمد کشور: +${income}`
    );

    randomEvent();

    update();

}


function makeAlliance(){

    const target=document.getElementById("targetCountry").value;

    relations[target]+=25;

    if(relations[target]>100)
        relations[target]=100;

    addLog(
        `🤝 روابط با ${countries[target].name} بهتر شد.`
    );

    update();
}


function declareWar(){

    const target=document.getElementById("targetCountry").value;

    const enemy=countries[target];

    const me=countries[player];

    if(relations[target]>30){

        addLog(
            `⚠️ روابط با ${enemy.name} خوب است؛ ابتدا روابط را کاهش بده.`
        );

        return;
    }

    const myPower=me.military+
        Math.floor(Math.random()*30);

    const enemyPower=enemy.military+
        Math.floor(Math.random()*30);

    if(myPower>=enemyPower){

        me.money+=300;

        enemy.money=Math.max(0,enemy.money-300);

        addLog(
            `🏆 در درگیری با ${enemy.name} برتری پیدا کردی!`
        );

    }else{

        me.money=Math.max(0,me.money-250);

        me.military=Math.max(1,me.military-3);

        addLog(
            `❌ در درگیری با ${enemy.name} شکست خوردی.`
        );
    }

    relations[target]-=40;

    update();
}


function randomEvent(){

    const c=countries[player];

    const events=[
        {
            text:"📈 رونق اقتصادی!",
            action:()=>{
                c.money+=200;
                c.economy+=2;
            }
        },

        {
            text:"🏗️ پروژه ملی موفق شد.",
            action:()=>{
                c.economy+=3;
            }
        },

        {
            text:"💰 مالیات افزایش یافت.",
            action:()=>{
                c.money+=150;
            }
        },

        {
            text:"⚠️ هزینه‌های غیرمنتظره.",
            action:()=>{
                c.money=Math.max(0,c.money-120);
            }
        }
    ];

    const event=
        events[Math.floor(Math.random()*events.length)];

    event.action();

    addLog(event.text);
}


function addLog(text){

    const box=document.getElementById("log");

    const p=document.createElement("p");

    p.innerText=text;

    box.prepend(p);
}


function saveGame(){

    const data={
        player,
        turn,
        countries,
        relations
    };

    localStorage.setItem(
        "worldCommanderSave",
        JSON.stringify(data)
    );

    addLog("💾 بازی ذخیره شد.");
}


function loadGame(){

    const saved=
        localStorage.getItem("worldCommanderSave");

    if(!saved) return;

    const data=JSON.parse(saved);

    player=data.player;
    turn=data.turn;
    relations=data.relations;

    Object.assign(countries,data.countries);

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("game")
        .classList.remove("hidden");

    createCountries();
    createTargetList();
    update();

    addLog("💾 بازی قبلی بارگذاری شد.");
}


window.onload=loadGame;

</script>

</body>
                                        </html>
