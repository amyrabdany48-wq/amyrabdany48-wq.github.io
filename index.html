<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORLD EMPIRE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
--bg:#07111f;
--panel:#0b1b2e;
--panel2:#10263f;
--line:#ffffff18;
--text:#eef7ff;
--muted:#8ea5bd;
--gold:#ffc857;
--red:#ef4458;
--green:#34d17d;
--blue:#4ba9ff;
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);
font-family:Tahoma,Arial,sans-serif;
}

button,input,select{
font-family:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}

/* =========================
   COUNTRY SELECT
========================= */

#countryScreen{
position:fixed;
inset:0;
z-index:5000;
overflow:auto;
padding:25px 14px 50px;
background:
radial-gradient(circle at 20% 20%,#278bff20,transparent 35%),
radial-gradient(circle at 80% 75%,#9b6cff18,transparent 35%),
linear-gradient(135deg,#050c17,#0a1727 55%,#07101d);
}

.logo{
text-align:center;
font-size:clamp(34px,7vw,66px);
font-weight:900;
letter-spacing:3px;
color:#eaf8ff;
text-shadow:0 0 30px #49a8ff55;
}

.subtitle{
text-align:center;
color:var(--muted);
margin:8px auto 25px;
max-width:800px;
font-size:13px;
}

#countryGrid{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(170px,1fr));
gap:11px;
}

.cc{
padding:15px;
border:1px solid var(--line);
border-radius:17px;
background:
linear-gradient(145deg,#132a43f5,#091a2bf5);
transition:.2s;
}

.cc:hover{
transform:translateY(-4px);
border-color:#4ba9ff66;
}

.cc.sel{
border-color:var(--gold);
box-shadow:0 0 0 2px #ffc85718;
}

.flag{
font-size:30px;
}

.cn{
font-size:16px;
font-weight:bold;
margin-top:7px;
}

.cm{
font-size:10px;
color:var(--muted);
margin-top:4px;
}

#start{
display:block;
margin:23px auto;
padding:13px 35px;
border-radius:13px;
border:0;
background:
linear-gradient(135deg,#ffd76e,#ffb62c);
font-weight:900;
font-size:15px;
color:#101820;
}

/* =========================
   GAME
========================= */

#game{
position:fixed;
inset:0;
}

#map{
position:absolute;
inset:0;
z-index:1;
}

.leaflet-control-zoom{
display:none!important;
}

.leaflet-control-attribution{
font-size:8px!important;
}

/* =========================
   TOP BAR
========================= */

.top{
position:absolute;
z-index:1000;
top:8px;
left:8px;
right:8px;
display:flex;
gap:7px;
pointer-events:none;
}

.brand,
.stat{
background:#06101de8;
border:1px solid var(--line);
backdrop-filter:blur(12px);
box-shadow:0 12px 35px #0005;
border-radius:13px;
}

.brand{
pointer-events:auto;
padding:9px 12px;
min-width:155px;
}

.brand b{
font-size:14px;
}

.brand small{
display:block;
color:var(--muted);
font-size:9px;
margin-top:3px;
}

.stats{
flex:1;
display:grid;
grid-template-columns:
repeat(8,1fr);
gap:6px;
}

.stat{
padding:6px 8px;
min-width:0;
}

.stat small{
display:block;
color:var(--muted);
font-size:8px;
}

.stat b{
display:block;
font-size:12px;
margin-top:3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.gold{color:var(--gold)}
.green{color:var(--green)}
.red{color:var(--red)}
.blue{color:var(--blue)}

/* =========================
   WORLD PANEL
========================= */

.side{
position:absolute;
z-index:1000;
right:8px;
top:85px;
width:295px;
max-height:calc(100% - 160px);
overflow:auto;
background:#07121eea;
border:1px solid var(--line);
border-radius:17px;
backdrop-filter:blur(13px);
box-shadow:0 18px 55px #0007;
}

.side h3{
font-size:13px;
margin:0;
padding:12px;
border-bottom:1px solid var(--line);
}

#world{
padding:9px;
}

.worldRow{
display:flex;
gap:7px;
align-items:center;
padding:8px;
border-radius:11px;
background:#ffffff06;
margin-bottom:6px;
cursor:pointer;
}

.worldRow:hover{
background:#ffffff0d;
}

.worldRow .f{
font-size:21px;
}

.wi{
flex:1;
min-width:0;
}

.wi b{
display:block;
font-size:10px;
}

.wi small{
display:block;
color:var(--muted);
font-size:8px;
margin-top:3px;
}

.badge{
font-size:8px;
padding:4px 6px;
border-radius:15px;
background:#35d17d18;
color:var(--green);
}

.badge.w{
background:#ef445818;
color:var(--red);
}

.badge.y{
background:#ffc85718;
color:var(--gold);
}

/* =========================
   BOTTOM DOCK
========================= */

.dock{
position:absolute;
z-index:1100;
bottom:7px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:6px;
padding:7px;
border:1px solid var(--line);
border-radius:16px;
background:#06101df2;
backdrop-filter:blur(14px);
width:min(690px,calc(100% - 10px));
box-shadow:0 18px 55px #0008;
}

.dock button{
flex:1;
padding:9px 4px;
border-radius:10px;
background:#ffffff08;
color:#eef7ff;
border:1px solid transparent;
font-size:10px;
}

.dock button:hover{
border-color:#4ba9ff55;
background:#4ba9ff16;
}

.dock .next{
background:
linear-gradient(135deg,#19734c,#27bd70);
font-weight:bold;
}

/* =========================
   TOAST
========================= */

#toast{
position:absolute;
z-index:3000;
left:8px;
bottom:83px;
width:min(330px,calc(100% - 16px));
}

.toast{
padding:10px;
border-radius:12px;
background:#081522f5;
border:1px solid var(--line);
margin-top:6px;
box-shadow:0 12px 35px #0008;
}

.toast b{
font-size:11px;
}

.toast small{
display:block;
color:var(--muted);
font-size:9px;
margin-top:3px;
}

/* =========================
   MODAL
========================= */

#layer{
position:absolute;
z-index:4000;
inset:0;
background:#0008;
backdrop-filter:blur(4px);
display:flex;
align-items:center;
justify-content:center;
padding:12px;
}

.modal{
width:min(950px,100%);
max-height:91vh;
overflow:auto;
border-radius:20px;
background:
linear-gradient(145deg,#0b1c30,#081522);
border:1px solid #ffffff18;
box-shadow:0 30px 100px #000b;
}

.mh{
position:sticky;
top:0;
z-index:3;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 16px;
background:#091827f5;
border-bottom:1px solid var(--line);
}

.mh b{
font-size:15px;
}

.close{
width:31px;
height:31px;
border-radius:9px;
background:#ffffff0a;
color:#fff;
border:0;
font-size:18px;
}

.mb{
padding:14px;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.grid3{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:9px;
}

.card{
padding:12px;
border-radius:14px;
background:#ffffff06;
border:1px solid var(--line);
}

.card h3{
font-size:12px;
margin:0 0 7px;
}

.card p{
font-size:10px;
line-height:1.8;
color:var(--muted);
margin:4px 0;
}

.big{
font-size:21px;
font-weight:900;
}

.action{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
background:
linear-gradient(135deg,#1c6fb4,#2b93dc);
color:#fff;
font-weight:bold;
border:0;
}

.action.red{
background:
linear-gradient(135deg,#8a2c3b,#d94c60);
}

.action.green{
background:
linear-gradient(135deg,#19744d,#27bc70);
}

.action.gold{
background:
linear-gradient(135deg,#b57918,#e9ae3d);
color:#101010;
}

.notice{
padding:10px;
border-radius:11px;
background:#ffc8570b;
border:1px solid #ffc85722;
color:#cbd9e6;
font-size:10px;
line-height:1.8;
}

/* =========================
   COUNTRY INFO
========================= */

.hero{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.flagbox{
display:flex;
align-items:center;
gap:10px;
padding:12px;
border-radius:13px;
background:#ffffff06;
border:1px solid var(--line);
}

.flagbox span{
font-size:38px;
}

.flagbox b{
font-size:14px;
}

.flagbox small{
display:block;
color:var(--muted);
font-size:9px;
margin-top:3px;
}

.power{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:6px;
margin:10px 0;
}

.power div{
text-align:center;
padding:8px;
border-radius:9px;
background:#ffffff06;
}

.power small{
display:block;
color:var(--muted);
font-size:8px;
}

.power b{
display:block;
font-size:11px;
margin-top:3px;
}

/* =========================
   ARMY
========================= */

.units{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:8px;
}

.unit{
padding:10px;
border-radius:12px;
background:#ffffff06;
border:1px solid var(--line);
}

.unit .ico{
font-size:23px;
}

.unit b{
display:block;
font-size:10px;
margin-top:4px;
}

.unit small{
display:block;
color:var(--muted);
font-size:8px;
line-height:1.7;
margin-top:3px;
}

.qty{
color:#3de0dc!important;
font-size:10px!important;
font-weight:bold;
}

.unit button{
width:100%;
padding:6px;
border:0;
border-radius:8px;
background:#4ba9ff12;
color:#dceeff;
font-size:8px;
margin-top:5px;
}

/* =========================
   METER
========================= */

.meter{
height:10px;
background:#182b40;
border-radius:10px;
overflow:hidden;
}

.meter i{
display:block;
height:100%;
background:
linear-gradient(90deg,#ef4458,#ffc857,#35d17d);
transition:.4s;
}

/* =========================
   NEWS
========================= */

.news{
display:flex;
gap:9px;
padding:9px 2px;
border-bottom:1px solid var(--line);
}

.news .ni{
width:31px;
height:31px;
display:grid;
place-items:center;
border-radius:9px;
background:#4ba9ff12;
}

.news b{
font-size:10px;
}

.news p{
margin:3px 0;
color:var(--muted);
font-size:9px;
line-height:1.7;
}

.news small{
font-size:7px;
color:#668099;
}

.tabs{
display:flex;
gap:5px;
overflow:auto;
margin-bottom:10px;
}

.tabs button{
white-space:nowrap;
padding:7px 10px;
border-radius:9px;
background:#ffffff08;
color:var(--muted);
border:0;
}

.tabs button.active{
background:#4ba9ff18;
color:#fff;
}

select{
width:100%;
padding:10px;
background:#10263f;
color:#fff;
border:1px solid var(--line);
border-radius:10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

.brand{
display:none;
}

.stats{
grid-template-columns:
repeat(4,1fr);
}

.side{
display:none;
}

.dock button{
font-size:8px;
}

.units{
grid-template-columns:1fr 1fr;
}

.grid3{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:520px){

.stats .stat:nth-child(n+5){
display:none;
}

.stats{
grid-template-columns:
repeat(4,1fr);
}

.grid2,
.hero{
grid-template-columns:1fr;
}

.grid3{
grid-template-columns:1fr;
}

.power{
grid-template-columns:
1fr 1fr;
}

}
</style>
</head>

<!-- =========================
     COUNTRY SCREEN
========================= -->

<section id="countryScreen">

<div class="logo">
WORLD EMPIRE
</div>

<div class="subtitle">
یک کشور انتخاب کن و جهان را با اقتصاد، دیپلماسی، مدیریت و ارتش خود متحول کن.
</div>

<div id="countryGrid"></div>

<button id="start">
شروع امپراتوری
</button>

</section>


<!-- =========================
     GAME
========================= -->

<main id="game" class="hidden">

<div id="map"></div>

<div class="top">

<div class="brand">
<b id="title">WORLD EMPIRE</b>

</div>

<div class="stats">

<div class="stat">
<small>خزانه</small>
<b id="money" class="gold">0</b>
</div>

<div class="stat">
<small>جمعیت</small>
<b id="pop">0</b>
</div>

<div class="stat">
<small>تولید</small>
<b id="prod" class="green">0</b>
</div>

<div class="stat">
<small>قدرت ارتش</small>
<b id="power" class="red">0</b>
</div>

<div class="stat">
<small>اعتبار</small>
<b id="rep" class="blue">0%</b>
</div>

<div class="stat">
<small>قلمرو</small>
<b id="lands">0</b>
</div>

<div class="stat">
<small>زمان</small>
<b id="time">سال 1 / روز 1</b>
</div>

<div class="stat">
<small>تورم</small>
<b id="infl">0%</b>
</div>

</div>
</div>


<!-- WORLD PANEL -->

<aside class="side">

<h3>
🌍 قدرت‌های جهان
</h3>

<div id="world"></div>

</aside>


<div id="toast"></div>


<!-- DOCK -->

<nav class="dock">

<button onclick="store()">
🏪 فروشگاه
</button>

<button onclick="gov()">
🏛 دولت
</button>

<button onclick="army()">
🛡 ارتش
</button>

<button onclick="war()">
⚔ جنگ
</button>

<button onclick="myCountry()">
🏳 کشور
</button>

<button onclick="news()">
📰 اخبار
</button>

<button class="next" onclick="nextDay()">
⏩ روز بعد
</button>

</nav>

</main>


<!-- MODAL -->

<div id="layer" class="hidden">

<div id="modal" class="modal"></div>

</div>

/* =====================================================

===================================================== */

function fid(f){

let p=f.properties||{};

return String(
p.ISO_A3||
p.ISO_A3_EH||
p.ADM0_A3||
p["ISO3166-1-Alpha-3"]||
""
).toUpperCase();

}


function mapColor(id){

if(
id===S.player||
conquered(id)
){

return "#e63946";

}

let i=
countries.findIndex(
c=>c.id===id
);

return colors[
(i<0?0:i)%colors.length
];

}


function style(f){

return{

color:"#fff",

weight:.7,

fillColor:mapColor(fid(f)),

fillOpacity:.76

};

}


function initMap(){

map=L.map(
"map",
{
worldCopyJump:false,
zoomControl:false,
minZoom:2,
maxZoom:7
}
).setView(
[25,10],
2
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);


fetch(MAP_GEOJSON)

.then(r=>r.json())

.then(data=>{

geo=L.geoJSON(
data,
{

style,

onEachFeature:(f,l)=>{

l.on({

click:()=>info(fid(f)),

mouseover:e=>
e.target.setStyle(
{
weight:2,
color:"#fff",
fillOpacity:.9
}
),

mouseout:e=>
geo.resetStyle(e.target)

});

}

}

).addTo(map);

})

.catch(()=>{

toast(
"نقشه",
"اتصال برای دریافت نقشه برقرار نشد."
);

});

}


function recolor(){

if(!geo)return;

geo.eachLayer(
l=>l.setStyle(style(l.feature))
);

}

S.day++;

if(S.day>365){

}


S.money+=
S.prod*
(1-S.infl/300)+
S.cities*3;


S.pop*=1.00003;


S.infl=
clamp(
S.infl+rnd(-.08,.1),
0,
30
);


S.stability=
clamp(
S.stability+rnd(-.5,.45),
0,
100
);


S.cp=
clamp(
S.cp+3,
0,
150
);


S.readiness=
clamp(
S.readiness+
S.logistics*.008-
S.exhaust*.025-
rnd(0,.3),
0,
100
);


S.exhaust=
clamp(
S.exhaust-.5,
0,
100
);


let upkeep=0;

for(
const[k,q]
of Object.entries(S.units)
){

upkeep+=
q*
units[k][6]/
100;

}

S.money=
Math.max(
0,
S.money-upkeep
);


aiTick();

resolveWars();

S.day-S.lastNews>=3

worldNews();

S.lastNews=S.day;

}

Math.random()<.15

randomEvent();

}


render();

}

let i=0;
i<24;
i++

100

/* =====================================================
   WAR
===================================================== */

function warCost(){

return 500+
S.wars.length*250+
S.exhaust*8;

}


function war(id=null){

if(!id){

let a=
countries.find(
c=>
c.id!==S.player&&
!conquered(c.id)
);

id=a?.id;

}

S.target=id;

renderWar();

}


function declareWar(id){

if(S.cp<20){

return toast(
"فرماندهی ناکافی",
"برای جنگ ۲۰ امتیاز فرماندهی لازم است."
);

}


if(S.money<warCost()){

return toast(
"خزانه ناکافی",
"هزینه آماده‌سازی جنگ را ندارید."
);

}


if(
S.wars.some(
w=>w.target===id
)
)return;


S.cp-=20;

S.money-=warCost();

S.exhaust+=8;


S.wars.push({

target:id,

turns:0,

progress:0,

aloss:0,

dloss:0

});


newsAdd(
"war",
"⚔️ اعلام جنگ",
`${C(S.player).name} علیه ${C(id).name} وارد جنگ شد.`,
id
);


toast(
"⚔️ جنگ آغاز شد",
`نبرد با ${C(id).name} شروع شد.`
);


renderWar();

}


/* =====================================================
   RESOLVE WARS
===================================================== */

function resolveWars(){

[...S.wars]
.forEach(battle);

}


function battle(w){

let atk=
power()*
rnd(.88,1.12);


let def=
targetPower(w.target)*
rnd(.88,1.12);


let bonus=
(
S.units.recon>500
?
1.04
:
1
)+
(
S.units.logistics>500
?
.03
:
0
);


let d=
clamp(
(
atk*bonus/def-1
)*13,
-10,
12
);


if(S.stability<40){

d-=3;

}


if(S.exhaust>55){

d-=4;

}


w.progress=
clamp(
w.progress+d,
-100,
100
);


w.turns++;


let loss=
Math.max(
30,
Math.round(
Math.min(atk,def)*.012
)
);


w.aloss+=
Math.round(
loss*
(d<0?1.25:.82)
);


w.dloss+=
Math.round(
loss*
(d>0?1.28:.8)
);


S.exhaust=
clamp(
S.exhaust+rnd(.5,1.8),
0,
100
);


S.morale=
clamp(
S.morale+
(
d>0
?
rnd(.1,.7)
:
rnd(-1.2,-.2)
),
0,
100
);


S.readiness=
clamp(
S.readiness+
rnd(-1.3,.2),
0,
100
);


if(w.progress>=100){

return win(w);

}


if(w.progress<=-100){

return lose(w);

}

}

function recruit(k){

let u=units[k];

let q=
k==="infantry"
?
1000
:
100;


let cost=
u[5]*q/100;


if(S.money<cost){

return toast(
"خزانه ناکافی",
"بودجه کافی نیست."
);

}


S.money-=cost;

S.units[k]+=q;

clamp(
S.readiness+1.2,
0,
100
);


toast(
"🛡️ ارتش تقویت شد",
`${q.toLocaleString("fa-IR")} واحد ${u[0]} اضافه شد.`

/* =====================================================
   NEWS FILTER
===================================================== */

function filterNews(type,el){

document
.querySelectorAll(".tabs button")
.forEach(
b=>b.classList.remove("active")
);


if(el){

el.classList.add("active");

}


let a=
type==="all"
?
S.news
:
S.news.filter(
x=>x.type===type
);


let icons={

war:"⚔️",

peace:"🕊️",

conquest:"🏴",

economy:"💰",

development:"🏗️",

diplomacy:"🌐"

};


document.getElementById("newsList").innerHTML=

a.length

?

a.map(
x=>`

<div class="news">

<div class="ni">
${icons[x.type]||"📰"}
</div>

<div>

<b>
${x.title}
</b>

<p>
${x.text}
</p>

<small>
سال ${x.year}
—
روز ${x.day}
—
ساعت ${String(x.hour).padStart(2,"0")}:00
</small>

</div>

</div>

`
).join("")

:

`
<div class="notice">
خبری وجود ندارد.
</div>
`;

}
