<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06131d">
<title>GLOBAL DOMINION</title>

<style>
:root{
    --bg:#03090e;
    --bg2:#071824;
    --panel:#0a1d29;
    --panel2:#102938;
    --line:rgba(255,255,255,.11);
    --line2:rgba(255,255,255,.20);
    --text:#effaff;
    --muted:#92a8b6;
    --green:#35dda9;
    --red:#ff5a72;
    --blue:#51bfff;
    --purple:#a978ff;
    --gold:#ffca61;
    --orange:#ff9d4f;
    --cyan:#4be7ee;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    color:inherit;
}

body{
    background:
        radial-gradient(circle at 20% 10%,rgba(38,135,174,.13),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(30,145,108,.10),transparent 25%),
        #03090e;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* =========================================================
   WORLD MAP
========================================================= */

#mapViewport{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 45% 40%,#12364a 0%,#082131 45%,#04131d 100%);
    touch-action:none;
}

#worldSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    user-select:none;
}

.ocean-grid{
    opacity:.12;
}

.continent-base{
    fill:#173d49;
    stroke:#557988;
    stroke-width:1.3;
    vector-effect:non-scaling-stroke;
}

.country-region{
    cursor:pointer;
    stroke:rgba(225,245,255,.40);
    stroke-width:.7;
    vector-effect:non-scaling-stroke;
    transition:
        filter .14s ease,
        opacity .14s ease,
        stroke-width .14s ease;
}

.country-region:hover{
    filter:brightness(1.24);
    stroke:white;
    stroke-width:1.5;
}

.country-region.player{
    stroke:#ffffff;
    stroke-width:2.4;
    filter:
        brightness(1.22)
        drop-shadow(0 0 8px rgba(53,221,169,.8));
}

.country-region.selected{
    stroke:#ffe071;
    stroke-width:2.6;
    filter:
        brightness(1.25)
        drop-shadow(0 0 7px rgba(255,214,84,.72));
}

.country-region.enemy{
    stroke:#ff526c;
    stroke-width:2.3;
    filter:
        drop-shadow(0 0 8px rgba(255,70,95,.7));
}

.country-region.ally{
    stroke:#55c1ff;
    stroke-width:2;
}

.country-region.sanctioned{
    stroke:#ffca61;
    stroke-width:2;
    stroke-dasharray:4 3;
}

.island-country{
    cursor:pointer;
    stroke:white;
    stroke-width:.7;
    vector-effect:non-scaling-stroke;
}

.island-country.player{
    stroke:#3effbd;
    stroke-width:2.2;
}

.island-country.selected{
    stroke:#ffe071;
    stroke-width:2.4;
}

#routeLayer path{
    fill:none;
    vector-effect:non-scaling-stroke;
    pointer-events:none;
}

.trade-route{
    stroke:#36e1b0;
    stroke-width:1.8;
    stroke-dasharray:6 5;
    opacity:.8;
    animation:dash 1.3s linear infinite;
}

.alliance-route{
    stroke:#58bfff;
    stroke-width:1.5;
    opacity:.65;
}

.war-route{
    stroke:#ff516c;
    stroke-width:2.6;
    stroke-dasharray:8 5;
    opacity:.95;
    filter:drop-shadow(0 0 5px rgba(255,70,95,.7));
    animation:dash .8s linear infinite;
}

@keyframes dash{
    to{
        stroke-dashoffset:-28;
    }
}

#mapInfo{
    position:absolute;
    left:12px;
    top:79px;
    z-index:25;
    background:rgba(5,18,27,.90);
    border:1px solid var(--line);
    border-radius:11px;
    padding:7px 10px;
    color:var(--muted);
    font-size:9px;
    pointer-events:none;
}

/* =========================================================
   TOP HUD
========================================================= */

#topbar{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    z-index:40;
    height:61px;
    display:flex;
    gap:7px;
    pointer-events:none;
}

.brand{
    pointer-events:auto;
    width:186px;
    min-width:186px;
    height:58px;
    border:1px solid var(--line);
    border-radius:17px;
    background:rgba(6,21,31,.96);
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 11px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    backdrop-filter:blur(15px);
}

.brand-logo{
    min-width:41px;
    width:41px;
    height:41px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:
        linear-gradient(
            145deg,
            #40e5b1,
            #17785b
        );
    color:#03110d;
    font-size:23px;
    box-shadow:0 0 25px rgba(53,221,169,.16);
}

.brand b{
    display:block;
    font-size:12px;
}

.brand small{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:8px;
}

.resources{
    pointer-events:auto;
    flex:1;
    height:58px;
    display:flex;
    gap:6px;
    overflow:auto hidden;
    scrollbar-width:none;
}

.resource{
    min-width:84px;
    height:57px;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(7,23,34,.94);
    padding:7px 9px;
    backdrop-filter:blur(14px);
}

.resource small{
    display:block;
    font-size:8px;
    color:var(--muted);
}

.resource b{
    display:block;
    margin-top:5px;
    white-space:nowrap;
    font-size:11px;
}

/* =========================================================
   MAP TOOLS
========================================================= */

#mapTools{
    position:absolute;
    left:12px;
    top:115px;
    z-index:35;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.map-tool{
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(6,20,30,.93);
    cursor:pointer;
    font-size:16px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.map-tool.active,
.map-tool:hover{
    background:#155a48;
    border-color:#3bddaa;
}

/* =========================================================
   RIGHT SIDE PANEL
========================================================= */

#sidePanel{
    position:absolute;
    z-index:34;
    right:10px;
    top:79px;
    bottom:90px;
    width:285px;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(6,20,29,.95);
    overflow:hidden;
    box-shadow:0 20px 55px rgba(0,0,0,.4);
    backdrop-filter:blur(16px);
}

.side-head{
    height:48px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 13px;
    font-size:10px;
}

#sideBody{
    position:absolute;
    top:49px;
    left:0;
    right:0;
    bottom:0;
    overflow:auto;
    padding:9px;
}

/* =========================================================
   BOTTOM DOCK
========================================================= */

#dock{
    position:absolute;
    z-index:45;
    left:50%;
    bottom:9px;
    transform:translateX(-50%);
    height:70px;
    max-width:calc(100% - 18px);
    display:flex;
    gap:5px;
    overflow:auto hidden;
    scrollbar-width:none;
    padding:7px;
    border:1px solid var(--line);
    border-radius:19px;
    background:rgba(5,18,27,.96);
    box-shadow:0 15px 50px rgba(0,0,0,.45);
    backdrop-filter:blur(17px);
}

.dock-btn{
    min-width:68px;
    border:0;
    border-radius:13px;
    background:transparent;
    cursor:pointer;
}

.dock-btn:hover{
    background:rgba(255,255,255,.07);
}

.dock-btn span{
    display:block;
    font-size:20px;
}

.dock-btn small{
    display:block;
    margin-top:3px;
    font-size:8px;
    color:#c4d5de;
}

/* =========================================================
   UI COMPONENTS
========================================================= */

.card{
    width:100%;
    display:block;
    border:1px solid var(--line);
    border-radius:14px;
    background:
        linear-gradient(
            145deg,
            rgba(20,42,55,.94),
            rgba(9,28,39,.94)
        );
    margin-bottom:8px;
    padding:10px;
    text-align:right;
    color:var(--text);
}

button.card{
    cursor:pointer;
}

button.card:hover{
    border-color:rgba(53,221,169,.5);
}

.card-head{
    display:flex;
    gap:8px;
    align-items:center;
}

.icon{
    min-width:38px;
    width:38px;
    height:38px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.07);
    font-size:19px;
}

.card-title{
    font-size:10px;
    font-weight:bold;
}

.card-sub{
    margin-top:3px;
    color:var(--muted);
    font-size:8px;
}

.card-desc{
    margin-top:8px;
    color:#c8d7df;
    font-size:9px;
    line-height:1.9;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );
    gap:7px;
}

.kpis{
    display:grid;
    grid-template-columns:
        repeat(
            4,
            minmax(0,1fr)
        );
    gap:7px;
    margin-bottom:9px;
}

.kpi{
    min-height:62px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px;
    background:rgba(255,255,255,.035);
}

.kpi small{
    display:block;
    color:var(--muted);
    font-size:8px;
}

.kpi b{
    display:block;
    margin-top:6px;
    font-size:11px;
    word-break:break-word;
}

.row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
}

.btn{
    min-height:36px;
    border:1px solid var(--line2);
    border-radius:10px;
    padding:7px 10px;
    background:#193343;
    cursor:pointer;
    font-size:9px;
}

.btn:hover{
    filter:brightness(1.13);
}

.btn.green{
    background:#17614d;
}

.btn.red{
    background:#792c40;
}

.btn.blue{
    background:#1b5677;
}

.btn.purple{
    background:#543c79;
}

.btn.gold{
    background:#665222;
}

.btn.orange{
    background:#77462b;
}

.btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.tabs{
    display:flex;
    gap:5px;
    overflow:auto hidden;
    scrollbar-width:none;
    margin-bottom:9px;
    padding-bottom:2px;
}

.tab{
    min-height:35px;
    white-space:nowrap;
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 9px;
    background:rgba(255,255,255,.04);
    cursor:pointer;
    font-size:8px;
}

.tab.active{
    background:#17614c;
    border-color:#39dfab;
}

.notice{
    border:1px solid var(--line);
    border-radius:12px;
    padding:9px;
    margin-bottom:8px;
    background:rgba(255,255,255,.035);
    color:#c1d2dc;
    line-height:1.8;
    font-size:9px;
}

.notice.good{
    background:rgba(31,140,103,.14);
    border-color:rgba(55,220,169,.35);
}

.notice.warn{
    background:rgba(136,96,29,.14);
    border-color:rgba(255,199,81,.38);
}

.notice.bad{
    background:rgba(135,35,54,.16);
    border-color:rgba(255,82,108,.4);
}

.section-title{
    margin:12px 2px 7px;
    font-size:10px;
    font-weight:bold;
}

.progress{
    width:100%;
    height:7px;
    border-radius:99px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
    margin-top:8px;
}

.progress>div{
    height:100%;
    border-radius:inherit;
    background:
        linear-gradient(
            90deg,
            #31dda8,
            #50cfff
        );
}

.search{
    width:100%;
    height:41px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#0a202e;
    color:white;
    outline:0;
    padding:0 11px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:8px;
}

th,
td{
    padding:7px 5px;
    border-bottom:1px solid var(--line);
    text-align:right;
}

/* =========================================================
   MODAL
========================================================= */

#modal{
    position:fixed;
    inset:0;
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    padding:14px;
    background:rgba(0,4,7,.68);
    backdrop-filter:blur(5px);
}

#modal.show{
    display:flex;
}

.modal-box{
    width:min(920px,100%);
    max-height:92vh;
    border:1px solid var(--line2);
    border-radius:20px;
    background:
        linear-gradient(
            145deg,
            #0a202d,
            #061722
        );
    overflow:hidden;
    box-shadow:0 35px 100px rgba(0,0,0,.68);
}

.modal-head{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:1px solid var(--line);
}

.modal-head b{
    font-size:11px;
}

.close-btn{
    width:34px;
    height:34px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#142b39;
    cursor:pointer;
}

#modalBody{
    max-height:calc(92vh - 55px);
    overflow:auto;
    padding:12px;
}

/* =========================================================
   TOAST
========================================================= */

#toasts{
    position:fixed;
    left:12px;
    bottom:90px;
    width:min(310px,calc(100% - 24px));
    z-index:600;
    pointer-events:none;
}

.toast{
    margin-top:6px;
    padding:9px 11px;
    border:1px solid var(--line2);
    border-radius:11px;
    background:rgba(8,28,39,.97);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    font-size:9px;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:700;
    overflow:auto;
    padding:20px;
    background:
        radial-gradient(circle at 50% 15%,rgba(37,184,144,.23),transparent 30%),
        radial-gradient(circle at 10% 70%,rgba(48,97,170,.15),transparent 28%),
        linear-gradient(180deg,#071824,#02090e);
}

.start-wrap{
    width:min(1120px,100%);
    margin:auto;
}

.hero{
    text-align:center;
    margin:18px auto 24px;
}

.hero-logo{
    width:84px;
    height:84px;
    margin:auto;
    border-radius:25px;
    display:grid;
    place-items:center;
    font-size:44px;
    background:
        linear-gradient(
            145deg,
            #3de2ae,
            #17765a
        );
    color:#03110d;
    box-shadow:0 18px 60px rgba(53,221,169,.19);
}

.hero h1{
    margin:13px 0 5px;
    font-size:25px;
}

.hero p{
    color:var(--muted);
    font-size:9px;
    line-height:1.8;
}

.start-tools{
    display:grid;
    grid-template-columns:1fr 180px;
    gap:8px;
    margin-bottom:10px;
}

#countryList{
    display:grid;
    grid-template-columns:
        repeat(
            4,
            minmax(0,1fr)
        );
    gap:7px;
}

.country-choice{
    min-height:103px;
    border:1px solid var(--line);
    border-radius:14px;
    background:
        linear-gradient(
            145deg,
            #0d2634,
            #081d29
        );
    cursor:pointer;
    text-align:right;
    padding:10px;
}

.country-choice:hover{
    border-color:#3ee0ad;
    transform:translateY(-1px);
}

.choice-head{
    display:flex;
    align-items:center;
    gap:8px;
}

.choice-flag{
    font-size:29px;
}

.country-choice b{
    font-size:10px;
}

.country-choice small{
    display:block;
    margin-top:5px;
    color:var(--muted);
    font-size:8px;
}

/* =========================================================
   AI INBOX
========================================================= */

.ai-proposal{
    border-right:3px solid var(--blue);
}

.ai-proposal.war{
    border-right-color:var(--red);
}

.ai-proposal.trade{
    border-right-color:var(--green);
}

.ai-proposal.alliance{
    border-right-color:var(--purple);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    #sidePanel{
        width:245px;
    }

    #countryList{
        grid-template-columns:
            repeat(
                3,
                minmax(0,1fr)
            );
    }

}

@media(max-width:700px){

    #sidePanel{
        display:none;
    }

    .brand{
        min-width:57px;
        width:57px;
        padding:7px;
    }

    .brand>div:last-child{
        display:none;
    }

    .resource{
        min-width:74px;
    }

    #countryList{
        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
    }

    .grid{
        grid-template-columns:1fr;
    }

    .kpis{
        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
    }

    .start-tools{
        grid-template-columns:1fr;
    }

}

@media(max-width:420px){

    #countryList{
        grid-template-columns:1fr 1fr;
    }

    .country-choice{
        min-height:94px;
    }

}
</style>
</head>

function hashString(
    text
)
{

    let hash=
        2166136261;

    const string=
        String(
            text
        );

    for(
        let index=
            0;
        index<
            string.length;
        index++
    )
    {

        hash^=
            string.charCodeAt(
                index
            );

        hash=
            Math.imul(
                hash,
                16777619
            );

    }

    return hash>>>
    0;

}

function seeded(
    key,
    min,
    max
)
{

    return min+
    (
        hashString(
            key
        )%
        100000
    )/
    100000*
    (
        max-
        min
    );

}

function safe(
    text
)
{

    return String(
        text??
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    );

}

function money(
    value
)
{

    const number=
        Number(
            value
        )||
        0;

    if(
        Math.abs(
            number
        )>=
        1000000000000
    )
    {

        return "$"+
        (
            number/
            1000000000000
        )
        .toFixed(
            2
        )+
        "T";

    }

    if(
        Math.abs(
            number
        )>=
        1000000000
    )
    {

        return "$"+
        (
            number/
            1000000000
        )
        .toFixed(
            2
        )+
        "B";

    }

    if(
        Math.abs(
            number
        )>=
        1000000
    )
    {

        return "$"+
        (
            number/
            1000000
        )
        .toFixed(
            1
        )+
        "M";

    }

    if(
        Math.abs(
            number
        )>=
        1000
    )
    {

        return "$"+
        (
            number/
            1000
        )
        .toFixed(
            1
        )+
        "K";

    }

    return "$"+
    number
    .toFixed(
        0
    );

}

function numberShort(
    value,
    digits=
        1
)
{

    const number=
        Number(
            value
        )||
        0;

    if(
        Math.abs(
            number
        )>=
        1000000000
    )
    {

        return(
            number/

function percent(
    value
)
{

        value,
        0,
        100
    )

}

function flagEmoji(
    iso2
)
{

    return String(
        iso2
    )
    .toUpperCase()
    .replace(
        /./g,
        character=>
        String.fromCodePoint(
            127397+
            character.charCodeAt(
                0
            )
        )
    );

}

function toast(
    text
)
{

    const element=
        document.createElement(
            "div"
        );

    element.className=
        "toast";

    element.textContent=
        text;

    $("toasts")
    .appendChild(
        element
    );

    setTimeout(
        ()=>
        element.remove(),
        3000
    );

}

function openModal(
    title,
    body
)
{

function closeModal()
{

    $("modal")
    .classList.remove(
        "show"

}

            base.appendChild(
                path

        }
    );

/* =========================================================
   POLYGON CLIPPING FOR SIMPLE COUNTRY REGIONS
========================================================= */

function clipPolygonHalfPlane(
    polygon,
    a,
    b,
    c
)
{

    if(
        !polygon.length
    )
    {

        return [];

    }

    const result=
        [];

    function inside(
        point
    )
    {

        return a*
        point[
            0
        ]+
        b*
        point[
            1
        ]<=
        c+
        .0001;

    }

    function intersection(
        first,
        second
    )
    {

        const dx=
            second[
                0
            ]-
            first[
                0
            ];

        const dy=
            second[
                1
            ]-
            first[
                1
            ];

        const denominator=
            a*
            dx+
            b*
            dy;

        if(
            Math.abs(
                denominator
            )<
            .000001
        )
        {

            return first;

        }

        const t=
            (
                c-
                a*
                first[
                    0
                ]-
                b*
                first[
                    1
                ]
            )/
            denominator;

        return[
            first[
                0
            ]+
            dx*
            t,
            first[
                1
            ]+
            dy*
            t
        ];

    }

    for(
        let index=
            0;
        index<
            polygon.length;
        index++
    )
    {

        const current=
            polygon[
                index
            ];

        const previous=
            polygon[
                (
                    index-
                    1+
                    polygon.length
                )%
                polygon.length
            ];

        const currentInside=
            inside(
                current
            );

        const previousInside=
            inside(
                previous
            );

        if(
            currentInside
        )
        {

            if(
                !previousInside
            )
            {

                result.push(
                    intersection(
                        previous,
                        current
                    )
                );

            }

            result.push(
                current
            );

        }
        else
        if(
            previousInside
        )
        {

            result.push(
                intersection(
                    previous,
                    current
                )
            );

        }

    }

    return result;

}

function voronoiCell(
    current,
    points,
    bounds
)
{

    let polygon=
    [
        [
            bounds[
                0
            ],
            bounds[
                1
            ]
        ],
        [
            bounds[
                2
            ],
            bounds[
                1
            ]
        ],
        [
            bounds[
                2
            ],
            bounds[
                3
            ]
        ],
        [
            bounds[
                0
            ],
            bounds[
                3
            ]
        ]
    ];

    for(
        const other of
        points
    )
    {

        if(
            other.code===
            current.code
        )
        {

            continue;

        }

        const dx=
            other.x-
            current.x;

        const dy=
            other.y-
            current.y;

        const midpointX=
            (
                current.x+
                other.x
            )/
            2;

        const midpointY=
            (
                current.y+
                other.y
            )/
            2;

        const a=
            dx;

        const b=
            dy;

        const c=
            dx*
            midpointX+
            dy*
            midpointY;

        polygon=
            clipPolygonHalfPlane(
                polygon,
                a,
                b,
                c
            );

        if(
            !polygon.length
        )
        {

            break;

        }

    }

    return polygon;

}

function polygonToPath(
    polygon
)
{

    if(
        !polygon||
        polygon.length<
        3
    )
    {

        return "";

    }

    return "M"+
    polygon
    .map(
        point=>
        point[
            0
        ]
        .toFixed(
            1
        )+
        ","+
        point[
            1
        ]
        .toFixed(
            1
        )
    )
    .join(
        "L"
    )+
    "Z";

}

/* =========================================================
   GENERATE MAP SEEDS FOR ALL COUNTRIES
========================================================= */

const COUNTRY_POINTS=
{};

function generatedSeed(
    code,
    continent
)
{

    const bounds=
        CONTINENT_BOUNDS[
            continent
        ];

    const hash=
        hashString(
            code
        );

    const x=
        bounds[
            0
        ]+
        (
            (
                hash&
                65535
            )/
            65535
        )*
        (
            bounds[
                2
            ]-
            bounds[
                0
            ]
        );

    const y=
        bounds[
            1
        ]+
        (
            (
                (
                    hash>>>
                    16
                )&
                65535
            )/
            65535
        )*
        (
            bounds[
                3
            ]-
            bounds[
                1
            ]
        );

    return[
        x,
        y
    ];

}

function prepareCountryPoints()
{

    for(
        const code of
        COUNTRY_CODES
    )
    {

        const continent=
            continentOf(
                code
            );

        const seed=
            COUNTRY_SEEDS[
                code
            ]||
            generatedSeed(
                code,
                continent
            );

        COUNTRY_POINTS[
            code
        ]=
        {
            code:
                code,

            continent:
                continent,

            x:
                seed[
                    0
                ],

            y:
                seed[
                    1
                ]
        };

    }

}

function countryProfile(
    code
)
{

    if(
        MAJOR_PROFILES[
            code
        ]
    )
    {

        return{
            ...MAJOR_PROFILES[
                code
            ]
        };

    }

    const population=
        seeded(
            code+
            "-pop",
            .2,
            110
        );

    const industry=
        seeded(
            code+
            "-industry",
            28,
            84
        );

    const technology=
        seeded(
            code+
            "-technology",
            30,
            88
        );

    const military=
        seeded(
            code+
            "-military",
            25,
            82
        );

    const gdp=
        Math.max(
            3000,
            population*
            industry*
            seeded(
                code+
                "-gdp",
                90,
                460
            )
        );

    const oil=
        seeded(
            code+
            "-oil",
            25,
            125
        );

    return{
        population:
            population,

        industry:
            industry,

        technology:
            technology,

        military:
            military,

        gdp:
            gdp,

        oil:
            oil
    };

}

        )

            const personality=

/* =========================================================

========================================================= */

function relation(
    code
)
{

    if(
        !Number.isFinite(
            Number(
                state.relations[
                    code
                ]
            )
        )
    )
    {

        state.relations[
            code
        ]=
            randomInt(
                -10,
                25
            );

    }

    return Number(
        state.relations[
            code
        ]
    );

}

function setRelation(
    code,
    value
)
{

    state.relations[
        code
    ]=
        clamp(
            value,
            -100,
            100
        );

}

function changeRelation(
    code,
    amount
)
{

    setRelation(
        code,
        relation(
            code
        )+
        amount
    );

}

function isAlly(
    code
)
{

    return state.alliances
    .some(
        item=>
        item.code===
        code
    );

}

function hasTrade(
    code
)
{

    return state.tradeAgreements
    .some(
        item=>
        item.code===
        code
    );

}

function hasNonAggression(
    code
)
{

    return state.nonAggression
    .some(
        item=>
        item.code===
        code
    );

}

function isSanctioned(
    code
)
{

    return state.sanctions
    .some(
        item=>
        item.code===
        code
    );

}

function activeWar(
    code
)
{

    return state.wars
    .find(
        war=>
        war.status===
        "active"&&
        (
            war.attacker===
            code||
            war.defender===
            code
        )
    )||
    null;

}

function playerWarAgainst(
    code
)
{

    return state.wars
    .find(
        war=>
        war.status===
        "active"&&
        (
            (
                war.attacker===
                state.player&&
                war.defender===
                code
            )||
            (
                war.defender===
                state.player&&
                war.attacker===
                code
            )
        )
    )||
    null;

}

const SVG_NS=
"http://www.w3.org/2000/svg";

function createSvg(
    tag
)
{

    return document.createElementNS(
        SVG_NS,
        tag
    );

}

function countryFill(
    code
)
{

    if(
        !state.started
    )
    {

        return politicalColor(
            code
        );

    }

    if(
        state.map.mode===
        "political"
    )
    {

        if(
            code===
            state.player
        )
        {

            return "#1da77d";

        }

        return politicalColor(
            code
        );

    }

    if(
        state.map.mode===
        "economy"
    )
    {

        const value=
            code===
            state.player
            ?
            state.nation.industry
            :
            state.ai[
                code
            ]?.
            economy||
            50;

        const light=
            clamp(
                20+
                value*
                .45,
                20,
                66
            );

        return `hsl(145 55% ${light}%)`;

    }

    if(
        state.map.mode===
        "military"
    )
    {

        const value=
            code===
            state.player
            ?
            calculateMilitaryPower()
            :
            state.ai[
                code
            ]?.
            military||
            50;

        const light=
            clamp(
                23+
                value*
                .30,
                23,
                58
            );

        return `hsl(352 60% ${light}%)`;

    }

    if(
        state.map.mode===
        "diplomacy"
    )
    {

        if(
            code===
            state.player
        )
        {

            return "#28c997";

        }

        const value=
            relation(
                code
            );

        if(
            value>
            60
        )
        {

            return "#3d9bd6";

        }

        if(
            value>
            20
        )
        {

            return "#458c78";

        }

        if(
            value>
            -20
        )
        {

            return "#6c7781";

        }

        if(
            value>
            -60
        )
        {

            return "#9a6658";

        }

        return "#af394b";

    }

    return politicalColor(
        code
    );

}

        const point of
        Object.values(
            COUNTRY_POINTS
        )
    )
    {

        groups[
            point.continent
        ]
        .push(
            point
        );

    }

    for(
        const[
            continent,
            points
        ]of
        Object.entries(
            groups
        )
    )
    {

        const layer=
            $(
                "countryLayer"+
                continent
            );

        layer.innerHTML=
            "";

        const bounds=
            CONTINENT_BOUNDS[
                continent
            ];

        for(
            const point of
            points
        )
        {

            const cell=
                voronoiCell(
                    point,
                    points,
                    bounds
                );

            const pathData=
                polygonToPath(
                    cell
                );

            if(
                !pathData
            )
            {

                continue;

            }

            const path=
                createSvg(
                    "path"
                );

            path.setAttribute(
                "d",
                pathData
            );

            path.setAttribute(
                "class",
                "country-region"
            );

            path.dataset.code=
                point.code;

            path.setAttribute(
                "fill",
                countryFill(
                    point.code
                )
            );

            path.addEventListener(
                "click",
                event=>
                {

                    event.stopPropagation();

                    selectCountry(
                        point.code
                    );

                }
            );

            layer.appendChild(
                path
            );

        }

    }

    buildIslandMarkers();

    updateMapStyles();

}

========================================================= */

let dragging=
    false;

let dragX=
    0;

let dragY=
    0;

function applyMapTransform()
{

    $("camera")
    .setAttribute(
        "transform",
        `translate(${state.map.x} ${state.map.y}) scale(${state.map.zoom})`
    );

}

function zoomMap(
    multiplier
)
{

    state.map.zoom=
        clamp(
            state.map.zoom*
            multiplier,
            .65,
            4
        );

    applyMapTransform();

}

function resetMap()
{

    state.map.zoom=
        1;

    state.map.x=
        0;

    state.map.y=
        0;

    applyMapTransform();

}

$("worldSvg")
.addEventListener(
    "pointerdown",
    event=>
    {

        dragging=
            true;

        dragX=
            event.clientX;

        dragY=
            event.clientY;

    }
);

$("worldSvg")
.addEventListener(
    "pointermove",
    event=>
    {

        if(
            !dragging
        )
        {

            return;

        }

        state.map.x+=
            (
                event.clientX-
                dragX
            )*
            1600/
            $("worldSvg")
            .clientWidth;

        state.map.y+=
            (
                event.clientY-
                dragY
            )*
            800/
            $("worldSvg")
            .clientHeight;

        dragX=
            event.clientX;

        dragY=
            event.clientY;

        applyMapTransform();

    }
);

$("worldSvg")
.addEventListener(
    "pointerup",
    ()=>
    {

        dragging=
            false;

    }
);

$("worldSvg")
.addEventListener(
    "pointercancel",
    ()=>
    {

        dragging=
            false;

    }
);

$("worldSvg")
.addEventListener(
    "wheel",
    event=>
    {

        event.preventDefault();

        zoomMap(
            event.deltaY<
            0
            ?
            1.12
            :
            .89
        );

    },
    {
        passive:
            false
    }
);

/* =========================================================
   GDP AND ECONOMY
========================================================= */

function calculateGDP()
{

    const government=
        GOVERNMENT_TYPES
        .find(
            item=>
            item.id===
            state.government.type
        )||
        GOVERNMENT_TYPES[
            0
        ];

    let gdp=
        state.society.population*
        (
            state.nation.industry*
            610+
            state.nation.technology*
            310
        );

    gdp*=
        government.economy;

    gdp*=
        1+
        (
            state.buildings.civilFactory||
            0
        )*
        .028;

    gdp*=
        1+
        (
            state.buildings.port||
            0
        )*
        .012;

    gdp*=
        1-
        state.economy.unemployment/
        170;

    gdp*=
        1-
        Math.max(
            0,
            state.economy.inflation-
            10
        )/
        500;

    return Math.max(
        1000,
        gdp
    );

}

function calculateGrowth()
{

    let growth=
        2.4;

    growth+=
        (
            state.nation.industry-
            50
        )*
        .032;

    growth+=
        (
            state.nation.technology-
            50
        )*
        .023;

    growth+=
        (
            state.economy.consumerConfidence-
            50
        )*
        .026;

    growth+=
        (
            state.nation.trade-
            50
        )*
        .012;

    growth-=
        state.economy.inflation*
        .085;

    growth-=
        state.economy.unemployment*
        .06;

    growth-=
        state.government.corruption*
        .03;

    growth-=
        state.military.warExhaustion*
        .018;

    if(
        state.resources.energy<
        25
    )
    {

        growth-=
            2.5;

    }

    if(
        state.resources.food<
        20
    )
    {

        growth-=
            2;

    }

    return clamp(
        growth,
        -18,
        18
    );

}

function calculateDailyRevenue()
{

    const tax=
        calculateGDP()*
        state.economy.taxRate/
        100*
        .00075;

    const trade=
        state.tradeAgreements.length*
        (
            8+
            state.nation.trade*
            .08
        );

    const ports=
        (
            state.buildings.port||
            0
        )*
        5;

    return tax+
    trade+
    ports;

}

function calculateMaintenance()
{

    return EQUIPMENT.reduce(
        (
            total,
            equipment
        )=>
        total+
        (
            state.inventory[
                equipment.id
            ]||
            0
        )*
        equipment.maintenance*
        .06,
        0
    );

}

function calculateDailyExpenses()
{

    const populationCost=
        state.society.population*
        (
            state.government.laws.welfare===
            "high"
            ?
            .42
            :
            state.government.laws.welfare===
            "low"
            ?
            .12
            :
            .25
        );

    const military=
        calculateMaintenance()*
        (
            state.government.laws.militaryBudget===
            "high"
            ?
            1.35
            :
            state.government.laws.militaryBudget===
            "low"
            ?
            .75
            :
            1
        );

    const debt=
        state.economy.debt*
        state.economy.interestRate/
        100/
        365;

    return populationCost+
    military+
    debt+
    state.construction.length*
    2+
    state.production.length*
    2;

}

/* =========================================================
   MILITARY POWER
========================================================= */

function equipmentPower()
{

    return EQUIPMENT.reduce(
        (
            total,
            equipment
        )=>
        total+
        (
            state.inventory[
                equipment.id
            ]||
            0
        )*
        equipment.power,
        0
    );

}

function calculateMilitaryPower()
{

    return(
        state.military.basePower+
        equipmentPower()*
        .025+
        state.military.readiness*
        .15+
        state.military.morale*
        .08+
        state.nation.technology*
        .08
    );

}

            </button>

function resourcePrice(
    id
)
{

    const base=
    {
        food:32,
        energy:50,
        oil:72,
        steel:66,
        electronics:95
    }[
        id
    ];

    const shortage=
        Math.max(
            0,
            50-
            state.resources[
                id
            ]
        );

    return base+
    state.economy.inflation*
    .7+
    shortage*
    .25+
    state.wars.filter(
        war=>
        war.status===
        "active"
    ).length*
    4;

}

function buyResource(
    id,
    amount
)
{

    const cost=
        resourcePrice(
            id
        )*
        amount;

    if(
        state.economy.money<
        cost
    )
    {

        toast(
            "بودجه کافی نیست"
        );

        return;

    }

    state.economy.money-=
        cost;

    state.resources[
        id
    ]+=
        amount;

    state.economy.imports+=
        cost;

    state.economy.inflation+=
        amount*
        .001;

    saveGame();

    renderAll();

    openEconomy(
        "resources"
    );

}

function sellResource(
    id,
    amount
)
{

    if(
        state.resources[
            id
        ]<
        amount
    )
    {

        toast(
            "موجودی کافی نیست"
        );

        return;

    }

    const revenue=
        resourcePrice(
            id
        )*
        amount*
        .90;

    state.resources[
        id
    ]-=
        amount;

    state.economy.money+=
        revenue;

    state.economy.exports+=
        revenue;

    saveGame();

    renderAll();

    openEconomy(
        "resources"
    );

}

function changeTax(
    value
)
{

    const old=
        state.economy.taxRate;

    state.economy.taxRate=
        clamp(
            old+
            value,
            0,
            50
        );

    const difference=
        state.economy.taxRate-
        old;

    state.society.approval=
        clamp(
            state.society.approval-
            difference*
            .5,
            0,
            100
        );

    state.economy.consumerConfidence=
        clamp(
            state.economy.consumerConfidence-
            difference*
            .35,
            0,
            100
        );

    saveGame();

    renderAll();

    openEconomy(
        "budget"
    );

}

function changeInterest(
    value
)
{

    state.economy.interestRate=
        clamp(
            state.economy.interestRate+
            value,
            0,
            35
        );

    if(
        value>
        0
    )
    {

        state.economy.inflation=
            Math.max(
                -2,
                state.economy.inflation-
                value*
                .28
            );

        state.economy.consumerConfidence=
            clamp(
                state.economy.consumerConfidence-
                value*
                .5,
                0,
                100
            );

    }
    else
    {

        state.economy.consumerConfidence=
            clamp(
                state.economy.consumerConfidence+
                Math.abs(
                    value
                )*
                .5,
                0,
                100
            );

        state.economy.inflation+=
            Math.abs(
                value
            )*
            .18;

    }

    saveGame();

    renderAll();

    openEconomy(
        "inflation"
    );

}

function takeLoan(
    amount
)
{

    state.economy.money+=
        amount;

    state.economy.debt+=
        amount;

    state.economy.inflation+=
        amount/
        Math.max(
            calculateGDP(),
            10000
        )*
        12;

    toast(
        "وام دریافت شد"
    );

    saveGame();

    renderAll();

    openEconomy(
        "bank"
    );

}

function repayLoan(
    amount
)
{

    amount=
        Math.min(
            amount,
            state.economy.money,
            state.economy.debt
        );

    if(
        amount<=
        0
    )
    {

        return;

    }

    state.economy.money-=
        amount;

    state.economy.debt-=
        amount;

    toast(
        "بدهی کاهش یافت"
    );

    saveGame();

    renderAll();

    openEconomy(
        "bank"
    );

}

function startConstruction(
    buildingId
)
{

    const building=
        BUILDINGS.find(
            item=>
            item.id===
            buildingId
        );

    if(
        !building
    )
    {

        return;

    }

    const currentLevel=
        state.buildings[
            buildingId
        ]||
        0;

    if(
        currentLevel>=
        building.max
    )
    {

        toast(
            "ساختمان در بالاترین سطح است"
        );

        return;

    }

    if(
        state.construction.some(
            project=>
            project.buildingId===
            buildingId
        )
    )
    {

        toast(
            "این پروژه در حال ساخت است"
        );

        return;

    }

    const cost=
        Math.round(
            building.cost*
            Math.pow(
                1.16,
                currentLevel
            )
        );

    if(
        state.economy.money<
        cost
    )
    {

        toast(
            "بودجه کافی نیست"
        );

        return;

    }

    state.economy.money-=
        cost;

    let days=
        building.days*
        (
            1-
            Math.min(
                .30,
                state.nation.logistics/
                350
            )
        );

    days=
        Math.max(
            3,
            Math.ceil(
                days
            )
        );

    state.construction.push(
        {
            id:
                "BUILD-"+
                Date.now()+
                "-"+
                buildingId,

            buildingId:
                buildingId,

            targetLevel:
                currentLevel+
                1,

            totalDays:
                days,

            daysLeft:
                days
        }
    );

    addNews(
        "🏗️ پروژه جدید",
        `${building.name} وارد صف ساخت شد.`
    );

    saveGame();

    renderAll();

    openInfrastructure(
        currentInfraCategory
    );

}

function buyEquipment(
    equipmentId,
    amount=
        1
)
{

    const equipment=
        EQUIPMENT.find(
            item=>
            item.id===
            equipmentId
        );

    if(
        !equipment
    )
    {

        return;

    }

    if(
        state.nation.technology<
        equipment.tech
    )
    {

        toast(
            "فناوری کافی نیست"
        );

        return;

    }

    const totalCost=
        equipment.cost*
        amount;

    const steel=
        equipment.steel*
        amount;

    const oil=
        equipment.oil*
        amount;

    const electronics=
        equipment.electronics*
        amount;

    const manpower=
        equipment.manpower*
        amount;

    if(
        state.economy.money<
        totalCost
    )
    {

        toast(
            "بودجه کافی نیست"
        );

        return;

    }

    if(
        state.resources.steel<
        steel
    )
    {

        toast(
            "فولاد کافی نیست"
        );

        return;

    }

    if(
        state.resources.oil<
        oil
    )
    {

        toast(
            "نفت کافی نیست"
        );

        return;

    }

    if(
        state.resources.electronics<
        electronics
    )
    {

        toast(
            "قطعات الکترونیکی کافی نیست"
        );

        return;

    }

    if(
        state.society.manpower<
        manpower
    )
    {

        toast(
            "نیروی انسانی کافی نیست"
        );

        return;

    }

    state.economy.money-=
        totalCost;

    state.resources.steel-=
        steel;

    state.resources.oil-=
        oil;

    state.resources.electronics-=
        electronics;

    state.society.manpower-=
        manpower;

    state.inventory[
        equipmentId
    ]=
        (
            state.inventory[
                equipmentId
            ]||
            0
        )+
        amount;

    state.military.basePower+=
        equipment.power*
        amount*
        .006;

    addNews(
        "🏪 خرید نظامی",
        `${amount} واحد ${equipment.name} خریداری شد.`
    );

    toast(
        "خرید انجام شد"
    );

    saveGame();

    renderAll();

    openStore(
        currentStoreCategory
    );

}

function requiredFactory(
    equipment
)
{

    if(
        equipment.category===
        "ground"||
        equipment.category===
        "artillery"||
        equipment.category===
        "defense"
    )
    {

        return "groundFactory";

    }

    if(
        equipment.category===
        "air"||
        equipment.category===
        "bomber"||
        equipment.category===
        "drone"||
        equipment.category===
        "helicopter"||
        equipment.category===
        "support"
    )
    {

        return "airFactory";

    }

    if(
        equipment.category===
        "missile"
    )
    {

        return "missileFactory";

    }

    return "navalYard";

}

function produceEquipment(
    equipmentId,
    amount=
        1
)
{

    const equipment=
        EQUIPMENT.find(
            item=>
            item.id===
            equipmentId
        );

    if(
        !equipment
    )
    {

        return;

    }

    const factory=
        requiredFactory(
            equipment
        );

    const factoryLevel=
        state.buildings[
            factory
        ]||
        0;

    if(
        factoryLevel<=
        0
    )
    {

        toast(
            "کارخانه مناسب ساخته نشده"
        );

        return;

    }

    if(
        state.nation.technology<
        equipment.tech
    )
    {

        toast(
            "فناوری کافی نیست"
        );

        return;

    }

    const moneyCost=
        equipment.cost*
        .42*
        amount;

    const steel=
        equipment.steel*
        amount;

    const oil=
        equipment.oil*
        amount;

    const electronics=
        equipment.electronics*
        amount;

    if(
        state.economy.money<
        moneyCost||
        state.resources.steel<
        steel||
        state.resources.oil<
        oil||
        state.resources.electronics<
        electronics
    )
    {

        toast(
            "مواد اولیه کافی نیست"
        );

        return;

    }

    state.economy.money-=
        moneyCost;

    state.resources.steel-=
        steel;

    state.resources.oil-=
        oil;

    state.resources.electronics-=
        electronics;

    const days=
        Math.max(
            4,
            Math.ceil(
                (
                    10+
                    equipment.tech*
                    .22
                )/
                (
                    1+
                    factoryLevel*
                    .35+
                    state.nation.industry/
                    250
                )
            )
        );

    state.production.push(
        {
            id:
                "PROD-"+
                Date.now(),

            equipmentId:
                equipmentId,

            amount:
                amount,

            totalDays:
                days,

            daysLeft:
                days
        }
    );

    toast(
        "تولید آغاز شد"
    );

    saveGame();

    openArmy(
        "production"
    );

}

    }

    const aiPower=
        ai.military*
        (
            .65+
            ai.readiness/
            180
        );

    const playerPower=
        calculateMilitaryPower();

    return aiPower/
    Math.max(
        1,
        playerPower
    );

}

function aiOfferScore(
    code,
    type
)
{

    const ai=
        state.ai[
            code
        ];

    if(
        !ai
    )
    {

        return 0;

    }

    const personality=
        aiPersonality(
            code
        );

    const rel=
        relation(
            code
        );

    if(
        type===
        "trade"
    )
    {

        return ai.tradeInterest*
        .55+
        rel*
        .35+
        personality.trade*
        20;

    }

    if(
        type===
        "alliance"
    )
    {

        return ai.allianceInterest*
        .5+
        rel*
        .45+
        personality.alliance*
        20;

    }

    if(
        type===
        "nonAggression"
    )
    {

        return(
            70-
            ai.aggression*
            .25+
            rel*
            .3+
            (
                relativePowerAI(
                    code
                )<
                1
                ?
                15
                :
                0
            )
        );

    }

    if(
        type===
        "aid"
    )
    {

        return rel*
        .5+
        ai.treasury/
        1000+
        personality.trade*
        20;

    }

    return 0;

}

function aiWarScore(
    attacker,
    defender
)
{

    const ai=
        state.ai[
            attacker
        ];

    if(
        !ai
    )
    {

        return -999;

    }

    const personality=
        aiPersonality(
            attacker
        );

    let score=
        ai.aggression*
        .65+
        ai.risk*
        .35+
        personality.aggression*
        20;

    if(
        defender===
        state.player
    )
    {

        score-=
            relation(
                attacker
            )*
            .45;

        const powerRatio=
            relativePowerAI(
                attacker
            );

        score+=
            (
                powerRatio-
                1
            )*
            40;

        if(
            isAlly(
                attacker
            )
        )
        {

            score-=
                100;

        }

        if(
            hasNonAggression(
                attacker
            )
        )
        {

            score-=
                80;

        }

    }
    else
    {

        const target=
            state.ai[
                defender
            ];

        if(
            target
        )
        {

            score+=
                (
                    ai.military-
                    target.military
                )*
                .28;

            score+=
                (
                    ai.economy-
                    target.economy
                )*
                .08;

        }

    }

    score-=
        ai.warWeariness*
        .6;

    return score;

}

/* =========================================================
   AI WAR ENGINE
========================================================= */

const WAR_TYPES=
[
{
id:"limited",
name:"جنگ محدود",
intensity:.65
},
{
id:"border",
name:"درگیری مرزی",
intensity:.45
},
{
id:"economic",
name:"جنگ فشار اقتصادی",
intensity:.35
},
{
id:"full",
name:"جنگ گسترده",
intensity:1
}
];

function processAIWars()
{

    const activeCount=
        state.wars.filter(
            war=>
            war.status===
            "active"
        ).length;

    if(
        activeCount>
        10
    )
    {

        return;

    }

    const attempts=
        state.difficulty===
        "expert"
        ?
        8
        :
        state.difficulty===
        "hard"
        ?
        6
        :
        4;

    for(
        let index=
            0;
        index<
            attempts;
        index++
    )
    {

        const attacker=
            pick(
                COUNTRY_CODES
                .filter(
                    code=>
                    code!==
                    state.player
                )
            );

        const ai=
            state.ai[
                attacker
            ];

        if(
            !ai
        )
        {

            continue;

        }

        if(
            chance(
                ai.aggression*
                .015
            )
        )
        {

            const targetPlayer=
                chance(
                    18
                );

            const defender=
                targetPlayer
                ?
                state.player
                :
                pick(
                    COUNTRY_CODES
                    .filter(
                        code=>
                        code!==
                        attacker&&
                        code!==
                        state.player
                    )
                );

            if(
                activeWarBetween(
                    attacker,
                    defender
                )
            )
            {

                continue;

            }

            const score=
                aiWarScore(
                    attacker,
                    defender
                );

            const threshold=
                state.difficulty===
                "expert"
                ?
                65
                :
                state.difficulty===
                "hard"
                ?
                72
                :
                78;

            if(
                score>
                threshold
            )
            {

                const type=
                    pick(
                        WAR_TYPES
                    );

                startWar(
                    attacker,
                    defender,
                    type.id,
                    true
                );

                return;

            }

        }

    }

}

function activeWarBetween(
    first,
    second
)
{

    return state.wars.some(
        war=>
        war.status===
        "active"&&
        (
            (
                war.attacker===
                first&&
                war.defender===
                second
            )||
            (
                war.attacker===
                second&&
                war.defender===
                first
            )
        )
    );

}

function startWar(
    attacker,
    defender,
    type=
        "limited",
    aiStarted=
        false
)
{

    if(
        activeWarBetween(
            attacker,
            defender
        )
    )
    {

        return;

    }

    const warType=
        WAR_TYPES.find(
            item=>
            item.id===
            type
        )||
        WAR_TYPES[
            0
        ];

    state.wars.push(
        {
            id:
                "WAR-"+
                Date.now()+
                "-"+
                Math.random()
                .toString(
                    36
                )
                .slice(
                    2
                ),

            attacker:
                attacker,

            defender:
                defender,

            type:
                warType.id,

            intensity:
                warType.intensity,

            attackerScore:
                0,

            defenderScore:
                0,

            days:
                0,

            status:
                "active"
        }
    );

    if(
        attacker===
        state.player||
        defender===
        state.player
    )
    {

        state.military.warExhaustion+=
            2;

        toast(
            "⚔️ کشور وارد جنگ شد"
        );

    }

    addNews(
        "⚔️ جنگ جدید",
        `${countryName(attacker)} و ${countryName(defender)} وارد ${warType.name} شدند.`
    );

    if(
        aiStarted&&
        defender===
        state.player
    )
    {

        pushAIProposal(
            {
                from:
                    attacker,

                type:
                    "war",

                title:
                    "اعلام آغاز جنگ",

                text:
                    `${countryName(attacker)} وارد جنگ با کشور شما شده است.`
            }
        );

    }

    updateMapStyles();

}

/* =========================================================
   ABSTRACT WAR SIMULATION
========================================================= */

function countryWarPower(
    code
)
{

    if(
        code===
        state.player
    )
    {

        return calculateMilitaryPower()*
        (
            .55+
            state.military.readiness/
            150
        );

    }

    const ai=
        state.ai[
            code
        ];

    if(
        !ai
    )
    {

        return 50;

    }

    return ai.military*
    (
        .55+
        ai.readiness/
        150
    )*
    (
        .85+
        ai.technology/
        400
    );

}

function processWars()
{

    for(
        const war of
        state.wars
    )
    {

        if(
            war.status!==
            "active"
        )
        {

            continue;

        }

        war.days++;

        const attackerPower=
            countryWarPower(
                war.attacker
            );

        const defenderPower=
            countryWarPower(
                war.defender
            );

        const total=
            attackerPower+
            defenderPower;

        const attackerShare=
            attackerPower/
            Math.max(
                1,
                total
            );

        const defenderShare=
            defenderPower/
            Math.max(
                1,
                total
            );

        war.attackerScore+=
            attackerShare*
            war.intensity*
            random(
                .4,
                1.2
            );

        war.defenderScore+=
            defenderShare*
            war.intensity*
            random(
                .4,
                1.2
            );

        if(
            war.attacker===
            state.player||
            war.defender===
            state.player
        )
        {

            state.military.warExhaustion=
                clamp(
                    state.military.warExhaustion+
                    .08*
                    war.intensity,
                    0,
                    100
                );

            state.military.readiness=
                clamp(
                    state.military.readiness-
                    .018*
                    war.intensity,
                    0,
                    100
                );

            state.resources.oil=
                Math.max(
                    0,
                    state.resources.oil-
                    .08*
                    war.intensity
                );

            state.economy.money=
                Math.max(
                    0,
                    state.economy.money-
                    5*
                    war.intensity
                );

        }

        if(
            war.days>
            30&&
            (
                war.attackerScore>
                45||
                war.defenderScore>
                45
            )
        )
        {

            resolveWar(
                war
            );

        }

    }

}

function resolveWar(
    war
)
{

    if(
        war.status!==
        "active"
    )
    {

        return;

    }

    const attackerWins=
        war.attackerScore>
        war.defenderScore;

    const winner=
        attackerWins
        ?
        war.attacker
        :
        war.defender;

    const loser=
        attackerWins
        ?
        war.defender
        :
        war.attacker;

    war.status=
        "ended";

    war.winner=
        winner;

    war.loser=
        loser;

    if(
        winner===
        state.player
    )
    {

        state.nation.reputation+=
            2;

        state.military.morale=
            clamp(
                state.military.morale+
                5,
                0,
                100
            );

        toast(
            "🏆 جنگ با پیروزی پایان یافت"
        );

    }

    if(
        loser===
        state.player
    )
    {

        state.society.approval=
            clamp(
                state.society.approval-
                5,
                0,
                100
            );

        state.military.morale=
            clamp(
                state.military.morale-
                6,
                0,
                100
            );

        toast(
            "⚠️ جنگ با شکست پایان یافت"
        );

    }

    const winnerAI=
        state.ai[
            winner
        ];

    const loserAI=
        state.ai[
            loser
        ];

    if(
        winnerAI
    )
    {

        winnerAI.military+=
            .8;

        winnerAI.warWeariness=
            Math.max(
                0,
                winnerAI.warWeariness-
                4
            );

    }

    if(
        loserAI
    )
    {

        loserAI.military=
            Math.max(
                10,
                loserAI.military-
                1.4
            );

        loserAI.stability=
            Math.max(
                15,
                loserAI.stability-
                3
            );

    }

    addNews(
        "🏳️ پایان جنگ",
        `${countryName(winner)} پیروز جنگ با ${countryName(loser)} شد.`
    );

    updateMapStyles();

}

========================================================= */

function processAIEconomies()
{

    const difficultyMultiplier=
        state.difficulty===
        "expert"
        ?
        1.16
        :
        state.difficulty===
        "hard"
        ?
        1.08
        :
        state.difficulty===
        "easy"
        ?
        .92
        :
        1;

    for(
        const code of
        COUNTRY_CODES
    )
    {

        if(
            code===
            state.player
        )
        {

            continue;

        }

        const ai=
            state.ai[
                code
            ];

        if(
            !ai
        )
        {

            continue;

        }

        const personality=
            aiPersonality(
                code
            );

        let economyGrowth=
            .0045*
            difficultyMultiplier;

        let militaryGrowth=
            .0035*
            difficultyMultiplier;

        let techGrowth=
            .0028*
            difficultyMultiplier;

        if(
            personality.id===
            "economic"
        )
        {

            economyGrowth*=
                1.7;

        }

        if(
            personality.id===
            "aggressive"
        )
        {

            militaryGrowth*=
                1.75;

        }

        if(
            personality.id===
            "technocratic"
        )
        {

            techGrowth*=
                1.8;

        }

        ai.economy=
            clamp(
                ai.economy+
                economyGrowth+
                random(
                    -.01,
                    .015
                ),
                10,
                160
            );

        ai.military=
            clamp(
                ai.military+
                militaryGrowth+
                random(
                    -.01,
                    .014
                ),
                10,
                160
            );

        ai.technology=
            clamp(
                ai.technology+
                techGrowth+
                random(
                    -.008,
                    .012
                ),
                10,
                160
            );

        ai.treasury+=
            ai.economy*
            .18*
            difficultyMultiplier;

        if(
            activeWar(
                code
            )
        )
        {

            ai.warWeariness=
                clamp(
                    ai.warWeariness+
                    .06,
                    0,
                    100
                );

            ai.readiness=
                clamp(
                    ai.readiness-
                    .018,
                    20,
                    100
                );

        }
        else
        {

            ai.warWeariness=
                clamp(
                    ai.warWeariness-
                    .08,
                    0,
                    100
                );

            ai.readiness=
                clamp(
                    ai.readiness+
                    .025,
                    20,
                    100
                );

        }

    }

}

function respondProposal(
    proposalId,
    accept
)
{

    const proposal=
        state.inbox.find(
            item=>
            item.id===
            proposalId
        );

    if(
        !proposal||
        proposal.status!==
        "pending"
    )
    {

        return;

    }

    proposal.status=
        accept
        ?
        "accepted"
        :
        "rejected";

    if(
        accept
    )
    {

        if(
            proposal.type===
            "trade"&&
            !hasTrade(
                proposal.from
            )
        )
        {

            state.tradeAgreements.push(
                {
                    code:
                        proposal.from,

                    days:
                        360,

                    income:
                        proposal.value||
                        20
                }
            );

            changeRelation(
                proposal.from,
                8
            );

        }

        if(
            proposal.type===
            "alliance"&&
            !isAlly(
                proposal.from
            )
        )
        {

            state.alliances.push(
                {
                    code:
                        proposal.from
                }
            );

            changeRelation(
                proposal.from,
                15
            );

        }

        if(
            proposal.type===
            "nonAggression"&&
            !hasNonAggression(
                proposal.from
            )
        )
        {

            state.nonAggression.push(
                {
                    code:
                        proposal.from,

                    days:
                        720
                }
            );

            changeRelation(
                proposal.from,
                10
            );

        }

        if(
            proposal.type===
            "aid"
        )
        {

            state.economy.money+=
                proposal.value||
                1000;

            changeRelation(
                proposal.from,
                6
            );

        }

        if(
            proposal.type===
            "warning"
        )
        {

            changeRelation(
                proposal.from,
                8
            );

        }

        toast(
            "پیشنهاد پذیرفته شد"
        );

    }
    else
    {

        changeRelation(
            proposal.from,
            -4
        );

        toast(
            "پیشنهاد رد شد"
        );

    }

    saveGame();

    renderAll();

    openAIInbox();

}

/* =========================================================
   ROUTE DRAWING
========================================================= */

function mapPoint(
    code
)
{

    const point=
        COUNTRY_POINTS[
            code
        ];

    if(
        point
    )
    {

        return[
            point.x,
            point.y
        ];

    }

    return[
        800,
        400
    ];

}

function curvedPath(
    from,
    to
)
{

    const midX=
        (
            from[
                0
            ]+
            to[
                0
            ]
        )/
        2;

    const midY=
        (
            from[
                1
            ]+
            to[
                1
            ]
        )/
        2-
        Math.min(
            80,
            Math.abs(
                from[
                    0
                ]-
                to[
                    0
                ]
            )*
            .12+
            20
        );

    return`
    M
    ${from[0]}
    ${from[1]}
    Q
    ${midX}
    ${midY}
    ${to[0]}
    ${to[1]}
    `;

}

function renderRoutes()
{

    const layer=
        $("routeLayer");

    layer.innerHTML=
        "";

    if(
        !state.started||
        !state.player
    )
    {

        return;

    }

    const playerPoint=
        mapPoint(
            state.player
        );

    for(
        const agreement of
        state.tradeAgreements
    )
    {

        const target=
            mapPoint(
                agreement.code
            );

        const path=
            createSvg(
                "path"
            );

        path.setAttribute(
            "d",
            curvedPath(
                playerPoint,
                target
            )
        );

        path.setAttribute(
            "class",
            "trade-route"
        );

        layer.appendChild(
            path
        );

    }

    for(
        const alliance of
        state.alliances
    )
    {

        const target=
            mapPoint(
                alliance.code
            );

        const path=
            createSvg(
                "path"
            );

        path.setAttribute(
            "d",
            curvedPath(
                playerPoint,
                target
            )
        );

        path.setAttribute(
            "class",
            "alliance-route"
        );

        layer.appendChild(
            path
        );

    }

    for(
        const war of
        state.wars
    )
    {

        if(
            war.status!==
            "active"
        )
        {

            continue;

        }

        const from=
            mapPoint(
                war.attacker
            );

        const to=
            mapPoint(
                war.defender
            );

        const path=
            createSvg(
                "path"
            );

        path.setAttribute(
            "d",
            curvedPath(
                from,
                to
            )
        );

        path.setAttribute(
            "class",
            "war-route"
        );

        layer.appendChild(
            path
        );

    }

}
