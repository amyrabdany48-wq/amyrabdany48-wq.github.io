<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>WORLD EMPIRE — میدان نبرد</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:#071018;
    color:#fff;
}

button,input,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#countrySelect{
    position:fixed;
    inset:0;
    z-index:99999;
    background:
        radial-gradient(circle at 20% 20%,rgba(0,180,255,.16),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(120,70,255,.15),transparent 30%),
        linear-gradient(135deg,#050b11,#101a25 50%,#050a10);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    overflow:auto;
}

.countryBox{
    width:min(850px,100%);
    max-height:95vh;
    border:1px solid rgba(255,255,255,.14);
    border-radius:28px;
    background:rgba(9,17,25,.94);
    box-shadow:0 25px 100px rgba(0,0,0,.65);
    padding:25px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#9db0c2;
    margin-bottom:22px;
}

.countrySearch{
    width:100%;
    padding:15px 17px;
    border-radius:15px;
    border:1px solid #293b4c;
    background:#101c28;
    color:white;
    outline:none;
    font-size:15px;
    margin-bottom:15px;
}

.countryList{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
    gap:9px;
    max-height:45vh;
    overflow:auto;
    padding:2px;
}

.countryItem{
    border:1px solid #263849;
    background:linear-gradient(145deg,#101d29,#0a131c);
    color:#fff;
    border-radius:14px;
    padding:13px 8px;
    min-height:68px;
    transition:.18s;
}

.countryItem:hover{
    border-color:#3da9ff;
    transform:translateY(-2px);
}

.countryItem.selected{
    border-color:#00d4ff;
    box-shadow:0 0 18px rgba(0,210,255,.2);
    background:linear-gradient(145deg,#12354a,#10212f);
}

.countryFlag{
    font-size:22px;
}

.countryName{
    display:block;
    margin-top:5px;
    font-size:13px;
}

.selectedCountry{
    margin-top:17px;
    padding:15px;
    border-radius:17px;
    background:linear-gradient(135deg,#11283a,#0d1720);
    border:1px solid #28465b;
    min-height:70px;
}

.startBtn{
    width:100%;
    margin-top:15px;
    padding:17px;
    border:0;
    border-radius:16px;
    font-size:17px;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,#0077ff,#00b9d8);
    box-shadow:0 8px 25px rgba(0,150,255,.25);
}

.startBtn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#game{
    width:100%;
    height:100%;
    position:relative;
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.leaflet-control-attribution{
    font-size:9px!important;
}

.topBar{
    position:absolute;
    top:0;
    right:0;
    left:0;
    z-index:1000;
    min-height:68px;
    padding:8px 10px;
    background:linear-gradient(180deg,rgba(5,11,17,.94),rgba(5,11,17,.75),transparent);
    display:flex;
    align-items:flex-start;
    gap:7px;
    pointer-events:none;
}

.gameTitle{
    font-weight:900;
    font-size:16px;
    min-width:125px;
    padding:10px;
    text-shadow:0 2px 8px #000;
}

.stats{
    flex:1;
    display:flex;
    gap:6px;
    overflow-x:auto;
    pointer-events:auto;
    scrollbar-width:none;
}

.stats::-webkit-scrollbar{
    display:none;
}

.stat{
    flex:0 0 auto;
    min-width:82px;
    padding:7px 9px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:rgba(7,15,23,.82);
    backdrop-filter:blur(8px);
    text-align:center;
}

.stat small{
    display:block;
    color:#8fa5b7;
    font-size:9px;
}

.stat b{
    display:block;
    font-size:12px;
    margin-top:3px;
}

.mapTools{
    position:absolute;
    top:78px;
    right:10px;
    z-index:1001;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.mapTool{
    width:43px;
    height:43px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:12px;
    background:rgba(8,17,25,.86);
    color:white;
    font-size:18px;
    backdrop-filter:blur(8px);
}

#bottomArea{
    position:absolute;
    z-index:2000;
    bottom:0;
    left:0;
    right:0;
    padding:10px;
    padding-bottom:max(10px,env(safe-area-inset-bottom));
    display:flex;
    justify-content:center;
    pointer-events:none;
    background:linear-gradient(0deg,rgba(4,9,14,.85),transparent);
}

.bottomButtons{
    width:min(850px,100%);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    pointer-events:auto;
}

.bottomButton{
    min-height:67px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;
    color:#fff;
    font-weight:900;
    font-size:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    backdrop-filter:blur(12px);
    transition:.18s;
}

.bottomButton:active{
    transform:scale(.97);
}

.storeButton{
    background:
        linear-gradient(135deg,rgba(0,120,255,.93),rgba(0,210,190,.9));
}

.managementButton{
    background:
        linear-gradient(135deg,rgba(116,46,255,.94),rgba(226,49,126,.88));
}

.bottomButton span{
    display:block;
}

.bottomButton small{
    display:block;
    margin-top:4px;
    font-size:9px;
    opacity:.75;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:9000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:12px;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(5px);
}

.overlay.show{
    display:flex;
}

.modal{
    width:min(1000px,100%);
    height:min(88vh,850px);
    background:#0a141e;
    border:1px solid #294052;
    border-radius:23px;
    box-shadow:0 25px 100px #000;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.modalHeader{
    min-height:65px;
    padding:12px 15px;
    border-bottom:1px solid #213342;
    display:flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(90deg,#101d2a,#0b151f);
}

.modalTitle{
    flex:1;
    font-size:18px;
    font-weight:900;
}

.closeBtn{
    width:42px;
    height:42px;
    border-radius:12px;
    border:1px solid #334858;
    background:#111f2b;
    color:#fff;
    font-size:20px;
}

.modalBody{
    flex:1;
    overflow:auto;
    padding:13px;
}

.moneyBox{
    border:1px solid #24445b;
    border-radius:15px;
    padding:12px;
    background:linear-gradient(135deg,#0d2638,#0a1823);
    margin-bottom:12px;
}

.moneyBox b{
    color:#46e4c2;
}

.storeTools{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.storeSearch{
    flex:1;
    padding:12px;
    background:#101e2a;
    color:white;
    border:1px solid #2a3e4e;
    border-radius:12px;
    outline:none;
}

.categoryRow{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:12px;
    scrollbar-width:none;
}

.categoryRow::-webkit-scrollbar{
    display:none;
}

.categoryBtn{
    flex:0 0 auto;
    padding:9px 13px;
    border:1px solid #2b3d4d;
    border-radius:12px;
    color:#c5d4df;
    background:#0e1a24;
}

.categoryBtn.active{
    color:#fff;
    border-color:#00c6ff;
    background:#103147;
}

.storeGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
    gap:9px;
}

.storeCard{
    border:1px solid #243746;
    border-radius:15px;
    background:
        linear-gradient(145deg,#101e2a,#0a141d);
    padding:11px;
    position:relative;
    overflow:hidden;
}

.storeCard::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,rgba(0,180,255,.05),transparent 55%);
    pointer-events:none;
}

.itemIcon{
    font-size:28px;
    margin-bottom:6px;
}

.itemName{
    font-weight:bold;
    font-size:13px;
    min-height:34px;
}

.itemCategory{
    color:#8198aa;
    font-size:9px;
    margin:4px 0;
}

.itemDesc{
    color:#a9bac7;
    font-size:10px;
    line-height:1.7;
    min-height:34px;
}

.itemEffects{
    margin:7px 0;
    font-size:10px;
    line-height:1.7;
}

.price{
    color:#ffd45a;
    font-weight:bold;
    font-size:12px;
}

.buyBtn{
    width:100%;
    margin-top:8px;
    padding:9px;
    border:0;
    border-radius:10px;
    color:white;
    font-weight:bold;
    background:linear-gradient(90deg,#087df0,#00aeb9);
}

.buyBtn:disabled{
    opacity:.35;
}

#managementModal .modal{
    width:min(1050px,100%);
}

.managementGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.manageCard{
    background:linear-gradient(145deg,#101d29,#0a141d);
    border:1px solid #263a4b;
    border-radius:17px;
    padding:14px;
}

.manageCard.full{
    grid-column:1/-1;
}

.manageTitle{
    font-weight:900;
    margin-bottom:11px;
    font-size:14px;
}

.manageStats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
}

.manageStat{
    background:#0c1822;
    border:1px solid #1f3140;
    border-radius:11px;
    padding:9px;
}

.manageStat small{
    display:block;
    color:#7890a2;
    font-size:9px;
}

.manageStat b{
    display:block;
    margin-top:4px;
}

.rangeRow{
    margin:12px 0;
}

.rangeRow label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    margin-bottom:6px;
}

input[type=range]{
    width:100%;
    accent-color:#00b8ff;
}

.actionGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
}

.actionBtn{
    border:1px solid #2b4152;
    background:#101f2b;
    color:#fff;
    padding:11px 7px;
    border-radius:11px;
    font-size:11px;
}

.actionBtn:hover{
    border-color:#00bfff;
}

.countryRelations{
    max-height:300px;
    overflow:auto;
}

.relationRow{
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 0;
    border-bottom:1px solid #1b2a36;
}

.relationName{
    flex:1;
    font-size:11px;
}

.relationValue{
    font-size:10px;
    min-width:48px;
    text-align:center;
}

.relationBtns{
    display:flex;
    gap:4px;
}

.relationBtns button{
    border:1px solid #304858;
    background:#101e29;
    color:white;
    border-radius:8px;
    padding:6px;
    font-size:9px;
}

#toast{
    position:fixed;
    z-index:99999;
    left:50%;
    bottom:105px;
    transform:translateX(-50%) translateY(20px);
    background:rgba(8,16,24,.96);
    border:1px solid #3b5364;
    color:white;
    padding:12px 18px;
    border-radius:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    max-width:90%;
    text-align:center;
    font-size:12px;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.hidden{
    display:none!important;
}

@media(max-width:650px){
    .gameTitle{
        display:none;
    }

    .stats{
        padding-right:4px;
    }

    .stat{
        min-width:72px;
    }

    .bottomButton{
        min-height:61px;
        font-size:14px;
    }

    .managementGrid{
        grid-template-columns:1fr;
    }

    .manageCard.full{
        grid-column:auto;
    }

    .storeGrid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .storeCard{
        padding:9px;
    }

    .itemName{
        font-size:11px;
    }

    .itemDesc{
        font-size:9px;
    }

    .modal{
        height:93vh;
        border-radius:19px;
    }
}
</style>
</head>

<body>

<!-- =========================
     انتخاب کشور
========================= -->
<div id="countrySelect">

    <div class="countryBox">

        <div class="logo">🌍 WORLD EMPIRE</div>

        <div class="subtitle">
            قبل از ورود به بازی، کشور خود را انتخاب کنید
        </div>

        <input
            id="countrySearch"
            class="countrySearch"
            type="text"
            placeholder="🔎 جستجوی کشور..."
        >

        <div id="countryList" class="countryList"></div>

        <div id="selectedCountry" class="selectedCountry">
            هنوز کشوری انتخاب نشده است
        </div>

        <button id="startGame" class="startBtn" disabled>
            شروع بازی
        </button>

    </div>

</div>


<!-- =========================
     بازی
========================= -->
<div id="game" class="hidden">

    <div id="map"></div>

    <div class="topBar">

        <div class="gameTitle">
            🌍 WORLD EMPIRE
        </div>

        <div class="stats">

            <div class="stat">
                <small>💰 خزانه</small>
                <b id="money">0</b>
            </div>

            <div class="stat">
                <small>👥 جمعیت</small>
                <b id="population">0</b>
            </div>

            <div class="stat">
                <small>🏭 تولید</small>
                <b id="production">0</b>
            </div>

            <div class="stat">
                <small>⭐ اعتبار</small>
                <b id="reputation">0</b>
            </div>

            <div class="stat">
                <small>🏙 شهرها</small>
                <b id="cities">0</b>
            </div>

            <div class="stat">
                <small>🪖 ارتش</small>
                <b id="army">0</b>
            </div>

            <div class="stat">
                <small>📅 سال</small>
                <b id="year">2026</b>
            </div>

        </div>

    </div>


    <div class="mapTools">

        <button class="mapTool" id="zoomIn">+</button>
        <button class="mapTool" id="zoomOut">−</button>
        <button class="mapTool" id="homeMap">🌍</button>

    </div>


    <!-- فقط دو پنل پایین -->
    <div id="bottomArea">

        <div class="bottomButtons">

            <button id="openStore" class="bottomButton storeButton">
                🛒 فروشگاه بزرگ
                <small>منابع، زیرساخت، فناوری و پروژه‌ها</small>
            </button>

            <button id="openManagement" class="bottomButton managementButton">
                🏛️ مدیریت کشور
                <small>ارتش، دیپلماسی، مالیات و اقتصاد</small>
            </button>

        </div>

    </div>

</div>


<!-- =========================
     فروشگاه
========================= -->
<div id="storeOverlay" class="overlay">

    <div class="modal">

        <div class="modalHeader">

            <div class="modalTitle">
                🛒 فروشگاه بزرگ امپراتوری
            </div>

            <button class="closeBtn" id="closeStore">
                ✕
            </button>

        </div>

        <div class="modalBody">

            <div class="moneyBox">
                💰 موجودی خزانه:
                <b id="storeMoney">0</b>
            </div>

            <div class="storeTools">

                <input
                    id="storeSearch"
                    class="storeSearch"
                    placeholder="🔎 جستجوی کالا، منابع و پروژه..."
                >

            </div>

            <div id="categoryRow" class="categoryRow"></div>

            <div id="storeGrid" class="storeGrid"></div>

        </div>

    </div>

</div>


<!-- =========================
     مدیریت کشور
========================= -->
<div id="managementOverlay" class="overlay">

    <div id="managementModal" class="modal">

        <div class="modalHeader">

            <div class="modalTitle">
                🏛️ مدیریت کشور
            </div>

            <button class="closeBtn" id="closeManagement">
                ✕
            </button>

        </div>

        <div class="modalBody">

            <div id="managementContent"></div>

        </div>

    </div>

</div>


<div id="toast"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";

/* =========================================================
   تنظیمات اصلی
========================================================= */

const WORLD_URL =
"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";

let worldData = null;
let map = null;
let worldLayer = null;
let selectedCountry = null;
let playerCountry = null;

const SAVE_KEY = "WORLD_EMPIRE_FINAL_SAVE";

/* =========================================================
   وضعیت بازی
========================================================= */

const game = {

    money: 15000,

    population: 42,

    production: 180,

    reputation: 70,

    cities: 4,

    army: 18000,

    year: 2026,

    turn: 1,

    playerCountry: "",

    tax: 15,

    militaryBudget: 25,

    educationBudget: 15,

    infrastructureBudget: 20,

    welfareBudget: 15,

    stability: 75,

    inflation: 4,

    research: 10,

    defense: 40,

    fuel: 500,

    steel: 400,

    food: 900,

    energy: 500,

    rareMaterials: 80,

    diplomacyPoints: 100,

    relations: {},

    inventory: {},

    units: {

        infantry: 12000,

        tanks: 900,

        fighters: 120,

        drones: 180,

        missiles: 80

    }

};


/* =========================================================
   نام کشورها
========================================================= */

function getCountryName(props){

    return (
        props.ADMIN ||
        props.NAME ||
        props.name ||
        props.NAME_EN ||
        props.NAME_LONG ||
        "کشور ناشناس"
    );

}


const flags = {

    "Iran":"🇮🇷",
    "Islamic Republic of Iran":"🇮🇷",
    "Turkey":"🇹🇷",
    "Azerbaijan":"🇦🇿",
    "Russia":"🇷🇺",
    "China":"🇨🇳",
    "India":"🇮🇳",
    "Japan":"🇯🇵",
    "South Korea":"🇰🇷",
    "North Korea":"🇰🇵",
    "United States of America":"🇺🇸",
    "United States":"🇺🇸",
    "Canada":"🇨🇦",
    "Brazil":"🇧🇷",
    "Argentina":"🇦🇷",
    "Germany":"🇩🇪",
    "France":"🇫🇷",
    "United Kingdom":"🇬🇧",
    "Italy":"🇮🇹",
    "Spain":"🇪🇸",
    "Portugal":"🇵🇹",
    "Egypt":"🇪🇬",
    "Saudi Arabia":"🇸🇦",
    "Iraq":"🇮🇶",
    "Pakistan":"🇵🇰",
    "Afghanistan":"🇦🇫",
    "Israel":"🇮🇱",
    "Syria":"🇸🇾",
    "Greece":"🇬🇷",
    "Netherlands":"🇳🇱",
    "Belgium":"🇧🇪",
    "Sweden":"🇸🇪",
    "Norway":"🇳🇴",
    "Finland":"🇫🇮",
    "Poland":"🇵🇱",
    "Ukraine":"🇺🇦",
    "Australia":"🇦🇺",
    "New Zealand":"🇳🇿",
    "South Africa":"🇿🇦",
    "Nigeria":"🇳🇬",
    "Mexico":"🇲🇽",
    "Indonesia":"🇮🇩",
    "Malaysia":"🇲🇾",
    "Thailand":"🇹🇭",
    "Vietnam":"🇻🇳",
    "Philippines":"🇵🇭"
};


function flagFor(name){

    return flags[name] || "🌐";

}


/* =========================================================
   بارگذاری کشورها
========================================================= */

async function loadWorld(){

    try{

        const response = await fetch(WORLD_URL);

        if(!response.ok)
            throw new Error("GeoJSON error");

        worldData = await response.json();

        renderCountryList();

    }catch(error){

        const fallback = [

            "Iran",
            "Turkey",
            "Azerbaijan",
            "Russia",
            "China",
            "India",
            "Japan",
            "Germany",
            "France",
            "United Kingdom",
            "United States",
            "Canada",
            "Brazil",
            "Australia",
            "Egypt",
            "Saudi Arabia",
            "Iraq",
            "Pakistan",
            "Spain",
            "Italy",
            "South Africa"

        ];

        worldData = {

            type:"FeatureCollection",

            features:fallback.map(name => ({

                type:"Feature",

                properties:{
                    ADMIN:name
                },

                geometry:null

            }))

        };

        renderCountryList();

        showToast("فهرست کشورها آماده شد؛ نقشه برای بارگذاری به اینترنت نیاز دارد.");

    }

}


/* =========================================================
   انتخاب کشور
========================================================= */

function renderCountryList(filter=""){

    const list = document.getElementById("countryList");

    list.innerHTML = "";

    const features = worldData.features || [];

    const filtered = features
        .filter(feature =>
            getCountryName(feature.properties)
            .toLowerCase()
            .includes(filter.toLowerCase())
        )
        .sort((a,b)=>
            getCountryName(a.properties)
            .localeCompare(getCountryName(b.properties))
        );

    filtered.forEach(feature => {

        const name = getCountryName(feature.properties);

        const button = document.createElement("button");

        button.className =
            "countryItem" +
            (selectedCountry === name ? " selected" : "");

        button.innerHTML = `
            <span class="countryFlag">${flagFor(name)}</span>
            <span class="countryName">${escapeHTML(name)}</span>
        `;

        button.addEventListener("click",()=>{

            selectedCountry = name;

            renderCountryList(
                document.getElementById("countrySearch").value
            );

            updateSelectedCountry();

        });

        list.appendChild(button);

    });

}


function updateSelectedCountry(){

    const box =
        document.getElementById("selectedCountry");

    const start =
        document.getElementById("startGame");

    if(!selectedCountry){

        box.innerHTML =
            "هنوز کشوری انتخاب نشده است";

        start.disabled = true;

        return;
    }

    box.innerHTML = `
        <b style="font-size:17px">
            ${flagFor(selectedCountry)}
            ${escapeHTML(selectedCountry)}
        </b>
        <div style="margin-top:7px;color:#9eb2c2;font-size:11px">
            این کشور به عنوان سرزمین اصلی امپراتوری شما انتخاب شد.
        </div>
    `;

    start.disabled = false;

}


/* =========================================================
   شروع بازی
========================================================= */

document.getElementById("startGame")
.addEventListener("click",()=>{

    if(!selectedCountry)
        return;

    playerCountry = selectedCountry;

    game.playerCountry = selectedCountry;

    initializePlayer();

    document.getElementById("countrySelect")
        .classList.add("hidden");

    document.getElementById("game")
        .classList.remove("hidden");

    initializeMap();

    updateUI();

    saveGame();

});


function initializePlayer(){

    const hash = hashString(playerCountry);

    game.money = 10000 + hash % 12000;

    game.population = 20 + hash % 100;

    game.production = 120 + hash % 280;

    game.reputation = 55 + hash % 35;

    game.cities = 3 + hash % 8;

    game.army = 8000 + hash % 30000;

    game.tax = 15;

    game.militaryBudget = 25;

    game.educationBudget = 15;

    game.infrastructureBudget = 20;

    game.welfareBudget = 15;

    game.stability = 70 + hash % 20;

    game.inflation = 3 + hash % 5;

    game.research = 10 + hash % 20;

    game.defense = 30 + hash % 30;

    game.fuel = 400 + hash % 500;

    game.steel = 300 + hash % 500;

    game.food = 700 + hash % 800;

    game.energy = 400 + hash % 500;

    game.rareMaterials = 50 + hash % 100;

    game.diplomacyPoints = 100;

}


/* =========================================================
   نقشه — بدون پنل روی نقشه
========================================================= */

function initializeMap(){

    if(map){

        setTimeout(()=>{
            map.invalidateSize();
        },100);

        return;
    }

    map = L.map("map",{

        zoomControl:false,

        worldCopyJump:true

    }).setView([25,20],3);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:8,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);

    if(worldData && worldData.features){

        worldLayer = L.geoJSON(

            worldData,

            {

                style:function(feature){

                    return {

                        color:"#334957",

                        weight:1,

                        fillColor:"#18303e",

                        fillOpacity:.34

                    };

                },

                onEachFeature:function(feature,layer){

                    const name =
                        getCountryName(feature.properties);

                    layer.on({

                        mouseover:function(){

                            layer.setStyle({

                                weight:2,

                                color:"#00c9ff",

                                fillOpacity:.48

                            });

                        },

                        mouseout:function(){

                            worldLayer.resetStyle(layer);

                            highlightCountries();

                        },

                        click:function(){

                            selectedCountry = name;

                            showCountryTarget(name);

                        }

                    });

                    layer.bindTooltip(

                        `${flagFor(name)} ${escapeHTML(name)}`,

                        {
                            sticky:true,
                            direction:"top"
                        }

                    );

                }

            }

        ).addTo(map);

        highlightCountries();

    }

    setTimeout(()=>{
        map.invalidateSize();
    },250);

}


function highlightCountries(){

    if(!worldLayer)
        return;

    worldLayer.eachLayer(layer=>{

        const name =
            getCountryName(layer.feature.properties);

        if(name === playerCountry){

            layer.setStyle({

                color:"#00ffbb",

                weight:3,

                fillColor:"#087d69",

                fillOpacity:.58

            });

        }

    });

}


function showCountryTarget(name){

    if(name === playerCountry){

        showToast(
            `${flagFor(name)} ${name} — این کشور تحت کنترل شماست.`
        );

        return;

    }

    const relation =
        game.relations[name] ?? 0;

    showToast(
        `${flagFor(name)} ${name} | رابطه دیپلماتیک: ${relation}`
    );

}

/* =========================================================
   تولید صدها محصول با سطح‌بندی
========================================================= */

let storeItems = [];

function generateStore(){

    storeItems = [];

    let id = 1;

    storeCategories.forEach(category=>{

        category.items.forEach(base=>{

            const [
                name,
                desc,
                cost,
                effect,
                amount
            ] = base;

            for(let level=1;level<=8;level++){

                const scaledCost =
                    Math.floor(cost * Math.pow(1.38,level-1));

                const scaledAmount =
                    Math.max(
                        1,
                        Math.floor(amount * Math.pow(1.28,level-1))
                    );

                storeItems.push({

                    id:"item_"+id++,

                    category:category.id,

                    categoryName:category.name,

                    icon:category.icon,

                    name:`${name} — سطح ${level}`,

                    description:desc,

                    cost:scaledCost,

                    effect,

                    amount:scaledAmount,

                    level

                });

            }

        });

    });

}


generateStore();


let currentStoreCategory = "all";


function renderStoreCategories(){

    const row =
        document.getElementById("categoryRow");

    row.innerHTML = "";

    const all =
        document.createElement("button");

    all.className =
        "categoryBtn" +
        (currentStoreCategory==="all" ? " active":"");

    all.textContent =
        `🌐 همه (${storeItems.length})`;

    all.addEventListener("click",()=>{

        currentStoreCategory="all";

        renderStoreCategories();

        renderStore();

    });

    row.appendChild(all);


    storeCategories.forEach(category=>{

        const count =
            storeItems.filter(x=>x.category===category.id).length;

        const button =
            document.createElement("button");

        button.className =
            "categoryBtn" +
            (currentStoreCategory===category.id ? " active":"");

        button.textContent =
            `${category.icon} ${category.name.replace(/^.\s/,"")} (${count})`;

        button.addEventListener("click",()=>{

            currentStoreCategory = category.id;

            renderStoreCategories();

            renderStore();

        });

        row.appendChild(button);

    });

}


function renderStore(){

    const grid =
        document.getElementById("storeGrid");

    const query =
        document.getElementById("storeSearch")
        .value
        .trim()
        .toLowerCase();

    grid.innerHTML = "";

    let items = storeItems;

    if(currentStoreCategory !== "all"){

        items =
            items.filter(
                item=>item.category===currentStoreCategory
            );

    }

    if(query){

        items =
            items.filter(item=>
                item.name.toLowerCase().includes(query) ||
                item.description.toLowerCase().includes(query) ||
                item.categoryName.toLowerCase().includes(query)
            );

    }


    items.forEach(item=>{

        const card =
            document.createElement("div");

        card.className="storeCard";

        const owned =
            game.inventory[item.id] || 0;

        const effects =
            getEffectText(item);

        card.innerHTML = `

            <div class="itemIcon">
                ${item.icon}
            </div>

            <div class="itemName">
                ${escapeHTML(item.name)}
            </div>

            <div class="itemCategory">
                ${escapeHTML(item.categoryName)}
            </div>

            <div class="itemDesc">
                ${escapeHTML(item.description)}
            </div>

            <div class="itemEffects">
                ${effects}
            </div>

            <div>
                <span class="price">
                    💰 ${formatNumber(item.cost)}
                </span>
                <span style="float:left;color:#879bab;font-size:9px">
                    مالکیت: ${owned}
                </span>
            </div>

            <button
                class="buyBtn"
                data-buy="${item.id}"
                ${game.money < item.cost ? "disabled":""}
            >
                خرید
            </button>

        `;

        grid.appendChild(card);

    });

}


function getEffectText(item){

    const amount =
        formatNumber(item.amount);

    switch(item.effect){

        case "money":
            return `💰 +${amount} خزانه`;

        case "population":
            return `👥 +${amount} جمعیت`;

        case "production":
            return `🏭 +${amount} تولید`;

        case "cities":
            return `🏙️ +${amount} شهر`;

        case "army":
            return `🪖 +${amount} ارتش`;

        case "defense":
            return `🛡️ +${amount} دفاع`;

        case "research":
            return `🔬 +${amount} پژوهش`;

        case "stability":
            return `⚖️ +${amount} ثبات`;

        case "food":
            return `🌾 +${amount} غذا`;

        case "steel":
            return `⛓️ +${amount} فولاد`;

        case "fuel":
            return `⛽ +${amount} سوخت`;

        case "energy":
            return `⚡ +${amount} انرژی`;

        case "rareMaterials":
            return `💎 +${amount} مواد کمیاب`;

        case "all":
            return `
                💰 اقتصاد<br>
                🏭 تولید<br>
                ⭐ اعتبار<br>
                ⚖️ ثبات
            `;

        default:
            return "";

    }

}


/* =========================================================
   خرید فروشگاه
========================================================= */

document.getElementById("storeGrid")
.addEventListener("click",event=>{

    const button =
        event.target.closest("[data-buy]");

    if(!button)
        return;

    purchaseItem(button.dataset.buy);

});


function purchaseItem(id){

    const item =
        storeItems.find(x=>x.id===id);

    if(!item)
        return;

    if(game.money < item.cost){

        showToast("💰 موجودی خزانه برای خرید این کالا کافی نیست.");

        return;

    }

    game.money -= item.cost;

    game.inventory[id] =
        (game.inventory[id] || 0) + 1;

    applyEffect(item.effect,item.amount);

    saveGame();

    updateUI();

    renderStore();

    showToast(
        `✅ ${item.name} خریداری شد.`
    );

}


function applyEffect(effect,amount){

    switch(effect){

        case "money":
            game.money += amount;
            break;

        case "population":
            game.population += amount;
            break;

        case "production":
            game.production += amount;
            break;

        case "cities":
            game.cities += amount;
            break;

        case "army":
            game.army += amount;
            game.units.infantry += Math.floor(amount*.7);
            break;

        case "defense":
            game.defense += amount;
            break;

        case "research":
            game.research += amount;
            break;

        case "stability":
            game.stability =
                Math.min(100,game.stability+amount);
            break;

        case "food":
            game.food += amount;
            break;

        case "steel":
            game.steel += amount;
            break;

        case "fuel":
            game.fuel += amount;
            break;

        case "energy":
            game.energy += amount;
            break;

        case "rareMaterials":
            game.rareMaterials += amount;
            break;

        case "all":

            game.production += amount*40;

            game.reputation += amount*3;

            game.stability =
                Math.min(100,game.stability+amount*4);

            game.research += amount*15;

            break;

    }

}

function buildRelations(){

    if(!worldData || !worldData.features)
        return "";

    const names =
        worldData.features
        .map(x=>getCountryName(x.properties))
        .filter(x=>x !== playerCountry)
        .slice(0,80);

    return names.map(name=>{

        if(game.relations[name] === undefined){

            game.relations[name] =
                ((hashString(name)+hashString(playerCountry))%81)-40;

        }

        const relation =
            game.relations[name];

        let label = "⚪ سرد";

        if(relation >= 60)
            label = "🟢 متحد";

        else if(relation >= 25)
            label = "🔵 دوستانه";

        else if(relation >= -10)
            label = "🟡 عادی";

        else if(relation >= -40)
            label = "🟠 متشنج";

        else
            label = "🔴 خصمانه";

        return `

            <div class="relationRow">

                <div class="relationName">
                    ${flagFor(name)}
                    ${escapeHTML(name)}
                </div>

                <div class="relationValue">
                    ${relation}
                </div>

                <div style="
                    width:75px;
                    font-size:9px;
                    color:#91a5b4;
                ">
                    ${label}
                </div>

                <div class="relationBtns">

                    <button
                        data-rel-name="${escapeHTML(name)}"
                        data-rel-action="improve"
                    >
                        ➕
                    </button>

                    <button
                        data-rel-name="${escapeHTML(name)}"
                        data-rel-action="trade"
                    >
                        📦
                    </button>

                    <button
                        data-rel-name="${escapeHTML(name)}"
                        data-rel-action="pressure"
                    >
                        ⚠️
                    </button>

                </div>

            </div>
        `;

    }).join("");

}

                .textContent = infra.value+"%";

            );

    document.querySelectorAll("[data-army]")

    });


    document.querySelectorAll("[data-diplomacy]")

function manageArmy(type){

    let cost = 0;

    switch(type){

        case "infantry":

            cost = 900;

            if(game.money < cost){

                showToast("💰 پول کافی نیست.");

                return;

            }

            game.money -= cost;

            game.units.infantry += 500;

            game.army += 500;

            break;


        case "tank":

            cost = 2200;

            if(game.money < cost){

                showToast("💰 پول کافی نیست.");

                return;

            }

            game.money -= cost;

            game.units.tanks += 10;

            game.army += 120;

            break;


        case "fighter":

            cost = 5000;

            if(game.money < cost){

                showToast("💰 پول کافی نیست.");

                return;

            }

            game.money -= cost;

            game.units.fighters += 2;

            game.army += 100;

            break;


        case "drone":

            cost = 1800;

            if(game.money < cost){

                showToast("💰 پول کافی نیست.");

                return;

            }

            game.money -= cost;

            game.units.drones += 15;

            game.army += 45;

            break;


        case "missile":

            cost = 4000;

            if(game.money < cost){

                showToast("💰 پول کافی نیست.");

                return;

            }

            game.money -= cost;

            game.units.missiles += 5;

            game.army += 25;

            break;


        case "upgrade":

            cost = 8500;

            if(game.money < cost){

                showToast("💰 پول کافی نیست.");

                return;

            }

            game.money -= cost;

            game.defense += 10;

            game.reputation += 4;

            break;

    }

    saveGame();

    updateUI();

    renderManagement();

    showToast("🪖 ارتش کشور به‌روزرسانی شد.");

}


function diplomacyAction(type){

    const target =
        getTargetCountry();

    if(!target){

        showToast("🌐 ابتدا یک کشور دیگر را روی نقشه انتخاب کنید.");

        return;

    }

    let cost = 0;
    let change = 0;

    switch(type){

        case "trade":
            cost=1200;
            change=10;
            break;

        case "aid":
            cost=2500;
            change=16;
            break;

        case "pact":
            cost=1800;
            change=12;
            break;

        case "alliance":
            cost=5000;
            change=25;
            break;

        case "embassy":
            cost=3500;
            change=18;
            break;

        case "sanction":
            cost=1000;
            change=-18;
            break;

    }

    if(game.money < cost){

        showToast("💰 بودجه کافی نیست.");

        return;

    }

    game.money -= cost;

    game.relations[target] =
        Math.max(
            -100,
            Math.min(
                100,
                (game.relations[target] || 0)+change
            )
        );

    game.diplomacyPoints =
        Math.max(0,game.diplomacyPoints-2);

    saveGame();

    updateUI();

    renderManagement();

    showToast(
        `🤝 عملیات دیپلماتیک روی ${target} انجام شد.`
    );

}


function relationAction(name,action){

    if(!name)
        return;

    if(game.relations[name] === undefined)
        game.relations[name]=0;

    if(action==="improve"){

        if(game.money<700){

            showToast("💰 بودجه کافی نیست.");

            return;

        }

        game.money-=700;

        game.relations[name] =
            Math.min(100,game.relations[name]+8);

    }

    if(action==="trade"){

        if(game.money<1000){

            showToast("💰 بودجه کافی نیست.");

            return;

        }

        game.money-=1000;

        game.relations[name] =
            Math.min(100,game.relations[name]+12);

        game.production+=12;

    }

    if(action==="pressure"){

        game.relations[name] =
            Math.max(-100,game.relations[name]-12);

        game.reputation =
            Math.max(0,game.reputation-2);

    }

    saveGame();

    updateUI();

    renderManagement();

}


function domesticPolicy(type){

    switch(type){

        case "economy":

            if(game.money<2500){

                showToast("💰 بودجه کافی نیست.");

                return;

            }

            game.money-=2500;

            game.production+=45;

            game.inflation+=1;

            break;


        case "education":

            if(game.money<1800){

                showToast("💰 بودجه کافی نیست.");

                return;

            }

            game.money-=1800;

            game.research+=15;

            game.reputation+=3;

            break;


        case "health":

            if(game.money<1600){

                showToast("💰 بودجه کافی نیست.");

                return;

            }

            game.money-=1600;

            game.stability=
                Math.min(100,game.stability+8);

            game.population+=2;

            break;


        case "infrastructure":

            if(game.money<3000){

                showToast("💰 بودجه کافی نیست.");

                return;

            }

            game.money-=3000;

            game.production+=55;

            game.stability=
                Math.min(100,game.stability+3);

            break;


        case "stability":

            if(game.money<2200){

                showToast("💰 بودجه کافی نیست.");

                return;

            }

            game.money-=2200;

            game.stability=
                Math.min(100,game.stability+12);

            break;


        case "research":

            if(game.money<3500){

                showToast("💰 بودجه کافی نیست.");

                return;

            }

            game.money-=3500;

            game.research+=25;

            break;

    }

    saveGame();

    updateUI();

    renderManagement();

    showToast("🏛️ سیاست داخلی اجرا شد.");

}

function nextTurn(){

    game.turn++;

    game.year++;

    const taxIncome =
        Math.floor(
            game.population *
            game.tax *
            3
        );

    const productionIncome =
        Math.floor(
            game.production * 18
        );

    game.money +=
        taxIncome +
        productionIncome;

    game.food =
        Math.max(
            0,
            game.food -
            Math.floor(game.population*2)
        );

    game.energy =
        Math.max(
            0,
            game.energy -
            Math.floor(game.population*.8)
        );

    game.stability =
        Math.max(
            0,
            Math.min(
                100,
                game.stability +
                (game.tax<=20 ? 1 : -2)
            )
        );

    if(game.food<=0){

        game.stability =
            Math.max(0,game.stability-5);

    }

    if(game.energy<=0){

        game.production =
            Math.max(1,game.production-10);

    }

    game.research +=
        Math.floor(game.educationBudget/5);

    game.inflation +=
        Math.max(
            0,
            Math.floor((game.tax-25)/10)
        );

    saveGame();

    updateUI();

    renderManagement();

    showToast(
        `📅 سال ${game.year} آغاز شد. درآمد سالانه به خزانه اضافه شد.`
    );

}

/* =========================================================
   ابزارها
========================================================= */

function formatNumber(number){

    return Number(number || 0)
        .toLocaleString("en-US");

}


function hashString(str){

    let hash=0;

    for(let i=0;i<str.length;i++){

        hash =
            ((hash<<5)-hash)+
            str.charCodeAt(i);

        hash |= 0;

    }

    return Math.abs(hash);

}


function escapeHTML(str){

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


let toastTimer=null;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent=message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{

            toast.classList.remove("show");

        },2600);

}
