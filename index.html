<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>World Nations</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#07111d;
color:#eee;
font-family:Tahoma,Arial,sans-serif;
font-size:14px;
}

button,select{
font-family:Tahoma,Arial,sans-serif;
}

.header{
background:#0d1d30;
border-bottom:1px solid #29405a;
padding:12px 10px;
text-align:center;
}

.header h1{
margin:0;
font-size:21px;
}

.header p{
margin:5px 0 0;
color:#9db0c4;
font-size:12px;
}

.wrap{
width:100%;
max-width:1100px;
margin:auto;
padding:8px;
}

.panel{
background:#0d1b2b;
border:1px solid #243c56;
border-radius:10px;
padding:9px;
margin-bottom:8px;
}

.title{
font-size:16px;
font-weight:bold;
margin-bottom:8px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:5px;
}

.stat{
background:#111f31;
border:1px solid #21364d;
border-radius:8px;
padding:8px;
text-align:center;
}

.stat span{
display:block;
font-size:11px;
color:#8fa4b8;
}

.stat b{
display:block;
font-size:16px;
margin-top:4px;
}

.mapbox{
position:relative;
background:#071521;
border:1px solid #29445d;
border-radius:9px;
overflow:hidden;
height:430px;
}

#world{
width:100%;
height:100%;
display:block;
}

.ocean{
fill:#0b2639;
}

.land{
fill:#536b55;
stroke:#263e2d;
stroke-width:1;
}

.land2{
fill:#61765a;
stroke:#263e2d;
stroke-width:1;
}

.countryPoint{
cursor:pointer;
}

.countryPoint circle{
fill:#e7c45a;
stroke:#111;
stroke-width:1.5;
}

.countryPoint text{
fill:white;
font-size:10px;
font-weight:bold;
paint-order:stroke;
stroke:#07111d;
stroke-width:3px;
}

.countryPoint:hover circle{
fill:#fff;
}

.mapButtons{
position:absolute;
left:7px;
top:7px;
display:flex;
gap:5px;
}

.mapButtons button{
width:38px;
height:34px;
padding:0;
font-size:18px;
}

button{
border:0;
border-radius:7px;
padding:10px;
background:#176b78;
color:white;
font-weight:bold;
font-size:13px;
}

button:active{
opacity:.7;
}

.red{background:#963e48}
.blue{background:#315f98}
.gold{background:#8a6b27}
.green{background:#286b49}
.gray{background:#35485a}

select{
width:100%;
background:#17283b;
border:1px solid #34516c;
color:white;
border-radius:7px;
padding:10px;
}

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:5px;
}

.countries{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:5px;
}

.country{
background:#142437;
border:1px solid #263e56;
border-radius:7px;
padding:8px;
}

.country strong{
font-size:13px;
}

.country small{
display:block;
color:#91a5b8;
margin-top:4px;
}

.bar{
height:7px;
background:#07111d;
border-radius:5px;
margin-top:5px;
overflow:hidden;
}

.bar i{
display:block;
height:100%;
background:#2d9d79;
}

.log{
height:155px;
overflow-y:auto;
background:#07111d;
border-radius:7px;
padding:7px;
font-size:11px;
}

.log div{
padding:5px 2px;
border-bottom:1px solid #182b3e;
}

.info{
color:#9db0c4;
line-height:1.8;
font-size:12px;
}

.notice{
background:#142c36;
border:1px solid #285b65;
border-radius:7px;
padding:8px;
margin-bottom:8px;
font-size:12px;
}

@media(min-width:700px){
.stats{
grid-template-columns:repeat(4,1fr);
}

.countries{
grid-template-columns:repeat(4,1fr);
}

.actions{
grid-template-columns:repeat(4,1fr);
}

.mapbox{
height:540px;
}
}

@media(max-width:360px){
body{font-size:12px}
.header h1{font-size:18px}
.mapbox{height:330px}
.stat b{font-size:14px}
button{font-size:11px;padding:9px 5px}
}
</style>
</head>

<body>

<div class="header">
<h1>🌍 WORLD NATIONS</h1>
<p>بازی استراتژیک مدیریت کشورها</p>
</div>

<div class="wrap">

<circle cx="520" cy="205" r="6"/>

</g>

<circle cx="830" cy="360" r="7"/>

</svg>
</div>

</div>


<div class="panel">

<div class="title">📊 اطلاعات کشور من</div>

<div class="info" id="myInfo"></div>

</div>


<div class="panel">

<div class="title">⚙️ مدیریت کشور</div>

<div class="actions">

<button onclick="investEconomy()">
🏭 اقتصاد +5
</button>

<button class="blue" onclick="trainArmy()">
🪖 ارتش +4
</button>

<button class="gold" onclick="buildCity()">
🏙️ ساخت شهر
</button>

<button class="green" onclick="endTurn()">
⏭️ پایان نوبت
</button>

</div>

</div>


<div class="panel">

<div class="title">🌐 کشورها</div>

<div id="countries" class="countries"></div>

</div>


<div class="panel">

<div class="title">🤝 دیپلماسی</div>

<select id="target"></select>

<br><br>

<div class="actions">

<button onclick="trade()">
📦 تجارت
</button>

<button onclick="alliance()">
🤝 اتحاد
</button>

<button class="red" onclick="war()">
⚔️ جنگ
</button>

<button class="gray" onclick="spy()">
🕵️ جاسوسی
</button>

</div>

</div>


<div class="panel">

<div class="title">📜 گزارش جهان</div>

<div id="log" class="log"></div>

</div>


<div class="panel">

<button class="gray" onclick="saveGame()">
💾 ذخیره بازی
</button>

<br><br>

<button class="red" onclick="newGame()">
🔄 بازی جدید
</button>

</div>

</div>

</div>


<script>

var nations={

iran:{
name:"ایران",flag:"🇮🇷",
money:1200,pop:89,economy:65,army:70,
oil:85,food:55,tech:55,city:8
},

usa:{
name:"آمریکا",flag:"🇺🇸",
money:3200,pop:340,economy:95,army:95,
oil:70,food:80,tech:98,city:40
},

china:{
name:"چین",flag:"🇨🇳",
money:2900,pop:1410,economy:93,army:91,
oil:55,food:82,tech:88,city:55
},

russia:{
name:"روسیه",flag:"🇷🇺",
money:1900,pop:144,economy:73,army:90,
oil:95,food:70,tech:72,city:20
},

india:{
name:"هند",flag:"🇮🇳",
money:1800,pop:1430,economy:79,army:80,
oil:45,food:75,tech:73,city:35
},

germany:{
name:"آلمان",flag:"🇩🇪",
money:2200,pop:84,economy:90,army:62,
oil:25,food:65,tech:94,city:25
},

japan:{
name:"ژاپن",flag:"🇯🇵",
money:2300,pop:124,economy:88,army:65,
oil:15,food:45,tech:96,city:30
},

brazil:{
name:"برزیل",flag:"🇧🇷",
money:1500,pop:216,economy:71,army:60,
oil:65,food:92,tech:62,city:25
},

uk:{
name:"بریتانیا",flag:"🇬🇧",
money:2100,pop:69,economy:87,army:70,
oil:35,food:50,tech:92,city:22
},

france:{
name:"فرانسه",flag:"🇫🇷",
money:2100,pop:68,economy:85,army:73,
oil:20,food:75,tech:90,city:23
},

turkey:{
name:"ترکیه",flag:"🇹🇷",
money:1300,pop:86,economy:68,army:72,
oil:30,food:70,tech:63,city:18
},

egypt:{
name:"مصر",flag:"🇪🇬",
money:900,pop:112,economy:54,army:67,
oil:45,food:55,tech:50,city:12
},

saudi:{
name:"عربستان",flag:"🇸🇦",
money:2500,pop:37,economy:76,army:69,
oil:100,food:25,tech:65,city:10
},

canada:{
name:"کانادا",flag:"🇨🇦",
money:2400,pop:41,economy:84,army:55,
oil:90,food:85,tech:82,city:14
},

mexico:{
name:"مکزیک",flag:"🇲🇽",
money:1200,pop:130,economy:67,army:64,
oil:60,food:78,tech:60,city:20
},

australia:{
name:"استرالیا",flag:"🇦🇺",
money:2000,pop:27,economy:82,army:58,
oil:75,food:88,tech:84,city:12
}

};

var player="";
var turn=1;
var relations={};
var zoom=1;


function startGame(){

player=document.getElementById("myCountry").value;

turn=1;
relations={};

for(var id in nations){

if(id!=player){
relations[id]=0;
}

}

document.getElementById("start").style.display="none";
document.getElementById("game").style.display="block";

createTarget();
render();
log("🎮 بازی شروع شد.");
log("🌍 کشور خودت را مدیریت کن.");

}


function render(){

var c=nations[player];

document.getElementById("nationTitle").innerHTML=
c.flag+" "+c.name+" — نوبت "+turn;

document.getElementById("money").innerHTML=
Math.floor(c.money);

document.getElementById("population").innerHTML=
c.pop+" میلیون";

document.getElementById("economy").innerHTML=
c.economy;

document.getElementById("army").innerHTML=
c.army;

document.getElementById("myInfo").innerHTML=
"🛢️ نفت: "+c.oil+
"　 🍞 غذا: "+c.food+
"　 💻 فناوری: "+c.tech+
"<br>🏙️ شهرها: "+c.city+
"　 📈 درآمد هر نوبت: "+Math.floor(c.economy*10);

renderCountries();

}


function renderCountries(){

var box=document.getElementById("countries");

box.innerHTML="";

for(var id in nations){

var c=nations[id];

var d=document.createElement("div");

d.className="country";

d.innerHTML=
"<strong>"+c.flag+" "+c.name+"</strong>"+
"<small>اقتصاد: "+c.economy+
" | ارتش: "+c.army+"</small>"+
"<div class='bar'><i style='width:"+
Math.min(100,c.economy)+
"%'></i></div>";

box.appendChild(d);

}

}


function createTarget(){

var select=document.getElementById("target");

select.innerHTML="";

for(var id in nations){

if(id!=player){

var op=document.createElement("option");

op.value=id;

op.innerHTML=
nations[id].flag+" "+nations[id].name;

select.appendChild(op);

}

}

}


function investEconomy(){

var c=nations[player];

if(c.money<250){

log("❌ پول کافی نداری.");

return;
}

c.money-=250;
c.economy+=5;

if(c.economy>100)c.economy=100;

log("🏭 سرمایه‌گذاری اقتصادی انجام شد.");

render();

}


function trainArmy(){

var c=nations[player];

if(c.money<220){

log("❌ پول کافی نداری.");

return;
}

c.money-=220;
c.army+=4;

if(c.army>100)c.army=100;

log("🪖 ارتش تقویت شد.");

render();

}


function buildCity(){

var c=nations[player];

if(c.money<500){

log("❌ ساخت شهر 500 واحد هزینه دارد.");

return;
}

c.money-=500;
c.city+=1;
c.economy+=2;

log("🏙️ یک شهر جدید ساخته شد.");

render();

}


function trade(){

var id=document.getElementById("target").value;
var c=nations[player];
var other=nations[id];

if(c.money<100){

log("❌ سرمایه کافی برای تجارت نداری.");

return;
}

c.money-=100;
c.money+=Math.floor(other.economy*5);

if(relations[id]<100){
relations[id]+=10;
}

log("📦 تجارت با "+other.name+" انجام شد.");

render();

}


function alliance(){

var id=document.getElementById("target").value;

relations[id]+=25;

if(relations[id]>100)
relations[id]=100;

log("🤝 روابط با "+nations[id].name+" بهتر شد.");

}


function spy(){

var id=document.getElementById("target").value;
var c=nations[id];

log(
"🕵️ اطلاعات "+c.name+
": اقتصاد "+c.economy+
" | ارتش "+c.army+
" | نفت "+c.oil+
" | فناوری "+c.tech
);

}


function war(){

var id=document.getElementById("target").value;

var me=nations[player];
var enemy=nations[id];

if(relations[id]>20){

log("⚠️ روابط با این کشور خوب است؛ فعلاً جنگ منطقی نیست.");

return;
}

var myPower=me.army+
Math.floor(Math.random()*25);

var enemyPower=enemy.army+
Math.floor(Math.random()*25);

if(myPower>=enemyPower){

me.money+=350;
enemy.money=Math.max(0,enemy.money-350);

enemy.army=Math.max(1,enemy.army-8);

log(
"🏆 پیروز شدی! "+enemy.name+
" خسارت اقتصادی دریافت کرد."
);

}else{

me.money=Math.max(0,me.money-300);
me.army=Math.max(1,me.army-8);

log(
"❌ در جنگ با "+enemy.name+
" شکست خوردی."
);

}

relations[id]-=60;

render();

}


function endTurn(){

var c=nations[player];

turn++;

var income=Math.floor(c.economy*10);

c.money+=income;

log(
"📅 نوبت "+turn+
" — درآمد کشور +"+income
);

worldTurn();

render();

}


function worldTurn(){

for(var id in nations){

if(id==player)continue;

var c=nations[id];

var income=Math.floor(c.economy*7);

c.money+=income;

var r=Math.random();

if(r<0.18){

c.economy+=1;

}

if(r>0.90){

c.money=Math.max(0,c.money-100);

}

}

if(Math.random()<0.25){

var keys=[];

for(var id in nations){

if(id!=player)keys.push(id);

}

var a=keys[Math.floor(Math.random()*keys.length)];

log(
"🌐 خبر جهان: وضعیت "+
nations[a].name+
" تغییر کرد."
);

}

}


function selectMapCountry(id){

if(!nations[id])return;

var c=nations[id];

log(
"📍 "+c.flag+" "+c.name+
" | اقتصاد: "+c.economy+
" | ارتش: "+c.army+
" | جمعیت: "+c.pop+" میلیون"
);

}


function zoomMap(amount){

zoom*=amount;

if(zoom<0.8)zoom=0.8;
if(zoom>2.5)zoom=2.5;

document.getElementById("world")
.setAttribute(
"viewBox",
(500-(500/zoom))+
" "+
(250-(250/zoom))+
" "+
(1000/zoom)+
" "+
(500/zoom)
);

}


function resetMap(){

zoom=1;

document.getElementById("world")
.setAttribute(
"viewBox",
"0 0 1000 500"
);

}


function log(text){

var box=document.getElementById("log");

var d=document.createElement("div");

d.innerHTML=
"• "+text;

box.insertBefore(d,box.firstChild);

while(box.children.length>35){

box.removeChild(box.lastChild);

}

}


function saveGame(){

var data={
player:player,
turn:turn,
nations:nations,
relations:relations
};

try{

localStorage.setItem(
"worldNationsSave",
JSON.stringify(data)
);

log("💾 بازی ذخیره شد.");

}catch(e){

log("⚠️ ذخیره بازی در این مرورگر ممکن نیست.");

}

}


function loadGame(){

try{

var raw=localStorage.getItem(
"worldNationsSave"
);

if(!raw)return;

var data=JSON.parse(raw);

player=data.player;
turn=data.turn;
relations=data.relations;

for(var id in data.nations){

nations[id]=data.nations[id];

}

document.getElementById("start").style.display="none";
document.getElementById("game").style.display="block";

createTarget();
render();

log("💾 بازی قبلی بارگذاری شد.");

}catch(e){}

}


function newGame(){

try{
localStorage.removeItem("worldNationsSave");
}catch(e){}

location.reload();

}


window.onload=function(){

loadGame();

};

</script>
