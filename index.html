<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>WORLD EMPIRE — War Expansion</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:#08111d;
    color:#fff;
}

button,input,select{font-family:inherit}

#countryScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:
      radial-gradient(circle at 50% 20%,#17385a 0,#08111d 55%,#03070c 100%);
    display:flex;
    flex-direction:column;
}

.countryHeader{
    padding:22px 15px 10px;
    text-align:center;
}

.countryHeader h1{
    margin:0;
    font-size:28px;
}

.countryHeader p{
    color:#a9bfd4;
    margin:8px 0;
}

.countrySearch{
    width:min(700px,92%);
    margin:8px auto;
    background:#111f2e;
    border:1px solid #28445e;
    border-radius:14px;
    padding:12px;
    color:white;
    outline:none;
}

.countryList{
    flex:1;
    overflow:auto;
    padding:10px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:10px;
    width:min(1100px,100%);
    margin:auto;
}

.countryCard{
    background:linear-gradient(145deg,#122438,#0c1724);
    border:1px solid #29445d;
    border-radius:15px;
    padding:13px;
    cursor:pointer;
    transition:.15s;
}

.countryCard:hover{
    transform:translateY(-2px);
    border-color:#4b87b8;
}

.flag{
    font-size:27px;
    vertical-align:middle;
    margin-left:7px;
}

.countryName{
    font-weight:bold;
    font-size:16px;
}

.countryPop{
    color:#9bb1c4;
    font-size:12px;
    margin-top:8px;
}

.startBox{
    padding:12px;
    text-align:center;
    background:#08121e;
    border-top:1px solid #21394e;
}

#selectedCountry{
    margin-bottom:9px;
    color:#dceeff;
}

.startBtn{
    border:0;
    border-radius:13px;
    padding:13px 35px;
    font-weight:bold;
    background:#1f86d7;
    color:white;
    cursor:pointer;
}

#game{
    display:none;
    width:100%;
    height:100%;
    position:relative;
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.topBar{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    z-index:5000;
    background:rgba(7,16,27,.94);
    border:1px solid #29445b;
    border-radius:14px;
    padding:7px;
    box-shadow:0 5px 20px #0008;
}

.stats{
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

.stat{
    flex:0 0 auto;
    background:#102131;
    border:1px solid #294359;
    padding:7px 10px;
    border-radius:10px;
    min-width:85px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:13px;
}

.stat span{
    color:#a9bed0;
    font-size:10px;
}

.controlled{
    margin-top:7px;
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
}

.controlCountry{
    flex:0 0 auto;
    background:#152a3d;
    border:1px solid #365a73;
    color:#fff;
    padding:6px 9px;
    border-radius:10px;
    font-size:11px;
    cursor:pointer;
}

.controlCountry.mine{
    border-color:#ff3d3d;
    background:#421b22;
}

.bottomDock{
    position:absolute;
    bottom:9px;
    left:8px;
    right:8px;
    z-index:5000;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.dockBtn{
    min-height:49px;
    border:1px solid #31536c;
    background:rgba(8,19,31,.96);
    color:white;
    border-radius:13px;
    font-weight:bold;
    cursor:pointer;
    font-size:11px;
}

.dockBtn:hover{
    background:#17344b;
}

.modal{
    position:fixed;
    inset:0;
    z-index:20000;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:#0008;
}

.modal.show{display:flex}

.panel{
    width:min(850px,100%);
    max-height:90vh;
    overflow:auto;
    background:linear-gradient(#102131,#09131f);
    border:1px solid #31536b;
    border-radius:20px 20px 0 0;
    padding:16px;
    box-shadow:0 -10px 40px #000b;
}

.panel h2{
    margin:0 0 12px;
}

.close{
    float:left;
    background:#48232a;
    border:1px solid #72333e;
    color:white;
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
}

.section{
    background:#0d1c2b;
    border:1px solid #223b51;
    border-radius:13px;
    padding:11px;
    margin-bottom:9px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
    gap:8px;
}

.card{
    background:#13273a;
    border:1px solid #29465d;
    border-radius:11px;
    padding:10px;
}

.card small{
    color:#91a8ba;
}

.action{
    width:100%;
    margin-top:7px;
    padding:9px;
    border:0;
    border-radius:9px;
    background:#176da8;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.action:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.danger{background:#7b2732}
.success{background:#237548}
.gold{background:#87651e}

.progress{
    height:9px;
    background:#07111b;
    border-radius:20px;
    overflow:hidden;
    margin-top:6px;
}

.progress i{
    display:block;
    height:100%;
    width:50%;
    background:#3b91cf;
}

.unitVisual{
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
}

.armyRow{
    display:flex;
    justify-content:space-between;
    padding:7px;
    background:#0a1724;
    border-radius:8px;
    margin-top:5px;
}

.log{
    max-height:180px;
    overflow:auto;
    font-size:11px;
}

.log div{
    padding:5px;
    border-bottom:1px solid #1d3345;
    color:#adc1d0;
}

/* ---------------- WAR MINI ANIMATIONS ---------------- */

#warAnimationLayer{
    position:fixed;
    inset:0;
    z-index:18000;
    pointer-events:none;
    display:none;
    overflow:hidden;
}

#warAnimationLayer.active{
    display:block;
}

.battleSky{
    position:absolute;
    inset:0;
    background:linear-gradient(#06132155,#06132100 50%,#07111d55);
}

.fighterAnim{
    position:absolute;
    font-size:38px;
    filter:drop-shadow(0 4px 5px #000);
    animation:flyAcross 1.8s linear forwards;
}

.fighterTrail{
    position:absolute;
    width:90px;
    height:3px;
    background:linear-gradient(90deg,transparent,#cdeaff);
    border-radius:10px;
    animation:trail .8s linear forwards;
}

@keyframes flyAcross{
    0%{
        transform:translate(-100px,40px) rotate(-4deg);
        opacity:0;
    }
    15%{opacity:1}
    80%{opacity:1}
    100%{
        transform:translate(calc(100vw + 150px),-80px) rotate(-4deg);
        opacity:0;
    }
}

@keyframes trail{
    from{opacity:.8;transform:scaleX(.2)}
    to{opacity:0;transform:scaleX(1)}
}

.explosion{
    position:absolute;
    font-size:44px;
    animation:boom .8s ease-out forwards;
}

@keyframes boom{
    0%{transform:scale(.2);opacity:0}
    25%{transform:scale(1.3);opacity:1}
    100%{transform:scale(1.9);opacity:0}
}

.battleResult{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#091522ee;
    border:1px solid #456a83;
    padding:22px 30px;
    border-radius:18px;
    text-align:center;
    animation:resultIn .4s ease-out;
}

@keyframes resultIn{
    from{transform:translate(-50%,-50%) scale(.7);opacity:0}
    to{transform:translate(-50%,-50%) scale(1);opacity:1}
}

.leaflet-control-attribution{
    font-size:8px;
}
</style>
</head>

<body>

<!-- ================= STORE ================= -->

<div id="storeModal" class="modal">

</div>
</div>

<!-- ================= GOVERNMENT ================= -->

<div id="governmentModal" class="modal">

<button class="close" onclick="closeModal('governmentModal')">بستن</button>

</div>
</div>

<!-- ================= ARMY ================= -->

<div id="armyModal" class="modal">

<button class="close" onclick="closeModal('armyModal')">بستن</button>
<h2>👥 ارتش و تولید ساعتی</h2>

</div>
</div>

<div id="warModal" class="modal">

/* =========================================================
   HELPERS
========================================================= */

const DB={};

COUNTRIES.forEach(c=>{
    DB[c[0]]={
        name:c[0],
        flag:c[1],
        iso:c[2],
        population:c[3]
    };
});

function formatNum(n){
    n=Math.round(n||0);

    if(n>=1000000000)
        return (n/1000000000).toFixed(2)+"B";

    if(n>=1000000)
        return (n/1000000).toFixed(1)+"M";

    if(n>=1000)
        return (n/1000).toFixed(1)+"K";

    return n.toLocaleString("en-US");
}

function clamp(n,a,b){
    return Math.max(a,Math.min(b,n));
}

function rnd(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

function countryData(name){
    if(DB[name]) return DB[name];

    return {
        name,
        flag:"🏳️",
        iso:"",
        population:1000000
    };
}

/* =========================================================
   GAME STATE
========================================================= */

let map=null;
let geoLayer=null;
let geoData=null;

const game={

    conquered:[],

    reputation:60,

    infrastructure:25,

    economyLevel:1,

    productionTimer:0,

    activeWars:[],

    ai:{

    },

    inventory:{
        food:0,
        industry:0,
        infrastructure:0,
        technology:0
    },

    logs:[]
};

/* =========================================================
   COUNTRY SELECT
========================================================= */

function renderCountryList(list=COUNTRIES){

    const el=document.getElementById("countryList");

    el.innerHTML=list.map(c=>`

        <div class="countryCard"
             onclick="selectCountry('${c[0].replace(/'/g,"\\'")}')">

            <div>
                <span class="flag">${c[1]}</span>
                <span class="countryName">${c[0]}</span>
            </div>

            <div class="countryPop">
                جمعیت تقریبی: ${formatNum(c[3])}
            </div>

        </div>

    `).join("");
}

function filterCountries(){

    const q=document.getElementById("countrySearch").value
        .trim()
        .toLowerCase();

    renderCountryList(
        COUNTRIES.filter(c=>c[0].toLowerCase().includes(q))
    );
}

function selectCountry(name){

    selectedCountry=name;

    const d=countryData(name);

    document.getElementById("selectedCountry").innerHTML=
        `${d.flag} <b>${d.name}</b> — جمعیت ${formatNum(d.population)}`;
}

renderCountryList();

/* =========================================================
   START
========================================================= */

function startGame(){

    if(!selectedCountry){
        alert("ابتدا یک کشور انتخاب کنید.");
        return;
    }

    game.started=true;
    game.countryCode=selectedCountry;

    const d=countryData(selectedCountry);

    game.population=d.population;

    game.money=100000+
        Math.floor(d.population/5000);

    game.army=Math.max(
        800,
        Math.floor(d.population/100000)
    );

    game.soldiers=game.army;

    game.reserves=Math.floor(game.army*.15);

    initAI();

    document.getElementById("countryScreen").style.display="none";
    document.getElementById("game").style.display="block";

    initMap();

    addLog("کشور "+d.name+" وارد بازی شد.");
    addLog("تولید منابع اکنون به صورت ساعتی انجام می‌شود.");

    updateUI();
}

/* =========================================================
   MAP
   این قسمت همان ساختار نقشه قبلی را حفظ می‌کند.
========================================================= */

const MAP_GEOJSON=
"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";

/* رنگ‌های ثابت کشورها */
const COUNTRY_COLORS=[
"#357ABD","#8B5CF6","#0E9F6E","#D97706","#0891B2",
"#BE185D","#65A30D","#7C3AED","#0369A1","#C2410C",
"#15803D","#9333EA","#0369A1","#B45309","#BE123C",
"#4D7C0F","#6D28D9","#0F766E","#A16207","#9D174D",
"#1D4ED8","#047857","#B91C1C","#7E22CE","#0369A1",
"#CA8A04","#166534","#9F1239","#4338CA","#0F766E"
];

const colorCache={};

function colorHash(str){

    let h=0;

    for(let i=0;i<str.length;i++)
        h=(h*31+str.charCodeAt(i))>>>0;

    return COUNTRY_COLORS[h%COUNTRY_COLORS.length];
}

function getCountryColor(name){

    if(
        name===game.countryCode ||
        game.conquered.includes(name)
    ){
        return "#d91f26";
    }

    if(!colorCache[name])
        colorCache[name]=colorHash(name);

    return colorCache[name];
}

function getFeatureName(feature){

    const p=feature.properties||{};

    return p.ADMIN ||
           p.name ||
           p.NAME ||
           p.NAME_EN ||
           p.SOVEREIGNT ||
           "";
}

function countryStyle(feature){

    const name=getFeatureName(feature);

    return {
        color:"#263d4e",
        weight:1,
        fillColor:getCountryColor(name),
        fillOpacity:.66
    };
}

function refreshCountryColors(){

    if(!geoLayer)return;

    geoLayer.eachLayer(layer=>{

        const name=getFeatureName(layer.feature);

        layer.setStyle({
            fillColor:getCountryColor(name),
            fillOpacity:.66,
            color:"#263d4e",
            weight:1
        });

    });
}

function initMap(){

    map=L.map("map",{
        worldCopyJump:false,
        zoomControl:false,
        minZoom:2,
        maxZoom:7
    }).setView([25,10],2);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);

    fetch(MAP_GEOJSON)
    .then(r=>r.json())
    .then(data=>{

        geoData=data;

        geoLayer=L.geoJSON(data,{
            style:countryStyle,

            onEachFeature:(feature,layer)=>{

                layer.on({

                    click:()=>{
                        const name=getFeatureName(feature);
                        showCountryInfo(name);
                    },

                    mouseover:e=>{
                        e.target.setStyle({
                            weight:2,
                            color:"#ffffff",
                            fillOpacity:.78
                        });
                    },

                    mouseout:e=>{
                        geoLayer.resetStyle(e.target);
                    }

                });

            }

        }).addTo(map);

        refreshCountryColors();

    })
    .catch(()=>{
        addLog("نقشه در حالت آفلاین قابل بارگذاری نیست.");
    });
}

/* =========================================================
   HOURLY PRODUCTION
========================================================= */

function calculateProduction(){

    let base=
        100+
        game.population/500000+
        game.cities*70+
        game.industry*4+
        game.infrastructure*2+
        game.economyLevel*120;

    base*=
        1+
        (game.stability-50)/500;

    base*=
        1+
        (game.tax-15)/500;

    return Math.max(50,Math.floor(base));
}

function hourlyProduction(){

    game.production=calculateProduction();

    const income=game.production;

    game.money+=income;

    /* منابع ساعتی */
    game.food+=Math.floor(game.production*.18);
    game.energy+=Math.floor(game.production*.08);
    game.industry+=Math.floor(game.production*.02);

    /* رشد آرام جمعیت */
    game.population+=Math.floor(
        game.population*.000025
    );

    /* کاهش فرسایش جنگ */
    if(game.warWeariness>0)
        game.warWeariness=clamp(
            game.warWeariness-.8,
            0,
            100
        );

    /* بازگشت آمادگی */
    if(game.warWeariness<25){
        game.warReadiness=clamp(
            game.warReadiness+1.5,
            0,
            100
        );
    }

    game.commandPoints=clamp(
        game.commandPoints+2,
        0,
        15
    );

    /* تولید سرباز به صورت ساعتی */
    produceSoldiers();

    addLog(
        `ساعت ${game.hour}: تولید ${formatNum(income)} واحد انجام شد.`
    );
}

function produceSoldiers(){

    const maxByIndustry=
        Math.floor(
            10+
            game.industry*.7+
            game.infrastructure*.3
        );

    const availableCapacity=
        Math.max(
            0,
            game.armyCapacity-
            game.army
        );

    const produced=Math.min(
        maxByIndustry,
        availableCapacity
    );

    if(produced<=0)return;

    game.soldiers+=produced;
    game.army+=produced;

    addLog(
        `👥 ${produced} نیروی جدید وارد ارتش شد.`
    );
}

    switch(type){

        case"food":
            game.food+=effect;

        case"energy":
            game.energy+=effect;
            break;

        case"industry":
            game.industry+=effect;
            break;

        case"road":
        case"rail":
        case"port":
        case"warehouse":
        case"service":
            game.infrastructure+=effect;
            break;

        case"city":
            game.cities++;
            game.population+=150000;
            game.armyCapacity+=effect*100;
            break;

        case"tech1":
        case"tech2":
        case"tech3":
        case"tech4":
        case"tech5":
        case"advanced":
            game.economyLevel+=.05;

            game.warReadiness+=effect;
            break;

        case"logistics":
        case"support":
        case"command":
        case"commandnet":
            game.warReadiness+=effect;
            break;

        case"readiness":
        case"defense":

            game.stability+=effect*.3;
            break;

        case"manpower":

        case"economy":
        case"production":
        case"fund":
        case"bank":
        case"export":
        case"foreign":
        case"regional":
        case"advancedEco":
            game.economyLevel+=.08;

        default:
            game.infrastructure+=effect;

    game.warReadiness=clamp(game.warReadiness,0,100);
    game.stability=clamp(game.stability,0,100);

    addLog("🛒 خرید شد: "+name);

    updateUI();

function calculateCountryPower(name){

    const d=countryData(name);

    const popPower=
        Math.log10(Math.max(100000,d.population))*180;

    const cities=
        Math.max(
            2,
            Math.floor(Math.sqrt(d.population/1000000))
        );

    const economy=
        Math.log10(Math.max(10,d.population))*90;

    const preparation=
        50+
        (d.population%40);

    return Math.floor(
        popPower+
        cities*80+
        economy+
        preparation
    );
}

function getOurWarPower(){

    return Math.floor(

        game.army*.55+

        game.soldiers*.35+

        game.infrastructure*4+

        game.industry*3+

        game.warReadiness*25+

        game.stability*12+

        game.commandPoints*70

    );
}

function warDifficulty(name){

    const p=calculateCountryPower(name);

    const modifier=
        0.85+
        ((name.length*13)%30)/100;

    return Math.floor(p*modifier);
}

========================================================= */

function startWar(target){

    if(!game.started)return;

    if(target===game.countryCode)return;

    if(game.conquered.includes(target))return;

    if(game.commandPoints<3){

        addLog("❌ امتیاز فرماندهی کافی نیست.");
        return;
    }

    if(game.warReadiness<45){

        addLog("❌ آمادگی جنگی کمتر از حد لازم است.");
        return;
    }

    if(game.stability<35){

        addLog("❌ ثبات داخلی برای جنگ کافی نیست.");
        return;
    }

    const targetPower=warDifficulty(target);

    const preparationCost=
        Math.floor(
            4000+
            targetPower*.35
        );

    if(game.money<preparationCost){

        addLog(
            "❌ برای آماده‌سازی این جنگ بودجه کافی نیست."
        );

        return;
    }

    game.money-=preparationCost;

    game.commandPoints-=3;

    game.warReadiness-=15;

    game.warWeariness+=10;

    addLog(
        `⚔️ عملیات علیه ${target} آغاز شد.`
    );

    closeModal("warModal");

    playWarAnimation(
        target,
        ()=>{
            resolveWar(target,targetPower);
        }
    );
}

/* =========================================================
   MINI FIGHTER ANIMATION
========================================================= */

            <br>
            <small>${target}</small>

    `;

    },100);

            document.createElement("div");

        fighter.className="fighterAnim";

            rnd(35,70)+"%";

    setTimeout(()=>{

/* =========================================================
   RESOLVE WAR
========================================================= */

function resolveWar(target,targetPower){

    const ourPower=getOurWarPower();

    /* عوامل غیرقطعی */
    const morale=
        game.stability*.35+
        game.warReadiness*.45+
        game.reputation*.15;

    const randomFactor=
        rnd(85,115)/100;

    const finalOur=
        ourPower*
        randomFactor*
        (1+morale/500);

    const finalEnemy=
        targetPower*
        (rnd(88,112)/100);

    const ratio=
        finalOur/
        Math.max(finalEnemy,1);

    if(ratio>=1.18){

        winWar(target,ratio);

    }else if(ratio>=.9){

        costlyWar(target,ratio);

    }else{

        loseWar(target,ratio);
    }

    updateUI();
}

/* =========================================================
   WIN
========================================================= */

function winWar(target,ratio){

    const d=countryData(target);

    game.conquered.push(target);

    game.population+=
        Math.floor(d.population*.72);

    game.money+=
        Math.floor(d.population/1500);

    game.reputation+=4;

    game.stability-=
        rnd(2,7);

    game.warReadiness-=
        rnd(12,22);

    game.warWeariness+=
        rnd(15,25);

    game.commandPoints=
        Math.max(0,game.commandPoints-2);

    game.cities+=
        Math.max(1,
        Math.floor(Math.sqrt(d.population/30000000)));

    game.army=
        Math.max(
            0,
            Math.floor(game.army*.94)
        );

    game.soldiers=
        Math.max(
            0,
            Math.floor(game.soldiers*.93)
        );

    addLog(
        `🏆 پیروزی بزرگ! ${target} به قلمرو شما اضافه شد.`
    );

    addLog(
        "👥 بخشی از نیروی انسانی و ظرفیت کشور جدید جذب شد."
    );

    refreshCountryColors();

    renderControlledCountries();

    renderWar();
}

/* =========================================================
   COSTLY WAR
========================================================= */

function costlyWar(target,ratio){

    const d=countryData(target);

    game.money-=
        Math.min(
            game.money,
            Math.floor(d.population/4000)
        );

    game.army=
        Math.floor(game.army*.86);

    game.soldiers=
        Math.floor(game.soldiers*.82);

    game.warReadiness-=20;

    game.warWeariness+=25;

    game.stability-=8;

    game.commandPoints=
        Math.max(
            0,
            game.commandPoints-3
        );

    addLog(
        `⚠️ جنگ ${target} با هزینه سنگین ادامه یافت؛ هنوز تصرف نشده است.`
    );

    addLog(
        "⚠️ برای حمله دوباره باید دوباره آماده‌سازی انجام دهید."
    );

    updateUI();
}

/* =========================================================
   LOSS
========================================================= */

function loseWar(target,ratio){

    game.army=
        Math.floor(game.army*.78);

    game.soldiers=
        Math.floor(game.soldiers*.72);

    game.reserves=
        Math.floor(game.reserves*.85);

    game.money=
        Math.floor(game.money*.92);

    game.warReadiness=
        Math.max(
            10,
            game.warReadiness-30
        );

    game.warWeariness=
        Math.min(
            100,
            game.warWeariness+35
        );

    game.stability=
        Math.max(
            15,
            game.stability-12
        );

    game.reputation=
        Math.max(
            0,
            game.reputation-6
        );

    addLog(
        `❌ حمله به ${target} شکست خورد.`
    );

    addLog(
        "🛡️ کشور برای مدتی نیاز به بازسازی و بازیابی آمادگی دارد."
    );

    updateUI();
}

/* =========================================================
   WAR AI
========================================================= */

function initAI(){

    COUNTRIES.forEach(c=>{

        if(c[0]===game.countryCode)return;

        game.ai.countries[c[0]]={

            population:c[3],

            economy:
                rnd(35,85),

            stability:
                rnd(45,90),

            readiness:
                rnd(35,90),

            diplomacy:
                rnd(35,80),

            aggression:
                rnd(20,90),

            development:
                rnd(30,85),

            warWeariness:0,

            lastAction:"idle",

            memory:[],

            cooldown:0

        };

    });
}

/* =========================================================
   STRONGER STRATEGIC AI
========================================================= */

function updateAI(){

    for(const name in game.ai.countries){

        const ai=game.ai.countries[name];

        if(ai.cooldown>0){
            ai.cooldown--;
            continue;
        }

        ai.economy=
            clamp(
                ai.economy+
                rnd(-2,3),
                10,
                100
            );

        ai.stability=
            clamp(
                ai.stability+
                rnd(-2,2),
                15,
                100
            );

        ai.readiness=
            clamp(
                ai.readiness+
                (ai.warWeariness<30?rnd(0,3):-1),
                10,
                100
            );

        ai.warWeariness=
            clamp(
                ai.warWeariness-
                rnd(0,2),
                0,
                100
            );

        const ourThreat=
            getOurWarPower()/
            Math.max(
                calculateCountryPower(name),
                1
            );

        /*
         * AI تصمیمش را بر اساس چند شاخص می‌گیرد:
         * اقتصاد
         * ثبات
         * آمادگی
         * تهدید کشور بازیکن
         * شخصیت تهاجمی
         */

        const defenseScore=
            ai.readiness+
            ai.stability+
            ai.diplomacy;

        const expansionScore=
            ai.aggression+
            ai.economy+
            ai.readiness-
            ai.warWeariness;

        if(ourThreat>1.7){

            /* کشور ضعیف‌تر بیشتر دفاعی می‌شود */

            ai.readiness=
                clamp(
                    ai.readiness+4,
                    0,
                    100
                );

            ai.diplomacy=
                clamp(
                    ai.diplomacy+3,
                    0,
                    100
                );

            ai.lastAction="defense";

        }else if(expansionScore>180){

            /*
             * AI تهاجمی‌تر می‌شود،
             * اما هر ساعت نمی‌تواند جنگ کند.
             */

            if(
                ai.readiness>60 &&
                ai.stability>45 &&
                ai.warWeariness<50
            ){

                ai.lastAction="expansion";

                ai.readiness-=8;
                ai.warWeariness+=12;

            }else{

                ai.lastAction="prepare";

                ai.readiness=
                    clamp(
                        ai.readiness+5,
                        0,
                        100
                    );
            }

        }else if(ai.economy<55){

            ai.economy+=5;
            ai.lastAction="economy";

        }else{

            ai.stability=
                clamp(
                    ai.stability+2,
                    0,
                    100
                );

            ai.lastAction="stability";
        }

        ai.cooldown=rnd(1,4);
    }

    /* گاهی AI فشار بیشتری ایجاد می‌کند */
    processAIPressure();
}

function processAIPressure(){

    const threats=[];

    for(const name in game.ai.countries){

        const ai=game.ai.countries[name];

        if(
            ai.lastAction==="expansion" &&
            ai.aggression>75
        ){

            threats.push({
                name,
                score:
                    ai.aggression+
                    ai.readiness
            });
        }
    }

    threats.sort((a,b)=>b.score-a.score);

    if(threats.length){

        const strongest=threats[0];

        if(
            strongest.score>155 &&
            Math.random()<.12
        ){

            game.stability=
                Math.max(
                    10,
                    game.stability-1
                );

            addLog(
                `⚠️ اطلاعاتی از افزایش فعالیت ${strongest.name} دریافت شد.`
            );
        }
    }
}

/* =========================================================
   ACTIVE WAR UPDATE
========================================================= */

function updateWars(){

    game.activeWars=
        game.activeWars.filter(w=>{

            w.progress+=
                rnd(1,4);

            return w.progress<100;

        });
}

/* =========================================================
   GOVERNMENT EFFECTS
========================================================= */

function updateGovernmentEffects(){

    const taxPressure=
        Math.max(
            0,
            game.tax-20
        );

    game.stability=
        clamp(
            game.stability-
            taxPressure*.015,
            0,
            100
        );

    game.reputation=
        clamp(
            game.reputation+
            (game.tax<12?.03:-.02),
            0,
            100
        );
}

/* =========================================================
   EVENTS
========================================================= */

function dailyWorldEvents(){

    const r=rnd(1,10);

    if(r<=2){

        game.money+=5000;

        addLog("📈 رشد بازار جهانی باعث افزایش درآمد شد.");

    }else if(r===3){

        game.food=
            Math.max(
                0,
                game.food-150
            );

        addLog("🌾 کاهش منابع غذایی ثبت شد.");

    }else if(r===4){

        game.energy=
            Math.max(
                0,
                game.energy-100
            );

        addLog("⚡ مصرف انرژی افزایش یافت.");

    }else if(r===5){

        game.reputation+=3;

        addLog("🤝 اعتبار بین‌المللی افزایش یافت.");

    }else if(r===6){

        game.infrastructure+=2;

        addLog("🏗️ پروژه‌های زیرساختی به پایان رسید.");

    }
}

/* =========================================================
   LOG
========================================================= */

function addLog(text){

    game.logs.push(
        "["+
        String(game.hour).padStart(2,"0")+
        ":00] "+
        text
    );

    if(game.logs.length>100)
        game.logs.shift();
}

   MODAL
========================================================= */

function closeModal(id){

    document.getElementById(id)
        .classList.remove("show");
}

/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    localStorage.setItem(
        "WORLD_EMPIRE_SAVE",
        JSON.stringify(game)
    );

    addLog("💾 بازی ذخیره شد.");
}

function loadGame(){

    const raw=
        localStorage.getItem(
            "WORLD_EMPIRE_SAVE"
        );

    if(!raw)return;

    try{

        const saved=JSON.parse(raw);

        Object.assign(game,saved);

    }catch(e){}
}

   AUTO SAVE
========================================================= */

setInterval(()=>{

    if(game.started){

        localStorage.setItem(
            "WORLD_EMPIRE_SAVE",
            JSON.stringify(game)
        );

    }

},30000);

   CLOSE MODAL BY BACKGROUND
========================================================= */

        if(e.target===m)

});

/* =========================================================
   EXTRA WAR DETAILS
========================================================= */

function mobilizeForWar(){

    if(game.money<6000)return;

    game.money-=6000;

    const available=
        Math.min(
            game.reserves,
            500
        );

    game.soldiers+=available;
    game.army+=available;
    game.reserves-=available;

    game.warReadiness=
        clamp(
            game.warReadiness+10,
            0,
            100
        );

    addLog(
        `👥 ${available} نیروی ذخیره به ارتش فعال منتقل شد.`
    );

    updateUI();
}

/* =========================================================
   CONTEXTUAL WAR POWER
========================================================= */

function detailedWarReport(target){

    const enemy=
        warDifficulty(target);

    const ours=
        getOurWarPower();

    let status;

    if(ours>enemy*1.3)
        status="برتری قابل توجه";

    else if(ours>enemy)
        status="برتری نسبی";

    else if(ours>enemy*.8)
        status="نبرد نزدیک";

    else
        status="هدف بسیار دشوار";

    addLog(
        `📊 گزارش ${target}: ${status}`
    );

    renderWar();
}
