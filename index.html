<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>WORLD EMPIRE — Advanced Strategy</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#06101d;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

button,input,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#countryScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at 50% 0%,#18365a 0,#091524 45%,#030811 100%);
}

.countryHeader{
    text-align:center;
    padding:22px 15px 12px;
}

.countryHeader h1{
    margin:0;
    font-size:29px;
}

.countryHeader p{
    margin:8px 0 0;
    color:#9eb2c8;
    font-size:12px;
}

.countryTools{
    display:flex;
    gap:8px;
    padding:9px 12px;
}

.countryTools input{
    flex:1;
    min-width:0;
    border:1px solid #29435e;
    background:#0e1d30;
    color:#fff;
    border-radius:12px;
    padding:12px;
    outline:none;
}

.countryTools button{
    border:0;
    border-radius:12px;
    background:#1b3552;
    color:#fff;
    padding:0 13px;
}

#countryList{
    flex:1;
    overflow-y:auto;
    padding:6px 12px 80px;
}

.countryCard{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px;
    margin-bottom:8px;
    background:linear-gradient(135deg,#10243a,#0b1828);
    border:1px solid #27415d;
    border-radius:15px;
}

.countryFlag{
    width:48px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    background:#081321;
    border-radius:11px;
    flex-shrink:0;
}

.countryInfo{
    flex:1;
    min-width:0;
}

.countryName{
    font-size:15px;
    font-weight:bold;
}

.countryMeta{
    color:#8fa6bd;
    font-size:10px;
    line-height:1.8;
    margin-top:3px;
}

.countryChoose{
    border:0;
    background:#d92735;
    color:#fff;
    border-radius:10px;
    padding:10px 12px;
    font-size:10px;
    font-weight:bold;
}

#game{
    position:fixed;
    inset:0;
    display:none;
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.leaflet-container{
    background:#0b1726;
}

.topBar{
    position:absolute;
    z-index:1000;
    top:8px;
    left:8px;
    right:8px;
    min-height:62px;
    padding:7px;
    display:flex;
    align-items:center;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    background:rgba(6,15,27,.95);
    border:1px solid #29445f;
    border-radius:15px;
    backdrop-filter:blur(9px);
}

.topBar::-webkit-scrollbar{
    display:none;
}

.countryMini{
    min-width:155px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 8px;
}

.countryMiniFlag{
    font-size:26px;
}

.countryMiniName{
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.countryMiniSub{
    color:#8fa5bc;
    font-size:9px;
    margin-top:3px;
    white-space:nowrap;
}

.stat{
    min-width:80px;
    padding:6px 7px;
    text-align:center;
    background:#0d2035;
    border:1px solid #223b56;
    border-radius:10px;
    flex-shrink:0;
}

.stat small{
    display:block;
    color:#8fa5bb;
    font-size:9px;
}

.stat strong{
    display:block;
    font-size:11px;
    margin-top:3px;
}

.bottomDock{
    position:absolute;
    z-index:1001;
    left:8px;
    right:8px;
    bottom:8px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    padding:7px;
    background:rgba(6,15,27,.96);
    border:1px solid #29445f;
    border-radius:17px;
    backdrop-filter:blur(10px);
}

.dockBtn{
    min-height:54px;
    border:1px solid #29445f;
    border-radius:12px;
    background:#10233a;
    color:#fff;
    font-size:10px;
    font-weight:bold;
}

.dockBtn:active{
    transform:scale(.96);
}

.dockStore{
    background:linear-gradient(135deg,#50360d,#895e12);
}

.dockGov{
    background:linear-gradient(135deg,#27356f,#3b4ca0);
}

.dockWar{
    background:linear-gradient(135deg,#551d27,#922b38);
}

.dockCountry{
    background:linear-gradient(135deg,#145147,#187262);
}

.dockAI{
    background:linear-gradient(135deg,#37246d,#5d3da5);
}

.modalBack{
    position:fixed;
    inset:0;
    z-index:5000;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.68);
}

.modal{
    width:min(740px,100%);
    max-height:91vh;
    background:#091625;
    border:1px solid #2a4662;
    border-radius:22px 22px 0 0;
    overflow:hidden;
    box-shadow:0 -20px 70px rgba(0,0,0,.5);
}

.modalHeader{
    min-height:58px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #20384f;
    background:#0d1d30;
}

.modalHeader h2{
    margin:0;
    font-size:17px;
}

.closeBtn{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:#172c42;
    color:#fff;
    font-size:20px;
}

.modalBody{
    max-height:calc(91vh - 58px);
    overflow-y:auto;
    padding:13px;
}

.infoBox{
    background:#0d2035;
    border:1px solid #294663;
    border-radius:13px;
    padding:11px;
    font-size:10px;
    line-height:2;
    margin-bottom:9px;
}

.sectionTitle{
    color:#9cb1c7;
    font-size:12px;
    font-weight:bold;
    margin:14px 2px 8px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.card{
    background:#0e1f33;
    border:1px solid #233d58;
    border-radius:13px;
    padding:11px;
}

.card h3{
    margin:0 0 6px;
    font-size:12px;
}

.card p{
    color:#8ea5bc;
    font-size:9px;
    line-height:1.8;
    margin:4px 0;
}

.actionBtn{
    width:100%;
    border:0;
    border-radius:10px;
    background:#20527f;
    color:#fff;
    padding:10px;
    margin-top:7px;
    font-size:10px;
    font-weight:bold;
}

.actionBtn.red{
    background:#7c2631;
}

.actionBtn.green{
    background:#17634f;
}

.actionBtn.gold{
    background:#79540d;
}

.actionBtn.blue{
    background:#2d438d;
}

.actionBtn.purple{
    background:#55398d;
}

.actionBtn:disabled{
    opacity:.4;
}

.money{
    color:#ffd76b;
}

.good{
    color:#5be0aa;
}

.bad{
    color:#ff7580;
}

.progress{
    height:8px;
    margin-top:5px;
    background:#172d42;
    border-radius:99px;
    overflow:hidden;
}

.progress i{
    display:block;
    height:100%;
    background:#3998ee;
}

.rangeRow{
    background:#0e2034;
    border:1px solid #223d58;
    border-radius:12px;
    padding:10px;
    margin-bottom:7px;
}

.rangeRow label{
    display:flex;
    justify-content:space-between;
    font-size:10px;
}

.rangeRow input{
    width:100%;
    margin-top:7px;
}

.select{
    width:100%;
    border:1px solid #29425d;
    background:#101f32;
    color:#fff;
    padding:10px;
    border-radius:10px;
    outline:none;
}

.tabRow{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:7px;
    scrollbar-width:none;
}

.tabRow::-webkit-scrollbar{
    display:none;
}

.tab{
    border:1px solid #29425d;
    background:#102238;
    color:#b5c6d7;
    border-radius:10px;
    padding:8px 11px;
    white-space:nowrap;
    font-size:9px;
}

.tab.active{
    background:#254e77;
    color:#fff;
}

.storeItem{
    background:linear-gradient(135deg,#10243a,#0c1c2e);
    border:1px solid #28435d;
    border-radius:14px;
    padding:11px;
}

.itemIcon{
    font-size:25px;
}

.itemName{
    font-size:11px;
    font-weight:bold;
    margin-top:4px;
}

.itemDesc{
    color:#8ea4ba;
    font-size:9px;
    line-height:1.7;
    margin-top:4px;
}

.itemEffect{
    color:#63d9aa;
    font-size:9px;
    min-height:25px;
    margin-top:4px;
}

.itemPrice{
    color:#ffd76a;
    font-size:10px;
    font-weight:bold;
    margin-top:4px;
}

.warTarget,
.aiTarget{
    background:#0e1f33;
    border:1px solid #25405a;
    border-radius:13px;
    padding:10px;
    margin-bottom:7px;
}

.warTargetTop{
    display:flex;
    align-items:center;
    gap:9px;
}

.warFlag{
    font-size:27px;
}

.targetInfo{
    flex:1;
}

.targetName{
    font-size:12px;
    font-weight:bold;
}

.targetMeta{
    color:#8da4bb;
    font-size:9px;
    margin-top:4px;
    line-height:1.8;
}

.row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px;
    margin-bottom:7px;
    background:#0e1f32;
    border:1px solid #233e59;
    border-radius:12px;
}

.rowIcon{
    width:37px;
    height:37px;
    border-radius:10px;
    background:#152b42;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.rowInfo{
    flex:1;
}

.rowTitle{
    font-size:11px;
    font-weight:bold;
}

.rowText{
    color:#8ea5bc;
    font-size:9px;
    margin-top:3px;
    line-height:1.7;
}

.smallBtn{
    border:0;
    background:#21486c;
    color:#fff;
    border-radius:8px;
    padding:8px;
    font-size:9px;
}

.aiMeter{
    display:flex;
    gap:4px;
    margin-top:7px;
}

.aiDot{
    height:5px;
    flex:1;
    background:#1c334b;
    border-radius:20px;
}

.aiDot.on{
    background:#62d6a7;
}

.toast{
    position:fixed;
    z-index:9000;
    left:50%;
    bottom:88px;
    max-width:92%;
    padding:11px 15px;
    border-radius:12px;
    background:#0b1b2d;
    border:1px solid #35516d;
    text-align:center;
    font-size:10px;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,20px);
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:480px){

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .stat{
        min-width:75px;
    }

    .countryMini{
        min-width:145px;
    }

}
</style>
</head>

<body>

<!-- =========================================================
     COUNTRY SELECTION
========================================================= -->

<div id="countryScreen">

    <div class="countryHeader">
        <h1>🌍 انتخاب کشور</h1>
        <p>کشورت را انتخاب کن و وارد رقابت جهانی شو</p>
    </div>

    <div class="countryTools">
        <input id="countrySearch"
               placeholder="جستجوی کشور...">

        <button onclick="sortCountries()">
            ↕ مرتب‌سازی
        </button>
    </div>

    <div id="countryList"></div>

</div>


<!-- =========================================================
     MAIN GAME
========================================================= -->

<div id="game">

    <div id="map"></div>

    <div class="topBar">

        <div class="countryMini">

            <div id="miniFlag"
                 class="countryMiniFlag">
                🌍
            </div>

            <div>

                <div id="miniName"
                     class="countryMiniName">
                    ---
                </div>

                <div id="miniSub"
                     class="countryMiniSub">
                    کشور اصلی
                </div>

            </div>

        </div>

        <div class="stat">
            <small>💰 خزانه</small>
            <strong id="statMoney">0</strong>
        </div>

        <div class="stat">
            <small>👥 جمعیت</small>
            <strong id="statPopulation">0</strong>
        </div>

        <div class="stat">
            <small>🏭 تولید</small>
            <strong id="statProduction">0</strong>
        </div>

        <div class="stat">
            <small>⭐ اعتبار</small>
            <strong id="statRep">0</strong>
        </div>

        <div class="stat">
            <small>🏙 شهر</small>
            <strong id="statCities">0</strong>
        </div>

        <div class="stat">
            <small>🛡 توان</small>
            <strong id="statPower">0</strong>
        </div>

        <div class="stat">
            <small>⚡ آمادگی</small>
            <strong id="statReady">0%</strong>
        </div>

        <div class="stat">
            <small>🎯 فرمان</small>
            <strong id="statCP">0</strong>
        </div>

    </div>


    <div class="bottomDock">

        <button class="dockBtn dockStore"
                onclick="openModal('storeModal')">
            🛒<br>فروشگاه
        </button>

        <button class="dockBtn dockGov"
                onclick="openModal('govModal')">
            🏛<br>دولت
        </button>

        <button class="dockBtn dockWar"
                onclick="openWar()">
            ⚔️<br>جنگ
        </button>

        <button class="dockBtn dockCountry"
                onclick="openCountryManagement()">
            🏙<br>کشورها
        </button>

        <button class="dockBtn dockAI"
                onclick="openAI()">
            🧠<br>هوش مصنوعی
        </button>

    </div>

</div>


<!-- =========================================================
     STORE
========================================================= -->

<div class="modalBack" id="storeModal">

    <div class="modal">

        <div class="modalHeader">
            <h2>🛒 فروشگاه ملی</h2>

            <button class="closeBtn"
                    onclick="closeModal('storeModal')">
                ×
            </button>
        </div>

        <div class="modalBody">

            <div class="infoBox">
                💰 خزانه:
                <b class="money" id="storeMoney">0</b>
                <br>
                قیمت‌ها با شرایط اقتصادی کشور تغییر می‌کنند.
            </div>

            <div id="storeTabs"
                 class="tabRow">
            </div>

            <div id="storeGrid"
                 class="grid">
            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     GOVERNMENT
========================================================= -->

<div class="modalBack" id="govModal">

    <div class="modal">

        <div class="modalHeader">
            <h2>🏛 دولت</h2>

            <button class="closeBtn"
                    onclick="closeModal('govModal')">
                ×
            </button>
        </div>

        <div class="modalBody">

            <div id="governmentContent"></div>

        </div>

    </div>

</div>


<!-- =========================================================
     WAR
========================================================= -->

<div class="modalBack" id="warModal">

    <div class="modal">

        <div class="modalHeader">
            <h2>⚔️ مرکز عملیات</h2>

            <button class="closeBtn"
                    onclick="closeModal('warModal')">
                ×
            </button>
        </div>

        <div class="modalBody">

            <div id="warContent"></div>

        </div>

    </div>

</div>


<!-- =========================================================
     COUNTRY MANAGEMENT
========================================================= -->

<div class="modalBack" id="countryModal">

    <div class="modal">

        <div class="modalHeader">
            <h2>🌍 کشورهای تحت کنترل</h2>

            <button class="closeBtn"
                    onclick="closeModal('countryModal')">
                ×
            </button>
        </div>

        <div class="modalBody">

            <div id="countryManagementContent"></div>

        </div>

    </div>

</div>


<!-- =========================================================
     AI CENTER
========================================================= -->

<div class="modalBack" id="aiModal">

    <div class="modal">

        <div class="modalHeader">

            <h2>🧠 مرکز هوش مصنوعی جهان</h2>

            <button class="closeBtn"
                    onclick="closeModal('aiModal')">
                ×
            </button>

        </div>

        <div class="modalBody">

            <div id="aiContent"></div>

        </div>

    </div>

</div>


<div id="toast"
     class="toast">
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

let countrySortAsc=true;

function formatPopulation(n){

    if(n>=1000000000)
        return (n/1000000000).toFixed(2)+" میلیارد";

    if(n>=1000000)
        return (n/1000000).toFixed(1)+" میلیون";

    return n.toLocaleString("fa-IR");

}

function escapeJS(s){

    return String(s)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}

function renderCountryList(){

    const q=
        document.getElementById("countrySearch")
        .value
        .trim()
        .toLowerCase();

    let list=COUNTRIES.filter(c=>
        c.name.toLowerCase().includes(q) ||
        c.code.toLowerCase().includes(q)
    );

    list.sort((a,b)=>
        countrySortAsc
        ?b.population-a.population
        :a.population-b.population
    );

    document.getElementById("countryList").innerHTML=

        list.map(c=>`

            <div class="countryCard">

                <div class="countryFlag">
                    ${c.flag}
                </div>

                <div class="countryInfo">

                    <div class="countryName">
                        ${c.name}
                    </div>

                    <div class="countryMeta">
                        👥 ${formatPopulation(c.population)}
                        <br>
                        🏭 تولید ${c.production}
                        |
                        🏙 ${c.cities} شهر
                        |
                        🛡 ${c.power}
                    </div>

                </div>

                <button class="countryChoose"
                        onclick="selectCountry('${escapeJS(c.code)}')">
                    انتخاب
                </button>

            </div>

        `).join("");

}

function sortCountries(){

    countrySortAsc=!countrySortAsc;
    renderCountryList();

}

document
.getElementById("countrySearch")
.addEventListener("input",renderCountryList);

function selectCountry(code){

    const c=
        COUNTRIES.find(x=>x.code===code);

    if(!c)
        return;

    game.countryCode=c.code;
    game.countryName=c.name;
    game.flag=c.flag;

    game.population=c.population;
    game.production=c.production;
    game.cities=c.cities;
    game.power=c.power;

    game.money=
        1800+
        Math.floor(c.production*15)+
        Math.floor(c.cities*10);

    game.reputation=60;
    game.readiness=72;
    game.commandPoints=10;
    game.stability=72;
    game.warWeariness=0;
    game.warCooldown=0;

    game.conquered=[];

    game.citiesData=[];

    for(
        let i=0;
        i<Math.min(8,c.cities);
        i++
    ){

        game.citiesData.push({

            name:"شهر "+(i+1),

            level:1,

            production:
                Math.max(
                    2,
                    Math.floor(c.production/c.cities)
                )

        });

    }

    initializeAIWorld();

    document
    .getElementById("countryScreen")
    .style.display="none";

    document
    .getElementById("game")
    .style.display="block";

    updateUI();

    setTimeout(initMap,100);

    showToast(
        `${c.flag} ${c.name} انتخاب شد. هوش مصنوعی جهان فعال است.`
    );

}

const countryColorCache={};

function hashString(str){

    let hash=0;

    for(let i=0;i<str.length;i++){

        hash=
            ((hash<<5)-hash)+
            str.charCodeAt(i);

        hash|=0;

    }

    return Math.abs(hash);

}

function getFeatureName(feature){

    const p=feature.properties||{};

    return p.ADMIN ||
           p.NAME ||
           p.name ||
           p.Country ||
           p.country ||
           "";

}

function getCountryColor(name){

    const n=String(name||"").trim();

    if(
        n===game.countryCode ||
        game.conquered.includes(n)
    ){
        return "#e32632";
    }

    if(countryColorCache[n])
        return countryColorCache[n];

    const index=
        hashString(n)%COUNTRY_COLORS.length;

    countryColorCache[n]=
        COUNTRY_COLORS[index];

    return countryColorCache[n];

}

function countryStyle(feature){

    const name=
        getFeatureName(feature);

    const owned=
        name===game.countryCode ||
        game.conquered.includes(name);

    return{

        color:"#182b3e",

        weight:.8,

        fillColor:
            owned
            ?"#e32632"
            :getCountryColor(name),

        fillOpacity:.68

    };

}

function refreshCountryColors(){

    if(!geoLayer)
        return;

    geoLayer.eachLayer(layer=>{

        if(layer.feature)
            layer.setStyle(
                countryStyle(layer.feature)
            );

    });

}


/* =========================================================
   MAP INIT
========================================================= */

function initMap(){

    if(map){

        refreshCountryColors();
        return;

    }

    map=L.map("map",{

        worldCopyJump:false,

        zoomControl:false,

        minZoom:2,

        maxZoom:7

    }).setView([25,10],2);


    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom:19,

            attribution:"© OpenStreetMap"

        }

    ).addTo(map);


    fetch(MAP_GEOJSON)

    .then(r=>r.json())

    .then(data=>{

        geoData=data;

        geoLayer=L.geoJSON(

            data,

            {

                style:countryStyle,

                onEachFeature:(feature,layer)=>{

                    layer.on({

                        click:()=>{

                            const name=
                                getFeatureName(feature);

                            showCountryInfo(name);

                        },

                        mouseover:e=>{

                            e.target.setStyle({

                                weight:2,

                                color:"#ffffff",

                                fillOpacity:.78

                            });

                        },

                        mouseout:e=>{

                            geoLayer.resetStyle(
                                e.target
                            );

                        }

                    });

                }

            }

        ).addTo(map);

        refreshCountryColors();

    })

    .catch(()=>{

        showToast("نقشه در حال بارگذاری است...");

    });

}

let currentStoreCategory="منابع";

function renderStore(){

    document.getElementById("storeMoney").textContent=
        Math.floor(game.money)
        .toLocaleString("fa-IR");

    document.getElementById("storeTabs").innerHTML=

        Object.keys(STORE_CATEGORIES)
        .map(cat=>`

            <button class="tab ${
                cat===currentStoreCategory?"active":""
            }"
            onclick="setStoreCategory('${cat}')">
                ${cat}
            </button>

        `).join("");

    document.getElementById("storeGrid").innerHTML=

        STORE_CATEGORIES[currentStoreCategory]
        .map((item,index)=>{

            const price=Math.floor(
                item[4]*(1+game.inflation/100)
            );

            const key=
                currentStoreCategory+"_"+index;

            const bought=
                game.purchased[key]||0;

            return`

                <div class="storeItem">

                    <div class="itemIcon">
                        ${item[0]}
                    </div>

                    <div class="itemName">
                        ${item[1]}
                    </div>

                    <div class="itemDesc">
                        ${item[2]}
                    </div>

                    <div class="itemEffect">
                        ${item[3]}
                    </div>

                    <div class="itemPrice">
                        💰 ${price.toLocaleString("fa-IR")}
                    </div>

                    <div style="color:#7189a0;font-size:8px;margin-top:3px">
                        خرید: ${bought}
                    </div>

                    <button class="actionBtn gold"
                            onclick="buyStoreItem('${currentStoreCategory}',${index})">
                        خرید
                    </button>

                </div>

            `;

        }).join("");

}

function setStoreCategory(cat){

    currentStoreCategory=cat;
    renderStore();

}

function buyStoreItem(category,index){

    const item=
        STORE_CATEGORIES[category][index];

    const price=Math.floor(
        item[4]*(1+game.inflation/100)
    );

    if(game.money<price){

        showToast("بودجه کافی نیست.");
        return;

    }

    game.money-=price;

    const key=category+"_"+index;

    game.purchased[key]=
        (game.purchased[key]||0)+1;

    applyStoreEffect(item[3]);

    game.inflation=
        Math.max(
            0,
            game.inflation-.05
        );

    updateUI();
    renderStore();

    showToast(
        item[1]+" خریداری شد."
    );

}

function applyStoreEffect(effect){

    if(effect.includes("تولید +")){

        const n=
            parseInt(
                effect.match(/\d+/)?.[0]||0
            );

        game.production+=n;

    }

    if(effect.includes("درآمد +")){

        game.money+=
            Math.floor(game.production*.05);

    }

    if(effect.includes("تورم -")){

        const n=
            parseFloat(
                effect.match(/[\d.]+/)?.[0]||0
            );

        game.inflation=
            Math.max(
                0,
                game.inflation-n
            );

    }

    if(effect.includes("ثبات +")){

        const n=
            parseInt(
                effect.match(/\d+/)?.[0]||0
            );

        game.stability=
            Math.min(
                100,
                game.stability+n
            );

    }

    if(effect.includes("فرمان +")){

        const n=
            parseInt(
                effect.match(/\d+/)?.[0]||0
            );

        game.commandPoints=
            Math.min(
                20,
                game.commandPoints+n
            );

    }

    if(effect.includes("شهر +"))
        game.cities++;

    if(effect.includes("جمعیت +"))
        game.population=
            Math.floor(game.population*1.01);

    if(effect.includes("اعتبار +"))
        game.reputation=
            Math.min(100,game.reputation+5);

    if(effect.includes("محبوبیت +"))
        game.governmentPopularity=
            Math.min(100,game.governmentPopularity+4);

}

function hireMinister(key){

    if(game.ministers[key]){

        showToast("این وزیر فعال است.");
        return;

    }

    if(game.money<250){

        showToast("250💰 لازم است.");
        return;

    }

    game.money-=250;
    game.ministers[key]=true;

    if(key==="economy")
        game.production+=4;

    if(key==="defense")
        game.readiness=
            Math.min(100,game.readiness+8);

    if(key==="infrastructure")
        game.cities++;

    if(key==="foreign")
        game.reputation=
            Math.min(100,game.reputation+6);

    updateUI();
    renderGovernment();

    showToast("وزیر جدید فعال شد.");

}

function governmentDecision(type){

    const data={

        growth:{
            cost:500,
            run:()=>{
                game.production+=10;
                game.inflation+=.7;
            }
        },

        national:{
            cost:700,
            run:()=>{
                game.cities++;
                game.production+=5;
                game.stability+=2;
            }
        },

        diplomacy:{
            cost:450,
            run:()=>{
                game.reputation+=10;
            }
        },

        readiness:{
            cost:650,
            run:()=>{
                game.readiness+=16;
                game.commandPoints+=2;
            }
        }

    };

    const d=data[type];

    if(game.money<d.cost){

        showToast("بودجه کافی نیست.");
        return;

    }

    game.money-=d.cost;

    d.run();

    game.stability=
        Math.min(100,game.stability);

    game.reputation=
        Math.min(100,game.reputation);

    game.readiness=
        Math.min(100,game.readiness);

    game.commandPoints=
        Math.min(20,game.commandPoints);

    updateUI();
    renderGovernment();

    showToast("تصمیم دولت اجرا شد.");

}

function calculateNationalPower(){

    let p=game.power;

    p+=game.production*.35;
    p+=game.cities*1.4;
    p+=game.readiness*.35;
    p+=game.stability*.18;

    if(game.ministers.defense)
        p+=8;

    p-=game.warWeariness*.45;

    return Math.max(1,Math.floor(p));

}

function calculateEnemyPower(c){

    return Math.max(

        1,

        Math.floor(

            c.power+

            c.production*.3+

            c.cities*1.3+

            c.population/100000000*5+

            Math.random()*12

        )

    );

}

function getWarCost(target){

    const enemy=
        calculateEnemyPower(target);

    return Math.floor(
        260+
        enemy*11+
        target.cities*18
    );

}

                `;

function startWar(code){

    const target=
        COUNTRIES.find(c=>c.code===code);

    if(!target)
        return;

    if(game.warCooldown>0){

        showToast("هنوز دوره پس از جنگ تمام نشده.");
        return;

    }

    if(game.commandPoints<3){

        showToast("حداقل 3 امتیاز فرمان لازم است.");
        return;

    }

    if(game.readiness<45){

        showToast("آمادگی ملی کافی نیست.");
        return;

    }

    if(game.stability<30){

        showToast("ثبات داخلی کافی نیست.");
        return;

    }

    const cost=
        getWarCost(target);

    if(game.money<cost){

        showToast("بودجه جنگ کافی نیست.");
        return;

    }

    game.money-=cost;

    game.commandPoints-=3;

    game.readiness-=
        12+
        Math.floor(Math.random()*8);

    game.stability-=
        4+
        Math.floor(Math.random()*5);

    game.warWeariness+=
        8+
        Math.floor(Math.random()*7);

    const own=
        calculateNationalPower()+
        Math.random()*22-
        11;

    const enemy=
        calculateEnemyPower(target)+
        Math.random()*18-
        9;

    let chance=
        50+
        ((own/enemy)-1)*35+
        (game.reputation-50)*.08;

    chance=
        Math.max(
            8,
            Math.min(92,chance)
        );

    const roll=
        Math.random()*100;

    if(roll<=chance)
        winWar(target);
    else
        loseWar(target);

    game.warCooldown=1;

    updateUI();

}

function winWar(target){

    game.warsWon++;

    const reward=
        Math.floor(
            250+
            target.production*10+
            target.cities*35
        );

    game.money+=reward;

    game.reputation=
        Math.min(
            100,
            game.reputation+5
        );

    game.power+=
        Math.floor(target.power*.12);

    game.population=
        Math.floor(
            game.population+
            target.population*.025
        );

    game.production+=
        Math.floor(target.production*.08);

        result:"win",
        target:target.code

                </button>

    updateUI();

function loseWar(target){

    game.warsLost++;

    game.lastWar={
        result:"loss",
        target:target.code
    };

    game.money=
        Math.max(
            0,
            game.money-
            Math.floor(
                120+
                calculateEnemyPower(target)*3
            )
        );

    game.reputation=
        Math.max(
            0,
            game.reputation-6
        );

    game.stability=
        Math.max(
            0,
            game.stability-9
        );

    game.readiness=
        Math.max(
            0,
            game.readiness-10
        );

    game.warWeariness=
        Math.min(
            100,
            game.warWeariness+12
        );

    document.getElementById("warContent").innerHTML=`

        <div class="infoBox"
             style="text-align:center">

            <div style="font-size:25px">
                ⚠️
            </div>

            <b class="bad"
               style="font-size:20px">
                شکست
            </b>

            <br><br>

            عملیات علیه
            ${target.flag} ${target.name}
            موفق نبود.

            <br><br>

            قبل از تصمیم بعدی باید کشور را
            دوباره آماده کنی.

        </div>

        <button class="actionBtn"
                onclick="renderWar()">
            بازگشت
        </button>

    `;

    updateUI();

}

function annexCountry(code){

    const target=
        COUNTRIES.find(c=>c.code===code);

    if(!target)
        return;

    if(game.conquered.includes(code))
        return;

    game.conquered.push(code);

    game.cities+=
        Math.max(
            1,
            Math.floor(target.cities*.3)
        );

    game.population=
        Math.floor(
            game.population+
            target.population*.15
        );

    game.production+=
        Math.max(
            2,
            Math.floor(target.production*.18)
        );

    game.power+=
        Math.max(
            2,
            Math.floor(target.power*.12)
        );

    game.stability=
        Math.max(
            10,
            game.stability-8
        );

    game.warWeariness=
        Math.min(
            100,
            game.warWeariness+10
        );

    game.readiness=
        Math.max(
            10,
            game.readiness-8
        );

    game.commandPoints=
        Math.max(
            0,
            game.commandPoints-1
        );

    game.aiThreatMemory[code]=100;

    refreshCountryColors();
    updateUI();

    closeModal("warModal");

    showToast(
        `${target.flag} ${target.name} تصرف شد و به فهرست کشورهای شما اضافه شد.`
    );

}

function vassalizeCountry(code){

    const target=
        COUNTRIES.find(c=>c.code===code);

    if(!target)
        return;

    if(!game.conquered.includes(code))
        game.conquered.push(code);

    game.money+=
        Math.floor(target.production*6);

    game.reputation=
        Math.min(
            100,
            game.reputation+2
        );

    game.stability=
        Math.max(
            0,
            game.stability-2
        );

    game.readiness=
        Math.max(
            0,
            game.readiness-4
        );

    game.warWeariness=
        Math.min(
            100,
            game.warWeariness+5
        );

    game.aiThreatMemory[code]=85;

    refreshCountryColors();
    updateUI();

    closeModal("warModal");

    showToast(
        `${target.flag} ${target.name} تحت کنترل شما قرار گرفت.`
    );

}

/* =========================================================
   VERY STRONG STRATEGIC AI
========================================================= */

/*
   این سیستم یک AI تصمیم‌گیرنده چندمرحله‌ای است.

   AI فقط تصادفی عمل نمی‌کند.

   هر کشور بر اساس:
   اقتصاد
   جمعیت
   توان
   ثبات
   آمادگی
   روابط
   تهدید بازیکن
   فاصله قدرت
   وضعیت جهانی
   و حافظه تصمیم‌های قبلی

   اولویت‌بندی می‌شود.
*/

const AI_ENGINE={

    version:"NEURAL-STRATEGIC-9",

    analyzeCountry(country){

        const playerPower=
            calculateNationalPower();

        const countryPower=
            country.power+
            country.production*.35+
            country.cities*1.3;

        const populationScore=
            Math.min(
                100,
                country.population/15000000
            );

        const economyScore=
            Math.min(
                100,
                country.production
            );

        const militaryScore=
            Math.min(
                100,
                countryPower
            );

        const stability=
            Math.min(
                100,
                45+
                country.production*.2
            );

        const threat=
            Math.max(
                0,
                Math.min(
                    100,
                    playerPower-countryPower+50
                )
            );

        const strategicValue=
            economyScore*.28+
            populationScore*.18+
            militaryScore*.26+
            stability*.12+
            country.cities*.9;

        return{

            economy:economyScore,

            military:militaryScore,

            population:populationScore,

            stability,

            threat,

            strategicValue,

            power:countryPower

        };

    },


    chooseTarget(){

        const candidates=
            COUNTRIES.filter(c=>
                c.code!==game.countryCode &&
                !game.conquered.includes(c.code)
            );

        if(!candidates.length)
            return null;

        let best=null;
        let bestScore=-Infinity;

        for(const c of candidates){

            const a=
                this.analyzeCountry(c);

            const relation=
                game.aiWorldRelations[c.code]||0;

            const memory=
                game.aiThreatMemory[c.code]||0;

            let score=

                a.strategicValue*.40+

                a.economy*.18+

                a.population*.10+

                a.stability*.07+

                relation*-0.12+

                memory*.18;

            if(a.power>calculateNationalPower()*1.15)
                score-=25;

            if(a.power<calculateNationalPower()*.75)
                score+=18;

            if(game.warWeariness>40)
                score-=20;

            if(game.readiness<55)
                score-=25;

            if(
                score>bestScore
            ){

                bestScore=score;

                best={
                    country:c,
                    analysis:a,
                    score
                };

            }

        }

        return best;

    },


    economicDecision(){

        const economy=
            game.production+
            game.cities*2;

        if(
            game.money>1000 &&
            economy<140
        ){

            game.production+=
                2+
                Math.floor(
                    Math.random()*4
                );

            game.money-=
                150+
                Math.floor(
                    Math.random()*180
                );

            return "سرمایه‌گذاری اقتصادی";

        }

        if(
            game.money>900 &&
            game.inflation>8
        ){

            game.inflation=
                Math.max(
                    1,
                    game.inflation-1.2
                );

            game.money-=200;

            return "کنترل تورم";

        }

        return null;

    },


    diplomaticDecision(){

        const candidates=
            COUNTRIES.filter(c=>
                c.code!==game.countryCode &&
                !game.conquered.includes(c.code)
            );

        if(!candidates.length)
            return null;

        const target=
            candidates[
                Math.floor(
                    Math.random()*candidates.length
                )
            ];

        const old=
            game.aiWorldRelations[target.code]||0;

        if(old<25){

            game.aiWorldRelations[target.code]=
                old+
                8;

            return "بهبود روابط با "+target.name;

        }

        return null;

    },


    defensiveDecision(){

        if(game.readiness<60){

            const gain=
                5+
                Math.floor(
                    Math.random()*8
                );

            game.readiness=
                Math.min(
                    100,
                    game.readiness+gain
                );

            game.commandPoints=
                Math.min(
                    20,
                    game.commandPoints+1
                );

            return "افزایش آمادگی ملی";

        }

        if(game.stability<55){

            game.stability=
                Math.min(
                    100,
                    game.stability+6
                );

            return "تقویت ثبات داخلی";

        }

        return null;

    },


    playerThreatResponse(){

        const playerPower=
            calculateNationalPower();

        const topCountries=
            COUNTRIES
            .filter(c=>
                c.code!==game.countryCode &&
                !game.conquered.includes(c.code)
            )
            .map(c=>({

                country:c,

                threat:
                    c.power+
                    c.production*.4+
                    c.cities

            }))
            .sort((a,b)=>
                b.threat-a.threat
            );

        if(
            topCountries.length &&
            playerPower>
            topCountries[0].threat*.9
        ){

            game.reputation=
                Math.max(
                    0,
                    game.reputation-1
                );

            game.aiLastAction=
                "کشورها در حال واکنش به رشد قدرت شما هستند.";

            return true;

        }

        return false;

    },


    worldSimulation(){

        /*
          شبیه‌سازی رفتار کشورهای جهان.
          کشورها هر سال براساس قدرت و اقتصاد
          تصمیم‌های متفاوتی می‌گیرند.
        */

        let changes=0;

        for(
            const c of COUNTRIES
        ){

            if(c.code===game.countryCode)
                continue;

            if(game.conquered.includes(c.code))
                continue;

            const r=
                Math.random();

            if(r<.22){

                c.production=
                    Math.min(
                        100,
                        c.production+
                        Math.random()*2.2
                    );

                changes++;

            }

            else if(r<.34){

                c.power=
                    Math.min(
                        100,
                        c.power+
                        Math.random()*1.5
                    );

                changes++;

            }

            else if(r<.44){

                c.production=
                    Math.max(
                        10,
                        c.production-
                        Math.random()*1.2
                    );

                changes++;

            }

        }

        return changes;

    },


    run(){

        if(!game.aiEnabled)
            return;

        game.aiTurnCount++;

        const decisions=[];

        /*
          مرحله 1:
          تحلیل تهدید بازیکن
        */

        this.playerThreatResponse();


        /*
          مرحله 2:
          اقتصاد
        */

        const economy=
            this.economicDecision();

        if(economy)
            decisions.push(economy);


        /*
          مرحله 3:
          دفاع
        */

        const defense=
            this.defensiveDecision();

        if(defense)
            decisions.push(defense);


        /*
          مرحله 4:
          دیپلماسی
        */

        if(
            Math.random()<.35
        ){

            const diplomacy=
                this.diplomaticDecision();

            if(diplomacy)
                decisions.push(diplomacy);

        }


        /*
          مرحله 5:
          تصمیم راهبردی
        */

        const target=
            this.chooseTarget();

        if(
            target &&
            game.readiness>=72 &&
            game.stability>=55 &&
            game.money>1200 &&
            game.warWeariness<30
        ){

            const power=
                calculateNationalPower();

            if(
                target.analysis.power<
                power*.9
            ){

                game.aiLastAction=
                    "تحلیل راهبردی: "+
                    target.country.name;

                decisions.push(
                    "تمرکز راهبردی روی "+
                    target.country.name
                );

                game.aiThreatMemory[
                    target.country.code
                ]=
                    Math.min(
                        100,
                        (game.aiThreatMemory[
                            target.country.code
                        ]||0)+8
                    );

            }

        }


        /*
          مرحله 6:
          شبیه‌سازی جهان
        */

        this.worldSimulation();


        if(decisions.length){

            game.aiLastAction=
                decisions[
                    Math.floor(
                        Math.random()*decisions.length
                    )
                ];

        }

        game.aiPredictions.unshift({

            year:game.year,

            action:game.aiLastAction,

            turn:game.aiTurnCount

        });

        game.aiPredictions=
            game.aiPredictions.slice(0,8);

    }

};

    for(const c of COUNTRIES){

        game.aiWorldRelations[c.code]=

}

/* =========================================================
   TURN SYSTEM
========================================================= */

function nextTurn(){

    game.year++;

    let income=
        game.production*
        (1+game.tax/100);

    income*=
        1-game.inflation/150;

    income*=
        1+(game.economyBudget/100)*.18;

    if(game.ministers.economy)
        income*=1.08;

    income=Math.max(
        0,
        Math.floor(income)
    );

    game.money+=income;


    game.inflation+=
        Math.max(
            .05,
            game.tax>30?.45:-.08
        );


    if(game.tax>35)
        game.governmentPopularity-=2;


    game.readiness+=
        2+
        game.militaryBudget*.025;

    if(game.militaryBudget<15)
        game.readiness-=3;


    game.readiness=
        Math.max(
            0,
            Math.min(
                100,
                game.readiness
            )
        );


    game.stability+=
        game.welfareBudget*.025-
        game.warWeariness*.025;


    game.stability=
        Math.max(
            0,
            Math.min(
                100,
                game.stability
            )
        );


    game.warWeariness=
        Math.max(
            0,
            game.warWeariness-2
        );


    if(game.warCooldown>0)
        game.warCooldown--;


    game.commandPoints=
        Math.min(
            20,
            game.commandPoints+
            2+
            (game.stability>70?1:0)
        );


    game.population=
        Math.floor(
            game.population*
            (
                1+
                Math.max(
                    .001,
                    .004+
                    game.stability/30000
                )
            )
        );


    /*
      اجرای هوش مصنوعی در پایان هر سال
    */

    AI_ENGINE.run();


    /*
      رویداد تصادفی
    */

    if(Math.random()<.28)
        randomEvent();


    updateUI();

    showToast(
        `سال ${game.year} آغاز شد — درآمد ${income.toLocaleString("fa-IR")}💰`
    );

}

            );

        },

        ()=>{

            game.stability+=5;

            showToast(
                "🏛 آرامش سیاسی!"
            );

        },

        ()=>{

            game.readiness-=6;

            showToast(
                "⚠️ فشار خارجی افزایش یافت."
            );

        },

                Math.floor(
                    200+

                );

            showToast(
                "💰 قرارداد بزرگ ملی!"
            );

        },

        ()=>{

            game.cities++;
            game.production+=2;

            showToast(
                "🏙️ یک شهر جدید توسعه یافت."
            );

        }

    ];

    events[
        Math.floor(
            Math.random()*events.length
        )
    ]();

    game.stability=
        Math.max(
            0,
            Math.min(
                100,
                game.stability
            )
        );

    game.reputation=
        Math.max(
            0,
            Math.min(
                100,
                game.reputation
            )
        );

}

        "WORLD_EMPIRE_SAVE",
        JSON.stringify(game)
    );

    showToast("بازی ذخیره شد.");

}

function loadGame(){

    const raw=
        localStorage.getItem(
            "WORLD_EMPIRE_SAVE"
        );

    if(!raw){

        showToast("ذخیره‌ای وجود ندارد.");
        return;

    }

    try{

        const saved=
            JSON.parse(raw);

        game={
            ...game,
            ...saved
        };

        updateUI();

        refreshCountryColors();

        showToast("بازی بارگذاری شد.");

    }catch(e){

        showToast("ذخیره خراب است.");

    }

}
