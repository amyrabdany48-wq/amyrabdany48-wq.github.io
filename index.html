<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07131d">
<title>GLOBAL DOMINION</title>

<style>
:root{
    --bg:#061019;
    --bg2:#0a1823;
    --panel:#0d202d;
    --panel2:#122b3a;
    --line:rgba(255,255,255,.11);
    --line2:rgba(255,255,255,.20);
    --text:#effaff;
    --muted:#91a7b5;
    --green:#35dda9;
    --red:#ff5e76;
    --blue:#55bfff;
    --purple:#a979ff;
    --gold:#ffca61;
    --orange:#ff9c51;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#02070b;
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
}

button,input,select{
    font:inherit;
}

button{
    color:inherit;
}

#game{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 10%,rgba(48,131,164,.15),transparent 28%),
        linear-gradient(180deg,#071621,#030a0f);
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(rgba(65,145,170,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(65,145,170,.035) 1px,transparent 1px),
        radial-gradient(circle at 50% 40%,#103044,#071926 72%);
    background-size:45px 45px,45px 45px,auto;
}

#simpleWorld{
    position:absolute;
    width:100%;
    height:100%;
    left:0;
    top:0;
    touch-action:none;
}

.land{
    fill:#193e4a;
    stroke:#4c7080;
    stroke-width:1.1;
}

.land2{
    fill:#1d4651;
    stroke:#557989;
    stroke-width:1;
}

.country-dot{
    cursor:pointer;
}

.country-dot circle{
    stroke:#d9f6ff;
    stroke-width:.7;
    transition:.15s;
}

.country-dot:hover circle{
    stroke:white;
    stroke-width:2;
    filter:brightness(1.4);
}

.country-dot.player circle{
    fill:#20d69e!important;
    stroke:white;
    stroke-width:2.2;
}

.country-dot.selected circle{
    stroke:#ffda71;
    stroke-width:2.5;
}

.country-dot text{
    fill:#dff6ff;
    text-anchor:middle;
    font-size:8px;
    pointer-events:none;
    paint-order:stroke;
    stroke:#061019;
    stroke-width:2.5px;
}

.map-note{
    position:absolute;
    left:12px;
    top:82px;
    z-index:15;
    padding:7px 10px;
    background:rgba(5,18,27,.92);
    border:1px solid var(--line);
    border-radius:11px;
    font-size:9px;
    color:var(--muted);
}

/* =========================================================
   TOP HUD
========================================================= */

#topbar{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    height:62px;
    z-index:30;
    display:flex;
    gap:7px;
    pointer-events:none;
}

.brand{
    pointer-events:auto;
    width:190px;
    min-width:190px;
    background:rgba(7,24,35,.95);
    border:1px solid var(--line);
    border-radius:17px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 12px;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.brand-logo{
    width:40px;
    height:40px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:linear-gradient(145deg,#3de2b0,#157558);
    color:#04110d;
    font-size:23px;
}

.brand b{
    font-size:12px;
    display:block;
}

.brand small{
    color:var(--muted);
    font-size:9px;
}

.resources{
    pointer-events:auto;
    flex:1;
    display:flex;
    gap:6px;
    overflow:auto hidden;
    scrollbar-width:none;
}

.resource{
    min-width:82px;
    height:58px;
    border:1px solid var(--line);
    border-radius:15px;
    background:rgba(7,23,34,.94);
    padding:7px 9px;
}

.resource small{
    display:block;
    color:var(--muted);
    font-size:8px;
}

.resource b{
    display:block;
    margin-top:5px;
    font-size:12px;
    white-space:nowrap;
}

/* =========================================================
   RIGHT PANEL
========================================================= */

#side{
    position:absolute;
    right:10px;
    top:80px;
    bottom:90px;
    width:285px;
    z-index:22;
    border:1px solid var(--line);
    border-radius:19px;
    background:rgba(6,20,29,.95);
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.38);
}

.side-head{
    height:48px;
    border-bottom:1px solid var(--line);
    padding:0 13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
}

#sideBody{
    position:absolute;
    inset:49px 0 0;
    overflow:auto;
    padding:9px;
}

/* =========================================================
   BOTTOM DOCK
========================================================= */

#dock{
    position:absolute;
    z-index:35;
    left:50%;
    bottom:9px;
    transform:translateX(-50%);
    max-width:calc(100% - 18px);
    height:70px;
    display:flex;
    gap:5px;
    padding:7px;
    overflow:auto hidden;
    scrollbar-width:none;
    border:1px solid var(--line);
    border-radius:19px;
    background:rgba(5,18,27,.96);
    box-shadow:0 15px 45px rgba(0,0,0,.45);
}

.dock-btn{
    min-width:68px;
    border:0;
    border-radius:13px;
    background:transparent;
    cursor:pointer;
}

.dock-btn:hover{
    background:rgba(255,255,255,.07);
}

.dock-btn span{
    display:block;
    font-size:20px;
}

.dock-btn small{
    display:block;
    font-size:9px;
    color:#bed0db;
    margin-top:4px;
}

/* =========================================================
   COMPONENTS
========================================================= */

.card{
    width:100%;
    display:block;
    text-align:right;
    padding:11px;
    border:1px solid var(--line);
    border-radius:14px;
    background:linear-gradient(145deg,rgba(21,43,56,.95),rgba(9,28,39,.95));
    margin-bottom:8px;
}

button.card{
    cursor:pointer;
}

.card:hover{
    border-color:rgba(72,222,181,.4);
}

.card-head{
    display:flex;
    gap:9px;
    align-items:center;
}

.icon{
    min-width:39px;
    width:39px;
    height:39px;
    border-radius:11px;
    background:rgba(255,255,255,.07);
    display:grid;
    place-items:center;
    font-size:20px;
}

.card-title{
    font-weight:bold;
    font-size:11px;
}

.card-sub{
    color:var(--muted);
    font-size:9px;
    margin-top:3px;
}

.card-desc{
    color:#c6d6df;
    line-height:1.9;
    font-size:9px;
    margin-top:8px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:7px;
    margin-bottom:9px;
}

.kpi{
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.035);
    padding:8px;
    min-height:62px;
}

.kpi small{
    color:var(--muted);
    display:block;
    font-size:8px;
}

.kpi b{
    display:block;
    margin-top:6px;
    font-size:12px;
}

.row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
}

.btn{
    min-height:36px;
    border:1px solid var(--line2);
    border-radius:10px;
    background:#193242;
    cursor:pointer;
    padding:7px 10px;
    font-size:9px;
}

.btn.green{background:#17614d}
.btn.red{background:#762c3d}
.btn.blue{background:#1c5676}
.btn.purple{background:#533d78}
.btn.gold{background:#675222}
.btn.orange{background:#704429}

.btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.notice{
    border:1px solid var(--line);
    border-radius:12px;
    padding:9px;
    background:rgba(255,255,255,.035);
    color:#bfd0db;
    line-height:1.8;
    font-size:9px;
    margin-bottom:8px;
}

.notice.good{
    background:rgba(35,147,110,.12);
    border-color:rgba(57,220,170,.35);
}

.notice.warn{
    background:rgba(133,93,28,.15);
    border-color:rgba(255,200,86,.35);
}

.notice.bad{
    background:rgba(135,37,55,.16);
    border-color:rgba(255,90,116,.4);
}

.section{
    font-weight:bold;
    font-size:10px;
    margin:12px 2px 7px;
}

.tabs{
    display:flex;
    gap:5px;
    overflow:auto hidden;
    scrollbar-width:none;
    margin-bottom:9px;
}

.tab{
    white-space:nowrap;
    min-height:34px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(255,255,255,.04);
    padding:6px 9px;
    cursor:pointer;
    font-size:9px;
}

.tab.active{
    background:#17614c;
    border-color:#3ce2ae;
}

.progress{
    height:7px;
    width:100%;
    background:rgba(255,255,255,.07);
    border-radius:99px;
    overflow:hidden;
    margin-top:7px;
}

.progress div{
    height:100%;
    border-radius:inherit;
    background:linear-gradient(90deg,#34dda9,#4ac8f2);
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:9px;
}

th,td{
    padding:7px 5px;
    border-bottom:1px solid var(--line);
    text-align:right;
}

/* =========================================================
   MODAL
========================================================= */

#modal{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:rgba(0,4,7,.65);
}

#modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);
    max-height:91vh;
    border-radius:20px;
    border:1px solid var(--line2);
    background:#071b28;
    overflow:hidden;
    box-shadow:0 35px 100px rgba(0,0,0,.7);
}

.modal-head{
    height:55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 14px;
    border-bottom:1px solid var(--line);
}

.modal-head b{
    font-size:12px;
}

.close{
    width:34px;
    height:34px;
    cursor:pointer;
    border:1px solid var(--line);
    border-radius:10px;
    background:#142b39;
}

#modalBody{
    max-height:calc(91vh - 55px);
    overflow:auto;
    padding:12px;
}

/* =========================================================
   START SCREEN
========================================================= */

#start{
    position:fixed;
    inset:0;
    z-index:500;
    overflow:auto;
    padding:20px;
    background:
        radial-gradient(circle at 50% 15%,rgba(42,188,150,.22),transparent 28%),
        linear-gradient(180deg,#071824,#02090e);
}

.start-wrap{
    width:min(1100px,100%);
    margin:auto;
}

.hero{
    text-align:center;
    margin:18px auto 23px;
}

.hero-logo{
    width:82px;
    height:82px;
    border-radius:25px;
    margin:auto;
    display:grid;
    place-items:center;
    font-size:43px;
    background:linear-gradient(145deg,#38dfa9,#167457);
}

.hero h1{
    margin:13px 0 5px;
    font-size:26px;
}

.hero p{
    color:var(--muted);
    line-height:1.8;
    font-size:10px;
}

.start-search{
    width:100%;
    height:42px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#0a2130;
    color:white;
    padding:0 12px;
    outline:none;
    margin-bottom:10px;
}

#countryList{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:7px;
}

.country-select{
    border:1px solid var(--line);
    border-radius:14px;
    background:#0c2331;
    min-height:86px;
    padding:10px;
    text-align:right;
    cursor:pointer;
}

.country-select:hover{
    border-color:#3cdda9;
}

.flag{
    font-size:28px;
}

.country-select b{
    font-size:10px;
}

.country-select small{
    display:block;
    color:var(--muted);
    margin-top:5px;
    font-size:8px;
}

/* =========================================================
   TOAST
========================================================= */

#toasts{
    position:fixed;
    left:12px;
    bottom:90px;
    z-index:600;
    width:min(300px,calc(100% - 24px));
}

.toast{
    background:#0c2533;
    border:1px solid var(--line2);
    border-radius:11px;
    padding:9px 11px;
    margin-top:6px;
    font-size:9px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){
    #side{
        width:245px;
    }

    .brand{
        width:58px;
        min-width:58px;
        padding:8px;
    }

    .brand>div:last-child{
        display:none;
    }

    #countryList{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }
}

@media(max-width:650px){
    #side{
        display:none;
    }

    #countryList{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .grid{
        grid-template-columns:1fr;
    }

    .kpis{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .resource{
        min-width:72px;
    }
}

@media(max-width:420px){
    #countryList{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<script>
"use strict";

/* =========================================================
   BASIC
========================================================= */

const $=id=>document.getElementById(id);

const clamp=(v,min,max)=>
Math.max(
    min,
    Math.min(
        max,
        Number(v)||0
    )
);

const random=(a,b)=>
Math.random()*(b-a)+a;

const chance=p=>
Math.random()*100<
clamp(p,0,100);

function money(v){

    v=
        Number(v)||
        0;

    if(
        Math.abs(v)>=
        1000000000
    ){
        return "$"+
        (
            v/
            1000000000
        ).toFixed(2)+
        "B";
    }

    if(
        Math.abs(v)>=
        1000000
    ){
        return "$"+
        (
            v/
            1000000
        ).toFixed(1)+
        "M";
    }

    if(
        Math.abs(v)>=
        1000
    ){
        return "$"+
        (
            v/
            1000
        ).toFixed(1)+
        "K";
    }

    return "$"+
    v.toFixed(0);
}

function num(v,d=0){

    v=
        Number(v)||
        0;

    if(v>=1000000000){
        return(
            v/
            1000000000
        ).toFixed(d)+
        "B";
    }

    if(v>=1000000){
        return(
            v/
            1000000
        ).toFixed(d)+
        "M";
    }

    if(v>=1000){
        return(
            v/
            1000
        ).toFixed(d)+
        "K";
    }

    return v.toFixed(d);
}

function pct(v){
    return clamp(v,0,100)
    .toFixed(1)+
    "%";
}

function safe(s){
    return String(s??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function flag(code){

    return code
    .toUpperCase()
    .replace(
        /./g,
        c=>
        String.fromCodePoint(
            127397+
            c.charCodeAt()
        )
    );
}

function toast(text){

    const e=
        document.createElement(
            "div"
        );

    e.className=
        "toast";

    e.textContent=
        text;

    $("toasts")
    .appendChild(
        e
    );

    setTimeout(
        ()=>
            e.remove(),
        2600
    );
}

function modal(
    title,
    body
){

    $("modalTitle")
    .innerHTML=
        title;

    $("modalBody")
    .innerHTML=
        body;

    $("modal")
    .classList.add(
        "show"
    );
}

function closeModal(){

    $("modal")
    .classList.remove(
        "show"
    );
}

$("modal")
.addEventListener(
    "click",
    e=>
    {

        if(
            e.target===
            $("modal")
        ){
            closeModal();
        }

    }
);

function findCountry(
    code
){

    return COUNTRIES.find(
        c=>
            c[0]===
            code
    );
}

function countryObj(
    c
){

    return{
        code:c[0],
        fa:c[1],
        en:c[2],
        capital:c[3],
        population:c[4],
        baseGDP:c[5],
        military:c[6],
        tech:c[7]
    };
}

   START GAME
========================================================= */

function startGame(
    code
){

    const raw=
        findCountry(
            code
        );

    if(!raw){
        return;
    }

    const c=
        countryObj(
            raw
        );

    state.started=
        true;

    state.country=
        code;

    state.selectedCountry=
        code;

    state.population=
        c.population/
        1000000;

    state.gdp=
        c.baseGDP*
        1000;

    state.industry=
        clamp(
            25+
            c.baseGDP/
            450,
            20,
            100
        );

    state.technology=
        clamp(
            c.tech/
            10,
            30,
            100
        );

    state.military=
        clamp(
            c.military/
            10,
            25,
            100
        );

    state.money=
        7000+
        state.industry*
        100;

    state.food=
        120+
        state.population*
        .2;

    state.energy=
        100+
        state.industry*
        .4;

    state.oil=
        60+
        (
            [
                "IR",
                "SA",
                "RU",
                "US",
                "IQ",
                "AE",
                "KW",
                "QA",
                "VE",
                "CA",
                "KZ",
                "LY",
                "DZ",
                "NG"
            ]
            .includes(
                code
            )
            ?
            120
            :
            20
        );

    state.steel=
        80+
        state.industry*
        .4;

    state.manpower=
        Math.max(
            .05,
            state.population*
            .06
        );

    state.inventory={
        infantry:8,
        mechanized:2
    };

    state.buildings={
        farm:1,
        power:1,
        factory:1
    };

    $("start")
    .style.display=
        "none";

    renderMapDots();

    addNews(
        "🏛️ آغاز دولت",
        `رهبری ${c.fa} را برعهده گرفتی.`
    );

    saveGame();

    renderAll();
}

/* =========================================================
   MAP
========================================================= */

function approximatePosition(
    code,
    index
){

    if(
        MAP[
            code
        ]
    ){
        return MAP[
            code
        ];
    }

    const region=
        index%
        5;

    if(region===0){
        return[
            580+
            (
                index%
                9
            )*
            20,
            160+
            (
                index%
                6
            )*
            18
        ];
    }

    if(region===1){
        return[
            620+
            (
                index%
                8
            )*
            20,
            300+
            (
                index%
                7
            )*
            22
        ];
    }

    if(region===2){
        return[
            850+
            (
                index%
                12
            )*
            27,
            180+
            (
                index%
                8
            )*
            22
        ];
    }

    if(region===3){
        return[
            180+
            (
                index%
                9
            )*
            25,
            180+
            (
                index%
                7
            )*
            35
        ];
    }

    return[
        1100+
        (
            index%
            7
        )*
        30,
        420+
        (
            index%
            5
        )*
        25
    ];
}

function renderMapDots(){

    const layer=
        $("countryDots");

    layer.innerHTML=
        "";

    COUNTRIES
    .forEach(
        (
            c,
            i
        )=>
        {

            const pos=
                approximatePosition(
                    c[0],
                    i
                );

            const group=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "g"
                );

            group.setAttribute(
                "class",
                "country-dot"+
                (
                    state.country===
                    c[0]
                    ?
                    " player"
                    :
                    ""
                )+
                (
                    state.selectedCountry===
                    c[0]
                    ?
                    " selected"
                    :
                    ""
                )
            );

            group.setAttribute(
                "transform",
                `translate(${pos[0]} ${pos[1]})`
            );

            const circle=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );

            circle.setAttribute(
                "r",
                c[4]>
                100000000
                ?
                6
                :
                c[4]>
                20000000
                ?
                5
                :
                4
            );

            circle.setAttribute(
                "fill",
                state.country===
                c[0]
                ?
                "#26d9a2"
                :
                "#3f7d91"
            );

            const text=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );

            text.setAttribute(
                "y",
                -9
            );

            text.textContent=
                c[1];

            if(
                c[4]<
                5000000
            ){
                text.style.display=
                    "none";
            }

            group.appendChild(
                circle
            );

            group.appendChild(
                text
            );

            group.addEventListener(
                "click",
                ()=>
                {

                    state.selectedCountry=
                        c[0];

                    renderMapDots();

                    openCountryInfo(
                        c[0]
                    );

                }
            );

            layer.appendChild(
                group
            );

        }
    );
}

/* =========================================================
   MILITARY POWER
========================================================= */

function equipmentPower(){

    return EQUIPMENT.reduce(
        (
            sum,
            e
        )=>
            sum+
            (
                state.inventory[
                    e.id
                ]||
                0
            )*
            e.power,
        0
    );
}

function militaryPower(){

    return(
        state.military+
        equipmentPower()*
        .025+
        state.readiness*
        .15+
        state.technology*
        .08
    );
}

function maintenance(){

    return EQUIPMENT.reduce(
        (
            sum,
            e
        )=>
            sum+
            (
                state.inventory[
                    e.id
                ]||
                0
            )*
            e.maintenance,
        0
    );
}

/* =========================================================
   ECONOMY
========================================================= */

function calculateGDP(){

    let g=
        state.population*
        (
            state.industry*
            600+
            state.technology*
            300
        );

    g*=
        (
            1+
            (
                state.buildings.factory||
                0
            )*
            .025
        );

    g*=
        (
            1-
            state.unemployment/
            170
        );

    return Math.max(
        1000,
        g
    );
}

function dailyRevenue(){

    return(
        calculateGDP()*
        state.tax/
        100*
        .0008
    );
}

function welfareCost(){

    const w=
        state.policies.welfare;

    return state.population*
    (
        w===
        "high"
        ?
        .42
        :
        w===
        "low"
        ?
        .12
        :
        .25
    );
}

function militaryBudgetCost(){

    const v=
        state.policies.military;

    return maintenance()*
    (
        v===
        "high"
        ?
        .075
        :
        v===
        "low"
        ?
        .035
        :
        .05
    );
}

function dailyExpenses(){

    return(
        welfareCost()+
        militaryBudgetCost()+
        state.debt*
        state.interestRate/
        100/
        365+
        state.construction.length*
        3
    );
}

function calculateGrowth(){

    let growth=
        2.2;

    growth+=
        (
            state.industry-
            50
        )*
        .035;

    growth+=
        (
            state.technology-
            50
        )*
        .025;

    growth+=
        (
            state.consumerConfidence-
            50
        )*
        .03;

    growth-=
        state.inflation*
        .09;

    growth-=
        state.unemployment*
        .07;

    growth-=
        state.corruption*
        .035;

    if(
        state.energy<
        20
    ){
        growth-=
            2.5;
    }

    if(
        state.food<
        20
    ){
        growth-=
            2;
    }

    return clamp(
        growth,
        -18,
        18
    );
}

/* =========================================================
   TAX
========================================================= */

function changeTax(
    v
){

    const old=
        state.tax;

    state.tax=
        clamp(
            state.tax+
            v,
            0,
            50
        );

    const change=
        state.tax-
        old;

    state.approval=
        clamp(
            state.approval-
            change*
            .5,
            0,
            100
        );

    state.consumerConfidence=
        clamp(
            state.consumerConfidence-
            change*
            .3,
            0,
            100
        );

    saveGame();

    renderAll();

    openEconomy(
        "budget"
    );
}

/* =========================================================
   CENTRAL BANK
========================================================= */

function changeInterest(
    v
){

    state.interestRate=
        clamp(
            state.interestRate+
            v,
            0,
            30
        );

    if(
        v>
        0
    ){

        state.inflation=
            Math.max(
                -2,
                state.inflation-
                .3
            );

        state.consumerConfidence=
            clamp(
                state.consumerConfidence-
                .7,
                0,
                100
            );

    }else{

        state.consumerConfidence=
            clamp(
                state.consumerConfidence+
                .7,
                0,
                100
            );

        state.inflation+=
            .2;

    }

    saveGame();

    renderAll();

    openEconomy(
        "inflation"
    );
}

function takeLoan(
    amount
){

    state.money+=
        amount;

    state.debt+=
        amount;

    state.inflation+=
        amount/
        Math.max(
            calculateGDP(),
            10000
        )*
        10;

    toast(
        "وام دریافت شد"
    );

    saveGame();

    renderAll();

    openEconomy(
        "bank"
    );
}

function repayLoan(
    amount
){

    amount=
        Math.min(
            amount,
            state.money,
            state.debt
        );

    if(
        amount<=0
    ){
        return;
    }

    state.money-=
        amount;

    state.debt-=
        amount;

    toast(
        "بخشی از بدهی پرداخت شد"
    );

    saveGame();

    renderAll();

    openEconomy(
        "bank"
    );
}

/* =========================================================

========================================================= */

function changeGovernment(
    id
){

    if(
        state.government===
        id
    ){
        return;
    }

    if(
        state.money<
        2000
    ){

        toast(
            "بودجه کافی نیست"
        );

        return;
    }

    state.money-=
        2000;

    state.government=
        id;

    state.stability=
        clamp(
            state.stability-
            4,
            0,
            100
        );

    toast(
        "ساختار دولت تغییر کرد"
    );

    saveGame();

    renderAll();

    openGovernment();
}

function setPolicy(
    key,
    value
){

    state.policies[
        key
    ]=
        value;

    if(
        key===
        "welfare"
    ){

        if(
            value===
            "high"
        ){
            state.approval+=
                2;

            state.poverty=
                Math.max(
                    0,
                    state.poverty-
                    1
                );
        }

        if(
            value===
            "low"
        ){
            state.approval-=
                1.5;
        }

    }

    if(
        key===
        "military"
    ){

        if(
            value===
            "high"
        ){
            state.readiness=
                clamp(
                    state.readiness+
                    3,
                    0,
                    100
                );
        }

    }

    saveGame();

    renderAll();

    openGovernment(
        "laws"
    );
}

function socialProgram(){

    if(
        state.money<
        1200
    ){
        toast(
            "بودجه کافی نیست"
        );

        return;
    }

    state.money-=
        1200;

    state.approval=
        clamp(
            state.approval+
            5,
            0,
            100
        );

    state.protest=
        clamp(
            state.protest-
            6,
            0,
            100
        );

    state.poverty=
        clamp(
            state.poverty-
            2,
            0,
            100
        );

    saveGame();

    renderAll();

    openGovernment(
        "people"
    );
}

function antiCorruption(){

    if(
        state.money<
        900
    ){
        return;
    }

    state.money-=
        900;

    state.corruption=
        clamp(
            state.corruption-
            6,

    state.stability=
        clamp(
            state.stability+
            2,
            0,
            100
        );

    saveGame();

    renderAll();

    openGovernment(
        "people"

function buyEquipment(
    id,
    amount
){

    const e=
        EQUIPMENT.find(
            x=>
                x.id===
                id
        );

    if(!e){
        return;
    }

    if(
        state.technology<
        e.tech
    ){

        toast(
            "فناوری کافی نیست"
        );

        return;
    }

    const totalPrice=
        e.price*
        amount;

    const oil=
        e.oil*
        amount;

    const steel=
        e.steel*
        amount;

    const manpower=
        e.manpower*
        amount;

    if(
        state.money<
        totalPrice
    ){

        toast(
            "بودجه کافی نیست"
        );

        return;
    }

    if(
        state.oil<
        oil
    ){

        toast(
            "نفت کافی نیست"
        );

        return;
    }

    if(
        state.steel<
        steel
    ){

        toast(
            "فولاد کافی نیست"
        );

        return;
    }

    if(
        state.manpower<
        manpower
    ){

        toast(
            "نیروی انسانی کافی نیست"
        );

        return;
    }

    state.money-=
        totalPrice;

    state.oil-=
        oil;

    state.steel-=
        steel;

    state.manpower-=
        manpower;

    state.inventory[
        id
    ]=
        (
            state.inventory[
                id
            ]||
            0
        )+
        amount;

    state.military+=
        e.power*
        amount*
        .004;

    addNews(
        "🏪 خرید نظامی",
        `${amount} واحد ${e.name} خریداری شد.`
    );

    toast(
        "خرید انجام شد"
    );

    saveGame();

    renderAll();

    openStore(
        storeCategory
    );
}

function build(
    id
){

    const b=
        BUILDINGS.find(
            x=>
                x.id===
                id
        );

    if(!b){
        return;
    }

    const level=
        state.buildings[
            id
        ]||
        0;

    if(
        level>=
        b.max
    ){
        return;
    }

    if(
        state.construction.some(
            p=>
                p.id===
                id
        )
    ){

        toast(
            "این ساختمان در حال ساخت است"
        );

        return;
    }

    const price=
        Math.round(
            b.price*
            Math.pow(
                1.16,
                level
            )
        );

    if(
        state.money<
        price
    ){

        toast(
            "بودجه کافی نیست"
        );

        return;
    }

    state.money-=
        price;

    const days=
        Math.max(
            3,
            Math.round(
                b.days*
                (
                    1-
                    state.technology/
                    500
                )
            )
        );

    state.construction.push({
        id,
        level:
            level+
            1,
        total:
            days,
        left:
            days
    });

    toast(
        "پروژه ساخت آغاز شد"
    );

    saveGame();

    openIndustry();
}

/* =========================================================
   BUILDING COMPLETE
========================================================= */

function completeBuilding(
    p
){

    const b=
        BUILDINGS.find(
            x=>
                x.id===
                p.id
        );

    if(!b){
        return;
    }

    state.buildings[
        p.id
    ]=
        p.level;

    switch(
        p.id
    ){

        case "farm":

            state.food+=
                20;

            break;

        case "power":

            state.energy+=
                20;

            break;

        case "oilfield":

            state.oil+=
                25;

            break;

        case "refinery":

            state.oil+=
                10;

            state.industry+=
                1;

            break;

        case "factory":

            state.industry+=
                3;

            break;

        case "militaryFactory":

            state.industry+=
                2;

            state.military+=
                1;

            break;

        case "university":

            state.technology+=
                1.5;

            state.research+=
                8;

            break;

        case "hospital":

            state.approval+=
                2;

            state.poverty=
                Math.max(
                    0,
                    state.poverty-
                    1
                );

            break;

        case "infrastructure":

            state.industry+=
                1;

            state.consumerConfidence+=
                1;

            break;

        case "port":

            state.industry+=
                1;

            break;

        case "airbase":

            state.readiness+=
                2;

            break;

        case "radar":

            state.military+=
                1;

            break;

    }

    addNews(
        "🏗️ ساخت تکمیل شد",
        `${b.name} به سطح ${p.level} رسید.`
    );
}

function marketPrice(

){

    let base=
        resource.base;

    if(
        resource.id===
        "oil"
    ){

        base+=
            state.inflation*
            1.1;

        if(
            state.oil<
            30
        ){
            base+=
                20;
        }

    if(
        resource.id===
        "food"&&
        state.food<
        30

        base+=
            15;
    }

    if(
        resource.id===
        "energy"&&
        state.energy<
        30

        base+=
            15;
    }

    return Math.max(
        10,
        base+
        state.inflation*
        .4
    );
}

/* =========================================================
   DAILY ECONOMY
========================================================= */

function processEconomy(){

    const revenue=
        dailyRevenue();

    const expenses=
        dailyExpenses();

    state.money+=
        revenue-
        expenses;

    if(
        state.money<
        0
    ){

        state.debt+=
            Math.abs(
                state.money
            );

        state.money=
            0;

    }

    const growth=
        calculateGrowth();

    state.industry=
        Math.max(
            1,
            state.industry+
            growth*
            .003
        );

    /* FOOD */

    const foodProduction=
        (
            state.buildings.farm||
            0
        )*
        1.1+
        state.population*
        .003;

    const foodUse=
        state.population*
        .012;

    state.food=
        Math.max(
            0,
            state.food+
            foodProduction-
            foodUse
        );

    /* ENERGY */

    const energyProduction=
        (
            state.buildings.power||
            0
        )*
        1.3+
        state.industry*
        .01;

    const energyUse=
        state.population*
        .004+
        state.industry*
        .013;

    state.energy=
        Math.max(
            0,
            state.energy+
            energyProduction-
            energyUse
        );

    /* OIL */

    state.oil=
        Math.max(
            0,
            state.oil+
            (
                state.buildings.oilfield||
                0
            )*
            .8-
            equipmentPower()*
            .0003
        );

    /* STEEL */

    state.steel+=
        (
            state.buildings.factory||
            0
        )*
        .25;

    /* INFLATION */

    let inflationPressure=
        .002;

    if(
        state.food<
        30
    ){
        inflationPressure+=
            .035;
    }

    if(
        state.energy<
        30
    ){
        inflationPressure+=
            .035;
    }

    if(
        state.oil<
        20
    ){
        inflationPressure+=
            .02;
    }

    if(
        state.debt>
        calculateGDP()*
        .5
    ){
        inflationPressure+=
            .025;
    }

    inflationPressure-=
        Math.max(
            0,
            state.interestRate-
            5
        )*
        .008;

    state.inflation=
        clamp(
            state.inflation+
            inflationPressure+
            random(
                -.02,
                .02
            ),
            -3,
            100
        );

    /* UNEMPLOYMENT */

    state.unemployment=
        clamp(
            state.unemployment-
            growth*
            .004+
            random(
                -.02,
                .02
            ),
            0,
            60
        );

    /* CURRENCY */

    state.currency=
        clamp(
            state.currency+
            growth*
            .015-
            state.inflation*
            .008+
            state.interestRate*
            .004+
            random(
                -.12,
                .12
            ),
            5,
            300
        );

    /* STOCK */

    state.stockMarket=
        clamp(
            state.stockMarket+
            growth*
            .08-
            state.inflation*
            .01+
            random(
                -.7,
                .7
            ),
            10,
            1000
        );

    /* CONFIDENCE */

    state.consumerConfidence=
        clamp(
            state.consumerConfidence+
            growth*
            .015-
            state.inflation*
            .008-
            state.unemployment*
            .004,
            0,
            100
        );

    /* POVERTY */

    state.poverty=
        clamp(
            state.poverty-
            growth*
            .004+
            state.unemployment*
            .002+
            state.inflation*
            .0015,
            0,
            100
        );

    /* APPROVAL */

    state.approval=
        clamp(
            state.approval+
            growth*
            .01-
            state.inflation*
            .005-
            state.unemployment*
            .005-
            state.protest*
            .001,
            0,
            100
        );

    /* PROTEST */

    state.protest=
        clamp(
            state.protest+
            Math.max(
                0,
                state.inflation-
                15
            )*
            .004+
            Math.max(
                0,
                state.unemployment-
                15
            )*
            .005+
            Math.max(
                0,
                40-
                state.approval
            )*
            .006-
            state.stability*
            .001,
            0,
            100
        );

    /* STABILITY */

    state.stability=
        clamp(
            state.stability+
            (
                state.approval-
                50
            )*
            .001-
            state.protest*
            .002,
            0,
            100
        );

    /* MANPOWER */

    state.manpower=
        Math.min(
            state.population*
            .075,
            state.manpower+
            state.population*
            .00001
        );

    /* RESEARCH */

    state.research+=
        .1+
        (
            state.buildings.university||
            0
        )*
        .08;

    /* MILITARY POLICY */

    if(
        state.policies.military===
        "high"
    ){

        state.readiness=
            clamp(
                state.readiness+
                .02,
                0,
                100
            );

    }

    if(
        state.policies.military===
        "low"
    ){

        state.readiness=
            clamp(
                state.readiness-
                .01,
                0,
                100
            );

    }

}

/* =========================================================
   CONSTRUCTION PROCESS
========================================================= */

function processConstruction(){

    state.construction
    .forEach(
        p=>
        {

            let speed=
                1+
                state.technology/
                250;

            if(
                state.energy<
                15
            ){
                speed*=
                    .6;
            }

            p.left-=
                speed;

        }
    );

    const finished=
        state.construction
        .filter(
            p=>
                p.left<=
                0
        );

    finished
    .forEach(
        completeBuilding
    );

    state.construction=
        state.construction
        .filter(
            p=>
                p.left>
                0
        );
}

/* =========================================================
   POLITICS PROCESS
========================================================= */

function processPolitics(){

    state.electionDays--;

    if(
        state.electionDays<=
        0
    ){

        if(
            chance(
                state.approval
            )
        ){

            addNews(
                "🗳️ انتخابات",
                "دولت توانست حمایت کافی برای ادامه کار به‌دست آورد."
            );

            state.approval=
                clamp(
                    state.approval+
                    2,
                    0,
                    100
                );

        }else{

            addNews(
                "🗳️ انتخابات",
                "نتیجه انتخابات باعث تغییر سیاسی در دولت شد."
            );

            state.approval=
                55;

            state.corruption=
                clamp(
                    state.corruption-
                    2,
                    0,
                    100
                );

        }

        state.electionDays=
            1080;

    }

    if(
        chance(
            state.protest*
            .01
        )
    ){

        addNews(
            "📢 اعتراضات",
            "اعتراضات داخلی در برخی شهرها افزایش یافت."
        );

        state.stability=
            clamp(
                state.stability-
                .5,
                0,
                100
            );

    }

}

/* =========================================================
   DATE
========================================================= */

function advanceDate(){

    state.date.day++;

    if(
        state.date.day>
        30
    ){

        state.date.day=
            1;

        state.date.month++;

        if(
            state.date.month>
            12
        ){

            state.date.month=
                1;

            state.date.year++;

        }

    }
}

/* =========================================================
   NEXT DAY
========================================================= */

function nextDay(){

    if(
        !state.started
    ){
        return;
    }

    advanceDate();

    processConstruction();

    processEconomy();

    processPolitics();

    if(
        chance(
            2
        )
    ){

        const events=[

            [
                "📈 رونق بازار",
                ()=>{
                    state.stockMarket+=
                        5;

                    state.consumerConfidence+=
                        2;
                }
            ],

            [
                "⚡ اختلال انرژی",
                ()=>{
                    state.energy=
                        Math.max(
                            0,
                            state.energy-
                            10
                        );
                }
            ],

            [
                "🌾 برداشت خوب",
                ()=>{
                    state.food+=
                        15;
                }
            ],

            [
                "🏭 رونق صنعت",
                ()=>{
                    state.industry+=
                        .5;
                }
            ]

        ];

        const e=
            events[
                Math.floor(
                    Math.random()*
                    events.length
                )
            ];

        e[1]();

        addNews(
            e[0],
            "یک رویداد ملی روی اقتصاد کشور اثر گذاشت."
        );

    }

    saveGame();

    renderAll();
}

            <button

            </button>

                    setSpeed(

}

function setSpeed(
    s
){

    state.speed=
        s;

    if(
        timer
    ){
        clearInterval(
            timer
        );
    }

    timer=
        setInterval(
            nextDay,
            Math.max(
                250,
                1600/
                s
            )
        );

    toast(
        "سرعت ×"+
        s
    );
}

function pauseTime(){

    state.speed=
        0;

    if(
        timer
    ){

        clearInterval(
            timer
        );

        timer=
            null;

    }

    toast(
        "زمان متوقف شد"
    );
}

/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    try{

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(
                state
            )
        );

    }catch(e){}

}

function loadGame(){

    try{

        const raw=
            localStorage.getItem(
                SAVE_KEY
            );

        if(!raw){
            return false;
        }

        const loaded=
            JSON.parse(
                raw
            );

        state=
            Object.assign(
                state,
                loaded
            );

        state.inventory=
            state.inventory||
            {};

        state.buildings=
            state.buildings||
            {};

        state.construction=
            Array.isArray(
                state.construction
            )
            ?
            state.construction
            :
            [];

        state.policies=
            state.policies||
            {
                welfare:"normal",
                trade:"open",
                military:"normal",
                centralBank:"balanced"
            };

        return(
            state.started&&
            !!state.country
        );

    }catch(e){

        return false;

    }
}

/* =========================================================
   MAP PAN / ZOOM
========================================================= */

let camera={
x:0,
y:0,
z:1
};

let dragging=false;

let sx=0;

let sy=0;

const svg=
    $("simpleWorld");

function updateCamera(){

    $("camera")
    .setAttribute(
        "transform",
        `translate(${camera.x} ${camera.y}) scale(${camera.z})`
    );
}

svg.addEventListener(
    "pointerdown",
    e=>
    {

        dragging=
            true;

        sx=
            e.clientX;

        sy=
            e.clientY;

    }
);

svg.addEventListener(
    "pointermove",
    e=>
    {

        if(
            !dragging
        ){
            return;
        }

        camera.x+=
            (
                e.clientX-
                sx
            )*
            1400/
            svg.clientWidth;

        camera.y+=
            (
                e.clientY-
                sy
            )*
            700/
            svg.clientHeight;

        sx=
            e.clientX;

        sy=
            e.clientY;

        updateCamera();

    }
);

svg.addEventListener(
    "pointerup",
    ()=>
    {
        dragging=
            false;
    }
);

svg.addEventListener(
    "pointercancel",
    ()=>
    {
        dragging=
            false;
    }
);

svg.addEventListener(
    "wheel",
    e=>
    {

        e.preventDefault();

        camera.z=
            clamp(
                camera.z*
                (
                    e.deltaY<
                    0
                    ?
                    1.12
                    :
                    .89
                ),
                .7,
                3.5
            );

        updateCamera();

    },
    {
        passive:false
    }
);

/* =========================================================
   HOTKEY
========================================================= */

document
.addEventListener(
    "keydown",
    e=>
    {

        if(
            e.key===
            "Escape"

        if(

            " "

            e.preventDefault();

            if(
                state.speed>
                0

                pauseTime();

            }else{

                setSpeed(

                );

            }

        }

    }
);
