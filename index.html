<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>جنگ جهانی</title>

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07121c;
    font-family:Tahoma,Arial,sans-serif;
}

#map{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#071c2a;
}

/* نوار بالا */
#top{
    position:fixed;
    z-index:1000;
    top:10px;
    left:10px;
    right:10px;
    min-height:70px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px;
    background:rgba(4,13,23,.94);
    border:1px solid #3c566d;
    border-radius:16px;
    box-shadow:0 8px 30px #0009;
}

.title{
    font-size:18px;
    font-weight:bold;
    white-space:nowrap;
    margin-left:auto;
}

.stat{
    min-width:68px;
    text-align:center;
    padding:6px 8px;
    background:#12283b;
    border:1px solid #29455c;
    border-radius:10px;
    color:#9db2c5;
    font-size:10px;
}

.stat strong{
    display:block;
    color:#70c8ff;
    font-size:15px;
    margin-top:2px;
}

#endTurn{
    border:0;
    background:#23834f;
    color:white;
    padding:12px;
    border-radius:10px;
    font-family:inherit;
    font-weight:bold;
    min-width:75px;
}

/* پنل کشور */
#panel{
    position:fixed;
    z-index:1001;
    top:92px;
    right:12px;
    width:310px;
    max-height:calc(100vh - 105px);
    overflow:auto;
    padding:15px;
    background:rgba(4,13,23,.96);
    border:1px solid #3c566d;
    border-radius:16px;
    box-shadow:0 12px 40px #000b;
}

#panel h2{
    margin:0 0 12px;
    font-size:21px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:8px 2px;
    border-bottom:1px solid #ffffff12;
    font-size:13px;
}

.row span{
    color:#93a8ba;
}

.row b{
    color:white;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.buttons button{
    border:0;
    border-radius:9px;
    color:white;
    padding:11px 5px;
    font-family:inherit;
    font-weight:bold;
}

.attack{background:#b43838}
.soldier{background:#23834f}
.tank{background:#896326}
.air{background:#286d91}
.peace{background:#4c69a2}
.alliance{background:#596fa2}

#message{
    margin-top:10px;
    padding:9px;
    background:#0e1d2b;
    color:#9eb0c0;
    border-radius:8px;
    font-size:10px;
    line-height:1.8;
}

/* گزارش جنگ */
#log{
    position:fixed;
    z-index:1000;
    left:10px;
    bottom:10px;
    width:300px;
    max-height:160px;
    overflow:auto;
    background:rgba(4,13,23,.94);
    border:1px solid #3c566d;
    border-radius:13px;
    padding:8px;
    color:#dce7ef;
    font-size:11px;
}

.log{
    padding:6px 2px;
    border-bottom:1px solid #ffffff10;
}

/* صفحه شروع */
#start{
    position:fixed;
    inset:0;
    z-index:5000;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#173d54,#06121d 70%);
}

.startBox{
    width:min(430px,92%);
    padding:25px;
    background:#081827;
    border:1px solid #45627a;
    border-radius:20px;
    box-shadow:0 20px 70px #000c;
    text-align:center;
    color:white;
}

.startBox h1{
    margin:0 0 10px;
    font-size:30px;
}

.startBox p{
    color:#a8b9c9;
    line-height:1.8;
    font-size:13px;
}

#country{
    width:100%;
    padding:12px;
    background:#142b40;
    border:1px solid #486278;
    border-radius:10px;
    color:white;
    font-family:inherit;
    margin:10px 0;
}

#startButton{
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#267eae;
    color:white;
    font-family:inherit;
    font-weight:bold;
    font-size:15px;
}

/* برچسب کشورها */
.country-name{
    background:transparent !important;
    border:0 !important;
    box-shadow:none !important;
    color:#fff !important;
    text-shadow:1px 1px 3px #000,-1px -1px 3px #000;
    font-weight:bold;
    font-size:10px;
    white-space:nowrap;
}

/* موبایل */
@media(max-width:700px){

    #top{
        top:5px;
        left:5px;
        right:5px;
        min-height:58px;
        padding:5px;
        gap:4px;
    }

    .title{
        display:none;
    }

    .stat{
        min-width:50px;
        padding:5px 3px;
        font-size:8px;
    }

    .stat strong{
        font-size:12px;
    }

    #endTurn{
        min-width:66px;
        padding:9px 5px;
        font-size:9px;
    }

    /*
      پنل کاملاً پایین صفحه
    */
    #panel{
        top:auto;
        left:5px;
        right:5px;
        bottom:5px;
        width:auto;
        max-height:39vh;
        padding:10px;
        border-radius:15px;
    }

    #panel h2{
        font-size:16px;
        margin-bottom:5px;
    }

    .row{
        padding:5px;
        font-size:10px;
    }

    .buttons{
        gap:5px;
        margin-top:6px;
    }

    .buttons button{
        padding:8px 3px;
        font-size:9px;
    }

    #message{
        display:none;
    }

    #log{
        left:5px;
        bottom:calc(39vh + 12px);
        width:185px;
        max-height:90px;
        font-size:8px;
        padding:5px;
    }
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- نوار اطلاعات -->
<div id="top">

    <div class="title">
        🌍 جنگ جهانی
    </div>

    <div class="stat">
        کشور
        <strong id="myCountry">---</strong>
    </div>

    <div class="stat">
        💰 پول
        <strong id="money">0</strong>
    </div>

    <div class="stat">
        🪖 ارتش
        <strong id="army">0</strong>
    </div>

    <div class="stat">
        🚜 تانک
        <strong id="tanks">0</strong>
    </div>

    <div class="stat">
        ✈️ هواپیما
        <strong id="planes">0</strong>
    </div>

    <div class="stat">
        📅 نوبت
        <strong id="turn">1</strong>
    </div>

    <button id="endTurn">
        پایان نوبت
    </button>

</div>


<!-- پنل اطلاعات -->
<div id="panel">

    <h2 id="countryName">
        روی یک کشور بزنید
    </h2>

    <div class="row">
        <span>مالک</span>
        <b id="owner">---</b>
    </div>

    <div class="row">
        <span>ارتش</span>
        <b id="countryArmy">---</b>
    </div>

    <div class="row">
        <span>تانک</span>
        <b id="countryTank">---</b>
    </div>

    <div class="row">
        <span>نیروی هوایی</span>
        <b id="countryAir">---</b>
    </div>

    <div class="row">
        <span>جمعیت</span>
        <b id="population">---</b>
    </div>

    <div class="row">
        <span>صنعت</span>
        <b id="industry">---</b>
    </div>

    <div class="buttons">

        <button class="attack" id="attack">
            ⚔️ حمله
        </button>

        <button class="soldier" id="recruit">
            🪖 سرباز
        </button>

        <button class="tank" id="tank">
            🚜 تانک
        </button>

        <button class="air" id="air">
            ✈️ هواپیما
        </button>

        <button class="peace" id="peace">
            🕊️ صلح
        </button>

        <button class="alliance" id="alliance">
            🤝 اتحاد
        </button>

    </div>

    <div id="message">
        کشورها را روی نقشه انتخاب کنید.
    </div>

</div>


<!-- گزارش -->
<div id="log"></div>


<!-- شروع بازی -->
<div id="start">

    <div class="startBox">

        <h1>🌍 جنگ جهانی</h1>

        <p>
            کشور خودت را انتخاب کن.
            نقشه جهان با مرزهای واقعی کشورها نمایش داده می‌شود.
        </p>

        <select id="country">
            <option value="">
                انتخاب کشور
            </option>
        </select>

        <button id="startButton">
            شروع بازی
        </button>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   WORLD WAR ENGINE
   ========================================================= */


/* نقشه واقعی */
const map = L.map("map", {
    zoomControl:true,
    attributionControl:false,
    minZoom:2,
    maxZoom:7,
    worldCopyJump:true
}).setView([25,10],2.3);


/* پس زمینه نقشه */
L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    {
        maxZoom:19
    }
).addTo(map);


/*
=========================================================
اطلاعات پایه کشورهای مهم
=========================================================
*/

const customData = {

    },

    },

    },

    ZAF:{

    PAK:{

    },

    JPN:{

    },

    KOR:{
        fa:"کره جنوبی",

    },

    AUS:{
        fa:"استرالیا",

        population:27,

    },

    IDN:{
        fa:"اندونزی",

    },

    KAZ:{
        fa:"قزاقستان",
        army:90,

        air:20,
        money:2500,
        population:20,
        industry:50
    }

};


/*
=========================================================
داده بازی
=========================================================
*/

let countries = {};
let layers = {};
let labels = {};

let player = null;
let selected = null;
let turn = 1;


/*
=========================================================
دریافت نقشه واقعی
=========================================================
*/

const GEOJSON_URL =
"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";


fetch(GEOJSON_URL)

.then(r => {

    if(!r.ok){
        throw new Error("GeoJSON failed");
    }

    return r.json();

})

.then(data => {

    createWorld(data);

})

.catch(err => {

    console.error(err);

    addLog(
        "❌ نقشه جهان بارگذاری نشد. اینترنت را بررسی کنید."
    );

});


/*
=========================================================
ساخت کشورها از روی مرز واقعی
=========================================================
*/

function createWorld(data){

    data.features.forEach((feature,index)=>{

        const p = feature.properties || {};

        const id =
            p.ISO_A3 ||
            p.ISO3 ||
            p.iso_a3 ||
            p.ADM0_A3;

        if(!id || id === "-99"){
            return;
        }


        const englishName =
            p.ADMIN ||
            p.NAME ||
            id;


        const special =
            customData[id];


        countries[id] = {

            id:id,

            name:
                special
                ? special.fa
                : englishName,

            english:englishName,

            owner:id,

            army:
                special
                ? special.army
                : random(50,130),

            tank:
                special
                ? special.tank
                : random(10,45),

            air:
                special
                ? special.air
                : random(5,30),

            money:
                special
                ? special.money
                : random(1000,3000),

            population:
                special
                ? special.population
                : random(5,150),

            industry:
                special
                ? special.industry
                : random(25,70),

            feature:feature

        };

    });


    /*
      لایه اصلی کشورها
    */

    Object.keys(countries).forEach(id=>{

        const c = countries[id];


        const layer =
            L.geoJSON(
                c.feature,
                {

                    style:{

                        color:"#9db0bd",

                        weight:1,

                        fillColor:"#315c76",

                        fillOpacity:.78

                    }

                }

            ).addTo(map);


        layers[id]=layer;


        layer.on("click",function(e){

            L.DomEvent.stopPropagation(e);

            selected=c;

            showCountry();

            redraw();

        });


        /*
          نام کشور
        */

        try{

            const center =
                layer.getBounds().getCenter();


            labels[id] =
                L.marker(
                    center,
                    {

                        interactive:false,

                        icon:
                        L.divIcon({

                            className:"country-name",

                            html:c.name,

                            iconSize:null

                        })

                    }

                ).addTo(map);

        }
        catch(e){}

    });


    /*
      انتخاب کشورها برای شروع
    */

    Object.keys(countries)
        .sort((a,b)=>
            countries[a].name.localeCompare(
                countries[b].name
            )
        )
        .forEach(id=>{

            const option =
                document.createElement("option");

            option.value=id;

            option.textContent=
                countries[id].name;

            document
                .getElementById("country")
                .appendChild(option);

        });


    redraw();

    addLog(
        "🌍 نقشه واقعی جهان با مرز کشورهای جهان آماده شد."
    );

}


/*
=========================================================
رنگ کشورها
=========================================================
*/

function redraw(){

    Object.keys(countries).forEach(id=>{

        const c=countries[id];

        let color="#315c76";


        /*
          کشور بازیکن سبز
        */

        if(c.owner===player){

            color="#239b68";

        }


        /*
          کشور انتخاب‌شده زرد
        */

        if(selected===c){

            layers[id].setStyle({

                color:"#ffffff",

                weight:3,

                fillColor:"#d28c27",

                fillOpacity:.95

            });

            return;

        }


        layers[id].setStyle({

            color:"#9db0bd",

            weight:1,

            fillColor:color,

            fillOpacity:.78

        });

    });

}


/*
=========================================================
نمایش اطلاعات کشور
=========================================================
*/

function showCountry(){

    if(!selected)return;


    document.getElementById(
        "countryName"
    ).textContent=selected.name;


    const owner =
        countries[selected.owner];


    document.getElementById(
        "owner"
    ).textContent=
        owner ? owner.name : selected.name;


    document.getElementById(
        "countryArmy"
    ).textContent=
        Math.floor(selected.army);


    document.getElementById(
        "countryTank"
    ).textContent=
        Math.floor(selected.tank);


    document.getElementById(
        "countryAir"
    ).textContent=
        Math.floor(selected.air);


    document.getElementById(
        "population"
    ).textContent=
        Math.floor(selected.population)
        +" میلیون";


    document.getElementById(
        "industry"
    ).textContent=
        Math.floor(selected.industry);

}


/*
=========================================================
اطلاعات بازیکن
=========================================================
*/

function updateTop(){

    if(!player)return;


    const p=countries[player];

    document.getElementById(
        "myCountry"
    ).textContent=p.name;


    document.getElementById(
        "money"
    ).textContent=
        Math.floor(p.money);


    document.getElementById(
        "army"
    ).textContent=
        Math.floor(p.army);


    document.getElementById(
        "tanks"
    ).textContent=
        Math.floor(p.tank);


    document.getElementById(
        "planes"
    ).textContent=
        Math.floor(p.air);


    document.getElementById(
        "turn"
    ).textContent=turn;

}


/*
=========================================================
شروع بازی
=========================================================
*/

document
.getElementById("startButton")
.addEventListener("click",()=>{

    const id =
        document.getElementById("country").value;


    if(!id){

        alert("ابتدا یک کشور انتخاب کنید.");

        return;

    }


    player=id;

    selected=countries[id];


    /*
      پاداش شروع
    */

    countries[id].money+=1000;

    countries[id].army+=30;


    document
        .getElementById("start")
        .classList.add("hidden");


    updateTop();

    showCountry();

    redraw();


    addLog(
        "⚔️ جنگ جهانی آغاز شد. "+
        countries[id].name+
        " تحت فرمان شماست."
    );

});


/*
=========================================================
استخدام سرباز
=========================================================
*/

document
.getElementById("recruit")
.addEventListener("click",()=>{

    if(!player)return;


    const p=countries[player];


    if(p.money<150){

        addLog("❌ پول کافی ندارید.");

        return;

    }


    p.money-=150;

    p.army+=30;


    addLog(
        "🪖 ۳۰ سرباز استخدام شد."
    );


    updateTop();

    showCountry();

});


/*
=========================================================
ساخت تانک
=========================================================
*/

document
.getElementById("tank")
.addEventListener("click",()=>{

/*
=========================================================
حمله
=========================================================
*/

document
.getElementById("attack")
.addEventListener("click",()=>{

    if(!player || !selected){

        return;

    }


    const me=countries[player];

    const enemy=selected;


    if(enemy.owner===player){

        addLog(
            "این کشور متعلق به شماست."
        );

        return;

    }


    if(me.army<25){

        addLog(
            "❌ ارتش شما برای حمله کافی نیست."
        );

        return;

    }


    /*
      برای اینکه بازی در نسخه پایه
      بیش از حد پیچیده نشود،
      فاصله جغرافیایی بررسی می‌شود.
    */

    const myLayer=layers[player];

    const enemyLayer=layers[enemy.id];


    if(!myLayer || !enemyLayer){

        return;

    }


    const myCenter=
        myLayer.getBounds().getCenter();

    const enemyCenter=
        enemyLayer.getBounds().getCenter();


    const distance=
        map.distance(
            myCenter,
            enemyCenter
        )/1000;


    /*
      برد پایه حمله
    */

    if(distance>3500){

        addLog(
            "❌ این کشور برای حمله بیش از حد دور است."
        );

        return;

    }


    const attackPower=

        me.army*.50+

        me.tank*.80+

        me.air*.35+

        me.industry*.20+

        Math.random()*100;


    const defensePower=

        enemy.army*.50+

        enemy.tank*.80+

        enemy.air*.35+

        enemy.industry*.20+

        Math.random()*100;


    const loss=
        Math.floor(
            me.army*
            (.08+Math.random()*.15)
        );


    me.army=
        Math.max(
            10,
            me.army-loss
        );


    if(attackPower>defensePower){

        enemy.owner=player;


        enemy.army=
            Math.max(
                10,
                Math.floor(enemy.army*.4)
            );


        me.money=
            Math.max(
                0,
                me.money-250
            );


        addLog(
            "🏆 پیروزی! "+
            enemy.name+
            " تصرف شد."
        );

    }
    else{

        enemy.army=
            Math.max(
                10,
                Math.floor(
                    enemy.army*.85
                )
            );


        me.money=
            Math.max(
                0,
                me.money-100
            );


        addLog(
            "❌ حمله به "+
            enemy.name+
            " شکست خورد."
        );

    }


    updateTop();

    showCountry();

    redraw();

    checkWin();

});

document
.getElementById("endTurn")
.addEventListener("click",()=>{

    if(!player)return;


    turn++;


    const p=countries[player];


    /*
      درآمد
    */

    const income=
        Math.floor(
            p.industry+
            p.population*.05
        );


    p.money+=income;


    /*
      رشد ارتش
    */

    p.army+=
        Math.floor(
            p.industry*.04
        );


    addLog(
        "💰 درآمد نوبت: "+
        income
    );


    /*
      حرکت کشورهای هوش مصنوعی
    */

    aiTurn();


    updateTop();

    showCountry();

    redraw();

    checkWin();

});


/*
=========================================================
هوش مصنوعی ساده
=========================================================
*/

function aiTurn(){

    const list=
        Object.values(countries);


    list.forEach(c=>{

        if(c.owner===player){
            return;
        }


        /*
          درآمد
        */

        c.money+=
            Math.floor(
                c.industry*.5
            );


        /*
          تولید
        */

        if(c.money>250){

            c.money-=250;

            c.army+=20;

        }


        if(c.money>500){

            c.money-=500;

            c.tank+=8;

        }


        /*
          احتمال حمله AI
        */

        if(Math.random()<.12){

            const targets=
                list.filter(
                    x=>
                        x.owner!==c.owner &&
                        x.id!==c.id
                );


            if(targets.length){

                const target=
                    targets[
                        Math.floor(
                            Math.random()*
                            targets.length
                        )
                    ];


                const power=
                    c.army*.4+
                    c.tank*.7+
                    c.air*.3;


                const defense=
                    target.army*.45+
                    target.tank*.7+
                    target.air*.3;


                if(power>defense){

                    target.owner=c.id;

                    target.army=
                        Math.max(
                            10,
                            Math.floor(
                                target.army*.4
                            )
                        );

                }

            }

        }

    });

}


/*
=========================================================
پیروزی
=========================================================
*/

function checkWin(){

    if(!player)return;


    const total=
        Object.keys(countries).length;


    const mine=
        Object.values(countries)
        .filter(
            c=>c.owner===player
        ).length;


    if(mine>=total){

        alert(
            "🏆 پیروزی نهایی!\n\n"+
            "تمام جهان را فتح کردی!"
        );

    }

}


/*
=========================================================
گزارش
=========================================================
*/

function addLog(text){

    const box=
        document.getElementById("log");


    const item=
        document.createElement("div");


    item.className="log";


    item.textContent=
        "نوبت "+turn+
        " | "+
        text;


    box.prepend(item);


    while(box.children.length>12){

        box.removeChild(
            box.lastChild
        );

    }

}


/*
=========================================================
عدد تصادفی
=========================================================
*/

function random(min,max){

    return Math.floor(
        Math.random()*
        (max-min+1)
    )+min;

}
