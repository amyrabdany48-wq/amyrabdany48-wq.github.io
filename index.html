<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Empire Horizon</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 padding:0;
 background:#07131e;
 color:#fff;
 font-family:Tahoma,Arial,sans-serif;
}

button{
 background:#102b42;
 color:#fff;
 border:1px solid #31536d;
 border-radius:8px;
 padding:9px;
 font-weight:bold;
}

button:active{
 transform:scale(.97);
}

.hidden{
 display:none!important;
}

/* =========================
 COUNTRY SELECT
========================= */

#countryScreen{
 min-height:100vh;
 padding:15px;
 background:
 linear-gradient(180deg,#0b2740,#06121d);
}

.logo{
 text-align:center;
 font-size:27px;
 color:#4ed7ff;
 font-weight:bold;
 margin:12px 0 4px;
}

.subtitle{
 text-align:center;
 color:#9eb5c7;
 font-size:12px;
 margin-bottom:15px;
}

#search{
 display:block;
 width:100%;
 max-width:650px;
 margin:0 auto 12px;
 padding:11px;
 border-radius:8px;
 border:1px solid #31536d;
 background:#091d2e;
 color:white;
 outline:none;
}

.countryGrid{
 max-width:900px;
 margin:auto;
 display:grid;
 grid-template-columns:
 repeat(auto-fill,minmax(120px,1fr));
 gap:7px;
}

.country{
 min-height:75px;
}

.country .flag{
 font-size:23px;
 display:block;
 margin-bottom:4px;
}

.country small{
 color:#9eb5c7;
 font-size:9px;
}

/* =========================
 GAME
========================= */

#game{
 display:none;
 min-height:100vh;
}

.top{
 position:sticky;
 top:0;
 z-index:20;
 background:#081722;
 border-bottom:1px solid #24445c;
 padding:6px;
}

.stats{
 display:grid;
 grid-template-columns:
 repeat(6,1fr);
 gap:4px;
}

.stat{
 background:#0c2133;
 border:1px solid #1c3a51;
 border-radius:7px;
 text-align:center;
 padding:6px 2px;
 font-size:9px;
}

.stat b{
 display:block;
 font-size:12px;
 margin-top:3px;
}

.layout{
 display:grid;
 grid-template-columns:
 minmax(0,1fr) 300px;
 min-height:calc(100vh - 65px);
}

/* =========================
 MAP
========================= */

.mapArea{
 position:relative;
 overflow:hidden;
 background:#091b28;
}

#map{
 display:block;
 width:100%;
 height:650px;
 background:#0a1d2b;
 touch-action:none;
}

.mapButtons{
 position:absolute;
 top:8px;
 left:8px;
 z-index:5;
 display:flex;
 gap:5px;
}

.mapButtons button{
 padding:8px 11px;
}

.mapText{
 position:absolute;
 bottom:8px;
 left:8px;
 background:#06131dcc;
 padding:6px 8px;
 border-radius:6px;
 color:#9eb5c7;
 font-size:9px;
}

/* =========================
 SIDE
========================= */

.side{
 background:#081724;
 border-right:1px solid #203c52;
 padding:7px;
 overflow:auto;
}

.panel{
 background:#0c2133;
 border:1px solid #1d3b52;
 border-radius:9px;
 padding:9px;
 margin-bottom:7px;
}

.title{
 color:#52d8ff;
 font-weight:bold;
 margin-bottom:7px;
}

.menu{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:5px;
}

.menu button{
 font-size:10px;
}

.log{
 max-height:170px;
 overflow:auto;
 font-size:9px;
 line-height:1.8;
}

.log div{
 border-bottom:1px solid #193348;
 padding:2px;
}

/* =========================
 MODAL
========================= */

#modal{
 position:fixed;
 inset:0;
 z-index:100;
 background:#000b;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:10px;
}

.modalBox{
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 background:#091b2b;
 border:1px solid #31536d;
 border-radius:12px;
 padding:13px;
}

.close{
 float:left;
 background:#40232a;
}

.row{
 display:flex;
 justify-content:space-between;
 padding:7px;
 margin:4px 0;
 background:#102b42;
 border-radius:6px;
 font-size:10px;
}

.actions{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:5px;
 margin-top:8px;
}

.info{
 background:#10283d;
 padding:8px;
 border-radius:7px;
 font-size:10px;
 line-height:1.8;
 margin:7px 0;
}

/* =========================
 MOBILE
========================= */

@media(max-width:800px){

 .layout{
  display:block;
 }

 .side{
  border-right:0;
  border-top:1px solid #203c52;
 }

 #map{
  height:500px;
 }

 .stats{
  grid-template-columns:
  repeat(3,1fr);
 }

}

@media(max-width:430px){

 #map{
  height:430px;
 }

 .countryGrid{
  grid-template-columns:
  repeat(2,1fr);
 }

 .actions{
  grid-template-columns:1fr;
 }

}
</style>
</head>

<script>

/* ==================================================
 DATA
================================================== */

const countries=[

 ["آمریکا","🇺🇸"],
 ["کانادا","🇨🇦"],
 ["مکزیک","🇲🇽"],
 ["برزیل","🇧🇷"],
 ["آرژانتین","🇦🇷"],
 ["انگلستان","🇬🇧"],
 ["فرانسه","🇫🇷"],
 ["آلمان","🇩🇪"],
 ["ایتالیا","🇮🇹"],
 ["اسپانیا","🇪🇸"],
 ["روسیه","🇷🇺"],
 ["مصر","🇪🇬"],
 ["الجزایر","🇩🇿"],
 ["نیجریه","🇳🇬"],
 ["آفریقای جنوبی","🇿🇦"],
 ["ترکیه","🇹🇷"],
 ["ایران","🇮🇷"],
 ["عراق","🇮🇶"],
 ["عربستان","🇸🇦"],
 ["هند","🇮🇳"],
 ["چین","🇨🇳"],
 ["ژاپن","🇯🇵"],
 ["استرالیا","🇦🇺"],
 ["افغانستان","🇦🇫"],
 ["پاکستان","🇵🇰"],
 ["اوکراین","🇺🇦"],
 ["لهستان","🇵🇱"],
 ["سوئد","🇸🇪"],
 ["نروژ","🇳🇴"],
 ["فنلاند","🇫🇮"],
 ["یونان","🇬🇷"],
 ["سوریه","🇸🇾"],
 ["امارات","🇦🇪"],
 ["قطر","🇶🇦"],
 ["عمان","🇴🇲"],
 ["پاکستان","🇵🇰"],
 ["اندونزی","🇮🇩"],
 ["ویتنام","🇻🇳"],
 ["تایلند","🇹🇭"],
 ["کره جنوبی","🇰🇷"],
 ["کره شمالی","🇰🇵"],
 ["مغولستان","🇲🇳"],
 ["قزاقستان","🇰🇿"],
 ["عراق","🇮🇶"],
 ["سوئیس","🇨🇭"],
 ["اتریش","🇦🇹"],
 ["هلند","🇳🇱"],
 ["بلژیک","🇧🇪"],
 ["رومانی","🇷🇴"],
 ["صربستان","🇷🇸"],
 ["شیلی","🇨🇱"],
 ["پرو","🇵🇪"],
 ["کلمبیا","🇨🇴"],
 ["ونزوئلا","🇻🇪"],
 ["نیوزیلند","🇳🇿"]

];


/* ==================================================
 STATE
================================================== */

let game=null;

let mapScale=1;

let mapX=0;

let mapY=0;

let dragging=false;

let lastX=0;

let lastY=0;


/* ==================================================
 CREATE WORLD
================================================== */

function createWorld(){

 return countries.map(
  (c,i)=>({

   id:i,

   name:c[0],

   flag:c[1],

   money:
    30000+
    Math.random()*50000,

   production:
    35+
    Math.random()*35,

   resources:
    100+
    Math.random()*100,

   inflation:
    2+
    Math.random()*4,

   stability:
    65+
    Math.random()*30,

   military:
    30+
    Math.random()*90,

   industry:1,

   infrastructure:1,

   territory:100,

   units:{
    tank:5,
    fighter:5,
    drone:5,
    missile:5,
    ship:5,
    defense:5
   },

   relation:{},

   war:[],

   sanctions:[],

   ai:{
    aggression:
     .15+
     Math.random()*.75,

    economy:
     .3+
     Math.random()*.7,

    diplomacy:
     .3+
     Math.random()*.7
   }

  })
 );

}


/* ==================================================
 COUNTRY SELECT
================================================== */

function renderCountries(){

 const box=
  document.getElementById(
   "countries"
  );

 box.innerHTML="";

 const used=new Set();

 countries.forEach(
  (c,i)=>{

   if(used.has(c[0]))
    return;

   used.add(c[0]);

   const b=
    document.createElement(
     "button"
    );

   b.className="country";

   b.dataset.name=c[0];

   b.innerHTML=
    `<span class="flag">
      ${c[1]}
     </span>
     <b>${c[0]}</b>
     <small>
      انتخاب کشور
     </small>`;

   b.onclick=
    ()=>startGame(i);

   box.appendChild(b);

  }
 );

}


function searchCountries(){

 const q=
  document
   .getElementById("search")
   .value
   .toLowerCase();

 document
  .querySelectorAll(".country")
  .forEach(
   b=>{
    b.style.display=
     b.dataset.name
      .toLowerCase()
      .includes(q)
      ?"block"
      :"none";
   }
  );

}


/* ==================================================
 START
================================================== */

function startGame(id){

 game={

  player:id,

  world:createWorld(),

  year:2026,

  month:1,

  day:1,

  hour:0,

  minute:0,

  paused:false

 };

 /*
  روابط
 */

 game.world.forEach(
  a=>{

   game.world.forEach(
    b=>{

     if(a.id!==b.id){

      a.relation[b.id]=
       -15+
       Math.random()*45;

     }

    }
   );

  }
 );

 document
  .getElementById(
   "countryScreen"
  )
  .style.display="none";

 document
  .getElementById(
   "game"
  )
  .style.display="block";

 document
  .getElementById(
   "player"
  )
  .textContent=
   game.world[id].flag+
   " "+
   game.world[id].name;

 updateUI();

 log(
  "🌍 کشور شما وارد جهان شد."
 );

 saveGame();

}


/* ==================================================
 UI
================================================== */

function updateUI(){

 if(!game)return;

 const p=
  game.world[
   game.player
  ];

 document.getElementById(
  "money"
 ).textContent=
  Math.floor(
   p.money
  ).toLocaleString();

 document.getElementById(
  "production"
 ).textContent=
  Math.floor(
   p.production
  );

 document.getElementById(
  "inflation"
 ).textContent=
  p.inflation.toFixed(2)
  +"%";

 document.getElementById(
  "resources"
 ).textContent=
  Math.floor(
   p.resources
  );

 document.getElementById(
  "army"
 ).textContent=
  Math.floor(
   p.military
  );

 document.getElementById(
  "date"
 ).textContent=
  pDate();

 document.getElementById(
  "dateFull"
 ).textContent=
  `سال ${game.year} |
   ماه ${game.month} |
   روز ${game.day} |
   ساعت ${game.hour}:
   ${String(game.minute)
    .padStart(2,"0")}`;

}


/* ==================================================
 DATE
================================================== */

function pDate(){

 return(
  game.day+
  "/"+
  game.month+
  "/"+
  game.year
 );

}


/* ==================================================
 TIME ENGINE
================================================== */

let lastTick=
 Date.now();

setInterval(
 ()=>{

  if(
   !game||
   game.paused
  )
   return;

  /*
   هر ثانیه واقعی:
   یک ساعت بازی
  */

  game.hour++;

  if(
   game.hour>=24
  ){

   game.hour=0;

   game.day++;

   economyTick();

  }

  if(
   game.day>30
  ){

   game.day=1;

   game.month++;

  }

  if(
   game.month>12
  ){

   game.month=1;

   game.year++;

   log(
    "🎆 سال جدید آغاز شد."
   );

  }

  updateUI();

 },
 1000
);


/* ==================================================
 ECONOMY
================================================== */

function economyTick(){

 if(!game)return;

 const p=
  game.world[
   game.player
  ];

 let income=
  p.production*
  (
   1+
   p.infrastructure*.025+
   p.industry*.02
  );

 income*=
  Math.max(
   .2,
   1-
   p.inflation*.01
  );

 let cost=
  p.military*.08+
  p.industry*3+
  p.infrastructure*2;

 p.money+=
  income-cost;

 p.resources+=
  p.production*.02;

 /*
  تورم
 */

 if(
  p.money<10000
 )
  p.inflation+=.05;

 if(
  p.production<25
 )
  p.inflation+=.04;

 if(
  p.stability<35
 )
  p.inflation+=.06;

 if(
  p.money>100000
 )
  p.inflation-=.025;

 /*
  برگشت طبیعی
 */

 p.inflation+=
  (4-p.inflation)
  *.001;

 p.inflation=
  Math.max(
   .5,
   Math.min(
    80,
    p.inflation
   )
  );

 /*
  ثبات
 */

 if(
  p.inflation>15
 )
  p.stability-=.15;

 if(
  p.inflation<6
 )
  p.stability+=.05;

 p.stability=
  Math.max(
   5,
   Math.min(
    100,
    p.stability
   )
  );

 aiTick();

 updateUI();

}


/* ==================================================
 AI
================================================== */

function aiTick(){

 const player=
  game.world[
   game.player
  ];

 game.world.forEach(
  c=>{

   if(
    c.id===player.id
   )
    return;

   /*
    رشد اقتصاد
   */

   c.money+=
    c.production*
    (
     .6+
     c.ai.economy*.4
    );

   c.resources+=
    c.production*.01;

   /*
    سرمایه‌گذاری
   */

   if(
    c.money>60000&&
    Math.random()<
    .12
   ){

    c.money-=12000;

    c.industry++;

    c.production+=5;

   }

   /*
    خرید نظامی
   */

   if(
    c.money>50000&&
    Math.random()<
    c.ai.aggression*.12
   ){

    c.money-=6000;

    c.units.tank++;

    c.military+=1;

   }

   /*
    روابط
   */

   let r=
    c.relation[player.id];

   /*
    احتمال حمله
   */

   const strength=
    c.military/
    Math.max(
     1,
     player.military
    );

   const hostility=
    Math.max(
     0,
     -r/100
    );

   const chance=
    hostility*
    c.ai.aggression*
    .025;

   if(
    strength>.65&&
    player.stability<80&&
    Math.random()<chance
   ){

    war(c,player);

   }

  }
 );

}


/* ==================================================
 WAR
================================================== */

function war(a,d){

 if(
  a.war.includes(d.id)
 )
  return;

 a.war.push(d.id);

 d.war.push(a.id);

 let attack=
  a.military*
  (
   .85+
   Math.random()*.35
  );

 let defense=
  d.military*
  (
   .9+
   Math.random()*.3
  );

 defense+=
  d.units.defense*.5;

 if(
  attack>defense
 ){

  const gain=
   1+
   Math.random()*5;

  d.territory=
   Math.max(
    1,
    d.territory-gain
   );

  a.territory+=gain;

  d.military*=.94;

  a.military*=.98;

  d.stability-=4;

  log(
   "⚔️ "+
   a.name+
   " در جنگ پیروز شد."
  );

 }else{

  a.military*=.92;

  a.stability-=2;

  log(
   "🛡️ "+
   d.name+
   " حمله را دفع کرد."
  );

 }

 a.war=
  a.war.filter(
   x=>x!==d.id
  );

 d.war=
  d.war.filter(
   x=>x!==a.id
  );

}

/* ==================================================
 LOG
================================================== */

function log(text){

 const box=
  document.getElementById(
   "log"
  );

 if(!box)return;

 const d=
  document.createElement(
   "div"
  );

 d.textContent=text;

 box.prepend(d);

 while(
  box.children.length>40
 ){

  box.removeChild(
   box.lastChild
  );

 }

}


/* ==================================================
 MAP

function zoomMap(value){

 mapScale*=
  value;

 mapScale=
  Math.max(
   .7,
   Math.min(
    3,
    mapScale
   )
  );

 applyMap();

}


function resetMap(){

 mapScale=1;

 mapX=0;

 mapY=0;

 applyMap();

}


function applyMap(){

 document
  .getElementById(
   "world"
  )
  .setAttribute(
   "transform",
   `translate(${mapX} ${mapY})
    scale(${mapScale})`
  );

}


/* ==================================================
 MAP DRAG
================================================== */

const map=
 document.getElementById(
  "map"
 );

map.addEventListener(
 "pointerdown",
 e=>{

  dragging=true;

  lastX=e.clientX;

  lastY=e.clientY;

  map.setPointerCapture(
   e.pointerId
  );

 }
);


map.addEventListener(
 "pointermove",
 e=>{

  if(!dragging)
   return;

  mapX+=
   e.clientX-lastX;

  mapY+=
   e.clientY-lastY;

  lastX=e.clientX;

  lastY=e.clientY;

  applyMap();

 }
);


map.addEventListener(
 "pointerup",
 ()=>{
  dragging=false;
 }
);


map.addEventListener(
 "pointercancel",
 ()=>{
  dragging=false;
 }
);
