<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>فرمانروایان جهان — نسخه MEGA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07111d;color:#eaf3ff;
 font-family:Tahoma,Arial,sans-serif;
 overflow-x:hidden
}
button,input,select{font-family:inherit}
button{
 border:0;border-radius:12px;padding:11px;
 background:#17314a;color:white;font-weight:bold;
 cursor:pointer
}
button:active{transform:scale(.97)}
.app{max-width:1100px;margin:auto;min-height:100vh;background:#091624}
header{
 padding:14px;background:linear-gradient(135deg,#102b43,#07111d);
 border-bottom:1px solid #24435c;position:sticky;top:0;z-index:20
}
.title{font-size:20px;font-weight:bold}
.sub{font-size:11px;color:#91aabd;margin-top:5px}
.stats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:6px;margin-top:12px
}
.stat{
 background:#102438;border:1px solid #203c54;
 padding:8px;border-radius:10px;text-align:center;font-size:10px
}
.stat b{display:block;font-size:14px;margin-top:4px}
.page{padding:10px 10px 90px}
.panel{
 background:#0d1d2c;border:1px solid #203d56;
 border-radius:16px;padding:12px;margin-bottom:10px
}
.sectionTitle{
 font-weight:bold;margin:16px 0 9px;
 color:#7fd6ff;font-size:14px
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.card{
 background:#102537;border:1px solid #21425b;
 border-radius:13px;padding:11px;margin-top:8px
}
.mini{
 background:#102537;border:1px solid #21425b;
 padding:10px;border-radius:12px;font-size:10px;color:#9eb5c8
}
.mini b{display:block;color:#fff;font-size:17px;margin-top:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.progress{
 height:8px;background:#07131f;border-radius:20px;
 overflow:hidden;margin-top:5px
}
.progress i{display:block;height:100%;background:#43b8e8}
.action{
 width:100%;margin-top:7px;background:#174664
}
.green{background:#176047}
.red{background:#673044}
.gold{background:#63521b}
.purple{background:#513477}
.warn{color:#ffd15c}
.good{color:#67e39a}
.bad{color:#ff7286}
.fullInput{
 width:100%;padding:11px;margin-top:7px;
 border-radius:10px;border:1px solid #28465d;
 background:#091925;color:white
}
.warUnit{
 background:#0c1b29;border:1px solid #1d394e;
 border-radius:12px;padding:10px;margin-top:7px
}
.tabs{
 display:flex;gap:5px;overflow:auto;padding-bottom:5px
}
.tab{white-space:nowrap;font-size:11px;padding:9px 12px}
.tab.active{background:#287eaa}
.bottom{
 position:fixed;bottom:0;left:0;right:0;
 max-width:1100px;margin:auto;
 background:#081521;border-top:1px solid #254157;
 display:grid;grid-template-columns:repeat(5,1fr);
 z-index:50;padding:5px
}
.nav{font-size:10px;background:transparent}
.nav.active{background:#173a54}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.72);
 z-index:100;display:none;padding:15px;
 overflow:auto
}
.modalBox{
 max-width:650px;margin:30px auto;background:#0b1b2a;
 border:1px solid #31526a;border-radius:18px;padding:14px
}
.country{
 min-height:90px;padding:12px;border-radius:14px;
 border:1px solid #28485f;background:#102638
}
.country.selected{border-color:#58c9ff;box-shadow:0 0 0 1px #58c9ff}
.country b{display:block;font-size:14px}
.country small{color:#8da8bc}
.news{
 border-right:3px solid #328db5;
 padding:8px;margin-top:6px;background:#0c1c2a;
 border-radius:7px;font-size:11px
}
.map{
 min-height:360px;border-radius:18px;
 background:
 radial-gradient(circle at 20% 30%,#164361 0 4%,transparent 5%),
 radial-gradient(circle at 70% 60%,#193f50 0 6%,transparent 7%),
 linear-gradient(145deg,#071b29,#0c2b3c);
 position:relative;overflow:hidden;border:1px solid #254a61
}
.continent{
 position:absolute;border:2px solid #2f7088;
 background:#153a49;border-radius:45% 55% 42% 58%;
 opacity:.9
}
.c1{width:150px;height:100px;left:7%;top:18%;transform:rotate(-12deg)}
.c2{width:120px;height:150px;left:32%;top:42%;transform:rotate(18deg)}
.c3{width:180px;height:100px;right:5%;top:20%;transform:rotate(9deg)}
.c4{width:100px;height:150px;right:32%;bottom:8%;transform:rotate(-22deg)}
.mapTitle{
 position:absolute;top:12px;right:12px;
 background:#07131fcc;padding:8px;border-radius:10px;font-size:11px
}
.dot{
 position:absolute;width:14px;height:14px;border-radius:50%;
 background:#5cd3ff;border:2px solid white;z-index:3
}
.d1{left:20%;top:35%}.d2{left:43%;top:52%}
.d3{right:25%;top:37%}.d4{right:13%;top:55%}
.toast{
 position:fixed;top:75px;left:50%;transform:translateX(-50%);
 background:#102b40;border:1px solid #3e7190;padding:11px 16px;
 border-radius:12px;z-index:200;display:none;font-size:12px
}
canvas{
 width:100%;height:190px;background:#06111a;
 border:1px solid #24465d;border-radius:12px;margin-top:8px
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="title">🌍 فرمانروایان جهان — MEGA</div>
 <div class="sub" id="countryTitle">در حال آماده‌سازی کشور...</div>

 <div class="stats">
  <div class="stat">💰 خزانه<b id="money">0</b></div>
  <div class="stat">👥 جمعیت<b id="population">0</b></div>
  <div class="stat">🏭 تولید<b id="production">0</b></div>
  <div class="stat">😊 رضایت<b id="approval">0%</b></div>
 </div>
</header>

<main class="page" id="page"></main>

<div class="bottom">
 <button class="nav active" onclick="showPage('home',this)">🏠<br>کشور</button>
 <button class="nav" onclick="showPage('government',this)">🏛<br>دولت</button>
 <button class="nav" onclick="showPage('economy',this)">💰<br>اقتصاد</button>
 <button class="nav" onclick="showPage('war',this)">⚔️<br>جنگ</button>
 <button class="nav" onclick="showPage('world',this)">🌐<br>جهان</button>
</div>

<div class="modal" id="modal">
 <div class="modalBox" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

</div>

<script>
"use strict";

/* =========================================================
   DATA
========================================================= */

const countries=[
 {id:"ir",name:"ایران",power:72,economy:76,industry:70,tech:62,stability:72,aggression:45},
 {id:"tr",name:"ترکیه",power:78,economy:82,industry:79,tech:68,stability:76,aggression:52},
 {id:"de",name:"آلمان",power:86,economy:94,industry:96,tech:91,stability:88,aggression:20},
 {id:"fr",name:"فرانسه",power:88,economy:90,industry:88,tech:87,stability:84,aggression:28},
 {id:"uk",name:"بریتانیا",power:90,economy:91,industry:84,tech:92,stability:81,aggression:34},
 {id:"cn",name:"چین",power:98,economy:100,industry:100,tech:94,stability:90,aggression:58},
 {id:"jp",name:"ژاپن",power:82,economy:91,industry:90,tech:96,stability:91,aggression:15},
 {id:"in",name:"هند",power:91,economy:88,industry:82,tech:79,stability:72,aggression:42},
 {id:"br",name:"برزیل",power:65,economy:73,industry:68,tech:61,stability:69,aggression:22},
 {id:"eg",name:"مصر",power:67,economy:61,industry:62,tech:55,stability:67,aggression:47},
 {id:"sa",name:"عربستان",power:76,economy:85,industry:59,tech:70,stability:73,aggression:50},
 {id:"ru",name:"روسیه",power:96,economy:79,industry:87,tech:81,stability:76,aggression:74},
 {id:"us",name:"آمریکا",power:100,economy:100,industry:97,tech:100,stability:82,aggression:60},
 {id:"za",name:"آفریقای جنوبی",power:53,economy:57,industry:54,tech:51,stability:60,aggression:20}
];

let game={
 country:null,
 money:10000,
 population:40,
 production:100,
 approval:70,
 tax:15,
 inflation:5,
 growth:4,
 gdp:2500,
 employment:88,
 interest:4,
 debt:0,
 corruption:15,
 stability:75,
 trust:70,
 education:60,
 health:65,
 infrastructure:60,
 innovation:45,
 technology:60,
 cyber:45,
 intelligence:45,
 energy:80,
 water:80,
 food:80,
 pollution:25,
 morale:75,
 readiness:70,
 logistics:70,
 navy:30,
 airDefense:35,
 warWeariness:0,
 tradePower:50,
 relations:{},
 army:{soldier:100,tank:20,air:15,drone:20,artillery:10},
 missiles:{short:5,medium:3,long:1,precision:1,hypersonic:0},
 projects:{},
 wars:0,
 wins:0,
 losses:0,
 turn:1,
 news:[],
 market:{oil:80,food:55,steel:70,tech:120}
};

countries.forEach(c=>{
 if(c.id!=="player")game.relations[c.id]=50;
});

/* =========================================================
   UTILITIES
========================================================= */

function clamp(v,min=0,max=100){
 return Math.max(min,Math.min(max,Number(v)||0));
}
function rnd(a,b){
 return Math.floor(Math.random()*(b-a+1))+a;
}
function money(n){
 return Math.floor(n).toLocaleString("fa-IR");
}
function msg(t){
 const x=document.getElementById("toast");
 x.textContent=t;x.style.display="block";
 clearTimeout(window.tt);
 window.tt=setTimeout(()=>x.style.display="none",2300);
}
function save(){
 localStorage.setItem("WORLD_EMPIRE_MEGA",JSON.stringify(game));
}
function load(){
 try{
  const x=JSON.parse(localStorage.getItem("WORLD_EMPIRE_MEGA"));
  if(x)game={...game,...x};
 }catch(e){}
}
function selectedCountry(){
 return countries.find(c=>c.id===game.country);
}
function targetCountry(id){
 return countries.find(c=>c.id===id);
}
function addNews(text){
 game.news.unshift("روز "+game.turn+" — "+text);
 game.news=game.news.slice(0,30);
}

/* =========================================================
   START
========================================================= */

load();

if(!game.country){
 showCountrySelect();
}else{
 render();
}

/* =========================================================
   COUNTRY SELECT
========================================================= */

function showCountrySelect(){
 document.getElementById("page").innerHTML=`
 <div class="panel">
  <h2>🌍 انتخاب کشور</h2>
  <p class="sub">کشور خودت را انتخاب کن و جهان را مدیریت کن.</p>
 </div>

 <div class="grid2">
 ${countries.map(c=>`
  <div class="country" onclick="chooseCountry('${c.id}')">
   <b>${c.name}</b>
   <small>قدرت ${c.power} | اقتصاد ${c.economy}</small>
   <div class="progress"><i style="width:${c.power}%"></i></div>
  </div>
 `).join("")}
 </div>
 `;
}

window.chooseCountry=function(id){
 game.country=id;
 const c=selectedCountry();

 game.money=10000+c.economy*50;
 game.gdp=1800+c.economy*15;
 game.production=70+c.industry*.45;
 game.technology=c.tech*.7;
 game.stability=c.stability;
 game.approval=65;
 game.population=25+c.economy*.25;

 countries.forEach(x=>{
  if(x.id!==id)game.relations[x.id]=50;
 });

 addNews("🏛 دولت جدید تشکیل شد و کشور وارد دوره مدیریت شما شد.");
 save();
 render();
};

/* =========================================================
   MAIN RENDER
========================================================= */

function render(){
 updateHeader();
 showPage(window.currentPage||"home",document.querySelector(".nav.active"));
}

function updateHeader(){
 const c=selectedCountry();
 document.getElementById("countryTitle").textContent=
 c?`🏳️ ${c.name} | سال ${2026+game.turn}`:"انتخاب کشور";

 document.getElementById("money").textContent=money(game.money);
 document.getElementById("population").textContent=game.population.toFixed(1)+"M";
 document.getElementById("production").textContent=Math.floor(game.production);
 document.getElementById("approval").textContent=Math.floor(game.approval)+"%";
}

/* =========================================================
   PAGE ROUTER
========================================================= */

window.showPage=function(page,button){
 window.currentPage=page;

 document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
 if(button)button.classList.add("active");

 const p=document.getElementById("page");

 if(page==="home")homePage(p);
 if(page==="government")governmentPage(p);
 if(page==="economy")economyPage(p);
 if(page==="war")warPage(p);
 if(page==="world")worldPage(p);

 updateHeader();
};

/* =========================================================
   HOME
========================================================= */

function homePage(p){
 p.innerHTML=`
 <div class="panel">
  <div class="sectionTitle">🗺 نقشه جهان</div>
  <div class="map">
   <div class="mapTitle">🌐 نقشه استراتژیک جهان</div>
   <div class="continent c1"></div>
   <div class="continent c2"></div>
   <div class="continent c3"></div>
   <div class="continent c4"></div>
   <div class="dot d1"></div><div class="dot d2"></div>
   <div class="dot d3"></div><div class="dot d4"></div>
  </div>
 </div>

 <div class="grid2">
  ${metric("GDP",money(game.gdp),"💹")}
  ${metric("تورم",game.inflation.toFixed(1)+"%","📈")}
  ${metric("بیکاری",(100-game.employment).toFixed(1)+"%","👥")}
  ${metric("ثبات",Math.floor(game.stability)+"%","🏛")}
  ${metric("آمادگی",Math.floor(game.readiness)+"%","🎖")}
  ${metric("نوآوری",Math.floor(game.innovation)+"%","🔬")}
  ${metric("انرژی",Math.floor(game.energy)+"%","⚡")}
  ${metric("غذا",Math.floor(game.food)+"%","🌾")}
 </div>

 <div class="panel">
  <div class="sectionTitle">📊 سلامت کشور</div>
  ${bar("😊 رضایت مردم",game.approval)}
  ${bar("🏥 سلامت",game.health)}
  ${bar("🎓 آموزش",game.education)}
  ${bar("🏗 زیرساخت",game.infrastructure)}
  ${bar("💻 امنیت سایبری",game.cyber)}
  ${bar("🧠 اطلاعات",game.intelligence)}
 </div>

 <div class="panel">
  <div class="sectionTitle">📰 آخرین اخبار</div>
  ${game.news.slice(0,8).map(x=>`<div class="news">${x}</div>`).join("")||"هنوز خبری ثبت نشده است."}
 </div>
 `;
}

function metric(a,b,e){
 return `<div class="mini">${e} ${a}<b>${b}</b></div>`;
}
function bar(name,value){
 return `<div style="margin-top:9px">${name}<div class="progress"><i style="width:${clamp(value)}%"></i></div></div>`;
}

/* =========================================================
   GOVERNMENT
========================================================= */

function governmentPage(p){
 p.innerHTML=`
 <div class="panel">
  <h2>🏛 دولت و کابینه</h2>
  <div class="grid2">
   ${metric("اعتماد دولت",Math.floor(game.trust)+"%","🤝")}
   ${metric("فساد",Math.floor(game.corruption)+"%","⚠️")}
   ${metric("ثبات سیاسی",Math.floor(game.stability)+"%","🏛")}
   ${metric("رضایت",Math.floor(game.approval)+"%","❤️")}
  </div>
 </div>

 <div class="panel">
  <div class="sectionTitle">💵 مالیات</div>
  <input class="fullInput" type="range" min="0" max="45"
   value="${game.tax}" oninput="setTax(this.value)">
  <div class="row"><span>نرخ مالیات</span><b id="taxValue">${game.tax}%</b></div>

  <button class="action" onclick="collectTaxes()">💰 دریافت مالیات</button>
 </div>

 <div class="panel">
  <div class="sectionTitle">🏦 بانک مرکزی</div>
  <div class="card">
   <div class="row"><span>نرخ بهره</span><b>${game.interest.toFixed(1)}%</b></div>
   <div class="row"><span>تورم</span><b>${game.inflation.toFixed(1)}%</b></div>
   <div class="row"><span>بدهی</span><b>${money(game.debt)}</b></div>
  </div>
  <button class="action" onclick="centralBank('raise')">📈 افزایش نرخ بهره</button>
  <button class="action" onclick="centralBank('lower')">📉 کاهش نرخ بهره</button>
  <button class="action gold" onclick="centralBank('emergency')">🚨 تأمین مالی اضطراری</button>
 </div>

 <div class="panel">
  <div class="sectionTitle">📜 اصلاحات</div>
  <button class="action purple" onclick="reform('anti')">🧹 مبارزه با فساد</button>
  <button class="action" onclick="reform('education')">🎓 اصلاح نظام آموزشی</button>
  <button class="action green" onclick="reform('infrastructure')">🏗 برنامه زیرساختی</button>
  <button class="action gold" onclick="reform('social')">❤️ بسته رفاهی</button>
 </div>
 `;
}

window.setTax=function(v){
 game.tax=Number(v);
 const x=document.getElementById("taxValue");
 if(x)x.textContent=v+"%";
};

window.collectTaxes=function(){
 const income=game.gdp*(game.tax/100)*.08;
 game.money+=income;
 game.approval-=Math.max(0,(game.tax-20)*.08);
 game.inflation+=Math.max(0,(game.tax-25)*.02);
 addNews(`💰 دولت ${money(income)} درآمد مالیاتی دریافت کرد.`);
 clampAll();save();render();
};

window.centralBank=function(type){
 if(type==="raise"){
  game.interest=Math.min(20,game.interest+.5);
  game.inflation-=.7;
  game.growth-=.15;
 }
 if(type==="lower"){
  game.interest=Math.max(0,game.interest-.5);
  game.inflation+=.55;
  game.growth+=.25;
 }
 if(type==="emergency"){
  game.money+=1200;
  game.debt+=1400;
  game.inflation+=1.3;
  game.trust-=2;
 }
 addNews("🏦 بانک مرکزی سیاست پولی جدیدی اجرا کرد.");
 clampAll();save();render();
};

window.reform=function(type){
 if(game.money<800){msg("بودجه کافی نیست.");return}
 game.money-=800;

 if(type==="anti"){
  game.corruption-=9;game.trust+=4;game.efficiency=1;
 }
 if(type==="education"){
  game.education+=8;game.innovation+=4;
 }
 if(type==="infrastructure"){
  game.infrastructure+=8;game.production+=5;
 }
 if(type==="social"){
  game.approval+=7;game.health+=3;
 }
 addNews("📜 یک اصلاحات ملی اجرا شد.");
 clampAll();save();render();
};

/* =========================================================
   ECONOMY
========================================================= */

function economyPage(p){
 p.innerHTML=`
 <div class="panel">
  <h2>💰 اقتصاد ملی</h2>
  <div class="grid2">
   ${metric("GDP",money(game.gdp),"💹")}
   ${metric("رشد",game.growth.toFixed(1)+"%","📈")}
   ${metric("تورم",game.inflation.toFixed(1)+"%","🔥")}
   ${metric("بیکاری",(100-game.employment).toFixed(1)+"%","👷")}
   ${metric("تجارت",Math.floor(game.tradePower),"📦")}
   ${metric("بدهی",money(game.debt),"🏦")}
  </div>
 </div>

 <div class="panel">
  <div class="sectionTitle">🌐 بازار جهانی</div>
  ${marketRow("🛢 نفت",game.market.oil)}
  ${marketRow("🌾 غذا",game.market.food)}
  ${marketRow("🔩 فولاد",game.market.steel)}
  ${marketRow("💻 فناوری",game.market.tech)}
  <button class="action" onclick="trade()">📦 معامله در بازار جهانی</button>
 </div>

 <div class="panel">
  <div class="sectionTitle">🏭 صنایع</div>
  <button class="action" onclick="invest('factory')">🏭 کارخانه جدید — 1500</button>
  <button class="action" onclick="invest('tech')">💻 مرکز فناوری — 2500</button>
  <button class="action" onclick="invest('energy')">⚡ نیروگاه — 1800</button>
  <button class="action" onclick="invest('farm')">🌾 مجتمع کشاورزی — 1200</button>
 </div>

 <div class="panel">
  <div class="sectionTitle">📊 نمودار اقتصادی</div>
  <canvas id="chart"></canvas>
 </div>
 `;
 drawChart();
}

function marketRow(n,v){
 return `<div class="row" style="margin-top:9px"><span>${n}</span><b>${Math.floor(v)}</b></div>`;
}

window.trade=function(){
 const profit=rnd(150,500);
 game.money+=profit;
 game.tradePower+=2;
 game.market.oil+=rnd(-5,5);
 game.market.food+=rnd(-4,4);
 addNews("📦 یک قرارداد تجاری موفق انجام شد.");
 clampAll();save();render();
};

window.invest=function(type){
 const costs={factory:1500,tech:2500,energy:1800,farm:1200};
 const c=costs[type];

 if(game.money<c){msg("بودجه کافی نیست.");return}

 game.money-=c;

 if(type==="factory"){game.production+=12;game.employment+=2}
 if(type==="tech"){game.innovation+=8;game.technology+=5;game.cyber+=3}
 if(type==="energy"){game.energy+=12;game.production+=4}
 if(type==="farm"){game.food+=15;game.population+=.2}

 addNews("🏗 سرمایه‌گذاری جدید اقتصادی تکمیل شد.");
 clampAll();save();render();
};

/* =========================================================
   WAR
========================================================= */

function warPage(p){
 p.innerHTML=`
 <div class="panel">
  <h2>⚔️ اتاق جنگ</h2>
  <div class="grid2">
   ${metric("قدرت ارتش",armyPower(),"⚔️")}
   ${metric("آمادگی",Math.floor(game.readiness)+"%","🎖")}

/* =========================================================
   WAR CALCULATION
========================================================= */

function armyPower(){
 return Math.floor(
  game.army.soldier*.35+
  game.army.tank*30+
  game.army.air*45+
  game.army.drone*12+
  game.army.artillery*28
 );
}

function warPower(){
 return armyPower()*
 (0.65+game.readiness/250)*
 (0.7+game.morale/333)*
 (0.75+game.logistics/400)*
 (0.8+game.intelligence/500);
}

window.attack=function(){
 const id=document.getElementById("warTarget").value;
 const enemy=targetCountry(id);

 if(!enemy)return;

 const my=warPower();
 const enemyPower=enemy.power*18*
 (0.7+enemy.stability/300)*
 (0.7+enemy.tech/300)*
 (rnd(90,110)/100);

 const terrain=rnd(85,115)/100;
 const finalMy=my*terrain;

 game.wars++;
 game.readiness-=7;
 game.morale-=3;
 game.warWeariness+=8;

 if(finalMy>enemyPower){
  game.wins++;
  game.money+=rnd(500,1500);
  game.gdp+=rnd(100,350);
  game.approval+=3;
  enemy.power=Math.max(15,enemy.power-rnd(5,12));

  addNews(`🏆 پیروزی در جنگ با ${enemy.name}!`);
  openResult("🏆 پیروزی","کشور شما در نبرد برتری به دست آورد.");
 }else{
  game.losses++;
  game.readiness-=12;
  game.morale-=7;
  game.approval-=4;

  addNews(`⚠️ شکست در نبرد با ${enemy.name}.`);
  openResult("⚠️ شکست","نیروهای شما نتوانستند برتری لازم را ایجاد کنند.");
 }

 clampAll();save();render();
};

window.airAttack=function(){
 const id=document.getElementById("warTarget").value;
 const enemy=targetCountry(id);
 if(!enemy)return;

 const air=game.army.air*45+game.army.drone*12;
 const defense=enemy.tech*2+rnd(100,250);

 game.readiness-=3;

 if(air*(game.technology/70)>defense){
  enemy.industry=Math.max(20,enemy.industry-7);
  game.money+=300;
  addNews(`✈️ عملیات هوایی علیه ${enemy.name} موفق بود.`);
  msg("✈️ عملیات هوایی موفق بود.");
 }else{
  game.readiness-=5;
  addNews(`🛡 عملیات هوایی علیه ${enemy.name} با مقاومت روبه‌رو شد.`);
  msg("🛡 دفاع هوایی دشمن قوی بود.");
 }

 clampAll();save();render();
};

window.blockade=function(){
 const id=document.getElementById("warTarget").value;
 const enemy=targetCountry(id);
 if(!enemy)return;

 if(game.tradePower<10){msg("قدرت تجاری کافی نیست.");return}

 game.tradePower-=10;
 enemy.economy=Math.max(20,enemy.economy-5);
 enemy.stability=Math.max(20,enemy.stability-2);
 game.reputation-=1;

 addNews(`📦 فشار اقتصادی علیه ${enemy.name} افزایش یافت.`);
 clampAll();save();render();
};

window.negotiate=function(){
 const id=document.getElementById("warTarget").value;
 const enemy=targetCountry(id);

 const chance=game.reputation*.45+
 game.intelligence*.25+
 game.relations[id]*.3+
 rnd(-20,20);

 if(chance>60){
  game.relations[id]=clamp(game.relations[id]+12);
  game.reputation+=2;
  addNews(`🤝 توافق دیپلماتیک با ${enemy.name} موفق شد.`);
  msg("🤝 مذاکره موفق شد.");
 }else{
  game.relations[id]=clamp(game.relations[id]-4);
  msg("❌ مذاکره شکست خورد.");
 }

 save();render();
};

/* =========================================================
   MISSILE SIMULATION
========================================================= */

const missileData={
 short:{name:"کوتاه‌برد",power:18,range:35,speed:72,accuracy:82},
 medium:{name:"میان‌برد",power:30,range:60,speed:82,accuracy:78},
 long:{name:"دوربرد",power:44,range:90,speed:91,accuracy:72},
 precision:{name:"دقیق",power:38,range:75,speed:88,accuracy:94},
 hypersonic:{name:"فوق‌سریع",power:55,range:100,speed:99,accuracy:86}
};

function missileLaunchPanel(){
 const types=Object.keys(missileData);

 openCustom(`
 <h2>🚀 مرکز فرمان موشکی</h2>

 <select class="fullInput" id="mType">
 ${types.map(x=>`
  <option value="${x}">
   ${missileData[x].name} — موجودی ${game.missiles[x]}
  </option>`).join("")}
 </select>

 <select class="fullInput" id="mTarget">
 ${countries.filter(c=>c.id!==game.country).map(c=>`
  <option value="${c.id}">${c.name}</option>`).join("")}
 </select>

 <button class="action red" onclick="launchMissile()">🚀 شبیه‌سازی پرتاب</button>

 <canvas id="missileCanvas"></canvas>

 <div id="missileResult"></div>
 `);
}

window.launchMissile=function(){
 const type=document.getElementById("mType").value;
 const id=document.getElementById("mTarget").value;
 const m=missileData[type];
 const enemy=targetCountry(id);

 if(!game.missiles[type]){
  msg("❌ این موشک در انبار وجود ندارد.");
  return;
 }

 game.missiles[type]--;

 const wind=rnd(-10,10);
 const guidance=game.intelligence+rnd(-12,12);
 const radar=enemy.tech*.35+enemy.power*.15;
 const trajectory=m.speed+guidance*.12-Math.abs(wind)*.5;

 const accuracy=clamp(
  m.accuracy+
  guidance*.07-
  radar*.12+
  trajectory*.04,
  5,99
 );

 const intercept=clamp(
  enemy.tech*.25+
  enemy.power*.08+
  game.airDefense*.18,
  4,78
 );

 const hit=Math.random()*100<accuracy;
 const intercepted=hit && Math.random()*100<intercept;

 const impact=Math.floor(m.power*(.65+accuracy/100*.35));

 drawMissile(intercepted);

 if(intercepted){
  document.getElementById("missileResult").innerHTML=`
   <div class="card">
    🛡 <b>موشک رهگیری شد.</b><br><br>
    دقت مسیر: ${Math.floor(accuracy)}%<br>
    احتمال رهگیری: ${Math.floor(intercept)}%
   </div>`;
  addNews(`🛡 موشک ${m.name} به سمت ${enemy.name} رهگیری شد.`);
 }else{
  enemy.industry=Math.max(10,enemy.industry-impact*.08);
  enemy.economy=Math.max(10,enemy.economy-impact*.04);
  enemy.stability=Math.max(10,enemy.stability-impact*.025);

  document.getElementById("missileResult").innerHTML=`
   <div class="card">
    🎯 <b>موشک به هدف رسید.</b><br><br>
    قدرت برخورد: ${impact}<br>
    دقت: ${Math.floor(accuracy)}%<br>
    آسیب زیرساختی: ${Math.floor(impact*.8)}
   </div>`;

  addNews(`🎯 حمله موشکی شبیه‌سازی‌شده علیه ${enemy.name} به هدف رسید.`);
 }

 game.readiness-=1;
 save();
 updateHeader();
};

function drawMissile(intercepted){
 const c=document.getElementById("missileCanvas");
 if(!c)return;

 const ctx=c.getContext("2d");
 const w=c.width=c.clientWidth*2;
 const h=c.height=190*2;

 ctx.scale(2,2);

 let x=20,y=150;
 const tx=w/2/2+120;
 const ty=35;

 function frame(){
  ctx.clearRect(0,0,w/2,h/2);

  ctx.beginPath();
  ctx.moveTo(20,150);
  ctx.quadraticCurveTo(130,20,tx,ty);
  ctx.strokeStyle="#3f91bd";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x,y,5,0,Math.PI*2);
  ctx.fillStyle="#fff";
  ctx.fill();

  x+=4;
  y-=3.8;

  if(x<tx && !intercepted){
   requestAnimationFrame(frame);
  }else{
   ctx.beginPath();
   ctx.arc(tx,ty,14,0,Math.PI*2);
   ctx.strokeStyle=intercepted?"#ff687d":"#62e29b";
   ctx.stroke();
  }
 }
 frame();
}

/* =========================================================
   CHART

function drawChart(){
 const c=document.getElementById("chart");
 if(!c)return;

 const ctx=c.getContext("2d");
 const w=c.width=c.clientWidth*2;
 const h=c.height=380;

 ctx.scale(2,2);
 const W=w/2,H=h/2;

 ctx.strokeStyle="#2b566e";
 ctx.lineWidth=1;

 for(let i=1;i<5;i++){
  ctx.beginPath();
  ctx.moveTo(0,i*H/5);
  ctx.lineTo(W,i*H/5);
  ctx.stroke();
 }

 ctx.beginPath();

 for(let i=0;i<30;i++){
  const x=i*(W/29);
  const y=H-((game.gdp/3000)*H*.7)-Math.sin(i*.5)*10;
  if(i===0)ctx.moveTo(x,y);
  else ctx.lineTo(x,y);
 }

 ctx.strokeStyle="#55c8ef";
 ctx.lineWidth=3;
 ctx.stroke();
}

/* =========================================================
   GAME ENGINE
========================================================= */

function economyTick(){
 game.turn++;

 const taxEffect=(game.tax-15)*.015;
 const inflationPressure=
  game.growth*.035+
  taxEffect+
  (game.money>game.gdp*5?.04:0)-
  game.interest*.025-
  game.production*.0004;

 game.inflation+=inflationPressure;

 game.gdp+=game.gdp*
  (game.growth/100)*.04;

 game.gdp-=game.gdp*
  Math.max(0,game.inflation-12)/10000;

 game.production+=
  game.infrastructure*.002+
  game.innovation*.001-
  Math.max(0,game.inflation-20)*.015;

 game.employment+=
  game.production*.0003-
  Math.max(0,game.inflation-15)*.01;

 game.approval+=
  (game.employment-85)*.003-
  Math.max(0,game.inflation-12)*.006-
  game.warWeariness*.001;

 game.money+=
  game.gdp*.003-
  game.debt*game.interest/10000;

 game.population+=
  (game.approval+game.health+game.food)/30000;

 game.energy-=game.population*.008;
 game.food-=game.population*.006;

 game.innovation+=game.education*.0008;
 game.cyber+=game.innovation*.0002;

 game.warWeariness-=.25;

 /* بازار */
 game.market.oil=clamp(game.market.oil+rnd(-3,3),20,180);
 game.market.food=clamp(game.market.food+rnd(-2,2),20,150);
 game.market.steel=clamp(game.market.steel+rnd(-3,3),20,160);
 game.market.tech=clamp(game.market.tech+rnd(-4,4),50,220);

 /* رویداد */
 if(Math.random()<.22)randomEvent();

 clampAll();

 if(game.turn%3===0){
  aiTick();
 }

 if(game.turn%5===0){
  addNews("🌐 بازار جهانی وارد یک چرخه جدید شد.");
 }

 save();
 updateHeader();

 if(window.currentPage==="home")homePage(document.getElementById("page"));
}

function aiTick(){
 countries.forEach(c=>{
  if(c.id===game.country)return;

  c.economy=clamp(c.economy+rnd(-2,3),10,120);
  c.industry=clamp(c.industry+rnd(-1,3),10,120);
  c.tech=clamp(c.tech+rnd(0,2),10,120);
  c.stability=clamp(c.stability+rnd(-2,2),5,100);

  if(c.aggression>70 && Math.random()<.15){
   addNews(`⚠️ ${c.name} فعالیت نظامی خود را افزایش داد.`);
  }
 }
}

function randomEvent(){
 const events=[
  ()=>{
   const x=rnd(200,700);
   game.money+=x;
   game.tradePower+=2;
   return `📦 صادرات افزایش یافت و ${money(x)} درآمد ایجاد شد.`;
  },
  ()=>{
   game.inflation+=rnd(1,3);
   return "📈 شوک قیمتی جهانی تورم را افزایش داد.";
  },
  ()=>{
   game.approval+=rnd(2,5);
   return "❤️ یک برنامه اجتماعی محبوبیت دولت را افزایش داد.";
  },
  ()=>{
   game.production-=rnd(2,6);
   game.energy-=rnd(3,8);
   return "⚡ اختلال انرژی باعث کاهش تولید شد.";
  },
  ()=>{
   game.innovation+=rnd(2,5);
   game.technology+=rnd(1,3);
   return "🔬 پژوهشگران کشور به موفقیت علمی رسیدند.";
  },
  ()=>{
   game.corruption+=rnd(1,4);
   game.trust-=rnd(1,3);
   return "⚠️ یک رسوایی اداری اعتماد عمومی را کاهش داد.";
  },
  ()=>{
   game.food+=rnd(5,12);
   return "🌾 برداشت کشاورزی بسیار خوب بود.";
  },
  ()=>{
   game.infrastructure+=rnd(1,4);
   game.production+=rnd(2,5);
   return "🏗 پروژه‌های عمرانی پیشرفت کردند.";
  }
 ];

 addNews(events[rnd(0,events.length-1)]());
}

/* =========================================================
   CLAMP
========================================================= */

function clampAll(){
 game.approval=clamp(game.approval);
 game.stability=clamp(game.stability);
 game.trust=clamp(game.trust);
 game.education=clamp(game.education);
 game.health=clamp(game.health);
 game.infrastructure=clamp(game.infrastructure);
 game.innovation=clamp(game.innovation);
 game.technology=clamp(game.technology);
 game.cyber=clamp(game.cyber);
 game.intelligence=clamp(game.intelligence);
 game.energy=clamp(game.energy);
 game.water=clamp(game.water);
 game.food=clamp(game.food);
 game.pollution=clamp(game.pollution);
 game.morale=clamp(game.morale);
 game.readiness=clamp(game.readiness);
 game.logistics=clamp(game.logistics);
 game.warWeariness=clamp(game.warWeariness);
 game.employment=clamp(game.employment);
 game.inflation=Math.max(-5,Math.min(100,game.inflation));
 game.money=Math.max(0,game.money);
 game.gdp=Math.max(100,game.gdp);
 game.production=Math.max(10,game.production);
}
