<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Empire Horizon</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#07131d;
 color:#fff;
 font-family:Tahoma,Arial,sans-serif;
}

button,input,select{
 font-family:inherit;
}

button{
 cursor:pointer;
}

#app{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
}

/* =========================
 TOP
========================= */

.topbar{
 height:64px;
 flex-shrink:0;
 background:#091b28;
 border-bottom:1px solid #29485b;
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:5px;
 padding:6px;
}

.stat{
 background:#102b3d;
 border:1px solid #294b5e;
 border-radius:7px;
 text-align:center;
 padding:5px 2px;
 font-size:8px;
}

.stat b{
 display:block;
 margin-top:4px;
 font-size:11px;
}

/* =========================
 MAP
========================= */

#mapArea{
 position:relative;
 flex:1;
 min-height:0;
 overflow:hidden;
 background:#b8dced;
}

#map{
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
 cursor:grab;
}

.country{
 stroke:#273b45;
 stroke-width:.6;
 vector-effect:non-scaling-stroke;
 cursor:pointer;
}

.country:hover{
 filter:brightness(1.15);
}

.country.selected{
 stroke:white;
 stroke-width:2;
}

.label{
 pointer-events:none;
 fill:#172b35;
 font-size:8px;
 font-weight:bold;
 text-anchor:middle;
 paint-order:stroke;
 stroke:white;
 stroke-width:2px;
}

/* =========================
 MAP CONTROLS
========================= */

.mapControls{
 position:absolute;
 left:8px;
 top:8px;
 display:flex;
 flex-direction:column;
 gap:5px;
}

.mapControls button{
 width:38px;
 height:38px;
 border:1px solid #35566b;
 border-radius:7px;
 background:#082131eF;
 color:white;
 font-size:18px;
}

/* =========================
 COUNTRY PANEL
========================= */

#countryInfo{
 position:absolute;
 left:8px;
 bottom:8px;
 width:245px;
 max-width:calc(100% - 16px);
 background:#091c2aF2;
 border:1px solid #36566a;
 border-radius:10px;
 padding:10px;
 display:none;
 z-index:5;
}

#countryInfo h3{
 margin:0 0 8px;
 font-size:15px;
}

.infoRow{
 background:#102a3b;
 border-radius:6px;
 padding:7px;
 margin-top:5px;
 font-size:10px;
 display:flex;
 justify-content:space-between;
}

/* =========================
 BOTTOM
========================= */

.bottom{
 height:58px;
 flex-shrink:0;
 background:#081722;
 border-top:1px solid #294658;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;
 padding:6px;
}

.bottom button{
 border:1px solid #2b4c5e;
 border-radius:7px;
 background:#102b3d;
 color:white;
 font-size:9px;
}

/* =========================
 MODAL
========================= */

#modal{
 position:fixed;
 inset:0;
 background:#000b;
 z-index:50;
 display:none;
 align-items:center;
 justify-content:center;
 padding:12px;
}

.modalBox{
 width:min(680px,100%);
 max-height:90vh;
 overflow:auto;
 background:#091c2a;
 border:1px solid #35576b;
 border-radius:11px;
 padding:13px;
}

.modalHeader{
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #254355;
 padding-bottom:8px;
 margin-bottom:9px;
}

.modalHeader h2{
 margin:0;
 font-size:17px;
}

.close{
 background:#4b222a;
 border:0;
 color:white;
 border-radius:6px;
 padding:7px 10px;
}

.card{
 background:#102a3b;
 border:1px solid #27495c;
 border-radius:7px;
 padding:9px;
 margin:6px 0;
}

.cardTitle{
 font-size:12px;
 font-weight:bold;
 margin-bottom:6px;
}

.cardText{
 color:#b9cbd4;
 font-size:10px;
 line-height:1.8;
}

.actions{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:6px;
 margin-top:8px;
}

.actions button{
 padding:10px 5px;
 border-radius:7px;
 border:1px solid #34566a;
 background:#123249;
 color:white;
 font-size:10px;
}

input,select{
 width:100%;
 padding:9px;
 background:#0b2233;
 border:1px solid #35566a;
 color:white;
 border-radius:7px;
 outline:none;
 margin-top:5px;
}

/* =========================
 DIPLOMACY STATUS
========================= */

.good{
 color:#79e6a2;
}

.bad{
 color:#ff9696;
}

.neutral{
 color:#e5d681;
}

/* =========================
 RESPONSIVE
========================= */

@media(max-width:700px){

 .topbar{
  grid-template-columns:repeat(3,1fr);
  height:82px;
 }

 .bottom{
  height:55px;
 }

}

@media(max-width:430px){

 .stat{
  font-size:7px;
 }

 .stat b{
  font-size:10px;
 }

 .bottom button{
  font-size:8px;
 }

}
</style>
</head>

</div>

 <div class="modalBox">

   </h2>

   <button

<script>

/* =========================================================
 MAP DATA
========================================================= */

const MAP_URL =
"https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_0_countries.geojson";


/* =========================================================
 PLAYER
========================================================= */

const player={

 country:"ایران",

 money:50000,

 inflation:4,

 production:100,

 resources:100,

 power:25,

 day:1,

 sanctions:[],

 treaties:[],

 relations:{}

};


/* =========================================================
 COUNTRY AI
========================================================= */

const AI={};


/*
 ویژگی‌های اولیه کشورهای مهم
*/

const countryProfiles={

 "Iran":{
  economy:450,
  power:70,
  inflation:18,
  stability:68,
  oil:true,
  industry:62,
  diplomacy:55
 },

 "Iraq":{
  economy:250,
  power:38,
  inflation:8,
  stability:58,
  oil:true,
  industry:35,
  diplomacy:52
 },

 "Turkey":{
  economy:1100,
  power:65,
  inflation:24,
  stability:65,
  oil:false,
  industry:70,
  diplomacy:68
 },

 "United States of America":{
  economy:28000,
  power:100,
  inflation:3,
  stability:82,
  oil:true,
  industry:95,
  diplomacy:80
 },

 "China":{
  economy:18000,
  power:96,
  inflation:2,
  stability:88,
  oil:false,
  industry:98,
  diplomacy:74
 },

 "Russia":{
  economy:2000,
  power:91,
  inflation:9,
  stability:70,
  oil:true,
  industry:82,
  diplomacy:62
 },

 "Germany":{
  economy:4500,
  power:55,
  inflation:3,
  stability:84,
  oil:false,
  industry:90,
  diplomacy:78
 },

 "France":{
  economy:3100,
  power:58,
  inflation:3,
  stability:82,
  oil:false,
  industry:80,
  diplomacy:79
 },

 "India":{
  economy:3900,
  power:73,
  inflation:5,
  stability:72,
  oil:false,
  industry:78,
  diplomacy:70
 },

 "Saudi Arabia":{
  economy:1100,
  power:54,
  inflation:2,
  stability:75,
  oil:true,
  industry:55,
  diplomacy:68
 },

 "United Kingdom":{
  economy:3600,
  power:57,
  inflation:3,
  stability:84,
  oil:false,
  industry:76,
  diplomacy:82
 },

 "Japan":{
  economy:4200,
  power:61,
  inflation:2,
  stability:90,
  oil:false,
  industry:92,
  diplomacy:83

 }

};


/* =========================================================
 COUNTRY NAME NORMALIZATION
========================================================= */

function profileFor(name){

 let p=countryProfiles[name];

 if(p)
  return {...p};

 return {

  economy:
   100+
   Math.random()*1500,

  power:
   20+
   Math.random()*70,

  inflation:
   2+
   Math.random()*15,

  stability:
   50+
   Math.random()*40,

  oil:
   Math.random()>.55,

  industry:
   30+
   Math.random()*60,

  diplomacy:
   40+
   Math.random()*50

 };

}


/* =========================================================
 CREATE AI COUNTRIES
========================================================= */

function createAI(name){

 if(!AI[name]){

  const p=profileFor(name);

  AI[name]={

   name:name,

   economy:p.economy,

   power:p.power,

   inflation:p.inflation,

   stability:p.stability,

   oil:p.oil,

   industry:p.industry,

   diplomacy:p.diplomacy,

   relation:
    name==="Iran"
    ?100
    :
    25+
    Math.random()*45,

   trust:
    30+
    Math.random()*50,

   aggressive:
    15+
    Math.random()*70,

   tradeNeed:
    20+
    Math.random()*80,

   sanctions:[],

   treaties:[]

  };

 }

 return AI[name];

}


/* =========================================================
 GEO MAP
========================================================= */

const svg=document.getElementById("map");

const world=document.getElementById("world");

const labels=document.getElementById("labels");


const colors=[

 "#4e79a7",
 "#59a14f",
 "#e15759",
 "#f28e2b",
 "#b07aa1",
 "#76b7b2",
 "#edc948",
 "#ff9da7",
 "#9c755f",
 "#6b7c93",
 "#3d8b5a",
 "#a84d4d",
 "#7c5aa6",
 "#c47d22",
 "#4c9a9a",
 "#8c6d31",
 "#6b7c93",
 "#a05a5a",
 "#527a5c",
 "#4176a8"

];


function project(lon,lat){

 const x=
  (lon+180)/360*1200;

 let r=
  lat*Math.PI/180;

 let m=
  Math.log(
   Math.tan(
    Math.PI/4+r/2
   )
  );

 let y=
  325-(m/4)*260;

 return [x,y];

}


function ringPath(ring){

 let d="";

 for(let i=0;i<ring.length;i++){

  const p=
   project(
    ring[i][0],
    ring[i][1]
   );

  d+=
   i===0
   ?"M"
   :"L";

  d+=
   p[0].toFixed(2)+
   " "+
   p[1].toFixed(2);

 }

 return d+"Z";

}


function geometryPath(geometry){

 let d="";

 if(
  geometry.type==="Polygon"
 ){

  geometry.coordinates.forEach(
   ring=>{
    d+=ringPath(ring);
   }
  );

 }

 if(
  geometry.type==="MultiPolygon"
 ){

  geometry.coordinates.forEach(
   polygon=>{

    polygon.forEach(
     ring=>{
      d+=ringPath(ring);
     }
    );

   }
  );

 }

 return d;

}


function centerOfFeature(feature){

 let arr=[];

 function collect(o){

  if(
   typeof o[0]==="number"
  ){

   arr.push(o);

   return;

  }

  o.forEach(
   collect
  );

 }

 collect(
  feature.geometry.coordinates
 );

 if(!arr.length)
  return [600,325];

 let lon=0;
 let lat=0;

 const n=
  Math.min(
   arr.length,
   250
  );

 for(
  let i=0;
  i<n;
  i++
 ){

  lon+=arr[i][0];

  lat+=arr[i][1];

 }

 return project(
  lon/n,
  lat/n
 );

}


/* =========================================================
 DRAW MAP
========================================================= */

async function loadMap(){

 try{

  const res=
   await fetch(
    MAP_URL,
    {
     cache:"force-cache"
    }
   );

  const data=
   await res.json();

  data.features.forEach(
   (feature,index)=>{

    if(!feature.geometry)
     return;

    const name=
     feature.properties.NAME ||
     feature.properties.ADMIN ||
     "Unknown";


    createAI(name);


    const path=
     document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
     );


    path.setAttribute(
     "d",
     geometryPath(
      feature.geometry
     )
    );


    path.classList.add(
     "country"
    );


    path.style.fill=
     colors[
      index%colors.length
     ];


    path.dataset.name=
     name;


    path.addEventListener(
     "click",
     e=>{

      e.stopPropagation();

      selectCountry(
       name,
       path
      );

     }
    );


    world.appendChild(path);


    const center=
     centerOfFeature(
      feature
     );


    /*
      نام کشورها
    */

    const label=
     document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
     );


    label.setAttribute(
     "x",
     center[0]
    );

    label.setAttribute(
     "y",
     center[1]
    );


    label.classList.add(
     "label"
    );


    label.textContent=
     name;


    labels.appendChild(
     label
    );

   }
  );

 }catch(err){

  console.log(err);

 }

}


/* =========================================================
 SELECT COUNTRY
========================================================= */

let selectedPath=null;

let selectedCountry=null;


function selectCountry(name,path){

 if(selectedPath)
  selectedPath.classList.remove(
   "selected"
  );

 selectedPath=path;

 selectedCountry=name;

 path.classList.add(
  "selected"
 );


 const ai=
  createAI(name);


 document
 .getElementById(
  "countryName"
 )
 .textContent=
 "🌍 "+name;


 document
 .getElementById(
  "countryEconomy"
 )
 .textContent=
 "$"+
 Math.round(ai.economy)+
 "B";


 document
 .getElementById(
  "countryInflation"
 )
 .textContent=
 ai.inflation.toFixed(1)+"%";


 document
 .getElementById(
  "countryRelation"
 )
 .textContent=
 Math.round(ai.relation)+
 "/100";


 document
 .getElementById(
  "countryPower"
 )
 .textContent=
 Math.round(ai.power);


 document
 .getElementById(
  "countryInfo"
 )
 .style.display=
 "block";

}


/* =========================================================
 MODAL
========================================================= */

function showModal(title,content){

 document
 .getElementById(
  "modalTitle"
 )
 .textContent=title;

 document
 .getElementById(
  "modalContent"
 )
 .innerHTML=content;

 document
 .getElementById(
  "modal"
 )
 .style.display="flex";

}


function closeModal(){

 document
 .getElementById(
  "modal"
 )
 .style.display="none";

}


/* =========================================================
 DIPLOMACY
========================================================= */

function openDiplomacy(){

 const list=
  Object.values(AI)
  .filter(
   x=>x.name!==player.country
  )
  .sort(
   (a,b)=>
    b.relation-a.relation
  );


 let html="";

 list.forEach(
  ai=>{

   let cls=
    ai.relation>=65
    ?"good"
    :
    ai.relation<=35
    ?"bad"
    :"neutral";


   html+=`

    <div class="card">

     <div class="cardTitle">
      🌍 ${ai.name}
     </div>

     <div class="cardText">

      رابطه:
      <span class="${cls}">
       ${Math.round(ai.relation)}/100
      </span>
      <br>

      اعتماد:
      ${Math.round(ai.trust)}/100
      <br>

      اقتصاد:
      ${Math.round(ai.economy)} میلیارد دلار
      <br>

      تورم:
      ${ai.inflation.toFixed(1)}%

     </div>

     <div class="actions">

      <button
       onclick="sendDiplomaticOffer('${escapeName(ai.name)}')">
       🤝 پیشنهاد همکاری
      </button>

      <button
       onclick="proposeTreaty('${escapeName(ai.name)}')">
       📜 قرارداد
      </button>

      <button
       onclick="openCountryTrade('${escapeName(ai.name)}')">
       🚢 معامله
      </button>

      <button
       onclick="talkToAI('${escapeName(ai.name)}')">
       🧠 مذاکره
      </button>

     </div>

    </div>

   `;

  }
 );


 showModal(
  "🤝 مرکز دیپلماسی",
  html
 );

}


/* =========================================================
 ESCAPE
========================================================= */

function escapeName(name){

 return name
  .replaceAll(
   "'",
   "\\'"
  );

}


/* =========================================================
 AI DIPLOMACY
========================================================= */

function sendDiplomaticOffer(name){

 const ai=createAI(name);

 const chance=
  ai.relation+
  ai.trust*.35+
  player.power*.1-
  ai.aggressive*.15;


 if(
  chance+
  Math.random()*40
  >85
 ){

  ai.relation=
   Math.min(
    100,
    ai.relation+8
   );

  ai.trust=
   Math.min(
    100,
    ai.trust+6
   );

  alert(
   "✅ "+
   name+
   " پیشنهاد همکاری را پذیرفت."
  );

 }else{

  ai.relation=
   Math.max(
    0,
    ai.relation-2
   );

  alert(
   "❌ "+
   name+
   " پیشنهاد همکاری را رد کرد."
  );

 }

 openDiplomacy();

}


/* =========================================================
 TREATY
========================================================= */

function proposeTreaty(name){

 const ai=createAI(name);

 const chance=
  ai.relation+
  ai.trust+
  player.power*.2-
  ai.aggressive*.2;


 if(
  chance+
  Math.random()*50
  >115
 ){

  ai.trust=
   Math.min(
    100,
    ai.trust+10
   );

  ai.relation=
   Math.min(
    100,
    ai.relation+12
   );

  player.treaties.push(name);

  alert(
   "📜 قرارداد با "+
   name+
   " امضا شد."
  );

 }else{

  ai.relation=
   Math.max(
    0,
    ai.relation-3
   );

  alert(
   "❌ "+
   name+
   " قرارداد را نپذیرفت."
  );

 }

 openDiplomacy();

}


/* =========================================================
 AI TALK
========================================================= */

function talkToAI(name){

 const ai=createAI(name);

 let attitude="متحدانه";

 if(ai.relation<40)
  attitude="سرد";

 if(ai.relation<25)
  attitude="خصمانه";


 let message="";


 if(ai.tradeNeed>70){

  message=
   "ما به تجارت و منابع نیاز داریم. "+
   "اگر پیشنهاد اقتصادی مناسبی بدهید، مذاکره می‌کنیم.";

 }else if(ai.relation>70){

  message=
   "روابط ما خوب است. آماده همکاری گسترده هستیم.";

 }else if(ai.relation<30){

  message=
   "روابط فعلی ما مناسب نیست. "+
   "ابتدا باید اعتماد میان دو کشور افزایش پیدا کند.";

 }else{

  message=
   "ما آماده بررسی پیشنهادهای شما هستیم.";

 }


 showModal(
  "🧠 مذاکره با "+name,
  `

   <div class="card">

    <div class="cardTitle">
     وضعیت: ${attitude}
    </div>

    <div class="cardText">
     ${message}
    </div>

   </div>

   <div class="actions">

    <button
     onclick="sendDiplomaticOffer('${escapeName(name)}')">
     پیشنهاد همکاری
    </button>

    <button
     onclick="openCountryTrade('${escapeName(name)}')">
     پیشنهاد معامله
    </button>

   </div>

  `
 );

}

/* =========================================================
 TRADE AI
========================================================= */

function submitTrade(name){

 const ai=createAI(name);

 const amount=
  Math.max(
   1,
   Number(
    document.getElementById(
     "amount"
    ).value
   )
  );


 const sell=
  document.getElementById(
   "sell"
  ).value;


 const buy=
  document.getElementById(
   "buy"
  ).value;


 let score=
  ai.relation*.45+
  ai.trust*.3+
  ai.tradeNeed*.4;


 if(
  sell===buy
 )
  score-=35;


 if(
  ai.tradeNeed>60
 )
  score+=10;


 score+=
  Math.random()*35;


 if(score>85){

  ai.relation=
   Math.min(
    100,
    ai.relation+3
   );

  ai.trust=
   Math.min(
    100,
    ai.trust+2
   );

  player.resources=
   Math.max(
    0,
    player.resources-amount
   );


  player.money+=
   amount*80;


  alert(
   "✅ قرارداد پذیرفته شد.\n\n"+
   name+
   " معامله را قبول کرد."
  );

 }else{

  ai.relation=
   Math.max(
    0,
    ai.relation-1
   );

  alert(
   "❌ قرارداد رد شد.\n\n"+
   name+
   " پیشنهاد تجاری را نپذیرفت."
  );

 }

 updateUI();

 openTrade();

}

/* =========================================================
 SANCTION
========================================================= */

function sanction(name){

 const ai=createAI(name);

 ai.relation=
  Math.max(
   0,
   ai.relation-18
  );

 ai.economy=
  Math.max(
   20,
   ai.economy*.97
  );

 ai.inflation+=
  1.2;

 player.sanctions.push(name);

 alert(
  "🚫 تحریم اقتصادی علیه "+
  name+
  " اعمال شد."
 );

 updateUI();

 openSanctions();

}


/* =========================================================
 OIL SANCTION
========================================================= */

function oilSanction(name){

 const ai=createAI(name);

 if(!ai.oil){

  alert(
   name+
   " وابستگی نفتی زیادی ندارد."
  );

  return;

 }


 ai.relation=
  Math.max(
   0,
   ai.relation-24
  );

 ai.economy=
  Math.max(
   20,
   ai.economy*.94
  );

 ai.inflation+=
  2.3;

 alert(
  "🛢 تحریم نفتی علیه "+
  name+
  " اعمال شد."
 );

 updateUI();

 openSanctions();

}


/* =========================================================
 AI COUNTER SANCTIONS
========================================================= */

function AIResponse(){

 Object.values(AI)
 .forEach(
  ai=>{

   if(
    ai.name===player.country
   )
    return;


   /*
    اگر روابط خیلی پایین شود،
    کشور ممکن است علیه بازیکن تحریم بگذارد.
   */

   if(
    ai.relation<22 &&
    Math.random()<.12
   ){

    if(
     !player.sanctions.includes(
      ai.name
     )
    ){

     ai.trust=
      Math.max(
       0,
       ai.trust-10
      );

     player.inflation+=.35;

     alert(
      "⚠️ "+
      ai.name+
      " در واکنش به کاهش روابط، "+
      "تحریم اقتصادی علیه شما اعمال کرد."
     );

    }

   }


   /*
    رشد/افت اقتصاد AI
   */

   const economicChange=
    (
     Math.random()-.48
    )*.8;


   ai.economy=
    Math.max(
     10,
     ai.economy+
     economicChange
    );


   /*
    تورم AI
   */

   if(
    ai.economy<100
   )
    ai.inflation+=.08;

   else
    ai.inflation-=.03;


   ai.inflation=
    Math.max(
     .5,
     Math.min(
      60,
      ai.inflation
     )
    );


   /*
    روابط به مرور تغییر می‌کند
   */

   if(
    ai.relation>50
   ){

    ai.relation+=
     (Math.random()-.5)*.8;

   }else{

    ai.relation+=
     (Math.random()-.5)*1.2;

   }


   ai.relation=
    Math.max(
     0,
     Math.min(
      100,
      ai.relation
     )
    );

  }
 );

}

/* =========================================================
 INVESTMENT
========================================================= */

function invest(){

 const cost=
  10000+
  player.inflation*300;


 if(
  player.money<cost
 ){

  alert(
   "پول کافی نیست."
  );

  return;

 }


 player.money-=cost;

 player.production+=8;

 player.inflation+=.15;

 updateUI();

 openEconomy();

}


/* =========================================================
 ECONOMIC REFORM
========================================================= */

function economicReform(){

 const cost=
  7000+
  player.inflation*250;


 if(
  player.money<cost
 ){

  alert(
   "بودجه اصلاح اقتصادی کافی نیست."
  );

  return;

 }


 player.money-=cost;

 player.inflation=
  Math.max(
   .5,
   player.inflation-1.2
  );

 player.production+=2;

 updateUI();

 openEconomy();

}

/* =========================================================
 TIME + ECONOMY SIMULATION
========================================================= */

setInterval(
 ()=>{

  player.day++;


  /*
   درآمد سخت
  */

  let income=
   player.production*
   .55;


  /*
   تورم درآمد واقعی را کم می‌کند
  */

  income*=
   Math.max(
    .2,
    1-
    player.inflation/100
   );


  /*
   هزینه اداره کشور
  */

  const maintenance=
   player.power*
   1.8;


  player.money+=
   income-
   maintenance;


  /*
   کسری بودجه
  */

  if(
   player.money<5000
  ){

   player.inflation+=
    .18;

  }


  /*
   اقتصاد سالم
  */

  if(
   player.money>100000 &&
   player.inflation>2
  ){

   player.inflation-=
    .025;

  }


  /*
   تولید زیاد بدون زیرساخت
   باعث تورم می‌شود
  */

  if(
   player.production>180
  ){

   player.inflation+=
    .035;

  }


  /*
   منابع
  */

  player.resources+=
   player.production*.008;


  /*
   سقف‌ها
  */

  player.inflation=
   Math.max(
    .5,
    Math.min(
     80,
     player.inflation
    )
   );


  /*
   AI
  */

  AIResponse();


  updateUI();

 },
 3000
);

/* =========================================================
 MAP MOVEMENT
========================================================= */

let scale=1;

let offsetX=0;

let offsetY=0;


function applyMap(){

 const transform=
 `
 translate(${offsetX} ${offsetY})
 scale(${scale})
 `;

 world.setAttribute(
  "transform",
  transform
 );

 labels.setAttribute(
  "transform",
  transform
 );

}


function zoomMap(value){

 scale*=value;

 scale=
  Math.max(
   1,
   Math.min(
    5,
    scale
   )
  );

 applyMap();

}


function resetMap(){

 scale=1;

 offsetX=0;

 offsetY=0;

 applyMap();

}


/* =========================================================
 DRAG MAP
========================================================= */

let dragging=false;

let lastX=0;

let lastY=0;


svg.addEventListener(
 "pointerdown",
 e=>{

  dragging=true;

  lastX=e.clientX;

  lastY=e.clientY;

  svg.setPointerCapture(
   e.pointerId
  );

 }
);


svg.addEventListener(
 "pointermove",
 e=>{

  if(!dragging)
   return;


  const dx=
   e.clientX-lastX;

  const dy=
   e.clientY-lastY;


  lastX=e.clientX;

  lastY=e.clientY;


  offsetX+=
   dx/svg.clientWidth*
   1200;

  offsetY+=
   dy/svg.clientHeight*
   650;


  applyMap();

 }
);


svg.addEventListener(
 "pointerup",
 e=>{

  dragging=false;

  try{

   svg.releasePointerCapture(
    e.pointerId
   );

  }catch(err){}

 }
);
