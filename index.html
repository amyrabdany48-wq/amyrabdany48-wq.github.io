<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>World Map</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:#08131d;
    color:white;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* -----------------------------
   نوار بالا
----------------------------- */

.topbar{
    height:64px;
    flex-shrink:0;
    background:#0a1b28;
    border-bottom:1px solid #29475b;
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px;
    z-index:10;
}

.info{
    flex:1;
    min-width:0;
    background:#102a3b;
    border:1px solid #294a5e;
    border-radius:7px;
    padding:5px;
    text-align:center;
    font-size:9px;
}

.info b{
    display:block;
    margin-top:3px;
    font-size:11px;
}

/* -----------------------------
   بخش نقشه
----------------------------- */

#mapArea{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:#b8dced;
}

#map{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    cursor:grab;
}

#map.dragging{
    cursor:grabbing;
}

/* آب */

.ocean{
    fill:#b8dced;
}

/* کشور */

.country{
    stroke:#263c47;
    stroke-width:.55;
    vector-effect:non-scaling-stroke;
    cursor:pointer;
    transition:filter .1s;
}

.country:hover{
    filter:brightness(1.15);
}

/* کشور انتخاب شده */

.country.selected{
    stroke:#ffffff;
    stroke-width:2;
    vector-effect:non-scaling-stroke;
}

/* نام کشور */

.label{
    pointer-events:none;
    user-select:none;
    fill:#182b34;
    font-size:9px;
    font-weight:bold;
    text-anchor:middle;
    paint-order:stroke;
    stroke:#ffffff;
    stroke-width:2px;
    stroke-opacity:.55;
}

/* -----------------------------
   کنترل نقشه
----------------------------- */

.mapButtons{
    position:absolute;
    left:8px;
    top:8px;
    display:flex;
    flex-direction:column;
    gap:5px;
    z-index:5;
}

.mapButtons button{
    width:38px;
    height:38px;
    border-radius:7px;
    border:1px solid #395b6d;
    background:#092131e8;
    color:white;
    font-size:18px;
}

.mapButtons button:active{
    transform:scale(.94);
}

/* -----------------------------
   پنل کشور
----------------------------- */

#countryPanel{
    position:absolute;
    left:10px;
    bottom:10px;
    width:240px;
    max-width:calc(100% - 20px);
    background:#091c2aeF;
    border:1px solid #36566a;
    border-radius:10px;
    padding:10px;
    display:none;
    z-index:6;
    box-shadow:0 8px 25px #0008;
}

#countryPanel h3{
    margin:0 0 8px;
    font-size:15px;
}

.countryRow{
    display:flex;
    justify-content:space-between;
    background:#102b3c;
    border-radius:6px;
    padding:7px;
    margin-top:5px;
    font-size:10px;
}

/* -----------------------------
   پایین
----------------------------- */

.bottom{
    height:55px;
    flex-shrink:0;
    background:#081722;
    border-top:1px solid #294456;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    padding:6px;
}

.bottom button{
    border:1px solid #294a5d;
    border-radius:7px;
    background:#102b3d;
    color:white;
    font-size:10px;
}

.bottom button:active{
    transform:scale(.97);
}

/* -----------------------------
   لودینگ
----------------------------- */

#loading{
    position:absolute;
    inset:0;
    z-index:30;
    background:#091721;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
}

.loader{
    width:35px;
    height:35px;
    border:3px solid #345365;
    border-top-color:#5bd5ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#loadingText{
    font-size:12px;
    color:#b7ccd8;
}

/* -----------------------------
   صفحه خطا
----------------------------- */

#error{
    display:none;
    position:absolute;
    inset:0;
    z-index:40;
    background:#091721;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

#error div{
    max-width:400px;
}

#error h2{
    color:#ffb1b1;
}

#error p{
    font-size:12px;
    color:#b9c9d1;
    line-height:1.8;
}

@media(max-width:600px){

    .topbar{
        height:58px;
    }

    .info{
        font-size:8px;
    }

    .info b{
        font-size:10px;
    }

    .bottom{
        height:52px;
    }

    #countryPanel{
        width:220px;
    }

}

</style>
</head>

<body>

<div id="app">

    <!-- ==========================
         اطلاعات بالا
    =========================== -->

    <div class="topbar">

        <div class="info">
            💰 پول
            <b id="money">50,000</b>
        </div>

        <div class="info">
            🏭 تولید
            <b id="production">100</b>
        </div>

        <div class="info">
            📈 تورم
            <b id="inflation">4%</b>
        </div>

        <div class="info">
            📅 زمان
            <b id="date">روز 1</b>
        </div>

    </div>


    <!-- ==========================
         نقشه
    =========================== -->

    <div id="mapArea">

        <div id="loading">

            <div class="loader"></div>

            <div id="loadingText">
                در حال ساخت نقشه جهان...
            </div>

        </div>


        <div id="error">

            <div>

                <h2>نقشه بارگذاری نشد</h2>

                <p>
                    اتصال اینترنت را بررسی کن و دوباره صفحه را باز کن.
                </p>

                <button onclick="location.reload()">
                    تلاش دوباره
                </button>

            </div>

        </div>


        <svg
            id="map"
            viewBox="0 0 1200 650"
            preserveAspectRatio="xMidYMid meet">

            <rect
                class="ocean"
                x="0"
                y="0"
                width="1200"
                height="650">
            </rect>

            <g id="world"></g>

            <g id="labels"></g>

        </svg>


        <!-- کنترل -->

        <div class="mapButtons">

            <button id="zoomIn">+</button>

            <button id="zoomOut">−</button>

            <button id="reset">⌂</button>

        </div>


        <!-- اطلاعات کشور -->

        <div id="countryPanel">

            <h3 id="selectedName">
                کشور
            </h3>

            <div class="countryRow">
                <span>جمعیت</span>
                <b id="population">---</b>
            </div>

            <div class="countryRow">
                <span>اقتصاد</span>
                <b id="economy">---</b>
            </div>

            <div class="countryRow">
                <span>تورم</span>
                <b id="countryInflation">---</b>
            </div>

        </div>

    </div>


    <!-- ==========================
         پایین
    =========================== -->

    <div class="bottom">

        <button onclick="alert('بخش اقتصاد در نسخه بعدی')">
            💰 اقتصاد
        </button>

        <button onclick="alert('بخش کشورها در نسخه بعدی')">
            🌍 کشورها
        </button>

        <button onclick="alert('بخش دیپلماسی در نسخه بعدی')">
            🤝 دیپلماسی
        </button>

        <button onclick="alert('بخش مدیریت در نسخه بعدی')">
            ⚙️ مدیریت
        </button>

    </div>

</div>


<script>

/* =========================================================
   تنظیمات نقشه
========================================================= */

/*
 داده واقعی مرز کشورها.

 این فایل بر پایه Natural Earth است.
 نسخه 50m برای بازی سبک‌تر انتخاب شده.
*/

const GEO_URL =
"https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_0_countries.geojson";


/* =========================================================
   عناصر
========================================================= */

const svg =
    document.getElementById("map");

const world =
    document.getElementById("world");

const labels =
    document.getElementById("labels");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");


/* =========================================================
   رنگ کشورها
========================================================= */

const colors = [

"#4e79a7",
"#59a14f",
"#e15759",
"#f28e2b",
"#b07aa1",
"#76b7b2",
"#edc948",
"#ff9da7",
"#9c755f",
"#bab0ab",
"#2f6b8a",
"#3d8b5a",
"#a84d4d",
"#7c5aa6",
"#c47d22",
"#4c9a9a",
"#8c6d31",
"#6b7c93",
"#a05a5a",
"#527a5c"
];


/* =========================================================
   تبدیل طول و عرض جغرافیایی به صفحه
========================================================= */

function project(lon,lat){

    /*
       نمایش ساده Mercator

       طول جغرافیایی:
       -180 تا 180

       عرض جغرافیایی:
       حدود -85 تا 85
    */

    const x =
        (lon + 180) / 360 * 1200;


    let rad =
        lat * Math.PI / 180;


    let merc =
        Math.log(
            Math.tan(
                Math.PI / 4 + rad / 2
            )
        );


    const max =
        4.0;


    let y =
        325 -
        (merc / max) * 260;


    return [x,y];

}


/* =========================================================
   تبدیل GeoJSON به SVG Path
========================================================= */

function ringToPath(ring){

    let path="";

    for(
        let i=0;
        i<ring.length;
        i++
    ){

        const point =
            project(
                ring[i][0],
                ring[i][1]
            );


        if(i===0){

            path +=
                "M"+
                point[0].toFixed(2)+
                " "+
                point[1].toFixed(2);

        }else{

            path +=
                "L"+
                point[0].toFixed(2)+
                " "+
                point[1].toFixed(2);

        }

    }

    return path+"Z";

}


/* =========================================================
   Polygon
========================================================= */

function polygonToPath(polygon){

    let result="";

    for(
        let i=0;
        i<polygon.length;
        i++
    ){

        result +=
            ringToPath(
                polygon[i]
            );

    }

    return result;

}


/* =========================================================
   MultiPolygon
========================================================= */

function multiPolygonToPath(multi){

    let result="";

    for(
        let i=0;
        i<multi.length;
        i++
    ){

        result +=
            polygonToPath(
                multi[i]
            );

    }

    return result;

}


/* =========================================================
   مرکز تقریبی کشور
========================================================= */

function getCenter(feature){

    let coords =
        feature.geometry.coordinates;

    let points=[];


    function collect(obj){

        if(
            typeof obj[0] === "number"
        ){

            points.push(obj);

            return;

        }

        for(
            let i=0;
            i<obj.length;
            i++
        ){

            collect(obj[i]);

        }

    }

    collect(coords);


    if(points.length===0){

        return [600,325];

    }


    let lon=0;

    let lat=0;

    let count=
        Math.min(
            points.length,
            300
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        lon += points[i][0];

        lat += points[i][1];

    }


    lon/=count;

    lat/=count;


    return project(lon,lat);

}


/* =========================================================
   ساخت نقشه
========================================================= */

function drawMap(data){

    world.innerHTML="";

    labels.innerHTML="";


    const features =
        data.features || [];


    features.forEach(
        (feature,index)=>{

            if(
                !feature.geometry
            )
                return;


            const type =
                feature.geometry.type;


            let pathData="";


            if(
                type === "Polygon"
            ){

                pathData =
                    polygonToPath(
                        feature.geometry.coordinates
                    );

            }


            if(
                type === "MultiPolygon"
            ){

                pathData =
                    multiPolygonToPath(
                        feature.geometry.coordinates
                    );

            }


            if(!pathData)
                return;


            const path =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );


            path.setAttribute(
                "d",
                pathData
            );


            path.classList.add(
                "country"
            );


            const name =
                feature.properties &&
                (
                    feature.properties.NAME ||
                    feature.properties.name ||
                    feature.properties.ADMIN
                )
                ||
                "کشور";


            path.dataset.name=name;


            path.style.fill =
                colors[
                    index % colors.length
                ];


            path.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    selectCountry(
                        name,
                        path
                    );

                }
            );


            world.appendChild(path);


            /*
               فقط برای کشورهای بزرگ
               نام نمایش داده می‌شود.
            */

            const center =
                getCenter(feature);


            const label =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );


            label.setAttribute(
                "x",
                center[0]
            );


            label.setAttribute(
                "y",
                center[1]
            );


            label.classList.add(
                "label"
            );


            label.textContent=name;


            labels.appendChild(label);

        }
    );


    loading.style.display="none";

}


/* =========================================================
   انتخاب کشور
========================================================= */

let selectedPath=null;


function selectCountry(
    name,
    path
){

    if(selectedPath){

        selectedPath.classList.remove(
            "selected"
        );

    }


    selectedPath=path;


    path.classList.add(
        "selected"
    );


    document
    .getElementById("selectedName")
    .textContent=
        "🌍 "+name;


    /*
       اطلاعات نمونه برای فعلاً
    */

    const population =
        Math.floor(
            5+
            Math.random()*140
        );


    const economy =
        Math.floor(
            20+
            Math.random()*980
        );


    const inflation =
        (
            1+
            Math.random()*12
        ).toFixed(1);


    document
    .getElementById("population")
    .textContent=
        population+" میلیون";


    document
    .getElementById("economy")
    .textContent=
        economy+" میلیارد";


    document
    .getElementById("countryInflation")
    .textContent=
        inflation+"%";


    document
    .getElementById("countryPanel")
    .style.display="block";

}


/* =========================================================
   بارگذاری
========================================================= */

async function loadMap(){

    try{

        const response =
            await fetch(
                GEO_URL,
                {
                    cache:"force-cache"
                }
            );


        if(!response.ok){

            throw new Error(
                "Map download failed"
            );

        }


        const data =
            await response.json();


        drawMap(data);


    }catch(e){

        console.error(e);

        loading.style.display="none";

        errorBox.style.display="flex";

    }

}


loadMap();


/* =========================================================
   زوم
========================================================= */

let scale=1;

let offsetX=0;

let offsetY=0;


function applyTransform(){

    world.setAttribute(
        "transform",
        `
        translate(${offsetX} ${offsetY})
        scale(${scale})
        `
    );


    labels.setAttribute(
        "transform",
        `
        translate(${offsetX} ${offsetY})
        scale(${scale})
        `
    );

}


document
.getElementById("zoomIn")
.addEventListener(
    "click",
    ()=>{
        scale=Math.min(
            5,
            scale*1.25
        );

        applyTransform();
    }
);


document
.getElementById("zoomOut")
.addEventListener(
    "click",
    ()=>{
        scale=Math.max(
            1,
            scale/1.25
        );

        applyTransform();
    }
);


document
.getElementById("reset")
.addEventListener(
    "click",
    ()=>{

        scale=1;

        offsetX=0;

        offsetY=0;

        applyTransform();

    }
);


/* =========================================================
   حرکت نقشه با انگشت
========================================================= */

let dragging=false;

let startX=0;

let startY=0;


svg.addEventListener(
    "pointerdown",
    event=>{

        dragging=true;

        startX=event.clientX;

        startY=event.clientY;

        svg.classList.add(
            "dragging"
        );

        svg.setPointerCapture(
            event.pointerId
        );

    }
);


svg.addEventListener(
    "pointermove",
    event=>{

        if(!dragging)
            return;


        const dx =
            event.clientX-startX;


        const dy =
            event.clientY-startY;


        startX=event.clientX;

        startY=event.clientY;


        offsetX +=
            dx / svg.clientWidth * 1200;


        offsetY +=
            dy / svg.clientHeight * 650;


        applyTransform();

    }
);


svg.addEventListener(
    "pointerup",
    event=>{

        dragging=false;

        svg.classList.remove(
            "dragging"
        );

        try{

            svg.releasePointerCapture(
                event.pointerId
            );

        }catch(e){}

    }
);


svg.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
        svg.classList.remove(
            "dragging"
        );
    }
);


/* =========================================================
   اطلاعات اولیه بازی
========================================================= */

let money=50000;

let production=100;

let inflation=4;

let day=1;


setInterval(
    ()=>{

        day++;

        document
        .getElementById("date")
        .textContent=
            "روز "+day;

    },
    5000
);

</script>

</body>
                    </html>
