html,body{

/* ---------------- TOP BAR ---------------- */

#topbar{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    min-height:65px;
    z-index:10;

    display:flex;
    align-items:center;
    gap:7px;

    border-radius:14px;

}

.logo{
    font-size:18px;

    color:#e9f4ff;
}

.stat{
    background:#14283d;
    border:1px solid #29445e;
    border-radius:9px;

}

.stat b{

}

button{

    background:#17689c;

}

button:hover{

#turnBtn{

.info span{

/* =====================================================
   ابزار نقشه
===================================================== */

function resize(){

    W=innerWidth;
    H=innerHeight;

    canvas.width=W*devicePixelRatio;
    canvas.height=H*devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    draw();

}

window.addEventListener("resize",resize);


/* تبدیل مختصات جهان */

function project(lon,lat){

    const x=(lon+180)/360*W;

    const y=(90-lat)/180*H;

    return [

        x*zoom+offsetX,

        y*zoom+offsetY

    ];

}


/* =====================================================
   رسم اقیانوس و کشورها
===================================================== */

function draw(){

    ctx.clearRect(0,0,W,H);

    /* اقیانوس */

    ctx.fillStyle="#071b29";

    ctx.fillRect(0,0,W,H);


    /* خطوط طول جغرافیایی */

    ctx.strokeStyle="#ffffff09";

    ctx.lineWidth=1;

    for(let lon=-180;lon<=180;lon+=20){

        const a=project(lon,-90);
        const b=project(lon,90);

        ctx.beginPath();

        ctx.moveTo(a[0],a[1]);
        ctx.lineTo(b[0],b[1]);

        ctx.stroke();

    }


    /* خطوط عرض */

    for(let lat=-60;lat<=60;lat+=20){

        const a=project(-180,lat);
        const b=project(180,lat);

        ctx.beginPath();

        ctx.moveTo(a[0],a[1]);
        ctx.lineTo(b[0],b[1]);

        ctx.stroke();

    }


    /* کشورها */

    for(const id in countries){

        const c=countries[id];

        const [x,y]=project(c.x,c.y);

        const ww=c.w/360*W*1.9*zoom;

        const hh=c.h/180*H*1.9*zoom;


        ctx.beginPath();

        ctx.roundRect(
            x-ww/2,
            y-hh/2,
            ww,
            hh,
            5
        );


        if(c.owner===player){

            ctx.fillStyle="#25a56a";

        }
        else{

            ctx.fillStyle=c.color;

        }

        ctx.fill();


        if(c===selected){

            ctx.strokeStyle="#ffffff";

            ctx.lineWidth=3;

        }
        else{

            ctx.strokeStyle="#536b82";

            ctx.lineWidth=1;

        }

        ctx.stroke();


        /* نام */

        if(zoom>.65){

            ctx.fillStyle="#fff";

            ctx.font=`${Math.max(9,10*zoom)}px Tahoma`;

            ctx.textAlign="center";

            ctx.textBaseline="middle";

            ctx.fillText(
                c.name,
                x,
                y-5
            );


            ctx.font="9px Arial";

            ctx.fillText(
                "🪖"+Math.round(c.army),
                x,
                y+9
            );

        }

    }


    /* مرز بین کشورهای همسایه */

    if(player){

        ctx.strokeStyle="#ffffff20";

        ctx.lineWidth=1;

        for(const id in countries){

            const c=countries[id];

            if(!neighbors[id]) continue;

            for(const n of neighbors[id]){

                const d=countries[n];

                if(!d)continue;

                const a=project(c.x,c.y);
                const b=project(d.x,d.y);

                ctx.beginPath();

                ctx.moveTo(a[0],a[1]);
                ctx.lineTo(b[0],b[1]);

                ctx.stroke();

            }

        }

    }

}


/* =====================================================
   انتخاب کشور
===================================================== */

function hitTest(mx,my){

    let result=null;

    let best=Infinity;

    for(const id in countries){

        const c=countries[id];

        const [x,y]=project(c.x,c.y);

        const ww=c.w/360*W*1.9*zoom;

        const hh=c.h/180*H*1.9*zoom;

        const dx=Math.abs(mx-x);
        const dy=Math.abs(my-y);

        if(dx<ww/2 && dy<hh/2){

            const d=dx*dx+dy*dy;

            if(d<best){

                best=d;

                result=c;

            }

        }

    }

    return result;

}


canvas.addEventListener(
    "click",
    function(e){

        if(dragging)return;

        const c=hitTest(
            e.clientX,
            e.clientY
        );

        if(c){

            selected=c;

            updatePanel();

            draw();

        }

    }
);


/* =====================================================
   حرکت نقشه
===================================================== */

canvas.addEventListener(
    "pointerdown",
    e=>{

        dragging=false;

        lastX=e.clientX;
        lastY=e.clientY;

        canvas.setPointerCapture(e.pointerId);

    }
);

canvas.addEventListener(
    "pointermove",
    e=>{

        if(e.buttons!==1)return;

        const dx=e.clientX-lastX;
        const dy=e.clientY-lastY;

        if(Math.abs(dx)>2 || Math.abs(dy)>2){

            dragging=true;

        }

        offsetX+=dx;
        offsetY+=dy;

        lastX=e.clientX;
        lastY=e.clientY;

        draw();

    }
);

canvas.addEventListener(
    "pointerup",
    ()=>{

        setTimeout(
            ()=>dragging=false,
            20
        );

    }
);


/* =====================================================
   زوم
===================================================== */

canvas.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        const oldZoom=zoom;

        if(e.deltaY<0){

            zoom*=1.12;

        }
        else{

            zoom*=.89;

        }

        zoom=Math.max(
            .55,
            Math.min(3,zoom)
        );


        const mx=e.clientX;
        const my=e.clientY;

        offsetX=
            mx-(mx-offsetX)*(zoom/oldZoom);

        offsetY=
            my-(my-offsetY)*(zoom/oldZoom);

        draw();

    },
    {passive:false}
);


/* =====================================================
   رابط کاربری
===================================================== */

function updatePanel(){

    if(!selected)return;

    document.getElementById("countryTitle")
        .textContent=selected.name;

    document.getElementById("owner")
        .textContent=
        countries[selected.owner]?.name || "مستقل";

    document.getElementById("countryArmy")
        .textContent=Math.round(selected.army);

    document.getElementById("countryAir")
        .textContent=Math.round(selected.air);

    document.getElementById("countryTank")
        .textContent=Math.round(selected.tank);

    document.getElementById("population")
        .textContent=selected.population+" میلیون";

    document.getElementById("industry")
        .textContent=selected.industry;

}


/* =====================================================
   اطلاعات بازیکن
===================================================== */

function updateTop(){

    if(!player)return;

    const p=countries[player];

    document.getElementById("playerName")
        .textContent=p.name;

    document.getElementById("money")
        .textContent=Math.floor(p.money);

    document.getElementById("army")
        .textContent=Math.floor(p.army);

    document.getElementById("air")
        .textContent=Math.floor(p.air);

    document.getElementById("defense")
        .textContent=Math.floor(
            p.army*.25+p.tank*.5+p.air*.3
        );

    document.getElementById("turn")
        .textContent=turn;

}


/* =====================================================
   گزارش
===================================================== */

function log(message){

    const box=document.getElementById("log");

    const line=document.createElement("div");

    line.className="log";

    line.textContent=
        "نوبت "+turn+" | "+message;

    box.prepend(line);

}


/* =====================================================
   درآمد
===================================================== */

function getIncome(){

    let total=0;

    for(const id in countries){

        const c=countries[id];

        if(c.owner===player){

            total+=
                Math.floor(
                    c.industry*3+
                    c.population*.25
                );

        }

    }

    return total;

}


/* =====================================================
   استخدام
===================================================== */

document.getElementById("recruitBtn")
.onclick=function(){

    if(!player)return;

    const p=countries[player];

    const cost=100;

    if(p.money<cost){

        log("پول کافی برای استخدام سرباز وجود ندارد.");

        return;

    }

    p.money-=cost;

    p.army+=25;

    log("۲۵ سرباز جدید استخدام شد.");

    updateTop();
    updatePanel();

};


/* =====================================================
   ساخت تانک
===================================================== */

document.getElementById("tankBtn")
.onclick=function(){

    if(!player)return;

    const p=countries[player];

    const cost=180;

    if(p.money<cost){

        log("پول کافی برای ساخت تانک ندارید.");

        return;

    }

    p.money-=cost;

    p.tank+=10;

    log("۱۰ تانک ساخته شد.");

    updateTop();
    updatePanel();

};


/* =====================================================
   ساخت هواپیما
===================================================== */

document.getElementById("airBtn")
.onclick=function(){

    if(!player)return;

    const p=countries[player];

    const cost=220;

    if(p.money<cost){

        log("پول کافی برای ساخت هواپیما ندارید.");

        return;

    }

    p.money-=cost;

    p.air+=8;

    log("۸ هواپیمای جنگی ساخته شد.");

    updateTop();
    updatePanel();

};


/* =====================================================
   حمله
===================================================== */

document.getElementById("attackBtn")
.onclick=function(){

    if(!player || !selected){

        return;

    }

    const p=countries[player];

    const enemy=selected;


    if(enemy.owner===player){

        log("این سرزمین متعلق به شماست.");

        return;

    }


    if(
        !neighbors[player] ||
        !neighbors[player].includes(enemy.id)
    ){

        log("این کشور با کشور شما مرز مشترک ندارد.");

        return;

    }


    if(p.army<20){

        log("ارتش شما برای حمله کافی نیست.");

        return;

    }


    /* قدرت مهاجم */

    const attackPower=

        p.army*.45+
        p.tank*.75+
        p.air*.35+
        Math.random()*50;


    /* قدرت مدافع */

    const defensePower=

        enemy.army*.5+
        enemy.tank*.8+
        enemy.air*.35+
        Math.random()*60;


    if(attackPower>defensePower){

        const losses=
            Math.floor(
                p.army*.15+
                Math.random()*15
            );

        p.army=Math.max(
            5,
            p.army-losses
        );

        enemy.owner=player;

        enemy.army=Math.max(
            10,
            Math.floor(
                enemy.army*.35
            )
        );

        p.money=Math.max(
            0,
            p.money-100
        );

        log(
            "پیروزی! "+enemy.name+
            " تصرف شد."
        );

    }
    else{

        const losses=
            Math.floor(
                p.army*.30+
                Math.random()*20
            );

        p.army=Math.max(
            5,
            p.army-losses
        );

        enemy.army=Math.max(
            5,
            enemy.army-
            Math.floor(
                enemy.army*.15
            )
        );

        log(
            "حمله به "+
            enemy.name+
            " شکست خورد."
        );

    }


    updateTop();
    updatePanel();

    draw();

    checkVictory();

};


/* =====================================================
   صلح
===================================================== */

document.getElementById("peaceBtn")
.onclick=function(){

    if(!selected || !player)return;

    if(selected.owner===player){

        log("این کشور تحت کنترل شماست.");

        return;

    }

    log(
        "پیشنهاد صلح به "+
        selected.name+
        " ارسال شد."
    );

};


/* =====================================================
   اتحاد
===================================================== */

document.getElementById("allyBtn")
.onclick=function(){

    if(!selected || !player)return;

    if(selected.owner===player){

        log("این کشور در حال حاضر متعلق به شماست.");

        return;

    }

    log(
        "اتحاد با "+
        selected.name+
        " پیشنهاد شد."
    );

};


/* =====================================================
   هوش مصنوعی
===================================================== */

function aiTurn(){

    const all=
        Object.values(countries);


    all.forEach(ai=>{

        if(ai.owner===player)return;


        /* رشد اقتصادی */

        ai.money+=
            Math.floor(
                ai.industry*1.5
            );


        /* تولید ارتش */

        if(ai.money>250){

            ai.money-=100;

            ai.army+=20;

        }


        /* حمله تصادفی */

        if(Math.random()<.35){

            const targets=
                (neighbors[ai.id]||[])
                .map(id=>countries[id])
                .filter(Boolean)
                .filter(
                    c=>c.owner!==ai.owner
                );


            if(targets.length){

                const target=
                    targets[
                        Math.floor(
                            Math.random()*
                            targets.length
                        )
                    ];


                const attackPower=
                    ai.army*.4+
                    ai.tank*.7+
                    ai.air*.3;


                const defensePower=
                    target.army*.5+
                    target.tank*.8+
                    target.air*.3;


                if(
                    attackPower>
                    defensePower*
                    (0.8+Math.random()*.5)
                ){

                    target.owner=ai.owner;

                    target.army=
                        Math.max(
                            8,
                            Math.floor(
                                target.army*.3
                            )
                        );

                    ai.army=
                        Math.max(
                            10,
                            Math.floor(
                                ai.army*.7
                            )
                        );

                    log(
                        ai.name+
                        "، "+
                        target.name+
                        " را تصرف کرد."
                    );

                }

            }

        }

    });

}


/* =====================================================
   پایان نوبت
===================================================== */

document.getElementById("turnBtn")
.onclick=function(){

    if(!player)return;


    turn++;


    const income=getIncome();

    countries[player].money+=income;


    log(
        "درآمد جنگی شما: "+
        income+
        " پول"
    );


    aiTurn();


    /* تولید خودکار */

    for(const id in countries){

        const c=countries[id];

        if(c.owner===id){

            c.money+=
                Math.floor(
                    c.industry*.5
                );

        }

    }


    updateTop();

    updatePanel();

    draw();

    checkVictory();

};


/* =====================================================
   پیروزی
===================================================== */

function checkVictory(){

    let count=0;

    const total=
        Object.keys(countries).length;


    for(const id in countries){

        if(countries[id].owner===player){

            count++;

        }

    }


    if(count===total){

        alert(
            "🏆 پیروزی نهایی!\n"+
            "شما تمام جهان را تصرف کردید."
        );

    }

}


/* =====================================================
   شروع بازی
===================================================== */

const select=
    document.getElementById("countrySelect");


for(const id in countries){

    const option=
        document.createElement("option");

    option.value=id;

    option.textContent=
        countries[id].name;

    select.appendChild(option);

}


document.getElementById("startBtn")
.onclick=function(){

    player=select.value;

    selected=countries[player];


    /* پول شروع */

    countries[player].money+=500;

    countries[player].army+=50;


    document.getElementById("start")
        .style.display="none";


    log(
        "جنگ آغاز شد. کشور "+
        countries[player].name+
        " تحت فرمان شماست."
    );


    updateTop();

    updatePanel();

    draw();

};


/* =====================================================
   شروع رسم
===================================================== */

resize();

</script>
