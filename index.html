/* =====================================================
   HASH
===================================================== */

function hash(i){

let x =
Math.sin(i*999.123)
*43758.5453;

return x-Math.floor(x);

}


/* =====================================================
   PROJECTION
===================================================== */

function project(lon,lat){

return [

(lon+180) /
360 *
W *
zoom +
panX,

(90-lat) /
180 *
H *
zoom +
panY

];

}


/* =====================================================
   BUILD MAP
===================================================== */

function buildCells(){

cells=[];

let index=0;


regions.forEach(
region=>{

const [
left,
bottom,
right,
top
]=region.box;


const cols =
Math.ceil(
Math.sqrt(
region.count *
(
(right-left) /
(top-bottom)
)
)
);


const rows =
Math.ceil(
region.count /
cols
);


let number=0;


for(
let y=0;
y<rows;
y++
){

for(
let x=0;
x<cols &&
number<region.count;
x++,
number++,
index++
){

const lon =
left+
(
x+
(hash(index)-.5)*.35
)
*
(right-left)/
cols;


const lat =
bottom+
(
y+
(hash(index+31)-.5)*.35
)
*
(top-bottom)/
rows;


const cw =
(right-left)/
cols*
.9;


const ch =
(top-bottom)/
rows*
.86;


const p1 =
project(
lon-cw/2,
lat+ch/2
);


const p2 =
project(
lon+cw/2,
lat+ch/2
);


const p3 =
project(
lon+cw/2,
lat-ch/2
);


const p4 =
project(
lon-cw/2,
lat-ch/2
);


cells.push({

name:
countries[
index%
countries.length
],

region:
region.name,

poly:[
p1,
p2,
p3,
p4
],

color:
colors[
(index*7)%
colors.length
],

id:index

});

}

}

}

);


/* =====================================================

function draw(){

ctx.clearRect(
0,
0,
W,
H
);


/* ocean */

ctx.fillStyle='#07284a';

ctx.fillRect(
0,
0,
W,
H
);


/* grid */

ctx.strokeStyle='#4e9bc9';

ctx.globalAlpha=.13;

ctx.lineWidth=1;


for(
let lon=-180;
lon<=180;
lon+=20
){

const x=
project(lon,0)[0];

ctx.beginPath();

ctx.moveTo(x,0);

ctx.lineTo(x,H);

ctx.stroke();

}


for(
let lat=-60;
lat<=80;
lat+=20
){

const y=
project(0,lat)[1];

ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(W,y);

ctx.stroke();

}


ctx.globalAlpha=1;


/* countries */

cells.forEach(
country=>{

ctx.beginPath();


country.poly.forEach(
(point,i)=>{

if(i===0){

ctx.moveTo(
point[0],
point[1]
);

}else{

ctx.lineTo(
point[0],
point[1]
);

}

}
);


ctx.closePath();


ctx.fillStyle =
country===selected
?
'#f0b735'
:
country.color;


ctx.fill();


ctx.strokeStyle =
country===selected
?
'#ffe47a'
:
'#9cc5df';


ctx.lineWidth =
country===selected
?
2.5
:
1;


ctx.stroke();

}
);


/* oceans labels */

ctx.fillStyle='#9ed8ff';

ctx.globalAlpha=.6;

ctx.font='bold 10px Tahoma';

ctx.textAlign='center';


[
['اقیانوس اطلس',-35,18],
['اقیانوس آرام',-145,5],
['اقیانوس هند',80,-28],
['مدیترانه',20,36]
].forEach(
item=>{

project(
item[1],
item[2]
);

p[1]
);

}
);


ctx.globalAlpha=1;

}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

dpr =
window.devicePixelRatio ||
1;

W=innerWidth;

H=innerHeight;

canvas.width =
W*dpr;

canvas.height =
H*dpr;

canvas.style.width =
W+'px';

canvas.style.height =
H+'px';

ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

buildCells();

draw();

}


/* =====================================================
   HIT TEST
===================================================== */

function hit(
x,
y
){

for(
let i=cells.length-1;
i>=0;
i--
){

const polygon =
cells[i].poly;

let inside=false;


for(
let j=0,
k=polygon.length-1;
j<polygon.length;
k=j++
){

const xi=
polygon[j][0];

const yi=
polygon[j][1];

const xk=
polygon[k][0];

const yk=
polygon[k][1];


const intersect=

(
(yi>y)!==(yk>y)
)

&&

(
x<
(xk-xi)
*
(y-yi)
/
(
(yk-yi) ||
.00001
)
+
xi
);


if(intersect){

inside=!inside;

}

}


if(inside){

return cells[i];

}

}

return null;

}


/* =====================================================
   POINTER
===================================================== */

canvas.addEventListener(
'pointerdown',
event=>{

drag=true;

moved=false;

lastX=
event.clientX;

lastY=
event.clientY;

canvas.setPointerCapture(
event.pointerId
);

}
);


canvas.addEventListener(
'pointermove',
event=>{

if(!drag)
return;


const dx =
event.clientX-lastX;

const dy =
event.clientY-lastY;


if(
Math.abs(dx)+
Math.abs(dy)>3
){

moved=true;

}


panX+=dx;

panY+=dy;


lastX=
event.clientX;

lastY=
event.clientY;


buildCells();

draw();

}
);


canvas.addEventListener(
'pointerup',
()=>{

drag=false;

}
);


/* =====================================================
   CLICK COUNTRY
===================================================== */

canvas.addEventListener(
'click',
event=>{

if(moved)
return;


const country =
hit(
event.clientX,
event.clientY
);


if(!country)
return;


selected=country;


document.getElementById(
'country'
).textContent=
country.name;


document.getElementById(
'card'
).classList.add(
'show'
);


document.getElementById(
'eco'

50+
(
country.id*13
)%45;


document.getElementById(
'mil'
).textContent=
45+
(
country.id*17
)%51;


document.getElementById(
'cpop'
).textContent=
(
5+
(country.id*7)%160
)+
'.'+
(country.id%10)+
'M';


document.getElementById(
'cgdp'
).textContent=
'$'+
(
30+
(country.id*19)%900
)+
'B';


draw();


toast(
country.name+
' انتخاب شد'
);

}
);


/* =====================================================
   ZOOM
===================================================== */

canvas.addEventListener(
'wheel',
event=>{

event.preventDefault();


const oldZoom=zoom;


if(event.deltaY<0){

zoom*=1.12;

}else{

zoom*=.89;

}


zoom=
Math.max(
.75,
Math.min(
3,
zoom
)
);


panX=
event.clientX-
(
event.clientX-panX
)*
(
zoom/oldZoom
);


panY=
event.clientY-
(
event.clientY-panY
)*
(
zoom/oldZoom
);


buildCells();

draw();

},
{
passive:false
}
);


/* =====================================================
   TOAST
===================================================== */

function toast(message){

const element =
document.getElementById(
'toast'
);


element.textContent=
message;


element.classList.remove(
'show'
);


void element.offsetWidth;


element.classList.add(
'show'
);

}
