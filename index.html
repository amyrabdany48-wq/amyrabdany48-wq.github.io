<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Empire Horizon</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
body{
 margin:0;
 background:#07111f;
 color:#eef6ff;
 font-family:Tahoma,Arial,sans-serif;
 overflow-x:hidden;
}
button{
 border:0;
 border-radius:10px;
 padding:11px 14px;
 background:#172b44;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
button:hover{background:#21405f}
button:active{transform:scale(.97)}

.hidden{display:none!important}

#countryScreen{
 min-height:100vh;
 padding:18px;
 background:
 radial-gradient(circle at top,#16365a,#07111f 55%);
}
.logo{
 text-align:center;
 font-size:30px;
 font-weight:bold;
 margin:10px;
 color:#5ed7ff;
}
.subtitle{
 text-align:center;
 color:#9db3c9;
 margin-bottom:20px;
}
.countryGrid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
 gap:10px;
 max-width:1000px;
 margin:auto;
}
.country{
 background:#102238;
 border:1px solid #29445f;
 padding:15px 8px;
 border-radius:12px;
 text-align:center;
}
.country:hover{
 background:#173552;
 border-color:#55cfff;
}
.country .flag{
 font-size:28px;
 display:block;
 margin-bottom:7px;
}
#continueBox{
 max-width:600px;
 margin:0 auto 20px;
 background:#102238;
 padding:15px;
 border-radius:14px;
 text-align:center;
}

#game{
 display:none;
 min-height:100vh;
}

.topbar{
 position:sticky;
 top:0;
 z-index:20;
 background:#0b1829;
 border-bottom:1px solid #263d56;
 padding:8px;
}
.stats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
}
.stat{
 background:#12263d;
 border-radius:9px;
 padding:8px;
 text-align:center;
 font-size:12px;
}
.stat b{
 display:block;
 font-size:14px;
 margin-top:3px;
}

.layout{
 display:grid;
 grid-template-columns:1fr 320px;
 min-height:calc(100vh - 70px);
}

#mapArea{
 position:relative;
 min-height:650px;
 overflow:hidden;
 background:
 radial-gradient(circle at 50% 40%,#153957,#071421 70%);
}

#map{
 width:100%;
 height:100%;
 min-height:650px;
 display:block;
}

.side{
 background:#0b1929;
 border-right:1px solid #263d56;
 padding:10px;
 overflow:auto;
}

.panel{
 background:#102238;
 border:1px solid #263f58;
 border-radius:12px;
 padding:11px;
 margin-bottom:9px;
}
.panel h3{
 margin:0 0 9px;
 color:#66d8ff;
 font-size:15px;
}
.menu{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px;
}
.menu button{
 font-size:12px;
 padding:10px 5px;
}

#log{
 max-height:170px;
 overflow:auto;
 font-size:11px;
 line-height:1.8;
 color:#bdd0e2;
}

.modal{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.72);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modalBox{
 width:min(700px,100%);
 max-height:90vh;
 overflow:auto;
 background:#0d1d30;
 border:1px solid #31516e;
 border-radius:16px;
 padding:17px;
 box-shadow:0 15px 50px #000;
}
.modalBox h2{
 margin-top:0;
 color:#62d9ff;
}
.close{
 float:left;
 background:#48212a;
}

.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 padding:8px;
 margin:5px 0;
 background:#12263c;
 border-radius:9px;
}
.small{
 font-size:11px;
 color:#9db4c9;
}

.progress{
 height:8px;
 background:#06101c;
 border-radius:10px;
 overflow:hidden;
 margin-top:5px;
}
.progress i{
 display:block;
 height:100%;
 background:#55cfff;
}

.notice{
 padding:10px;
 background:#152b42;
 border-radius:9px;
 margin:6px 0;
 font-size:12px;
}

@media(max-width:800px){
 .layout{
  grid-template-columns:1fr;
 }
 .side{
  border-right:0;
  border-top:1px solid #263d56;
 }
 #mapArea{
  min-height:500px;
 }
 .stats{
  grid-template-columns:repeat(3,1fr);
 }
}

@media(max-width:450px){
 .stats{
  grid-template-columns:repeat(2,1fr);
 }
 .countryGrid{
  grid-template-columns:repeat(2,1fr);
 }
}
</style>
</head>

<body>

<!-- ================= انتخاب کشور ================= -->

<section id="countryScreen">

<div class="logo">🌍 EMPIRE HORIZON</div>
<div class="subtitle">
نسخه آفلاین استراتژیک — جهان پویا، اقتصاد، دیپلماسی و جنگ
</div>

<div id="continueBox" class="hidden">
 <div>یک کشور ذخیره‌شده داری</div>
 <br>
 <button onclick="continueGame()">▶ ادامه بازی قبلی</button>
 <button onclick="deleteSave()">🗑 پاک کردن ذخیره</button>
</div>

<h3 style="text-align:center">کشور خودت را انتخاب کن</h3>

<div id="countries" class="countryGrid"></div>

</section>


<!-- ================= بازی ================= -->

<section id="game">

<header class="topbar">
 <div class="stats">
  <div class="stat">💰 خزانه<b id="money">0</b></div>
  <div class="stat">🏭 تولید<b id="production">0</b></div>
  <div class="stat">📈 تورم<b id="inflation">0%</b></div>
  <div class="stat">🪙 منابع<b id="resources">0</b></div>
  <div class="stat">🛡 قدرت نظامی<b id="power">0</b></div>
 </div>
</header>

<div class="layout">

<main id="mapArea">
 <canvas id="map"></canvas>
</main>

<aside class="side">

<div class="panel">
 <h3 id="countryName">کشور</h3>
 <div class="small" id="dateText"></div>
</div>

<div class="panel">
 <h3>فرماندهی</h3>
 <div class="menu">
  <button onclick="openEconomy()">💰 اقتصاد</button>
  <button onclick="openArmy()">🛡 ارتش</button>
  <button onclick="openDiplomacy()">🤝 دیپلماسی</button>
  <button onclick="openTrade()">🚢 تجارت</button>
  <button onclick="openIndustry()">🏭 صنعت</button>
  <button onclick="openCountries()">🌐 کشورها</button>
  <button onclick="openStore()">🛒 فروشگاه</button>
  <button onclick="saveGame()">💾 ذخیره</button>
 </div>
</div>

<div class="panel">
 <h3>گزارش جهان</h3>
 <div id="log"></div>
</div>

</aside>
</div>
</section>


<!-- ================= مودال ================= -->

<div id="modal" class="modal hidden">
 <div class="modalBox">
  <button class="close" onclick="closeModal()">✕</button>
  <div id="modalContent"></div>
 </div>
</div>


<script>
"use strict";

/* =========================================================
   داده کشورهای بازی
========================================================= */

const countries = [
 ["ایران","🇮🇷"],
 ["عراق","🇮🇶"],
 ["ترکیه","🇹🇷"],
 ["افغانستان","🇦🇫"],
 ["پاکستان","🇵🇰"],
 ["هند","🇮🇳"],
 ["چین","🇨🇳"],
 ["ژاپن","🇯🇵"],
 ["کره جنوبی","🇰🇷"],
 ["روسیه","🇷🇺"],
 ["اوکراین","🇺🇦"],
 ["آلمان","🇩🇪"],
 ["فرانسه","🇫🇷"],
 ["انگلستان","🇬🇧"],
 ["ایتالیا","🇮🇹"],
 ["اسپانیا","🇪🇸"],
 ["مصر","🇪🇬"],
 ["عربستان","🇸🇦"],
 ["امارات","🇦🇪"],
 ["آمریکا","🇺🇸"],
 ["کانادا","🇨🇦"],
 ["مکزیک","🇲🇽"],
 ["برزیل","🇧🇷"],
 ["آرژانتین","🇦🇷"],
 ["استرالیا","🇦🇺"],
 ["اندونزی","🇮🇩"],
 ["تایلند","🇹🇭"],
 ["ویتنام","🇻🇳"],
 ["آفریقای جنوبی","🇿🇦"],
 ["نیجریه","🇳🇬"]
];

/* =========================================================
   رنگ کشورها
========================================================= */

const countryColors = [
 "#22a6f2","#f2c94c","#e74c3c","#27ae60","#9b59b6",
 "#e67e22","#3498db","#ecf0f1","#e84393","#7f8c8d",
 "#16a085","#34495e","#2980b9","#8e44ad","#d35400",
 "#2ecc71","#c0392b","#f1c40f","#1abc9c","#95a5a6",
 "#6c5ce7","#00b894","#fdcb6e","#e17055","#74b9ff",
 "#a29bfe","#55efc4","#fab1a0","#636e72","#81ecec"
];

/* =========================================================
   وضعیت بازی
========================================================= */

let game = null;

function createCountry(name,index){

 return {
  id:index,
  name:name,
  color:countryColors[index % countryColors.length],

  money:50000 + Math.random()*50000,
  production:40 + Math.random()*40,
  resources:100 + Math.random()*100,

  inflation:3 + Math.random()*4,
  stability:65 + Math.random()*25,
  military:40 + Math.random()*70,

  industry:1,
  infrastructure:1,

  units:{
   tank:5,
   drone:5,
   aircraft:5,
   missile:5,
   navy:2
  },

  relations:{},
  sanctions:[],
  war:false,
  colonies:[],
  territory:100,

  ai:{
   aggression:Math.random(),
   diplomacy:Math.random(),
   economy:Math.random(),
   fear:Math.random()
  }
 };
}


/* =========================================================
   ساخت جهان
========================================================= */

function newWorld(){

 let world = [];

 countries.forEach((c,i)=>{
  world.push(createCountry(c[0],i));
 });

 world.forEach(c=>{
  world.forEach(o=>{
   if(c.id !== o.id){
    c.relations[o.id] = -10 + Math.random()*40;
   }
  });
 });

 return world;
}


/* =========================================================
   ساخت صفحه انتخاب کشور
========================================================= */

function renderCountries(){

 const box=document.getElementById("countries");
 box.innerHTML="";

 countries.forEach((c,i)=>{

  const el=document.createElement("button");
  el.className="country";

  el.innerHTML=
   `<span class="flag">${c[1]}</span>
    <b>${c[0]}</b>
    <div class="small">کشور شماره ${i+1}</div>`;

  el.onclick=()=>startGame(i);

  box.appendChild(el);
 });
}


/* =========================================================
   شروع بازی
========================================================= */

function startGame(id){

 let world = newWorld();

 game={
  player:id,
  world:world,
  day:1,
  year:2026,
  selected:null,
  lastSave:Date.now()
 };

 localStorage.setItem("empire_save",JSON.stringify(game));

 document.getElementById("countryScreen").style.display="none";
 document.getElementById("game").style.display="block";

 document.getElementById("countryName").textContent=
   world[id].name;

 log("🌍 بازی شروع شد.");
 log("🧠 هوش مصنوعی کشورها فعال شد.");

 updateUI();
 resizeMap();
 drawMap();
}


/* =========================================================
   ادامه بازی
========================================================= */

function continueGame(){

 try{
  const data=localStorage.getItem("empire_save");

  if(!data)return;

  game=JSON.parse(data);

  document.getElementById("countryScreen").style.display="none";
  document.getElementById("game").style.display="block";

  updateUI();
  resizeMap();
  drawMap();

  log("💾 بازی قبلی بارگذاری شد.");

 }catch(e){
  alert("ذخیره خراب شده است.");
 }
}


/* =========================================================
   ذخیره
========================================================= */

function saveGame(){

 if(!game)return;

 localStorage.setItem("empire_save",JSON.stringify(game));
 game.lastSave=Date.now();

 log("💾 بازی ذخیره شد.");
}


/* =========================================================
   پاک کردن ذخیره
========================================================= */

function deleteSave(){

 if(confirm("ذخیره قبلی پاک شود؟")){
  localStorage.removeItem("empire_save");
  location.reload();
 }
}


/* =========================================================
   رابط کاربری
========================================================= */

function updateUI(){

 const p=game.world[game.player];

 document.getElementById("money").textContent=
  Math.floor(p.money).toLocaleString();

 document.getElementById("production").textContent=
  Math.floor(p.production);

 document.getElementById("resources").textContent=
  Math.floor(p.resources);

 document.getElementById("inflation").textContent=
  p.inflation.toFixed(2)+"%";

 document.getElementById("power").textContent=
  Math.floor(p.military);

 document.getElementById("dateText").textContent=
  "سال "+game.year+" — روز "+game.day;
}


/* =========================================================
   سیستم اقتصاد
========================================================= */

function economyTick(){

 const p=game.world[game.player];

 let income =
   p.production *
   (1 + p.infrastructure*.03) *
   (1 - p.inflation*.008);

 income=Math.max(5,income);

 p.money += income;

 p.resources += p.production*.08;

 /* افزایش هزینه با تورم */

 const spending =
  20 +
  p.industry*3 +
  p.infrastructure*2;

 p.money-=spending;

 /* تورم */

 let inflationPressure=0;

 if(p.money<0) inflationPressure+=.10;
 if(p.stability<40) inflationPressure+=.12;
 if(p.production<30) inflationPressure+=.08;
 if(p.money>150000) inflationPressure-=.025;

 p.inflation += inflationPressure;

 /* برگشت آهسته تورم */

 p.inflation += (3-p.inflation)*.004;

 p.inflation=Math.max(0.5,Math.min(60,p.inflation));

 /* ثبات */

 if(p.inflation>15)
  p.stability-=.05;

 if(p.inflation<6)
  p.stability+=.025;

 p.stability=Math.max(5,Math.min(100,p.stability));
}


/* =========================================================
   سیستم هوش مصنوعی
========================================================= */

function aiTick(){

 game.world.forEach((ai,i)=>{

  if(i===game.player)return;

  const player=game.world[game.player];

  /* اقتصاد */

  let economicIncome=
   ai.production*
   (1+ai.infrastructure*.03)*
   (1-ai.inflation*.006);

  ai.money+=Math.max(3,economicIncome);

  ai.resources+=ai.production*.05;

  /* سرمایه‌گذاری */

  if(ai.money>60000 && Math.random()<ai.ai.economy*.25){

   ai.infrastructure++;
   ai.money-=12000;

   log("🏗 "+ai.name+" زیرساخت‌های خود را توسعه داد.");
  }

  /* خرید نظامی */

  if(ai.money>40000 && Math.random()<ai.ai.aggression*.18){

   ai.units.tank++;
   ai.units.drone++;
   ai.military+=1.5;

   ai.money-=9000;
  }

  /* تصمیم دیپلماتیک */

  const relation=ai.relations[game.player] ?? 0;

  const playerPower=player.military;
  const aiPower=ai.military;

  /*
    AI حمله نمی‌کند مگر اینکه چند شرط
    همزمان برقرار باشد.
  */

  const strengthRatio=aiPower/(playerPower+1);

  const hostility=
   (-relation/100)+
   ai.ai.aggression*.7+
   ai.inflation/100;

  const opportunity=
   strengthRatio>.75 &&
   player.stability<75;

  const attackChance=
   hostility*.015;

  if(opportunity &&
     Math.random()<attackChance){

   startWar(i,game.player,true);
  }

  /* اگر خودش ضعیف باشد دنبال اتحاد می‌رود */

  if(aiPower<playerPower*.55 &&
     relation<20 &&
     Math.random()<.02){

   ai.relations[game.player]+=8;

   player.relations[i]+=8;

   log("🤝 "+ai.name+" پیشنهاد بهبود روابط داده است.");
  }

  /* کاهش تدریجی روابط منفی */

  if(ai.relations[game.player]>-100)
   ai.relations[game.player]*=.999;
 }


 /* تحریم‌ها */

 game.world.forEach((c,i)=>{

  if(i===game.player)return;

  if(c.sanctions.includes(game.player)){
   playerPenalty(c);
  }
 });
}


/* =========================================================
   اثر تحریم
========================================================= */

function playerPenalty(target){

 target.production*=.999;
 target.resources*=.999;
 target.inflation+=.002;
 target.stability-=.002;
}


/* =========================================================
   سیستم جنگ
========================================================= */

function startWar(attackerId,defenderId,aiAttack=false){

 const a=game.world[attackerId];
 const d=game.world[defenderId];

 if(a.war || d.war)return;

 if(a.id===d.id)return;

 a.war=true;
 d.war=true;

 log("⚔️ "+a.name+" وارد جنگ با "+d.name+" شد!");

 resolveBattle(a,d);

}


/* =========================================================
   نتیجه جنگ
========================================================= */

function resolveBattle(a,d){

 let attackScore=
  a.military*
  (0.75+Math.random()*.5)*
  (a.stability/100);

 let defenseScore=
  d.military*
  (0.80+Math.random()*.45)*
  (d.stability/100);

 /* مزیت دفاعی */

 defenseScore*=1.12;

 if(attackScore>defenseScore){

  const loss=
   Math.min(
    d.territory-5,
    5+Math.random()*12
   );

  d.territory-=loss;
  a.territory+=loss;

  a.military*=.96;
  d.military*=.90;

  d.money*=.94;
  d.stability-=6;

  log(
   "🏳️ "+a.name+
   " در نبرد پیروز شد و "+
   loss.toFixed(1)+" واحد سرزمین گرفت."
  );

 }else{

  a.military*=.90;
  d.military*=.96;
  a.stability-=4;

  log(
   "🛡 "+d.name+
   " حمله "+a.name+" را دفع کرد."
  );
 }

 a.war=false;
 d.war=false;

 updateUI();
 drawMap();
 saveGame();
}


/* =========================================================
   انتخاب کشور روی نقشه
========================================================= */

function selectCountry(id){

 game.selected=id;

 const c=game.world[id];

 openModal(`
  <h2>${c.name}</h2>

  <div class="row">
   <span>💰 خزانه</span>
   <b>${Math.floor(c.money).toLocaleString()}</b>
  </div>

  <div class="row">
   <span>📈 تورم</span>
   <b>${c.inflation.toFixed(1)}%</b>
  </div>

  <div class="row">
   <span>🏭 تولید</span>
   <b>${Math.floor(c.production)}</b>
  </div>

  <div class="row">
   <span>🛡 قدرت نظامی</span>
   <b>${Math.floor(c.military)}</b>
  </div>

  <div class="row">
   <span>🌍 قلمرو</span>
   <b>${c.territory.toFixed(1)}</b>
  </div>

  ${
   id!==game.player
   ? `<button onclick="playerAction(${id})">
      اقدامات دیپلماتیک
      </button>`
   : `<div class="notice">این کشور تحت کنترل شماست.</div>`
  }
 `);
}


/* =========================================================
   اقدامات کشورها
========================================================= */

function playerAction(id){

 const c=game.world[id];
 const p=game.world[game.player];

 openModal(`
  <h2>اقدامات علیه ${c.name}</h2>

  <button onclick="improveRelation(${id})">
   🤝 بهبود روابط
  </button>

  <button onclick="sanctionCountry(${id})">
   🚫 اعمال تحریم
  </button>

  <button onclick="startWar(game.player,${id})">
   ⚔️ اعلام جنگ
  </button>
 `);
}


/* =========================================================
   روابط
========================================================= */

function improveRelation(id){

 const p=game.world[game.player];
 const c=game.world[id];

 if(p.money<3000){
  alert("پول کافی نیست.");
  return;
 }

 p.money-=3000;

 p.relations[id]+=10;
 c.relations[game.player]+=10;

 log("🤝 روابط با "+c.name+" بهتر شد.");

 closeModal();
 updateUI();
}


/* =========================================================
   تحریم
========================================================= */

function sanctionCountry(id){

 const p=game.world[game.player];
 const c=game.world[id];

 if(!c.sanctions.includes(game.player))
  c.sanctions.push(game.player);

 c.inflation+=2;
 c.production*=.92;
 c.stability-=5;

 log("🚫 "+c.name+" تحت فشار اقتصادی قرار گرفت.");

 closeModal();
 updateUI();
}


/* =========================================================
   اقتصاد پنل
========================================================= */

function openEconomy(){

 const p=game.world[game.player];

 openModal(`
  <h2>💰 اقتصاد کشور</h2>

  <div class="row">
   <span>خزانه</span>
   <b>${Math.floor(p.money).toLocaleString()}</b>
  </div>

  <div class="row">
   <span>تورم</span>
   <b>${p.inflation.toFixed(2)}%</b>
  </div>

  <div class="row">
   <span>ثبات</span>
   <b>${p.stability.toFixed(1)}%</b>
  </div>

  <div class="row">
   <span>تولید</span>
   <b>${Math.floor(p.production)}</b>
  </div>

  <button onclick="buildInfrastructure()">
   🏗 ساخت زیرساخت — 12000
  </button>

  <button onclick="raiseTax()">
   🧾 افزایش مالیات
  </button>

  <button onclick="lowerTax()">
   📉 کاهش مالیات
  </button>
 `);
}


function buildInfrastructure(){

 const p=game.world[game.player];

 if(p.money<12000){
  alert("پول کافی نیست.");
  return;
 }

 p.money-=12000;
 p.infrastructure++;

 p.production+=5;
 p.stability+=1;

function tradeWith(id){

 const p=game.world[game.player];
 const c=game.world[id];

 const relation=p.relations[id];

 const chance=
  .45+
  relation/200+
  c.ai.diplomacy*.2;

 if(Math.random()<chance){

  const amount=5000+Math.random()*6000;

  if(p.resources>=30){

   p.resources-=30;
   p.money+=amount;

   c.money-=amount*.8;
   c.resources+=30;

   log("🚢 معامله با "+c.name+" پذیرفته شد.");

  }else{

   alert("منابع کافی نداری.");
  }

 }else{

  log("❌ "+c.name+" پیشنهاد تجاری را رد کرد.");
 }

 closeModal();
 updateUI();
}

/* =========================================================
   نقشه
========================================================= */

const canvas=document.getElementById("map");
const ctx=canvas.getContext("2d");

let mapW=1400;
let mapH=800;

let regions=[];


/*
  نقشه سبک برداری:
  به جای تصویر سنگین خارجی، خود مرورگر آن را رسم می‌کند.
  این باعث می‌شود فایل کاملاً آفلاین باشد.
*/

function createRegions(){

 regions=[];

 const cols=6;
 const rows=5;

 const cellW=mapW/cols;
 const cellH=mapH/rows;

 game.world.forEach((c,i)=>{

  const col=i%cols;
  const row=Math.floor(i/cols);

  const x=col*cellW;
  const y=row*cellH;

  regions.push({
   id:c.id,
   x:x+8,
   y:y+8,
   w:cellW-16,
   h:cellH-16
  });
 });
}


function resizeMap(){

 const rect=canvas.parentElement.getBoundingClientRect();

 canvas.width=Math.max(700,rect.width*devicePixelRatio);
 canvas.height=Math.max(500,rect.height*devicePixelRatio);

 canvas.style.width=rect.width+"px";
 canvas.style.height=rect.height+"px";

 ctx.setTransform(
  canvas.width/mapW,0,
  0,canvas.height/mapH,
  0,0
 );

 createRegions();
}


/* =========================================================
   رسم نقشه
========================================================= */

function drawMap(){

 if(!game)return;

 ctx.clearRect(0,0,mapW,mapH);

 /* پس زمینه */

 ctx.fillStyle="#081521";
 ctx.fillRect(0,0,mapW,mapH);

 /* شبکه ظریف */

 ctx.strokeStyle="rgba(100,180,220,.06)";
 ctx.lineWidth=1;

 for(let x=0;x<mapW;x+=50){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,mapH);
  ctx.stroke();
 }

 for(let y=0;y<mapH;y+=50){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(mapW,y);
  ctx.stroke();
 }

 regions.forEach(r=>{

  const c=game.world[r.id];

  ctx.beginPath();

  /*
    گوشه‌های نرم برای ظاهر نقشه
  */

  const radius=16;

  ctx.moveTo(r.x+radius,r.y);
  ctx.lineTo(r.x+r.w-radius,r.y);
  ctx.quadraticCurveTo(
   r.x+r.w,r.y,
   r.x+r.w,r.y+radius
  );

  ctx.lineTo(r.x+r.w,r.y+r.h-radius);

  ctx.quadraticCurveTo(
   r.x+r.w,r.y+r.h,
   r.x+r.w-radius,r.y+r.h
  );

  ctx.lineTo(r.x+radius,r.y+r.h);

  ctx.quadraticCurveTo(
   r.x,r.y+r.h,
   r.x,r.y+r.h-radius
  );

  ctx.lineTo(r.x,r.y+radius);

  ctx.quadraticCurveTo(
   r.x,r.y,
   r.x+radius,r.y
  );

  ctx.closePath();

  ctx.fillStyle=c.color;
  ctx.globalAlpha=.78;
  ctx.fill();

  ctx.globalAlpha=1;

  ctx.strokeStyle=
   c.id===game.player
   ?"white"
   :"rgba(0,0,0,.45)";

  ctx.lineWidth=
   c.id===game.player?4:2;

  ctx.stroke();

  ctx.fillStyle="#07111f";
  ctx.font="bold 18px Tahoma";
  ctx.textAlign="center";

  ctx.fillText(
   c.name,
   r.x+r.w/2,
   r.y+r.h/2
  );

  ctx.font="11px Tahoma";

  ctx.fillText(
   "قدرت "+Math.floor(c.military),
   r.x+r.w/2,
   r.y+r.h/2+23
  );
 });

 /* عنوان */

 ctx.textAlign="right";
 ctx.fillStyle="rgba(255,255,255,.8)";
 ctx.font="bold 24px Tahoma";

 ctx.fillText(
  "نقشه سیاسی جهان",
  mapW-30,
  40
 );
}


/* =========================================================
   کلیک نقشه
========================================================= */

canvas.addEventListener("click",function(e){

 if(!game)return;

 const rect=canvas.getBoundingClientRect();

 const x=
  (e.clientX-rect.left)/
  rect.width*mapW;

 const y=
  (e.clientY-rect.top)/
  rect.height*mapH;

 for(const r of regions){

  if(
   x>=r.x &&
   x<=r.x+r.w &&
   y>=r.y &&
   y<=r.y+r.h
  ){
   selectCountry(r.id);
   break;
  }
 }
});


canvas.addEventListener("touchstart",function(e){

 if(!game)return;

 const touch=e.touches[0];
 const rect=canvas.getBoundingClientRect();

 const x=
  (touch.clientX-rect.left)/
  rect.width*mapW;

 const y=
  (touch.clientY-rect.top)/
  rect.height*mapH;

 for(const r of regions){

  if(
   x>=r.x &&
   x<=r.x+r.w &&
   y>=r.y &&
   y<=r.y+r.h
  ){
   selectCountry(r.id);
   break;
  }
 }
},{passive:true});


window.addEventListener("resize",()=>{
 if(game){
  resizeMap();
  drawMap();
 }
});

   راه‌اندازی
========================================================= */

renderCountries();

if(localStorage.getItem("empire_save")){
 document.getElementById("continueBox")
  .classList.remove("hidden");
}

setInterval(gameTick,250);


/* جلوگیری از بسته شدن اشتباهی */

window.addEventListener("beforeunload",()=>{
 if(game)saveGame();
});

</script>
