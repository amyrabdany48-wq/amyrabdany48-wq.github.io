<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>WORLD EMPIRE — ULTRA STRATEGY</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root{
    --bg:#050914;
    --panel:rgba(10,17,31,.88);
    --panel2:rgba(15,24,42,.94);
    --line:rgba(255,255,255,.11);
    --text:#eef6ff;
    --muted:#8fa4bd;
    --blue:#38a8ff;
    --cyan:#28e5ff;
    --green:#31e68c;
    --yellow:#ffd65a;
    --red:#ff4f68;
    --purple:#a875ff;
    --orange:#ff9b4a;
    --shadow:0 15px 55px rgba(0,0,0,.45);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
      Tahoma,
      Arial,
      "Segoe UI",
      sans-serif;
}

body{
    position:relative;
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
    background:#07111e;
}

.leaflet-container{
    background:#07111e;
    font-family:inherit;
}

.leaflet-control-zoom{
    display:none;
}

.leaflet-control-attribution{
    background:rgba(3,8,16,.75)!important;
    color:#91a8bf!important;
    backdrop-filter:blur(8px);
}

.leaflet-control-attribution a{
    color:#54c8ff!important;
}

#fxCanvas{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    width:100%;
    height:100%;
}

#vignette{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    background:
      radial-gradient(circle at 50% 45%,transparent 35%,rgba(0,0,0,.18) 75%,rgba(0,0,0,.55) 100%);
}

#scan{
    position:absolute;
    inset:0;
    z-index:4;
    pointer-events:none;
    opacity:.08;
    background:
      repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 3px,
        rgba(255,255,255,.05) 4px
      );
}

/* =========================================================
   LOADING
========================================================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at center,#102944 0,#050914 52%,#02050a 100%);
    transition:opacity .7s,visibility .7s;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
}

.loaderBox{
    width:min(600px,90vw);
    padding:38px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:28px;
    background:rgba(7,13,25,.8);
    box-shadow:0 30px 100px rgba(0,0,0,.65);
    backdrop-filter:blur(25px);
    text-align:center;
}

.logo{
    font-size:clamp(28px,6vw,55px);
    font-weight:1000;
    letter-spacing:3px;
    background:linear-gradient(90deg,#fff,#38bfff,#a675ff,#fff);
    -webkit-background-clip:text;
    color:transparent;
    animation:logoPulse 2s infinite;
}

@keyframes logoPulse{
    50%{filter:drop-shadow(0 0 18px rgba(50,180,255,.45))}
}

.loaderSub{
    margin-top:10px;
    color:#8da5c1;
    font-size:13px;
}

.loaderBar{
    margin-top:30px;
    height:8px;
    border-radius:99px;
    overflow:hidden;
    background:#142237;
}

.loaderProgress{
    width:0%;
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,#24baff,#7a67ff,#29e39c);
    box-shadow:0 0 22px #28bfff;
    transition:width .2s;
}

.loaderStatus{
    margin-top:15px;
    font-size:12px;
    color:#8da5c1;
}

/* =========================================================
   TOP BAR
========================================================= */

#topBar{
    position:absolute;
    top:14px;
    left:14px;
    right:14px;
    z-index:20;
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:none;
}

.brand{
    min-width:205px;
    padding:12px 16px;
    border:1px solid var(--line);
    background:rgba(5,12,23,.82);
    backdrop-filter:blur(18px);
    border-radius:18px;
    box-shadow:var(--shadow);
}

.brandTitle{
    font-size:17px;
    font-weight:1000;
    letter-spacing:1.5px;
}

.brandSub{
    margin-top:3px;
    font-size:9px;
    color:var(--muted);
}

.stats{
    flex:1;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
}

.stats::-webkit-scrollbar{
    display:none;
}

.stat{
    min-width:108px;
    padding:9px 12px;
    border:1px solid var(--line);
    background:rgba(6,14,27,.8);
    backdrop-filter:blur(18px);
    border-radius:16px;
    box-shadow:var(--shadow);
}

.statLabel{
    color:#7e94ad;
    font-size:9px;
}

.statValue{
    margin-top:3px;
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
}

.statValue.good{color:var(--green)}
.statValue.warn{color:var(--yellow)}
.statValue.bad{color:var(--red)}
.statValue.blue{color:var(--cyan)}

#fps{
    min-width:70px;
}

/* =========================================================
   SIDE PANEL
========================================================= */

#sidePanel{
    position:absolute;
    top:96px;
    right:14px;
    z-index:20;
    width:315px;
    max-height:calc(100vh - 185px);
    overflow:hidden;
    border:1px solid var(--line);
    background:rgba(6,13,25,.86);
    backdrop-filter:blur(22px);
    border-radius:23px;
    box-shadow:var(--shadow);
}

.sideHead{
    padding:15px 17px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.sideTitle{
    font-weight:1000;
}

.sideContent{
    max-height:calc(100vh - 245px);
    overflow:auto;
    padding:13px;
}

.sideContent::-webkit-scrollbar,
.modalBody::-webkit-scrollbar,
#countryList::-webkit-scrollbar{
    width:5px;
}

.sideContent::-webkit-scrollbar-thumb,
.modalBody::-webkit-scrollbar-thumb,
#countryList::-webkit-scrollbar-thumb{
    background:#31445c;
    border-radius:20px;
}

.miniCountry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    margin-bottom:8px;
    border-radius:15px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.055);
}

.flag{
    font-size:25px;
}

.countryName{
    font-weight:900;
    font-size:13px;
}

.countryMeta{
    color:#8296ad;
    font-size:10px;
    margin-top:3px;
}

.powerBar{
    margin-top:7px;
    height:5px;
    border-radius:10px;
    overflow:hidden;
    background:#17263b;
}

.powerFill{
    height:100%;
    background:linear-gradient(90deg,#25bfff,#8a6cff);
}

/* =========================================================
   BOTTOM DOCK
========================================================= */

#dock{
    position:absolute;
    bottom:13px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    width:min(850px,calc(100vw - 24px));
    display:flex;
    gap:7px;
    padding:8px;
    border:1px solid var(--line);
    border-radius:23px;
    background:rgba(5,11,22,.9);
    backdrop-filter:blur(25px);
    box-shadow:0 20px 70px rgba(0,0,0,.55);
    overflow-x:auto;
    scrollbar-width:none;
}

#dock::-webkit-scrollbar{
    display:none;
}

.dockBtn{
    flex:1;
    min-width:75px;
    border:1px solid transparent;
    color:#a8bad0;
    background:transparent;
    border-radius:16px;
    padding:9px 8px;
    cursor:pointer;
    transition:.2s;
}

.dockBtn:hover{
    background:rgba(255,255,255,.07);
    color:#fff;
}

.dockIcon{
    display:block;
    font-size:20px;
    margin-bottom:4px;
}

.dockText{
    font-size:9px;
    font-weight:800;
}

/* =========================================================
   MAP HUD
========================================================= */

#mapHUD{
    position:absolute;
    left:15px;
    top:96px;
    z-index:15;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.hudBtn{
    width:44px;
    height:44px;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(5,12,23,.82);
    color:#d7e8fa;
    backdrop-filter:blur(15px);
    cursor:pointer;
    font-size:18px;
    box-shadow:var(--shadow);
}

.hudBtn.active{
    border-color:#31bfff;
    box-shadow:0 0 20px rgba(49,191,255,.25);
}

/* =========================================================
   TOAST
========================================================= */

#toastBox{
    position:absolute;
    top:92px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    width:min(430px,90vw);
    pointer-events:none;
}

.toast{
    margin-bottom:8px;
    padding:13px 16px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(7,15,28,.93);
    backdrop-filter:blur(20px);
    box-shadow:0 15px 50px rgba(0,0,0,.5);
    animation:toastIn .3s forwards;
    font-size:12px;
}

.toast.good{border-right:3px solid var(--green)}
.toast.bad{border-right:3px solid var(--red)}
.toast.info{border-right:3px solid var(--blue)}
.toast.warn{border-right:3px solid var(--yellow)}

@keyframes toastIn{
    from{transform:translateY(-15px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

/* =========================================================
   MODAL
========================================================= */

#modal{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:rgba(0,0,0,.57);
    backdrop-filter:blur(9px);
}

#modal.show{
    display:flex;
}

.modalBox{
    width:min(1100px,96vw);
    max-height:92vh;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.13);
    border-radius:27px;
    background:
      linear-gradient(145deg,rgba(15,25,44,.98),rgba(5,11,22,.98));
    box-shadow:0 40px 120px rgba(0,0,0,.7);
    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{transform:translateY(20px) scale(.97);opacity:0}
    to{transform:none;opacity:1}
}

.modalHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:17px 20px;
    border-bottom:1px solid var(--line);
}

.modalTitle{
    font-size:18px;
    font-weight:1000;
}

.close{
    width:38px;
    height:38px;
    border:0;
    border-radius:12px;
    color:#fff;
    background:rgba(255,255,255,.07);
    cursor:pointer;
    font-size:18px;
}

.modalBody{
    max-height:calc(92vh - 76px);
    overflow:auto;
    padding:18px;
}

/* =========================================================
   GRID / CARDS
========================================================= */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:11px;
}

.card{
    padding:15px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.035);
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:rgba(75,188,255,.35);
    background:rgba(255,255,255,.055);
}

.cardTop{
    display:flex;
    align-items:center;
    gap:10px;
}

.cardIcon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:rgba(44,161,255,.12);
    font-size:22px;
}

.cardName{
    font-weight:1000;
    font-size:13px;
}

.cardType{
    color:#7790a9;
    font-size:9px;
    margin-top:3px;
}

.cardDesc{
    color:#9badc1;
    line-height:1.7;
    font-size:10px;
    margin:10px 0;
}

.effects{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.effect{
    padding:5px 7px;
    border-radius:8px;
    font-size:9px;
    background:rgba(255,255,255,.05);
    color:#b8cce0;
}

.price{
    margin-top:11px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.priceText{
    color:#ffd85e;
    font-weight:900;
    font-size:11px;
}

.buyBtn{
    border:1px solid rgba(60,184,255,.3);
    border-radius:10px;
    padding:8px 12px;
    color:#fff;
    background:rgba(36,159,255,.14);
    cursor:pointer;
    font-weight:900;
    font-size:10px;
}

.buyBtn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.sectionTitle{
    margin:18px 0 10px;
    font-size:13px;
    color:#dbeaff;
    font-weight:1000;
}

/* =========================================================
   TABS
========================================================= */

.tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:14px;
    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{display:none}

.tab{
    flex:0 0 auto;
    padding:9px 14px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.035);
    color:#8fa4bb;
    border-radius:12px;
    cursor:pointer;
    font-size:10px;
    font-weight:900;
}

.tab.active{
    color:#fff;
    border-color:#2dbbff;
    background:rgba(35,166,255,.12);
}

/* =========================================================
   INPUTS
========================================================= */

.input,
.select{
    width:100%;
    padding:11px 13px;
    color:#fff;
    background:#0c1728;
    border:1px solid rgba(255,255,255,.09);
    border-radius:12px;
    outline:none;
}

.input:focus,
.select:focus{
    border-color:#2dbbff;
}

.bigBtn{
    border:0;
    padding:11px 17px;
    border-radius:13px;
    color:#fff;
    background:linear-gradient(135deg,#167ac2,#684de0);
    cursor:pointer;
    font-weight:1000;
}

.dangerBtn{
    background:linear-gradient(135deg,#a82c43,#642448);
}

.greenBtn{
    background:linear-gradient(135deg,#128e65,#136b79);
}

/* =========================================================
   COUNTRY SELECT
========================================================= */

.countryGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:9px;
    max-height:65vh;
    overflow:auto;
}

.countryPick{
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.035);
    border-radius:15px;
    cursor:pointer;
}

.countryPick:hover{
    background:rgba(42,175,255,.09);
    border-color:#2ab4ff;
}

.countryPick .flag{
    font-size:24px;
}

.countryPickName{
    font-weight:900;
    font-size:11px;
}

.countryPickPop{
    color:#7f95ac;
    font-size:9px;
    margin-top:3px;
}

/* =========================================================
   WAR / TRUCE
========================================================= */

.warCard{
    padding:17px;
    margin-bottom:10px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.035);
}

.warHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.warNames{
    font-weight:1000;
}

.statusPill{
    padding:5px 8px;
    border-radius:8px;
    font-size:9px;
    font-weight:900;
}

.statusPill.war{
    background:rgba(255,60,85,.13);
    color:#ff7184;
}

.statusPill.truce{
    background:rgba(55,223,147,.12);
    color:#54e9a3;
}

.statusPill.pending{
    background:rgba(255,210,80,.12);
    color:#ffdc6c;
}

.progress{
    height:7px;
    background:#17263a;
    border-radius:99px;
    overflow:hidden;
    margin-top:11px;
}

.progressFill{
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,#ff4c67,#ff9b4e);
}

.warActions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px;
}

.smallBtn{
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    color:#dcecff;
    padding:8px 11px;
    border-radius:10px;
    cursor:pointer;
    font-size:9px;
    font-weight:900;
}

/* =========================================================
   STRAITS
========================================================= */

.straitGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:11px;
}

.straitCard{
    position:relative;
    overflow:hidden;
    padding:16px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.09);
    background:
      radial-gradient(circle at 90% 10%,rgba(41,184,255,.14),transparent 45%),
      rgba(255,255,255,.035);
}

.straitCard.closed{
    border-color:rgba(255,74,101,.55);
    box-shadow:inset 0 0 30px rgba(255,50,80,.06);
}

.straitName{
    font-size:14px;
    font-weight:1000;
}

.straitMeta{
    color:#8197ad;
    font-size:9px;
    margin-top:4px;
}

.straitStats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:13px;
}

.straitStat{
    padding:8px;
    border-radius:10px;
    background:rgba(255,255,255,.04);
}

.straitStat b{
    display:block;
    font-size:11px;
    color:#fff;
}

.straitStat span{
    color:#7890a7;
    font-size:8px;
}

.straitStatus{
    margin-top:12px;
    font-size:10px;
}

.closedText{
    color:#ff657b;
}

.openText{
    color:#42e49a;
}

/* =========================================================
   PEACE TIMER
========================================================= */

.timerBox{
    margin-top:13px;
    padding:12px;
    border-radius:13px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
}

.timerNumber{
    font-size:18px;
    font-weight:1000;
    color:#5bd6ff;
}

.timerLabel{
    color:#7c92a9;
    font-size:9px;
}

/* =========================================================
   COUNTRY INFO
========================================================= */

.profileHero{
    display:flex;
    align-items:center;
    gap:15px;
    padding:17px;
    border-radius:20px;
    background:
      radial-gradient(circle at 10% 20%,rgba(39,181,255,.13),transparent 40%),
      rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);
}

.profileFlag{
    font-size:48px;
}

.profileName{
    font-size:22px;
    font-weight:1000;
}

.profileCode{
    color:#7891a8;
    font-size:10px;
}

.kpiGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
    gap:9px;
    margin-top:12px;
}

.kpi{
    padding:13px;
    border-radius:15px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
}

.kpiLabel{
    color:#788fa7;
    font-size:9px;
}

.kpiValue{
    margin-top:5px;
    font-size:15px;
    font-weight:1000;
}

/* =========================================================
   NOTIFICATION CENTER
========================================================= */

.newsItem{
    padding:12px;
    border-radius:14px;
    margin-bottom:8px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
}

.newsTime{
    color:#5cbef0;
    font-size:8px;
}

.newsTitle{
    margin-top:4px;
    font-weight:900;
    font-size:11px;
}

.newsText{
    margin-top:4px;
    color:#8ea2b8;
    line-height:1.7;
    font-size:9px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){
    #sidePanel{
        width:280px;
    }

    .brand{
        min-width:165px;
    }

    .stat{
        min-width:95px;
    }
}

@media(max-width:650px){
    #topBar{
        top:7px;
        left:7px;
        right:7px;
        flex-wrap:wrap;
    }

    .brand{
        width:100%;
        min-width:0;
    }

    .stats{
        width:100%;
    }

    #sidePanel{
        top:auto;
        bottom:82px;
        right:7px;
        width:calc(100vw - 14px);
        max-height:230px;
        transform:translateY(calc(100% + 15px));
        transition:.3s;
    }

    #sidePanel.open{
        transform:none;
    }

    .sideContent{
        max-height:165px;
    }

    #mapHUD{
        top:150px;
        left:7px;
    }

    .hudBtn{
        width:39px;
        height:39px;
    }

    #dock{
        bottom:7px;
        width:calc(100vw - 14px);
    }

    .dockBtn{
        min-width:66px;
        padding:7px 4px;
    }

    .modalBox{
        width:98vw;
        max-height:94vh;
        border-radius:20px;
    }

    .modalBody{
        max-height:calc(94vh - 70px);
        padding:12px;
    }

/* =========================================================
   INITIALIZE COUNTRIES
========================================================= */

function codeFromFeature(feature){
    const p=feature.properties||{};

    return String(
        p.ISO_A3 ||
        p.iso_a3 ||
        p.ADM0_A3 ||
        p.ISO3 ||
        p.iso3 ||
        ""
    ).toUpperCase();
}

function nameFromFeature(feature){
    const p=feature.properties||{};
    return p.ADMIN ||
           p.NAME ||
           p.NAME_EN ||
           p.name ||
           p.SOVEREIGNT ||
           "کشور ناشناس";
}

function flagFromCode(code){
    if(!code || code.length!==3) return "🌐";
    const mapCode={
        UKR:"UA",
        USA:"US",
        RUS:"RU",
        IRN:"IR",
        CHN:"CN",
        TUR:"TR",
        DEU:"DE",
        FRA:"FR",
        GBR:"GB"
    };

    const cc=mapCode[code]||code.slice(0,2);

    return cc.length===2
      ? String.fromCodePoint(
          ...[...cc].map(c=>127397+c.charCodeAt(0))
        )
      : "🌐";
}

function ensureCountry(code,name,pop){
    if(!code) return;

    if(!countryDB[code]){
        countryDB[code]={
            name:name||code,
            pop:pop||5,
            flag:flagFromCode(code)
        };
    }
}

/* =========================================================
   LOAD MAP
========================================================= */

fetch(MAP_GEOJSON)
.then(r=>r.json())
.then(data=>{
    geoData=data;

    data.features.forEach(f=>{
        const code=codeFromFeature(f);
        const name=nameFromFeature(f);

        ensureCountry(
            code,
            name,
            countryDB[code]?.pop || 5
        );
    });

    geoLayer=L.geoJSON(data,{
        style:countryStyle,

        onEachFeature:(feature,layer)=>{
            layer.on({
                click:()=>{
                    const code=codeFromFeature(feature);
                    const name=nameFromFeature(feature);
                    showCountryInfo(code,name);
                },

                mouseover:e=>{
                    e.target.setStyle({
                        weight:2,
                        color:"#ffffff",
                        fillOpacity:.76
                    });
                },

                mouseout:e=>{
                    geoLayer.resetStyle(e.target);
                }
            });
        }
    }).addTo(map);

    initMapState();
    setLoader(100,"جهان آماده است");
    setTimeout(()=>{
        $("loading").classList.add("hide");
    },500);
})
.catch(err=>{
    console.error(err);
    setLoader(100,"نقشه بارگذاری نشد؛ حالت جایگزین فعال شد");
    setTimeout(()=>{
        $("loading").classList.add("hide");
    },1000);
});

/* =========================================================
   MAP COLORS
========================================================= */

const palette=[
    "#244f8f","#6b3d87","#246c68","#8a5b2d",
    "#425b8a","#5f437d","#2f765c","#805146",
    "#315b72","#75466a","#50783d","#6c6b35",
    "#3d5575","#794b3d","#356c77","#634a79"
];

function hashCode(str){
    let h=0;
    for(let i=0;i<str.length;i++){
        h=((h<<5)-h)+str.charCodeAt(i);
        h|=0;
    }
    return Math.abs(h);
}

function countryColor(code){
    if(S.ownedCountries.includes(code)){
        return "#d9364f";
    }

    const idx=hashCode(code||"x")%palette.length;
    return palette[idx];
}

function countryStyle(feature){
    const code=codeFromFeature(feature);

    let fill=countryColor(code);

    if(mapMode==="economy"){
        const db=countryDB[code];
        const value=Math.min(100,(db?.pop||1)/15);
        fill=`hsl(${200-value*1.5},65%,${35+value*.25}%)`;
    }

    if(mapMode==="military"){
        const val=hashCode(code)%70;
        fill=`hsl(${340-val*.9},70%,${35+val*.3}%)`;
    }

    if(mapMode==="stability"){
        const val=45+(hashCode(code)%50);
        fill=`hsl(${val*1.1},55%,40%)`;
    }

    return{
        fillColor:fill,
        weight:1,
        color:"rgba(255,255,255,.28)",
        fillOpacity:.72
    };
}

function recolor(){
    if(!geoLayer) return;
    geoLayer.setStyle(countryStyle);
}

function startGame(code){
    S.started=true;
    S.playerCode=code;

    if(!countryDB[code]){
        ensureCountry(code,"کشور شما",50);
    }

    S.population=countryDB[code]?.pop||50;

    S.ownedCountries=[code];

    S.money=Math.round(
        5000+
        S.population*45+
        Math.random()*3000
    );

    S.production=Math.round(
        80+
        Math.sqrt(S.population)*12
    );

    S.power=Math.round(
        60+
        Math.sqrt(S.population)*7
    );

    S.reputation=60;
    S.stability=76;
    S.satisfaction=74;

    S.news.unshift({
        year:S.year,
        day:S.day,
        title:"آغاز حکومت جدید",
        text:`فرماندهی ${countryDB[code]?.name||code} آغاز شد.`
    });

    saveGame();

    render();
    recolor();

    toast(
        `حکومت ${countryDB[code]?.name||code} آغاز شد.`,
        "good"
    );
}

let storeTab="all";

        ["gov","دولت"],
        ["economy","اقتصاد"]
    ];

    const cards=UPGRADES
      .filter(u=>tab==="all"||u.cat===tab)
      .map(u=>{
          const level=S.upgrades[u.id]||0;
          const cost=Math.round(u.cost*Math.pow(1.55,level));
          const effects=Object.entries(u.effects)
             .map(([k,v])=>{
                 const names={
                    power:"قدرت",
                    production:"تولید",
                    technology:"فناوری",
                    stability:"ثبات",
                    satisfaction:"رضایت",
                    reputation:"اعتبار",
                    population:"جمعیت",
                    inflation:"تورم",
                    infrastructure:"زیرساخت",
                    warExhaustion:"فرسایش جنگ"
                 };

                 const sign=v>=0?"+":"";
                 return `<span class="effect">
                    ${names[k]||k}: ${sign}${v}
                 </span>`;
             }).join("");

          return `
            <div class="card">
                <div class="cardTop">

                    <div class="priceText">
                        💰 ${formatMoney(cost)}
                    </div>

                    <button class="buyBtn"
                        ${S.money<cost?"disabled":""}
                        onclick="buyUpgrade('${u.id}')">
                        ارتقا
                    </button>
                </div>
            </div>
          `;
      }).join("");

    openModal("🏗️ مرکز توسعه — 100+ ارتقا",`
        <div class="tabs">
            ${tabs.map(t=>`
                <button class="tab ${tab===t[0]?"active":""}"

                  ${t[1]}
                </button>
            `).join("")}
        </div>

            ${cards}
        </div>
    `);
}

function catName(c){
    return{
        army:"ارتش",
        infra:"زیرساخت",
        gov:"دولت",
        economy:"اقتصاد"
    }[c]||c;
}

function buyUpgrade(id){
    const u=UPGRADES.find(x=>x.id===id);
    if(!u) return;

    const level=S.upgrades[id]||0;
    const cost=Math.round(u.cost*Math.pow(1.55,level));

    if(S.money<cost){
        toast("سرمایه کافی نیست.","bad");
        return;
    }

    S.money-=cost;
    S.upgrades[id]=level+1;

    Object.entries(u.effects).forEach(([key,val])=>{
        if(typeof S[key]==="number"){
            S[key]+=val;
        }
    });

    clampState();

    toast(
        `${u.icon} ${u.name} به سطح ${level+1} رسید.`,
        "good"
    );

    addNews(
        "توسعه جدید",
        `${u.name} در کشور شما توسعه یافت.`
    );

    openStore(storeTab);
    render();
}

function declareWar(enemy){
    if(!S.started) return;

    if(enemy===S.playerCode){
        toast("نمی‌توانی با خودت وارد جنگ شوی.","bad");
        return;
    }

    const existing=S.wars.find(
        w=>w.status==="war" &&
        w.enemy===enemy
    );

    if(existing){
        toast("با این کشور در حال جنگ هستی.","warn");
        return;
    }

    const truce=S.truces.find(
        t=>t.enemy===enemy &&
        daysUntil(t.end)>0
    );

    if(truce){
        toast("با این کشور هنوز آتش‌بس برقرار است.","bad");
        return;
    }

    if(S.command<10){
        toast("امتیاز فرماندهی کافی نیست.","bad");
        return;
    }

    S.command-=10;

    const id=
      "WAR-"+Date.now()+"-"+Math.floor(Math.random()*999);

    S.wars.push({
        id,
        enemy,
        status:"war",
        score:0,
        start:{year:S.year,day:S.day},
        intensity:1
    });

    S.warExhaustion+=2;

    addNews(
        "بحران نظامی",
        `جنگ میان ${countryDB[S.playerCode]?.name} و ${countryDB[enemy]?.name||enemy} آغاز شد.`
    );

    toast("جنگ آغاز شد.","bad");

    openWars();
    render();
}

/* abstract battle simulation */
function continueWar(id){
    const w=S.wars.find(x=>x.id===id);
    if(!w) return;

    if(S.command<4){
        toast("فرماندهی کافی نیست.","bad");
        return;
    }

    S.command-=4;

    const enemyPower=
        50+
        Math.sqrt(countryDB[w.enemy]?.pop||10)*6+
        hashCode(w.enemy)%80;

    const playerPower=
        S.power+
        S.technology*.5+
        Math.random()*80;

    const delta=(playerPower-enemyPower)/18;

    w.score+=delta;

    S.warExhaustion+=1.2;

    if(w.score>=100){
        winWar(w);
    }else if(w.score<=-100){
        loseWar(w);
    }else{
        toast(
          delta>=0
            ?"عملیات جنگی موفق بود و امتیاز جنگ افزایش یافت."
            :"طرف مقابل دست بالا را پیدا کرد.",
          delta>=0?"good":"warn"
        );

        addNews(
            "گزارش جبهه",
            `امتیاز جنگ با ${countryDB[w.enemy]?.name||w.enemy}: ${Math.round(w.score)}`
        );
    }

    clampState();
    openWars();
    render();
}

function winWar(w){
    w.status="won";

    const enemy=w.enemy;

    const reward=Math.round(
        1200+
        (countryDB[enemy]?.pop||10)*18
    );

    S.money+=reward;
    S.reputation+=5;
    S.power+=10;

    if(Math.random()<.72){
        S.ownedCountries.push(enemy);

        toast(
            `پیروزی! ${countryDB[enemy]?.name||enemy} تحت کنترل شما درآمد.`,
            "good"
        );
    }else{
        toast(
            "پیروزی حاصل شد و توافق سیاسی شکل گرفت.",
            "good"
        );
    }

    addNews(
        "پیروزی",
        `جنگ با ${countryDB[enemy]?.name||enemy} به پایان رسید.`
    );

    createTruce(enemy,60);
}

function loseWar(w){
    w.status="lost";

    S.money=Math.max(0,S.money-800);
    S.reputation-=7;
    S.stability-=4;

    toast("جنگ با شکست پایان یافت.","bad");

    addNews(
        "شکست نظامی",
        `جنگ با ${countryDB[w.enemy]?.name||w.enemy} پایان یافت.`
    );

    createTruce(w.enemy,60);
}

function peaceTreaty(id){
    const w=S.wars.find(x=>x.id===id);
    if(!w) return;

    const enemy=countryDB[w.enemy]?.name||w.enemy;

    const reward=
      w.score>30
      ? Math.round(500+w.score*8)
      : 0;

    S.money+=reward;

    toast(
        `پیمان صلح با ${enemy} امضا شد.`,
        "good"
    );

    addNews(
        "پیمان صلح",
        `درگیری با ${enemy} با پیمان صلح خاتمه یافت.`
    );

    createTruce(w.enemy,45);

    w.status="peace";

    openWars();
    render();
}

function offerTruce(id,days){
    const w=S.wars.find(x=>x.id===id);
    if(!w) return;

    if(S.command<5){
        toast("فرماندهی کافی نیست.","bad");
        return;
    }

    S.command-=5;

    createTruce(w.enemy,days);

    w.status="truce";

    addNews(
        "آتش‌بس",
        `آتش‌بس ${days} روزه با ${countryDB[w.enemy]?.name||w.enemy} برقرار شد.`
    );

    toast(`آتش‌بس ${days} روزه برقرار شد.`,"good");

    openWars();
    render();
}

/* =========================================================
   TRUCE SYSTEM
========================================================= */

function currentDayNumber(){
    return S.year*365+S.day;
}

function dateToNumber(d){
    return d.year*365+d.day;
}

function daysUntil(end){
    return Math.max(
        0,
        dateToNumber(end)-currentDayNumber()
    );
}

function futureDate(days){
    let y=S.year;
    let d=S.day+days;

    while(d>365){
        d-=365;
        y++;
    }

    return {year:y,day:d};
}

function createTruce(enemy,days){
    const end=futureDate(days);

    const existing=S.truces.find(t=>t.enemy===enemy);

    if(existing){
        existing.end=end;
    }else{
        S.truces.push({
            enemy,
            end
        });
    }
}

function updateTruces(){
    S.truces=S.truces.filter(
        t=>daysUntil(t.end)>0
    );
}

function toggleStrait(id){
    const s=STRAITS.find(x=>x.id===id);
    if(!s) return;

    const owner=
        S.ownedCountries.find(c=>s.control.includes(c));

    if(!owner){
        toast("این مسیر تحت کنترل شما نیست.","bad");
        return;
    }

    if(!S.straits[id]){
        S.straits[id]={
            closed:false,
            lastIncome:0
        };
    }

    S.straits[id].closed=!S.straits[id].closed;

    const state=S.straits[id].closed;

    if(state){
        S.reputation+=1;

        addNews(
            "کنترل مسیر",
            `${s.name} بسته شد و درآمد کنترلی افزایش یافت.`
        );

        toast(
            `${s.name} بسته شد. درآمد کنترلی فعال شد.`,
            "warn"
        );
    }else{
        addNews(
            "بازگشایی مسیر",
            `${s.name} دوباره باز شد.`
        );

        toast(
            `${s.name} باز شد و تجارت آزادتر شد.`,
            "good"
        );
    }

    openStraits();
    render();
}

function processStraits(){
    STRAITS.forEach(s=>{
        const owner=
          S.ownedCountries.find(c=>s.control.includes(c));

        if(!owner) return;

        if(!S.straits[s.id]){
            S.straits[s.id]={
                closed:false,
                lastIncome:0
            };
        }

        let income=s.income;

        if(S.straits[s.id].closed){
            income*=1.75;

            S.money+=income;

            S.reputation+=s.prestige*.015;

            S.straits[s.id].lastIncome=income;

            addNews(
                "درآمد تنگه",
                `کنترل ${s.name}: +${Math.round(income)} سرمایه`
            );
        }else{
            income*=.55;

            S.money+=income;

            S.production+=s.trade*.015;

            S.straits[s.id].lastIncome=income;
        }
    });
}

function focusStrait(id){
    const s=STRAITS.find(x=>x.id===id);
    if(!s) return;

    map.setView([s.lat,s.lng],5,{

/* =========================================================
   TIME ENGINE
========================================================= */

/*
    زمان بازی سریع است:
    هر 1 ثانیه = تقریبا یک روز بازی
*/

const DAY_MS=1000;

let lastDayTime=performance.now();
let accumulated=0;

function gameLoop(now){
    if(S.started && S.settings.autoTime){

        const delta=now-lastDayTime;
        lastDayTime=now;

        accumulated+=delta;

        const interval=
            DAY_MS/
            Math.max(1,S.settings.speed);

        while(accumulated>=interval){
            accumulated-=interval;
            nextDay(true);
        }
    }else{
        lastDayTime=now;
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

function nextDay(auto=false){
    if(!S.started) return;

    S.day++;

    if(S.day>365){
        S.day=1;
        S.year++;

        addNews(
            "سال جدید",
            `سال ${S.year} آغاز شد.`
        );
    }

    S.hour=0;

    /* economy */
    let income=
        S.production*
        .55+
        S.population*
        .18+
        30;

    income*=(1-Math.max(0,S.inflation)/100);

    S.money+=income;

    /* population */
    S.population+=
        Math.max(
            .01,
            S.population*
            (.00008+
            S.stability*.000001)
        );

    /* passive stats */
    S.production+=
        S.infrastructure*.002;

    S.command+=
        .6;

    S.reputation+=
        .015;

    S.warExhaustion=
        Math.max(
            0,
            S.warExhaustion-
            .08
        );

    /* stability */
    if(S.satisfaction>65){
        S.stability+=.025;
    }else{
        S.stability-=.04;
    }

    /* inflation drift */
    S.inflation+=
        (S.production>1000?.001:.008);

    /* war simulation */
    simulateWars();

    /* truce */
    updateTruces();

    /* straits */
    processStraits();

    /* random world events */
    if(S.day%5===0){
        worldEvent();
    }

    clampState();

    if(S.day%3===0){
        saveGame();
    }

    render();

    if(!auto){
        toast("یک روز گذشت.","info");
    }
}

/* =========================================================
   WAR AUTO SIMULATION
========================================================= */

function simulateWars(){
    S.wars
      .filter(w=>w.status==="war")
      .forEach(w=>{

        const enemyPower=
            40+
            Math.sqrt(
                countryDB[w.enemy]?.pop||10
            )*5+
            hashCode(w.enemy)%70;

        const advantage=
            S.power+
            S.technology*.45+
            S.armies.air*2+
            S.armies.navy*1.5+
            Math.random()*30-
            enemyPower;

        w.score+=advantage/80;

        S.warExhaustion+=.06;

        if(w.score>=100){
            winWar(w);
        }

        if(w.score<=-100){
            loseWar(w);
        }
    });
}

/* =========================================================
   FPS / GRAPHICS
========================================================= */

const canvas=$("fxCanvas");
const ctx=canvas.getContext("2d");

let particles=[];
let fpsFrames=0;
let fpsLast=performance.now();

function resizeCanvas(){
    const dpr=
        S.settings.quality==="ultra"
        ?Math.min(devicePixelRatio||1,2)
        :1;

    canvas.width=innerWidth*dpr;
    canvas.height=innerHeight*dpr;
    canvas.style.width=innerWidth+"px";
    canvas.style.height=innerHeight+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    createParticles();
}

window.addEventListener("resize",resizeCanvas);

function createParticles(){
    const count=
        S.settings.quality==="ultra"
        ?120
        :S.settings.quality==="high"
          ?70
          :35;

    particles=[];

    for(let i=0;i<count;i++){
        particles.push({
            x:Math.random()*innerWidth,
            y:Math.random()*innerHeight,
            r:Math.random()*1.5+.2,
            vx:(Math.random()-.5)*.18,
            vy:(Math.random()-.5)*.18,
            a:Math.random()*.4+.1
        });
    }
}

function animateFX(time){
    ctx.clearRect(0,0,innerWidth,innerHeight);

    if(S.settings.quality!=="low"){
        for(const p of particles){
            p.x+=p.vx;
            p.y+=p.vy;

            if(p.x<0)p.x=innerWidth;
            if(p.x>innerWidth)p.x=0;
            if(p.y<0)p.y=innerHeight;
            if(p.y>innerHeight)p.y=0;

            ctx.beginPath();
            ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle=
                `rgba(85,190,255,${p.a})`;
            ctx.fill();
        }
    }

    fpsFrames++;

    if(time-fpsLast>=1000){
        const fps=fpsFrames;
        fpsFrames=0;
        fpsLast=time;

        $("fpsStat").textContent=fps;

        if(fps<28 &&
           S.settings.quality==="ultra"){
            S.settings.quality="high";
            createParticles();

            toast(
                "برای حفظ روانی، کیفیت به High کاهش یافت.",
                "warn"
            );
        }
    }

    requestAnimationFrame(animateFX);
}

resizeCanvas();
requestAnimationFrame(animateFX);

function loadGame(){
    try{
        const raw=
          localStorage.getItem(
            "WORLD_EMPIRE_ULTRA_SAVE"
          );

        if(!raw){
            openCountrySelector();
            return;
        }

        const loaded=JSON.parse(raw);

        S=Object.assign(
            {},
            S,
            loaded
        );

        S.armies=Object.assign(
            {
                infantry:10,
                armor:5,
                artillery:4,
                air:3,
                drone:2,
                navy:2,
                recon:2,
                logistics:3
            },
            loaded.armies||{}
        );

        S.upgrades=loaded.upgrades||{};
        S.ownedCountries=loaded.ownedCountries||[];
        S.wars=loaded.wars||[];
        S.truces=loaded.truces||[];
        S.diplomacy=loaded.diplomacy||{};
        S.straits=loaded.straits||{};
        S.news=loaded.news||[];

        render();
        recolor();

        toast("بازی ذخیره‌شده بارگذاری شد.","good");
    }catch(e){
        console.error(e);
        openCountrySelector();
    }
}

/* =========================================================

function formatMoney(n){
    n=Math.round(n||0);

    if(n>=1e9){
        return (n/1e9).toFixed(2)+"B";
    }

    if(n>=1e6){
        return (n/1e6).toFixed(2)+"M";
    }

    if(n>=1e3){
        return (n/1e3).toFixed(1)+"K";
    }

    return n.toLocaleString("en-US");
}

function formatNum(n){
    if(n>=1000){
        return (n/1000).toFixed(1)+"B";
    }

    if(n>=100){
        return n.toFixed(1);
    }

    if(n>=10){
        return n.toFixed(1);
    }

    return n.toFixed(2);
}

function clampState(){
    S.money=Math.max(0,S.money);

    S.reputation=
        Math.max(
            0,
            Math.min(100,S.reputation)
        );

    S.stability=
        Math.max(
            0,
            Math.min(100,S.stability)
        );

    S.satisfaction=
        Math.max(
            0,
            Math.min(100,S.satisfaction)
        );

    S.inflation=
        Math.max(
            -5,
            Math.min(100,S.inflation)
        );

    S.command=
        Math.max(
            0,
            Math.min(200,S.command)
        );

    S.warExhaustion=
        Math.max(
            0,
            Math.min(100,S.warExhaustion)
        );

    S.technology=
        Math.max(
            0,
            S.technology
        );

    S.production=
        Math.max(
            1,
            S.production
        );

    S.power=
        Math.max(
            1,
            S.power
        );
}

function toast(text,type="info"){
    const el=document.createElement("div");

    el.className=`toast ${type}`;
    el.textContent=text;

    toastBox.appendChild(el);

    setTimeout(()=>{
        el.style.opacity="0";
        el.style.transform="translateY(-10px)";

        setTimeout(()=>{
            el.remove();
        },300);
    },2600);
}

========================================================= */

setInterval(()=>{
    if(!S.started) return;

    /*
      اقتصاد پویا
    */

    const efficiency=
        1+
        S.technology*.002+
        S.stability*.001;

    S.production+=
        .015*efficiency;

    /*
      رضایت
    */

    if(S.inflation>8){
        S.satisfaction-=.01;
    }

    if(S.production>500){
        S.satisfaction+=.005;
