<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>WORLD EMPIRE — MODERN ERA</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root{
    --bg:#030711;
    --panel:rgba(7,14,27,.91);
    --panel2:rgba(13,24,43,.97);
    --line:rgba(255,255,255,.09);

    --text:#edf8ff;
    --muted:#7890a9;

    --blue:#39b8ff;
    --cyan:#31e7ff;
    --green:#35e99b;
    --yellow:#ffd65e;
    --red:#ff536e;
    --purple:#a477ff;
    --orange:#ff9b52;

    --shadow:
        0 18px 70px rgba(0,0,0,.55);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;

    background:var(--bg);
    color:var(--text);

    font-family:
        Tahoma,
        Arial,
        "Segoe UI",
        sans-serif;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* ======================================================
MAP
====================================================== */

#map{
    position:absolute;
    inset:0;
    z-index:1;
    background:#06111d;
}

.leaflet-container{
    background:#06111d;
}

.leaflet-control-zoom{
    display:none;
}

.leaflet-control-attribution{
    background:rgba(0,0,0,.65)!important;
    color:#6f849c!important;
}

.leaflet-control-attribution a{
    color:#35c6ff!important;
}

/* ======================================================
BACKGROUND FX
====================================================== */

#fx{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#vignette{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 35%,
            rgba(0,0,0,.18) 65%,
            rgba(0,0,0,.7) 110%
        );
}

#scanlines{
    position:absolute;
    inset:0;
    z-index:4;
    pointer-events:none;

    opacity:.04;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            #fff 4px
        );
}

/* ======================================================
LOADING
====================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            #15375b 0,
            #07101f 35%,
            #02050b 80%
        );

    transition:.6s;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
}

.loader{
    width:min(620px,90vw);
    padding:42px;

    border-radius:30px;
    border:1px solid rgba(255,255,255,.11);

    background:
        linear-gradient(
            145deg,
            rgba(16,29,52,.88),
            rgba(4,10,21,.92)
        );

    backdrop-filter:blur(25px);

    box-shadow:
        0 40px 140px rgba(0,0,0,.75);

    text-align:center;
}

.logo{
    font-size:clamp(30px,7vw,62px);
    font-weight:1000;

    letter-spacing:3px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #32c6ff,
            #9575ff,
            #37e7a2,
            #fff
        );

    background-size:300%;

    -webkit-background-clip:text;
    color:transparent;

    animation:logoMove 4s linear infinite;
}

@keyframes logoMove{
    to{
        background-position:300%;
    }
}

.loaderSub{
    color:#7890a9;
    font-size:11px;
    margin-top:7px;
    letter-spacing:3px;
}

.loaderBar{
    height:7px;
    margin-top:30px;

    background:#102138;
    border-radius:99px;

    overflow:hidden;
}

.loaderFill{
    width:0%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #26bbff,
            #786eff,
            #33e69c
        );

    box-shadow:
        0 0 25px #32bfff;

    transition:.25s;
}

.loaderText{
    color:#7891ab;
    font-size:10px;
    margin-top:14px;
}

/* ======================================================
TOP BAR
====================================================== */

#top{
    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    z-index:20;

    display:flex;
    align-items:stretch;

    gap:8px;

    pointer-events:none;
}

.brand{
    min-width:220px;

    padding:11px 16px;

    background:
        rgba(4,11,22,.88);

    border:
        1px solid var(--line);

    border-radius:19px;

    backdrop-filter:blur(22px);

    box-shadow:var(--shadow);
}

.brandName{
    font-size:16px;
    font-weight:1000;
}

.brandSub{
    font-size:8px;
    color:#7187a0;

    margin-top:4px;

    letter-spacing:1px;
}

.stats{
    flex:1;

    display:flex;
    gap:7px;

    overflow-x:auto;

    scrollbar-width:none;
}

.stats::-webkit-scrollbar{
    display:none;
}

.stat{
    min-width:105px;

    padding:9px 11px;

    background:
        rgba(4,11,22,.86);

    border:
        1px solid var(--line);

    border-radius:17px;

    backdrop-filter:blur(20px);

    box-shadow:var(--shadow);
}

.statLabel{
    color:#71869f;
    font-size:8px;
}

.statValue{
    font-size:13px;
    font-weight:1000;
    margin-top:4px;

    white-space:nowrap;
}

.green{
    color:var(--green);
}

.blue{
    color:var(--cyan);
}

.yellow{
    color:var(--yellow);
}

.red{
    color:var(--red);
}

/* ======================================================
LEFT HUD
====================================================== */

#mapHud{
    position:absolute;

    top:93px;
    left:12px;

    z-index:20;

    display:flex;
    flex-direction:column;

    gap:6px;
}

.hud{
    width:43px;
    height:43px;

    border-radius:14px;

    color:#d8ebff;

    background:
        rgba(5,13,26,.9);

    border:
        1px solid var(--line);

    backdrop-filter:blur(18px);

    box-shadow:var(--shadow);

    font-size:17px;
}

.hud:hover,
.hud.active{
    border-color:#39bfff;

    background:
        rgba(33,157,228,.14);

    box-shadow:
        0 0 25px rgba(45,190,255,.25);
}

/* ======================================================
RIGHT PANEL
====================================================== */

#panel{
    position:absolute;

    top:93px;
    right:12px;

    width:300px;
    max-height:calc(100vh - 180px);

    z-index:20;

    border:
        1px solid var(--line);

    background:
        rgba(5,12,24,.91);

    border-radius:22px;

    overflow:hidden;

    backdrop-filter:blur(24px);

    box-shadow:var(--shadow);
}

.panelHead{
    padding:14px 15px;

    border-bottom:
        1px solid var(--line);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.panelTitle{
    font-size:12px;
    font-weight:1000;
}

.panelBody{
    padding:11px;

    max-height:
        calc(100vh - 240px);

    overflow:auto;
}

.panelBody::-webkit-scrollbar,
.modalBody::-webkit-scrollbar{
    width:4px;
}

.panelBody::-webkit-scrollbar-thumb,
.modalBody::-webkit-scrollbar-thumb{
    background:#304359;
    border-radius:20px;
}

.countryMini{
    padding:10px;

    margin-bottom:7px;

    display:flex;
    align-items:center;

    gap:9px;

    border-radius:14px;

    border:
        1px solid rgba(255,255,255,.05);

    background:
        rgba(255,255,255,.03);
}

.flag{
    font-size:25px;
}

.countryMiniName{
    font-size:11px;
    font-weight:900;
}

.countryMiniMeta{
    color:#748ba3;
    font-size:8px;
    margin-top:2px;
}

.miniBar{
    margin-top:6px;
    height:4px;

    background:#13243a;

    border-radius:20px;

    overflow:hidden;
}

.miniFill{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #31bdff,
            #9c6dff
        );
}

/* ======================================================
BOTTOM DOCK
====================================================== */

#dock{
    position:absolute;

    bottom:10px;

    left:50%;

    transform:translateX(-50%);

    width:
        min(930px,calc(100vw - 20px));

    z-index:30;

    padding:7px;

    display:flex;

    gap:5px;

    overflow-x:auto;

    scrollbar-width:none;

    border:
        1px solid var(--line);

    border-radius:23px;

    background:
        rgba(4,10,20,.92);

    backdrop-filter:blur(25px);

    box-shadow:
        0 20px 80px rgba(0,0,0,.7);
}

#dock::-webkit-scrollbar{
    display:none;
}

.dockBtn{
    min-width:70px;
    flex:1;

    border:0;

    color:#8fa4bc;

    background:transparent;

    padding:7px 6px;

    border-radius:15px;

    transition:.2s;
}

.dockBtn:hover{
    background:
        rgba(255,255,255,.06);

    color:#fff;
}

.dockIcon{
    display:block;
    font-size:19px;
}

.dockText{
    display:block;
    margin-top:4px;

    font-size:8px;
    font-weight:900;
}

/* ======================================================
MODAL
====================================================== */

#modal{
    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:14px;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:blur(9px);
}

#modal.show{
    display:flex;
}

.modal{
    width:min(1150px,97vw);

    max-height:93vh;

    border-radius:26px;

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,.11);

    background:
        linear-gradient(
            145deg,
            rgba(15,27,47,.98),
            rgba(4,10,20,.99)
        );

    box-shadow:
        0 50px 160px rgba(0,0,0,.75);

    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.97) translateY(15px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.modalHead{
    padding:15px 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
        1px solid var(--line);
}

.modalTitle{
    font-size:16px;
    font-weight:1000;
}

.close{
    width:36px;
    height:36px;

    border:0;

    border-radius:11px;

    color:#fff;

    background:
        rgba(255,255,255,.07);

    font-size:17px;
}

.modalBody{
    padding:17px;

    max-height:
        calc(93vh - 68px);

    overflow:auto;
}

/* ======================================================
CARDS
====================================================== */

.grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );

    gap:10px;
}

.card{
    padding:14px;

    border-radius:18px;

    border:
        1px solid rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.03);

    transition:.2s;
}

.card:hover{
    background:
        rgba(255,255,255,.05);

    border-color:
        rgba(60,190,255,.35);

    transform:
        translateY(-2px);
}

.cardHeader{
    display:flex;
    gap:9px;
    align-items:center;
}

.cardIcon{
    width:41px;
    height:41px;

    flex:none;

    display:grid;
    place-items:center;

    border-radius:12px;

    font-size:21px;

    background:
        rgba(40,177,255,.1);
}

.cardName{
    font-size:11px;
    font-weight:1000;
}

.cardSub{
    color:#7188a0;

    font-size:8px;

    margin-top:3px;
}

.cardText{
    color:#8ea2b8;

    font-size:9px;

    line-height:1.8;

    margin:
        10px 0;
}

.tags{
    display:flex;

    flex-wrap:wrap;

    gap:5px;
}

.tag{
    padding:5px 7px;

    border-radius:8px;

    background:
        rgba(255,255,255,.05);

    color:#acc1d6;

    font-size:8px;
}

.priceRow{
    margin-top:10px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.price{
    color:#ffd964;

    font-size:10px;

    font-weight:1000;
}

/* ======================================================
BUTTONS
====================================================== */

.btn{
    padding:9px 13px;

    border-radius:11px;

    color:#fff;

    font-size:9px;

    font-weight:1000;

    border:
        1px solid rgba(64,184,255,.25);

    background:
        rgba(44,159,231,.14);
}

.btn:hover{
    background:
        rgba(44,159,231,.23);
}

.btn.red{
    border-color:
        rgba(255,70,95,.3);

    background:
        rgba(255,60,90,.13);
}

.btn.green{
    border-color:
        rgba(55,225,150,.3);

    background:
        rgba(55,225,150,.12);
}

.btn.purple{
    border-color:
        rgba(165,110,255,.3);

    background:
        rgba(165,110,255,.13);
}

.btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.actions{
    display:flex;

    gap:6px;

    flex-wrap:wrap;

    margin-top:10px;
}

/* ======================================================
KPIs
====================================================== */

.kpis{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(125px,1fr)
        );

    gap:8px;

    margin-bottom:14px;
}

.kpi{
    padding:12px;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:15px;

    background:
        rgba(255,255,255,.03);
}

.kpiLabel{
    color:#738aa3;
    font-size:8px;
}

.kpiValue{
    margin-top:4px;

    font-weight:1000;

    font-size:14px;
}

/* ======================================================
PROFILE
====================================================== */

.profile{
    padding:16px;

    display:flex;
    align-items:center;
    gap:13px;

    border-radius:20px;

    border:
        1px solid rgba(255,255,255,.07);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(42,183,255,.12),
            transparent 50%
        ),
        rgba(255,255,255,.03);
}

.profileFlag{
    font-size:47px;
}

.profileName{
    font-size:20px;
    font-weight:1000;
}

.profileSub{
    margin-top:4px;

    color:#758ba2;
    font-size:9px;
}

/* ======================================================
INPUTS
====================================================== */

.input,
.select{
    width:100%;

    padding:11px 12px;

    background:#0b1728;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:12px;

    color:#fff;

    outline:none;
}

/* ======================================================
TABS
====================================================== */

.tabs{
    display:flex;

    gap:6px;

    overflow-x:auto;

    margin-bottom:13px;

    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    flex:none;

    padding:8px 12px;

    border-radius:11px;

    color:#8096ad;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.03);

    font-size:9px;

    font-weight:900;
}

.tab.active{
    color:#fff;

    border-color:#38baff;

    background:
        rgba(47,179,255,.12);
}

/* ======================================================
NEWS
====================================================== */

.news{
    padding:11px;

    border:
        1px solid rgba(255,255,255,.06);

    background:
        rgba(255,255,255,.03);

    border-radius:14px;

    margin-bottom:7px;
}

.newsDate{
    color:#42c4ff;
    font-size:8px;
}

.newsTitle{
    margin-top:3px;
    font-size:10px;
    font-weight:1000;
}

.newsText{
    margin-top:4px;

    line-height:1.7;

    color:#8297ad;

    font-size:9px;
}

/* ======================================================
TOAST
====================================================== */

#toastBox{
    position:absolute;

    top:88px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:3000;

    width:
        min(430px,90vw);

    pointer-events:none;
}

.toast{
    padding:12px 14px;

    margin-bottom:7px;

    border-radius:14px;

    border:
        1px solid rgba(255,255,255,.1);

    background:
        rgba(4,12,24,.95);

    box-shadow:
        0 15px 50px rgba(0,0,0,.5);

    font-size:10px;

    animation:
        toastIn .25s ease;
}

.toast.good{
    border-right:
        3px solid var(--green);
}

.toast.bad{
    border-right:
        3px solid var(--red);
}

.toast.info{
    border-right:
        3px solid var(--blue);
}

.toast.warn{
    border-right:
        3px solid var(--yellow);
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(-10px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* ======================================================
MOBILE
====================================================== */

@media(max-width:700px){

    #top{
        top:6px;
        left:6px;
        right:6px;

        flex-wrap:wrap;
    }

    .brand{
        width:100%;
        min-width:0;

        padding:8px 12px;
    }

    .brandName{
        font-size:13px;
    }

    .stat{
        min-width:88px;
        padding:7px 9px;
    }

    #mapHud{
        top:145px;
        left:6px;
    }

    #panel{
        top:auto;

        right:6px;
        bottom:78px;

        width:
            calc(100vw - 12px);

        max-height:220px;

        transform:
            translateY(calc(100% + 20px));

        transition:.3s;
    }

    #panel.open{
        transform:none;
    }

    .panelBody{
        max-height:155px;
    }

    #dock{
        bottom:5px;

        width:
            calc(100vw - 10px);
    }

    .dockBtn{
        min-width:62px;
    }

    .modalBody{
        padding:11px;
    }

    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

DOCK

/* ============================================================
UTILS
============================================================ */

function hash(str){

    let h=0;

    str=String(str);

    for(
        let i=0;
        i<str.length;
        i++
    ){

        h=
        ((h<<5)-h)+
        str.charCodeAt(i);

        h|=0;
    }

    return Math.abs(h);
}

function codeFromFeature(f){

    const p=
    f.properties||{};

    return String(

        p.ISO_A3 ||
        p.iso_a3 ||
        p.ADM0_A3 ||
        p.ISO3 ||
        ""

    ).toUpperCase();
}

function featureName(f){

    const p=
    f.properties||{};

    return (

        p.ADMIN ||
        p.NAME ||
        p.name ||
        p.NAME_EN ||
        "کشور"

    );
}

function makeFlag(code){

    const custom={

        USA:"US",

        GBR:"GB",

        DEU:"DE",

        FRA:"FR",

        IRN:"IR",

        RUS:"RU",

        CHN:"CN",

        IND:"IN",

        JPN:"JP",

        TUR:"TR",

        KOR:"KR"

    };

    const c=
    custom[code];

    if(!c)
        return "🌐";

    return String.fromCodePoint(
        ...[...c].map(
            x=>
            127397+
            x.charCodeAt()
        )
    );
}

function ensureCountry(
    code,
    name
){

    if(!code)
        return;

    if(!countries[code]){

        countries[code]={

            name:
            name||code,

            flag:
            makeFlag(code),

            pop:
            3+
            hash(code)%80
        };
    }

    if(!S.countries[code]){

        const base=
        countries[code];

        const h=
        hash(code);

        S.countries[code]={

            economy:
            Math.round(
                35+
                Math.sqrt(base.pop)*7+
                h%70
            ),

            military:
            Math.round(
                25+
                Math.sqrt(base.pop)*5+
                h%65
            ),

            technology:
            15+
            h%70,

            stability:
            45+
            h%50,

            energy:
            40+
            h%90,

            food:
            50+
            h%85,

            influence:
            10+
            h%70,

            owner:code,

            ai:true
        };
    }
}

function formatMoney(n){

    n=
    Math.round(n||0);

    if(n>=1e9)
        return(
            n/1e9
        ).toFixed(2)+"B";

    if(n>=1e6)
        return(
            n/1e6
        ).toFixed(2)+"M";

    if(n>=1000)
        return(
            n/1000
        ).toFixed(1)+"K";

    return n.toLocaleString();
}

function formatPop(n){

    if(n>=1000)
        return(
            n/1000
        ).toFixed(2)+"B";

    return n.toFixed(1)+"M";
}

"#75542f",
"#335f8d",
"#704879",
"#367a5a",
"#775052",

function normalColor(code){

    if(
        S.player &&
        S.countries[code]?.owner===
        S.player
    ){

        return "#dd3955";
    }

    return palette[
        hash(code)%
        palette.length
    ];
}

function countryColor(code){

    const c=
    S.countries[code];

    if(!c)
        return normalColor(code);

    if(
        mapMode===
        "normal"
    ){

        return normalColor(code);
    }

    if(
        mapMode===
        "economy"
    ){

        const v=
        Math.min(
            100,
            c.economy/4
        );

        return(
            `hsl(${190-v*1.1},65%,42%)`
        );
    }

    if(
        mapMode===
        "military"
    ){

        const v=
        Math.min(
            100,
            c.military/3
        );

        return(
            `hsl(${350-v*.8},65%,42%)`
        );
    }

    if(
        mapMode===
        "stability"
    ){

        return(
            `hsl(${c.stability*1.2},60%,40%)`
        );
    }

    if(
        mapMode===
        "relations"
    ){

        if(code===S.player)
            return "#31c5ff";

        const r=
        S.diplomacy[code]||0;

        if(r>40)
            return "#32df90";

        if(r<-40)
            return "#e8405e";

        return "#6c7280";
    }

    return normalColor(code);
}

function mapStyle(feature){

    const code=
    codeFromFeature(feature);

    return{

        fillColor:
        countryColor(code),

        color:
        "rgba(255,255,255,.26)",

        weight:1,

        fillOpacity:.73
    };
}

function recolor(){

    if(!geoLayer)
        return;

    geoLayer.setStyle(
        mapStyle
    );
}

        ensureCountry(
            code,
            featureName(f)

    geoLayer=
    L.geoJSON(

        data,

        {

            style:
            mapStyle,

            onEachFeature:

                feature,
                layer

                layer.on({

                    click:()=>{

                    mouseover:e=>{

                            fillOpacity:.82
                        });
                    },

                    mouseout:e=>{

                        geoLayer

                            e.target
                        );
                    }

                });
            }

        }

    )
    .addTo(map);

    finishLoading();

})

function filterCountrySelect(){

    );

    $("countrySelectList")
    .innerHTML=

        list

function diplomaticAction(
    code,
    type
){

    const costs={

        trade:400,

        relations:250,

        alliance:700
    };

    const cost=
    costs[type];

    if(
        S.money<
        cost
    ){

        toast(
            "بودجه کافی نیست.",
            "bad"
        );

        return;
    }

    S.money-=cost;

    if(
        type===
        "trade"
    ){

        S.diplomacy[code]=
        (
        S.diplomacy[code]||0
        )+6;

        S.economy+=4;

        S.reputation+=1;
    }

    if(
        type===
        "relations"
    ){

        S.diplomacy[code]=
        (
        S.diplomacy[code]||0
        )+10;

        S.reputation+=2;
    }

    if(
        type===
        "alliance"
    ){

        const relation=
        S.diplomacy[code]||0;

        if(
            relation<
            20
        ){

            toast(
                "برای پیمان ابتدا رابطه را بهبود بده.",
                "warn"
            );

            return;
        }

        if(
            !S.alliances.includes(
                code
            )
        ){

            S.alliances.push(
                code
            );
        }

        S.diplomacy[code]=
        relation+12;

        S.reputation+=4;
    }

    toast(
        "اقدام دیپلماتیک انجام شد.",
        "good"
    );

    render();
}

function declareWar(enemy){

    if(
        !S.started ||
        enemy===S.player
    )
        return;

    if(
        S.alliances.includes(
            enemy
        )
    ){

        toast(
            "ابتدا پیمان خود را لغو کن.",
            "warn"
        );

        return;
    }

    const relation=
    S.diplomacy[enemy]||0;

    if(
        relation>35
    ){

        toast(
            "روابط دو کشور برای اعلام جنگ بسیار بالاست.",
            "warn"
        );

        return;
    }

    if(
        S.wars.some(
            w=>
            w.enemy===enemy &&
            w.status==="war"
        )
    ){

        toast(
            "این جنگ از قبل فعال است.",
            "warn"
        );

        return;
    }

    if(
        S.command<
        15
    ){

        toast(
            "فرماندهی کافی نیست.",
            "bad"
        );

        return;
    }

    S.command-=15;

    S.wars.push({

        id:
        "WAR"+
        Date.now(),

        enemy,

        status:"war",

        score:0,

        days:0
    });

    S.diplomacy[enemy]=-100;

    S.warExhaustion+=3;

    addNews(

        "آغاز جنگ",

        `${countries[S.player].name} وارد جنگ با ${countries[enemy]?.name||enemy} شد.`

    );

    closeModal();

    toast(
        "جنگ آغاز شد.",
        "bad"
    );

    recolor();

    render();
}

    ">

    style="

        )

    background:

    ">
    </div>

    <div class="actions">

    <button
    class="btn red"
    onclick="
    militaryOperation(
    '${w.id}'
    )
    ">
    ⚔️ عملیات
    </button>

    <button
    class="btn green"
    onclick="
    offerPeace(
    '${w.id}'
    )
    ">
    🕊 صلح
    </button>

    </div>

    </div>

    `;
}

function militaryOperation(id){

    const w=
    S.wars.find(
        x=>
        x.id===id
    );

    if(!w)
        return;

    if(
        S.command<
        5
    ){

        toast(
            "فرماندهی کافی نیست.",
            "bad"
        );

        return;
    }

    S.command-=5;

    const enemy=
    S.countries[w.enemy];

    const playerForce=
        S.military+
        S.technology*.45+
        S.armies.airForce*2+
        S.armies.drones*1.5+
        S.armies.logistics+
        Math.random()*40;

    const enemyForce=
        enemy.military+
        enemy.technology*.35+
        Math.random()*45;

    const delta=
    (
        playerForce-
        enemyForce
    )/13;

    w.score+=delta;

    S.warExhaustion+=1.5;

    if(
        delta>0
    ){

        toast(
            "عملیات موفق بود.",
            "good"
        );
    }
    else{

        toast(
            "عملیات موفقیت کامل نداشت.",
            "warn"
        );
    }

    checkWar(w);

    render();

    openWar();
}

function checkWar(w){

    if(
        w.score>=100
    ){

        w.status=
        "won";

        S.money+=1800;

        S.reputation+=5;

        S.countries[w.enemy]
        .owner=
        S.player;

        addNews(

            "پیروزی",

            `${countries[w.enemy]?.name||w.enemy} پس از جنگ تحت کنترل شما قرار گرفت.`

        );

        toast(
            "پیروزی کامل!",
            "good"
        );

        recolor();
    }

    if(
        w.score<=-100
    ){

        w.status=
        "lost";

        S.money=
        Math.max(
            0,
            S.money-1500
        );

        S.stability-=6;

        S.reputation-=5;

        addNews(
            "شکست",
            "جنگ با شکست پایان یافت."
        );

        toast(
            "شکست در جنگ.",
            "bad"
        );
    }
}

function offerPeace(id){

    const w=
    S.wars.find(
        x=>x.id===id
    );

    if(!w)
        return;

    w.status=
    "peace";

    S.reputation+=2;

    S.warExhaustion=
    Math.max(
        0,
        S.warExhaustion-5
    );

    addNews(
        "پیمان صلح",
        `درگیری با ${countries[w.enemy]?.name||w.enemy} پایان یافت.`
    );

    toast(
        "پیمان صلح امضا شد.",
        "good"
    );

    render();

    openWar();
}

function buyProject(id){

    const p=
    PROJECTS.find(
        x=>x.id===id

    if(!p)
        return;

    const level=
    S.projects[id]||0;

    const cost=
    Math.round(
        p.cost*
        Math.pow(
            1.45,
            level
        )
    );

    if(
        S.money<
        cost
    ){

        toast(
            "بودجه کافی نیست.",
            "bad"
        );

        return;
    }

    S.money-=cost;

    S.projects[id]=
    level+1;

    if(
        p.cat===
        "economy"
    ){

        S.economy+=p.power;

        S.industry+=
        p.power*.4;
    }

    if(
        p.cat===
        "military"
    ){

        S.military+=
        p.power;

        S.command+=2;
    }

    if(
        p.cat===
        "technology"
    ){

        S.technology+=
        p.power;

        S.research+=
        p.power*.5;
    }

    if(
        p.cat===
        "infrastructure"
    ){

        S.economy+=
        p.power*.5;

        S.stability+=
        p.power*.1;

        S.energy+=
        p.power*.2;
    }

    toast(
        `${p.icon} ${p.name} ارتقا یافت.`,
        "good"
    );

    render();

    openProjects(
        projectTab

}

/* ============================================================
AI
============================================================ */

function aiTurn(){

    if(
        !S.started
    )
        return;

    const codes=
    Object.keys(
        S.countries
    );

    const iterations=
    Math.min(
        15,
        codes.length
    );

    for(
        let i=0;
        i<iterations;
        i++
    ){

        const code=
        codes[
            Math.floor(
                Math.random()*
                codes.length
            )
        ];

        const c=
        S.countries[code];

        if(
            !c ||
            code===S.player
        )
            continue;

        const action=
        Math.random();

        if(action<.35){

            c.economy+=
            Math.random()*1.5;
        }

        else if(action<.6){

            c.military+=
            Math.random()*1.1;
        }

        else if(action<.8){

            c.technology+=
            Math.random()*.9;
        }

        else{

            c.stability+=
            (
                Math.random()-.5
            )*.6;
        }

        c.stability=
        Math.max(
            20,
            Math.min(
                100,
                c.stability
            )
        );
    }

    /* AI diplomacy toward player */

    if(
        Math.random()<.06
    ){

        const other=
        codes[
            Math.floor(
                Math.random()*
                codes.length
            )
        ];

        if(
            other &&
            other!==S.player
        ){

            S.diplomacy[other]=
            (
                S.diplomacy[other]||0
            )+
            (
                Math.random()-.48
            )*4;
        }
    }
}

/* ============================================================
TIME
============================================================ */

function daysInMonth(
    month,
    year
){

    if(
        [
        4,6,9,11
        ].includes(month)
    )
        return 30;

    if(month===2){

        return(
            year%4===0
            ?29
            :28
        );
    }

    return 31;
}

function nextDay(){

    if(
        !S.started ||
        S.settings.paused
    )
        return;

    S.day++;

    if(
        S.day>
        daysInMonth(
            S.month,
            S.year
        )
    ){

        S.day=1;

        S.month++;

        if(
            S.month>12
        ){

            S.month=1;

            S.year++;

            addNews(
                "سال جدید",
                `سال ${S.year} آغاز شد.`
            );
        }
    }

    /* income */

    let income=

        S.economy*.7+

        S.industry*.3+

        S.population*.08+

        S.tax*4;

    income*=

    Math.max(
        .5,
        1-
        S.inflation/100
    );

    S.money+=income;

    /* passive growth */

    S.economy+=
    .02+
    S.technology*.0007;

    S.technology+=
    S.research*.0004;

    S.energy-=.02;

    S.food-=.015;

    S.command+=.45;

    S.warExhaustion-=.05;

    if(
        S.inflation>8
    ){

        S.popularity-=.025;
    }

    if(
        S.energy<30
    ){

        S.economy-=.03;

        S.popularity-=.02;
    }

    if(
        S.food<30
    ){

        S.stability-=.025;
    }

    S.inflation+=
    .002;

    simulateActiveWars();

    aiTurn();

    if(
        Math.random()<.035
    ){

        triggerWorldEvent();
    }

    clamp();

    render();

    if(
        S.day%5===0
    ){

        save();
    }
}

function simulateActiveWars(){

    S.wars
    .filter(
        w=>w.status==="war"
    )
    .forEach(
        w=>{

            w.days++;

            const enemy=
            S.countries[w.enemy];

            if(!enemy)
                return;

            const difference=

            (
                S.military+
                S.technology*.3
            )

            -

            (
                enemy.military+
                enemy.technology*.25
            );

            w.score+=
            difference/
            350;

            S.warExhaustion+=
            .04;

            checkWar(w);
        }
    );
}

/* ============================================================
FX
============================================================ */

const canvas=
$("fx");

const ctx=
canvas.getContext(
    "2d"
);

let particles=[];

function resizeFX(){

    const dpr=
    Math.min(
        devicePixelRatio||1,
        2
    );

    canvas.width=
    innerWidth*dpr;

    canvas.height=
    innerHeight*dpr;

    canvas.style.width=
    innerWidth+"px";

    canvas.style.height=
    innerHeight+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    particles=[];

    for(
        let i=0;
        i<90;
        i++
    ){

        particles.push({

            x:
            Math.random()*
            innerWidth,

            y:
            Math.random()*
            innerHeight,

            r:
            Math.random()*1.2+.2,

            vx:
            (
                Math.random()-.5
            )*.15,

            vy:
            (
                Math.random()-.5
            )*.15,

            a:
            .08+
            Math.random()*.28
        });
    }
}

function animateFX(){

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    if(
        S.settings.particles
    ){

        particles
        .forEach(
            p=>{

                p.x+=p.vx;

                p.y+=p.vy;

                if(p.x<0)
                    p.x=
                    innerWidth;

                if(
                    p.x>
                    innerWidth
                )
                    p.x=0;

                if(p.y<0)
                    p.y=
                    innerHeight;

                if(
                    p.y>
                    innerHeight
                )
                    p.y=0;

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.r,
                    0,
                    Math.PI*2
                );

                ctx.fillStyle=
                `rgba(80,190,255,${p.a})`;

                ctx.fill();
            }
        );
    }

    requestAnimationFrame(
        animateFX
    );
}

window.addEventListener(
    "resize",
    resizeFX
);

resizeFX();

animateFX();

/* ============================================================
TIME LOOP
============================================================ */

let lastTick=
performance.now();

let accumulator=0;

function gameLoop(now){

    if(
        S.started &&
        !S.settings.paused
    ){

        accumulator+=
        now-lastTick;

        const interval=
        1300/
        Math.max(
            1,
            S.settings.speed
        );

        while(
            accumulator>=
            interval
        ){

            accumulator-=
            interval;

            nextDay();
        }
    }

    lastTick=now;

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(
    gameLoop
);

/* ============================================================
LOADING
============================================================ */

let loadingValue=
0;

const loadingInterval=
setInterval(
    ()=>{

        loadingValue+=
        5+
        Math.random()*9;

        loadingValue=
        Math.min(
            loadingValue,
            92
        );

        $("loaderFill")
        .style.width=
        loadingValue+"%";

        if(
            loadingValue<25
        ){

            $("loaderText")
            .textContent=
            "راه‌اندازی موتور جهانی...";
        }

        else if(
            loadingValue<50
        ){

            $("loaderText")
            .textContent=
            "بارگذاری کشورها...";
        }

        else if(
            loadingValue<75
        ){

            $("loaderText")
            .textContent=
            "راه‌اندازی اقتصاد و ارتش...";
        }

        else{

            $("loaderText")
            .textContent=
            "فعال‌سازی هوش مصنوعی جهان...";
        }

    },
    160
);

let initialized=
false;

function finishLoading(){

    if(initialized)
        return;

    initialized=true;

    clearInterval(
        loadingInterval
    );

    $("loaderFill")
    .style.width=
    "100%";

    $("loaderText")
    .textContent=
    "جهان آماده است";

    setTimeout(
        ()=>{

            $("loading")
            .classList
            .add(
                "hide"
            );

            load();

        },
        450
    );
}

/* backup */

setTimeout(
    finishLoading,
    3500
);
