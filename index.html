<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>WORLD EMPIRE — Geo Strategy</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:#07111f;
    color:#fff;
}

button,input,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#countryScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:
        radial-gradient(circle at 50% 10%,#17345a 0,#081423 45%,#030912 100%);
    display:flex;
    flex-direction:column;
}

.countryHeader{
    padding:22px 16px 12px;
    text-align:center;
    flex-shrink:0;
}

.countryHeader h1{
    margin:0;
    font-size:30px;
    color:#fff;
}

.countryHeader p{
    margin:9px 0 0;
    color:#aebed1;
    font-size:13px;
}

.countryTools{
    display:flex;
    gap:8px;
    padding:10px 14px;
    flex-shrink:0;
}

.countryTools input{
    flex:1;
    min-width:0;
    background:#101f32;
    border:1px solid #28415d;
    color:#fff;
    padding:13px;
    border-radius:12px;
    outline:none;
}

.countryTools button{
    border:0;
    border-radius:12px;
    background:#1d3552;
    color:#fff;
    padding:0 15px;
}

#countryList{
    flex:1;
    overflow-y:auto;
    padding:8px 12px 100px;
}

.countryCard{
    background:linear-gradient(135deg,#12243a,#0c1929);
    border:1px solid #263f5d;
    border-radius:16px;
    padding:13px;
    margin-bottom:9px;
    display:flex;
    align-items:center;
    gap:12px;
    transition:.15s;
}

.countryCard:active{
    transform:scale(.985);
}

.countryFlag{
    width:48px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    flex-shrink:0;
    background:#091321;
    border-radius:11px;
}

.countryInfo{
    flex:1;
    min-width:0;
}

.countryName{
    font-size:16px;
    font-weight:bold;
    margin-bottom:5px;
}

.countryMeta{
    color:#9fb1c6;
    font-size:11px;
    line-height:1.8;
}

.countryChoose{
    background:#d92735;
    color:#fff;
    border:0;
    border-radius:11px;
    padding:10px 13px;
    font-weight:bold;
}

#game{
    position:fixed;
    inset:0;
    display:none;
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.leaflet-container{
    background:#0b1726;
}

.topBar{
    position:absolute;
    z-index:1000;
    top:8px;
    left:8px;
    right:8px;
    min-height:61px;
    background:rgba(7,16,28,.94);
    border:1px solid #29425d;
    border-radius:15px;
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

.topBar::-webkit-scrollbar{
    display:none;
}

.stat{
    min-width:83px;
    background:#0e2034;
    border:1px solid #223b56;
    border-radius:10px;
    padding:6px 8px;
    text-align:center;
    flex-shrink:0;
}

.stat small{
    display:block;
    color:#8fa4bb;
    font-size:9px;
}

.stat strong{
    display:block;
    margin-top:3px;
    font-size:12px;
}

.countryMini{
    min-width:145px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 8px;
}

.countryMiniFlag{
    font-size:25px;
}

.countryMiniName{
    font-size:12px;
    font-weight:bold;
}

.countryMiniYear{
    color:#91a7bd;
    font-size:9px;
    margin-top:2px;
}

.bottomDock{
    position:absolute;
    z-index:1001;
    left:8px;
    right:8px;
    bottom:8px;
    background:rgba(7,16,28,.96);
    border:1px solid #29425d;
    border-radius:17px;
    padding:7px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    backdrop-filter:blur(10px);
}

.dockBtn{
    min-height:54px;
    border:1px solid #29435e;
    border-radius:12px;
    color:#fff;
    background:#102239;
    font-size:11px;
    font-weight:bold;
}

.dockBtn:active{
    transform:scale(.96);
}

.dockStore{
    background:linear-gradient(135deg,#51360b,#875b10);
}

.dockWar{
    background:linear-gradient(135deg,#541d25,#8d2632);
}

.dockGov{
    background:linear-gradient(135deg,#24306a,#3549a1);
}

.dockCountry{
    background:linear-gradient(135deg,#164b43,#176b5e);
}

.modalBack{
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.66);
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal{
    width:min(720px,100%);
    max-height:90vh;
    background:#091625;
    border:1px solid #2a4663;
    border-radius:22px 22px 0 0;
    overflow:hidden;
    box-shadow:0 -15px 60px rgba(0,0,0,.45);
}

.modalHeader{
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:11px 15px;
    border-bottom:1px solid #20374e;
    background:#0d1d30;
}

.modalHeader h2{
    margin:0;
    font-size:18px;
}

.closeBtn{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:#172b41;
    color:#fff;
    font-size:20px;
}

.modalBody{
    padding:13px;
    overflow-y:auto;
    max-height:calc(90vh - 58px);
}

.sectionTitle{
    font-size:13px;
    color:#9bb0c7;
    margin:15px 2px 8px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.card{
    background:#0e1f33;
    border:1px solid #223d59;
    border-radius:13px;
    padding:11px;
}

.card h3{
    margin:0 0 6px;
    font-size:13px;
}

.card p{
    margin:4px 0;
    color:#9eb0c4;
    font-size:10px;
    line-height:1.7;
}

.actionBtn{
    width:100%;
    border:0;
    border-radius:10px;
    background:#1d4f80;
    color:#fff;
    padding:10px;
    margin-top:7px;
    font-size:11px;
    font-weight:bold;
}

.actionBtn.green{
    background:#17624f;
}

.actionBtn.red{
    background:#7c2530;
}

.actionBtn.gold{
    background:#76520e;
}

.actionBtn.blue{
    background:#293f8b;
}

.actionBtn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.money{
    color:#ffd66b!important;
}

.good{
    color:#5ee3ad!important;
}

.bad{
    color:#ff7883!important;
}

.infoBox{
    background:#0d2035;
    border:1px solid #294663;
    border-radius:13px;
    padding:12px;
    margin-bottom:10px;
    font-size:11px;
    line-height:2;
}

.progress{
    height:9px;
    background:#162b40;
    border-radius:99px;
    overflow:hidden;
    margin-top:6px;
}

.progress i{
    display:block;
    height:100%;
    width:0;
    background:#3e9cf5;
}

.rangeRow{
    background:#0e2034;
    border:1px solid #223c58;
    border-radius:13px;
    padding:11px;
    margin-bottom:8px;
}

.rangeRow label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
}

.rangeRow input{
    width:100%;
    margin-top:8px;
}

.select{
    width:100%;
    padding:11px;
    border-radius:10px;
    background:#101f32;
    border:1px solid #29415c;
    color:#fff;
    outline:none;
}

.warTarget{
    background:#0e1e31;
    border:1px solid #253f5a;
    border-radius:14px;
    padding:11px;
    margin-bottom:8px;
}

.warTargetTop{
    display:flex;
    align-items:center;
    gap:9px;
}

.warFlag{
    font-size:27px;
}

.warTargetInfo{
    flex:1;
}

.warTargetName{
    font-weight:bold;
    font-size:13px;
}

.warTargetMeta{
    color:#8fa6bd;
    font-size:10px;
    margin-top:4px;
}

.resultBox{
    text-align:center;
    background:#101f32;
    border:1px solid #2c4761;
    border-radius:15px;
    padding:17px;
    margin-bottom:10px;
}

.resultBig{
    font-size:25px;
    font-weight:bold;
    margin-bottom:8px;
}

.tabRow{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:none;
}

.tabRow::-webkit-scrollbar{
    display:none;
}

.tab{
    white-space:nowrap;
    padding:9px 12px;
    border:1px solid #29425c;
    background:#102238;
    color:#b7c6d7;
    border-radius:10px;
    font-size:10px;
}

.tab.active{
    background:#234b74;
    color:#fff;
}

.storeItem{
    background:linear-gradient(135deg,#102339,#0c1b2d);
    border:1px solid #28435e;
    border-radius:14px;
    padding:12px;
}

.itemIcon{
    font-size:27px;
    margin-bottom:5px;
}

.itemName{
    font-size:12px;
    font-weight:bold;
}

.itemDesc{
    color:#8fa5bc;
    font-size:9px;
    line-height:1.7;
    margin:5px 0;
}

.itemEffect{
    color:#69d8ad;
    font-size:9px;
    min-height:25px;
}

.itemPrice{
    color:#ffd76d;
    font-size:11px;
    margin-top:6px;
    font-weight:bold;
}

.cityRow,
.ministerRow,
.diplomacyRow{
    display:flex;
    align-items:center;
    gap:10px;
    background:#0e1f32;
    border:1px solid #233e59;
    border-radius:12px;
    padding:10px;
    margin-bottom:7px;
}

.rowIcon{
    width:37px;
    height:37px;
    border-radius:10px;
    background:#152b42;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.rowInfo{
    flex:1;
}

.rowTitle{
    font-size:11px;
    font-weight:bold;
}

.rowText{
    color:#8ea5bc;
    font-size:9px;
    margin-top:3px;
}

.smallBtn{
    border:0;
    background:#21486c;
    color:#fff;
    border-radius:8px;
    padding:8px;
    font-size:9px;
}

.toast{
    position:fixed;
    z-index:9000;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    bottom:90px;
    background:#0b1b2e;
    border:1px solid #33516f;
    border-radius:12px;
    padding:11px 15px;
    font-size:11px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.leaflet-control-attribution{
    font-size:8px!important;
}

@media(max-width:480px){
    .grid{
        grid-template-columns:1fr 1fr;
    }

    .stat{
        min-width:76px;
    }

    .countryHeader h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     COUNTRY SELECTION
========================================================= -->

<div id="countryScreen">

    <div class="countryHeader">
        <h1>🌍 انتخاب کشور</h1>
        <p>کشور خودت را انتخاب کن و امپراتوری‌ات را بساز</p>
    </div>

    <div class="countryTools">
        <input id="countrySearch"
               type="text"
               placeholder="جستجوی کشور...">
        <button onclick="sortCountries()">↕ مرتب‌سازی</button>
    </div>

    <div id="countryList"></div>

</div>


<!-- =========================================================
     GAME
========================================================= -->

<div id="game">

    <div id="map"></div>

    <div class="topBar">

        <div class="countryMini">
            <div id="miniFlag" class="countryMiniFlag">🌍</div>
            <div>
                <div id="miniName" class="countryMiniName">---</div>
                <div id="miniYear" class="countryMiniYear">سال 2026</div>
            </div>
        </div>

        <div class="stat">
            <small>💰 خزانه</small>
            <strong id="statMoney">0</strong>
        </div>

        <div class="stat">
            <small>👥 جمعیت</small>
            <strong id="statPopulation">0</strong>
        </div>

        <div class="stat">
            <small>🏭 تولید</small>
            <strong id="statProduction">0</strong>
        </div>

        <div class="stat">
            <small>⭐ اعتبار</small>
            <strong id="statRep">0</strong>
        </div>

        <div class="stat">
            <small>🏙 شهرها</small>
            <strong id="statCities">0</strong>
        </div>

        <div class="stat">
            <small>🛡 توان</small>
            <strong id="statPower">0</strong>
        </div>

        <div class="stat">
            <small>⚡ آمادگی</small>
            <strong id="statReady">0%</strong>
        </div>

        <div class="stat">
            <small>🎯 فرمان</small>
            <strong id="statCP">0</strong>
        </div>

    </div>


    <div class="bottomDock">

        <button class="dockBtn dockStore"
                onclick="openModal('storeModal')">
            🛒<br>فروشگاه
        </button>

        <button class="dockBtn dockGov"
                onclick="openModal('govModal')">
            🏛<br>دولت
        </button>

        <button class="dockBtn dockWar"
                onclick="openWar()">
            ⚔️<br>جنگ
        </button>

        <button class="dockBtn dockCountry"
                onclick="openCountryManagement()">
            🏙<br>کشور
        </button>

        <button class="dockBtn"
                onclick="nextTurn()">
            ⏭<br>سال بعد
        </button>

    </div>

</div>


<!-- =========================================================
     STORE MODAL
========================================================= -->

<div class="modalBack" id="storeModal">

    <div class="modal">

        <div class="modalHeader">
            <h2>🛒 فروشگاه ملی</h2>
            <button class="closeBtn"
                    onclick="closeModal('storeModal')">×</button>
        </div>

        <div class="modalBody">

            <div class="infoBox">
                خزانه:
                <b class="money" id="storeMoney">0</b>
                💰
                <br>
                قیمت‌ها با وضعیت اقتصادی کشور تغییر می‌کنند.
            </div>

            <div id="storeTabs" class="tabRow"></div>

            <div id="storeGrid" class="grid"></div>

        </div>

    </div>

</div>


<!-- =========================================================
     GOVERNMENT MODAL
========================================================= -->

<div class="modalBack" id="govModal">

    <div class="modal">

        <div class="modalHeader">
            <h2>🏛 دولت و مدیریت کشور</h2>
            <button class="closeBtn"
                    onclick="closeModal('govModal')">×</button>
        </div>

        <div class="modalBody">

            <div id="governmentContent"></div>

        </div>

    </div>

</div>


<!-- =========================================================
     WAR MODAL
========================================================= -->

<div class="modalBack" id="warModal">

    <div class="modal">

        <div class="modalHeader">
            <h2>⚔️ مرکز عملیات</h2>
            <button class="closeBtn"
                    onclick="closeModal('warModal')">×</button>
        </div>

        <div class="modalBody">

            <div id="warContent"></div>

        </div>

    </div>

</div>


<!-- =========================================================
     COUNTRY MANAGEMENT MODAL
========================================================= -->

<div class="modalBack" id="countryModal">

    <div class="modal">

        <div class="modalHeader">
            <h2>🏙 مدیریت کشور</h2>
            <button class="closeBtn"
                    onclick="closeModal('countryModal')">×</button>
        </div>

        <div class="modalBody">

            <div id="countryManagementContent"></div>

        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* =========================================================
   COUNTRY SELECTION
========================================================= */

let countrySortAsc=true;

function formatPopulation(n){

    if(n>=1000000000)
        return (n/1000000000).toFixed(2)+" میلیارد";

    if(n>=1000000)
        return (n/1000000).toFixed(1)+" میلیون";

    return n.toLocaleString("fa-IR");
}

function renderCountryList(){

    const search=document.getElementById("countrySearch").value
        .trim()
        .toLowerCase();

    let list=COUNTRIES.filter(c=>
        c.name.toLowerCase().includes(search) ||
        c.code.toLowerCase().includes(search)
    );

    list.sort((a,b)=>{
        return countrySortAsc
            ? b.population-a.population
            : a.population-b.population;
    });

    const box=document.getElementById("countryList");

    box.innerHTML=list.map(c=>`

        <div class="countryCard">

            <div class="countryFlag">${c.flag}</div>

            <div class="countryInfo">

                <div class="countryName">
                    ${c.name}
                </div>

                <div class="countryMeta">
                    👥 جمعیت: ${formatPopulation(c.population)}
                    <br>
                    🏭 تولید: ${c.production}
                    &nbsp; | &nbsp;
                    🏙 شهر: ${c.cities}
                    &nbsp; | &nbsp;
                    🛡 توان: ${c.power}
                </div>

            </div>

            <button class="countryChoose"
                    onclick="selectCountry('${escapeJS(c.code)}')">
                انتخاب
            </button>

        </div>

    `).join("");

}

function sortCountries(){

    countrySortAsc=!countrySortAsc;
    renderCountryList();

}

function escapeJS(s){

    return String(s)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}

document.getElementById("countrySearch")
    .addEventListener("input",renderCountryList);


/* =========================================================
   INITIALIZE PLAYER
========================================================= */

function selectCountry(code){

    const c=COUNTRIES.find(x=>x.code===code);

    if(!c) return;

    game.countryCode=c.code;
    game.countryName=c.name;
    game.flag=c.flag;

    game.population=c.population;
    game.production=c.production;
    game.cities=c.cities;
    game.power=c.power;

    game.money=1800+
        Math.floor(c.production*15)+
        Math.floor(c.cities*10);

    game.reputation=60;
    game.readiness=72;
    game.commandPoints=10;
    game.stability=72;
    game.warWeariness=0;
    game.warCooldown=0;

    game.conquered=[];

    game.citiesData=[];

    for(let i=0;i<Math.min(8,c.cities);i++){

        game.citiesData.push({
            name:"شهر "+(i+1),
            level:1,
            production:Math.max(2,Math.floor(c.production/c.cities))
        });

    }

    document.getElementById("countryScreen").style.display="none";
    document.getElementById("game").style.display="block";

    updateUI();

    setTimeout(initMap,100);

    showToast(
        "کشور "+c.name+" انتخاب شد. برای توسعه، اقتصاد و آمادگی ملی را مدیریت کن."
    );

}

/* =========================================================
   MAP COUNTRY NAME
========================================================= */

function getFeatureName(feature){

    const p=feature.properties||{};

    return p.ADMIN ||
           p.NAME ||
           p.name ||
           p.Country ||
           p.country ||
           "";

}


/* =========================================================
   STABLE COLOR
========================================================= */

function hashString(str){

    let hash=0;

    for(let i=0;i<str.length;i++){

        hash=((hash<<5)-hash)+str.charCodeAt(i);
        hash|=0;

    }

    return Math.abs(hash);

}

function getCountryColor(name){

    const normalized=String(name||"").trim();

    if(!normalized)
        return "#52677d";

    if(
        normalized===game.countryCode ||
        game.conquered.includes(normalized)
    ){
        return "#e32632";
    }

    if(countryColorCache[normalized])
        return countryColorCache[normalized];

    const index=
        hashString(normalized)%COUNTRY_COLORS.length;

    countryColorCache[normalized]=
        COUNTRY_COLORS[index];

    return countryColorCache[normalized];

}


/* =========================================================
   MAP STYLE
========================================================= */

function countryStyle(feature){

    const name=getFeatureName(feature);

    const isPlayer=
        name===game.countryCode ||
        game.conquered.includes(name);

    return{
        color:"#182b3e",
        weight:0.8,
        fillColor:isPlayer
            ? "#e32632"
            : getCountryColor(name),
        fillOpacity:0.68
    };

}


/* =========================================================
   REFRESH MAP COLORS
========================================================= */

function refreshCountryColors(){

    if(!geoLayer)
        return;

    geoLayer.eachLayer(layer=>{

        if(layer.feature){

            layer.setStyle(
                countryStyle(layer.feature)
            );

        }

    });

}


/* =========================================================
   MAP INIT
   اصل نقشه حفظ شده است.
========================================================= */

function initMap(){

    if(map){
        refreshCountryColors();
        return;
    }

    map=L.map("map",{
        worldCopyJump:false,
        zoomControl:false,
        minZoom:2,
        maxZoom:7
    }).setView([25,10],2);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);

    fetch(MAP_GEOJSON)
    .then(r=>r.json())
    .then(data=>{

        geoData=data;

        geoLayer=L.geoJSON(data,{

            style:countryStyle,

            onEachFeature:(feature,layer)=>{

                layer.on({

                    click:()=>{

                        const name=
                            getFeatureName(feature);

                        showCountryInfo(name);

                    },

                    mouseover:e=>{

                        e.target.setStyle({
                            weight:2,
                            color:"#ffffff",
                            fillOpacity:.78
                        });

                    },

                    mouseout:e=>{

                        geoLayer.resetStyle(e.target);

                    }

                });

            }

        }).addTo(map);

        refreshCountryColors();

    })
    .catch(()=>{

        showToast("نقشه در حال بارگذاری است...");

    });

}


/* =========================================================
   COUNTRY INFO
========================================================= */

function getCountryByCode(code){

    return COUNTRIES.find(c=>c.code===code);

}

function getCountryByAnyName(name){

    let c=COUNTRIES.find(c=>
        c.code===name ||
        c.name===name
    );

    if(c) return c;

    return COUNTRIES.find(c=>
        c.code.toLowerCase()===String(name).toLowerCase()
    );

}

function showCountryInfo(name){

    const c=getCountryByAnyName(name);

    if(c){

        const owned=
            c.code===game.countryCode ||
            game.conquered.includes(c.code);

        showToast(
            `${c.flag} ${c.name} | جمعیت ${formatPopulation(c.population)} | توان ${c.power}`+
            (owned?" | تحت کنترل شما":"")
        );

    }else{

        showToast("کشور انتخاب‌شده در فهرست مدیریتی وجود ندارد.");

    }

}

function buyStoreItem(category,index){

    const item=STORE_CATEGORIES[category][index];

    const price=Math.floor(
        item[4]*(1+game.inflation/100)
    );

    if(game.money<price){

        showToast("خزانه برای خرید این مورد کافی نیست.");
        return;

    }

    game.money-=price;

    const key=category+"_"+index;

    game.purchased[key]=(game.purchased[key]||0)+1;

    applyStoreEffect(item[3]);

    game.inflation=Math.max(
        1,
        game.inflation-0.05
    );

    updateUI();
    renderStore();

    showToast(item[1]+" با موفقیت خریداری شد.");

}

function applyStoreEffect(effect){

    if(effect.includes("تولید +")){

        const n=parseInt(effect.match(/\d+/)?.[0]||0);
        game.production+=n;

    }

    if(effect.includes("درآمد +")){

        game.money+=Math.floor(game.production*0.05);

    }

    if(effect.includes("تورم -")){

        const n=parseFloat(effect.match(/[\d.]+/)?.[0]||0);
        game.inflation=Math.max(0,game.inflation-n);

    }

    if(effect.includes("ثبات +")){

        const n=parseInt(effect.match(/\d+/)?.[0]||0);
        game.stability=Math.min(100,game.stability+n);

    }

    if(effect.includes("فناوری +")){

        const n=parseInt(effect.match(/\d+/)?.[0]||0);
        game.production+=Math.floor(n*.6);

    }

    if(effect.includes("فرمان +")){

        const n=parseInt(effect.match(/\d+/)?.[0]||0);
        game.commandPoints=Math.min(20,game.commandPoints+n);

    }

    if(effect.includes("شهر +")){

        game.cities++;

    }

    if(effect.includes("جمعیت +")){

        game.population=
            Math.floor(game.population*1.01);

    }

    if(effect.includes("اعتبار +")){

        game.reputation=
            Math.min(100,game.reputation+5);

    }

    if(effect.includes("محبوبیت +")){

        game.governmentPopularity=
            Math.min(100,game.governmentPopularity+4);

    }

}

        readiness:{

            run:()=>{
                game.readiness+=16;
                game.commandPoints+=2;

    const d=data[type];

    if(game.money<d.cost){

    game.money-=d.cost;

        Math.min(100,game.stability);

        Math.min(100,game.reputation);

    game.readiness=

    game.commandPoints=
        Math.min(20,game.commandPoints);

    showToast("تصمیم دولت اجرا شد.");

    renderGovernment();
    updateUI();

function getAllTargets(){

    return COUNTRIES.filter(c=>
        c.code!==game.countryCode &&
        !game.conquered.includes(c.code)
    );

}

function calculateNationalPower(){

    let result=game.power;

    result+=game.production*.35;
    result+=game.cities*1.4;
    result+=game.readiness*.35;
    result+=game.stability*.18;

    if(game.ministers.defense)
        result+=8;

    result-=game.warWeariness*.45;

    return Math.max(1,Math.floor(result));

}

function calculateEnemyPower(c){

    return Math.max(
        1,
        Math.floor(
            c.power+
            c.production*.3+
            c.cities*1.3+
            (c.population/100000000)*5+
            Math.random()*12
        )
    );

}

function warRequirements(target){

    const enemyPower=calculateEnemyPower(target);

    const cost=
        Math.floor(
            260+
            enemyPower*11+
            target.cities*18
        );

    return{
        enemyPower,
        cost
    };

}

========================================================= */

function startWar(targetCode){

    const target=
        COUNTRIES.find(c=>c.code===targetCode);

    if(!target)
        return;

    if(game.warCooldown>0){

        showToast(
            "کشور هنوز از جنگ قبلی خارج نشده است."
        );

        return;

    }

    if(game.commandPoints<3){

        showToast(
            "حداقل 3 امتیاز فرمان لازم است."
        );

        return;

    }

    if(game.readiness<45){

        showToast(
            "آمادگی ملی کمتر از حد لازم است."
        );

        return;

    }

    if(game.stability<30){

        showToast(
            "ثبات داخلی برای آغاز جنگ کافی نیست."
        );

        return;

    }

    const info=warRequirements(target);

    if(game.money<info.cost){

        showToast(
            "بودجه کافی برای شروع جنگ وجود ندارد."
        );

        return;

    }

    game.money-=info.cost;

    game.commandPoints-=3;

    game.readiness-=
        12+
        Math.floor(Math.random()*8);

    game.stability-=
        4+
        Math.floor(Math.random()*5);

    game.warWeariness+=
        8+
        Math.floor(Math.random()*7);

    const ownPower=
        calculateNationalPower()+
        Math.random()*22-
        11;

    const enemyPower=
        info.enemyPower+
        Math.random()*18-
        9;

    const ratio=ownPower/(enemyPower||1);

    let chance=
        50+
        (ratio-1)*35+
        (game.reputation-50)*.08;

    chance=Math.max(8,Math.min(92,chance));

    const roll=Math.random()*100;

    if(roll<=chance){

        winWar(target,ownPower,enemyPower);

    }else{

        loseWar(target,ownPower,enemyPower);

    }

    game.warCooldown=1;

    updateUI();

}

                    کنترل سیاسی کمتر ولی فشار داخلی پایین‌تر.
                </p>

                <button class="actionBtn green"
                        onclick="vassalizeCountry('${escapeJS(target.code)}')">
                    اداره خودمختار
                </button>

            </div>

        </div>

    `;

    refreshCountryColors();
    updateUI();

}


/* =========================================================
   WAR LOSS
========================================================= */

function loseWar(target,ownPower,enemyPower){

    game.warsLost++;

    game.lastWar={
        result:"loss",
        target:target.code
    };

    game.money=
        Math.max(
            0,
            game.money-
            Math.floor(120+enemyPower*3)
        );

    game.reputation=
        Math.max(0,game.reputation-6);

    game.stability=
        Math.max(0,game.stability-9);

    game.readiness=
        Math.max(0,game.readiness-10);

    game.warWeariness=
        Math.min(100,game.warWeariness+12);

    document.getElementById("warContent").innerHTML=`

        <div class="resultBox">

            <div class="resultBig bad">
                شکست
            </div>

            <div>
                عملیات علیه ${target.flag} ${target.name}
                موفقیت‌آمیز نبود.
            </div>

            <br>

            بخشی از بودجه از دست رفت و
            ثبات کشور کاهش یافت.

        </div>


        <div class="infoBox">

            قبل از جنگ بعدی باید کشور را دوباره آماده کنی.
            مدیریت اقتصاد، دولت و آمادگی ملی اهمیت دارد.

        </div>


        <button class="actionBtn"
                onclick="renderWar()">
            بازگشت به مرکز عملیات
        </button>

    `;

    updateUI();

}


/* =========================================================
   ANNEX
========================================================= */

function annexCountry(code){

    const target=
        COUNTRIES.find(c=>c.code===code);

    if(!target)
        return;

    if(game.conquered.includes(code))
        return;

    game.conquered.push(code);

    game.cities+=
        Math.max(1,Math.floor(target.cities*.3));

    game.population=
        Math.floor(
            game.population+
            target.population*.15
        );

    game.production+=
        Math.max(
            2,
            Math.floor(target.production*.18)
        );

    game.power+=
        Math.max(
            2,
            Math.floor(target.power*.12)
        );

    game.stability=
        Math.max(
            10,
            game.stability-8
        );

    game.warWeariness=
        Math.min(
            100,
            game.warWeariness+10
        );

    game.readiness=
        Math.max(
            10,
            game.readiness-8
        );

    game.commandPoints=
        Math.max(
            0,
            game.commandPoints-1
        );

    refreshCountryColors();

    showToast(
        target.flag+" "+target.name+
        " به کشور شما اضافه شد و قرمز شد."
    );

    closeModal("warModal");
    updateUI();

}


/* =========================================================
   AUTONOMOUS
========================================================= */

function vassalizeCountry(code){

    const target=
        COUNTRIES.find(c=>c.code===code);

    if(!target)
        return;

    game.conquered.push(code);

    game.money+=
        Math.floor(target.production*6);

    game.reputation=
        Math.min(100,game.reputation+2);

    game.stability=
        Math.max(0,game.stability-2);

    game.readiness=
        Math.max(0,game.readiness-4);

    game.warWeariness=
        Math.min(100,game.warWeariness+5);

    refreshCountryColors();

    showToast(
        target.flag+" "+target.name+
        " تحت اداره خودمختار قرار گرفت."
    );

    closeModal("warModal");
    updateUI();

}


/* =========================================================

}

                    <div class="rowIcon">

                    </div>

                    <div class="rowInfo">

                        <div class="rowTitle">
                            ${c.name}
                        </div>

                        <div class="rowText">
                            جمعیت ${formatPopulation(c.population)}
                            |
                            تولید ${c.production}
                        </div>

                    </div>

                    <span class="good"
                          style="font-size:9px">
                        تحت کنترل
                    </span>

                </div>

            `).join("")
            :`
                <div class="infoBox">
                    هنوز سرزمین دیگری تحت کنترل شما نیست.
                </div>

        <div class="grid">

                <h3>🏙 توسعه شهری</h3>
                <p>هزینه 450💰</p>
                <button class="actionBtn"
                        onclick="developCity()">
                    توسعه

function upgradeCity(index){

    const city=game.citiesData[index];

    if(!city)
        return;

    const cost=
        300+
        city.level*250;

    if(game.money<cost){

        showToast("بودجه کافی نیست.");
        return;

    }

    game.money-=cost;

    city.level++;

    city.production+=3;

    game.production+=3;

    showToast(
        city.name+" ارتقا پیدا کرد."
    );

    renderCountryManagement();
    updateUI();

}

function developCity(){

    if(game.money<450){

        showToast("450💰 لازم است.");
        return;

    }

    game.money-=450;

    game.cities++;
    game.production+=4;

    game.stability=
        Math.min(100,game.stability+2);

    showToast("یک مرکز شهری جدید توسعه یافت.");

    renderCountryManagement();
    updateUI();

}

function economicReform(){

    if(game.money<350){

        showToast("350💰 لازم است.");
        return;

    }

    game.money-=350;

    game.production+=6;
    game.inflation=Math.max(0,game.inflation-.8);

    showToast("اصلاحات اقتصادی اجرا شد.");

    renderCountryManagement();
    updateUI();

}

function nationalReadiness(){

    if(game.money<400){

        showToast("400💰 لازم است.");
        return;

    }

    game.money-=400;

    game.readiness=
        Math.min(100,game.readiness+13);

    game.commandPoints=
        Math.min(20,game.commandPoints+1);

    showToast("آمادگی ملی افزایش یافت.");

    renderCountryManagement();
    updateUI();

}

function nationalUnity(){

    if(game.money<300){

        showToast("300💰 لازم است.");
        return;

    }

    game.money-=300;

    game.stability=
        Math.min(100,game.stability+7);

    game.governmentPopularity=
        Math.min(100,game.governmentPopularity+5);

    game.warWeariness=
        Math.max(0,game.warWeariness-3);

    showToast("برنامه وحدت ملی اجرا شد.");

    renderCountryManagement();
    updateUI();

}


/* =========================================================
   DIPLOMACY
========================================================= */

function diplomacyAction(code,type){

    const target=
        COUNTRIES.find(c=>c.code===code);

    if(!target)
        return;

    if(type==="trade"){

        if(game.money<250){

            showToast("250💰 لازم است.");
            return;

        }

        game.money-=250;

        game.reputation=
            Math.min(100,game.reputation+3);

        game.production+=3;

        game.relations[code]="تجاری";

        showToast(
            "پیمان تجاری با "+target.name+" برقرار شد."
        );

    }

    if(type==="alliance"){

        if(game.reputation<55){

            showToast("اعتبار بین‌المللی کافی نیست.");
            return;

        }

        game.relations[code]="متحد";

        game.reputation=
            Math.min(100,game.reputation+4);

        showToast(
            "روابط با "+target.name+" به اتحاد ارتقا یافت."
        );

    }

    if(type==="aid"){

        if(game.money<300){

            showToast("300💰 لازم است.");
            return;

        }

        game.money-=300;

        game.reputation=
            Math.min(100,game.reputation+6);

        showToast(
            "کمک اقتصادی برای "+target.name+" ارسال شد."
        );

    }

    updateUI();

}


/* =========================================================
   TURN SYSTEM
========================================================= */

function nextTurn(){

    game.year++;

    let income=
        game.production*
        (1+game.tax/100);

    income*=
        1-game.inflation/150;

    income*=
        1+(game.economyBudget/100)*.18;

    if(game.ministers.economy)
        income*=1.08;

    income=Math.max(0,Math.floor(income));

    game.money+=income;

    game.inflation+=
        Math.max(
            .05,
            game.tax>30?.45:-.08
        );

    if(game.tax>35)
        game.governmentPopularity-=2;

    if(game.tax<12)
        game.money+=Math.floor(game.production*.1);

    game.readiness+=
        2+
        game.militaryBudget*.025;

    if(game.militaryBudget<15)
        game.readiness-=3;

    game.readiness=
        Math.max(
            0,
            Math.min(100,game.readiness)
        );

    game.stability+=
        game.welfareBudget*.025-
        game.warWeariness*.025;

    game.stability=
        Math.max(
            0,
            Math.min(100,game.stability)
        );

    game.warWeariness=
        Math.max(
            0,
            game.warWeariness-2
        );

    if(game.warCooldown>0)
        game.warCooldown--;

    game.commandPoints=
        Math.min(
            20,
            game.commandPoints+
            2+
            (game.stability>70?1:0)
        );

    game.population=
        Math.floor(
            game.population*
            (1+
            Math.max(
                .001,
                .004+
                game.stability/30000
            ))
        );

    if(Math.random()<.28)
        randomEvent();

    updateUI();

    showToast(
        `سال ${game.year} آغاز شد. درآمد سالانه: ${income.toLocaleString("fa-IR")}💰`
    );

}


/* =========================================================
   RANDOM EVENTS
========================================================= */

function randomEvent(){

    const events=[

        ()=>{
            game.money+=350;
            game.reputation+=2;
            showToast("📈 رونق تجاری! 350💰 درآمد اضافه دریافت شد.");
        },

        ()=>{
            game.production+=4;
            showToast("🏭 جهش تولید! تولید ملی افزایش یافت.");
        },

        ()=>{
            game.stability-=5;
            game.inflation+=.8;
            showToast("📉 بحران اقتصادی! ثبات و اقتصاد آسیب دید.");
        },

        ()=>{
            game.stability+=5;
            game.governmentPopularity+=4;
            showToast("🏛 آرامش سیاسی! محبوبیت دولت افزایش یافت.");
        },

        ()=>{
            game.readiness-=6;
            game.warWeariness+=4;
            showToast("⚠️ فشار خارجی! آمادگی کشور کاهش یافت.");
        },

        ()=>{
            game.money+=
                Math.floor(
                    200+
                    Math.random()*500
                );

            showToast("💰 قرارداد بزرگ ملی امضا شد.");
        },

        ()=>{
            game.cities++;
            game.production+=2;
            showToast("🏙️ یک شهر جدید رشد کرد.");
        }

    ];

    const event=
        events[
            Math.floor(
                Math.random()*events.length
            )
        ];

    event();

    game.stability=
        Math.max(
            0,
            Math.min(100,game.stability)
        );

    game.reputation=
        Math.max(
            0,
            Math.min(100,game.reputation)
        );

}


/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){

    localStorage.setItem(
        "WORLD_EMPIRE_SAVE",
        JSON.stringify(game)
    );

    showToast("بازی ذخیره شد.");

}

function loadGame(){

    const raw=
        localStorage.getItem("WORLD_EMPIRE_SAVE");

    if(!raw){

        showToast("ذخیره‌ای پیدا نشد.");
        return;

    }

    try{

        const saved=JSON.parse(raw);

        game={
            ...game,
            ...saved
        };

        updateUI();
        refreshCountryColors();

        showToast("بازی بارگذاری شد.");

    }catch(e){

        showToast("ذخیره خراب است.");

    }

}


/* =========================================================
   UI UPDATE
========================================================= */

function updateUI(){

    document.getElementById("miniFlag").textContent=
        game.flag;

    document.getElementById("miniName").textContent=
        game.countryName||"---";

    document.getElementById("miniYear").textContent=
        "سال "+game.year;

    document.getElementById("statMoney").textContent=
        Math.floor(game.money).toLocaleString("fa-IR");

    document.getElementById("statPopulation").textContent=
        formatPopulation(game.population);

    document.getElementById("statProduction").textContent=
        Math.floor(game.production);

    document.getElementById("statRep").textContent=
        Math.floor(game.reputation);

    document.getElementById("statCities").textContent=
        Math.floor(game.cities);

    document.getElementById("statPower").textContent=
        calculateNationalPower();

    document.getElementById("statReady").textContent=
        Math.floor(game.readiness)+"%";

    document.getElementById("statCP").textContent=
        game.commandPoints;

}


/* =========================================================
   MODALS
========================================================= */

function openModal(id){

    document.getElementById(id).style.display="flex";

    if(id==="storeModal")
        renderStore();

    if(id==="govModal")
        renderGovernment();

    if(id==="countryModal")
        renderCountryManagement();

}

function closeModal(id){

    document.getElementById(id).style.display="none";

}

document.querySelectorAll(".modalBack")
.forEach(back=>{

    back.addEventListener("click",e=>{

        if(e.target===back)
            back.style.display="none";

    });

});


/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function showToast(text){

    const el=document.getElementById("toast");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        el.classList.remove("show");
    },2800);

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){

        document.querySelectorAll(".modalBack")
        .forEach(m=>m.style.display="none");

    }

});


/* =========================================================
   AUTO SAVE
========================================================= */

setInterval(()=>{

    if(
        game.countryCode &&
        document.getElementById("game").style.display!=="none"
    ){

        localStorage.setItem(
            "WORLD_EMPIRE_SAVE",
            JSON.stringify(game)
        );

    }

},30000);

========================================================= */

renderCountryList();

========================================================= */

window.openStore=openStore;


/* =========================================================
   MAP COLOR REFRESH AFTER CONQUEST
========================================================= */

window.refreshCountryColors=refreshCountryColors;


/* =========================================================
   INITIAL STATUS
========================================================= */

console.log(
    "WORLD EMPIRE loaded successfully."
);

</script>
