<style>

:root{
--bg:#061b35;
--panel:#0a2341e8;
--line:#2b5c8b;
--cyan:#27d4ff;
--blue:#3288ff;

*{

html,body{
margin:0;
width:100%;
height:100%;

background:var(--bg);

/* =========================
MAP
========================= */

inset:0;
width:100%;
height:100%;

.toast{

position:absolute;

top:165px;

left:50%;

transform:
translateX(-50%);

border:1px solid #3a79a7;

padding:11px 17px;

font-size:10px;

display:none;

}

.toast.show{

animation:
pop 2.2s ease forwards;
}

@keyframes pop{

0%{
opacity:0;
transform:
translate(-50%,-8px);
}

10%,80%{
opacity:1;
transform:
translate(-50%,0);
}

100%{
opacity:0;
}
}

LOADING

z-index:150;

height:42px;

margin:

r .8s linear infinite;

@keyframes r{
to{
transform:rotate(360deg);

'use strict';

const ctx =

let W=0;
let H=0;

let features=[];

let selected=null;

let scale=1;

let ox=0;
let oy=0;

let drag=false;

let moved=false;

let lastX=0;

/* =========================================================

const state={

/* =========================================================

const weapons=[

],

],

/* =========================================================

const fa={

/* =========================================================

const fallback=[

/* =========================================================
RESIZE
========================================================= */

function resize(){

const d =
window.devicePixelRatio || 1;

W=innerWidth;

H=innerHeight;

canvas.width=W*d;

canvas.height=H*d;

canvas.style.width=W+'px';

canvas.style.height=H+'px';

ctx.setTransform(
d,
0,
0,
d,
0,
0
);

draw();

}

window.addEventListener(
'resize',
resize
);


/* =========================================================
PROJECTION
========================================================= */

function project(lon,lat){

const x =
(lon+180)/360*W*scale+ox;

const y =
(90-lat)/180*H*scale+oy;

return [
x,
y
];

}


/* =========================================================
DRAW MAP
========================================================= */

function draw(){

ctx.clearRect(
0,
0,
W,
H
);


/* ocean */

ctx.fillStyle='#08284a';

ctx.fillRect(
0,
0,
W,
H
);


/* longitude */

ctx.strokeStyle='#55a9dc';

ctx.globalAlpha=.16;

ctx.lineWidth=1;

for(
let lon=-180;
lon<=180;
lon+=30
){

const [x]=
project(lon,0);

ctx.beginPath();

ctx.moveTo(x,0);

ctx.lineTo(x,H);

ctx.stroke();

}


/* latitude */

for(
let lat=-60;
lat<=60;
lat+=20
){

const [,y]=
project(0,lat);

ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(W,y);

ctx.stroke();

}

ctx.globalAlpha=1;


/* countries */

const arr =
features.length
?
features
:
fallback.map(
(f,i)=>({

name:f.n,

paths:[
f.p.map(
q=>project(q[0],q[1])
)
],

idx:i

})
);


arr.forEach(
(f,i)=>{

f.paths.forEach(
path=>{

if(!path.length)
return;

ctx.beginPath();

path.forEach(
(p,j)=>{

if(j)
ctx.lineTo(
p[0],
p[1]
);

else
ctx.moveTo(
p[0],
p[1]
);

}
);

ctx.closePath();


ctx.fillStyle =
colors[
(i*7)%
colors.length
];

ctx.fill();


ctx.strokeStyle=
'#8ab6d6';

ctx.lineWidth=1;

ctx.stroke();

}

);

});


/* selected country */

if(selected){

ctx.strokeStyle=
'#ffd44c';

ctx.lineWidth=3;

selected.paths.forEach(
path=>{

ctx.beginPath();

path.forEach(
(p,j)=>{

if(j)
ctx.lineTo(
p[0],
p[1]
);

else
ctx.moveTo(
p[0],
p[1]
);

}
);

ctx.closePath();

ctx.stroke();

}

);

}

}


/* =========================================================
LOAD REAL WORLD MAP
========================================================= */

function loadWorld(){

fetch(
'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'
)

.then(
r=>{

if(!r.ok)
throw new Error();

return r.json();

}
)

.then(
topo=>{

return Promise.all([

topo,

loadScript(
'https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js'
)

]);

}
)

.then(
([topo])=>{

const geo =
topojson.feature(
topo,
topo.objects.countries
);


features =
geo.features.map(
(f,i)=>{

const paths=[];

const g=
f.geometry;


if(g.type==='Polygon'){

paths.push(
g.coordinates[0].map(
q=>project(q[0],q[1])
)
);

}


else if(
g.type==='MultiPolygon'
){

g.coordinates.forEach(
poly=>{

paths.push(
poly[0].map(
q=>project(q[0],q[1])
)
);

});

}


return{

name:
f.properties.name ||
'Country '+i,

paths:paths,

raw:f,

idx:i

};

});


document.getElementById(
'loading'
).style.display='none';

draw();

}

)

.catch(
()=>{

document.getElementById(
'loading'
).style.display='none';

draw();

showToast(
'نقشه پایه بارگذاری شد. برای مرزهای دقیق اتصال اینترنت لازم است.'
);

}

);

}


/* =========================================================
SCRIPT LOADER
========================================================= */

function loadScript(src){

return new Promise(
(res,rej)=>{

const s=
document.createElement('script');

s.src=src;

s.onload=res;

s.onerror=rej;

document.head.appendChild(s);

}
);

}


/* =========================================================
POINT IN POLYGON
========================================================= */

function pointIn(
px,
py,
path
){

let hit=false;

for(
let i=0,j=path.length-1;
i<path.length;
j=i++
){

const xi=path[i][0];

const yi=path[i][1];

const xj=path[j][0];

const yj=path[j][1];

const inter =
(
(yi>py)!==(yj>py)
)
&&
(
px<
(xj-xi)
*(py-yi)
/
(yj-yi)
+x i
);

if(inter)
hit=!hit;

}

return hit;

}


/* =========================================================
FIX TYPO SAFE POLYGON CHECK
========================================================= */

function polygonHit(
px,
py,
path
){

let inside=false;

for(
let i=0,j=path.length-1;
i<path.length;
j=i++
){

const xi=path[i][0];

const yi=path[i][1];

const xj=path[j][0];

const yj=path[j][1];

const intersect=
(
(yi>py)!==(yj>py)
)
&&
(
px<
(xj-xi)
*(py-yi)
/
((yj-yi)||0.00001)
+xi
);

if(intersect)
inside=!inside;

}

return inside;

}


/* =========================================================
POINTER
========================================================= */

canvas.addEventListener(
'pointerdown',
e=>{

drag=true;

moved=false;

lastX=e.clientX;

lastY=e.clientY;

canvas.setPointerCapture(
e.pointerId
);

}
);


canvas.addEventListener(
'pointermove',
e=>{

if(!drag)
return;

const dx=
e.clientX-lastX;

const dy=
e.clientY-lastY;

if(
Math.abs(dx)>2 ||
Math.abs(dy)>2
)
moved=true;

ox+=dx;

oy+=dy;

lastX=e.clientX;

lastY=e.clientY;

draw();

}
);


canvas.addEventListener(
'pointerup',
e=>{

drag=false;

}
);


/* =========================================================
ZOOM
========================================================= */

canvas.addEventListener(
'wheel',
e=>{

e.preventDefault();

const old=scale;

scale=
Math.max(
.72,
Math.min(
2.7,
scale*
(
e.deltaY<0
?
1.12
:
.89
)
)
);

ox=
e.clientX-
(
e.clientX-ox
)
*
(scale/old);

oy=
e.clientY-
(
e.clientY-oy
)
*
(scale/old);


/* recalculate paths */

if(features.length){

features.forEach(
f=>{

const g=
f.raw.geometry;

const paths=[];

if(
g.type==='Polygon'
){

paths.push(
g.coordinates[0].map(
q=>project(
q[0],
q[1]
)
)
);

}

else{

g.coordinates.forEach(
poly=>{

paths.push(
poly[0].map(
q=>project(
q[0],
q[1]
)
)
);

});

}

f.paths=paths;

});

}

draw();

},
{
passive:false
}
);


/* =========================================================
CLICK COUNTRY
========================================================= */

canvas.addEventListener(
'click',
e=>{

if(moved)
return;

let hit=null;


/* real countries */

for(
let i=features.length-1;
i>=0 && !hit;
i--
){

if(
features[i].paths.some(
p=>polygonHit(
e.clientX,
e.clientY,
p
)
)
){

hit=features[i];

}

}


/* fallback */

if(
!hit &&
fallback.length
){

for(
let i=0;
i<fallback.length;
i++
){

const p=
fallback[i].p.map(
q=>project(
q[0],
q[1]
)
);

if(
polygonHit(
e.clientX,
e.clientY,
p
)
){

hit={

name:
fallback[i].n,

paths:[p],

idx:i

};

break;

}

}

}


if(hit)
selectCountry(hit);

}
);
