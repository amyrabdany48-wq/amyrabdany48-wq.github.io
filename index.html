<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>WORLD EMPIRE — GeoStrategy</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08111d;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

#countryScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:
        radial-gradient(circle at 50% 20%,#17365c 0,#091525 42%,#040a11 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.countryBox{
    width:min(850px,96vw);
    max-height:94vh;
    background:rgba(8,18,31,.96);
    border:1px solid #315b82;
    border-radius:22px;
    box-shadow:0 20px 70px #000;
    padding:22px;
    display:flex;
    flex-direction:column;
}

.countryTitle{
    text-align:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:5px;
}

.countrySub{
    text-align:center;
    color:#9fb6ca;
    margin-bottom:15px;
}

.countrySearch{
    width:100%;
    background:#101f31;
    color:white;
    border:1px solid #31506b;
    border-radius:12px;
    padding:13px;
    outline:none;
    margin-bottom:12px;
    font-size:15px;
}

.countryGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;
    overflow:auto;
    padding:3px;
    max-height:52vh;
}

.countryBtn{
    background:#102237;
    color:#dcecff;
    border:1px solid #294967;
    padding:11px 8px;
    border-radius:11px;
    text-align:right;
    transition:.15s;
}

.countryBtn:hover{
    background:#193957;
    border-color:#55a9ed;
}

.countryBtn.selected{
    background:#165080;
    border-color:#67c0ff;
    box-shadow:0 0 15px #168de055;
}

.countryName{
    font-weight:bold;
    font-size:14px;
}

.countryMeta{
    color:#8ea9be;
    font-size:11px;
    margin-top:4px;
}

.startGame{
    width:100%;
    margin-top:14px;
    padding:15px;
    border-radius:13px;
    color:#fff;
    background:linear-gradient(135deg,#1175c5,#1b9a6c);
    font-size:18px;
    font-weight:900;
}

.startGame:disabled{
    opacity:.4;
}

#game{
    display:none;
    position:fixed;
    inset:0;
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
    background:#dce8ee;
}

.topbar{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    z-index:1000;
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

.topbar::-webkit-scrollbar{
    display:none;
}

.stat{
    min-width:108px;
    background:rgba(7,17,29,.92);
    border:1px solid #31516d;
    border-radius:11px;
    padding:7px 10px;
    box-shadow:0 5px 15px #0005;
}

.stat b{
    display:block;
    font-size:12px;
    color:#91aec4;
}

.stat span{
    display:block;
    font-size:14px;
    margin-top:3px;
    font-weight:bold;
}

.mapTools{
    position:absolute;
    right:9px;
    top:76px;
    z-index:1000;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.toolBtn{
    width:44px;
    height:44px;
    border-radius:12px;
    color:white;
    background:rgba(7,17,29,.92);
    border:1px solid #385873;
    font-size:19px;
}

.bottomDock{
    position:absolute;
    z-index:3000;
    bottom:9px;
    left:8px;
    right:8px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.dockBtn{
    min-height:58px;
    background:rgba(6,17,29,.96);
    border:1px solid #34536e;
    border-radius:13px;
    color:white;
    font-weight:bold;
    font-size:12px;
    box-shadow:0 7px 18px #0007;
}

.dockBtn strong{
    display:block;
    font-size:19px;
    margin-bottom:3px;
}

.storeDock{
    grid-column:span 1;
    background:linear-gradient(135deg,#744e0b,#b57a11);
    border-color:#dca92e;
}

.nextBtn{
    background:linear-gradient(135deg,#125d91,#087a67);
}

.modal{
    position:fixed;
    inset:0;
    z-index:10000;
    background:#0008;
    display:none;
    align-items:center;
    justify-content:center;
    padding:12px;
}

.modal.show{
    display:flex;
}

.panel{
    width:min(950px,97vw);
    max-height:92vh;
    overflow:hidden;
    background:#091625;
    border:1px solid #355a78;
    border-radius:18px;
    box-shadow:0 25px 80px #000;
    display:flex;
    flex-direction:column;
}

.panelHead{
    padding:14px;
    background:#0d2033;
    border-bottom:1px solid #294760;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.panelHead h2{
    margin:0;
    font-size:19px;
}

.closeBtn{
    width:36px;
    height:36px;
    border-radius:9px;
    background:#51232a;
    color:#fff;
    font-size:20px;
}

.panelBody{
    padding:13px;
    overflow:auto;
}

.tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:12px;
}

.tab{
    white-space:nowrap;
    background:#132a40;
    color:#b8d0e2;
    border:1px solid #31506a;
    padding:9px 13px;
    border-radius:9px;
}

.tab.active{
    background:#1c638f;
    color:#fff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:9px;
}

.card{
    background:#0d2032;
    border:1px solid #294963;
    border-radius:12px;
    padding:11px;
}

.card h3{
    margin:0 0 7px;
    font-size:14px;
}

.card p{
    margin:4px 0;
    color:#9eb5c8;
    font-size:12px;
    line-height:1.7;
}

.price{
    color:#ffd45b;
    font-weight:bold;
}

.buy{
    width:100%;
    margin-top:8px;
    padding:9px;
    border-radius:8px;
    color:#fff;
    background:#166f9e;
    font-weight:bold;
}

.buy:disabled{
    opacity:.35;
}

.sell{
    background:#59672a;
}

.sectionTitle{
    margin:15px 0 9px;
    color:#77c8ff;
    border-right:3px solid #3ea9e9;
    padding-right:8px;
}

.govGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.govCard{
    background:#0d2032;
    border:1px solid #294963;
    border-radius:13px;
    padding:13px;
}

.govCard h3{
    margin:0 0 8px;
}

.range{
    width:100%;
}

.action{
    width:100%;
    padding:10px;
    margin-top:7px;
    border-radius:9px;
    color:#fff;
    background:#185f87;
}

.action.green{
    background:#176e59;
}

.action.red{
    background:#71313a;
}

.action.gold{
    background:#765914;
}

.warTarget{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:#0e2235;
    border:1px solid #294b64;
    border-radius:10px;
    padding:10px;
    margin-bottom:7px;
}

.warTarget button{
    background:#853b42;
    color:white;
    padding:8px 12px;
    border-radius:8px;
}

.powerBox{
    background:#101f31;
    border:1px solid #35526a;
    padding:13px;
    border-radius:12px;
    margin-bottom:12px;
}

.powerLine{
    display:flex;
    justify-content:space-between;
    margin:7px 0;
}

.bar{
    height:10px;
    background:#172d41;
    border-radius:20px;
    overflow:hidden;
}

.bar i{
    display:block;
    height:100%;
    background:#39a5d8;
    width:50%;
}

.log{
    background:#06111d;
    border:1px solid #213b51;
    border-radius:10px;
    padding:10px;
    max-height:180px;
    overflow:auto;
    font-size:12px;
    line-height:1.9;
}

.log div{
    border-bottom:1px solid #ffffff0c;
    padding:3px;
}

.good{color:#54d49a}
.bad{color:#ff7070}
.gold{color:#ffd35a}
.blue{color:#65c5ff}

.leaflet-control-attribution{
    font-size:8px!important;
}

@media(max-width:650px){
    .stat{
        min-width:95px;
    }

    .bottomDock{
        grid-template-columns:repeat(5,1fr);
    }

    .dockBtn{
        min-height:54px;
        font-size:10px;
    }

    .dockBtn strong{
        font-size:17px;
    }

    .panel{
        max-height:94vh;
    }
}
</style>
</head>

<body>

<div id="countryScreen">
    <div class="countryBox">
        <div class="countryTitle">🌍 WORLD EMPIRE</div>
        <div class="countrySub">کشور خود را برای شروع امپراتوری انتخاب کنید</div>

        <input id="countrySearch"
               class="countrySearch"
               placeholder="🔎 جستجوی کشور..."
               autocomplete="off">

        <div id="countryGrid" class="countryGrid"></div>

        <button id="startBtn" class="startGame" disabled>
            شروع بازی
        </button>
    </div>
</div>

<div id="game">

    <div id="map"></div>

    <div class="topbar">
        <div class="stat">
            <b>💰 خزانه</b>
            <span id="money">0</span>
        </div>

        <div class="stat">
            <b>👥 جمعیت</b>
            <span id="population">0</span>
        </div>

        <div class="stat">
            <b>🏭 تولید</b>
            <span id="production">0</span>
        </div>

        <div class="stat">
            <b>🛡️ توان کشور</b>
            <span id="power">0</span>
        </div>

        <div class="stat">
            <b>🏙️ شهرها</b>
            <span id="cities">0</span>
        </div>

        <div class="stat">
            <b>📈 اعتبار</b>
            <span id="reputation">0</span>
        </div>

        <div class="stat">
            <b>🗓️ سال</b>
            <span id="year">1</span>
        </div>

        <div class="stat">
            <b>📊 تورم</b>
            <span id="inflation">0%</span>
        </div>
    </div>

    <div class="mapTools">
        <button class="toolBtn" onclick="map.setZoom(map.getZoom()+1)">+</button>
        <button class="toolBtn" onclick="map.setZoom(map.getZoom()-1)">−</button>
        <button class="toolBtn" onclick="cycleMapMode()">◈</button>
        <button class="toolBtn" onclick="openGovernment()">🏛️</button>
    </div>

    <div class="bottomDock">
        <button class="dockBtn storeDock" onclick="openStore()">
            <strong>🛒</strong>
            فروشگاه
        </button>

        <button class="dockBtn" onclick="openGovernment()">
            <strong>🏛️</strong>
            دولت
        </button>

        <button class="dockBtn" onclick="openWar()">
            <strong>⚔️</strong>
            جنگ
        </button>

        <button class="dockBtn" onclick="openCountryManagement()">
            <strong>🌐</strong>
            کشور
        </button>

        <button class="dockBtn nextBtn" onclick="nextTurn()">
            <strong>⏭️</strong>
            سال بعد
        </button>
    </div>
</div>

<!-- STORE -->
<div id="storeModal" class="modal">
    <div class="panel">
        <div class="panelHead">
            <h2>🛒 فروشگاه ملی</h2>
            <button class="closeBtn" onclick="closeModal('storeModal')">×</button>
        </div>

        <div class="panelBody">
            <div class="tabs" id="storeTabs"></div>
            <div id="storeGrid" class="grid"></div>
        </div>
    </div>
</div>

<!-- GOVERNMENT -->
<div id="governmentModal" class="modal">
    <div class="panel">
        <div class="panelHead">
            <h2>🏛️ دولت و مدیریت کشور</h2>
            <button class="closeBtn" onclick="closeModal('governmentModal')">×</button>
        </div>

        <div class="panelBody" id="governmentBody"></div>
    </div>
</div>

<!-- WAR -->
<div id="warModal" class="modal">
    <div class="panel">
        <div class="panelHead">
            <h2>⚔️ مرکز جنگ و عملیات</h2>
            <button class="closeBtn" onclick="closeModal('warModal')">×</button>
        </div>

        <div class="panelBody" id="warBody"></div>
    </div>
</div>

<!-- COUNTRY -->
<div id="countryModal" class="modal">
    <div class="panel">
        <div class="panelHead">
            <h2>🌐 مدیریت کشور</h2>
            <button class="closeBtn" onclick="closeModal('countryModal')">×</button>
        </div>

        <div class="panelBody" id="countryBody"></div>
    </div>
</div>

function renderCountries(filter=""){
    const grid=document.getElementById("countryGrid");
    grid.innerHTML="";

    const f=filter.trim().toLowerCase();

    COUNTRIES
    .filter(c=>{
        return !f ||
            c[0].toLowerCase().includes(f) ||
            c[1].toLowerCase().includes(f);
    })
    .forEach(c=>{
        const btn=document.createElement("button");
        btn.className="countryBtn"+
            (game.countryCode===c[0]?" selected":"");

        btn.innerHTML=`
            <div class="countryName">${c[1]}</div>
            <div class="countryMeta">
                جمعیت تقریبی: ${formatNumber(c[2])}M
            </div>
        `;

        btn.onclick=()=>{
            game.countryCode=c[0];
            game.country=c[1];
            selectedCountry=c;
            renderCountries(document.getElementById("countrySearch").value);
            document.getElementById("startBtn").disabled=false;
        };

        grid.appendChild(btn);
    });
}

document.getElementById("startBtn").onclick=()=>{
    if(!game.countryCode)return;

    const c=COUNTRIES.find(x=>x[0]===game.countryCode);

    game.population=c[2];
    game.production=c[3];

    game.money=25000+game.production*100;
    game.cities=Math.max(3,Math.round(game.population/20));
    game.power=Math.round(
        game.production*2+
        game.cities*12+
        game.population/10
    );

    for(const x of COUNTRIES){
        game.relations[x[0]]=50;
    }

    game.relations[game.countryCode]=100;

    document.getElementById("countryScreen").style.display="none";
    document.getElementById("game").style.display="block";

    initMap();
    updateUI();
    logEvent(`کشور ${game.country} انتخاب شد.`);
};

/* =========================================================
   MAP
   هیچ تغییری در ساختار نقشه، منبع GeoJSON یا لایه نقشه ایجاد نشده
========================================================= */

function initMap(){

    map=L.map("map",{
        worldCopyJump:false,
        zoomControl:false,
        minZoom:2,
        maxZoom:7
    }).setView([25,10],2);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);

    fetch(MAP_GEOJSON)
    .then(r=>r.json())
    .then(data=>{
        geoData=data;

        geoLayer=L.geoJSON(data,{
            style:countryStyle,
            onEachFeature:(feature,layer)=>{
                layer.on({
                    click:()=>{
                        const name=getFeatureName(feature);
                        showCountryInfo(name);
                    },
                    mouseover:e=>{
                        e.target.setStyle({
                            weight:2,
                            color:"#ffffff",
                            fillOpacity:.7
                        });
                    },
                    mouseout:e=>{
                        geoLayer.resetStyle(e.target);
                    }
                });
            }
        }).addTo(map);
    })
    .catch(()=>{
        logEvent("نقشه در حالت آفلاین بارگذاری نشد؛ سیستم بازی همچنان فعال است.");
    });
}

function getFeatureName(feature){
    const p=feature.properties||{};

    return p.ADMIN ||
        p.NAME ||
        p.name ||
        p.ADMIN_NAME ||
        p.Country ||
        "کشور ناشناس";
}

function countryStyle(){
    return {
        color:"#536b78",
        weight:1,
        fillColor:"#b9cbd1",
        fillOpacity:.48
    };
}

/* =========================================================
   MAP MODE
========================================================= */

function cycleMapMode(){
    game.mapMode=(game.mapMode+1)%4;

    if(!geoLayer)return;

    geoLayer.eachLayer(layer=>{
        const name=getFeatureName(layer.feature);

        let fill="#b9cbd1";

        if(game.mapMode===1){
            const hash=hashName(name);
            fill=`hsl(${(hash%100)+120},35%,${42+(hash%20)}%)`;
        }

        if(game.mapMode===2){
            const hash=hashName(name);
            fill=`hsl(${(hash%50)+5},55%,${40+(hash%18)}%)`;
        }

        if(game.mapMode===3){
            const hash=hashName(name);
            fill=`hsl(${(hash%90)+190},45%,${38+(hash%20)}%)`;
        }

        layer.setStyle({
            color:"#536b78",
            weight:1,
            fillColor:fill,
            fillOpacity:.55
        });
    });
}

function hashName(s){
    let h=0;
    for(let i=0;i<s.length;i++){
        h=((h<<5)-h)+s.charCodeAt(i);
        h|=0;
    }
    return Math.abs(h);
}

function openStore(){

function renderStore(){

    const tabs=document.getElementById("storeTabs");
    const grid=document.getElementById("storeGrid");

    tabs.innerHTML="";
    grid.innerHTML="";

    storeCategories.forEach(cat=>{
        const b=document.createElement("button");
        b.className="tab"+(game.storeCategory===cat?" active":"");
        b.textContent=cat;

        b.onclick=()=>{
            game.storeCategory=cat;
            renderStore();
        };

        tabs.appendChild(b);
    });

    let items=[];

    if(game.storeCategory==="همه"){
        Object.entries(STORE).forEach(([cat,list])=>{
            list.forEach(item=>items.push({
                category:cat,
                data:item
            }));
        });
    }else{
        STORE[game.storeCategory].forEach(item=>{
            items.push({
                category:game.storeCategory,
                data:item
            });
        });
    }

    items.forEach(obj=>{
        const [name,desc,basePrice,effect,kind]=obj.data;
        const price=Math.round(basePrice*(1+game.inflation/100));

        const owned=game.inventory[name]||0;

        const card=document.createElement("div");
        card.className="card";

        card.innerHTML=`
            <h3>${name}</h3>
            <p>${desc}</p>
            <p>بخش: ${obj.category}</p>
            <p>اثر: <span class="blue">+${effect}</span></p>
            <p>دارایی: <b>${owned}</b></p>
            <p class="price">💰 ${formatMoney(price)}</p>

            <button class="buy"
                ${game.money<price?"disabled":""}
                onclick="buyItem('${escapeJs(name)}',${price},${effect},'${kind}')">
                خرید
            </button>

            <button class="buy sell"
                ${owned<=0?"disabled":""}
                onclick="sellItem('${escapeJs(name)}',${Math.round(price*.75)},${effect},'${kind}')">
                فروش
            </button>
        `;

        grid.appendChild(card);
    });
}

function escapeJs(s){
    return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function buyItem(name,price,effect,kind){

    if(game.money<price)return;

    game.money-=price;
    game.inventory[name]=(game.inventory[name]||0)+1;

    applyStoreEffect(effect,kind,1);

    logEvent(`خرید «${name}» انجام شد.`);
    updateUI();
    renderStore();
}

function sellItem(name,price,effect,kind){

    if(!game.inventory[name])return;

    game.inventory[name]--;

    if(game.inventory[name]<=0)
        delete game.inventory[name];

    game.money+=price;

    applyStoreEffect(effect,kind,-1);

    logEvent(`«${name}» فروخته شد.`);
    updateUI();
    renderStore();
}

function applyStoreEffect(effect,kind,sign){

    if(kind==="production")
        game.production=Math.max(1,game.production+effect*.04*sign);

    if(kind==="stability")
        game.stability=clamp(game.stability+effect*.35*sign,0,100);

    if(kind==="reputation")
        game.reputation=clamp(game.reputation+effect*.3*sign,0,100);

    if(kind==="popularity")
        game.popularity=clamp(game.popularity+effect*.35*sign,0,100);

    if(kind==="technology")
        game.governmentLevel=Math.max(
            1,
            game.governmentLevel+effect*.015*sign
        );

    if(kind==="cities")
        game.cities=Math.max(1,game.cities+Math.round(effect*.05*sign));

    if(kind==="population")
        game.population=Math.max(
            0.1,
            game.population+effect*.03*sign
        );

    if(kind==="money")
        game.money=Math.max(0,game.money+effect*25*sign);

    if(kind==="trade")
        game.reputation=clamp(
            game.reputation+effect*.2*sign,
            0,100
        );
}

function calculatePower(){

    const budgetBonus=game.budget.army*.8;
    const stabilityBonus=game.stability*.35;
    const governmentBonus=game.governmentLevel*8;

    return Math.max(
        1,
        Math.round(
            game.power+
            budgetBonus+
            stabilityBonus+
            governmentBonus+
            game.cities*4
        )
    );
}

function enemyPower(country){

    const c=COUNTRIES.find(x=>x[0]===country);

    if(!c)return 100;

    let p=
        c[3]*2+
        c[2]/12+
        Math.max(1,c[2]/30)*8;

    const relation=game.relations[country]??50;

    p*=1+(50-relation)/300;

    return Math.max(20,Math.round(p));
}

function startWar(target){

    if(game.commandPoints<10){
        logEvent("امتیاز فرماندهی کافی نیست.","bad");
        return;
    }

    if(game.warWeariness>=80){
        logEvent("خستگی جنگی کشور بسیار بالاست.","bad");
        return;
    }

    const relation=game.relations[target]??50;

    if(relation>85){
        if(!confirm("رابطه با این کشور خوب است. آیا مطمئن هستید؟"))
            return;
    }

    const enemy=enemyPower(target);
    const mine=calculatePower();

    const terrain=Math.random()*.25-.1;
    const morale=(game.stability-50)/250;
    const random=(Math.random()-.5)*.28;

    const attackScore=mine*(1+morale+terrain+random);
    const defenseScore=enemy*(1+(Math.random()*.18));

    game.commandPoints-=10;
    game.warWeariness=clamp(
        game.warWeariness+10,
        0,100
    );

    if(attackScore>=defenseScore){

        game.victories++;

        game.money+=Math.round(enemy*80);

        game.reputation=clamp(
            game.reputation+2,
            0,100
        );

        game.stability=clamp(
            game.stability-2,
            0,100
        );

        game.relations[target]=-60;

        game.wars.push(
            `پیروزی در برابر ${countryDisplay(target)} | توان ${Math.round(attackScore)} در برابر ${Math.round(defenseScore)}`
        );

        logEvent(
            `درگیری با ${countryDisplay(target)} با پیروزی پایان یافت.`,
            "good"
        );

        showWarVictory(target);

    }else{

        game.defeats++;

        game.money=Math.max(
            0,
            game.money-Math.round(enemy*35)
        );

        game.reputation=clamp(
            game.reputation-6,
            0,100
        );

        game.stability=clamp(
            game.stability-7,
            0,100
        );

        game.warWeariness=clamp(
            game.warWeariness+12,
            0,100
        );

        game.wars.push(
            `شکست در برابر ${countryDisplay(target)} | توان ${Math.round(attackScore)} در برابر ${Math.round(defenseScore)}`
        );

        logEvent(
            `درگیری با ${countryDisplay(target)} با شکست پایان یافت.`,
            "bad"
        );

        showWarLoss(target);
    }

    updateUI();
    renderWar();
}

    if(type==="money"){
        game.money+=2500;
        game.reputation=clamp(game.reputation-1,0,100);

    if(type==="peace"){
        game.relations[target]=25;
        game.reputation=clamp(game.reputation+5,0,100);
        game.warWeariness=clamp(game.warWeariness-8,0,100);
        logEvent("توافق صلح برقرار شد.","good");
    }

    if(type==="control"){
        if(game.money>=1800){
            game.money-=1800;
            game.cities++;
            game.reputation=clamp(game.reputation+1,0,100);
            logEvent("نفوذ منطقه‌ای افزایش یافت.","good");

    if(type==="ceasefire"){
        game.relations[target]=15;
        game.stability=clamp(game.stability+7,0,100);
        game.warWeariness=clamp(game.warWeariness-10,0,100);
        logEvent("آتش‌بس برقرار شد.","good");

    if(type==="rebuild"){
        if(game.money>=3000){
            game.money-=3000;
            game.power+=30;
            game.stability=clamp(game.stability+8,0,100);
            logEvent("بازسازی ملی آغاز شد.","good");
        }else{
            logEvent("بودجه کافی برای بازسازی نیست.","bad");
        }
    }

    updateUI();
    renderWar();
}

function nextTurn(){

    game.year++;

    const gov=
        GOVERNMENTS.find(g=>g.name===game.governmentType)
        ||GOVERNMENTS[0];

    const taxIncome=
        game.production*
        (game.tax/20)*
        gov.economy*
        (1+game.budget.economy/100);

    const upkeep=
        game.cities*70+
        game.power*.8+
        game.population*3;

    const welfareCost=
        game.population*
        (game.budget.welfare/100)*
        20;

    const infrastructureBonus=
        game.budget.infrastructure/100;

    const net=
        taxIncome-
        upkeep-
        welfareCost+
        game.production*2;

    game.money=Math.max(
        0,
        game.money+net
    );

    game.production*=(
        1+
        .005+
        game.budget.economy/2000+
        infrastructureBonus/100
    );

    game.population*=1.004;

    game.inflation=clamp(
        game.inflation+
        (game.tax-20)*.03+
        (Math.random()-.45)*.8,
        0,40
    );

    game.commandPoints=clamp(
        game.commandPoints+15+
        game.budget.army*.1,
        0,100
    );

    game.warWeariness=clamp(
        game.warWeariness-5,
        0,100
    );

    game.stability=clamp(
        game.stability+
        (game.budget.welfare-20)*.04+
        (game.budget.infrastructure-20)*.02-
        (game.tax-20)*.08,
        0,100
    );

    game.popularity=clamp(
        game.popularity+
        (game.budget.welfare-20)*.05-
        (game.tax-20)*.12+
        (game.stability-60)*.015,
        0,100
    );

    randomEvent();

    updateUI();

    if(document.getElementById("governmentModal").classList.contains("show"))
        renderGovernment();

    if(document.getElementById("countryModal").classList.contains("show"))
        renderCountryManagement();

    if(document.getElementById("warModal").classList.contains("show"))
        renderWar();

    logEvent(`سال ${game.year} آغاز شد.`);
}

/* =========================================================
   RANDOM EVENTS
========================================================= */

function randomEvent(){

    const r=Math.random();

    if(r<.08){
        const bonus=Math.round(1000+Math.random()*3000);

        game.money+=bonus;

        logEvent(
            `📦 رونق تجاری: ${formatMoney(bonus)} به خزانه اضافه شد.`,
            "good"
        );
    }

    else if(r<.15){

        game.inflation=clamp(
            game.inflation+2,
            0,40
        );

        game.popularity=clamp(
            game.popularity-3,
            0,100
        );

        logEvent(
            "📈 فشار اقتصادی باعث افزایش تورم شد.",
            "bad"
        );
    }

    else if(r<.21){

        game.production+=2;
        game.reputation=clamp(
            game.reputation+2,
            0,100
        );

        logEvent(
            "🔬 پیشرفت علمی باعث افزایش تولید شد.",
            "good"
        );
    }

    else if(r<.27){

        game.stability=clamp(
            game.stability-5,
            0,100
        );

        logEvent(
            "⚠️ بحران داخلی کوچکی رخ داد.",
            "bad"
        );
    }

    else if(r<.32){

        game.reputation=clamp(
            game.reputation+4,
            0,100
        );

        logEvent(
            "🤝 اعتبار بین‌المللی کشور افزایش یافت.",
            "good"
        );
    }
}

/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){

    localStorage.setItem(
        "WORLD_EMPIRE_SAVE",
        JSON.stringify(game)
    );

    logEvent("💾 بازی ذخیره شد.","good");
}

function loadGame(){

    const raw=localStorage.getItem("WORLD_EMPIRE_SAVE");

    if(!raw){
        logEvent("ذخیره‌ای پیدا نشد.","bad");
        return;
    }

    try{

        const saved=JSON.parse(raw);

        Object.assign(game,saved);

        logEvent("💾 بازی بارگذاری شد.","good");

        updateUI();

    }catch(e){
        logEvent("ذخیره خراب است.","bad");
    }
}

/* =========================================================

========================================================= */

function updateUI(){

    document.getElementById("population").textContent=
        formatNumber(game.population)+"M";

    document.getElementById("production").textContent=
        formatNumber(game.production);

    document.getElementById("power").textContent=
        calculatePower();

    document.getElementById("cities").textContent=
        game.cities;

    document.getElementById("reputation").textContent=

    document.getElementById("inflation").textContent=

}

/* =========================================================
   LOG
========================================================= */

function logEvent(text,type=""){

    const cls=
        type==="good"
        ?"good"
        :
        type==="bad"
        ?"bad"
        :
        "";

    game.logs.push(
        `<span class="${cls}">${text}</span>`
    );

    if(game.logs.length>100)
        game.logs.shift();
}

/* =========================================================
   MODALS
========================================================= */

function closeModal(id){
    document.getElementById(id).classList.remove("show");
}

document.querySelectorAll(".modal").forEach(modal=>{
    modal.addEventListener("click",e=>{
        if(e.target===modal)
            modal.classList.remove("show");
    });
});

/* =========================================================
   UTILITIES
========================================================= */

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function formatMoney(n){

    n=Math.round(Number(n)||0);

    if(n>=1000000000)
        return (n/1000000000).toFixed(1)+"B";

    if(n>=1000000)
        return (n/1000000).toFixed(1)+"M";

    if(n>=1000)
        return (n/1000).toFixed(1)+"K";

    return n.toLocaleString("fa-IR");
}

function formatNumber(n){

    n=Number(n)||0;

    if(n>=1000)
        return (n/1000).toFixed(1)+"K";

    if(n>=100)
        return Math.round(n).toLocaleString("fa-IR");

    return n.toFixed(1);
}
