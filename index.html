<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>World Front</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111c;
    font-family:Tahoma,Arial,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    background:#07111c;
}

#topbar{
    height:58px;
    min-height:58px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px;
    background:#101b29;
    border-bottom:1px solid #30445b;
    z-index:20;
}

.logo{
    font-size:16px;
    font-weight:bold;
    white-space:nowrap;
}

.stat{
    background:#0b1520;
    border:1px solid #293d52;
    border-radius:8px;
    padding:7px 9px;
    font-size:12px;
    white-space:nowrap;
}

#gameArea{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
}

#map{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#081724;
}

#panel{
    position:absolute;
    right:10px;
    bottom:10px;
    width:240px;
    padding:12px;
    background:rgba(13,23,35,.94);
    border:1px solid #30465e;
    border-radius:12px;
    z-index:10;
}

#panelTitle{
    font-weight:bold;
    font-size:15px;
    margin-bottom:7px;
}

#info{
    color:#b7c5d3;
    font-size:12px;
    line-height:1.8;
    min-height:65px;
}

button{
    width:100%;
    padding:9px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #3a5875;
    background:#19314a;
    color:white;
    font-family:inherit;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.4;
}

#attack{
    background:#682b31;
}

#miniWrap{
    position:absolute;
    left:10px;
    top:10px;
    width:160px;
    height:90px;
    background:#07111a;
    border:1px solid #30465e;
    border-radius:8px;
    overflow:hidden;
    z-index:10;
}

#mini{
    width:100%;
    height:100%;
}

#message{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#16293d;
    border:1px solid #3d5872;
    padding:9px 14px;
    border-radius:8px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:30;
    font-size:12px;
}

#message.show{
    opacity:1;
}

@media(max-width:700px){

    #topbar{
        height:52px;
        min-height:52px;
        overflow-x:auto;
    }

    .logo{
        font-size:13px;
    }

    .stat{
        font-size:10px;
        padding:6px;
    }

    #panel{
        width:205px;
    }

    #miniWrap{
        width:120px;
        height:68px;
    }
}
</style>
</head>

<body>

<div id="game">

<div id="topbar">

<div class="logo">🌍 WORLD FRONT</div>

<div class="stat">
💰 <span id="money">1200</span>
</div>

<div class="stat">
⚔️ <span id="army">320</span>
</div>

<div class="stat">
🏭 <span id="income">85</span>
</div>

<div class="stat">
📅 روز <span id="day">1</span>
</div>

</div>

<div id="gameArea">

<canvas id="map"></canvas>

<div id="miniWrap">
<canvas id="mini"></canvas>
</div>

<div id="panel">

<div id="panelTitle">
منطقه
</div>

<div id="info">
روی یکی از مناطق نقشه بزن.
</div>

<button id="recruit">
سربازگیری +25
</button>

<button id="upgrade">
ارتقا منطقه
</button>

<button id="attack">
حمله
</button>

<button id="turn">
پایان نوبت
</button>

<button id="reset">
شروع دوباره
</button>

</div>

<div id="message"></div>

</div>

</div>

<script>

/* ============================================================
   WORLD FRONT
   نسخه مستقل و بدون وابستگی خارجی
   ============================================================ */

"use strict";

/* ------------------------------------------------------------
   عناصر صفحه
   ------------------------------------------------------------ */

const canvas =
document.getElementById("map");

const ctx =
canvas.getContext("2d");

const mini =
document.getElementById("mini");

const mctx =
mini.getContext("2d");

const moneyEl =
document.getElementById("money");

const armyEl =
document.getElementById("army");

const incomeEl =
document.getElementById("income");

const dayEl =
document.getElementById("day");

const infoEl =
document.getElementById("info");

const recruitBtn =
document.getElementById("recruit");

const upgradeBtn =
document.getElementById("upgrade");

const attackBtn =
document.getElementById("attack");

const turnBtn =
document.getElementById("turn");

const resetBtn =
document.getElementById("reset");

const messageEl =
document.getElementById("message");


/* ------------------------------------------------------------
   اندازه جهان
   ------------------------------------------------------------ */

const WORLD_WIDTH = 2400;
const WORLD_HEIGHT = 1500;


/* ------------------------------------------------------------
   وضعیت بازی
   ------------------------------------------------------------ */

const game = {

    money:1200,

    army:320,

    income:85,

    day:1,

    selected:null,

    cameraX:WORLD_WIDTH/2,

    cameraY:WORLD_HEIGHT/2,

    zoom:.72,

    dragging:false,

    moved:false,

    pointerId:null,

    pointerX:0,

    pointerY:0,

    lastX:0,

    lastY:0,

    lastTime:performance.now(),

    accumulator:0

};


/* ------------------------------------------------------------
   اندازه Canvas
   ------------------------------------------------------------ */

let width=1;

let height=1;

let dpr=1;


/* ------------------------------------------------------------
   ابزارها
   ------------------------------------------------------------ */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


function distance(a,b,c,d){

    return Math.hypot(
        a-c,
        b-d
    );

}


function random(){

    return Math.random();

}


function message(text){

    messageEl.textContent=text;

    messageEl.classList.add("show");

    clearTimeout(message.timer);

    message.timer=setTimeout(
        ()=>{
            messageEl.classList.remove("show");
        },
        1500
    );

}


/* ------------------------------------------------------------
   تنظیم Canvas
   ------------------------------------------------------------ */

function resize(){

    const rect =
    canvas.getBoundingClientRect();

    width =
    Math.max(1,rect.width);

    height =
    Math.max(1,rect.height);

    dpr =
    Math.min(
        2,
        window.devicePixelRatio || 1
    );

    canvas.width =
    Math.floor(width*dpr);

    canvas.height =
    Math.floor(height*dpr);

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    const mr =
    mini.getBoundingClientRect();

    mini.width =
    Math.floor(
        Math.max(1,mr.width)*dpr
    );

    mini.height =
    Math.floor(
        Math.max(1,mr.height)*dpr
    );

    mctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resize
);

resize();


/* ------------------------------------------------------------
   داده مناطق
   ------------------------------------------------------------ */

const names=[

"آرکادیا",
"نورا",
"وسترا",
"الیسیا",
"کارما",
"دوریا",
"سلن",
"آرگون",
"ماروا",
"کاسپیا",
"اوریا",
"تارا",
"لورن",
"زریا",
"نورد",
"ایسترا",
"پارسون",
"رودان",
"سامورا",
"بلوریا",
"فریا",
"هلیوس",
"مریدا",
"اوریس"

];


const countries=[];


/* ------------------------------------------------------------
   ساخت شکل منطقه
   ------------------------------------------------------------ */

function createPolygon(
    cx,
    cy,
    rx,
    ry,
    count
){

    const points=[];

    const phase=
    random()*Math.PI*2;

    for(
        let i=0;
        i<count;
        i++
    ){

        const angle=
        phase+
        i*Math.PI*2/count;

        const noise=
        .82+
        random()*.22;

        points.push({

            x:
            cx+
            Math.cos(angle)*
            rx*
            noise,

            y:
            cy+
            Math.sin(angle)*
            ry*
            noise

        });

    }

    return points;

}


/* ------------------------------------------------------------
   ساخت جهان
   ------------------------------------------------------------ */

function createWorld(){

    countries.length=0;

    const cols=6;

    const rows=4;

    let id=0;

    for(
        let row=0;
        row<rows;
        row++
    ){

        for(
            let col=0;
            col<cols;
            col++
        ){

            const cx=
            260+
            col*375+
            (random()-.5)*90;

            const cy=
            240+
            row*330+
            (random()-.5)*80;

            const country={

                id:id,

                name:
                names[id],

                cx:cx,

                cy:cy,

                points:
                createPolygon(
                    cx,
                    cy,
                    155+random()*55,
                    105+random()*45,
                    18+Math.floor(random()*6)
                ),

                owner:
                id===7
                ?
                "player"
                :
                id%5===0
                ?
                "neutral"
                :
                "enemy",

                army:
                id===7
                ?
                180
                :
                60+
                Math.floor(random()*180),

                level:
                1+
                Math.floor(random()*3),

                income:
                10+
                Math.floor(random()*15),

                neighbors:[],

                color:"#6d506f"

            };


            if(
                country.owner==="player"
            ){

                country.color="#27699e";

            }


            if(
                country.owner==="neutral"
            ){

                country.color="#52616e";

            }


            countries.push(country);

            id++;

        }

    }


    /* --------------------------------------------------------
       همسایه‌ها
       -------------------------------------------------------- */

    for(
        const a of countries
    ){

        const nearest=
        countries
        .filter(
            b=>b!==a
        )
        .map(
            b=>({

                country:b,

                distance:
                distance(
                    a.cx,
                    a.cy,
                    b.cx,
                    b.cy
                )

            })
        )
        .sort(
            (x,y)=>
            x.distance-y.distance
        )
        .slice(0,4);


        for(
            const item of nearest
        ){

            if(
                item.distance<700
            ){

                if(
                    !a.neighbors.includes(
                        item.country.id
                    )
                ){

                    a.neighbors.push(
                        item.country.id
                    );

                }

            }

        }

    }


    /* --------------------------------------------------------
       تقارن همسایه‌ها
       -------------------------------------------------------- */

    for(
        const a of countries
    ){

        for(
            const id of a.neighbors
        ){

            const b=
            countries[id];

            if(
                !b.neighbors.includes(
                    a.id
                )
            ){

                b.neighbors.push(
                    a.id
                );

            }

        }

    }

}


createWorld();


/* ------------------------------------------------------------
   تبدیل مختصات
   ------------------------------------------------------------ */

function screenToWorld(x,y){

    return {

        x:
        game.cameraX+
        (x-width/2)/
        game.zoom,

        y:
        game.cameraY+
        (y-height/2)/
        game.zoom

    };

}


function worldToScreen(x,y){

    return {

        x:
        (x-game.cameraX)*
        game.zoom+
        width/2,

        y:
        (y-game.cameraY)*
        game.zoom+
        height/2

    };

}


/* ------------------------------------------------------------
   محدود کردن دوربین
   ------------------------------------------------------------ */

function limitCamera(){

    const halfW=
    width/
    game.zoom/
    2;

    const halfH=
    height/
    game.zoom/
    2;


    game.cameraX=
    clamp(
        game.cameraX,
        halfW,
        WORLD_WIDTH-halfW
    );


    game.cameraY=
    clamp(
        game.cameraY,
        halfH,
        WORLD_HEIGHT-halfH
    );

}


/* ------------------------------------------------------------
   رسم آب
   ------------------------------------------------------------ */

function drawBackground(){

    ctx.fillStyle="#081724";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const left=
    game.cameraX-
    width/
    game.zoom/
    2;

    const right=
    game.cameraX+
    width/
    game.zoom/
    2;

    const top=
    game.cameraY-
    height/
    game.zoom/
    2;

    const bottom=
    game.cameraY+
    height/
    game.zoom/
    2;


    ctx.strokeStyle=
    "rgba(80,150,190,.12)";

    ctx.lineWidth=1;


    const grid=100;


    ctx.beginPath();


    for(
        let x=
        Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){

        const p1=
        worldToScreen(x,top);

        const p2=
        worldToScreen(x,bottom);

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

    }


    for(
        let y=
        Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){

        const p1=
        worldToScreen(left,y);

        const p2=
        worldToScreen(right,y);

        ctx.moveTo(
            p1.x,
            p1.y
        );

        ctx.lineTo(
            p2.x,
            p2.y
        );

    }


    ctx.stroke();

}


/* ------------------------------------------------------------
   مسیر Polygon
   ------------------------------------------------------------ */

function pathCountry(country){

    const points=
    country.points;


    if(
        !points.length
    ){

        return;

    }


    const first=
    worldToScreen(
        points[0].x,
        points[0].y
    );


    ctx.beginPath();

    ctx.moveTo(
        first.x,
        first.y
    );


    for(
        let i=1;
        i<points.length;
        i++
    ){

        const p=
        worldToScreen(
            points[i].x,
            points[i].y
        );


        ctx.lineTo(
            p.x,
            p.y
        );

    }


    ctx.closePath();

}


/* ------------------------------------------------------------
   رسم مناطق
   ------------------------------------------------------------ */

function drawCountries(){

    for(
        const country of countries
    ){

        pathCountry(country);


        ctx.fillStyle=
        country.color;

        ctx.fill();


        if(
            game.selected===
            country
        ){

            ctx.strokeStyle=
            "#ffffff";

            ctx.lineWidth=4;

            ctx.shadowColor=
            "#56c8ff";

            ctx.shadowBlur=14;

        }
        else{

            ctx.strokeStyle=
            "rgba(210,225,235,.38)";

            ctx.lineWidth=2;

            ctx.shadowBlur=0;

        }


        ctx.stroke();

        ctx.shadowBlur=0;


        /* ----------------------------------------------------
           نام کشور
           ---------------------------------------------------- */

        const p=
        worldToScreen(
            country.cx,
            country.cy
        );


        if(
            p.x>-100 &&
            p.x<width+100 &&
            p.y>-100 &&
            p.y<height+100
        ){

            ctx.textAlign="center";

            ctx.textBaseline="middle";

            ctx.font=
            Math.max(
                9,
                13
            )+
            "px Tahoma";

            ctx.fillStyle=
            "#eef6fc";

            ctx.strokeStyle=
            "rgba(0,0,0,.7)";

            ctx.lineWidth=4;

            ctx.strokeText(
                country.name,
                p.x,
                p.y-15
            );

            ctx.fillText(
                country.name,
                p.x,
                p.y-15
            );


            ctx.font=
            "11px Tahoma";

            ctx.fillStyle=
            "#d6e5ef";

            ctx.fillText(
                "⚔ "+country.army,
                p.x,
                p.y+5
            );

        }

    }

}


/* ------------------------------------------------------------
   رسم اتصال همسایه‌ها
   ------------------------------------------------------------ */

function drawConnections(){

    if(
        game.zoom<.55
    ){

        return;

    }


    ctx.save();

    ctx.strokeStyle=
    "rgba(180,220,240,.13)";

    ctx.lineWidth=1;

    ctx.setLineDash([
        6,
        6
    ]);


    for(
        const country of countries
    ){

        for(
            const id of country.neighbors
        ){

            if(
                id<country.id
            ){

                continue;

            }


            const other=
            countries[id];


            const a=
            worldToScreen(
                country.cx,
                country.cy
            );

            const b=
            worldToScreen(
                other.cx,
                other.cy
            );


            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                b.x,
                b.y
            );

            ctx.stroke();

        }

    }


    ctx.setLineDash([]);

    ctx.restore();

}


/* ------------------------------------------------------------
   Minimap
   ------------------------------------------------------------ */

function drawMini(){

    const w=
    mini.clientWidth;

    const h=
    mini.clientHeight;


    if(
        w<=0 ||
        h<=0
    ){

        return;

    }


    mctx.fillStyle=
    "#07131e";

    mctx.fillRect(
        0,
        0,
        w,
        h
    );


    const sx=
    w/WORLD_WIDTH;

    const sy=
    h/WORLD_HEIGHT;


    for(
        const country of countries
    ){

        mctx.beginPath();


        for(
            let i=0;
            i<country.points.length;
            i++
        ){

            const p=
            country.points[i];


            const x=
            p.x*sx;

            const y=
            p.y*sy;


            if(i===0){

                mctx.moveTo(
                    x,
                    y
                );

            }
            else{

                mctx.lineTo(
                    x,
                    y
                );

            }

        }


        mctx.closePath();


        mctx.fillStyle=
        country.owner==="player"
        ?
        "#27699e"
        :
        country.owner==="enemy"
        ?
        "#6d506f"
        :
        "#52616e";


        mctx.fill();

    }


    const visibleW=
    width/game.zoom;

    const visibleH=
    height/game.zoom;


    const left=
    (game.cameraX-visibleW/2)*
    sx;

    const top=
    (game.cameraY-visibleH/2)*
    sy;


    mctx.strokeStyle=
    "#ffffff";

    mctx.lineWidth=1;


    mctx.strokeRect(
        left,
        top,
        visibleW*sx,
        visibleH*sy
    );

}


/* ------------------------------------------------------------
   Render
   ------------------------------------------------------------ */

function render(){

    try{

        limitCamera();

        drawBackground();

        drawConnections();

        drawCountries();

        drawMini();

    }
    catch(error){

        console.error(error);

        ctx.shadowBlur=0;

        ctx.fillStyle=
        "#081724";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        ctx.fillStyle=
        "white";

        ctx.font=
        "14px Tahoma";

        ctx.textAlign=
        "center";

        ctx.fillText(
            "نقشه دوباره‌سازی شد",
            width/2,
            height/2
        );

    }

}


/* ------------------------------------------------------------
   انتخاب منطقه
   ------------------------------------------------------------ */

function pointInside(
    x,
    y,
    points
){

    let inside=false;


    for(
        let i=0,
        j=points.length-1;
        i<points.length;
        j=i++
    ){

        const xi=
        points[i].x;

        const yi=
        points[i].y;

        const xj=
        points[j].x;

        const yj=
        points[j].y;


        const intersect=
        (
            yi>y
        ) !==
        (
            yj>y
        )
        &&
        x<
        (
            xj-xi
        )*
        (
            y-yi
        )/
        (
            yj-yi
        )+
        xi;


        if(intersect){

            inside=!inside;

        }

    }


    return inside;

}


function findCountry(x,y){

    for(
        let i=
        countries.length-1;
        i>=0;
        i--
    ){

        if(
            pointInside(
                x,
                y,
                countries[i].points
            )
        ){

            return countries[i];

        }

    }


    return null;

}


/* ------------------------------------------------------------
   رابط کاربری
   ------------------------------------------------------------ */

function updateUI(){

    moneyEl.textContent=
    Math.floor(
        game.money
    ).toLocaleString(
        "fa-IR"
    );


    armyEl.textContent=
    Math.floor(
        game.army
    ).toLocaleString(
        "fa-IR"
    );


    incomeEl.textContent=
    Math.floor(
        game.income
    ).toLocaleString(
        "fa-IR"
    );


    dayEl.textContent=
    game.day;


    const country=
    game.selected;


    if(!country){

        infoEl.innerHTML=
        "روی یکی از مناطق نقشه بزن.";

        recruitBtn.disabled=false;

        upgradeBtn.disabled=true;

        attackBtn.disabled=true;

        return;

    }


    const owner=
    country.owner==="player"
    ?
    "شما"
    :
    country.owner==="enemy"
    ?
    "رقیب"
    :
    "بی‌طرف";


    infoEl.innerHTML=

    "<b>"+
    country.name+
    "</b><br>"+

    "مالک: "+
    owner+
    "<br>"+

    "ارتش: "+
    country.army+
    "<br>"+

    "سطح: "+
    country.level+
    "<br>"+

    "درآمد: "+
    country.income;


    recruitBtn.disabled=
    game.money<100;


    upgradeBtn.disabled=
    country.owner!=="player" ||
    game.money<
    150*country.level;


    attackBtn.disabled=
    country.owner==="player" ||
    game.army<35;

}


/* ------------------------------------------------------------
   سربازگیری
   ------------------------------------------------------------ */

recruitBtn.addEventListener(
    "click",
    ()=>{

        if(
            game.money<100
        ){

            message(
                "پول کافی نیست"
            );

            return;

        }


        game.money-=100;

        game.army+=25;

        updateUI();

        message(
            "+25 سرباز"
        );

    }
);


/* ------------------------------------------------------------
   ارتقا
   ------------------------------------------------------------ */

upgradeBtn.addEventListener(
    "click",
    ()=>{

        const country=
        game.selected;


        if(
            !country ||
            country.owner!=="player"
        ){

            return;

        }


        const cost=
        150*
        country.level;


        if(
            game.money<cost
        ){

            message(
                "پول کافی نیست"
            );

            return;

        }


        game.money-=cost;

        country.level++;

        country.income+=10;

        game.income+=10;


        updateUI();

        message(
            country.name+
            " ارتقا یافت"
        );

    }
);


/* ------------------------------------------------------------
   حمله
   ------------------------------------------------------------ */

attackBtn.addEventListener(
    "click",
    ()=>{

        const target=
        game.selected;


        if(
            !target ||
            target.owner==="player"
        ){

            return;

        }


        if(
            game.army<35
        ){

            message(
                "ارتش کافی نیست"
            );

            return;

        }


        const source=
        countries.find(
            c=>
            c.owner==="player" &&
            c.neighbors.includes(
                target.id
            )
        );


        if(!source){

            message(
                "این منطقه همسایه شما نیست"
            );

            return;

        }


        const attackPower=
        game.army+
        source.army*.4+
        Math.random()*100;


        const defense=
        target.army*
        (
            .8+
            Math.random()*.6
        );


        game.army-=35;


        if(
            attackPower>defense
        ){

            target.owner="player";

            target.color="#27699e";

            target.army=
            Math.max(
                20,
                Math.floor(
                    attackPower-defense
                )
            );


            game.income+=
            target.income;


            message(
                "فتح "+
                target.name+
                " موفق بود!"
            );

        }
        else{

            target.army=
            Math.max(
                10,
                target.army-
                Math.floor(
                    20+
                    Math.random()*30
                )
            );


            message(
                "حمله شکست خورد"
            );

        }


        updateUI();

    }
);


/* ------------------------------------------------------------
   پایان نوبت
   ------------------------------------------------------------ */

turnBtn.addEventListener(
    "click",
    endTurn
);


function endTurn(){

    game.day++;

    game.money+=
    game.income;

    game.army+=
    Math.max(
        8,
        Math.floor(
            game.income*.15
        )
    );


    for(
        const country of countries
    ){

        if(
            country.owner==="enemy"
        ){

            country.army+=
            5+
            Math.floor(
                Math.random()*12
            );

        }

    }


    updateUI();

    message(
        "روز "+
        game.day+
        " شروع شد"
    );

}


/* ------------------------------------------------------------
   شروع دوباره
   ------------------------------------------------------------ */

resetBtn.addEventListener(
    "click",
    ()=>{

        location.reload();

    }
);


/* ------------------------------------------------------------
   کنترل لمس و ماوس
   ------------------------------------------------------------ */

canvas.addEventListener(
    "pointerdown",
    event=>{

        game.dragging=true;

        game.moved=false;

        game.pointerId=
        event.pointerId;

        game.pointerX=
        event.clientX;

        game.pointerY=
        event.clientY;

        game.lastX=
        event.clientX;

        game.lastY=
        event.clientY;


        try{

            canvas.setPointerCapture(
                event.pointerId
            );

        }
        catch(e){}

    }
);


canvas.addEventListener(
    "pointermove",
    event=>{

        if(
            !game.dragging ||
            event.pointerId!==
            game.pointerId
        ){

            return;

        }


        const dx=
        event.clientX-
        game.lastX;


        const dy=
        event.clientY-
        game.lastY;


        if(
            Math.abs(
                event.clientX-
                game.pointerX
            )+
            Math.abs(
                event.clientY-
                game.pointerY
            )>6
        ){

            game.moved=true;

        }


        game.cameraX-=
        dx/game.zoom;


        game.cameraY-=
        dy/game.zoom;


        game.lastX=
        event.clientX;

        game.lastY=
        event.clientY;


        limitCamera();

    }
);


canvas.addEventListener(
    "pointerup",
    event=>{

        if(
            event.pointerId!==
            game.pointerId
        ){

            return;

        }


        game.dragging=false;


        if(
            !game.moved
        ){

            const p=
            screenToWorld(
                event.clientX,
                event.clientY
            );


            const country=
            findCountry(
                p.x,
                p.y
            );


            game.selected=
            country;


            updateUI();

        }

    }
);


canvas.addEventListener(
    "pointercancel",
    ()=>{
        game.dragging=false;
    }
);


/* ------------------------------------------------------------
   زوم با چرخ ماوس
   ------------------------------------------------------------ */

canvas.addEventListener(
    "wheel",
    event=>{

        event.preventDefault();


        const before=
        screenToWorld(
            event.clientX,
            event.clientY
        );


        const factor=
        Math.exp(
            -event.deltaY*.001
        );


        game.zoom=
        clamp(
            game.zoom*factor,
            .35,
            1.6
        );


        const after=
        screenToWorld(
            event.clientX,
            event.clientY
        );


        game.cameraX+=
        before.x-
        after.x;


        game.cameraY+=
        before.y-
        after.y;


        limitCamera();

    },
    {
        passive:false
    }
);


/* ------------------------------------------------------------
   زوم دو ضربه‌ای
   ------------------------------------------------------------ */

let lastTap=0;


canvas.addEventListener(
    "pointerup",
    event=>{

        if(
            game.moved
        ){

            return;

        }


        const now=
        performance.now();


        if(
            now-lastTap<300
        ){

            const before=
            screenToWorld(
                event.clientX,
                event.clientY
            );


            game.zoom=
            clamp(
                game.zoom*1.2,
                .35,
                1.6
            );


            const after=
            screenToWorld(
                event.clientX,
                event.clientY
            );


            game.cameraX+=
            before.x-
            after.x;


            game.cameraY+=
            before.y-
            after.y;


            limitCamera();

        }


        lastTap=now;

    }
);


/* ------------------------------------------------------------
   کیبورد
   ------------------------------------------------------------ */

window.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="+"
        ){

            game.zoom=
            clamp(
                game.zoom*1.1,
                .35,
                1.6
            );

        }


        if(
            event.key==="-"
        ){

            game.zoom=
            clamp(
                game.zoom/1.1,
                .35,
                1.6
            );

        }


        if(
            event.key==="ArrowLeft"
        ){

            game.cameraX-=100/game.zoom;

        }


        if(
            event.key==="ArrowRight"
        ){

            game.cameraX+=100/game.zoom;

        }


        if(
            event.key==="ArrowUp"
        ){

            game.cameraY-=100/game.zoom;

        }


        if(
            event.key==="ArrowDown"
        ){

            game.cameraY+=100/game.zoom;

        }


        limitCamera();

    }
);


/* ------------------------------------------------------------
   حلقه بازی
   ------------------------------------------------------------ */

function gameLoop(now){

    const delta=
    Math.min(
        .1,
        (now-game.lastTime)/1000
    );


    game.lastTime=now;

    game.accumulator+=delta;


    if(
        game.accumulator>=60
    ){

        const ticks=
        Math.floor(
            game.accumulator/60
        );


        game.money+=
        game.income*ticks;


        game.accumulator-=
        ticks*60;


        updateUI();

    }


    render();


    requestAnimationFrame(
        gameLoop
    );

}


/* ------------------------------------------------------------
   شروع
   ------------------------------------------------------------ */

updateUI();

requestAnimationFrame(
    gameLoop
);


/* ------------------------------------------------------------
   جلوگیری از رفتارهای ناخواسته موبایل
   ------------------------------------------------------------ */

document.addEventListener(
    "contextmenu",
    event=>{
        event.preventDefault();
    }
);


document.addEventListener(
    "gesturestart",
    event=>{
        event.preventDefault();
    }
);


document.addEventListener(
    "touchmove",
    event=>{
        if(
            event.target===
            canvas
        ){

            event.preventDefault();

        }
    },
    {
        passive:false
    }
);


/* ------------------------------------------------------------
   پایان
   ------------------------------------------------------------ */

</script>
