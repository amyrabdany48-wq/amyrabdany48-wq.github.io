<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>World Front 50</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#142536;
    font-family:Tahoma,Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#map{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
    background:#17364b;
    touch-action:none;
}

#ui{
    position:absolute;
    top:8px;
    right:8px;
    left:8px;
    height:48px;
    display:flex;
    align-items:center;
    gap:6px;
    z-index:10;
    pointer-events:none;
}

.box{
    background:rgba(10,20,30,.92);
    color:white;
    border:1px solid #49657d;
    border-radius:8px;
    padding:7px 9px;
    font-size:11px;
    white-space:nowrap;
}

#panel{
    position:absolute;
    right:8px;
    bottom:8px;
    width:205px;
    background:rgba(10,20,30,.95);
    border:1px solid #49657d;
    border-radius:10px;
    padding:10px;
    color:white;
    z-index:20;
}

#title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:7px;
}

#info{
    font-size:11px;
    color:#c6d3df;
    line-height:1.8;
}

button{
    width:100%;
    border:1px solid #42627d;
    background:#1b405f;
    color:white;
    padding:8px;
    margin-top:6px;
    border-radius:7px;
    font-family:Tahoma,Arial,sans-serif;
    font-weight:bold;
}

#attack{
    background:#652d35;
}

#restart{
    background:#263746;
}

#msg{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#172b3d;
    border:1px solid #56748d;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    font-size:11px;
    opacity:0;
    transition:opacity .2s;
    z-index:30;
    pointer-events:none;
}

#msg.show{
    opacity:1;
}

@media(max-width:600px){

    #ui{
        left:5px;
        right:5px;
        top:5px;
        overflow:hidden;
    }

    .box{
        font-size:9px;
        padding:6px;
    }

    #panel{
        width:190px;
    }

}

</style>
</head>

<body>

<div id="game">

<canvas id="map"></canvas>

<div id="ui">

<div class="box">
🌍 WORLD FRONT
</div>

<div class="box">
💰 <span id="money">1000</span>
</div>

<div class="box">
⚔️ <span id="army">300</span>
</div>

<div class="box">
📅 <span id="day">1</span>
</div>

</div>


<div id="panel">

<div id="title">
منطقه‌ای انتخاب نشده
</div>

<div id="info">
روی یک منطقه ضربه بزن.
</div>

<button id="recruit">
سربازگیری +20
</button>

<button id="upgrade">
ارتقا
</button>

<button id="attack">
حمله
</button>

<button id="next">
پایان نوبت
</button>

<button id="restart">
شروع دوباره
</button>

</div>

<div id="msg"></div>

</div>


<script>

"use strict";


/* =========================================================
   تنظیمات اصلی
   ========================================================= */

const canvas =
document.getElementById("map");

const ctx =
canvas.getContext("2d");


const moneyText =
document.getElementById("money");

const armyText =
document.getElementById("army");

const dayText =
document.getElementById("day");

const titleText =
document.getElementById("title");

const infoText =
document.getElementById("info");

const recruitButton =
document.getElementById("recruit");

const upgradeButton =
document.getElementById("upgrade");

const attackButton =
document.getElementById("attack");

const nextButton =
document.getElementById("next");

const restartButton =
document.getElementById("restart");

const messageBox =
document.getElementById("msg");


/* =========================================================
   جهان
   ========================================================= */

const WORLD_WIDTH = 2000;

const WORLD_HEIGHT = 1200;


/* =========================================================
   وضعیت
   ========================================================= */

let width = 1;

let height = 1;

let ratio = 1;


const state = {

    money:1000,

    army:300,

    day:1,

    selected:null,

    cameraX:1000,

    cameraY:600,

    zoom:.65,

    dragging:false,

    moved:false,

    pointerX:0,

    pointerY:0,

    lastX:0,

    lastY:0,

    pointerId:null

};


/* =========================================================
   تابع محدودکننده
   ========================================================= */

function clamp(
    value,
    min,
    max
){

    if(value<min){
        return min;
    }

    if(value>max){
        return max;
    }

    return value;

}


/* =========================================================
   پیام
   ========================================================= */

function showMessage(text){

    messageBox.textContent=text;

    messageBox.classList.add("show");

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer=
    setTimeout(
        function(){

            messageBox.classList.remove(
                "show"
            );

        },
        1200
    );

}


/* =========================================================
   تغییر اندازه
   ========================================================= */

function resizeCanvas(){

    width=
    canvas.clientWidth;

    height=
    canvas.clientHeight;


    if(width<1){
        width=1;
    }

    if(height<1){
        height=1;
    }


    /*
       عمداً نسبت پیکسل صفحه محدود شده
       تا گوشی ضعیف تحت فشار قرار نگیرد.
    */

    ratio=
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    );


    canvas.width=
    Math.floor(
        width*ratio
    );

    canvas.height=
    Math.floor(
        height*ratio
    );


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/* =========================================================
   ساخت 50 منطقه
   ========================================================= */

const countries=[];


const countryNames=[

"آرکادیا",
"نورا",
"وسترا",
"الیسیا",
"کارما",
"دوریا",
"سلن",
"آرگون",
"ماروا",
"کاسپیا",

"اوریا",
"تارا",
"لورن",
"زریا",
"نورد",
"ایسترا",
"رودان",
"سامورا",
"بلوریا",
"فریا",

"هلیوس",
"مریدا",
"اوریس",
"پارسا",
"آلما",
"دارین",
"سورن",
"والیا",
"رامین",
"توران",

"نیکا",
"سایا",
"آرمان",
"مهران",
"آریا",
"سپهر",
"دانا",
"رها",
"نیروان",
"باران",

"ویستا",
"مانا",
"آذرا",
"کیان",
"آرسا",
"لیدا",
"سینا",
"یونا",
"دریا",
"ماهان"

];


/* =========================================================
   تولید شکل ساده
   ========================================================= */

function makeCountry(
    id,
    x,
    y
){

    const points=[];

    const radiusX=
    125+
    Math.random()*20;

    const radiusY=
    85+
    Math.random()*18;


    const count=8;


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle=
        Math.PI*2*
        i/
        count;


        const variation=
        .88+
        Math.random()*.18;


        points.push({

            x:
            x+
            Math.cos(angle)*
            radiusX*
            variation,

            y:
            y+
            Math.sin(angle)*
            radiusY*
            variation

        });

    }


    let owner="enemy";


    if(id===7){

        owner="player";

    }
    else if(
        id%7===0
    ){

        owner="neutral";

    }


    return {

        id:id,

        name:
        countryNames[id],

        x:x,

        y:y,

        points:points,

        owner:owner,

        army:
        owner==="player"
        ?
        180
        :
        50+
        Math.floor(
            Math.random()*120
        ),

        level:1,

        income:
        10+
        Math.floor(
            Math.random()*8
        )

    };

}


/* =========================================================
   ساخت شبکه 5×10
   ========================================================= */

function buildCountries(){

    countries.length=0;


    let id=0;


    for(
        let row=0;
        row<5;
        row++
    ){

        for(
            let col=0;
            col<10;
            col++
        ){

            const x=
            150+
            col*190+
            (row%2)*20;

            const y=
            130+
            row*230;


            countries.push(
                makeCountry(
                    id,
                    x,
                    y
                )
            );


            id++;

        }

    }

}


buildCountries();


/* =========================================================
   مختصات صفحه ← جهان
   ========================================================= */

function screenToWorld(
    screenX,
    screenY
){

    return {

        x:
        state.cameraX+
        (
            screenX-
            width/2
        )/
        state.zoom,

        y:
        state.cameraY+
        (
            screenY-
            height/2
        )/
        state.zoom

    };

}


/* =========================================================
   مختصات جهان ← صفحه
   ========================================================= */

function worldToScreen(
    worldX,
    worldY
){

    return {

        x:
        (
            worldX-
            state.cameraX
        )*
        state.zoom+
        width/2,

        y:
        (
            worldY-
            state.cameraY
        )*
        state.zoom+
        height/2

    };

}


/* =========================================================
   دوربین
   ========================================================= */

function limitCamera(){

    const halfW=
    width/
    state.zoom/
    2;

    const halfH=
    height/
    state.zoom/
    2;


    state.cameraX=
    clamp(
        state.cameraX,
        halfW,
        WORLD_WIDTH-halfW
    );


    state.cameraY=
    clamp(
        state.cameraY,
        halfH,
        WORLD_HEIGHT-halfH
    );

}


/* =========================================================
   رسم پس‌زمینه
   ========================================================= */

function drawBackground(){

    ctx.fillStyle=
    "#17364b";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       فقط خطوط بسیار کم‌هزینه
    */

    const grid=200;


    ctx.strokeStyle=
    "rgba(150,210,235,.08)";

    ctx.lineWidth=1;


    const left=
    state.cameraX-
    width/
    state.zoom/
    2;

    const right=
    state.cameraX+
    width/
    state.zoom/
    2;

    const top=
    state.cameraY-
    height/
    state.zoom/
    2;

    const bottom=
    state.cameraY+
    height/
    state.zoom/
    2;


    ctx.beginPath();


    for(
        let x=
        Math.floor(left/grid)*grid;
        x<=right;
        x+=grid
    ){

        const a=
        worldToScreen(
            x,
            top
        );

        const b=
        worldToScreen(
            x,
            bottom
        );


        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

    }


    for(
        let y=
        Math.floor(top/grid)*grid;
        y<=bottom;
        y+=grid
    ){

        const a=
        worldToScreen(
            left,
            y
        );

        const b=
        worldToScreen(
            right,
            y
        );


        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

    }


    ctx.stroke();

}


/* =========================================================
   رسم یک کشور
   ========================================================= */

function drawCountry(
    country
){

    const points=
    country.points;


    if(points.length===0){

        return;

    }


    const first=
    worldToScreen(
        points[0].x,
        points[0].y
    );


    ctx.beginPath();


    ctx.moveTo(
        first.x,
        first.y
    );


    for(
        let i=1;
        i<points.length;
        i++
    ){

        const p=
        worldToScreen(
            points[i].x,
            points[i].y
        );


        ctx.lineTo(
            p.x,
            p.y
        );

    }


    ctx.closePath();


    if(
        country.owner==="player"
    ){

        ctx.fillStyle=
        "#2875aa";

    }
    else if(
        country.owner==="neutral"
    ){

        ctx.fillStyle=
        "#566674";

    }
    else{

        ctx.fillStyle=
        "#704d70";

    }


    ctx.fill();


    if(
        state.selected===
        country
    ){

        ctx.strokeStyle=
        "#ffffff";

        ctx.lineWidth=4;

    }
    else{

        ctx.strokeStyle=
        "rgba(220,235,245,.45)";

        ctx.lineWidth=2;

    }


    ctx.stroke();


    /*
       نام کشور
    */

    const center=
    worldToScreen(
        country.x,
        country.y
    );


    if(
        center.x>-100 &&
        center.x<width+100 &&
        center.y>-50 &&
        center.y<height+50
    ){

        ctx.textAlign=
        "center";

        ctx.textBaseline=
        "middle";

        ctx.font=
        "11px Tahoma";


        ctx.fillStyle=
        "#ffffff";


        ctx.fillText(
            country.name,
            center.x,
            center.y-12
        );


        ctx.font=
        "10px Arial";


        ctx.fillStyle=
        "#e0edf5";


        ctx.fillText(
            "⚔ "+
            country.army,
            center.x,
            center.y+7
        );

    }

}


/* =========================================================
   رسم تمام کشورها
   ========================================================= */

function drawCountries(){

    for(
        let i=0;
        i<countries.length;
        i++
    ){

        drawCountry(
            countries[i]
        );

    }

}


/* =========================================================
   Render
   ========================================================= */

function render(){

    /*
       مهم:
       هر فریم فقط چند عملیات ساده انجام می‌شود.
    */

    try{

        limitCamera();

        drawBackground();

        drawCountries();

    }
    catch(error){

        console.error(error);

        /*
           اگر هر خطای Canvas اتفاق افتاد،
           زمینه را دوباره رنگ می‌کنیم.
        */

        ctx.setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );

        ctx.fillStyle=
        "#17364b";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    }

}


/* =========================================================
   پیدا کردن کشور
   ========================================================= */

function isInside(
    x,
    y,
    points
){

    let inside=false;


    for(
        let i=0,
        j=points.length-1;
        i<points.length;
        j=i++
    ){

        const xi=
        points[i].x;

        const yi=
        points[i].y;

        const xj=
        points[j].x;

        const yj=
        points[j].y;


        const intersect=
        (
            yi>y
        ) !==
        (
            yj>y
        )
        &&
        x<
        (
            xj-xi
        )*
        (
            y-yi
        )/
        (
            yj-yi
        )+
        xi;


        if(intersect){

            inside=!inside;

        }

    }


    return inside;

}


function findCountry(
    x,
    y
){

    for(
        let i=
        countries.length-1;
        i>=0;
        i--
    ){

        if(
            isInside(
                x,
                y,
                countries[i].points
            )
        ){

            return countries[i];

        }

    }


    return null;

}


/* =========================================================
   رابط کاربری
   ========================================================= */

function updateUI(){

    moneyText.textContent=
    Math.floor(
        state.money
    );


    armyText.textContent=
    Math.floor(
        state.army
    );


    dayText.textContent=
    state.day;


    const c=
    state.selected;


    if(!c){

        titleText.textContent=
        "منطقه‌ای انتخاب نشده";

        infoText.textContent=
        "روی یک منطقه ضربه بزن.";

        upgradeButton.disabled=true;

        attackButton.disabled=true;

        return;

    }


    titleText.textContent=
    c.name;


    const owner=
    c.owner==="player"
    ?
    "شما"
    :
    c.owner==="enemy"
    ?
    "رقیب"
    :
    "بی‌طرف";


    infoText.innerHTML=
    "مالک: "+
    owner+
    "<br>"+
    "ارتش: "+
    c.army+
    "<br>"+
    "سطح: "+
    c.level;


    upgradeButton.disabled=
    !(
        c.owner==="player" &&
        state.money>=
        100*c.level
    );


    attackButton.disabled=
    !(
        c.owner!=="player" &&
        state.army>=30
    );

}


/* =========================================================
   سربازگیری
   ========================================================= */

recruitButton.onclick=
function(){

    if(
        state.money<100
    ){

        showMessage(
            "پول کافی نیست"
        );

        return;

    }


    state.money-=100;

    state.army+=20;


    updateUI();


    showMessage(
        "+20 سرباز"
    );

};


/* =========================================================
   ارتقا
   ========================================================= */

upgradeButton.onclick=
function(){

    const c=
    state.selected;


    if(
        !c ||
        c.owner!=="player"
    ){

        return;

    }


    const cost=
    100*c.level;


    if(
        state.money<cost
    ){

        showMessage(
            "پول کافی نیست"
        );

        return;

    }


    state.money-=cost;

    c.level++;

    c.army+=20;


    updateUI();


    showMessage(
        "منطقه ارتقا یافت"
    );

};


/* =========================================================
   حمله
   ========================================================= */

attackButton.onclick=
function(){

    const target=
    state.selected;


    if(
        !target ||
        target.owner==="player"
    ){

        return;

    }


    if(
        state.army<30
    ){

        showMessage(
            "ارتش کافی نیست"
        );

        return;

    }


    state.army-=30;


    const attackPower=
    state.army+
    30+
    Math.random()*100;


    const defense=
    target.army+
    Math.random()*100;


    if(
        attackPower>defense
    ){

        target.owner=
        "player";

        target.army=
        Math.max(
            20,
            Math.floor(
                attackPower-
                defense
            )
        );


        showMessage(
            "منطقه فتح شد!"
        );

    }
    else{

        target.army=
        Math.max(
            10,
            target.army-20
        );


        showMessage(
            "حمله شکست خورد"
        );

    }


    updateUI();

};


/* =========================================================
   پایان نوبت
   ========================================================= */

nextButton.onclick=
function(){

    state.day++;

    state.money+=100;

    state.army+=15;


    for(
        let i=0;
        i<countries.length;
        i++
    ){

        const c=
        countries[i];


        if(
            c.owner==="enemy"
        ){

            c.army+=
            5+
            Math.floor(
                Math.random()*10
            );

        }

    }


    updateUI();


    showMessage(
        "روز "+
        state.day
    );

};


/* =========================================================
   شروع دوباره
   ========================================================= */

restartButton.onclick=
function(){

    location.reload();

};


/* =========================================================
   لمس / ماوس
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(event){

        state.dragging=true;

        state.moved=false;

        state.pointerId=
        event.pointerId;

        state.pointerX=
        event.clientX;

        state.pointerY=
        event.clientY;

        state.lastX=
        event.clientX;

        state.lastY=
        event.clientY;


        try{

            canvas.setPointerCapture(
                event.pointerId
            );

        }
        catch(e){}

    }
);


canvas.addEventListener(
    "pointermove",
    function(event){

        if(
            !state.dragging
        ){

            return;

        }


        if(
            event.pointerId!==
            state.pointerId
        ){

            return;

        }


        const dx=
        event.clientX-
        state.lastX;


        const dy=
        event.clientY-
        state.lastY;


        if(
            Math.abs(
                event.clientX-
                state.pointerX
            )+
            Math.abs(
                event.clientY-
                state.pointerY
            )>7
        ){

            state.moved=true;

        }


        state.cameraX-=
        dx/
        state.zoom;


        state.cameraY-=
        dy/
        state.zoom;


        state.lastX=
        event.clientX;


        state.lastY=
        event.clientY;


        limitCamera();

    }
);


canvas.addEventListener(
    "pointerup",
    function(event){

        if(
            event.pointerId!==
            state.pointerId
        ){

            return;

        }


        state.dragging=false;


        if(
            state.moved
        ){

            return;

        }


        const point=
        screenToWorld(
            event.clientX,
            event.clientY
        );


        const country=
        findCountry(
            point.x,
            point.y
        );


        state.selected=
        country;


        updateUI();

    }
);


canvas.addEventListener(
    "pointercancel",
    function(){

        state.dragging=false;

    }
);


/* =========================================================
   زوم
   ========================================================= */

canvas.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();


        const before=
        screenToWorld(
            event.clientX,
            event.clientY
        );


        if(
            event.deltaY<0
        ){

            state.zoom*=1.1;

        }
        else{

            state.zoom/=1.1;

        }


        state.zoom=
        clamp(
            state.zoom,
            .4,
            1.5
        );


        const after=
        screenToWorld(
            event.clientX,
            event.clientY
        );


        state.cameraX+=
        before.x-
        after.x;


        state.cameraY+=
        before.y-
        after.y;


        limitCamera();

    },
    {
        passive:false
    }
);


/* =========================================================
   اجرای بازی
   ========================================================= */

function loop(){

    render();

    requestAnimationFrame(
        loop
    );

}


updateUI();

loop();


/* =========================================================
   پایان
   ========================================================= */

</script>
