========================================================= */

function processTreaties()
{

    for(
        const agreement of
        state.tradeAgreements
    )
    {

        agreement.days--;

        state.economy.money+=
            agreement.income;

        state.economy.exports+=
            agreement.income;

    }

    state.tradeAgreements=
        state.tradeAgreements
        .filter(
            agreement=>
            agreement.days>
            0
        );

    for(
        const treaty of
        state.nonAggression
    )
    {

        treaty.days--;

    }

    state.nonAggression=
        state.nonAggression
        .filter(
            treaty=>
            treaty.days>
            0
        );

}

/* =========================================================
   CONSTRUCTION DAILY
========================================================= */

function processConstruction()
{

    for(
        const project of
        state.construction
    )
    {

        let speed=
            1+
            state.nation.logistics/
            300+
            state.nation.technology/
            500;

        if(
            state.resources.energy<
            15
        )
        {

            speed*=
                .6;

        }

        if(
            state.society.stability<
            35
        )
        {

            speed*=
                .75;

        }

        project.daysLeft-=
            speed;

    }

    const completed=
        state.construction.filter(
            project=>
            project.daysLeft<=
            0
        );

    for(
        const project of
        completed
    )
    {

        const building=
            BUILDINGS.find(
                item=>
                item.id===
                project.buildingId
            );

        if(
            !building
        )
        {

            continue;

        }

        state.buildings[
            building.id
        ]=
            project.targetLevel;

        applyBuildingEffects(
            building
        );

        addNews(
            "🏗️ پروژه تکمیل شد",
            `${building.name} به سطح ${project.targetLevel} رسید.`
        );

    }

    state.construction=
        state.construction.filter(
            project=>
            project.daysLeft>
            0
        );

}

/* =========================================================
   PRODUCTION DAILY
========================================================= */

function processProduction()
{

    for(
        const project of
        state.production
    )
    {

        let speed=
            1+
            state.nation.industry/
            300+
            state.nation.technology/
            500;

        if(
            state.resources.energy<
            15
        )
        {

            speed*=
                .65;

        }

        project.daysLeft-=
            speed;

    }

    const completed=
        state.production.filter(
            project=>
            project.daysLeft<=
            0
        );

    for(
        const project of
        completed
    )
    {

        const equipment=
            EQUIPMENT.find(
                item=>
                item.id===
                project.equipmentId
            );

        if(
            !equipment
        )
        {

            continue;

        }

        state.inventory[
            equipment.id
        ]=
            (
                state.inventory[
                    equipment.id
                ]||
                0
            )+
            project.amount;

        state.military.basePower+=
            equipment.power*
            project.amount*
            .006;

        addNews(
            "🏭 تولید تکمیل شد",
            `${project.amount} واحد ${equipment.name} آماده شد.`
        );

    }

    state.production=
        state.production.filter(
            project=>
            project.daysLeft>
            0
        );

}

/* =========================================================
   RESOURCE ECONOMY DAILY
========================================================= */

function processResources()
{

    const foodProduction=
        (
            state.buildings.farm||
            0
        )*
        1.4+
        state.society.population*
        .004;

    const foodConsumption=
        state.society.population*
        .012;

    state.resources.food=
        Math.max(
            0,
            state.resources.food+
            foodProduction-
            foodConsumption
        );

    const energyProduction=
        (
            state.buildings.power||
            0
        )*
        1.7+
        (
            state.buildings.solar||
            0
        )*
        1.2;

    const energyConsumption=
        state.nation.industry*
        .015+
        state.society.population*
        .004+
        state.production.length*
        .22;

    state.resources.energy=
        Math.max(
            0,
            state.resources.energy+
            energyProduction-
            energyConsumption
        );

    const oilProduction=
        (
            state.buildings.oilField||
            0
        )*
        .95;

    const oilConsumption=
        equipmentPower()*
        .00022+
        state.wars.filter(
            war=>
            war.status===
            "active"&&
            (
                war.attacker===
                state.player||
                war.defender===
                state.player
            )
        ).length*
        .18;

    state.resources.oil=
        Math.max(
            0,
            state.resources.oil+
            oilProduction-
            oilConsumption
        );

    state.resources.steel+=
        (
            state.buildings.steelMill||
            0
        )*
        .55;

    state.resources.electronics+=
        (
            state.buildings.electronicsPlant||
            0
        )*
        .40;

}

/* =========================================================
   MACRO ECONOMY DAILY
========================================================= */

function processEconomy()
{

    const revenue=
        calculateDailyRevenue();

    const expenses=
        calculateDailyExpenses();

    state.economy.budgetBalance=
        revenue-
        expenses;

    state.economy.money+=
        state.economy.budgetBalance;

    if(
        state.economy.money<
        0
    )
    {

        state.economy.debt+=
            Math.abs(
                state.economy.money
            );

        state.economy.money=
            0;

    }

    state.economy.debt+=
        state.economy.debt*
        state.economy.interestRate/
        100/
        365;

    const growth=
        calculateGrowth();

    state.economy.growth=
        growth;

    state.economy.gdp=
        calculateGDP();

    state.nation.industry=
        Math.max(
            1,
            state.nation.industry+
            growth*
            .003
        );

    state.economy.unemployment=
        clamp(
            state.economy.unemployment-
            growth*
            .004+
            random(
                -.025,
                .025
            ),
            0,
            65
        );

    let inflationPressure=
        .002;

    if(
        state.resources.food<
        30
    )
    {

        inflationPressure+=
            .035;

    }

    if(
        state.resources.energy<
        30
    )
    {

        inflationPressure+=
            .032;

    }

    if(
        state.resources.oil<
        20
    )
    {

        inflationPressure+=
            .020;

    }

    if(
        state.economy.debt>
        state.economy.gdp*
        .7
    )
    {

        inflationPressure+=
            .022;

    }

    inflationPressure-=
        Math.max(
            0,
            state.economy.interestRate-
            5
        )*
        .007;

    state.economy.inflation=
        clamp(
            state.economy.inflation+
            inflationPressure+
            random(
                -.018,
                .020
            ),
            -3,
            100
        );

    state.economy.currency=
        clamp(
            state.economy.currency+
            growth*
            .014-
            state.economy.inflation*
            .008+
            state.economy.interestRate*
            .003+
            random(
                -.1,
                .1
            ),
            5,
            300
        );

    state.economy.stockMarket=
        clamp(
            state.economy.stockMarket+
            growth*
            .08-
            state.economy.inflation*
            .012+
            random(
                -.65,
                .65
            ),
            10,
            1000
        );

    state.economy.consumerConfidence=
        clamp(
            state.economy.consumerConfidence+
            growth*
            .015-
            state.economy.inflation*
            .008-
            state.economy.unemployment*
            .004,
            0,
            100
        );

    state.society.poverty=
        clamp(
            state.society.poverty-
            growth*
            .004+
            state.economy.unemployment*
            .002+
            state.economy.inflation*
            .0015,
            0,
            100
        );

    state.society.approval=
        clamp(
            state.society.approval+
            growth*
            .01-
            state.economy.inflation*
            .005-
            state.economy.unemployment*
            .004-
            state.government.protest*
            .001,
            0,
            100
        );

    state.government.protest=
        clamp(
            state.government.protest+
            Math.max(
                0,
                state.economy.inflation-
                15
            )*
            .004+
            Math.max(
                0,
                state.economy.unemployment-
                15
            )*
            .005+
            Math.max(
                0,
                40-
                state.society.approval
            )*
            .006-
            state.society.stability*
            .001,
            0,
            100
        );

    state.society.stability=
        clamp(
            state.society.stability+
            (
                state.society.approval-
                50
            )*
            .001-
            state.government.protest*
            .002,
            0,
            100
        );

    state.society.manpower=
        Math.min(
            state.society.population*
            .075,
            state.society.manpower+
            state.society.population*
            .00001
        );

}

   GOVERNMENT DAILY

function processGovernment()
{

    state.government.electionDays--;

    if(
        state.government.electionDays<=
        0
    )

        if(
            chance(
                state.society.approval
            )
        )

            addNews(
                "🗳️ انتخابات",
                "دولت توانست اکثریت لازم را حفظ کند."
            );

            state.society.approval+=
                2;

        }

        {

            addNews(
                "🗳️ انتخابات",
                "نتیجه انتخابات باعث تغییر سیاسی شد."
            );

            state.society.approval=
                55;

            state.government.corruption=
                Math.max(
                    0,
                    state.government.corruption-
                    2
                );

        }

        state.government.electionDays=

    }

    if(

            .008
        )
    )
    {

        addNews(
            "📢 اعتراضات",
            "اعتراضات داخلی افزایش یافت."
        );

        state.society.stability-=
            .5;

    }

}

/* =========================================================
   RANDOM EVENTS
========================================================= */

function processRandomEvents()
{

    if(
        !chance(
            1.4
        )
    )
    {

        return;

    }

    const events=
    [
        {
            title:
                "📈 رونق بازار",

            text:
                "اعتماد اقتصادی و بازار سهام رشد کرد.",

            apply:
                ()=>
                {

                    state.economy.stockMarket+=
                        5;

                    state.economy.consumerConfidence+=
                        2;

                }
        },
        {
            title:
                "⚡ اختلال انرژی",

            text:
                "تولید انرژی برای مدتی کاهش یافت.",

            apply:
                ()=>
                {

                    state.resources.energy=
                        Math.max(
                            0,
                            state.resources.energy-
                            10
                        );

                }
        },
        {
            title:
                "🌾 برداشت خوب",

            text:
                "تولید مواد غذایی افزایش یافت.",

            apply:
                ()=>
                {

                    state.resources.food+=
                        15;

                }
        },
        {
            title:
                "🏭 رونق صنعت",

            text:
                "ظرفیت صنعتی کشور رشد کرد.",

            apply:
                ()=>
                {

                    state.nation.industry+=
                        .6;

                }
        },
        {
            title:
                "💻 جهش فناوری",

            text:
                "سرمایه‌گذاری فناوری نتیجه داد.",

            apply:
                ()=>
                {

                    state.nation.technology+=
                        .4;

                }
        }
    ];

    const event=
        pick(
            events
        );

    event.apply();

    addNews(
        event.title,
        event.text
    );

}

/* =========================================================
   NEWS
========================================================= */

function addNews(
    title,
    text
)
{

    state.news.unshift(
        {
            id:
                Date.now()+
                Math.random(),

            title:
                title,

            text:
                text,

            date:
                `${state.date.year}/${state.date.month}/${state.date.day}`
        }
    );

    if(
        state.news.length>
        120
    )
    {

        state.news.length=
            120;

    }

}

/* =========================================================
   DATE
========================================================= */

function advanceDate()
{

    state.date.day++;

    if(
        state.date.day>
        30
    )
    {

        state.date.day=
            1;

        state.date.month++;

        if(
            state.date.month>
            12
        )
        {

            state.date.month=
                1;

            state.date.year++;

        }

    }

}

/* =========================================================
   DAILY MASTER
========================================================= */

function nextDay()
{

    if(
        !state.started
    )
    {

        return;

    }

    advanceDate();

    processConstruction();

    processProduction();

    processResources();

    processEconomy();

    processGovernment();

    processTreaties();

    processAIEconomies();

    processAIRelations();

    processWars();

    if(
        state.date.day%
        3===
        0
    )
    {

        processAIPlayerDiplomacy();

    }

    if(
        state.date.day%
        2===
        0
    )
    {

        processAIWars();

    }

    processRandomEvents();

    saveGame();

    renderAll();

}

/* =========================================================
   AI INBOX PRUNE
========================================================= */

function cleanInbox()
{

    state.inbox=
        state.inbox.filter(
            item=>
            item.status===
            "pending"||
            Math.random()>
            .01
        );

}

/* =========================================================
   TIME
========================================================= */

function openTime()
{

    openModal(
        "⏱️ کنترل زمان",
        `
        <div class="row">

            <button
                class="btn green"
                onclick="
                    setSpeed(
                        1
                    )
                "
            >
                ×1
            </button>

            <button
                class="btn blue"
                onclick="
                    setSpeed(
                        2
                    )
                "
            >
                ×2
            </button>

            <button
                class="btn purple"
                onclick="
                    setSpeed(
                        4
                    )
                "
            >
                ×4
            </button>

            <button
                class="btn red"
                onclick="
                    setSpeed(
                        8
                    )
                "
            >
                ×8
            </button>

            <button
                class="btn"
                onclick="
                    pauseTime()
                "
            >
                ⏸ توقف
            </button>

            <button
                class="btn green"
                onclick="
                    nextDay()
                "
            >
                یک روز
            </button>

        </div>
        `
    );

}

function setSpeed(
    speed
)
{

    state.time.speed=
        speed;

    if(
        timer
    )
    {

        clearInterval(
            timer
        );

    }

    timer=
        setInterval(
            nextDay,
            Math.max(
                230,
                1650/
                speed
            )
        );

    toast(
        "سرعت ×"+
        speed
    );

}

function pauseTime()
{

    state.time.speed=
        0;

    if(
        timer
    )
    {

        clearInterval(
            timer
        );

        timer=
            null;

    }

    toast(
        "زمان متوقف شد"
    );

}

/* =========================================================
   HUD
========================================================= */

function renderHUD()
{

    if(
        !state.started
    )
    {

        return;

    }

    $("hudMoney")
    .textContent=
        money(
            state.economy.money
        );

    $("hudGDP")
    .textContent=
        money(
            calculateGDP()
        );

    $("hudInflation")
    .textContent=
        state.economy.inflation
        .toFixed(
            1
        )+
        "%";

    $("hudPopulation")
    .textContent=
        state.society.population
        .toFixed(
            1
        )+
        "M";

    $("hudEnergy")
    .textContent=
        state.resources.energy
        .toFixed(
            0
        );

    $("hudOil")
    .textContent=
        state.resources.oil
        .toFixed(
            0
        );

    $("hudMilitary")
    .textContent=
        calculateMilitaryPower()
        .toFixed(
            0
        );

    $("hudDate")
    .textContent=
        state.date.year+
        "/"+
        state.date.month+
        "/"+
        state.date.day;

}

/* =========================================================
   RENDER ALL
========================================================= */

function renderAll()
{

}

/* =========================================================
   SAVE / LOAD
========================================================= */

function normalizeState()
{

    state.economy=
        state.economy||
        {};

    state.resources=
        state.resources||
        {};

    state.society=
        state.society||
        {};

    state.nation=
        state.nation||
        {};

    state.government=
        state.government||
        {};

    state.government.laws=
        state.government.laws||
        {
            welfare:"normal",
            trade:"open",
            militaryBudget:"normal",
            media:"free",
            immigration:"controlled"
        };

    state.military=
        state.military||
        {};

    state.inventory=
        state.inventory||
        {};

    state.buildings=
        state.buildings||
        {};

    state.construction=
        Array.isArray(
            state.construction
        )
        ?
        state.construction
        :
        [];

    state.production=
        Array.isArray(
            state.production
        )
        ?
        state.production
        :
        [];

    state.relations=
        state.relations||
        {};

    state.ai=
        state.ai||
        {};

    state.inbox=
        Array.isArray(
            state.inbox
        )
        ?
        state.inbox
        :
        [];

    state.alliances=
        Array.isArray(
            state.alliances
        )
        ?
        state.alliances
        :
        [];

    state.tradeAgreements=
        Array.isArray(
            state.tradeAgreements
        )
        ?
        state.tradeAgreements
        :
        [];

    state.nonAggression=
        Array.isArray(
            state.nonAggression
        )
        ?
        state.nonAggression
        :
        [];

    state.sanctions=
        Array.isArray(
            state.sanctions
        )
        ?
        state.sanctions
        :
        [];

    state.wars=
        Array.isArray(
            state.wars
        )
        ?
        state.wars
        :
        [];

    state.news=
        Array.isArray(
            state.news
        )
        ?
        state.news
        :
        [];

    state.map=
        state.map||
        {
            mode:"political",
            zoom:1,
            x:0,
            y:0
        };

    state.time=
        state.time||
        {
            speed:0
        };

}

function saveGame()
{

    try
    {

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(
                state
            )
        );

    }
    catch(
        error
    )
    {
    }

}

function loadGame()
{

    try
    {

        const raw=
            localStorage.getItem(
                SAVE_KEY
            );

        if(
            !raw
        )
        {

            return false;

        }

        const loaded=
            JSON.parse(
                raw
            );

        state=
            Object.assign(
                state,
                loaded
            );

        normalizeState();

        initializeAI();

        return(
            state.started&&
            !!state.player
        );

    }
    catch(
        error
    )
    {

        return false;

    }

}

/* =========================================================
   KEYBOARD
========================================================= */

document
.addEventListener(
    "keydown",
    event=>
    {

        if(
            event.key===
            "Escape"
        )
        {

            closeModal();

            return;

        }

        if(
            !state.started
        )
        {

            return;

        }

        if(
            event.key===
            " "
        )
        {

            event.preventDefault();

            if(
                state.time.speed>
                0
            )
            {

                pauseTime();

            }
            else
            {

                setSpeed(
                    1
                );

            }

        }

        if(
            event.key===
            "1"
        )
        {

            setSpeed(
                1
            );

        }

        if(
            event.key===
            "2"
        )
        {

            setSpeed(
                2
            );

        }

        if(
            event.key===
            "4"
        )
        {

            setSpeed(
                4
            );

        }

        if(
            event.key===
            "8"
        )
        {

            setSpeed(
                8
            );

        }

    }
);
