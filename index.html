<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Empire Horizon</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:#07131d;
    color:#fff;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ======================================================
   COMMON
====================================================== */

.screen{
    width:100%;
    height:100%;
    overflow:auto;
    padding:18px;
    background:
        radial-gradient(
            circle at 50% 0%,
            #173b50 0%,
            #091b27 45%,
            #061019 100%
        );
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin:18px 0 6px;
}

.subtitle{
    text-align:center;
    color:#9fb6c4;
    font-size:12px;
    margin-bottom:18px;
}

/* ======================================================
   COUNTRY SELECT
====================================================== */

.searchBox{
    width:min(700px,100%);
    margin:auto;
    display:block;
    padding:13px;
    border-radius:9px;
    border:1px solid #35586b;
    background:#0c2332;
    color:white;
    outline:none;
}

.countryGrid{
    width:min(1050px,100%);
    margin:15px auto;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:7px;
}

.countryButton{
    min-height:43px;
    border-radius:7px;
    border:1px solid #29495b;
    background:#102b3c;
    color:#fff;
    font-size:10px;
    padding:6px;
}

.countryButton:hover{
    background:#174057;
}

.countryButton.active{
    background:#126047;
    border-color:#62d8a4;
}

.mainButton{
    width:min(430px,100%);
    display:block;
    margin:16px auto;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#176b50;
    color:white;
    font-weight:bold;
}

.mainButton:disabled{
    opacity:.3;
}

/* ======================================================
   REGION SELECT
====================================================== */

.regionGrid{
    width:min(850px,100%);
    margin:25px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.regionButton{
    min-height:110px;
    border:1px solid #315467;
    border-radius:10px;
    background:#102a3a;
    color:#fff;
    padding:14px;
}

.regionButton strong{
    display:block;
    font-size:14px;
    margin-bottom:7px;
}

.regionButton span{
    display:block;
    color:#9eb4c1;
    font-size:9px;
    line-height:1.8;
}

.regionButton.active{
    background:#14543f;
    border-color:#6bdcaf;
}

.backButton{
    width:min(350px,100%);
    display:block;
    margin:10px auto;
    padding:11px;
    border:0;
    border-radius:8px;
    background:#243b49;
    color:white;
}

/* ======================================================
   GAME
====================================================== */

#game{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#07131d;
}

/* ======================================================
   TOP
====================================================== */

.topBar{
    flex-shrink:0;
    height:62px;
    padding:5px;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    background:#081a26;
    border-bottom:1px solid #284656;
}

.stat{
    min-width:0;
    background:#102a3b;
    border:1px solid #294a5d;
    border-radius:7px;
    text-align:center;
    padding:4px 2px;
    font-size:7px;
}

.stat b{
    display:block;
    margin-top:4px;
    font-size:9px;
    white-space:nowrap;
    overflow:hidden;
}

/* ======================================================
   MAP
====================================================== */

.mapWrapper{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:#a9cfdf;
}

#map{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    user-select:none;
}

.countryShape{
    stroke:#263b45;
    stroke-width:.65;
    vector-effect:non-scaling-stroke;
    cursor:pointer;
}

.countryShape:hover{
    filter:brightness(1.12);
}

.countryShape.playerCountry{
    stroke:#fff;
    stroke-width:2;
}

.countryShape.targetCountry{
    stroke:#ffd75a;
    stroke-width:2;
}

/* ======================================================
   MAP BUTTONS
====================================================== */

.mapButtons{
    position:absolute;
    top:7px;
    left:7px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.mapButtons button{
    width:34px;
    height:34px;
    border-radius:7px;
    border:1px solid #34576b;
    background:#071d2bea;
    color:#fff;
    font-size:16px;
}

/* ======================================================
   COUNTRY INFO
====================================================== */

.countryInfo{
    position:absolute;
    left:7px;
    bottom:7px;
    width:225px;
    max-width:calc(100% - 14px);
    background:#081b29f5;
    border:1px solid #3a596a;
    border-radius:9px;
    padding:9px;
    display:none;
}

.countryInfo h3{
    margin:0 0 7px;
    font-size:12px;
}

.infoLine{
    display:flex;
    justify-content:space-between;
    margin-top:4px;
    padding:5px;
    background:#102b3c;
    border-radius:5px;
    font-size:8px;
}

/* ======================================================
   BOTTOM
====================================================== */

.bottomBar{
    flex-shrink:0;
    height:61px;
    padding:5px;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    background:#071620;
    border-top:1px solid #284656;
}

.bottomBar button{
    border:1px solid #2b4c5d;
    border-radius:7px;
    background:#102a3a;
    color:#fff;
    font-size:7px;
}

/* ======================================================
   MODAL
====================================================== */

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    z-index:1000;
    padding:10px;
}

.modalBox{
    width:min(720px,100%);
    max-height:90vh;
    overflow:auto;
    background:#091c29;
    border:1px solid #36586a;
    border-radius:10px;
    padding:11px;
}

.modalTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #284656;
    padding-bottom:8px;
    margin-bottom:8px;
}

.modalTitle h2{
    margin:0;
    font-size:14px;
}

.closeButton{
    border:0;
    border-radius:6px;
    padding:6px 9px;
    background:#542832;
    color:#fff;
}

.modalCard{
    background:#102b3c;
    border:1px solid #294a5d;
    border-radius:7px;
    padding:9px;
    margin-bottom:6px;
}

.modalCard strong{
    display:block;
    font-size:10px;
    margin-bottom:5px;
}

.modalCard p{
    margin:3px 0;
    color:#b6c9d3;
    font-size:9px;
    line-height:1.8;
}

.modalAction{
    width:100%;
    margin-top:6px;
    padding:9px;
    border:1px solid #34576a;
    border-radius:6px;
    background:#14364a;
    color:#fff;
}

/* ======================================================
   CHANGE COUNTRY LIST
====================================================== */

.changeCountryGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    max-height:55vh;
    overflow:auto;
}

.changeCountryGrid button{
    min-height:39px;
    border:1px solid #29495b;
    border-radius:6px;
    background:#102b3c;
    color:white;
    font-size:8px;
}

.changeCountryGrid button:hover{
    background:#17634c;
}

/* ======================================================
   RESPONSIVE
====================================================== */

@media(max-width:700px){

    .countryGrid{
        grid-template-columns:repeat(4,1fr);
    }

    .regionGrid{
        grid-template-columns:repeat(2,1fr);
    }

    .topBar{
        height:76px;
        grid-template-columns:repeat(3,1fr);
    }

    .bottomBar{
        height:60px;
    }

}

@media(max-width:430px){

    .screen{
        padding:10px;
    }

    .logo{
        font-size:23px;
    }

    .countryGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .countryButton{

    }

    }

    }

    }

    .bottomBar button{
        font-size:6px;
    }

    .changeCountryGrid{
        grid-template-columns:repeat(3,1fr);
    }

}

/* ======================================================
   LOADING
====================================================== */

.loading{

    inset:0;

    justify-content:center;
    align-items:center;
    color:#183442;
    font-size:12px;
    background:#a9cfdf;
    z-index:2;
}

</style>

function renderCountryButtons(filter=""){

    .filter(

/* ======================================================
   PROJECTION
====================================================== */

function project(lon,lat){

    const x =
        (lon+180)/360*1200;


    const rad =
        lat*Math.PI/180;


    const mercator =
        Math.log(
            Math.tan(
                Math.PI/4+
                rad/2
            )
        );


    const y =
        325-
        mercator*70;


    return [
        x,
        y
    ];

}


/* ======================================================
   RING
====================================================== */

function makeRing(ring){

    let path="";


    for(
        let i=0;
        i<ring.length;
        i++
    ){

        const point =
            project(
                ring[i][0],
                ring[i][1]
            );


        path +=
            i===0
            ? "M"
            : "L";


        path +=
            point[0].toFixed(2)+
            " "+
            point[1].toFixed(2);

    }


    return path+"Z";

}

    if(
        geometry.type ===
        "Polygon"
    ){

        geometry.coordinates
        .forEach(
            ring=>{
                path +=
                    makeRing(ring);
            }
        );

    }


    if(
        geometry.type ===
        "MultiPolygon"
    ){

        geometry.coordinates
        .forEach(
            polygon=>{

                polygon.forEach(
                    ring=>{

                        path +=
                            makeRing(
                                ring
                            );

                    }
                );

            }
        );

    }


    return path;

}

/* ======================================================
   MAP LOAD
====================================================== */

async function loadWorldMap(){

    const layer =
        document.getElementById(
            "worldLayer"
        );


    const loading =
        document.getElementById(
            "mapLoading"
        );


    layer.innerHTML="";


    try{

        const response =
            await fetch(
                MAP_URL,
                {
                    cache:"force-cache"
                }
            );


        if(!response.ok)
            throw new Error(
                "Map request failed"
            );


        const geojson =
            await response.json();


        let index=0;


        geojson.features
        .forEach(feature=>{

            if(
                !feature.geometry
            )
                return;


            const properties =
                feature.properties || {};


            const code =
                properties.ADM0_A3 ||
                properties.ISO_A3 ||
                properties.SOV_A3 ||
                "";


            /*
              اگر منطقه کل جهان نیست،
              فقط کشورهای آن منطقه نشان داده می‌شوند.
            */

            if(
                currentRegion !==
                "world"
            ){

                const allowed =
                    REGION_CODES[
                        currentRegion
                    ] || [];


                if(
                    !allowed.includes(code)
                )
                    return;

            }


            const name =
                properties.NAME ||
                properties.ADMIN ||
                "Country";


            createAI(name);


            const path =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );


            path.setAttribute(
                "d",
                makeGeometry(
                    feature.geometry
                )
            );


            path.classList.add(
                "countryShape"
            );


            path.style.fill =
                colors[
                    index %
                    colors.length
                ];


            path.dataset.country =
                name;


            path.dataset.code =
                code;


            path.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();


                    selectMapCountry(
                        name,
                        path
                    );

                }
            );


            layer.appendChild(
                path
            );


            index++;

        });


        loading.style.display =
            "none";


        /*
          کشور انتخاب‌شده را روی نقشه
          پیدا می‌کنیم.
        */

        highlightPlayerCountry();


    }catch(error){

        console.error(
            "MAP ERROR:",
            error
        );


        loading.innerHTML =
            "⚠️ نقشه بارگذاری نشد<br><small>اینترنت را بررسی کنید</small>";

    }

}

function createAI(name){

    if(!AI[name]){

        AI[name]={

            economy:
                100+
                Math.random()*1900,

            inflation:
                2+
                Math.random()*13,

            power:
                10+
                Math.random()*90,

            relation:
                30+
                Math.random()*45,

            stability:
                45+
                Math.random()*50,

            tradeNeed:
                20+
                Math.random()*80

        };

    }


    return AI[name];

}

/* ======================================================
   MAP ZOOM
====================================================== */

function applyTransform(){

    document
    .getElementById(
        "worldLayer"
    )
    .setAttribute(
        "transform",
        `translate(${mapX} ${mapY}) scale(${zoomLevel})`
    );

}


function zoom(value){

    zoomLevel*=value;


    zoomLevel=
        Math.max(
            1,
            Math.min(
                5,
                zoomLevel
            )
        );


    applyTransform();

}


function resetMap(){

    zoomLevel=1;

    mapX=0;

    mapY=0;

    applyTransform();

}


/* ======================================================
   MAP TOUCH / DRAG
====================================================== */

const map =
    document.getElementById(
        "map"
    );


map.addEventListener(
    "pointerdown",
    function(event){

        dragging=true;

        dragStartX =
            event.clientX;

        dragStartY =
            event.clientY;

        lastMapX =
            mapX;

        lastMapY =
            mapY;


        map.setPointerCapture(
            event.pointerId
        );

    }
);


map.addEventListener(
    "pointermove",
    function(event){

        if(!dragging)
            return;


        const dx =
            event.clientX-
            dragStartX;


        const dy =
            event.clientY-
            dragStartY;


        mapX =
            lastMapX+
            dx/(
                map.clientWidth
            )*
            1200;


        mapY =
            lastMapY+
            dy/(
                map.clientHeight
            )*
            650;


        applyTransform();

    }
);


map.addEventListener(
    "pointerup",
    function(event){

        dragging=false;


        try{

            map.releasePointerCapture(
                event.pointerId
            );

        }catch(e){}

    }
);

/* ======================================================
   GAME CLOCK
====================================================== */

setInterval(

    function(){

        if(
            document
            .getElementById(
                "game"
            )
            .classList
            .contains(
                "hidden"
            )
        )
            return;


        player.day++;


        /*
          درآمد پایه
        */

        let income =
            player.production*.55;


        /*
          تورم درآمد واقعی را کم می‌کند
        */

        income *=
            Math.max(
                .2,
                1-
                player.inflation/
                100
            );


        /*
          هزینه ارتش
        */

        const armyCost =
            player.army*1.8;


        player.money +=
            income-
            armyCost;


        /*
          کمبود پول
          باعث افزایش تورم می‌شود
        */

        if(
            player.money<5000
        ){

            player.inflation+=.16;

        }


        /*
          اقتصاد قوی
          تورم را کمی کنترل می‌کند
        */

        if(
            player.money>100000 &&
            player.production>130
        ){

            player.inflation-=.025;

        }


        /*
          تولید زیاد
          فشار تورمی ایجاد می‌کند
        */

        if(
            player.production>180
        ){

            player.inflation+=.03;

        }


        /*
          منابع
        */

        player.resources+=
            player.production*.008;


        /*
          محدودیت‌ها
        */

        player.inflation=
            Math.max(
                .5,
                Math.min(
                    80,
                    player.inflation
                )
            );


        player.resources=
            Math.min(
                999999,
                player.resources
            );


        /*
          هوش مصنوعی کشورها
        */

        Object
        .values(AI)
        .forEach(
            ai=>{

                ai.economy +=
                    (
                        Math.random()-
                        .48
                    )*.8;


                if(
                    ai.economy<100
                ){

                    ai.inflation+=.08;

                }else{

                    ai.inflation-=.03;

                }


                ai.inflation=
                    Math.max(
                        .5,
                        Math.min(
                            70,
                            ai.inflation
                        )
                    );


                ai.relation+=
                    (
                        Math.random()-
                        .5
                    )*.5;


                ai.relation=
                    Math.max(
                        0,
                        Math.min(
                            100,
                            ai.relation
                        )
                    );

            }
        );


        updateUI();

    },

    3000

);
