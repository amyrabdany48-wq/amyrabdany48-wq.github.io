<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no
"
>

<meta
name="theme-color"
content="#061019"
>

<title>
Empire Nations — Global Strategy
</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root
{
    --bg:#061019;
    --bg2:#081722;
    --panel:#0b1824;
    --panel2:#102231;
    --panel3:#152c3c;
    --panel4:#1a3445;

    --line:rgba(255,255,255,.10);
    --line2:rgba(255,255,255,.17);

    --text:#edf7ff;
    --muted:#8da3b7;

    --green:#31db99;
    --cyan:#42d8ff;
    --blue:#3f86ff;
    --red:#ff5e72;
    --yellow:#ffd166;
    --purple:#a87bff;
    --orange:#ff9b55;

    --shadow:
        0
        20px
        65px
        rgba(0,0,0,.42);
}


/* =========================================================
   GLOBAL
========================================================= */

*
{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body
{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

button,
input,
select,
textarea
{
    font:inherit;
}

button
{
    cursor:pointer;
}

button:disabled
{
    opacity:.45;
    cursor:not-allowed;
}


/* =========================================================
   GAME ROOT
========================================================= */

#game
{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(
            180deg,
            #07131e,
            #040a10
        );
}


/* =========================================================
   WORLD
========================================================= */

#world
{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle
            at
            50%
            50%,
            rgba(42,112,155,.12),
            transparent
            42%
        ),
        linear-gradient(
            180deg,
            #0b1d2a,
            #061019
        );
}


/* =========================================================
   OCEAN
========================================================= */

#ocean
{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(84,174,221,.035)
            1px,
            transparent
            1px
        ),
        linear-gradient(
            90deg,
            rgba(84,174,221,.035)
            1px,
            transparent
            1px
        );

    background-size:
        42px
        42px;

    pointer-events:none;
}


/* =========================================================
   MAP WRAPPER
========================================================= */

#mapViewport
{
    position:absolute;
    inset:0;
    overflow:hidden;
    touch-action:none;
}

#mapTransform
{
    position:absolute;
    left:50%;
    top:50%;

    width:1600px;
    height:900px;

    transform:
        translate(
            -50%,
            -50%
        );

    transform-origin:
        center;

    will-change:transform;
}


/* =========================================================
   SVG
========================================================= */

#worldMap
{
    width:1600px;
    height:900px;

    display:block;

    overflow:visible;
}

.countryShape
{
    stroke:
        rgba(
            255,
            255,
            255,
            .52
        );

    stroke-width:1.35;

    vector-effect:
        non-scaling-stroke;

    transition:
        fill
        .18s,
        filter
        .18s,
        opacity
        .18s;

    cursor:pointer;
}

.countryShape:hover
{
    filter:
        brightness(
            1.18
        );

    stroke:#fff;

    stroke-width:2.1;
}

.countryShape.selected
{
    stroke:#fff;

    stroke-width:3;

    filter:
        drop-shadow(
            0
            0
            9px
            rgba(
                255,
                255,
                255,
                .72
            )
        );
}

.countryShape.owned
{
    filter:
        drop-shadow(
            0
            0
            6px
            rgba(
                48,
                220,
                154,
                .38
            )
        );
}

.countryShape.enemy
{
    stroke:#ff536a;

    stroke-width:3;

    filter:
        drop-shadow(
            0
            0
            9px
            rgba(
                255,
                70,
                90,
                .7
            )
        );
}


/* =========================================================
   MAP LABEL
========================================================= */

.mapLabel
{
    pointer-events:none;
    text-anchor:middle;
    dominant-baseline:middle;

    fill:white;

    font-size:11px;

    font-weight:900;

    paint-order:stroke;

    stroke:
        rgba(
            0,
            0,
            0,
            .76
        );

    stroke-width:3px;
}

.mapLabelSmall
{
    font-size:8px;
}

.mapFlag
{
    pointer-events:none;
    text-anchor:middle;
    dominant-baseline:middle;

    font-size:14px;
}


/* =========================================================
   CAPITALS
========================================================= */

.capitalDot
{
    fill:#fff;

    stroke:#182b38;

    stroke-width:2;

    vector-effect:
        non-scaling-stroke;

    pointer-events:none;
}

.capitalRing
{
    fill:none;

    stroke:
        rgba(
            255,
            255,
            255,
            .52
        );

    stroke-width:1;

    vector-effect:
        non-scaling-stroke;

    pointer-events:none;
}


/* =========================================================
   FX
========================================================= */

#fxLayer
{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:40;

    overflow:hidden;
}

.missile
{
    position:absolute;

    width:13px;
    height:13px;

    border-radius:50%;

    background:white;

    box-shadow:
        0
        0
        9px
        white,
        0
        0
        20px
        #ffac4d,
        0
        0
        34px
        #ff4f3b;

    z-index:45;
}

.missile::after
{
    content:"";

    position:absolute;

    width:44px;
    height:4px;

    left:-41px;
    top:4px;

    border-radius:99px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(
                255,
                92,
                48,
                .88
            ),
            white
        );
}

.interceptor
{
    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#72e9ff;

    box-shadow:
        0
        0
        8px
        #72e9ff,
        0
        0
        19px
        #4595ff;

    z-index:46;
}

.explosion
{
    position:absolute;

    width:18px;
    height:18px;

    margin:
        -9px
        0
        0
        -9px;

    border:
        4px
        solid
        #ffd966;

    border-radius:50%;

    box-shadow:
        0
        0
        24px
        #ff893f,
        0
        0
        56px
        #ff3c50;

    animation:
        explosionAnim
        .88s
        ease-out
        forwards;

    z-index:50;
}

@keyframes
explosionAnim
{
    0%
    {
        transform:
            scale(
                .15
            );

        opacity:1;
    }

    50%
    {
        transform:
            scale(
                3
            );

        opacity:.9;
    }

    100%
    {
        transform:
            scale(
                7
            );

        opacity:0;
    }
}


/* =========================================================
   FRONT LINE FX
========================================================= */

.frontPulse
{
    position:absolute;

    width:28px;
    height:28px;

    border:
        3px
        solid
        rgba(
            255,
            86,
            103,
            .9
        );

    border-radius:50%;

    transform:
        translate(
            -50%,
            -50%
        );

    animation:
        frontPulse
        1.1s
        ease-out
        forwards;
}

@keyframes
frontPulse
{
    0%
    {
        transform:
            translate(
                -50%,
                -50%
            )
            scale(
                .2
            );

        opacity:1;
    }

    100%
    {
        transform:
            translate(
                -50%,
                -50%
            )
            scale(
                4
            );

        opacity:0;
    }
}


/* =========================================================
   TOP BAR
========================================================= */

#topBar
{
    position:absolute;

    top:8px;
    left:8px;
    right:8px;

    z-index:80;

    display:flex;

    gap:7px;

    align-items:stretch;
}

.glass
{
    background:
        rgba(
            7,
            17,
            27,
            .88
        );

    border:
        1px
        solid
        var(--line);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(
            18px
        );
}

.brand
{
    min-width:225px;

    padding:
        10px
        14px;

    border-radius:16px;
}

.brandTitle
{
    font-size:17px;

    font-weight:1000;

    letter-spacing:.6px;
}

.brandSub
{
    margin-top:4px;

    color:
        var(
            --muted
        );

    font-size:8px;
}

.resourceStrip
{
    display:flex;

    flex:1;

    gap:6px;

    overflow:auto;

    scrollbar-width:none;
}

.resourceStrip::-webkit-scrollbar
{
    display:none;
}

.resource
{
    min-width:103px;

    padding:
        8px
        10px;

    border-radius:14px;
}

.resource small
{
    display:block;

    color:
        var(
            --muted
        );

    font-size:8px;
}

.resource b
{
    display:block;

    margin-top:4px;

    font-size:12px;
}


/* =========================================================
   MAP TOOLS
========================================================= */

#mapTools
{
    position:absolute;

    left:8px;
    top:91px;

    z-index:80;

    display:flex;

    flex-direction:column;

    gap:6px;
}

.tool
{
    width:40px;
    height:40px;

    border:
        1px
        solid
        var(--line);

    border-radius:12px;

    color:#eef7ff;

    background:
        rgba(
            7,
            18,
            29,
            .92
        );
}

.tool.active
{
    border-color:
        var(
            --cyan
        );

    box-shadow:
        0
        0
        18px
        rgba(
            66,
            216,
            255,
            .26
        );
}


/* =========================================================
   SIDE PANEL
========================================================= */

#sidePanel
{
    position:absolute;

    right:8px;
    top:91px;

    width:320px;

    max-height:
        calc(
            100vh
            -
            176px
        );

    z-index:75;

    border-radius:19px;

    overflow:hidden;
}

.sideHead
{
    padding:
        12px
        14px;

    border-bottom:
        1px
        solid
        var(--line);

    display:flex;

    align-items:center;

    justify-content:
        space-between;
}

.sideBody
{
    padding:11px;

    max-height:
        calc(
            100vh
            -
            230px
        );

    overflow:auto;
}


/* =========================================================
   DOCK
========================================================= */

#dock
{
    position:absolute;

    left:50%;
    bottom:7px;

    transform:
        translateX(
            -50%
        );

    z-index:80;

    width:
        min(
            1100px,
            calc(
                100vw
                -
                16px
            )
        );

    padding:7px;

    border-radius:18px;

    display:flex;

    gap:4px;

    overflow:auto;

    scrollbar-width:none;
}

#dock::-webkit-scrollbar
{
    display:none;
}

.dockBtn
{
    flex:1;

    min-width:73px;

    border:0;

    border-radius:12px;

    background:
        transparent;

    color:#a8bbc9;

    padding:
        7px
        5px;
}

.dockBtn:hover
{
    background:
        rgba(
            255,
            255,
            255,
            .06
        );

    color:white;
}

.dockBtn i
{
    display:block;

    font-size:19px;

    font-style:normal;
}

.dockBtn span
{
    display:block;

    margin-top:3px;

    font-size:8px;

    font-weight:900;
}


/* =========================================================
   MODAL
========================================================= */

#modal
{
    position:fixed;

    inset:0;

    z-index:700;

    display:none;

    align-items:center;

    justify-content:center;

    padding:10px;

    background:
        rgba(
            0,
            0,
            0,
            .64
        );

    backdrop-filter:
        blur(
            7px
        );
}

#modal.show
{
    display:flex;
}

#modalBox
{
    width:
        min(
            1160px,
            97vw
        );

    max-height:94vh;

    border-radius:21px;

    overflow:hidden;
}

.modalHead
{
    padding:
        12px
        14px;

    border-bottom:
        1px
        solid
        var(--line);

    display:flex;

    align-items:center;

    justify-content:
        space-between;
}

.modalBody
{
    padding:13px;

    max-height:
        calc(
            94vh
            -
            59px
        );

    overflow:auto;
}

.close
{
    width:35px;
    height:35px;

    border:0;

    border-radius:10px;

    color:white;

    background:
        rgba(
            255,
            255,
            255,
            .07
        );
}


/* =========================================================
   GENERAL COMPONENTS
========================================================= */

.card
{
    padding:11px;

    margin-bottom:8px;

    border:
        1px
        solid
        rgba(
            255,
            255,
            255,
            .065
        );

    border-radius:14px;

    background:
        rgba(
            255,
            255,
            255,
            .032
        );
}

.cardHead
{
    display:flex;

    gap:8px;

    align-items:center;
}

.icon
{
    width:39px;
    height:39px;

    border-radius:11px;

    display:grid;

    place-items:center;

    background:
        rgba(
            60,
            155,
            255,
            .12
        );

    font-size:19px;
}

.title
{
    font-size:11px;

    font-weight:1000;
}

.sub
{
    margin-top:3px;

    color:
        var(
            --muted
        );

    font-size:8px;
}

.desc
{
    margin-top:8px;

    color:#b8c9d7;

    font-size:9px;

    line-height:1.9;
}

.row
{
    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-top:8px;
}

.grid
{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                205px,
                1fr
            )
        );

    gap:8px;
}

.kpis
{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                112px,
                1fr
            )
        );

    gap:7px;

    margin-bottom:10px;
}

.kpi
{
    padding:10px;

    border:
        1px
        solid
        rgba(
            255,
            255,
            255,
            .06
        );

    border-radius:12px;

    background:
        rgba(
            255,
            255,
            255,
            .03
        );
}

.kpi small
{
    display:block;

    color:
        var(
            --muted
        );

    font-size:8px;
}

.kpi b
{
    display:block;

    margin-top:4px;

    font-size:14px;
}

.section
{
    margin:
        14px
        0
        8px;

    font-size:11px;

    font-weight:1000;
}

.notice
{
    padding:
        9px
        10px;

    margin-bottom:9px;

    border:
        1px
        solid
        rgba(
            255,
            255,
            255,
            .07
        );

    border-radius:11px;

    color:#abc0d0;

    background:
        rgba(
            58,
            155,
            255,
            .045
        );

    font-size:8px;

    line-height:1.9;
}

.btn
{
    border:
        1px
        solid
        rgba(
            255,
            255,
            255,
            .08
        );

    border-radius:9px;

    padding:
        7px
        9px;

    color:#edf6ff;

    background:
        rgba(
            255,
            255,
            255,
            .045
        );

    font-size:9px;

    font-weight:900;
}

.btn:hover
{
    background:
        rgba(
            255,
            255,
            255,
            .09
        );
}

.btn.green
{
    background:
        linear-gradient(
            135deg,
            #187c60,
            #176c78
        );
}

.btn.red
{
    background:
        linear-gradient(
            135deg,
            #9d3149,
            #6b3042
        );
}

.btn.blue
{
    background:
        linear-gradient(
            135deg,
            #1d78bb,
            #3155a7
        );
}

.btn.purple
{
    background:
        linear-gradient(
            135deg,
            #6e51be,
            #8c4ca8
        );
}

.btn.orange
{
    background:
        linear-gradient(
            135deg,
            #b36d31,
            #8e512c
        );
}

.progress
{
    height:6px;

    margin-top:7px;

    border-radius:99px;

    overflow:hidden;

    background:#172936;
}

.progress > div
{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #37d8ff,
            #8c78ff,
            #31dc98
        );
}

.search
{
    width:100%;

    padding:
        9px
        10px;

    border:
        1px
        solid
        var(--line);

    border-radius:10px;

    outline:none;

    color:white;

    background:#091722;
}

.tabs
{
    display:flex;

    gap:5px;

    margin-bottom:10px;

    overflow:auto;

    scrollbar-width:none;
}

.tabs::-webkit-scrollbar
{
    display:none;
}

.tab
{
    white-space:nowrap;

    padding:
        7px
        10px;

    border:
        1px
        solid
        var(--line);

    border-radius:9px;

    color:#99adbe;

    background:
        rgba(
            255,
            255,
            255,
            .035
        );

    font-size:8px;

    font-weight:900;
}

.tab.active
{
    color:white;

    border-color:
        var(
            --cyan
        );

    background:
        rgba(
            55,
            170,
            255,
            .10
        );
}

.badge
{
    display:inline-block;

    margin:2px;

    padding:

        7px;

    border-radius:8px;

    background:
        rgba(
            255,
            255,
            255,
            .06
        );

    font-size:8px;
}


/* =========================================================
   TOAST
========================================================= */

#toast
{
    position:absolute;

    left:50%;
    top:82px;

    transform:
        translateX(
            -50%
        );

    z-index:1000;

    width:
        min(
            430px,
            92vw
        );
}

.toast
{
    margin-bottom:5px;

    padding:
        9px

    border:

        solid
        rgba(

            255,

            .09
        );

    background:

            16,

            .96
        );

    box-shadow:

            --shadow

}

.toast.good
{

        var(
            --green
        );

.toast.bad
{
    border-right-color:
        var(
            --red
        );
}

.toast.warn
{
    border-right-color:
        var(
            --yellow
        );
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen
{
    position:fixed;

    inset:0;

    z-index:1200;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:14px;

    background:
        radial-gradient(
            circle
            at
            50%
            38%,
            rgba(
                43,
                112,
                156,
                .28
            ),
            transparent
            36%
        ),
        linear-gradient(
            180deg,
            #091824,
            #04090e
        );
}

.startBox
{
    width:
        min(
            980px,
            96vw
        );

    max-height:93vh;

    padding:20px;

    overflow:auto;

    border:
        1px
        solid
        var(--line);

    border-radius:23px;

    background:
        rgba(
            6,
            14,
            23,
            .87
        );

    box-shadow:
        0
        30px
        110px
        rgba(
            0,
            0,
            0,
            .68
        );

    backdrop-filter:
        blur(
            18px
        );
}

.logo
{
    text-align:center;

    font-size:
        clamp(
            31px,
            7vw,
            60px
        );

    font-weight:1000;

    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #4dd9ff,
            #ab81ff,
            #fff
        );

    -webkit-background-clip:text;

    color:transparent;
}

.startSub
{
    margin:
        6px
        0

    text-align:center;

    color:#8fa5b8;

    font-size:9px;
}

.countryChoices
{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                150px,
                1fr
            )
        );

    gap:7px;
}

.choice
{
    padding:10px;

    border:
        1px
        solid
        rgba(
            255,
            255,
            255,
            .07
        );

    border-radius:12px;

    color:white;

    text-align:right;

    background:
        rgba(

/* =========================================================
   BASIC HELPERS
========================================================= */

function
clamp
(
    value,
    min,
    max
)
{
    return
    Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


function
number
(
    value,
    fallback
    =
    0
)
{
    const
    parsed
    =
    Number(
        value
    );

    return
    Number.isFinite(
        parsed
    )
    ?
    parsed
    :
    fallback;
}


function
formatMoney
(
    value
)
{
    return
    Math.round(
        value
        ||
        0
    )
    .toLocaleString(
        "en-US"
    )
    +
    "$";
}


function
formatNumber
(
    value
)
{
    return
    Number(
        value
        ||
        0
    )
    .toLocaleString(
        "en-US"
    );
}


function
safe
(
    value
)
{
    return
    String(
        value
        ??
        ""
    )
    .replace(
        /[&<>"']/g,
        character
        =>
        (
            {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            }
        )
        [
            character
        ]
    );
}


/* =========================================================
   TOAST
========================================================= */

function
toast
(
    text,
    type
    =
    "info"
)
{
    const
    element
    =
    document
    .createElement(
        "div"
    );

    element
    .className
    =
    "toast "
    +
    type;

    element
    .textContent
    =
    text;

    $("toast")
    .appendChild(
        element
    );

    setTimeout(
        () =>
        {
            element
            .remove();
        },
        2600
    );
}

    $("modalTitle")

    .classList
    .add(
        "show"

}


function

{
    $("modal")
    .classList
    .remove(
        "show"
    );
}


$("modal")

/* =========================================================

========================================================= */

function
normalizeState
()
{

    state.money
    =
    Math.max(
        0,
        number(
            state.money
        )
    );


    state.population
    =
    Math.max(
        .1,
        number(
            state.population
        )
    );


    state.food
    =
    Math.max(
        0,
        number(
            state.food
        )
    );


    state.energy
    =
    Math.max(
        0,
        number(
            state.energy
        )
    );


    state.oil
    =
    Math.max(
        0,
        number(
            state.oil
        )
    );


    state.industry
    =
    Math.max(
        1,
        number(
            state.industry
        )
    );


    state.military
    =
    Math.max(
        1,
        number(
            state.military
        )
    );


    state.technology
    =
    Math.max(
        0,
        number(
            state.technology
        )
    );


    state.research
    =
    Math.max(
        0,
        number(
            state.research
        )
    );


    state.stability
    =
    clamp(

        ),

    );

        number(

        ),

    );


    state.reputation

    );

/* =========================================================
   SAVE
========================================================= */

function
saveGame
()
{
    try
    {
        localStorage
        .setItem(
            SAVE_KEY,
            JSON.stringify(
                state
            )
        );
    }
    catch
    (
        error
    )
    {
        console
        .warn(
            error
        );
    }
}


/* =========================================================
   LOAD
========================================================= */

function
loadGame
()
{
    try
    {
        const
        raw
        =
        localStorage
        .getItem(
            SAVE_KEY
        );

        if
        (
            !raw
        )
        {
            return
            false;
        }

        const
        parsed
        =
        JSON.parse(
            raw
        );

        state
        =
        Object.assign(
            state,
            parsed
        );

        normalizeState();

        return
        true;
    }
    catch
    (
        error
    )
    {
        console
        .warn(
            error
        );

        return
        false;
    }
}


/* =========================================================
   COUNTRY HELPERS
========================================================= */

function
country
(
    id
)
{
    return
    COUNTRIES
    .find(
        item
        =>
        item.id
        ===
        id
    )
    ||
    null;
}


function
playerCountry
()
{
    return
    country(
        state.player
    )
    ||
    COUNTRIES[
        0
    ];
}


function
relation
(
    id
)
{
    return
    number(
        state
        .relations[
            id
        ],
        0
    );
}


function
setRelation
(
    id,
    value
)
{
    if
    (
        id
        ===
        state.player
    )
    {
        return;
    }

    state
    .relations[
        id
    ]
    =
    clamp(
        value,
        -100,
        100
    );
}


function
changeRelation
(
    id,
    amount
)
{
    setRelation(
        id,
        relation(
            id
        )
        +
        amount
    );
}


/* =========================================================
   NEWS
========================================================= */

function
addNews
(
    title,
    text,
    type
    =
    "world"
)
{
    state
    .news
    .unshift(
        {
            title,
            text,
            type,
            year:
                state.year,
            month:
                state.month,
            day:
                state.day
        }
    );

    if
    (
        state.news.length
        >
        500
    )
    {
        state.news.length
        =
        500;
    }
}


/* =========================================================
   TERRITORY INITIALIZATION
========================================================= */

function
initializeTerritory
(
    id,
    core
    =
    false
)
{
    const
    data
    =
    country(
        id
    );

    if
    (
        !data
    )
    {
        return;
    }

    if
    (
        state
        .territoryData[
            id
        ]
    )
    {
        return;
    }

    state
    .territoryData[
        id
    ]
    =
    {
        control:
            core
            ?
            100
            :
            58,

        loyalty:
            core
            ?
            100
            :
            45,

        unrest:
            core
            ?
            4
            :
            38,

        stability:
            core
            ?
            data.stability
            :
            45,

        infrastructure:
            core
            ?
            72
            :
            48,

        localIndustry:
            Math.round(
                data.economy
                *
                .42
            ),

        localTax:10,

        defense:
            Math.round(
                data.military
                *
                .45
            ),

        food:60,

        energy:55,

        reconstruction:0
    };
}

    *

    =

/* =========================================================

function

(
    points
)
{
    return
    points
    .map(
        point
        =>
        point[
            0
        ]
        +
        ","
        +
        point[
            1
        ]
    )
    .join(
        " "
    );
}

function

    =
    $("labelLayer");


    const
    capitalLayer
    =
    $("capitalLayer");

    =
    "";

    =
    "";


    capitalLayer
    .innerHTML
    =
    "";


    COUNTRIES
    .forEach(
        item
        =>
        {

            const
            namespace
            =
            "http://www.w3.org/2000/svg";


            const
            polygon
            =
            document
            .createElementNS(
                namespace,
                "polygon"
            );


            polygon
            .setAttribute(
                "points",
                pointsToString(
                    item.points
                )
            );


            polygon
            .setAttribute(
                "fill",
                getCountryFill(
                    item

            );

            .setAttribute(
                "data-id",
                item.id
            );


            polygon
            .classList
            .add(
                "countryShape"
            );

                state

                .includes(
                    item.id
                )
            )
            {

                .classList
                .add(
                    "owned"
                );
            }

                state
                .selectedCountry
                ===
                item.id
            )

                .classList
                .add(
                    "selected"
                );
            }

            (
                state
                .wars

                    war.enemy

                    item.id

                    war.status

                    "war"
                )

            );

            );

/* =========================================================

========================================================= */

function

(
    mode
)
{
    state.mapMode
    =
    mode;


    document
    .querySelectorAll(
        "[data-map-mode]"
    )
    .forEach(
        button
        =>
        {
            button
            .classList
            .toggle(
                "active",
                button
                .dataset
                .mapMode
                ===
                mode
            );
        }
    );


    applyMapMode();


    saveGame();
}


/* =========================================================
   MAP MODE EFFECT
========================================================= */

function
applyMapMode
()
{
    document
    .querySelectorAll(
        ".countryShape"
    )
    .forEach(
        element
        =>
        {

            const
            data
            =
            country(
                element
                .dataset
                .id
            );


            if
            (
                !data
            )
            {
                return;
            }


            const
            owned
            =
            state
            .territories
            .includes(
                data.id
            );


            let
            value
            =
            50;


            if
            (
                state.mapMode
                ===
                "political"
            )
            {
                element
                .style
                .filter
                =
                "";
            }


            if
            (
                state.mapMode
                ===
                "military"
            )
            {
                value
                =
                owned
                ?
                state.military
                :
                data.military;


                element
                .style
                .filter
                =
                `brightness(${.60 + value / 190}) saturate(${.75 + value / 100})`;
            }


            if
            (
                state.mapMode
                ===
                "economy"
            )
            {
                value
                =
                owned
                ?
                state.industry
                :
                data.economy;


                element
                .style
                .filter
                =
                `brightness(${.60 + value / 190}) saturate(${.70 + value / 105})`;
            }


            if
            (
                state.mapMode
                ===
                "stability"
            )
            {
                value
                =
                owned
                ?
                (
                    state
                    .territoryData[
                        data.id
                    ]
                    ?
                    state
                    .territoryData[
                        data.id
                    ]
                    .stability
                    :
                    state.stability
                )
                :
                data.stability;


                element
                .style
                .filter
                =
                `brightness(${.60 + value / 190}) saturate(${.60 + value / 110})`;
            }

        }
    );
}


/* =========================================================
   MAP TRANSFORM
========================================================= */

function
applyMapTransform
()
{
    $("mapTransform")
    .style
    .transform
    =
    `
    translate(
        calc(-50% + ${state.mapX}px),
        calc(-50% + ${state.mapY}px)
    )
    scale(
        ${state.mapZoom}
    )
    `;
}


/* =========================================================

========================================================= */

function
zoomMap
(
    direction
)
{
    state.mapZoom
    =
    clamp(
        state.mapZoom
        +

        *
        .12,
        .65,
        2.3
    );


    applyMapTransform();

}


/* =========================================================
   RESET MAP VIEW
========================================================= */

function
resetMapView
()
{
    state.mapZoom
    =
    window
    .innerWidth
    <
    760
    ?
    .68
    :
    .92;


    state.mapX
    =
    0;


    state.mapY
    =
    10;


    applyMapTransform();
}


/* =========================================================
   MAP DRAG
========================================================= */

let
mapPointer
=
{
    active:false,
    x:0,
    y:0,
    startX:0,
    startY:0
};


$("mapViewport")
.addEventListener(
    "pointerdown",
    event
    =>
    {
        mapPointer.active
        =
        true;

        mapPointer.x
        =
        event.clientX;

        mapPointer.y
        =
        event.clientY;

        mapPointer.startX
        =
        state.mapX;

        mapPointer.startY
        =
        state.mapY;


        $("mapViewport")
        .setPointerCapture(
            event.pointerId
        );
    }
);


$("mapViewport")
.addEventListener(
    "pointermove",
    event
    =>
    {
        if
        (
            !mapPointer.active
        )
        {
            return;
        }


        state.mapX
        =
        mapPointer.startX
        +
        (
            event.clientX
            -
            mapPointer.x
        );


        state.mapY
        =
        mapPointer.startY
        +
        (
            event.clientY
            -
            mapPointer.y
        );


        applyMapTransform();
    }
);


$("mapViewport")
.addEventListener(
    "pointerup",
    event
    =>
    {
        mapPointer.active
        =
        false;


        try
        {
            $("mapViewport")
            .releasePointerCapture(
                event.pointerId
            );
        }
        catch
        (
            error
        )
        {
        }


        saveGame();
    }
);


$("mapViewport")
.addEventListener(
    "wheel",
    event
    =>
    {
        event
        .preventDefault();


        state.mapZoom
        =
        clamp(
            state.mapZoom
            +
            (
                event.deltaY
                <
                0
                ?
                .08
                :
                -.08
            ),
            .65,
            2.3
        );


        applyMapTransform();
    },
    {
        passive:false
    }
);

function
powerScore
()
{
    return
    state.military
    *
    .30
    +
    state.industry
    *
    .20
    +
    state.technology
    *
    .20
    +
    state.stability
    *
    .10
    +
    state.reputation
    *
    .07
    +
    state.influence
    *
    .05
    +
    state.territories.length
    *
    7
    +
    equipmentPower()
    *
    .012;
}


/* =========================================================
   WORLD RANKING
========================================================= */

function

()
{
    return
    COUNTRIES
    .map(
        item
        =>
        {

            let
            score
            =
            item.military
            *
            .38
            +
            item.economy
            *
            .30
            +
            item.technology
            *
            .20
            +
            item.stability
            *
            .12;


            if
            (
                item.id
                ===
                state.player
            )
            {
                score
                =
                powerScore();
            }


            return
            {
                id:
                    item.id,
                name:
                    item.name,
                flag:
                    item.flag,
                score
            };

        }
    )
    .sort(
        (
            a,
            b
        )
        =>
        b.score
        -
        a.score
    );
}

/* =========================================================
   EQUIPMENT HELPERS
========================================================= */

function
equipmentById
(
    id
)
{
    return
    EQUIPMENT
    .find(
        item
        =>
        item.id
        ===
        id
    )
    ||
    null;
}


function
equipmentCount
()
{
    return
    Object
    .values(
        state.inventory
    )
    .reduce(
        (
            sum,
            amount
        )
        =>
        sum
        +
        amount,
        0
    );
}


function
equipmentPower
()
{
    let
    total
    =
    0;


    EQUIPMENT
    .forEach(
        item
        =>
        {
            total
            +=
            (
                state
                .inventory[
                    item.id
                ]
                ||
                0
            )
            *
            item.power;
        }
    );


    return
    total;
}


function
categoryPower
(
    type
)
{
    let
    total
    =
    0;


    EQUIPMENT
    .filter(
        item
        =>
        item.type
        ===
        type
    )
    .forEach(
        item
        =>
        {
            total
            +=
            (
                state
                .inventory[
                    item.id
                ]
                ||
                0
            )
            *
            item.power;
        }
    );


    return
    total;
}

/* =========================================================
   BUY EQUIPMENT
========================================================= */

function
buyEquipment
(
    id
)
{
    const
    item
    =
    equipmentById(
        id
    );


    if
    (
        !item
    )
    {
        return;
    }


    if
    (
        state.technology
        <
        item.tech
    )
    {
        toast(
            "سطح فناوری کافی نیست",
            "warn"
        );

        return;
    }


    if
    (
        state.money
        <
        item.cost
    )
    {
        toast(
            "بودجه کافی نیست",
            "bad"
        );

        return;
    }


    state.money
    -=
    item.cost;


    state
    .inventory[
        item.id
    ]
    =
    (
        state
        .inventory[
            item.id
        ]
        ||
        0
    )
    +
    1;


    state.military
    +=
    item.power
    *
    .035;


    if
    (
        item.type
        ===
        "airdef"
    )
    {
        state.missileDefense
        +=
        item.defense
        *
        .03;
    }


    state.statistics
    .equipmentBought++;


    addNews(
        "🛒 خرید تجهیزات",
        `${item.name} به نیروهای مسلح اضافه شد.`,
        "military"
    );


    saveGame();


    renderAll();


    openStore(
        item.type
    );


    toast(
        "✅ خرید انجام شد",
        "good"
    );
}


/* =========================================================
   SELL EQUIPMENT
========================================================= */

function
sellEquipment
(
    id
)
{
    const
    item
    =
    equipmentById(
        id
    );


    if
    (
        !item
    )
    {
        return;
    }


    if
    (
        !
        (
            state
            .inventory[
                item.id
            ]
            >
            0
        )
    )
    {
        toast(
            "این تجهیز در انبار نیست",
            "warn"
        );

        return;
    }


    state
    .inventory[
        item.id
    ]--;


    state.money
    +=
    Math.round(
        item.cost
        *
        .55
    );


    state.military
    =
    Math.max(
        1,
        state.military
        -
        item.power
        *
        .02
    );


    saveGame();


    renderAll();


    openStore(
        item.type
    );
}

/* =========================================================
   PLAYER WAR POWER
========================================================= */

function
calculatePlayerWarPower
()
{
    return
    Math.max(
        1,
        state.military
        +
        state.technology
        *
        .40
        +
        state.industry
        *
        .18
        +
        state.command
        *
        .15
        +
        equipmentPower()
        *
        .018
        -
        state.warExhaustion
        *
        .35
    );
}


/* =========================================================
   ENEMY WAR POWER
========================================================= */

function
calculateEnemyWarPower
(
    id
)
{
    const
    enemy
    =
    country(
        id
    );


    if
    (
        !enemy
    )
    {
        return
        50;
    }


    return
    enemy.military
    *
    1.32
    +
    enemy.economy
    *
    .31
    +
    enemy.technology
    *
    .22
    +
    enemy.stability
    *
    .16
    +
    Math.random()
    *
    14;
}


/* =========================================================
   WAR DECLARATION
========================================================= */

function
declareWar
(
    id
)
{
    if
    (
        id
        ===
        state.player
        ||
        state
        .territories
        .includes(
            id
        )
    )
    {
        return;
    }


    if
    (
        state
        .wars
        .some(
            war
            =>
            war.enemy
            ===
            id
            &&
            war.status
            ===
            "war"
        )
    )
    {
        toast(
            "با این کشور در جنگ هستی",
            "warn"
        );

        return;
    }


    if
    (
        state.command
        <
        10
    )
    {
        toast(
            "فرماندهی کافی نیست",
            "bad"
        );

        return;
    }


    state.command
    -=
    10;


    state.statistics
    .wars++;


    state
    .wars
    .push(
        {

            id:
                "WAR-"
                +
                Date.now(),

            enemy:
                id,

            status:
                "war",

            score:0,

            control:0,

            enemyDefense:100,

            enemyInfrastructure:100,

            enemyMorale:100,

            ourMorale:100,

            groundSuperiority:50,

            airSuperiority:50,

            navalSuperiority:50,

            supply:80,

            days:0

        }
    );


    setRelation(
        id,
        -100
    );


    state.warExhaustion
    +=
    1;


    addNews(
        "⚔️ آغاز جنگ",
        `جنگ با ${country(id)?.name || id} آغاز شد.`,
        "military"
    );


    saveGame();


    renderAll();


    openWarCenter();
}

/* =========================================================
   GROUND OPERATION
========================================================= */

function
groundOperation
(
    warId
)
{
    const
    war
    =
    getWar(
        warId
    );


    if
    (
        !war
        ||
        war.status
        !==
        "war"
    )
    {
        return;
    }


    if
    (
        state.command
        <
        5
        ||
        state.energy
        <
        2
        ||
        state.food
        <
        1
    )
    {
        toast(
            "منابع کافی نیست",
            "bad"
        );

        return;
    }


    state.command
    -=
    5;

/* =========================================================
   SVG TO SCREEN
========================================================= */

function
mapPointToScreen
(
    point
)
{
    const
    svg
    =
    $("worldMap");


    const
    svgPoint
    =
    svg
    .createSVGPoint();


    svgPoint.x
    =
    point.x;


    svgPoint.y
    =
    point.y;


    const
    matrix
    =
    svg
    .getScreenCTM();


    if
    (
        !matrix
    )
    {
        return
        {
            x:
                window.innerWidth
                /
                2,
            y:
                window.innerHeight
                /
                2
        };
    }


    const
    transformed
    =
    svgPoint
    .matrixTransform(
        matrix
    );


    return
    {
        x:
            transformed.x,
        y:
            transformed.y
    };
}


/* =========================================================
   MISSILE LAUNCH
========================================================= */

function
launchMissile
(
    warId,
    equipmentId
)
{
    const
    war
    =
    getWar(
        warId
    );


    const
    missile
    =
    equipmentById(
        equipmentId
    );


    if
    (
        !war
        ||
        !missile
    )
    {
        return;
    }


    if
    (
        !
        (
            state
            .inventory[
                equipmentId
            ]
            >
            0
        )
    )
    {
        toast(
            "موشک موجود نیست",
            "bad"
        );

        return;
    }


    if
    (
        state.command
        <
        4
        ||
        state.energy
        <
        1
    )
    {
        toast(
            "منابع شلیک کافی نیست",
            "bad"
        );

        return;
    }


    state
    .inventory[
        equipmentId
    ]--;


    state.command
    -=
    4;


    state.energy
    -=
    1;


    state.statistics
    .launches++;


    closeModal();


    const
    startMap
    =
    countryCenter(
        state.player
    );


    const
    endMap
    =
    countryCenter(
        war.enemy
    );


    const
    start
    =
    mapPointToScreen(
        startMap
    );


    const
    end
    =
    mapPointToScreen(
        endMap
    );


    animateMissile(
        start,
        end,
        () =>
        {

            const
            enemy
            =
            country(
                war.enemy
            );


            const
            baseDefense
            =
            enemy
            ?
            enemy.military
            *
            .19
            +
            enemy.technology
            *
            .15
            :
            20;


            const
            interceptionChance
            =
            clamp(
                baseDefense
                +
                Math.random()
                *
                18,
                7,
                72
            );


            const
            intercepted
            =
            Math.random()
            *
            100
            <
            interceptionChance;


            if
            (
                intercepted
            )
            {

                state.statistics
                .interceptions++;


                animateInterceptor(
                    end,
                    () =>
                    {
                        createExplosion(
                            end.x,
                            end.y
                        );
                    }
                );


                toast(
                    "🛡️ موشک رهگیری شد",
                    "warn"
                );

            }
            else
            {

                createExplosion(
                    end.x,
                    end.y
                );


                const
                damage
                =
                missile.power
                *
                (
                    .18
                    +
                    Math.random()
                    *
                    .14
                );


                war.enemyDefense
                =
                clamp(
                    war.enemyDefense
                    -
                    damage
                    *
                    .34,
                    0,
                    100
                );


                war.enemyInfrastructure
                =
                clamp(
                    war.enemyInfrastructure
                    -
                    damage
                    *
                    .42,
                    0,
                    100
                );


                war.enemyMorale
                =
                clamp(
                    war.enemyMorale
                    -
                    damage
                    *
                    .24,
                    0,
                    100
                );


                war.score
                +=
                damage
                *
                .10;


                toast(
                    "💥 برخورد ثبت شد",
                    "good"
                );


                checkWarVictory(
                    war
                );

            }


            addNews(
                "🚀 حمله موشکی",
                `${missile.name} در جنگ با ${country(war.enemy)?.name || war.enemy} استفاده شد.`,
                "military"
            );


            saveGame();


            renderAll();

        }
    );
}


/* =========================================================
   MISSILE ANIMATION
========================================================= */

function
animateMissile
(
    start,
    end,
    done
)
{
    const
    element
    =
    document
    .createElement(
        "div"
    );


    element
    .className
    =
    "missile";


    $("fxLayer")
    .appendChild(
        element
    );


    const
    startTime
    =
    performance
    .now();


    const
    distance
    =
    Math.hypot(
        end.x
        -
        start.x,
        end.y
        -
        start.y
    );


    const
    duration
    =
    clamp(
        850
        +
        distance
        *
        .8,
        900,
        1800
    );


    const
    arc
    =
    clamp(
        distance
        *
        .22,
        80,
        230
    );


    function
    frame
    (
        now
    )
    {
        const
        t
        =
        clamp(
            (
                now
                -
                startTime
            )
            /
            duration,
            0,
            1
        );


        const
        eased
        =
        t
        <
        .5
        ?
        2
        *
        t
        *
        t
        :
        1
        -
        Math.pow(
            -2
            *
            t
            +
            2,
            2
        )
        /
        2;


        const
        x
        =
        start.x
        +
        (
            end.x
            -
            start.x
        )
        *
        eased;


        const
        yLinear
        =
        start.y
        +
        (
            end.y
            -
            start.y
        )
        *
        eased;


        const
        y
        =
        yLinear
        -
        Math.sin(
            Math.PI
            *
            t
        )
        *
        arc;


        element
        .style
        .left
        =
        x
        +
        "px";


        element
        .style
        .top
        =
        y
        +
        "px";


        const
        angle
        =
        Math.atan2(
            end.y
            -
            start.y,
            end.x
            -
            start.x
        )
        *
        180
        /
        Math.PI;


        element
        .style
        .transform
        =
        `rotate(${angle}deg)`;


        if
        (
            t
            <
            1
        )
        {
            requestAnimationFrame(
                frame
            );
        }
        else
        {
            element
            .remove();


            if
            (
                done
            )
            {
                done();
            }
        }
    }


    requestAnimationFrame(
        frame
    );
}

(
    war
)
{
    if
    (
        !war
        ||
        war.status
        !==
        "war"
    )
    {
        return;
    }


    if
    (
        war.control
        >=
        100
        ||
        (
            war.enemyDefense
            <=
            0
            &&
            war.enemyMorale
            <=
            10
        )
    )
    {
        conquerCountry(
            war
        );
    }
}


/* =========================================================

========================================================= */

(
    war
)
{
    if
    (
        state
        .territories
        .includes(
            war.enemy
        )
    )
    {
        return;
    }


    const
    enemy
    =
    country(
        war.enemy
    );


    state
    .territories
    .push(
        war.enemy
    );


    initializeTerritory(
        war.enemy,
        false
    );


    const
    territory
    =
    state
    .territoryData[
        war.enemy
    ];


    territory.control
    =
    62;


    territory.loyalty
    =
    42;


    territory.unrest
    =
    38;


    territory.stability
    =
    45;


    territory.infrastructure
    =
    Math.max(
        28,
        war.enemyInfrastructure
        *
        .65
    );


    territory.defense
    =
    35;


    territory.reconstruction
    =
    25;


    war.status
    =
    "won";


    state.statistics
    .wins++;


    state.statistics
    .territoriesTaken++;


    state.money
    +=
    1800;


    state.reputation
    +=
    2;


    state.influence
    +=
    3;


    state.warExhaustion
    =
    Math.max(
        0,
        state.warExhaustion
        -
        3
    );


    addNews(
        "🏆 تصرف کشور",
        `${enemy?.name || war.enemy} به قلمرو شما اضافه شد.`,
        "military"
    );


    toast(
        `🏆 ${enemy?.name || war.enemy} تصرف شد`,

    renderAll();


    openTerritories();
}

/* =========================================================
   CRITICAL HELPER FIXES
   These definitions intentionally replace the helper
   functions from Part 1 and prevent ASI return issues.
========================================================= */

function clamp(value,min,max)
{
    return Math.max(
        min,
        Math.min(
            max,
            Number(value)
        )
    );
}


function number(value,fallback=0)
{
    const parsed=Number(value);

    return Number.isFinite(parsed)
        ? parsed
        : fallback;
}


function formatMoney(value)
{
    return Math.round(
        Number(value)||0
    ).toLocaleString(
        "en-US"
    )+"$";
}


function formatNumber(value)
{
    return Number(
        value||0
    ).toLocaleString(
        "en-US"
    );
}


function safe(value)
{
    return String(
        value??""
    ).replace(
        /[&<>"']/g,
        character=>({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        })[character]
    );
}


function country(id)
{
    return COUNTRIES.find(
        item=>item.id===id
    )||null;
}


function playerCountry()
{
    return country(
        state.player
    )||COUNTRIES[0];
}


function relation(id)
{
    return number(
        state.relations[id],
        0
    );
}


function setRelation(id,value)
{
    if(id===state.player)
    {
        return;
    }

    state.relations[id]=clamp(
        value,
        -100,
        100
    );
}


function changeRelation(id,amount)
{
    setRelation(
        id,
        relation(id)+amount
    );
}


function equipmentById(id)
{
    return EQUIPMENT.find(
        item=>item.id===id
    )||null;
}


function getWar(id)
{
    return state.wars.find(
        war=>war.id===id
    )||null;
}

/* =========================================================
   ECONOMIC SCORE
========================================================= */

function economicScore()
{
    let score=0;

    score+=state.industry*.46;
    score+=state.trade*.28;
    score+=state.technology*.16;
    score+=state.logistics*.12;
    score+=state.stability*.08;

    score-=state.inflation*.75;
    score-=state.unemployment*.45;

    return Math.max(
        0,
        score
    );
}


/* =========================================================
   BUILDING COST
========================================================= */

function getBuildingCost(id)
{
    const building=BUILDINGS.find(
        item=>item.id===id
    );

    if(!building)
    {
        return Infinity;
    }

    const level=
        state.buildings[id]||0;

    return Math.round(
        building.cost*
        Math.pow(
            1.19,
            level
        )
    );
}

/* =========================================================
   BUILD STRUCTURE
========================================================= */

function buildStructure(id)
{
    const building=
        BUILDINGS.find(
            item=>item.id===id
        );

    if(!building)
    {
        return;
    }

    const cost=
        getBuildingCost(id);

    if(state.money<cost)
    {
        toast(
            "بودجه کافی نیست",
            "bad"
        );

        return;
    }

    state.money-=cost;

    state.buildings[id]=
        (state.buildings[id]||0)+1;

    state.food+=
        building.food;

    state.energy+=
        building.energy;

    state.oil+=
        building.oil;

    state.industry+=
        building.industry;

    state.research+=
        building.research;

    state.stability+=
        building.stability;

    state.missileDefense+=
        building.defense;

    if(id==="rail")
    {
        state.logistics+=5;
    }

    if(id==="port")
    {
        state.trade+=4;
    }

    if(id==="university")
    {
        state.technology+=1;
    }

    if(id==="hospital")
    {
        state.approval+=2;
    }

    if(id==="factory")
    {
        state.unemployment=
            Math.max(
                0,
                state.unemployment-.35
            );
    }

    state.statistics
        .buildingsBuilt++;

    addNews(
        "🏗️ پروژه ملی",
        `${building.name} توسعه یافت.`,
        "economy"
    );

    normalizeState();

    saveGame();

    renderAll();

    openEconomy();

    toast(
        "✅ پروژه تکمیل شد",
        "good"
    );
}


/* =========================================================
   MILITARY MAINTENANCE
========================================================= */

function calculateMilitaryMaintenance()
{
    let total=0;

    EQUIPMENT.forEach(
        item=>
        {
            const amount=
                state.inventory[
                    item.id
                ]||0;

            total+=
                amount*
                item.maintenance*
                .18;
        }
    );

    state.militaryMaintenance=
        total;

    return total;
}


/* =========================================================
   DAILY INCOME
========================================================= */

function calculateDailyIncome()
{
    let income=0;

    income+=
        state.industry*
        4.3;

    income+=
        state.population*
        .95;

    income+=
        state.trade*
        1.8;

    income+=
        state.logistics*
        .55;

    income+=
        calculateTerritoryIncome();

    const taxMultiplier=
        .72+
        state.taxRate/
        45;

    income*=
        taxMultiplier;

    const inflationPenalty=
        clamp(
            1-
            Math.max(
                0,
                state.inflation
            )/
            180,
            .45,
            1
        );

    income*=
        inflationPenalty;

    income-=
        calculateMilitaryMaintenance();

    return income;
}

/* =========================================================
   GOVERNMENT ACTION
========================================================= */

function governmentAction(type)
{
    const action=
        GOVERNMENT_ACTIONS.find(
            item=>item.id===type
        );

    if(!action)
    {
        return;
    }

    if(state.money<action.cost)
    {
        toast(
            "بودجه کافی نیست",
            "bad"
        );

        return;
    }

    if(state.politicalCapital<4)
    {
        toast(
            "سرمایه سیاسی کافی نیست",
            "warn"
        );

        return;
    }

    state.money-=
        action.cost;

    state.politicalCapital-=
        4;

    if(type==="welfare")
    {
        state.approval+=7;
        state.stability+=3;
        state.food+=5;
    }

    if(type==="industry")
    {
        state.industry+=7;
        state.unemployment-=.7;
        state.energy-=2;
    }

    if(type==="education")
    {
        state.research+=8;
        state.technology+=2;
        state.approval+=1;
    }

    if(type==="security")
    {
        state.stability+=5;

        state.territories.forEach(
            id=>
            {
                const territory=
                    state.territoryData[id];

                if(!territory)
                {
                    return;
                }

                territory.unrest=
                    clamp(
                        territory.unrest-5,
                        0,
                        100
                    );

                territory.control=
                    clamp(
                        territory.control+2,
                        0,
                        100
                    );
            }
        );
    }

    if(type==="infrastructure")
    {
        state.logistics+=7;
        state.industry+=3;

        state.territories.forEach(
            id=>
            {
                const territory=
                    state.territoryData[id];

                if(territory)
                {
                    territory.infrastructure=
                        clamp(
                            territory.infrastructure+2,
                            0,
                            100
                        );
                }
            }
        );
    }

    if(type==="antiInflation")
    {
        state.inflation=
            Math.max(
                0,
                state.inflation-1.8
            );

        state.stability+=1;
    }

    addNews(
        "🏛️ تصمیم دولت",
        `${action.name} اجرا شد.`,
        "politics"
    );

    normalizeState();

    saveGame();

    renderAll();

    openGovernment();
}

========================================================= */

function relationStatus(value)
{
    if(value>=75)
    {
        return "متحد نزدیک";
    }

    if(value>=45)
    {
        return "دوستانه";
    }

    if(value>=15)
    {
        return "مثبت";
    }

    if(value>-20)
    {
        return "خنثی";
    }

    if(value>-55)
    {
        return "سرد";
    }

    return "خصمانه";
}

/* =========================================================
   TECHNOLOGY COST
========================================================= */

function technologyCost(id)
{
    const tech=
        TECHNOLOGIES.find(
            item=>item.id===id
        );

    if(!tech)
    {
        return Infinity;
    }

    const level=
        state.technologyLevels[id]||0;

    return Math.round(
        tech.cost*
        Math.pow(
            1.28,
            level
        )
    );
}


/* =========================================================
   RESEARCH COST
========================================================= */

function technologyResearchCost(id)
{
    const tech=
        TECHNOLOGIES.find(
            item=>item.id===id
        );

    if(!tech)
    {
        return Infinity;
    }

    const level=
        state.technologyLevels[id]||0;

    return Math.round(
        tech.researchCost*
        Math.pow(
            1.15,
            level
        )
    );
}

/* =========================================================
   RESEARCH TECHNOLOGY
========================================================= */

function researchTechnology(id)
{
    const tech=
        TECHNOLOGIES.find(
            item=>item.id===id
        );

    if(!tech)
    {
        return;
    }

    const cost=
        technologyCost(id);

    const researchCost=
        technologyResearchCost(id);

    if(state.money<cost)
    {
        toast(
            "بودجه کافی نیست",
            "bad"
        );

        return;
    }

    if(state.research<researchCost)
    {
        toast(
            "امتیاز تحقیق کافی نیست",
            "warn"
        );

        return;
    }

    const level=
        state.technologyLevels[id]||0;

    state.money-=cost;

    state.research-=researchCost;

    state.technologyLevels[id]=
        level+1;

    state.technology+=
        tech.tech;

    state.industry+=
        tech.industry;

    state.military+=
        tech.military;

    state.missileDefense+=
        tech.defense;

    if(id==="cyber")
    {
        state.cyberDefense+=8;
    }

    if(id==="logistics")
    {
        state.logistics+=7;
    }

    if(id==="energy")
    {
        state.energy+=12;
    }

    if(id==="industry")
    {
        state.unemployment=
            Math.max(
                0,
                state.unemployment-.35
            );
    }

    state.statistics
        .technologiesResearched++;

    addNews(
        "🧠 پیشرفت فناوری",
        `${tech.name} به سطح ${level+1} رسید.`,
        "science"
    );

    normalizeState();

    saveGame();

    renderAll();

    openTechnology();

    toast(
        "🔬 پژوهش تکمیل شد",
        "good"
    );
}

/* =========================================================
   CREATE CRISIS
========================================================= */

function createCrisis()
{
    if(state.crises.length>=3)
    {
        return;
    }

    const template=
        CRISIS_TYPES[
            Math.floor(
                Math.random()*
                CRISIS_TYPES.length
            )
        ];

    state.crises.push(
        {
            id:
                "CR-"+
                Date.now()+
                "-"+
                Math.floor(
                    Math.random()*9999
                ),

            type:
                template.id,

            title:
                template.title,

            severity:
                template.severity,

            days:
                12+
                Math.floor(
                    Math.random()*10
                )
        }
    );

    if(template.id==="economic")
    {
        state.money=
            Math.max(
                0,
                state.money-900
            );

        state.inflation+=.7;
    }

    if(template.id==="energy")
    {
        state.energy=
            Math.max(
                0,
                state.energy-18
            );
    }

    if(template.id==="social")
    {
        state.approval-=5;
        state.stability-=3;
    }

    if(template.id==="food")
    {
        state.food=
            Math.max(
                0,
                state.food-22
            );
    }

    if(template.id==="political")
    {
        state.stability-=4;
        state.politicalCapital-=5;
    }

    addNews(
        template.title,
        "یک بحران ملی نیازمند تصمیم فوری دولت است.",
        "crisis"
    );

    toast(
        template.title,
        "warn"
    );
}
