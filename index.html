<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06141d">
<title>Global Dominion 2026</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:#06141d;
    color:#eef8fb
}

button,
input,
select{
    font-family:inherit
}

button{
    color:inherit
}

:root{
    --bg:#06141d;
    --panel:#0a1d29;
    --panel2:#0d2533;
    --border:rgba(255,255,255,.09);
    --green:#39d7a1;
    --blue:#55b9ed;
    --red:#ff6679;
    --yellow:#f4c85d;
    --purple:#a484f5;
    --muted:#8ba5b1
}

.hidden{
    display:none!important
}

.screen{
    position:absolute;
    inset:0
}

#loadingScreen{
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:16px;
    background:
        radial-gradient(circle at 50% 30%,#12364c,#06141d 55%,#030b10);
}

.loader{
    width:50px;
    height:50px;
    border:4px solid rgba(255,255,255,.12);
    border-top-color:#48deb0;
    border-radius:50%;
    animation:spin .8s linear infinite
}

@keyframes spin{
    to{
        transform:rotate(360deg)
    }
}

#loadingText{
    font-size:13px;
    color:#b7d1da
}

#startScreen{
    z-index:400;
    display:flex;
    flex-direction:column;
    background:
        linear-gradient(rgba(2,12,18,.78),rgba(2,12,18,.9)),
        radial-gradient(circle at 20% 20%,#15384c,#06141d 60%);
}

.start-header{
    flex:0 0 auto;
    padding:15px;
    border-bottom:1px solid var(--border);
    background:rgba(4,19,28,.92);
    backdrop-filter:blur(12px)
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:.3px
}

.logo span{
    color:var(--green)
}

.subtitle{
    margin-top:5px;
    font-size:10px;
    color:var(--muted);
    line-height:1.8
}

.start-controls{
    display:grid;
    grid-template-columns:1fr 150px;
    gap:8px;
    margin-top:11px
}

.search{
    width:100%;
    height:42px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
    background:#0a202c;
    color:#fff
}

.select{
    width:100%;
    height:42px;
    padding:0 8px;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
    background:#0a202c;
    color:#fff
}

.country-count{
    margin-top:9px;
    font-size:9px;
    color:#8ca6b2
}

#countryList{
    flex:1;
    overflow:auto;
    padding:10px;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    align-content:start;
    gap:8px;
    overscroll-behavior:contain
}

.country-card{
    position:relative;
    overflow:hidden;
    min-height:145px;
    padding:9px;
    border:1px solid var(--border);
    border-radius:14px;
    background:
        linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    cursor:pointer;
    transition:.14s ease;
    text-align:right
}

.country-card:hover{
    transform:translateY(-2px);
    border-color:rgba(64,219,171,.55)
}

.country-card.selected{
    border-color:var(--green);
    box-shadow:0 0 0 1px rgba(57,215,161,.18) inset;
    background:
        linear-gradient(145deg,rgba(46,185,140,.16),rgba(255,255,255,.02))
}

.country-flag{
    width:45px;
    height:30px;
    border-radius:5px;
    object-fit:cover;
    border:1px solid rgba(255,255,255,.13);
    background:#152c36
}

.country-name{
    margin-top:7px;
    font-size:11px;
    font-weight:800
}

.country-en{
    margin-top:3px;
    font-size:7px;
    color:#829aa5;
    direction:ltr;
    text-align:right
}

.country-info{
    margin-top:7px;
    font-size:7px;
    color:#a9bdc5;
    line-height:1.9
}

.country-start-btn{
    position:absolute;
    left:7px;
    bottom:7px;
    right:7px;
    height:30px;
    border:0;
    border-radius:8px;
    background:#238e6d;
    font-weight:700;
    cursor:pointer
}

.country-start-btn:hover{
    background:#2da67f
}

#gameScreen{
    z-index:100;
    display:flex;
    flex-direction:column;
    background:#06141d
}

#hud{
    position:relative;
    z-index:80;
    flex:0 0 auto;
    min-height:66px;
    padding:7px 9px;
    display:flex;
    align-items:center;
    gap:7px;
    overflow-x:auto;
    border-bottom:1px solid var(--border);
    background:rgba(5,20,29,.96);
    backdrop-filter:blur(10px);
    scrollbar-width:none
}

#hud::-webkit-scrollbar{
    display:none
}

.player-box{
    flex:0 0 auto;
    min-width:150px;
    height:50px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border:1px solid var(--border);
    border-radius:11px;
    background:rgba(255,255,255,.035)
}

#playerFlag{
    width:43px;
    height:29px;
    object-fit:cover;
    border-radius:5px
}

#playerName{
    font-size:9px;
    font-weight:800
}

#playerCapital{
    margin-top:3px;
    font-size:7px;
    color:#89a1ad
}

.hud-stat{
    flex:0 0 auto;
    min-width:86px;
    height:50px;
    padding:6px 8px;
    border:1px solid var(--border);
    border-radius:11px;
    background:rgba(255,255,255,.03)
}

.hud-stat small{
    display:block;
    font-size:7px;
    color:#87a0ab
}

.hud-stat b{
    display:block;
    margin-top:5px;
    font-size:9px
}

#mapViewport{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,#12374b,#082433 53%,#051923);
    touch-action:none
}

#worldSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block
}

#ocean{
    fill:#082230
}

.country-shape{
    cursor:pointer;
    stroke:#d9e7eb;
    stroke-width:.52;
    stroke-opacity:.8;
    vector-effect:non-scaling-stroke;
    shape-rendering:geometricPrecision;
    transition:filter .1s,stroke .1s,stroke-width .1s
}

.country-shape:hover{
    stroke:#fff;
    stroke-width:1.1;
    filter:brightness(1.12)
}

.country-shape.player{
    stroke:#fff;
    stroke-width:1.8;
    filter:brightness(1.09)
}

.country-shape.selected{
    stroke:#ffe177;
    stroke-width:2.1;
    filter:brightness(1.15)
}

.country-shape.enemy{
    stroke:#ff5f74;
    stroke-width:1.8
}

#mapStatus{
    position:absolute;
    z-index:20;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    padding:6px 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:rgba(4,20,29,.9);
    color:#c4d6dd;
    font-size:8px;
    pointer-events:none
}

#countryPopup{
    position:absolute;
    z-index:60;
    min-width:210px;
    max-width:280px;
    padding:10px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:13px;
    background:rgba(4,20,29,.96);
    box-shadow:0 12px 40px rgba(0,0,0,.42);
    backdrop-filter:blur(12px)
}

.popup-head{
    display:flex;
    align-items:center;
    gap:8px
}

.popup-head img{
    width:42px;
    height:28px;
    border-radius:5px;
    object-fit:cover
}

.popup-name{
    font-size:10px;
    font-weight:900
}

.popup-sub{
    font-size:7px;
    color:#91a9b4;
    margin-top:3px
}

.popup-kpis{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:5px;
    margin-top:8px
}

.popup-kpi{
    padding:6px;
    border:1px solid var(--border);
    border-radius:8px;
    background:rgba(255,255,255,.035)
}

.popup-kpi small{
    display:block;
    font-size:6px;
    color:#879da7
}

.popup-kpi b{
    display:block;
    margin-top:4px;
    font-size:8px
}

.row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px
}

.btn{
    min-height:34px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#193240;
    color:#fff;
    cursor:pointer;
    font-size:8px
}

.btn.blue{
    background:#18698e
}

.btn.green{
    background:#1f8a69
}

.btn.red{
    background:#91384a
}

.btn.yellow{
    background:#8a6c22
}

.btn.purple{
    background:#67509a
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed
}

#bottomDock{
    position:relative;
    z-index:90;
    flex:0 0 auto;
    height:78px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:8px;
    border-top:1px solid var(--border);
    background:rgba(4,18,27,.98)
}

.main-dock-button{
    position:relative;
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    cursor:pointer;
    color:#fff;
    overflow:hidden;
    font-size:11px;
    font-weight:900
}

.main-dock-button span{
    display:block;
    font-size:20px;
    margin-bottom:2px
}

#shopButton{
    background:
        linear-gradient(135deg,#17664f,#143b35)
}

#newsButton{
    background:
        linear-gradient(135deg,#185d82,#17354a)
}

.news-badge{
    position:absolute;
    left:9px;
    top:7px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:999px;
    background:#ff5f74;
    color:#fff;
    font-size:7px
}

#modalBackdrop{
    position:absolute;
    inset:0;
    z-index:300;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px;
    background:rgba(0,0,0,.66);
    backdrop-filter:blur(5px)
}

.modal{
    width:min(980px,100%);
    max-height:94%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.12);
    border-radius:17px;
    background:#071a25;
    box-shadow:0 20px 70px rgba(0,0,0,.55)
}

.modal-header{
    flex:0 0 auto;
    min-height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:9px 11px;
    border-bottom:1px solid var(--border);
    background:#0a2230
}

#modalTitle{
    font-size:12px;
    font-weight:900
}

.close-btn{
    width:36px;
    height:36px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#243945;
    color:#fff;
    cursor:pointer
}

#modalBody{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:10px
}

.tabs{
    display:flex;
    gap:5px;
    overflow-x:auto;
    margin-bottom:10px;
    scrollbar-width:none
}

.tabs::-webkit-scrollbar{
    display:none
}

.tab{
    flex:0 0 auto;
    height:35px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#122b38;
    color:#b8cbd3;
    cursor:pointer;
    font-size:8px
}

.tab.active{
    color:#fff;
    background:#1c765d;
    border-color:#36bd92
}

.section-title{
    margin:12px 0 7px;
    font-size:10px;
    font-weight:900
}

.notice{
    padding:8px;
    margin-bottom:8px;
    border:1px solid var(--border);
    border-radius:10px;
    background:rgba(255,255,255,.035);
    color:#aac0c9;
    font-size:8px;
    line-height:1.8
}

.notice.good{
    border-color:rgba(63,219,169,.25);
    background:rgba(43,170,129,.09)
}

.notice.warn{
    border-color:rgba(244,200,93,.28);
    background:rgba(170,126,30,.08)
}

.notice.bad{
    border-color:rgba(255,102,121,.25);
    background:rgba(175,49,68,.08)
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px
}

.card{
    padding:9px;
    border:1px solid var(--border);
    border-radius:12px;
    background:rgba(255,255,255,.032)
}

.card-head{
    display:flex;
    align-items:center;
    gap:8px
}

.icon-box{
    flex:0 0 auto;
    width:37px;
    height:37px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--border);
    border-radius:9px;
    background:#102a37;
    font-size:18px
}

.card-title{
    font-size:9px;
    font-weight:900
}

.card-sub{
    margin-top:3px;
    color:#849da8;
    font-size:7px;
    line-height:1.7
}

.card-desc{
    margin-top:7px;
    color:#afc2ca;
    font-size:7px;
    line-height:1.9
}

.kpis{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:6px;
    margin-bottom:9px
}

.kpi{
    min-height:55px;
    padding:7px;
    border:1px solid var(--border);
    border-radius:10px;
    background:rgba(255,255,255,.033)
}

.kpi small{
    display:block;
    color:#839ba5;
    font-size:7px
}

.kpi b{
    display:block;
    margin-top:5px;
    font-size:9px
}

.shop-home{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px
}

.shop-big{
    min-height:190px;
    border:1px solid var(--border);
    border-radius:16px;
    color:#fff;
    cursor:pointer
}

.shop-big span{
    display:block;
    font-size:42px;
    margin-bottom:10px
}

.shop-big b{
    display:block;
    font-size:15px
}

.shop-big small{
    display:block;
    margin:7px auto 0;
    max-width:250px;
    color:#b9ccd4;
    font-size:8px;
    line-height:1.8
}

.shop-military{
    background:
        linear-gradient(145deg,#512b38,#201925)
}

.shop-infra{
    background:
        linear-gradient(145deg,#225c4b,#122824)
}

.effect-list{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-top:8px
}

.effect{
    padding:5px 7px;
    border:1px solid rgba(255,255,255,.055);
    border-radius:7px;
    background:rgba(255,255,255,.025);
    color:#9fb6c0;
    font-size:7px;
    line-height:1.6
}

.effect b{
    color:#52dca8
}

.news-item{
    position:relative;
    overflow:hidden;
    margin-bottom:7px;
    padding:9px;
    border:1px solid var(--border);
    border-radius:11px;
    background:rgba(255,255,255,.03)
}

.news-item:before{
    content:"";
    position:absolute;
    right:0;
    top:0;
    bottom:0;
    width:3px;
    background:#62b8e5
}

.news-item.war:before{
    background:#ff5d72
}

.news-item.trade:before{
    background:#46d9a5
}

.news-item.economy:before{
    background:#efc15a
}

.news-item.diplomacy:before{
    background:#9b7cf0
}

.news-item.military:before{
    background:#e46b7d
}

.news-item.crisis:before{
    background:#ff9057
}

.news-head{
    display:flex;
    align-items:center;
    gap:7px
}

.news-head img{
    width:34px;
    height:23px;
    border-radius:4px;
    object-fit:cover
}

.news-title{
    font-size:9px;
    font-weight:900
}

.news-meta{
    margin-top:2px;
    font-size:6px;
    color:#829aa4
}

.news-text{
    margin-top:7px;
    font-size:8px;
    color:#afc2ca;
    line-height:1.9
}

.proposal-actions{
    display:flex;
    gap:6px;
    margin-top:8px
}

.progress{
    height:7px;
    margin-top:8px;
    overflow:hidden;
    border-radius:999px;
    background:#0c1b22
}

.progress div{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,#2ba47e,#4be0ad)
}

#missileFx{
    position:absolute;
    inset:0;
    z-index:150;
    overflow:hidden;
    pointer-events:none
}

.missile{
    position:absolute;
    width:20px;
    height:5px;
    margin-left:-10px;
    margin-top:-2px;
    border-radius:999px;
    transform-origin:center;
    background:
        linear-gradient(
            90deg,
            #fff,
            #ffe27a 28%,
            #ff8c45 58%,
            rgba(255,86,45,0)
        );
    filter:
        drop-shadow(0 0 4px #fff)
        drop-shadow(0 0 8px #ff8c4c)
}

.interceptor{
    position:absolute;
    width:16px;
    height:4px;
    margin-left:-8px;
    margin-top:-2px;
    border-radius:999px;
    background:
        linear-gradient(
            90deg,
            #fff,
            #6bddff 45%,
            rgba(70,180,255,0)
        );
    filter:drop-shadow(0 0 7px #62d4ff)
}

.explosion{
    position:absolute;
    width:22px;
    height:22px;
    margin-left:-11px;
    margin-top:-11px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            #fff 0 8%,
            #fff172 9% 22%,
            #ffa043 23% 43%,
            #ff6542 44% 58%,
            rgba(255,80,40,0) 73%
        );
    box-shadow:
        0 0 16px rgba(255,230,100,.8),
        0 0 38px rgba(255,85,45,.5);
    animation:boom .9s ease-out forwards
}

.intercept-ring{
    position:absolute;
    width:18px;
    height:18px;
    margin-left:-9px;
    margin-top:-9px;
    border:2px solid #85e7ff;
    border-radius:50%;
    box-shadow:0 0 12px #66d9ff;
    animation:ring .9s ease-out forwards
}

.fx-label{
    position:absolute;
    min-width:120px;
    transform:translate(-50%,-50%);
    padding:6px 9px;
    border:1px solid rgba(255,255,255,.17);
    border-radius:9px;
    background:rgba(2,16,24,.95);
    color:#fff;
    text-align:center;
    font-size:8px;
    animation:fxlabel 2.3s ease forwards
}

@keyframes boom{
    from{
        opacity:1;
        transform:scale(.2)
    }
    to{
        opacity:0;
        transform:scale(4.5)
    }
}

@keyframes ring{
    from{
        opacity:1;
        transform:scale(.2)
    }
    to{
        opacity:0;
        transform:scale(4)
    }
}

@keyframes fxlabel{
    0%{
        opacity:0;
        transform:translate(-50%,-30%)
    }
    15%,75%{
        opacity:1
    }
    100%{
        opacity:0;
        transform:translate(-50%,-85%)
    }
}

@media(max-width:900px){
    #countryList{
        grid-template-columns:repeat(3,minmax(0,1fr))
    }

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr))
    }

    .kpis{
        grid-template-columns:repeat(2,minmax(0,1fr))
    }
}

@media(max-width:600px){
    .start-controls{
        grid-template-columns:1fr
    }

    #countryList{
        grid-template-columns:repeat(2,minmax(0,1fr))
    }

    .country-card{
        min-height:157px
    }

    .grid{
        grid-template-columns:1fr
    }

    .shop-home{
        grid-template-columns:1fr
    }

    .shop-big{
        min-height:145px
    }

    #hud{
        min-height:63px
    }

    .hud-stat{
        min-width:78px
    }

    #bottomDock{
        height:74px
    }
}
</style>
</head>

<body>

<div id="loadingScreen" class="screen">
    <div class="loader"></div>
    <div id="loadingText">در حال آماده‌سازی اطلاعات کشورها...</div>
</div>

<div id="startScreen" class="screen hidden">
    <div class="start-header">
        <div class="logo">GLOBAL <span>DOMINION</span> 2026</div>
        <div class="subtitle">
            یک کشور را انتخاب کن و وارد شبیه‌ساز اقتصاد، زیرساخت، تجهیزات، دیپلماسی و جنگ جهانی شو.
        </div>

        <div class="start-controls">
            <input
                id="countrySearch"

const $ =
id =>
    document.getElementById(id);

function svgEl(tag){
    return document.createElementNS(
        NS,
        tag
    );
}

function num(
    value,
    fallback = 0
){
    const v =
        Number(value);

    return Number.isFinite(v)
        ? v
        : fallback;
}

function clamp(
    value,
    min,
    max
){
    return Math.max(
        min,
        Math.min(
            max,
            num(value,min)
        )
    );
}

function random(
    min,
    max
){
    return min +
        Math.random() *
        (
            max-min
        );
}

function randomInt(
    min,
    max
){
    return Math.floor(
        random(
            min,
            max+1
        )
    );
}

function chance(percent){
    return Math.random()*100 <
        clamp(
            percent,
            0,
            100
        );
}

function pick(array){
    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}

function safe(text){
    return String(
        text ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    );
}

function fmt(
    value,
    digits = 0
){
    const v =
        num(value);

    if(
        Math.abs(v) >=
        1e12
    ){
        return(
            (
                v/1e12
            )
            .toFixed(digits)+
            "T"
        );
    }

    if(
        Math.abs(v) >=
        1e9
    ){
        return(
            (
                v/1e9
            )
            .toFixed(digits)+
            "B"
        );
    }

    if(
        Math.abs(v) >=
        1e6
    ){
        return(
            (
                v/1e6
            )
            .toFixed(digits)+
            "M"
        );
    }

    if(
        Math.abs(v) >=
        1e3
    ){
        return(
            (
                v/1e3
            )
            .toFixed(digits)+
            "K"
        );
    }

    return v.toFixed(digits);
}

function money(value){
    return "$"+
        Math.round(
            num(value)
        )
        .toLocaleString();
}

function hashString(text){
    let hash =
        2166136261;

    text =
        String(text);

    for(
        let i=0;
        i<text.length;
        i++
    ){
        hash ^=
            text.charCodeAt(i);

        hash =
            Math.imul(
                hash,
                16777619
            );
    }

    return hash >>> 0;
}

function fallbackToObjects(){
    return FALLBACK_COUNTRIES.map(
        row =>
        ({
            cca2:
                row[0],

            cca3:
                row[1],

            name:
            {
                common:
                    row[2]
            },

            nameFa:
                row[3],

            capital:
                [
                    row[4]
                ],

            region:
                row[5],

            subregion:
                "",

            population:
                row[6],

            area:
                row[7],

            flags:
            {
                svg:
                    `https://flagcdn.com/${row[0].toLowerCase()}.svg`,

                png:
                    `https://flagcdn.com/w160/${row[0].toLowerCase()}.png`
            },

            currencies:
                {},

            languages:
                {}
        })
    );
}

function normalizeCountry(raw){
    const code =
        raw.cca2 ||
        raw.iso_a2 ||
        "";

    return{
        id:
            code,

        cca2:
            code,

        cca3:
            raw.cca3 ||
            "",

        name:
            raw.name?.common ||
            raw.name ||
            code,

        nameFa:
            FA_NAMES[code] ||
            raw.translations?.fas?.common ||
            raw.name?.common ||
            code,

        capital:
            Array.isArray(raw.capital)
            ?
            (
                raw.capital[0] ||
                "—"
            )
            :
            (
                raw.capital ||
                "—"
            ),

        region:
            raw.region ||
            "Other",

        subregion:
            raw.subregion ||
            "",

        population:
            num(
                raw.population,
                0
            ),

        area:
            num(
                raw.area,
                0
            ),

        flag:
            raw.flags?.svg ||
            raw.flags?.png ||
            (
                code
                ?
                `https://flagcdn.com/${code.toLowerCase()}.svg`
                :
                ""
            ),

        currencies:
            raw.currencies
            ?
            Object.values(
                raw.currencies
            )
            .map(
                c =>
                    c.name
            )
            .join("، ")
            :
            "—",

        languages:
            raw.languages
            ?
            Object.values(
                raw.languages
            )
            .join("، ")
            :
            "—"
    };
}


/* =========================================================
   LOAD COUNTRIES
========================================================= */

async function loadCountries(){
    let data =
        null;

    try{
        $("loadingText").textContent =
            "در حال دریافت اطلاعات واقعی کشورها...";

        const response =
            await fetch(
                REST_COUNTRIES_URL,
                {
                    cache:
                        "force-cache"
                }
            );

        if(
            !response.ok
        ){
            throw new Error(
                "Countries request failed"
            );
        }

        data =
            await response.json();
    }
    catch(error){
        data =
            fallbackToObjects();
    }

    const countries =
        data
        .map(
            normalizeCountry
        )
        .filter(
            country =>
                country.id &&
                country.id.length ===
                2
        );

    const fallback =
        fallbackToObjects()
        .map(
            normalizeCountry
        );

    const map =
        new Map();

    fallback.forEach(
        c =>
            map.set(
                c.id,
                c
            )
    );

    countries.forEach(
        c =>
        {
            const existing =
                map.get(
                    c.id
                );

            map.set(
                c.id,
                {
                    ...existing,
                    ...c,
                    nameFa:
                        FA_NAMES[c.id] ||
                        c.nameFa ||
                        c.name
                }
            );
        }
    );

    state.countries =
        Array.from(
            map.values()
        )
        .sort(
            (
                a,
                b
            ) =>
                a.nameFa.localeCompare(
                    b.nameFa,
                    "fa"
                )
        );

    state.countryMap =
        {};

    state.countries.forEach(
        c =>
            state.countryMap[c.id] =
                c
    );

    initializeAI();

    renderCountryList();
}

            state.ai[
                country.id

                    71,

                technology:
                    30 +
                    (
                        seed>>
                        6
                    )%
                    71,

                stability:
                    40 +
                    (
                        seed>>
                        9
                    )%
                    56,

                aggression:
                    15 +

                        12
                    )%
                    76,

                    20 +
                    (
                        seed>>
                        15
                    )%
                    75,

                trade:

    state.started =
        true;

        id;

    const ai =
        state.ai[id];

    state.population =

            15000,
            Math.sqrt(

        );

window.buyEquipment =
function(
    id,
    amount
){
    const item =
        EQUIPMENT.find(
            equipment =>
                equipment.id ===
                id
        );

    if(
        !item
    ){
        return;
    }

    amount =
        Math.max(
            1,
            Math.round(
                amount
            )
        );

    if(
        state.technology <
        item.tech
    ){
        alert(
            `فناوری موردنیاز ${item.tech} است. فناوری فعلی شما ${Math.round(state.technology)} است.`
        );

        return;
    }

    const total =
        item.cost *
        amount;

    if(
        state.money <
        total
    ){
        alert(
            "بودجه کافی نیست."
        );

        return;
    }

    state.money -=
        total;

    state.inventory[
        id
    ] =
        (
            state.inventory[
                id
            ] ||
            0
        )+
        amount;

    state.militaryPower =
        clamp(
            state.militaryPower+
            item.power*
            amount*
            .02,
            1,
            250
        );

    addNews(
        state.playerId,
        "military",
        "خرید تجهیزات نظامی",
        `${amount} واحد ${item.name} به موجودی کشور اضافه شد.`,
        1
    );

    openMilitaryStore(
        equipmentCategory

};

window.startConstruction =
function(id){
    const building =
        BUILDINGS.find(
            item =>
                item.id ===
                id
        );

    if(
        !building
    ){
        return;
    }

    const level =
        state.buildings[
            id
        ]||
        0;

    if(
        level >=
        building.max
    ){
        return;
    }

    if(
        state.construction.some(
            project =>
                project.buildingId ===
                id
        )
    ){
        alert(
            "این پروژه در حال ساخت است."
        );

        return;
    }

    const cost =
        Math.round(
            building.cost*
            Math.pow(
                1.16,
                level
            )
        );

    if(
        state.money <
        cost
    ){
        alert(
            "بودجه کافی نیست."
        );

        return;
    }

    state.money -=
        cost;

    state.construction.push(
        {

window.respondProposal =
function(
    id,
    accept
){
    const proposal =
        state.proposals.find(
            item =>
                item.id ===
                id
        );

    if(
        !proposal ||
        proposal.status !==
        "pending"
    ){
        return;
    }

    proposal.status =
        accept
        ?
        "accepted"
        :
        "rejected";

    if(
        accept
    ){
        if(
            proposal.type ===
            "trade"
        ){
            state.money +=
                700;

            changeRelation(
                proposal.from,
                8
            );
        }

        if(
            proposal.type ===
            "alliance"
        ){
            changeRelation(
                proposal.from,
                15
            );
        }

        if(
            proposal.type ===
            "aid"
        ){
            state.money +=
                1200;

            changeRelation(
                proposal.from,
                6
            );
        }

        addNews(
            proposal.from,
            "diplomacy",
            "توافق جدید",
            `پیشنهاد ${state.countryMap[proposal.from].nameFa} پذیرفته شد.`,
            1
        );
    }
    else{
        changeRelation(
            proposal.from,
            -5
        );

        addNews(
            proposal.from,
            "diplomacy",
            "رد پیشنهاد",
            `پیشنهاد ${state.countryMap[proposal.from].nameFa} رد شد.`,
            1
        );
    }

    saveGame();

    updateHUD();

    openNews();
};

function activeWarAgainst(id){
    return state.wars.find(
        war =>
            war.status ===
            "war" &&
            (
                (
                    war.attacker ===
                    state.playerId &&
                    war.defender ===
                    id
                ) ||
                (
                    war.defender ===
                    state.playerId &&
                    war.attacker ===
                    id
                )
            )
    )||
    null;
}

window.declareWar =
function(id){

/* =========================================================
   EQUAL EARTH PROJECTION
========================================================= */

const EQ_A1 =
    1.340264;

const EQ_A2 =
    -0.081106;

const EQ_A3 =
    0.000893;

const EQ_A4 =
    0.003796;

const EQ_M =
    Math.sqrt(3)/
    2;

const DEG =
    Math.PI/
    180;

function equalEarthRaw(
    lon,
    lat
){
    const lambda =
        lon*
        DEG;

    const phi =
        clamp(
            lat,
            -89.999999,
            89.999999
        )*
        DEG;

    const theta =
        Math.asin(
            EQ_M*
            Math.sin(
                phi
            )
        );

    const theta2 =
        theta*
        theta;

    const theta6 =
        theta2*
        theta2*
        theta2;

    const x =
        2*
        Math.sqrt(3)*
        lambda*
        Math.cos(theta)/
        (
            3*
            (
                9*
                EQ_A4*
                theta6*
                theta2+
                7*
                EQ_A3*
                theta6+
                3*
                EQ_A2*
                theta2+
                EQ_A1
            )
        );

    const y =
        theta*
        (
            EQ_A4*
            theta6*
            theta2+
            EQ_A3*
            theta6+
            EQ_A2*
            theta2+
            EQ_A1
        );

    return[
        x,
        y
    ];
}

const EQ_X_MAX =
    Math.abs(
        equalEarthRaw(
            180,
            0
        )[0]
    );

const EQ_Y_MAX =
    Math.abs(
        equalEarthRaw(
            0,
            90
        )[1]
    );

function project(
    coordinate
){
    const lon =
        num(
            coordinate[0]
        );

    const lat =
        num(
            coordinate[1]
        );

    const raw =
        equalEarthRaw(
            lon,
            lat
        );

    return[
        800+
        raw[0]/
        EQ_X_MAX*
        770,

        400-
        raw[1]/
        EQ_Y_MAX*
        355
    ];
}


/* =========================================================
   SIMPLIFICATION
========================================================= */

function sqDist(
    a,
    b
){
    const dx =
        a[0]-
        b[0];

    const dy =
        a[1]-
        b[1];

    return dx*
        dx+
        dy*
        dy;
}

function segDistSq(
    p,
    a,
    b
){
    let x =
        a[0];

    let y =
        a[1];

    let dx =
        b[0]-
        x;

    let dy =
        b[1]-
        y;

    if(
        dx !==
        0 ||
        dy !==
        0
    ){
        const t =
            (
                (
                    p[0]-
                    x
                )*
                dx+
                (
                    p[1]-
                    y
                )*
                dy
            )/
            (
                dx*
                dx+
                dy*
                dy
            );

        if(
            t >
            1
        ){
            x =
                b[0];

            y =
                b[1];
        }
        else if(
            t >
            0
        ){
            x +=
                dx*
                t;

            y +=
                dy*
                t;
        }
    }

    dx =
        p[0]-
        x;

    dy =
        p[1]-
        y;

    return dx*
        dx+
        dy*
        dy;
}

function radialSimplify(
    points,
    toleranceSq
){
    if(
        points.length <=
        5
    ){
        return points;
    }

    let prev =
        points[0];

    const result =
    [
        prev
    ];

    for(
        let i=1;
        i<points.length;
        i++
    ){
        const point =
            points[i];

        if(
            sqDist(
                point,
                prev
            ) >
            toleranceSq
        ){
            result.push(
                point
            );

            prev =
                point;
        }
    }

    return result;
}

function dpStep(
    points,
    first,
    last,
    toleranceSq,
    result
){
    let maxSq =
        toleranceSq;

    let index =
        -1;

    for(
        let i=
            first+
            1;
        i<last;
        i++
    ){
        const sq =
            segDistSq(
                points[i],
                points[first],
                points[last]
            );

        if(
            sq >
            maxSq
        ){
            index =
                i;

            maxSq =
                sq;
        }
    }

    if(
        index >
        -1
    ){
        if(
            index-
            first >
            1
        ){
            dpStep(
                points,
                first,
                index,
                toleranceSq,
                result
            );
        }

        result.push(
            points[index]
        );

        if(
            last-
            index >
            1
        ){
            dpStep(
                points,
                index,
                last,
                toleranceSq,
                result
            );
        }
    }
}

function simplify(
    points,
    tolerance
){
    if(
        points.length <=
        5
    ){
        return points;
    }

    const sq =
        tolerance*
        tolerance;

    let pts =
        radialSimplify(
            points,
            sq*
            .5
        );

    if(
        pts.length <=
        5
    ){
        return pts;
    }

    const result =
    [
        pts[0]
    ];

    dpStep(
        pts,
        0,
        pts.length-
        1,
        sq,
        result
    );

    result.push(
        pts[
            pts.length-
            1
        ]
    );

    return result;
}


/* =========================================================
   GEOJSON PATH
========================================================= */

function ringSegments(
    ring
){
    const segments =
        [];

    let current =
        [];

    let previousLon =
        null;

    for(
        const coordinate of
        ring
    ){
        let lon =
            num(
                coordinate[0]
            );

        const lat =
            num(
                coordinate[1]
            );

        while(
            lon >
            180
        ){
            lon -=
                360;
        }

        while(
            lon <
            -180
        ){
            lon +=
                360;
        }

        if(
            previousLon !==
            null &&
            Math.abs(
                lon-
                previousLon
            ) >
            180
        ){
            if(
                current.length >=
                3
            ){
                segments.push(
                    current
                );
            }

            current =
                [];
        }

        current.push(
            [
                lon,
                lat
            ]
        );

        previousLon =
            lon;
    }

    if(
        current.length >=
        3
    ){
        segments.push(
            current
        );
    }

    return segments;
}

function ringPath(
    ring,
    tolerance
){
    let path =
        "";

    const segments =
        ringSegments(
            ring
        );

    for(
        const segment of
        segments
    ){
        let projected =
            segment.map(
                project
            );

        projected =
            simplify(
                projected,
                tolerance
            );

        if(
            projected.length <
            3
        ){
            continue;
        }

        path +=
            "M"+
            projected[0][0]
            .toFixed(2)+
            ","+
            projected[0][1]
            .toFixed(2);

        for(
            let i=1;
            i<projected.length;
            i++
        ){
            path +=
                "L"+
                projected[i][0]
                .toFixed(2)+
                ","+
                projected[i][1]
                .toFixed(2);
        }

        path +=
            "Z";
    }

    return path;
}

function geometryPath(
    geometry,
    tolerance
){
    if(
        !geometry
    ){
        return "";
    }

    let path =
        "";

    if(
        geometry.type ===
        "Polygon"
    ){
        for(
            const ring of
            geometry.coordinates
        ){
            path +=
                ringPath(
                    ring,
                    tolerance
                );
        }
    }

    if(
        geometry.type ===
        "MultiPolygon"
    ){
        for(
            const polygon of
            geometry.coordinates
        ){
            for(
                const ring of
                polygon
            ){
                path +=
                    ringPath(
                        ring,
                        tolerance
                    );
            }
        }
    }

    return path;
}

function geometryCenter(
    geometry
){
    let sx =
        0;

    let sy =
        0;

    let count =
        0;

    function sample(ring){
        const step =
            Math.max(
                1,
                Math.floor(
                    ring.length/
                    150
                )
            );

        for(
            let i=0;
            i<ring.length;
            i+=step
        ){
            const p =
                project(
                    ring[i]
                );

            sx +=
                p[0];

            sy +=
                p[1];

            count++;
        }
    }

    if(
        geometry.type ===
        "Polygon"
    ){
        sample(
            geometry.coordinates[0]
        );
    }

    if(
        geometry.type ===
        "MultiPolygon"
    ){
        geometry.coordinates
        .forEach(
            polygon =>
                sample(
                    polygon[0]
                )
        );
    }

    if(
        !count
    ){
        return[
            800,
            400
        ];
    }

    return[
        sx/count,
        sy/count
    ];
}

async function loadMap(){
    $("mapStatus").textContent =
        "در حال دریافت نقشه 10m...";

    let geo =
        null;

    let lastError =
        null;

    for(
        const url of
        MAP_URLS
    ){
        try{
            const response =
                await fetch(
                    url,
                    {
                        cache:
                            "force-cache"
                    }
                );

            if(
                !response.ok
            ){
                throw new Error(
                    "Map request failed"
                );
            }

            const data =
                await response.json();

            if(
                !data ||
                !Array.isArray(
                    data.features
                )
            ){
                throw new Error(
                    "Invalid GeoJSON"
                );
            }

            geo =
                data;

            break;
        }
        catch(error){
            lastError =
                error;
        }
    }

    if(
        !geo
    ){
        $("mapStatus").textContent =
            "نقشه آنلاین در دسترس نیست";

        console.error(
            lastError
        );

        return;
    }

    renderMap(
        geo
    );
}


/* =========================================================
   MAP RENDER
========================================================= */

function renderMap(geo){
    const layer =
        $("countryLayer");

    layer.innerHTML =
        "";

    mapFeatureByCode.clear();

    Object.keys(
        mapCenters
    )
    .forEach(
        key =>
            delete mapCenters[key]
    );

    const tolerance =
        window.innerWidth <=
        700
        ?
        .72
        :
        .50;

    let index =
        0;

    function chunk(){
        const start =
            performance.now();

        while(
            index <
            geo.features.length
        ){
            const feature =
                geo.features[
                    index++
                ];

            if(
                !feature.geometry
            ){
                continue;
            }

            const code =
                featureCode(
                    feature
                );

            if(
                !code
            ){
                continue;
            }

            const d =
                geometryPath(
                    feature.geometry,
                    tolerance
                );

            if(
                !d
            ){
                continue;
            }

            const path =
                svgEl(
                    "path"
                );

            path.setAttribute(
                "d",
                d
            );

            path.setAttribute(
                "class",
                "country-shape"
            );

            path.setAttribute(
                "fill-rule",
                "evenodd"
            );

            path.dataset.code =
                code;

            path.addEventListener(
                "click",
                event =>
                {
                    event.stopPropagation();

                    openCountryPopup(
                        code,
                        event.clientX,
                        event.clientY
                    );
                }
            );

            layer.appendChild(
                path
            );

            if(
                !mapFeatureByCode.has(
                    code
                )
            ){
                mapFeatureByCode.set(
                    code,
                    []
                );
            }

            mapFeatureByCode.get(
                code
            )
            .push(
                path
            );

            if(
                !mapCenters[
                    code
                ]
            ){
                mapCenters[
                    code
                ] =
                    geometryCenter(
                        feature.geometry
                    );
            }

            if(
                performance.now()-
                start >
                13
            ){
                requestAnimationFrame(
                    chunk
                );

                return;
            }
        }

        $("mapStatus").textContent =
            "نقشه آماده است";

        setTimeout(
            () =>
            {
                $("mapStatus")
                .classList.add(
                    "hidden"
                );
            },
            1000
        );

        renderMapStyles();
    }

    requestAnimationFrame(
        chunk
    );
}

function applyMapTransform(){
    $("camera")
    .setAttribute(
        "transform",
        `translate(${state.map.x} ${state.map.y}) scale(${state.map.zoom})`
    );
}

function focusCountry(id){
    const center =
        mapCenters[
            id
        ];

    if(
        !center
    ){
        return;
    }

    const targetZoom =
        1.8;

    state.map.zoom =
        targetZoom;

    state.map.x =
        800-
        center[0]*
        targetZoom;

    state.map.y =
        400-
        center[1]*
        targetZoom;

    applyMapTransform();

let dragging =
    false;

let lastPointer =
    null;

$("worldSvg")
.addEventListener(
    "pointerdown",
    event =>
    {
        dragging =
            true;

        lastPointer =
            {
                x:
                    event.clientX,

                y:
                    event.clientY
            };

        try{
            $("worldSvg")
            .setPointerCapture(
                event.pointerId
            );
        }
        catch(error){}
    }
);

$("worldSvg")
.addEventListener(
    "pointermove",
    event =>
    {
        if(
            !dragging ||
            !lastPointer
        ){
            return;
        }

        const rect =
            $("worldSvg")
            .getBoundingClientRect();

        const dx =
            (
                event.clientX-
                lastPointer.x
            )*
            1600/
            rect.width;

        const dy =
            (
                event.clientY-
                lastPointer.y
            )*
            800/
            rect.height;

        state.map.x +=
            dx;

        state.map.y +=
            dy;

        lastPointer =
        {
            x:
                event.clientX,

            y:
                event.clientY
        };

        applyMapTransform();
    }
);

function stopDrag(){
    dragging =
        false;

    lastPointer =
        null;
}

$("worldSvg")
.addEventListener(
    "pointerup",
    stopDrag
);

$("worldSvg")
.addEventListener(
    "pointercancel",
    stopDrag
);

$("worldSvg")
.addEventListener(
    "wheel",
    event =>
    {
        event.preventDefault();

        const old =
            state.map.zoom;

        const next =
            clamp(
                old*
                (
                    event.deltaY <
                    0
                    ?
                    1.13
                    :
                    .88
                ),
                .7,
                6
            );

        state.map.zoom =
            next;

        applyMapTransform();
    },
    {
        passive:
            false
    }
);

$("mapViewport")
.addEventListener(
    "click",
    event =>
    {
        if(
            event.target ===
            $("mapViewport") ||
            event.target ===
            $("worldSvg") ||
            event.target ===
            $("ocean")
        ){
            closeCountryPopup();
        }
    }
);

/* =========================================================
   DAILY ECONOMY
========================================================= */

function processEconomy(){
    const farm =
        state.buildings.farm||
        0;

    const agro =
        state.buildings.agroFactory||
        0;

    const thermal =
        state.buildings.thermalPower||
        0;

    const solar =
        state.buildings.solarPower||
        0;

    const nuclear =
        state.buildings.nuclearPower||
        0;

    const oil =
        state.buildings.oilField||
        0;

    const steel =
        state.buildings.steelMill||
        0;

    const aluminum =
        state.buildings.aluminumPlant||
        0;

    const electronics =
        state.buildings.electronics||
        0;

    const foodProduction =
        farm*
        1.1+
        agro*
        .7+
        state.industry*
        .02;

    const foodConsumption =
        Math.max(
            .5,
            state.population/
            100000000*
            2.2
        );

    state.resources.food =
        Math.max(
            0,
            state.resources.food+
            foodProduction-
            foodConsumption
        );

    state.resources.energy =
        Math.max(
            0,
            state.resources.energy+
            thermal*
            1.3+
            solar*
            1.1+
            nuclear*
            3.8-
            state.industry*
            .018
        );

    state.resources.oil =
        Math.max(
            0,
            state.resources.oil+
            oil*
            .8-
            state.militaryPower*
            .003
        );

    state.resources.steel +=
        steel*
        .7;

    state.resources.aluminum +=
        aluminum*
        .6;

    state.resources.electronics +=
        electronics*
        .55;

    const revenue =
        state.gdp/
        100000000*
        25+
        state.industry*
        .8;

    const expenses =
        state.population/
        100000000*
        5+
        state.militaryPower*
        .15+
        state.construction.length*
        .8;

    state.money +=
        revenue-
        expenses;

    if(
        state.resources.food <
        15
    ){
        state.inflation +=
            .08;

        state.approval -=
            .10;
    }
    else{
        state.inflation -=
            .01;
    }

    if(
        state.resources.energy <
        15
    ){
        state.inflation +=
            .06;

        state.industry -=
            .03;
    }

    state.inflation =
        clamp(
            state.inflation,
            .5,
            80
        );

    state.approval =
        clamp(
            state.approval,
            0,
            100
        );

    state.industry =
        clamp(
            state.industry,
            1,
            200
        );

    state.gdp *=
        1+
        (
            state.industry-
            50
        )*
        .0000015;
}

function processConstruction(){
    state.construction.forEach(
        project =>
        {
            project.daysLeft -=
                1;
        }
    );

    const completed =
        state.construction.filter(
            project =>
                project.daysLeft <=
                0
        );

    completed.forEach(
        project =>
        {
            const building =
                BUILDINGS.find(
                    item =>
                        item.id ===
                        project.buildingId
                );

            if(
                !building
            ){
                return;
            }

            state.buildings[
                building.id
            ] =
                project.targetLevel;

            applyBuilding(
                building
            );

            addNews(
                state.playerId,
                "economy",
                "پروژه تکمیل شد",
                `${building.name} به سطح ${project.targetLevel} رسید.`,
                1
            );
        }
    );

    state.construction =
        state.construction.filter(
            project =>
                project.daysLeft >
                0
        );
}

                1;

            state.date.year++;
        }
    }
}


/* =========================================================
   DAILY GAME LOOP
========================================================= */

function nextDay(){
    if(
        !state.started
    ){
        return;
    }

    advanceDay();

    processConstruction();

    processEconomy();

    if(
        state.date.day%
        2 ===
        0
    ){
        generateWorldNews();
    }

    if(
        state.date.day ===
        1
    ){
        state.ai[
            state.playerId
        ].economy =
            state.industry;

        state.ai[
            state.playerId
        ].military =
            state.militaryPower;

        state.ai[
            state.playerId
        ].technology =
            state.technology;
    }

    updateHUD();

    saveGame();
}

setInterval(
    () =>
    {
        if(
            state.started
        ){
            nextDay();
        }
    },
    3500
);

/* =========================================================
   MISSILE DEFENSE
========================================================= */

function calculateTargetDefense(id){
    const ai =
        state.ai[
            id
        ]||
        {};

    return clamp(
        ai.technology*
        .35+
        ai.military*
        .30+
        ai.stability*
        .10,
        8,
        95
    );
}


/* =========================================================
   SVG MAP -> SCREEN
========================================================= */

function mapPointToScreen(
    point
){
    const svg =
        $("worldSvg");

    const camera =
        $("camera");

    const viewport =
        $("mapViewport");

    const matrix =
        camera.getScreenCTM();

    if(
        !matrix
    ){
        return{
            x:
                0,

            y:
                0
        };
    }

    const svgPoint =
        svg.createSVGPoint();

    svgPoint.x =
        point[0];

    svgPoint.y =
        point[1];

    const transformed =
        svgPoint.matrixTransform(
            matrix
        );

    const rect =
        viewport.getBoundingClientRect();

    return{
        x:
            transformed.x-
            rect.left,

        y:
            transformed.y-
            rect.top
    };
}


/* =========================================================
   PROJECTILE ANIMATION
========================================================= */

function animateProjectile(
    element,
    from,
    to,
    duration,
    arcHeight
){
    return new Promise(
        resolve =>
        {
            const start =
                performance.now();

            const dx =
                to.x-
                from.x;

            const dy =
                to.y-
                from.y;

            function frame(
                now
            ){
                const p =
                    clamp(
                        (
                            now-
                            start
                        )/
                        duration,
                        0,
                        1
                    );

                const eased =
                    p <
                    .5
                    ?
                    2*
                    p*
                    p
                    :
                    1-
                    Math.pow(
                        -2*
                        p+
                        2,
                        2
                    )/
                    2;

                const arc =
                    Math.sin(
                        Math.PI*
                        p
                    )*
                    arcHeight;

                const x =
                    from.x+
                    dx*
                    eased;

                const y =
                    from.y+
                    dy*
                    eased-
                    arc;

                const tangentY =
                    dy-
                    Math.cos(
                        Math.PI*
                        p
                    )*
                    Math.PI*
                    arcHeight;

                const angle =
                    Math.atan2(
                        tangentY,
                        dx
                    )*
                    180/
                    Math.PI;

                element.style.left =
                    x+
                    "px";

                element.style.top =
                    y+
                    "px";

                element.style.transform =
                    `rotate(${angle}deg)`;

                if(
                    p <
                    1
                ){
                    requestAnimationFrame(
                        frame
                    );
                }
                else{
                    resolve();
                }
            }

            requestAnimationFrame(
                frame
            );
        }
    );
}


/* =========================================================
   MISSILE FX
========================================================= */

function createExplosion(
    point,
    label,
    intercepted
){
    const layer =
        $("missileFx");

    const explosion =
        document.createElement(
            "div"
        );

    explosion.className =
        "explosion";

    explosion.style.left =
        point.x+
        "px";

    explosion.style.top =
        point.y+
        "px";

    layer.appendChild(
        explosion
    );

    if(
        intercepted
    ){
        const ring =
            document.createElement(
                "div"
            );

        ring.className =
            "intercept-ring";

        ring.style.left =
            point.x+
            "px";

        ring.style.top =
            point.y+
            "px";

        layer.appendChild(
            ring
        );

        setTimeout(
            () =>
                ring.remove(),
            1000
        );
    }

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "fx-label";

    text.style.left =
        point.x+
        "px";

    text.style.top =
        (
            point.y-
            30
        )+
        "px";

    text.textContent =
        label;

    layer.appendChild(
        text
    );

    setTimeout(
        () =>
        {
            explosion.remove();

            text.remove();
        },
        2400
    );
}

async function playMissileAnimation(
    targetId,
    intercepted
){
    const sourceCenter =
        mapCenters[
            state.playerId
        ]||
        [
            800,
            400
        ];

    const targetCenter =
        mapCenters[
            targetId
        ]||
        [
            800,
            400
        ];

    const source =
        mapPointToScreen(
            sourceCenter
        );

    const target =
        mapPointToScreen(
            targetCenter
        );

    const layer =
        $("missileFx");

    const distance =
        Math.hypot(
            target.x-
            source.x,
            target.y-
            source.y
        );

    const arc =
        Math.min(
            130,
            Math.max(
                35,
                distance*
                .16
            )
        );

    const missile =
        document.createElement(
            "div"
        );

    missile.className =
        "missile";

    layer.appendChild(
        missile
    );

    if(
        !intercepted
    ){
        await animateProjectile(
            missile,
            source,
            target,
            1700,
            arc
        );

        missile.remove();

        createExplosion(
            target,
            "💥 موشک به هدف اصابت کرد",
            false
        );

        return;
    }

    const interceptProgress =
        random(
            .70,
            .82
        );

    const interceptPoint =
    {
        x:
            source.x+
            (
                target.x-
                source.x
            )*
            interceptProgress,

        y:
            source.y+
            (
                target.y-
                source.y
            )*
            interceptProgress-
            Math.sin(
                Math.PI*
                interceptProgress
            )*
            arc
    };

    const defenseStart =
    {
        x:
            target.x+
            random(
                -35,
                35
            ),

        y:
            target.y+
            random(
                25,
                55
            )
    };

    const interceptor =
        document.createElement(
            "div"
        );

    interceptor.className =
        "interceptor";

    layer.appendChild(
        interceptor
    );

    const missilePromise =
        animateProjectile(
            missile,
            source,
            interceptPoint,
            1450,
            arc*
            .72
        );

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                620
            )
    );

    const interceptorPromise =
        animateProjectile(
            interceptor,
            defenseStart,
            interceptPoint,
            800,
            25
        );

    await Promise.all(
        [
            missilePromise,
            interceptorPromise
        ]
    );

    missile.remove();

    interceptor.remove();

    createExplosion(
        interceptPoint,
        "🛡️ موشک رهگیری شد",
        true
    );
}


/* =========================================================
   LAUNCH MISSILE
========================================================= */

window.launchMissile =
async function(
    targetId,
    missileId
){
    const war =
        activeWarAgainst(
            targetId
        );

    if(
        !war
    ){
        return;
    }

    const missile =
        EQUIPMENT.find(
            item =>
                item.id ===
                missileId &&
                item.category ===
                "missile"
        );

    if(
        !missile
    ){
        return;
    }

    if(
        (
            state.inventory[
                missileId
            ]||
            0
        )<=
        0
    ){
        return;
    }

    state.inventory[
        missileId
    ]--;

    const defense =
        calculateTargetDefense(
            targetId
        );

    const interceptChance =
        clamp(
            defense*
            .72-
            state.technology*
            .12-
            missile.power*
            .08+
            18,
            8,
            82
        );

    const intercepted =
        chance(
            interceptChance
        );

    state.missileHistory.unshift(
        {
            targetId,

            missileId,

            intercepted,

            interceptChance,

            date:
                {
                    ...state.date
                }
        }
    );

    closeModal();

    closeCountryPopup();

    saveGame();

    await playMissileAnimation(
        targetId,
        intercepted
    );

    const target =
        state.countryMap[
            targetId
        ];

    if(
        intercepted
    ){
        addNews(
            targetId,
            "military",
            "رهگیری حمله موشکی",
            `پدافند ${target.nameFa} حمله موشکی را رهگیری کرد.`,
            3
        );
    }
    else{
        const ai =
            state.ai[
                targetId
            ];

        ai.military =
            clamp(
                ai.military-
                missile.power*
                .035,
                5,
                150
            );

        ai.stability =
            clamp(
                ai.stability-
                missile.power*
                .012,
                5,
                100
            );

        addNews(
            targetId,
            "military",
            "اصابت موشکی",
            `حمله موشکی در شبیه‌سازی به ${target.nameFa} اصابت کرد و آمادگی آن کشور کاهش یافت.`,
            3
        );
    }

    saveGame();
};

                    buildings:
                        state.buildings,

                    inventory:
                        state.inventory,

                        state.construction,
