<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#030712">

<title>
WORLD REVOLUTION — REAL EQUIPMENT WAR
</title>

<style>

/* =========================================================
   WORLD REVOLUTION
   REAL EQUIPMENT WAR EDITION
   GAME UI
   ========================================================= */

:root{

    --bg:
        #030712;

    --bg2:
        #07111f;

    --panel:
        rgba(7,16,30,.95);

    --panel2:
        rgba(12,25,44,.96);

    --panel3:
        rgba(17,34,57,.92);

    --line:
        rgba(255,255,255,.09);

    --lineBright:
        rgba(62,220,255,.25);

    --text:
        #edf8ff;

    --muted:
        #8198ae;

    --cyan:
        #32ddff;

    --blue:
        #478cff;

    --green:
        #3be09a;

    --red:
        #ff536f;

    --yellow:
        #ffd35b;

    --purple:
        #aa7aff;

    --orange:
        #ff984b;

    --shadow:
        0 25px 100px rgba(0,0,0,.58);

    --radius:
        18px;
}

*{

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

    -webkit-tap-highlight-color:
        transparent;
}

html,
body{

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;

    background:
        var(--bg);

    color:
        var(--text);

    font-family:
        Tahoma,
        Arial,
        "Segoe UI",
        sans-serif;
}

body{

    position:
        relative;
}

button,
input,
select{

    font-family:
        inherit;
}

button{

    cursor:
        pointer;
}

/* =========================================================
   WORLD BACKGROUND
   ========================================================= */

#world{

    position:
        fixed;

    inset:
        0;

    overflow:
        hidden;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(24,93,128,.26),
            transparent 35%
        ),

        radial-gradient(
            circle at 20% 80%,
            rgba(88,51,136,.10),
            transparent 35%
        ),

        linear-gradient(
            145deg,
            #081827,
            #030712 74%
        );
}

#mapCanvas{

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    z-index:
        1;
}

#stars{

    position:
        absolute;

    inset:
        0;

    z-index:
        2;

    pointer-events:
        none;
}

.vignette{

    position:
        absolute;

    inset:
        0;

    z-index:
        4;

    pointer-events:
        none;

    background:

        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.15) 58%,
            rgba(0,0,0,.72) 100%
        );
}

.scanlines{

    position:
        absolute;

    inset:
        0;

    z-index:
        5;

    pointer-events:
        none;

    opacity:
        .035;

    background:

        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.08) 4px
        );
}

/* =========================================================
   COMMON GLASS PANELS
   ========================================================= */

.glass{

    background:
        linear-gradient(
            145deg,
            rgba(12,24,41,.95),
            rgba(4,10,19,.94)
        );

    border:
        1px solid var(--line);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(18px);
}

/* =========================================================
   TOP COMMAND BAR
   ========================================================= */

#topbar{

    position:
        fixed;

    z-index:
        50;

    top:
        8px;

    left:
        8px;

    right:
        8px;

    display:
        flex;

    gap:
        7px;

    align-items:
        stretch;

    pointer-events:
        none;
}

#brand{

    width:
        230px;

    min-width:
        230px;

    border-radius:
        18px;

    padding:
        10px 13px;

    border:
        1px solid
        rgba(53,221,255,.18);

    background:
        linear-gradient(
            135deg,
            rgba(37,143,190,.14),
            rgba(91,54,160,.12)
        );
}

#brandTitle{

    display:
        block;

    color:
        var(--cyan);

    font-size:
        15px;

    font-weight:
        1000;

    letter-spacing:
        .6px;
}

#brandSub{

    display:
        block;

    margin-top:
        4px;

    color:
        var(--muted);

    font-size:
        8px;

    letter-spacing:
        .4px;
}

#stats{

    flex:
        1;

    min-width:
        0;

    display:
        flex;

    gap:
        6px;

    overflow:
        auto;

    scrollbar-width:
        none;
}

#stats::-webkit-scrollbar{

    display:
        none;
}

.stat{

    min-width:
        90px;

    padding:
        8px 9px;

    border-radius:
        14px;

    pointer-events:
        none;

    border:
        1px solid var(--line);

    background:
        rgba(5,13,24,.93);
}

.statLabel{

    display:
        block;

    color:
        var(--muted);

    font-size:
        8px;
}

.statValue{

    display:
        block;

    margin-top:
        4px;

    color:
        #fff;

    font-size:
        12px;

    font-weight:
        1000;
}

.stat.money .statValue{

    color:
        var(--green);
}

.stat.economy .statValue{

    color:
        var(--yellow);
}

.stat.military .statValue{

    color:
        var(--red);
}

.stat.tech .statValue{

    color:
        var(--purple);
}

.stat.resource .statValue{

    color:
        var(--cyan);
}

/* =========================================================
   LEFT MAP TOOLBOX
   ========================================================= */

#mapTools{

    position:
        fixed;

    z-index:
        45;

    left:
        8px;

    top:
        91px;

    width:
        50px;

    padding:
        5px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        5px;

    border-radius:
        16px;

    background:
        rgba(4,11,21,.92);

    border:
        1px solid var(--line);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(15px);
}

.mapTool{

    width:
        40px;

    height:
        40px;

    display:
        grid;

    place-items:
        center;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        12px;

    background:
        rgba(255,255,255,.035);

    color:
        #e7f8ff;

    font-size:
        17px;

    transition:
        .18s;
}

.mapTool:hover{

    background:
        rgba(53,221,255,.09);
}

.mapTool.active{

    background:
        linear-gradient(
            135deg,
            rgba(53,221,255,.24),
            rgba(71,140,255,.19)
        );

    border-color:
        rgba(53,221,255,.48);

    box-shadow:
        0 0 25px
        rgba(53,221,255,.15);
}

/* =========================================================
   WORLD POWER PANEL
   ========================================================= */

#worldPanel{

    position:
        fixed;

    z-index:
        45;

    right:
        8px;

    top:
        91px;

    bottom:
        78px;

    width:
        295px;

    overflow:
        hidden;

    border-radius:
        20px;

    background:
        rgba(5,13,24,.94);

    border:
        1px solid var(--line);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(18px);
}

#worldPanelHeader{

    height:
        48px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        0 13px;

    border-bottom:
        1px solid var(--line);
}

#worldPanelHeader b{

    font-size:
        11px;
}

#worldPanelHeader span{

    color:
        var(--green);

    font-size:
        8px;

    font-weight:
        900;
}

#worldRanks{

    height:
        calc(100% - 48px);

    overflow:
        auto;

    padding:
        8px;
}

.worldRank{

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        9px;

    margin-bottom:
        6px;

    border-radius:
        13px;

    border:
        1px solid
        rgba(255,255,255,.05);

    background:
        rgba(255,255,255,.03);

    transition:
        .18s;

    cursor:
        pointer;
}

.worldRank:hover{

    border-color:
        var(--lineBright);

    background:
        rgba(53,221,255,.045);
}

.worldRankNumber{

    width:
        25px;

    height:
        25px;

    display:
        grid;

    place-items:
        center;

    flex:
        0 0 auto;

    border-radius:
        8px;

    color:
        var(--cyan);

    background:
        rgba(53,221,255,.08);

    font-size:
        9px;

    font-weight:
        1000;
}

.worldRankFlag{

    font-size:
        22px;
}

.worldRankText{

    min-width:
        0;
}

.worldRankName{

    display:
        block;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

    font-size:
        10px;

    font-weight:
        900;
}

.worldRankMeta{

    display:
        block;

    margin-top:
        3px;

    color:
        var(--muted);

    font-size:
        8px;
}

/* =========================================================
   BOTTOM COMMAND DOCK
   ========================================================= */

#dock{

    position:
        fixed;

    z-index:
        60;

    left:
        50%;

    transform:
        translateX(-50%);

    bottom:
        6px;

    width:
        min(1240px,calc(100vw - 14px));

    padding:
        6px;

    display:
        flex;

    gap:
        4px;

    overflow:
        auto;

    scrollbar-width:
        none;

    border-radius:
        21px;

    background:
        rgba(4,10,19,.95);

    border:
        1px solid var(--line);

    box-shadow:
        0 20px 90px
        rgba(0,0,0,.66);

    backdrop-filter:
        blur(19px);
}

#dock::-webkit-scrollbar{

    display:
        none;
}

.dockButton{

    min-width:
        68px;

    flex:
        1;

    max-width:
        112px;

    padding:
        6px 5px;

    border:
        1px solid
        transparent;

    border-radius:
        13px;

    color:
        #8ba4ba;

    background:
        transparent;

    transition:
        .18s;
}

.dockButton:hover{

    color:
        #fff;

    background:
        rgba(255,255,255,.055);

    border-color:
        rgba(255,255,255,.07);
}

.dockIcon{

    display:
        block;

    font-size:
        18px;
}

.dockText{

    display:
        block;

    margin-top:
        3px;

    font-size:
        8px;

    font-weight:
        900;
}

/* =========================================================
   MODAL
   ========================================================= */

#modal{

    position:
        fixed;

    inset:
        0;

    z-index:
        1000;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        12px;

    background:
        rgba(0,0,0,.66);

    backdrop-filter:
        blur(9px);
}

#modal.show{

    display:
        flex;
}

.modalWindow{

    width:
        min(1260px,97vw);

    max-height:
        94vh;

    overflow:
        hidden;

    border-radius:
        25px;

    border:
        1px solid
        rgba(255,255,255,.11);

    background:
        linear-gradient(
            145deg,
            #0f1f35,
            #050b15
        );

    box-shadow:
        0 50px 180px
        rgba(0,0,0,.84);
}

.modalHeader{

    min-height:
        58px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        0 15px;

    border-bottom:
        1px solid var(--line);
}

.modalHeaderTitle{

    color:
        var(--cyan);

    font-size:
        14px;

    font-weight:
        1000;
}

.modalClose{

    width:
        36px;

    height:
        36px;

    border:
        0;

    border-radius:
        10px;

    color:
        #fff;

    background:
        rgba(255,83,111,.14);

    font-size:
        18px;
}

.modalContent{

    max-height:
        calc(94vh - 58px);

    overflow:
        auto;

    padding:
        14px;
}

/* =========================================================
   CARDS
   ========================================================= */

.cardGrid{

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );

    gap:
        9px;
}

.card{

    border:
        1px solid
        rgba(255,255,255,.065);

    border-radius:
        16px;

    padding:
        12px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.046),
            rgba(255,255,255,.018)
        );

    transition:
        .18s;
}

.card:hover{

    border-color:
        rgba(53,221,255,.24);

    transform:
        translateY(-1px);
}

.cardHeader{

    display:
        flex;

    align-items:
        center;

    gap:
        9px;
}

.cardIcon{

    width:
        42px;

    height:
        42px;

    flex:
        0 0 auto;

    display:
        grid;

    place-items:
        center;

    border-radius:
        12px;

    background:
        rgba(53,221,255,.09);

    font-size:
        21px;
}

.cardTitle{

    font-size:
        11px;

    font-weight:
        1000;
}

.cardSubtitle{

    margin-top:
        3px;

    color:
        var(--muted);

    font-size:
        8px;
}

.cardText{

    color:
        #97acbf;

    font-size:
        9px;

    line-height:
        1.8;

    margin-top:
        9px;
}

.cardTags{

    margin-top:
        7px;
}

.tag{

    display:
        inline-block;

    margin:
        2px;

    padding:
        4px 6px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:
        999px;

    color:
        #aac0d2;

    background:
        rgba(255,255,255,.035);

    font-size:
        7px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.btn{

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        4px;

    padding:
        8px 11px;

    border-radius:
        10px;

    border:
        1px solid
        rgba(53,221,255,.23);

    color:
        #fff;

    background:
        rgba(53,221,255,.09);

    font-size:
        9px;

    font-weight:
        900;

    transition:
        .16s;
}

.btn:hover{

    transform:
        translateY(-1px);

    background:
        rgba(53,221,255,.15);
}

.btn.green{

    border-color:
        rgba(59,225,157,.27);

    background:
        rgba(59,225,157,.09);
}

.btn.red{

    border-color:
        rgba(255,83,111,.28);

    background:
        rgba(255,83,111,.09);
}

.btn.yellow{

    border-color:
        rgba(255,211,91,.28);

    background:
        rgba(255,211,91,.09);
}

.btn.purple{

    border-color:
        rgba(170,122,255,.28);

    background:
        rgba(170,122,255,.09);
}

.btn.orange{

    border-color:
        rgba(255,152,75,.28);

    background:
        rgba(255,152,75,.09);
}

/* =========================================================
   KPI
   ========================================================= */

.kpiGrid{

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(120px,1fr)
        );

    gap:
        7px;

    margin-bottom:
        11px;
}

.kpi{

    padding:
        10px;

    border-radius:
        13px;

    border:
        1px solid
        rgba(255,255,255,.06);

    background:
        rgba(255,255,255,.03);
}

.kpiLabel{

    display:
        block;

    color:
        var(--muted);

    font-size:
        8px;
}

.kpiValue{

    display:
        block;

    margin-top:
        4px;

    color:
        #fff;

    font-size:
        13px;

    font-weight:
        1000;
}

/* =========================================================
   PROGRESS
   ========================================================= */

.progress{

    width:
        100%;

    height:
        7px;

    margin-top:
        8px;

    overflow:
        hidden;

    border-radius:
        999px;

    background:
        #13243a;
}

.progress > i{

    display:
        block;

    width:
        0;

    height:
        100%;

    border-radius:
        inherit;

    background:
        linear-gradient(
            90deg,
            var(--red),
            var(--yellow),
            var(--green)
        );
}

/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar{

    display:
        flex;

    align-items:
        center;

    flex-wrap:
        wrap;

    gap:
        6px;

    margin-bottom:
        10px;
}

.search{

    min-width:
        190px;

    flex:
        1;

    padding:
        10px;

    color:
        #fff;

    background:
        #081526;

    border:
        1px solid var(--line);

    border-radius:
        11px;

    outline:
        none;
}

.select{

    min-width:
        145px;

    padding:
        10px;

    color:
        #fff;

    background:
        #081526;

    border:
        1px solid var(--line);

    border-radius:
        11px;

    outline:
        none;
}

.pageInfo{

    color:
        var(--muted);

    font-size:
        8px;

    padding:
        0 4px;
}

/* =========================================================
   TOAST
   ========================================================= */

#toastLayer{

    position:
        fixed;

    z-index:
        5000;

    top:
        79px;

    left:
        50%;

    transform:
        translateX(-50%);

    width:
        min(430px,91vw);

    pointer-events:
        none;
}

.toast{

    padding:
        11px 13px;

    margin-bottom:
        6px;

    border-radius:
        12px;

    background:
        rgba(5,12,24,.97);

    border:
        1px solid
        rgba(53,221,255,.18);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.40);

    color:
        #e8faff;

    font-size:
        9px;

    animation:
        toastIn .18s ease-out;
}

@keyframes toastIn{

    from{

        opacity:
            0;

        transform:
            translateY(-7px);

    }

    to{

        opacity:
            1;

        transform:
            translateY(0);

    }

}

/* =========================================================
   MOBILE
   ========================================================= */

@media(
    max-width:760px
){

    #topbar{

        top:
            5px;

        left:
            5px;

        right:
            5px;

        flex-wrap:
            wrap;
    }

    #brand{

        width:
            100%;

        min-width:
            0;
    }

    .stat{

        min-width:
            82px;
    }

    #mapTools{

        top:
            138px;

        left:
            5px;

        width:
            45px;
    }

    .mapTool{

        width:
            35px;

        height:
            35px;

        font-size:
            15px;
    }

    #worldPanel{

        display:
            none;
    }

    #dock{

        width:
            calc(100vw - 8px);

        bottom:
            4px;
    }

    .dockButton{

        min-width:
            60px;
    }

    .modalWindow{

        width:
            98vw;

        max-height:
            93vh;

        border-radius:
            19px;
    }

    .modalContent{

        max-height:
            calc(93vh - 58px);

        padding:
            10px;
    }

    .cardGrid{

        grid-template-columns:
            1fr;
    }

}

/* =========================================================
   LOADER
   ========================================================= */

#loader{

    position:
        fixed;

    inset:
        0;

    z-index:
        9999;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        radial-gradient(
            circle at 50% 35%,
            #173a51,
            #040a14 48%,
            #010309 90%
        );
}

.loaderBox{

    width:
        min(600px,90vw);

    text-align:
        center;

    padding:
        38px;

    border-radius:
        27px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(4,11,21,.95);

    box-shadow:
        0 40px 140px
        rgba(0,0,0,.72);
}

.loaderTitle{

    font-size:
        clamp(
            28px,
            7vw,
            62px
        );

    font-weight:
        1000;

    letter-spacing:
        2px;

    background:
        linear-gradient(
            90deg,
            #fff,
            var(--cyan),
            var(--purple),
            var(--green)
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;
}

.loaderSub{

    margin-top:
        8px;

    color:
        var(--muted);

    font-size:
        9px;
}

.loaderTrack{

    height:
        8px;

    margin-top:
        25px;

    border-radius:
        99px;

    overflow:
        hidden;

    background:
        #102239;
}

.loaderProgress{

    width:
        0;

    height:
        100%;

    border-radius:
        inherit;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--purple),

        },

        {
            type:
                "vehicle",

            icon:
                "🚙",

            names:
                VEHICLES
        }

    ];

    let id =
        1;

    for(
        const group of groups
    ){

        for(
            const name of group.names
        ){

            let hash =
                0;

            for(
                let i=0;
                i<name.length;
                i++
            ){

                hash =
                    (
                        hash*31+
                        name.charCodeAt(i)
                    )
                    >>>0;

            }

            EQUIPMENT.push({

                id:
                    "EQ_"+String(id++)
                    .padStart(5,"0"),

                name:

                    name,

                category:

                    group.type,

                icon:

                    group.icon,

                rarity:

                    [
                        "Common",
                        "Advanced",
                        "Elite",
                        "Strategic",
                        "Legendary"
                    ][
                        hash%5
                    ],

                gamePower:
                    30+
                    hash%71,

                gameDefense:
                    20+
                    (
                        hash*3
                    )%81,

                gameMobility:
                    25+
                    (
                        hash*5
                    )%76,

                gameTech:
                    25+
                    (
                        hash*7
                    )%76,

                gameCost:
                    600+
                    (
                        hash*11
                    )%8200,

                gameUpkeep:
                    4+
                    (
                        hash*13
                    )%38

            });

        }

    }

}

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}

function formatMoney(
    value
){

    value =
        Math.round(
            Number(value)||0
        );

    if(
        value>=1000000000
    ){

        return (
            value/1000000000
        ).toFixed(2)+"B";

    }

    if(
        value>=1000000
    ){

        return (
            value/1000000
        ).toFixed(2)+"M";

    }

    if(
        value>=1000
    ){

        return (
            value/1000
        ).toFixed(1)+"K";

    }

    return value.toLocaleString(
        "fa-IR"
    );

}

            S.day,

        title:
            title,

        text:
            text,

        type:
            type

    });

    if(
        S.news.length>
        300
    ){

        S.news.length=
            300;

    }

}


/* =========================================================
   FACTION SETUP
   ========================================================= */

function setupFactions(){

    for(
        const f
        of FACTIONS
    ){

        if(
            !S.factions[f.id]
        ){

            S.factions[f.id]={

                economy:
                    f.economy,

                military:
                    f.military,

                technology:
                    f.technology,

                stability:
                    f.stability,

                unrest:
                    10+
                    (
                        f.id.length*
                        7
                    )%40,

                loyalty:
                    50+
                    (
                        f.id.length*
                        8
                    )%45,

                owner:
                    f.id,

                ai:
                    true,

                x:
                    0,

                y:
                    0

            };

        }

        if(
            typeof
            S.relations[f.id]
            !==
            "number"
        ){

            S.relations[f.id]=
                0;

        }

    }

}


/* =========================================================
   START GAME
   ========================================================= */

function startGame(
    id
){

    const f =
        faction(id);

    if(
        !f
    )
        return;

    setupFactions();

    S.started =
        true;

    S.player =
        id;

    S.population =
        f.population;

    S.economy =
        f.economy;

    S.military =
        f.military;

    S.technology =
        f.technology;

    S.stability =
        f.stability;

    S.money =
        10000+
        f.economy*90;

    S.industry =
        45+
        f.economy*.3;

    S.research =
        15+
        f.technology*.35;

    S.oil =
        55+
        f.economy*.35;

    S.steel =
        70+
        f.industry*.3;

    S.food =
        75+
        f.stability*.2;

    S.manpower =
        40+
        f.population*.45;

    S.factions[id].ai =
        false;

    S.factions[id].owner =
        id;

    addNews(
        "🏳️ آغاز فرماندهی",
        `شما کنترل ${f.name} را در سال ${S.year} به دست گرفتید.`,
        "national"
    );

    saveGame();

    render();

    closeModal();

    toast(
        `${f.flag} ${f.name} آماده فرماندهی است`
    );

}

function changeTax(
    delta
){

    S.tax =
        clamp(
            S.tax+
            delta,
            0,
            50
        );

    S.legitimacy -=
        delta*
        .45;

    S.unrest +=
        delta*
        .3;

    normalizeState();

    render();

    openCountry();

}

function runNationPolicy(
    type
){

    const policies={

        welfare:{

            cost:
                750,

            run(){

                S.stability+=
                    4;

                S.unrest-=
                    6;

                S.legitimacy+=
                    3;

            }

        },

        propaganda:{

            cost:
                500,

            run(){

                S.propaganda+=
                    8;

                S.warSupport+=
                    5;

                S.legitimacy+=
                    2;

            }

        },

        corruption:{

            cost:
                900,

            run(){

                S.corruption-=
                    7;

                S.economy+=
                    2;

                S.legitimacy+=
                    2;

            }

        }

    };

    const policy =
        policies[type];

    if(
        !policy
    )
        return;

    if(
        S.money<
        policy.cost
    ){

        toast(
            "بودجه کافی نیست"
        );

        return;

    }

    S.money -=
        policy.cost;

    policy.run();

    normalizeState();

    render();

    openCountry();

    toast(
        "✅ سیاست ملی اجرا شد"
    );

}

        return;

    }

    S.money -=
        cost;

    if(
        action===
        "industry"
    ){

        S.industry+=
            10;

        S.economy+=
            5;

    }

    if(
        action===
        "energy"

        S.energy+=

        S.economy+=
            2;

    }

    if(
        action===
        "food"

    if(

            2;

                1.25
            );

        S.stability+=
            2;

    }

    normalizeState();

    render();

    openEconomy();

}

function buyEquipment(
    id
){

    const item =
        EQUIPMENT.find(
            x=>
                x.id===
                id
        );

    if(
        !item
    )
        return;

    const steelCost =
        Math.max(
            1,
            Math.round(
                item.gamePower/
                20
            )
        );

    const oilCost =
        (
            item.category===
            "aircraft"
            ||
            item.category===
            "tank"
            ||
            item.category===
            "naval"
        )
        ?

        Math.max(
            1,
            Math.round(
                item.gameMobility/
                35
            )
        )

        :

        Math.max(
            0,
            Math.round(
                item.gamePower/
                60
            )
        );

    if(
        S.money<
        item.gameCost
    ){

        toast(
            "💰 بودجه کافی نیست"
        );

        return;

    }

    if(
        S.steel<
        steelCost
    ){

        toast(
            "⛓️ فولاد کافی نیست"
        );

        return;

    }

    if(
        S.oil<
        oilCost
    ){

        toast(
            "🛢️ نفت کافی نیست"
        );

        return;

    }

    S.money-=
        item.gameCost;

    S.steel-=
        steelCost;

    S.oil-=
        oilCost;

    S.equipment[
        id
    ]=
        (
            S.equipment[id]||
            0
        )+
        1;

    const militaryGain =
        item.gamePower*
        .075;

    S.military +=
        militaryGain;

    S.technology +=
        item.gameTech*
        .006;

    if(
        item.category===
        "aircraft"
    ){

        S.command+=
            .35;

    }

    if(
        item.category===
        "naval"
    ){

        S.influence+=
            .25;

    }

    if(

function declareWar(
    enemyId
){

    if(
        !S.started
    )
        return;

    if(
        enemyId===
        S.player
    )
        return;

    if(
        S.wars.some(
            w=>
                w.enemy===
                enemyId&&
                w.status===
                "war"
        )
    ){

        toast(
            "⚠️ این جنگ از قبل فعال است"
        );

        return;

    }

    if(
        S.alliances.includes(
            enemyId
        )
    ){

        toast(
            "🤝 این کشور متحد شماست"
        );

        return;

    }

    if(
        S.command<
        15
    ){

        toast(
            "فرماندهی کافی نیست"
        );

        return;

    }

    if(
        S.warSupport<
        25
    ){

        toast(
            "حمایت عمومی برای جنگ کافی نیست"
        );

        return;

    }

    S.command-=
        15;

    S.warSupport-=
        3;

    S.relations[
        enemyId
    ]=
        -100;

    S.wars.push({

        id:
            "WAR_"+
            Date.now()+
            "_"+
            Math.floor(
                Math.random()*
                9999
            ),

        enemy:
            enemyId,

        status:
            "war",

        score:
            0,

        days:
            0,

        supply:
            100,

        morale:
            78,

        air:
            20,

        naval:
            15,

        casualties:
            0,

        goal:
            "تصرف سرزمین"

    });

    S.warExhaustion+=
        3;

    const f =
        faction(
            enemyId
        );

    addNews(
        "🔥 آغاز جنگ",
        `کشور شما وارد جنگ با ${f.name} شد.`,
        "war"
    );

    normalizeState();

    render();

    openWars();

    toast(
        `🔥 جنگ با ${f.name} آغاز شد`
    );

}

function battleOperation(
    warId,
    operation
){

    const war =
        S.wars.find(
            w=>
                w.id===
                warId
        );

    if(
        !war||
        war.status!==
        "war"
    )
        return;

    const commandCosts={

        ground:
            7,

        air:
            10,

        artillery:
            8,

        logistics:
            3

    };

    const oilCosts={

        ground:
            2,

        air:
            7,

        artillery:
            4,

        logistics:
            1

    };

    const commandCost =
        commandCosts[
            operation
        ];

    const oilCost =
        oilCosts[
            operation
        ];

    if(
        S.command<
        commandCost
    ){

        toast(
            "فرماندهی کافی نیست"
        );

        return;

    }

    if(
        S.oil<
        oilCost
    ){

        toast(
            "نفت کافی نیست"
        );

        return;

    }

    S.command-=
        commandCost;

    S.oil-=
        oilCost;

    if(
        operation===
        "logistics"
    ){

        war.supply=
            clamp(
                war.supply+
                15,
                0,
                100
            );

        war.morale+=
            2;

        normalizeState();

        render();

        openWars();

        toast(
            "🚛 تدارکات جبهه تقویت شد"
        );

        return;

    }

    const enemy =
        S.factions[
            war.enemy
        ];

    const inventoryPower =
        Object.entries(
            S.equipment
        )
        .reduce(
            (
                total,
                [id,count]
            )=>{

                const item =
                    EQUIPMENT.find(
                        x=>
                            x.id===
                            id
                    );

                if(
                    !item
                )
                    return total;

                let multiplier=
                    .018;

                if(
                    operation===
                    "air"&&
                    item.category===
                    "aircraft"
                )
                    multiplier=
                        .05;

                if(
                    operation===
                    "ground"&&
                    (
                        item.category===
                        "tank"||
                        item.category===
                        "vehicle"
                    )
                )
                    multiplier=
                        .045;

                if(
                    operation===
                    "artillery"&&
                    item.category===
                    "artillery"
                )
                    multiplier=
                        .05;

                return total+
                    item.gamePower*
                    count*
                    multiplier;

            },
            0
        );

    let typeBonus=
        0;

    if(
        operation===
        "ground"
    ){

        typeBonus=
            S.military*
            .17;

    }

    if(
        operation===
        "air"
    ){

        typeBonus=
            S.technology*
            .25+
            S.military*
            .08;

        war.air+=
            5;

    }

    if(
        operation===
        "artillery"
    ){

        typeBonus=
            S.military*
            .12;

    }

    const ourPower =
        S.military+
        S.technology*
        .38+
        S.warSupport*
        .22+
        inventoryPower+
        typeBonus+
        Math.random()*
        55;

    const enemyPower =
        enemy.military+
        enemy.technology*
        .32+
        enemy.stability*
        .2+
        Math.random()*
        55;

    let result =
        (
            ourPower-
            enemyPower
        )/
        9;

    if(
        war.supply<
        35
    ){

        result*=
            .55;

    }

    if(
        war.morale<
        40
    ){

        result*=
            .68;

    }

    if(
        S.warExhaustion>
        70
    ){

        result*=
            .78;

    }

    war.score +=
        result;

    war.supply=
        clamp(
            war.supply-
            (
                operation===
                "air"
                ?5
                :3
            ),
            0,
            100
        );

    war.morale=
        clamp(
            war.morale+
            (
                result>
                0
                ?2.5
                :-3
            ),
            0,
            100
        );

    war.casualties+=
        Math.max(
            1,
            Math.round(
                Math.abs(
                    result
                )*
                2.5
            )
        );

    S.manpower=
        Math.max(
            0,
            S.manpower-
            Math.max(
                .1,
                Math.abs(
                    result
                )*
                .1
            )
        );

    S.warExhaustion+=
        .8+
        Math.random()*
        1.5;

    if(
        result>
        0
    ){

        toast(
            "✅ عملیات نظامی موفق بود"
        );

    }

    else{

        toast(
            "⚠️ عملیات با مشکل مواجه شد"
        );

    }

    evaluateWar(
        war
    );

    normalizeState();

    render();

    openWars();

}

function evaluateWar(
    war
){

    if(
        war.status!==
        "war"
    )
        return;

    if(
        war.score>=
        100
    ){

        war.status=
            "won";

        const enemy =
            S.factions[
                war.enemy
            ];

        enemy.owner=
            S.player;

        enemy.ai=
            false;

        S.money+=
            2300;

        S.reputation=
            (
                S.reputation||
                0
            )+
            4;

        S.legitimacy+=
            3;

        S.influence+=
            4;

        addNews(
            "🏆 پیروزی بزرگ",
            `جنگ با ${faction(war.enemy).name} با پیروزی شما پایان یافت.`,
            "war"
        );

        toast(
            "🏆 پیروزی کامل!"
        );

    }

    if(
        war.score<=
        -100
    ){

        war.status=
            "lost";

        S.money=
            Math.max(
                0,
                S.money-
                1600
            );

        S.military-=
            5;

        S.stability-=
            7;

        S.legitimacy-=
            8;

        S.unrest+=
            10;

        addNews(
            "💀 شکست نظامی",
            `جنگ با ${faction(war.enemy).name} شکست خورد.`,
            "war"
        );

        toast(
            "💀 شکست نظامی"
        );

    }

}

function signPeace(
    warId
){

    const war =
        S.wars.find(
            w=>
                w.id===
                warId
        );

    if(
        !war
    )
        return;

    const reward =
        Math.max(
            0,
            Math.round(
                war.score*
                3
            )
        );

    S.money+=
        reward;

    S.warExhaustion=
        Math.max(
            0,
            S.warExhaustion-
            8
        );

    S.warSupport=
        Math.max(
            0,
            S.warSupport-
            3
        );

    war.status=
        "peace";

    addNews(
        "🕊️ پیمان صلح",
        `جنگ با ${faction(war.enemy).name} پایان یافت.`,
        "diplomacy"
    );

    normalizeState();

    render();

    openWars();

    toast(
        "🕊️ صلح امضا شد"
    );

}

function chooseParty(
    id
){

    ensureGovernmentState();

    const party =
        POLITICAL_PARTIES.find(
            p=>
                p.id===
                id
        );

    if(
        !party
    )
        return;

    if(
        S.politicalPower<
        25
    ){

        toast(
            "قدرت سیاسی کافی نیست"
        );

        return;

    }

    S.politicalPower-=
        25;

    S.party.current=
        party.id;

    S.party.support[
        party.id
    ]=
        Math.max(
            45,
            S.party.support[
                party.id
            ]||
            0
        );

    S.economy+=
        party.economy*
        .18;

    S.military+=
        party.military*
        .2;

    S.stability+=
        party.stability*
        .22;

    S.government.approval=
        clamp(
            S.government.approval+
            party.popularity*
            .25,
            0,
            100
        );

    normalizeState();

    addNews(
        "🗳️ تغییر دولت",
        `${party.name} حزب حاکم شد.`,
        "government"
    );

    render();

    openPolitics();

}

function holdElection(){

    ensureGovernmentState();

    if(
        S.politicalPower<
        30
    ){

        toast(
            "قدرت سیاسی کافی نیست"
        );

        return;

    }

    S.politicalPower-=
        30;

    const roll=
        Math.random();

    if(
        roll>
        .30
    ){

        S.legitimacy+=
            7;

        S.government.approval+=
            6;

        S.unrest-=
            5;

        toast(
            "🗳️ انتخابات با موفقیت برگزار شد"
        );

        addNews(
            "🗳️ انتخابات موفق",
            "روند سیاسی کشور با موفقیت ادامه پیدا کرد.",
            "government"
        );

    }
    else{

        S.legitimacy-=
            6;

        S.unrest+=
            9;

        S.government.crisis+=
            8;

        toast(
            "⚠️ انتخابات باعث بحران سیاسی شد"
        );

        addNews(
            "🚨 بحران انتخاباتی",
            "اختلافات سیاسی پس از انتخابات افزایش یافت.",
            "government"
        );

    }

    S.government.election=
        365;

    normalizeState();

    render();

    openGovernment();

}

function enactLaw(
    id
){

    ensureGovernmentState();

    const law=
        LAW_DATABASE.find(
            x=>
                x.id===
                id
        );

    if(
        !law
    )
        return;

    if(
        S.government.laws
        .includes(
            id
        )
    ){

        toast(
            "این قانون فعال است"
        );

        return;

    }

    if(
        S.politicalPower<
        law.cost
    ){

        toast(
            "قدرت سیاسی کافی نیست"
        );

        return;

    }

    S.politicalPower-=
        law.cost;

    S.government.laws.push(
        law.id
    );

    Object.entries(
        law
    )
    .forEach(
        ([key,value])=>{

            if(
                typeof value!=="number"
            )
                return;

            if(
                typeof S[key]==="number"
            ){

                S[key]+=
                    value;

            }

        }
    );

    addNews(
        "📜 قانون جدید",
        `${law.name} به تصویب رسید.`,
        "government"
    );

    normalizeState();

    render();

    openLaws();

    toast(
        "📜 قانون تصویب شد"
    );

}

function calculateRevolutionRisk(){

    let risk=
        S.unrest*
        1.15;

    risk+=
        (
            100-
            S.legitimacy
        )*
        .48;

    risk+=
        (
            100-
            S.stability
        )*
        .32;

    risk+=
        S.government.crisis*
        .25;

    risk+=
        S.corruption*
        .15;

    risk-=
        S.government.approval*
        .28;

    return clamp(
        risk/
        2.2,
        0,
        100
    );

}

function diplomaticAction(
    id,
    type
){

    if(
        id===
        S.player
    )
        return;

    const current =
        S.relations[id]||
        0;

    const config={

        talk:{
            cost:
                160,
            gain:
                10
        },

        trade:{
            cost:
                300,
            gain:
                7
        },

        alliance:{
            cost:
                600,
            gain:
                15
        },

        pressure:{
            cost:
                220,
            gain:
                -12
        }

    }[type];

    if(
        !config
    )
        return;

    if(
        S.money<
        config.cost
    ){

        toast(
            "بودجه کافی نیست"
        );

        return;

    }

    if(
        type===
        "alliance"&&
        current<
        30
    ){

        toast(
            "روابط برای تشکیل اتحاد کافی نیست"
        );

        return;

    }

    S.money-=
        config.cost;

    S.relations[id]=
        clamp(
            current+
            config.gain,
            -100,
            100
        );

    if(
        type===
        "talk"
    ){

        S.reputation+=
            1;

        S.politicalPower+=
            2;

    }

    if(
        type===
        "trade"
    ){

        S.economy+=
            1.3;

        S.influence+=
            1.5;

    }

    if(
        type===
        "alliance"
    ){

        if(
            !S.alliances
            .includes(
                id
            )
        ){

            S.alliances.push(
                id
            );

        }

        S.reputation+=
            2;

    }

    if(
        type===
        "pressure"
    ){

        S.influence+=
            2;

        S.relations[id]-=
            4;

    }

    render();

    openDiplomacy();

}

    id,
    type
){

    const cost =
        type===
        "recon"
        ?350
        :600;

    if(
        S.money<
        cost
    ){

        toast(
            "بودجه اطلاعاتی کافی نیست"
        );

        return;

    }

    S.money-=
        cost;

    const enemy=
        S.factions[
            id
        ];

    if(
        !enemy
    )
        return;

    const chance =
        45+
        (
            S.intelligence||
            0
        )*
        .55+
        (
            S.technology*
            .18
        );

    const success=
        Math.random()*
        100<
        chance;

    if(
        success
    ){

        if(
            type===
            "recon"
        ){

            toast(
                "🛰️ شناسایی موفق بود"
            );

            addNews(
                "🛰️ گزارش اطلاعاتی",
                `اطلاعات جدیدی درباره ${faction(id).name} جمع‌آوری شد.`,
                "intelligence"
            );

            S.intelligence+=
                .8;

        }
        else{

            enemy.stability=
                clamp(
                    enemy.stability-
                    4,
                    0,
                    100
                );

            enemy.unrest=
                clamp(
                    enemy.unrest+
                    5,
                    0,
                    100
                );

            S.influence+=
                2;

            toast(
                "🕵️ عملیات نفوذ موفق بود"
            );

        }

    }
    else{

        S.reputation-=
            1;

        S.relations[id]-=
            8;

        toast(
            "⚠️ عملیات اطلاعاتی لو رفت"
        );

    }

    normalizeState();

    render();

    openIntelligence();

}

    }

    else if(
        id==="aluminum"
    ){

        S.industry+=
            .7;

    }

    normalizeState();

    render();

    openGlobalMarket();

}

function sellResource(
    id
){

    const amount =
        10;

    let available =
        0;

    if(
        typeof S[id]==="number"
    ){

        available=
            S[id];

    }

    if(
        available<
        amount
    ){

        toast(
            "موجودی کافی نیست"
        );

        return;

    }

    const item=
        RESOURCE_MARKET[
            id
        ];

    const price=
        Math.round(
            item.price*
            S.market[id]
        );

    S[id]-=
        amount;

    S.money+=
        price*
        amount;

    normalizeState();

    render();

    openGlobalMarket();

}

        POLITICAL_PARTIES.find(
            p=>
                p.id===
                id
        );

    if(
        !party
    )
        return;

    if(
        S.politicalPower<
        25

        toast(
            "قدرت سیاسی کافی نیست"
        );

        return;

    }

    S.politicalPower-=
        25;

    S.party.current=
        party.id;

    S.party.support[
        party.id
    ]=
        Math.max(
            45,
            S.party.support[
                party.id
            ]||
            0
        );

    S.economy+=
        party.economy*
        .18;

    S.military+=
        party.military*
        .2;

    S.stability+=
        party.stability*
        .22;

    S.government.approval=
        clamp(
            S.government.approval+
            party.popularity*
            .25,
            0,
            100
        );

    normalizeState();

    addNews(
        "🗳️ تغییر دولت",
        `${party.name} حزب حاکم شد.`,
        "government"
    );

    render();

    openPolitics();

}

    const law=

                id
        );

    if(
        !law

        return;

    if(
        S.government.laws
        .includes(
            id
        )
    ){

        toast(
            "این قانون فعال است"
        );

        return;

    }

    if(
        S.politicalPower<
        law.cost
    ){

        toast(
            "قدرت سیاسی کافی نیست"
        );

        return;

    }

    S.politicalPower-=
        law.cost;

    S.government.laws.push(
        law.id
    );

    Object.entries(
        law
    )
    .forEach(
        ([key,value])=>{

            if(
                typeof value!=="number"
            )
                return;

            if(
                typeof S[key]==="number"
            ){

                S[key]+=
                    value;

            }

        }
    );

    addNews(
        "📜 قانون جدید",

        "government"
    );

function calculateRevolutionRisk(){

    let risk=
        S.unrest*
        1.15;

    risk+=
        (
            100-
            S.legitimacy
        )*
        .48;

    risk+=
        (
            100-
            S.stability
        )*
        .32;

    risk+=
        S.government.crisis*
        .25;

    risk+=
        S.corruption*
        .15;

    risk-=
        S.government.approval*
        .28;

    return clamp(
        risk/
        2.2,
        0,
        100
    );

}

function revolutionAction(

            return;

        S.money-=

        S.unrest-=

        S.government.approval+=

        S.warSupport+=

    if(

function diplomaticAction(
    id,
    type
){

    if(
        id===
        S.player
    )
        return;

    const current =
        S.relations[id]||
        0;

    const config={

        talk:{
            cost:
                160,
            gain:
                10
        },

        trade:{
            cost:
                300,
            gain:
                7
        },

        alliance:{
            cost:
                600,
            gain:
                15
        },

        pressure:{
            cost:
                220,
            gain:
                -12
        }

    }[type];

    if(
        !config
    )
        return;

    if(
        S.money<
        config.cost
    ){

        toast(
            "بودجه کافی نیست"
        );

        return;

    }

    if(
        type===
        "alliance"&&
        current<
        30
    ){

        toast(
            "روابط برای تشکیل اتحاد کافی نیست"
        );

        return;

    }

    S.money-=
        config.cost;

    S.relations[id]=
        clamp(
            current+
            config.gain,
            -100,
            100
        );

    if(
        type===
        "talk"
    ){

        S.reputation+=
            1;

        S.politicalPower+=
            2;

    }

    if(
        type===
        "trade"
    ){

        S.economy+=
            1.3;

        S.influence+=
            1.5;

    }

    if(
        type===
        "alliance"
    ){

        if(
            !S.alliances
            .includes(
                id
            )
        ){

            S.alliances.push(
                id
            );

        }

        S.reputation+=
            2;

    }

    if(
        type===
        "pressure"
    ){

        S.influence+=
            2;

        S.relations[id]-=
            4;

    }

    render();

    openDiplomacy();

}

function intelligenceMission(
    id,
    type
){

    const cost =
        type===
        "recon"
        ?350
        :600;

    if(
        S.money<
        cost
    ){

        toast(
            "بودجه اطلاعاتی کافی نیست"
        );

        return;

    }

    S.money-=
        cost;

    const enemy=
        S.factions[
            id
        ];

    if(
        !enemy
    )
        return;

    const chance =
        45+
        (
            S.intelligence||
            0
        )*
        .55+
        (
            S.technology*
            .18
        );

    const success=
        Math.random()*
        100<
        chance;

    if(
        success
    ){

        if(
            type===
            "recon"
        ){

            toast(
                "🛰️ شناسایی موفق بود"
            );

            addNews(
                "🛰️ گزارش اطلاعاتی",
                `اطلاعات جدیدی درباره ${faction(id).name} جمع‌آوری شد.`,
                "intelligence"
            );

            S.intelligence+=
                .8;

        }
        else{

            enemy.stability=
                clamp(
                    enemy.stability-
                    4,
                    0,
                    100
                );

            enemy.unrest=
                clamp(
                    enemy.unrest+
                    5,
                    0,
                    100
                );

            S.influence+=
                2;

            toast(
                "🕵️ عملیات نفوذ موفق بود"
            );

        }

    }
    else{

        S.reputation-=
            1;

        S.relations[id]-=
            8;

        toast(
            "⚠️ عملیات اطلاعاتی لو رفت"
        );

    }

    normalizeState();

    render();

    openIntelligence();

}

function research(
    id
){

    const tech=
        RESEARCH_TREE.find(
            x=>
                x.id===
                id
        );

    if(
        !tech
    )
        return;

    if(
        S.technologies[id]
    ){

        toast(
            "این فناوری فعال است"
        );

        return;

    }

    if(
        S.technology<
        tech.requirement
    ){

        toast(
            "سطح فناوری کافی نیست"
        );

        return;

    }

    if(
        S.money<
        tech.cost
    ){

        toast(
            "بودجه تحقیق کافی نیست"
        );

        return;

    }

    S.money-=
        tech.cost;

    S.technologies[id]=
        true;

    Object.entries(
        tech
    )
    .forEach(
        ([key,value])=>{

            if(
                typeof value!==
                "number"
            )
                return;

            if(
                [
                    "requirement",
                    "cost"
                ]
                .includes(
                    key
                )

        10;

        0;

    if(
        typeof S[id]==="number"

            S.market[id]
        );

    S[id]-=
        amount;

        price*
        amount;

    normalizeState();

    render();

    openGlobalMarket();

}

/* =========================================================
   RESOURCE COST CALCULATORS
   ========================================================= */

function calculateSteelCost(
    item
){

    if(
        item.category===
        "tank"
    ){

        return Math.max(
            5,
            Math.round(
                item.gamePower*
                .18
            )
        );

    }

    if(
        item.category===
        "naval"
    ){

        return Math.max(
            8,
            Math.round(
                item.gamePower*
                .22
            )
        );

    }

    if(
        item.category===
        "aircraft"
    ){

        return Math.max(
            4,
            Math.round(
                item.gamePower*
                .12
            )
        );

    }

    if(
        item.category===
        "vehicle"
    ){

        return Math.max(
            3,
            Math.round(
                item.gamePower*
                .13
            )
        );

    }

    return Math.max(
        1,
        Math.round(
            item.gamePower*
            .07
        )
    );

}

function calculateOilCost(
    item
){

    if(
        item.category===
        "aircraft"
    ){

        return Math.max(
            3,
            Math.round(
                item.gameMobility*
                .16
            )
        );

    }

    if(
        item.category===
        "tank"
    ){

        return Math.max(
            2,
            Math.round(
                item.gameMobility*
                .09
            )
        );

    }

    if(
        item.category===
        "naval"
    ){

        return Math.max(
            4,
            Math.round(
                item.gameMobility*
                .14
            )
        );

    }

    if(
        item.category===
        "vehicle"
    ){

        return Math.max(
            1,
            Math.round(
                item.gameMobility*
                .06
            )
        );

    }

    return Math.max(
        0,
        Math.round(
            item.gameMobility*
            .025
        )
    );

}


/* =========================================================
   PURCHASE EQUIPMENT
   ========================================================= */

function purchaseEquipment(
    id
){

    ensureEquipmentState();

    const item =
        equipmentById(
            id
        );

    if(
        !item
    )
        return;

    const steelCost =
        calculateSteelCost(
            item
        );

    const oilCost =
        calculateOilCost(
            item
        );

    if(
        S.money<
        item.gameCost
    ){

        toast(
            "💰 بودجه کافی نیست"
        );

        return;

    }

    if(
        S.steel<
        steelCost
    ){

        toast(
            "⛓️ فولاد کافی نیست"
        );

        return;

    }

    if(
        S.oil<
        oilCost
    ){

        toast(
            "🛢️ نفت کافی نیست"
        );

        return;

    }

    S.money-=
        item.gameCost;

    S.steel-=
        steelCost;

    S.oil-=
        oilCost;

    S.equipment[
        id
    ]=
        (
            S.equipment[id]||
            0
        )+
        1;

    const basePower=
        item.gamePower*
        .075;

    const techBonus=
        item.gameTech*
        .008;

    S.military+=
        basePower+
        techBonus;

    if(
        item.category===
        "aircraft"
    ){

        S.command+=
            .45;

    }

    if(
        item.category===
        "tank"
    ){

        S.command+=
            .22;

    }

    if(
        item.category===
        "naval"
    ){

        S.influence+=
            .28;

    }

    if(
        item.category===
        "airdef"
    ){

        S.stability+=
            .08;

    }

    if(
        item.category===
        "missile"
    ){

        S.technology+=
            .025;

    }

    addNews(
        "🛒 خرید تجهیزات",
        `${item.name} وارد انبار نظامی شد.`,
        "military"
    );

    normalizeState();

    saveGame();

    render();

    renderMilitaryShop();

    toast(
        `✅ ${item.name} خریداری شد`
    );

}


/* =========================================================
   EQUIPMENT UPGRADE
   ========================================================= */

function upgradeEquipment(
    id
){

    ensureEquipmentState();

    const item =
        equipmentById(
            id
        );

    const count =
        equipmentOwned(
            id
        );

    if(
        !item||
        count<=0
    )
        return;

    const currentLevel =
        getEquipmentLevel(
            id
        );

    const upgradeCost =
        Math.round(
            item.gameCost*
            .45*
            Math.pow(
                1.35,
                currentLevel
            )
        );

    if(
        S.money<
        upgradeCost
    ){

        toast(
            "💰 بودجه ارتقا کافی نیست"
        );

        return;

    }

    S.money-=
        upgradeCost;

    setEquipmentLevel(
        id,
        currentLevel+
        1
    );

    const gain=
        item.gamePower*
        .045;

    S.military+=
        gain;

    S.technology+=
        .15;

    addNews(
        "⚙️ ارتقای تجهیزات",
        `${item.name} به سطح ${currentLevel+1} ارتقا یافت.`,
        "military"
    );

    normalizeState();

    render();

    renderMilitaryShop();

    toast(
        "⚙️ ارتقا انجام شد"
    );

}

function getEquipmentLevel(

){

function upgradeProductionLine(
    id
){

    const line =
        PRODUCTION_LINES.find(
            x=>
                x.id===
                id
        );

    if(
        !line
    )
        return;

    const level =
        S.productionLines[
            id
        ]||
        0;

    const cost =
        Math.round(
            line.cost*
            Math.pow(
                1.28,
                level
            )
        );

    if(
        S.money<
        cost
    ){

        toast(
            "💰 بودجه کافی نیست"
        );

        return;

    }

    S.money-=
        cost;

    S.productionLines[id]=
        level+
        1;

    S.industry+=
        line.power*
        .38;

    S.economy+=
        line.power*
        .15;

    addNews(
        "🏭 خط تولید جدید",
        `${line.name} به سطح ${level+1} رسید.`,
        "industry"
    );

    normalizeState();

    render();

    openProduction();

    toast(
        "🏭 خط تولید ارتقا یافت"
    );

}

function militaryIndustryCapacity(){

    const lines =
        Object.values(
            S.productionLines||
            {}
        )
        .reduce(
            (
                total,
                level
            )=>
                total+
                level,
            0
        );

    return Math.round(
        S.industry*
        .55+
        lines*
        7
    );

}

/* =========================================================
   MILITARY READINESS
   ========================================================= */

function calculateReadiness(){

    let readiness =
        45;

    readiness +=
        S.command*
        .12;

    readiness +=
        S.technology*
        .10;

    readiness +=
        S.stability*
        .08;

    readiness +=
        Math.min(
            30,
            totalEquipmentCount()*
            .03
        );

    readiness -=
        S.warExhaustion*
        .15;

    if(
        S.manpower<
        40
    )
        readiness -=
            8;

    if(
        S.oil<
        30
    )
        readiness -=
            5;

    return clamp(
        readiness,
        0,
        100
    );

}

function militaryResourceTick(){

    if(
        wars<=0
    )
        return;

    S.oil-=
        .025*

    S.steel-=
        .018*

    S.manpower-=
        .012*
        wars;

    if(
        S.oil<
        20

        S.military-=
            .02*
            wars;

    }

    if(
        S.steel<

            .025*
            wars;

    }

    if(
        S.manpower<
        30
    ){

            .04*
            wars;

    }

}


/* =========================================================
   EQUIPMENT MAINTENANCE
   ========================================================= */

function equipmentMaintenance(){

    ensureEquipmentState();

    let upkeep =
        0;

    Object.entries(
        S.equipment
    )
    .forEach(
        ([id,count])=>{

            const item=
                equipmentById(
                    id
                );

            if(
                !item
            )
                return;

            upkeep +=
                item.gameUpkeep*
                count*
                .035;

        }
    );

    S.money-=
        upkeep;

    if(
        S.money<
        0
    ){

        S.money=
            0;

        S.military-=
            .08;

    }

}


/* =========================================================
   MILITARY AI MARKET DEMAND
   ========================================================= */

function calculateGlobalMilitaryDemand(){

    let demand =
        1;

    const activeWars =
        S.wars.filter(
            w=>
                w.status===
                "war"
        ).length;

    demand +=
        activeWars*
        .08;

    demand +=
        (
            100-
            S.stability
        )*
        .001;

    demand +=
        (
            S.warSupport>
            70
            ?
            .08
            :
            0
        );

    return clamp(
        demand,
        .75,
        1.8
    );

}


/* =========================================================
   DYNAMIC EQUIPMENT PRICES
   ========================================================= */

function dynamicEquipmentPrice(
    item
){

    const demand =
        calculateGlobalMilitaryDemand();

    let modifier =
        1;

    if(
        item.category===
        "aircraft"
    ){

        modifier+=
            S.technology*
            .0018;

    }

    if(
        item.category===
        "tank"
    ){

        modifier+=
            S.industry*
            .0012;

    }

    if(
        item.category===
        "missile"
    ){

        modifier+=
            S.technology*
            .002;

    }

    return Math.round(
        item.gameCost*
        modifier*
        demand
    );

}

function purchaseEquipment(
    id
){

    ensureEquipmentState();

    const item=
        equipmentById(
            id
        );

    if(
        !item
    )
        return;

    const price=
        dynamicEquipmentPrice(
            item
        );

    const steelCost=
        calculateSteelCost(
            item
        );

    const oilCost=
        calculateOilCost(
            item
        );

    if(
        S.money<
        price
    ){

        toast(
            "💰 بودجه کافی نیست"
        );

        return;

    }

    if(
        S.steel<
        steelCost
    ){

        toast(
            "⛓️ فولاد کافی نیست"
        );

        return;

    }

    if(
        S.oil<
        oilCost
    ){

        toast(
            "🛢️ نفت کافی نیست"
        );

        return;

    }

    S.money-=
        price;

    S.steel-=
        steelCost;

    S.oil-=
        oilCost;

    S.equipment[id]=
        (
            S.equipment[id]||
            0
        )+
        1;

    S.military+=
        item.gamePower*
        .075;

    S.technology+=
        item.gameTech*
        .005;

    if(
        item.category===
        "aircraft"
    ){

        S.command+=
            .35;

    }

    if(
        item.category===
        "naval"
    ){

        S.influence+=
            .25;

    }

    if(
        item.category===
        "airdef"
    ){

        S.stability+=
            .06;

    }

    addNews(
        "🛒 خرید نظامی",
        `${item.name} با قیمت بازار ${formatMoney(price)} خریداری شد.`,
        "military"
    );

    normalizeState();

    render();

    renderMilitaryShop();

    saveGame();

    toast(
        `✅ ${item.name} خریداری شد`
    );

}

/* =========================================================
   MAP DRAWING
   ========================================================= */

const worldCanvas =
    document.getElementById(
        "mapCanvas"
    );

const worldCtx =
    worldCanvas
    ?
    worldCanvas.getContext(
        "2d"
    )
    :
    null;

function resizeWorldCanvas(){

    if(
        !worldCanvas
    )
        return;

    worldCanvas.width =
        window.innerWidth;

    worldCanvas.height =
        window.innerHeight;

    positionFactionNodes();

    drawWorldMap();

}

function positionFactionNodes(){

    const positions=[

        [.18,.28],

        [.43,.20],

        [.72,.27],

        [.23,.61],

        [.52,.54],

        [.76,.65],

        [.38,.78],

        [.67,.80]

    ];

    FACTIONS.forEach(
        (
            faction,
            index
        )=>{

            if(
                !S.factions[
                    faction.id
                ]
            )
                return;

            const p=
                positions[
                    index%
                    positions.length
                ];

            S.factions[
                faction.id
            ].x=
                worldCanvas.width*
                p[0];

            S.factions[
                faction.id
            ].y=
                worldCanvas.height*
                p[1];

        }
    );

}

function drawWorldMap(){

    if(
        !worldCanvas||
        !worldCtx
    )
        return;

    const ctx=
        worldCtx;

    const width=
        worldCanvas.width;

    const height=
        worldCanvas.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    const bg=
        ctx.createLinearGradient(
            0,
            0,
            width,
            height
        );

    bg.addColorStop(
        0,
        "#071b29"
    );

    bg.addColorStop(
        .55,
        "#071320"
    );

    bg.addColorStop(
        1,
        "#02050c"
    );

    ctx.fillStyle=
        bg;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    drawOceanGrid(
        ctx,
        width,
        height
    );

    drawContinents(
        ctx,
        width,
        height
    );

    drawPoliticalBorders(
        ctx,
        width,
        height
    );

    drawFactionNodes(
        ctx
    );

    drawMilitaryFronts(
        ctx
    );

}

function drawOceanGrid(
    ctx,
    width,
    height
){

    ctx.lineWidth=
        1;

    ctx.strokeStyle=
        "rgba(70,170,220,.025)";

    const grid=
        45;

    for(
        let x=0;
        x<width;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();

    }

    for(
        let y=0;
        y<height;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }

}

function drawContinents(
    ctx,
    width,
    height
){

    const continents=[

        {
            x:
                width*.20,

            y:
                height*.33,

            rx:
                width*.16,

            ry:
                height*.18
        },

        {
            x:
                width*.48,

            y:
                height*.27,

            rx:
                width*.14,

            ry:
                height*.13
        },

        {
            x:
                width*.73,

            y:
                height*.30,

            rx:
                width*.15,

            ry:
                height*.14
        },

        {
            x:
                width*.42,

            y:
                height*.68,

            rx:
                width*.13,

            ry:
                height*.18
        },

        {
            x:
                width*.71,

            y:
                height*.69,

            rx:
                width*.18,

            ry:
                height*.15
        }

    ];

    continents
    .forEach(
        continent=>{

            ctx.beginPath();

            ctx.ellipse(
                continent.x,
                continent.y,
                continent.rx,
                continent.ry,
                0,
                0,
                Math.PI*2
            );

            ctx.fillStyle=
                "rgba(34,72,53,.56)";

            ctx.fill();

            ctx.lineWidth=
                2;

            ctx.strokeStyle=
                "rgba(100,150,110,.24)";

            ctx.stroke();

        }
    );

}

function drawPoliticalBorders(
    ctx,
    width,
    height
){

    const lines=[

        [
            [.06,.45],
            [.30,.48]
        ],

        [
            [.30,.48],
            [.42,.40]
        ],

        [
            [.42,.40],
            [.58,.42]
        ],

        [
            [.58,.42],
            [.90,.45]
        ],

        [
            [.17,.18],
            [.34,.27]
        ],

        [
            [.56,.18],
            [.72,.28]
        ],

        [
            [.25,.75],
            [.43,.63]
        ],

        [
            [.52,.64],
            [.77,.76]
        ]

    ];

    ctx.strokeStyle=
        "rgba(255,255,255,.09)";

    ctx.lineWidth=
        1;

    lines.forEach(
        line=>{

            ctx.beginPath();

            ctx.moveTo(
                width*
                line[0][0],
                height*
                line[0][1]
            );

            ctx.lineTo(
                width*
                line[1][0],
                height*
                line[1][1]
            );

            ctx.stroke();

        }
    );

}

function factionMapColor(
