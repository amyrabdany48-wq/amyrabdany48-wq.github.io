:root{
--bg:#071018;
--panel:#0c1824;
--panel2:#101f2d;
--line:rgba(255,255,255,.10);
--text:#eff7ff;
--muted:#8fa4b9;
--cyan:#37d7ff;
--blue:#3e8cff;
--green:#35df9a;
--yellow:#ffd66b;
--red:#ff5972;
--purple:#ac82ff;
--orange:#ff9f4d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}
#map{
position:absolute;inset:0;
background:
radial-gradient(circle at 25% 25%,rgba(59,121,170,.18),transparent 25%),
radial-gradient(circle at 75% 65%,rgba(66,91,153,.16),transparent 28%),
linear-gradient(180deg,#0b1a26,#061018);
}
.ocean-grid{
position:absolute;inset:0;opacity:.18;
background-image:
linear-gradient(rgba(110,200,255,.08) 1px,transparent 1px),
linear-gradient(90deg,rgba(110,200,255,.08) 1px,transparent 1px);
background-size:42px 42px;
}
.country{
position:absolute;
border:1px solid rgba(255,255,255,.32);
box-shadow:0 5px 20px rgba(0,0,0,.25);
display:flex;align-items:center;justify-content:center;
text-align:center;
font-weight:900;font-size:10px;
transition:.18s;
user-select:none;
}
.country:hover{transform:scale(1.03);z-index:5;border-color:#fff}
.country span{padding:5px;text-shadow:0 2px 5px rgba(0,0,0,.85)}
#top{
position:absolute;top:10px;left:10px;right:10px;z-index:20;
display:flex;gap:8px;align-items:stretch
}
.brand,.stat,.panel,.dock,.modalBox{
background:rgba(9,18,29,.87);
border:1px solid var(--line);
box-shadow:0 15px 50px rgba(0,0,0,.35);
backdrop-filter:blur(18px);
}
.brand{padding:11px 14px;border-radius:16px;min-width:220px}
.brand-title{font-size:17px;font-weight:1000;letter-spacing:1px}
.brand-sub{font-size:9px;color:var(--muted);margin-top:4px}
.stats{display:flex;gap:7px;overflow:auto;scrollbar-width:none;flex:1}
.stats::-webkit-scrollbar{display:none}
.stat{min-width:105px;padding:9px 11px;border-radius:14px}
.stat small{display:block;color:#8399ae;font-size:8px}
.stat b{display:block;margin-top:4px;font-size:13px}
.good{color:var(--green)}
.bad{color:var(--red)}
.warn{color:var(--yellow)}
.blue{color:var(--cyan)}
#leftTools{
position:absolute;
left:10px;
top:105px;
z-index:18;
display:flex;
flex-direction:column;
gap:7px
}
.tool{
width:42px;
height:42px;
border-radius:13px;
border:1px solid var(--line);
background:rgba(8,17,28,.90);
color:#ddecff
}
.tool:hover,.tool.active{
border-color:var(--cyan);

}
#side{
position:absolute;
right:10px;
top:105px;
z-index:18;
width:325px;

overflow:hidden;

.panel-header{

align-items:center;

.panel-title{font-weight:1000}
.panel-body{
padding:12px;

.card{
background:rgba(255,255,255,.035);

.bar{

background:#16283a;

.fill{

#dock{
position:absolute;

bottom:9px;

.dockBtn{

"use strict";

const $=
id=>
document.getElementById(
id
);

function clamp(
v,
a,
b
){

return Math.max(
a,
Math.min(
b,
v
)
);

}

function num(
v,
d=0
){

return Number.isFinite(
Number(
v
)
)
?
Number(
v
)
:
d;

}

function money(
n
){

n=
Math.round(
n||
0
);

return n.toLocaleString(
'en-US'
)+
'$';

}

function fmt(
n
){

return Number(
n||
0
).toLocaleString(
'en-US'
);

}

function safe(
v
){

return String(
v??
''
).replace(
/[&<>'"]/g,
s=>
({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'
}[s])
);

}

function toast(
t,
type='info'
){

const e=
document.createElement(
'div'
);

e.className=
'toast '+
type;

e.textContent=
t;

$('toast')
.appendChild(
e
);

setTimeout(
()=>{
e.remove();
},
2800
);

}

function openModal(
title,
html
){

$('modalTitle')
.textContent=
title;

$('modalBody')
.innerHTML=
html;

$('modal')
.classList
.add(
'show'
);

}

function closeModal(){

$('modal')
.classList
.remove(
'show'
);

}

function toggleSide(){

$('side')
.classList
.toggle(
'open'
);

}

document.addEventListener(
'keydown',
e=>{

if(
e.key===
'Escape'
)
closeModal();

if(
e.key===
'1'
)
openStore();

if(
e.key===
'2'
)
openArmy();

if(
e.key===
'3'
)
openWar();

if(
e.key===
'4'
)
openDiplomacy();

if(
e.key===
'5'
)
openEconomy();

}
);

state.year;

for(
let i=
0;
i<

m>

x

360+
x.month*
30+
x.day;

dateNum(
end

state
)
);

/* =========================================================
   WAR POWER CALCULATION
========================================================= */

function calculateWarPower(){

let power=
state.military;

power+=
state.technology*
.35;

power+=
state.logistics*
.28;

power+=
state.command*
.12;

power+=
inventoryPower();

power+=
state.stability*
.08;

power+=
state.production*
.025;

power-=
state.warExhaustion*
.32;

if(
state.energy<
30
)
{

power*=
.85;

}

if(
state.food<
25
)
{

power*=
.88;

}

return Math.max(
1,
power
);

}


/* =========================================================
   ENEMY WAR POWER
========================================================= */

function calculateEnemyWarPower(
enemyId
){

const enemy=
country(
enemyId
);

if(
!enemy
)
return 50;

let power=
enemy.military*
1.1;

power+=
Math.sqrt(
enemy.pop
)*
2;

power+=
enemy.stability*
.15;

power+=
Math.random()*
25;

return power;

}

1.6;

state.unemployment*
.8;

0,
score
);

}

.05

w.score>=
100
)

winWar(
w

w.score<=
-100

loseWar(
w
);

}

}
);

}

function runIntelOperation(
id
){

const op=
INTEL_OPERATIONS.find(

id

state.money<
op.cost

state.intelPoints<
op.points

toast(

"warn"
);

state.money-=
op.cost;

state.intelPoints-=
op.points;

const chance=
clamp(
58+
state.intelligence*
.25+
state.counterIntelligence*
.10+
state.technology*
.06-
op.risk*
1.8,
10,
96
);

const success=
Math.random()*
100
<
chance;

if(
success
)
{

if(
op.reward===
"intel"
)
{

state.intelligence+=
7;

3;

op.reward===
"counter"
)
{

state.counterIntelligence+=
8;

state.stability+=
1;

}

if(
op.reward===
"diplomacy"
)
{

state.influence+=
4;

state.reputation+=
1.5;

}

if(
op.reward===
"economy"
)
{

state.money+=
1000;

state.trade+=
2;

}

if(
op.reward===
"cyber"
)
{

state.cyberDefense+=
7;

3;

}

"good"
);

else

Math.max(
0,

.5

1,
state.intelligence-
1
);

"intelligence"
);

/* =========================================================

========================================================= */

function createCrisis(){

if(
state.crises.length>=
4
)
return;

const type=
CRISIS_TYPES[
Math.floor(
Math.random()*
CRISIS_TYPES.length
)
];

state.crises.push(
{

id:
"C"+
Date.now(),

type:
type.id,

title:
type.title,

severity:
type.severity,

remaining:
8+
Math.floor(
Math.random()*
12
)

}
);

type.effect();

addNews(
type.title,
"یک بحران جدید نیازمند تصمیم دولت است.",
"crisis"
);

}


/* =========================================================
   RESOLVE CRISIS
========================================================= */

function resolveCrisis(
id,
method
){

const crisis=
state.crises.find(
x=>
x.id===
id
);

if(
!crisis
)
return;

const actions={

money:{
cost:900,
effect:4
},

political:{
cost:500,
effect:3
},

science:{
cost:1100,
effect:5
}

};

const action=
actions[
method
];

if(
!action
)
return;

if(
state.money<
action.cost
)
{

toast(
"بودجه کافی نیست",
"bad"
);

return;

}

state.money-=
action.cost;

crisis.severity-=
action.effect;

crisis.remaining-=
3;

if(
method===
"science"
)
{

state.research+=
2;

}

if(
method===
"political"
)
{

state.reputation+=
.5;

}

if(
crisis.severity<=
0
||
crisis.remaining<=
0
)
{

state.crises=
state.crises.filter(
x=>
x.id!==
id
);

state.reputation+=
1;

state.approval+=
1;

addNews(
"✅ بحران پایان یافت",
`${crisis.title} مدیریت شد.`,
"crisis"
);

toast(
"✅ بحران مدیریت شد",
"good"
);

}

saveGame();

render();

openCrisisCenter();

}

function getGlobalPowerTable(){

.48;

Math.sqrt(
c.pop

3;

c.stability*
.15;

c.id===
state.player
)

playerPowerScore();

id:
c.id,

name:
c.name,

flag:
c.flag,

score:
score,

military:
c.id===
state.player
?
state.military
:
c.military

};

}
);

return list.sort(
(
a,
b
)=>
b.score-
a.score
);

}

/* =========================================================

========================================================= */

function randomDiplomacyEvent(){

if(
!state.started
)
return;

const candidates=
COUNTRIES.filter(
c=>
c.id!==
state.player
);

if(
!candidates.length
)
return;

const target=
candidates[
Math.floor(
Math.random()*
candidates.length
)
];

const positive=
Math.random()>
.45;

const amount=
positive
?
2+
Math.random()*
4
:
-(
2+
Math.random()*
4
);

changeRelation(
target.id,
amount
);

if(
Math.abs(
amount
)>
4
)
{

addNews(
positive
?
"🤝 بهبود روابط"
:
"🌐 تنش دیپلماتیک",
positive
?
`روابط با ${target.name} بهتر شد.`
:
`روابط با ${target.name} کمی تضعیف شد.`,
"diplomacy"
);

}

}

"function"

"function"

"function"
);

"TECH",
typeof openTechnology===
"function"
);

test(
"INTEL",
typeof openIntelligence===
"function"
);

test(
"CYBER",
typeof openCyberCenter===
"function"
);

test(

);

console.log(

}

Math.random()*
8;

if(
progress>=
100

{

100;

clearInterval(
timer
);

status.textContent=
"جهان آماده است";

fill.style.width=
"100%";

setTimeout(
()=>{

.style.transition=
"opacity .45s";

.style.opacity=
"0";

.style.pointerEvents=
"none";

selfTest();

500
);

}
else
{

const index=
Math.min(
messages.length-
2,
Math.floor(
progress/
8
)
);

status.textContent=
messages[
index
];

fill.style.width=
progress+
"%";

}

},
120
);

}
