/* =========================================================
   RESOLVE CRISIS
========================================================= */

function resolveCrisis(id,method)
{
    const crisis=
        state.crises.find(
            item=>item.id===id
        );

    if(!crisis)
    {
        return;
    }

    let reduction=0;

    if(method==="budget")
    {
        if(state.money<1100)
        {
            toast(
                "بودجه کافی نیست",
                "bad"
            );

            return;
        }

        state.money-=1100;

        reduction=3;
    }

    if(method==="political")
    {
        if(state.politicalCapital<10)
        {
            toast(
                "سرمایه سیاسی کافی نیست",
                "warn"
            );

            return;
        }

        state.politicalCapital-=10;

        reduction=2.5;
    }

    if(method==="technology")
    {
        if(state.research<8)
        {
            toast(
                "تحقیق کافی نیست",
                "warn"
            );

            return;
        }

        state.research-=8;

        reduction=3.5;
    }

    crisis.severity-=
        reduction;

    crisis.days-=3;

    if(crisis.severity<=0)
    {
        state.crises=
            state.crises.filter(
                item=>item.id!==id
            );

        state.stability+=2;
        state.approval+=1;
        state.reputation+=.5;

        state.statistics
            .crisesSolved++;

        addNews(
            "✅ بحران مهار شد",
            `${crisis.title} مدیریت شد.`,
            "crisis"
        );

        toast(
            "✅ بحران مهار شد",
            "good"
        );
    }

    normalizeState();

    saveGame();

    renderAll();

    openCrisisCenter();
}


/* =========================================================
   TERRITORY DAILY PROCESS
========================================================= */

function processTerritories()
{
    const lost=[];

    state.territories.forEach(
        id=>
        {
            const territory=
                state.territoryData[id];

            if(!territory)
            {
                initializeTerritory(
                    id,
                    id===state.player
                );

                return;
            }

            if(id===state.player)
            {
                territory.control=100;
                territory.loyalty=100;
                territory.unrest=
                    clamp(
                        territory.unrest-.03,
                        0,
                        100
                    );

                return;
            }

            const stabilityEffect=
                (
                    state.stability-50
                )*
                .0015;

            const loyaltyEffect=
                (
                    territory.loyalty-45
                )*
                .002;

            const unrestPenalty=
                territory.unrest*
                .0018;

            territory.control=
                clamp(
                    territory.control+
                    stabilityEffect+
                    loyaltyEffect-
                    unrestPenalty,
                    0,
                    100
                );

            territory.loyalty=
                clamp(
                    territory.loyalty+
                    (
                        territory.infrastructure-45
                    )*
                    .001+
                    (
                        state.approval-50
                    )*
                    .001-
                    state.taxRate*
                    .0007,
                    0,
                    100
                );

            territory.unrest=
                clamp(
                    territory.unrest+
                    (
                        50-territory.loyalty
                    )*
                    .002+
                    (
                        45-territory.stability
                    )*
                    .0015-
                    territory.infrastructure*
                    .0004,
                    0,
                    100
                );

            territory.stability=
                clamp(
                    territory.stability+
                    (
                        territory.loyalty-50
                    )*
                    .0008-
                    territory.unrest*
                    .0005,
                    0,
                    100
                );

            if(territory.reconstruction>0)
            {
                territory.reconstruction=
                    Math.max(
                        0,
                        territory.reconstruction-.05
                    );
            }

            if(
                territory.unrest>82&&
                Math.random()<.018
            )
            {
                territory.control=
                    Math.max(
                        0,
                        territory.control-7
                    );

                state.statistics
                    .revolts++;

                addNews(
                    "⚠️ شورش منطقه‌ای",
                    `شورش در ${country(id)?.name||id} رخ داد.`,
                    "territory"
                );

                toast(
                    `⚠️ شورش در ${country(id)?.name||id}`,
                    "warn"
                );
            }

            if(territory.control<=1)
            {
                lost.push(id);
            }
        }
    );

    lost.forEach(
        id=>
        loseTerritory(id)
    );
}


/* =========================================================
   LOSE TERRITORY
========================================================= */

function loseTerritory(id)
{
    if(id===state.player)
    {
        return;
    }

    if(!state.territories.includes(id))
    {
        return;
    }

    state.territories=
        state.territories.filter(
            territoryId=>
                territoryId!==id
        );

    delete state.territoryData[id];

    state.statistics.losses++;

    state.reputation-=2;

    state.influence-=1;

    setRelation(
        id,
        -55
    );

    addNews(
        "🏳️ از دست رفتن قلمرو",
        `${country(id)?.name||id} از کنترل حکومت خارج شد.`,
        "territory"
    );

    toast(
        `🏳️ ${country(id)?.name||id} از دست رفت`,
        "bad"
    );
}


/* =========================================================
   ECONOMIC DAILY PROCESS
========================================================= */

function processEconomy()
{
    const income=
        calculateDailyIncome();

    state.money+=
        Math.max(
            10,
            income
        );

    state.treasuryIncome=
        income;

    state.statistics
        .totalIncome+=
        Math.max(
            0,
            income
        );

    state.statistics
        .totalTax+=
        Math.max(
            0,
            income*
            state.taxRate/
            100
        );

    state.food+=
        4+
        (state.buildings.farm||0)*
        2.7-
        state.population*
        .010;

    state.energy+=
        3+
        (state.buildings.power||0)*
        2.5+
        (state.buildings.refinery||0)*
        .6-
        state.industry*
        .023;

    state.oil+=
        1.5+
        (state.buildings.refinery||0)*
        1.7-
        calculateMilitaryMaintenance()*
        .002;

    state.industry+=
        .018+
        (state.buildings.factory||0)*
        .009+
        state.logistics*
        .0003;

    state.research+=
        .05+
        (state.buildings.university||0)*
        .06+
        state.technology*
        .0007;

    state.population+=
        state.population*
        (
            .00004+
            state.stability*
            .0000006
        );

    state.command=
        clamp(
            state.command+.55,
            0,
            200
        );

    state.politicalCapital=
        clamp(
            state.politicalCapital+.12,
            0,
            200
        );

    const taxPressure=
        Math.max(
            0,
            state.taxRate-15
        )*
        .011;

    state.approval-=
        taxPressure;

    if(state.food<20)
    {
        state.approval-=.06;
        state.stability-=.035;
    }

    if(state.energy<20)
    {
        state.industry-=.025;
    }

    if(state.unemployment>14)
    {
        state.approval-=.025;
    }

    if(state.inflation>12)
    {
        state.approval-=.025;
        state.stability-=.012;
    }

    if(state.industry>60)
    {
        state.unemployment=
            Math.max(
                0,
                state.unemployment-.003
            );
    }

    state.inflation+=
        .002+
        Math.max(
            0,
            state.taxRate-25
        )*
        .0002;

    state.warExhaustion=
        Math.max(
            0,
            state.warExhaustion-.035
        );
}


/* =========================================================
   ACTIVE WAR DAILY PROCESS
========================================================= */

function processWars()
{
    state.wars
    .filter(
        war=>
            war.status==="war"
    )
    .forEach(
        war=>
        {
            war.days++;

            war.supply=
                clamp(
                    war.supply-
                    .05+
                    state.logistics*
                    .0006,
                    0,
                    100
                );

            war.enemyMorale=
                clamp(
                    war.enemyMorale-.012,
                    0,
                    100
                );

            state.warExhaustion+=.025;

            if(war.supply<20)
            {
                war.ourMorale=
                    clamp(
                        war.ourMorale-.04,
                        0,
                        100
                    );
            }

            if(war.enemyDefense<=0)
            {
                war.control=
                    clamp(
                        war.control+.05,
                        0,
                        100
                    );
            }

            checkWarVictory(war);
        }
    );
}


/* =========================================================
   TREATY PROCESS
========================================================= */

function processTreaties()
{
    state.treaties.forEach(
        treaty=>
        {
            treaty.days--;

            if(treaty.type==="trade")
            {
                state.money+=22;
                state.trade+=.008;
            }

            if(treaty.type==="nonAggression")
            {
                changeRelation(
                    treaty.country,
                    .002
                );
            }
        }
    );

    state.treaties=
        state.treaties.filter(
            treaty=>
                treaty.days>0
        );


    state.alliances.forEach(
        alliance=>
        {
            alliance.days--;

            changeRelation(
                alliance.country,
                .004
            );

            state.influence+=.002;
        }
    );

    state.alliances=
        state.alliances.filter(
            alliance=>
                alliance.days>0
        );


    state.sanctions.forEach(
        sanction=>
        {
            sanction.days--;

            changeRelation(
                sanction.country,
                -.002
            );
        }
    );

    state.sanctions=
        state.sanctions.filter(
            sanction=>
                sanction.days>0
        );
}


/* =========================================================
   CRISIS PROCESS
========================================================= */

function processCrises()
{
    state.crises.forEach(
        crisis=>
        {
            crisis.days--;

            if(crisis.days<=0)
            {
                state.stability-=2;
                state.approval-=2;
            }
        }
    );

    state.crises=
        state.crises.filter(
            crisis=>
                crisis.days>0
        );

    if(
        Math.random()<.006&&
        state.crises.length<2
    )
    {
        createCrisis();
    }
}


/* =========================================================
   AI COUNTRY INITIALIZATION
========================================================= */

function initializeCountryAI()
{
    COUNTRIES.forEach(
        item=>
        {
            if(!state.countryAI[item.id])
            {
                state.countryAI[item.id]=
                {
                    economy:
                        item.economy,

                    military:
                        item.military,

                    technology:
                        item.technology,

                    stability:
                        item.stability,

                    aggression:
                        20+
                        Math.random()*40,

                    treasury:
                        10000+
                        item.economy*
                        120,

                    lastAction:0
                };
            }
        }
    );
}


/* =========================================================
   AI WORLD TICK
========================================================= */

function processWorldAI()
{
    initializeCountryAI();

    COUNTRIES.forEach(
        item=>
        {
            if(
                item.id===state.player||
                state.territories.includes(
                    item.id
                )
            )
            {
                return;
            }

            const ai=
                state.countryAI[
                    item.id
                ];

            ai.treasury+=
                ai.economy*
                .5;

            ai.economy+=
                .002+
                Math.random()*
                .004;

            ai.technology+=
                .001+
                Math.random()*
                .003;

            ai.military+=
                Math.random()*
                .003;

            if(
                Math.random()<.002
            )
            {
                const relationChange=
                    Math.random()>.5
                    ? .2
                    : -.2;

                changeRelation(
                    item.id,
                    relationChange
                );
            }
        }
    );
}


/* =========================================================
   WORLD TENSION
========================================================= */

function processWorldTension()
{
    const activeWars=
        state.wars.filter(
            war=>
                war.status==="war"
        ).length;

    state.worldTension+=
        activeWars*.008;

    state.worldTension-=.006;

    state.worldTension=
        clamp(
            state.worldTension,
            0,
            100
        );
}

            stability:

    if(state.history.length>720)
    {
        state.history.splice(
            0,
            state.history.length-720

    }
}

function processAchievements()
{
    ACHIEVEMENT_LIST.forEach(
        achievement=>
        {
            if(
                state.achievements[
                    achievement.id
                ]
            )
            {
                return;
            }

            let unlocked=false;

            try
            {
                unlocked=
                    achievement.test();
            }
            catch(error)
            {
                unlocked=false;
            }

            if(!unlocked)
            {
                return;
            }

            state.achievements[
                achievement.id
            ]=true;

            state.money+=1000;

            state.reputation+=1;

            addNews(
                "🏆 دستاورد",
                `${achievement.name} باز شد.`,
                "achievement"
            );

            toast(
                `🏆 ${achievement.name}`,
                "good"
            );
        }
    );
}

/* =========================================================

========================================================= */

function declareWar(id)
{
    if(
        !state.started||
        !state.player
    )
    {
        return;
    }

    if(
        id===state.player||
        state.territories.includes(
            id
        )
    )
    {
        return;
    }

    const treaty=
        state.treaties.find(
            item=>
                item.country===id&&
                item.type==="nonAggression"&&
                item.days>0
        );

    if(treaty)
    {
        toast(
            "پیمان عدم تجاوز هنوز فعال است",
            "warn"
        );

        return;
    }

    if(
        state.wars.some(
            war=>
                war.enemy===id&&
                war.status==="war"
        )
    )
    {
        toast(
            "جنگ از قبل فعال است",
            "warn"
        );

        return;
    }

    if(state.command<10)
    {
        toast(
            "فرماندهی کافی نیست",
            "bad"
        );

        return;
    }

    state.command-=10;

    state.worldTension+=4;

    state.warExhaustion+=1;

    state.statistics.wars++;

    state.wars.push(
        {
            id:
                "WAR-"+
                Date.now(),

            enemy:id,

            status:"war",

            score:0,

            control:0,

            enemyDefense:100,

            enemyInfrastructure:100,

            enemyMorale:100,

            ourMorale:100,

            groundSuperiority:50,

            airSuperiority:50,

            navalSuperiority:50,

            supply:82,

            days:0
        }
    );

    setRelation(
        id,
        -100
    );

    addNews(
        "⚔️ اعلان جنگ",
        `جنگ با ${country(id)?.name||id} آغاز شد.`,
        "military"
    );

    saveGame();

    renderAll();

    openWarCenter();
}


/* =========================================================
   FINAL PLAYER WAR POWER
========================================================= */

function calculatePlayerWarPower()
{
    const doctrineBonus=
        Object.values(
            state.doctrines
        ).reduce(
            (
                sum,
                level
            )=>
                sum+
                number(level,0),
            0
        )*
        1.5;

    const supplyMultiplier=
        clamp(
            .65+
            state.logistics/
            160,
            .65,
            1.35
        );

    let power=0;

    power+=state.military;
    power+=state.technology*.40;
    power+=state.industry*.18;
    power+=state.command*.15;
    power+=equipmentPower()*.018;
    power+=doctrineBonus;

    power-=state.warExhaustion*.35;

    power*=supplyMultiplier;

    if(state.energy<15)
    {
        power*=.82;
    }

    if(state.oil<12)
    {
        power*=.86;
    }

    if(state.food<12)
    {
        power*=.90;
    }

    return Math.max(
        1,
        power
    );
}


/* =========================================================
   FINAL ENEMY POWER
========================================================= */

function calculateEnemyWarPower(id)
{
    const enemy=
        country(id);

    if(!enemy)
    {
        return 50;
    }

    initializeCountryAI();

    const ai=
        state.countryAI[id]||{};

    return (
        number(
            ai.military,
            enemy.military
        )*
        1.28+
        number(
            ai.economy,
            enemy.economy
        )*
        .29+
        number(
            ai.technology,
            enemy.technology
        )*
        .23+
        enemy.stability*
        .14+
        Math.random()*
        14
    );
}

========================================================= */

function reinforceWar(warId)
{
    const war=
        getWar(warId);

    if(
        !war||
        war.status!=="war"
    )
    {
        return;
    }

    if(state.money<750)
    {
        toast(
            "بودجه کافی نیست",
            "bad"
        );

        return;
    }

    if(state.energy<2)
    {
        toast(
            "انرژی کافی نیست",
            "warn"
        );

        return;
    }

    state.money-=750;
    state.energy-=2;

    war.supply=
        clamp(
            war.supply+14,
            0,
            100
        );

    war.ourMorale=
        clamp(
            war.ourMorale+5,
            0,
            100
        );

    state.command+=2;

    addNews(
        "🚚 تقویت جبهه",
        `تدارکات جبهه ${country(war.enemy)?.name||war.enemy} افزایش یافت.`,
        "military"
    );

    saveGame();

    renderAll();

    openWarCenter();
}


/* =========================================================
   GROUND OPERATION OVERRIDE
========================================================= */

function groundOperation(warId)
{
    const war=
        getWar(warId);

    if(
        !war||
        war.status!=="war"
    )
    {
        return;
    }

    if(
        state.command<5||
        state.energy<2||
        state.food<1
    )
    {
        toast(
            "منابع عملیات کافی نیست",
            "bad"
        );

        return;
    }

    state.command-=5;
    state.energy-=2;
    state.food-=1;

    const armor=
        categoryPower("tank");

    const infantrySupport=
        categoryPower("apc");

    const artillery=
        categoryPower("artillery");

    const ourPower=
        calculatePlayerWarPower()+
        armor*.020+
        infantrySupport*.012+
        artillery*.018;

    const enemyPower=
        calculateEnemyWarPower(
            war.enemy
        )+
        war.enemyDefense*.32;

    const supplyFactor=
        clamp(
            war.supply/80,
            .45,
            1.25
        );

    const moraleFactor=
        clamp(
            war.ourMorale/75,
            .55,
            1.25
        );

    const result=
        (
            ourPower*
            supplyFactor*
            moraleFactor-
            enemyPower+
            Math.random()*60-
            30
        )/
        22;

    war.score+=result;

    war.control=
        clamp(
            war.control+
            Math.max(
                -2.4,
                result*.68
            ),
            0,
            100
        );

    war.enemyDefense=
        clamp(
            war.enemyDefense-
            Math.max(
                .25,
                result*.38+
                .8
            ),
            0,
            100
        );

    war.enemyMorale=
        clamp(
            war.enemyMorale-
            Math.max(
                .2,
                result*.24+
                .5
            ),
            0,
            100
        );

    war.groundSuperiority=
        clamp(
            war.groundSuperiority+
            result*.6,
            0,
            100
        );

    war.supply=
        clamp(
            war.supply-2.4+
            state.logistics*.009,
            0,
            100
        );

    war.days++;

    state.warExhaustion+=.7;

    showFrontPulse(
        war.enemy
    );

    if(result>0)
    {
        toast(
            "✅ پیشروی زمینی",
            "good"
        );
    }
    else
    {
        toast(
            "⚠️ مقاومت دشمن",
            "warn"
        );
    }

    checkWarVictory(war);

    saveGame();

    renderAll();

    if(war.status==="war")
    {
        openWarCenter();
    }
}

/* =========================================================
   MISSILE INTERCEPTION CALCULATION
========================================================= */

function getEnemyInterceptionChance(id)
{
    const enemy=
        country(id);

    if(!enemy)
    {
        return 15;
    }

    initializeCountryAI();

    const ai=
        state.countryAI[id]||{};

    let chance=0;

    chance+=
        number(
            ai.military,
            enemy.military
        )*
        .13;

    chance+=
        number(
            ai.technology,
            enemy.technology
        )*
        .16;

    chance+=
        enemy.stability*
        .045;

    chance+=
        Math.random()*12;

    return clamp(
        chance,
        6,
        76
    );
}


/* =========================================================
   MISSILE LAUNCH OVERRIDE
========================================================= */

function launchMissile(warId,equipmentId)
{
    const war=
        getWar(warId);

    const missile=
        equipmentById(
            equipmentId
        );

    if(
        !war||
        !missile||
        war.status!=="war"
    )
    {
        return;
    }

    if(
        (state.inventory[equipmentId]||0)<=0
    )
    {
        toast(
            "موشک موجود نیست",
            "bad"
        );

        return;
    }

    if(
        state.command<4||
        state.energy<1
    )
    {
        toast(
            "منابع شلیک کافی نیست",
            "bad"
        );

        return;
    }

    state.inventory[
        equipmentId
    ]--;

    state.command-=4;

    state.energy-=1;

    state.statistics.launches++;

    closeModal();

    const start=
        mapPointToScreen(
            countryCenter(
                state.player
            )
        );

    const end=
        mapPointToScreen(
            countryCenter(
                war.enemy
            )
        );

    animateMissile(
        start,
        end,
        ()=>
        {
            const chance=
                getEnemyInterceptionChance(
                    war.enemy
                );

            const intercepted=
                Math.random()*100<
                chance;

            if(intercepted)
            {
                state.statistics
                    .interceptions++;

                const hitPoint=
                    {
                        x:
                            end.x-
                            25-
                            Math.random()*40,

                        y:
                            end.y-
                            25-
                            Math.random()*35
                    };

                animateInterceptor(
                    hitPoint,
                    ()=>
                    {
                        createExplosion(
                            hitPoint.x,
                            hitPoint.y
                        );
                    }
                );

                toast(
                    "🛡️ موشک رهگیری شد",
                    "warn"
                );
            }
            else
            {
                createExplosion(
                    end.x,
                    end.y
                );

                const damage=
                    missile.power*
                    (
                        .18+
                        Math.random()*.14
                    );

                war.enemyDefense=
                    clamp(
                        war.enemyDefense-
                        damage*.31,
                        0,
                        100
                    );

                war.enemyInfrastructure=
                    clamp(
                        war.enemyInfrastructure-
                        damage*.36,
                        0,
                        100
                    );

                war.enemyMorale=
                    clamp(
                        war.enemyMorale-
                        damage*.22,
                        0,
                        100
                    );

                war.score+=
                    damage*.09;

                toast(
                    "💥 برخورد موشک",
                    "good"
                );

                checkWarVictory(
                    war
                );
            }

            addNews(
                "🚀 شلیک موشک",
                `${missile.name} در جنگ با ${country(war.enemy)?.name||war.enemy} استفاده شد.`,
                "military"
            );

            saveGame();

            renderAll();
        }
    );
}


/* =========================================================
   CONQUEST OVERRIDE
========================================================= */

function conquerCountry(war)
{
    if(
        !war||
        state.territories.includes(
            war.enemy
        )
    )
    {
        return;
    }

    const enemy=
        country(
            war.enemy
        );

    state.territories.push(
        war.enemy
    );

    initializeTerritory(
        war.enemy,
        false
    );

    const territory=
        state.territoryData[
            war.enemy
        ];

    territory.control=64;
    territory.loyalty=43;
    territory.unrest=37;
    territory.stability=46;

    territory.infrastructure=
        Math.max(
            28,
            war.enemyInfrastructure*.68
        );

    territory.localIndustry=
        Math.max(
            8,
            Math.round(
                enemy.economy*
                .34
            )
        );

    territory.defense=35;

    territory.reconstruction=
        Math.round(
            100-
            war.enemyInfrastructure
        );

    war.status="won";

    state.statistics.wins++;

    state.statistics
        .territoriesTaken++;

    state.money+=1800;

    state.reputation+=2;

    state.influence+=3;

    state.worldTension+=2;

    state.warExhaustion=
        Math.max(
            0,
            state.warExhaustion-3
        );

    addNews(
        "🏆 فتح کشور",
        `${enemy?.name||war.enemy} به قلمرو شما اضافه شد.`,
        "military"
    );

    toast(
        `🏆 ${enemy?.name||war.enemy} فتح شد`,
        "good"
    );

    saveGame();

    renderAll();

    openTerritories();
}


/* =========================================================
   PEACE OVERRIDE
========================================================= */

function peaceWar(warId)
{
    const war=
        getWar(warId);

    if(
        !war||
        war.status!=="war"
    )
    {
        return;
    }

    war.status="peace";

    state.reputation+=1;

    state.worldTension=
        Math.max(
            0,
            state.worldTension-1
        );

    state.warExhaustion=
        Math.max(
            0,
            state.warExhaustion-2
        );

    changeRelation(
        war.enemy,
        8
    );

    state.treaties.push(
        {
            id:
                "TRUCE-"+
                Date.now(),

            country:
                war.enemy,

            type:
                "nonAggression",

            days:
                60
        }
    );

    addNews(
        "🕊️ پایان جنگ",
        `صلح با ${country(war.enemy)?.name||war.enemy} برقرار شد.`,
        "diplomacy"
    );

    saveGame();

    renderAll();

    openWarCenter();
}


/* =========================================================
   WAR VICTORY CHECK OVERRIDE
========================================================= */

function checkWarVictory(war)
{
    if(
        !war||
        war.status!=="war"
    )
    {
        return;
    }

    if(
        war.enemyDefense<=0&&
        war.enemyMorale<=20
    )
    {
        war.control=
            clamp(
                war.control+5,
                0,
                100
            );
    }

    if(
        war.control>=100||
        (
            war.enemyDefense<=0&&
            war.enemyMorale<=5
        )
    )
    {
        conquerCountry(war);
    }
}

/* =========================================================
   FINAL TERRITORY STABILIZE
========================================================= */

function stabilizeTerritory(id)
{
    const territory=
        state.territoryData[id];

    if(!territory)
    {
        return;
    }

    if(state.money<900)
    {
        toast(
            "بودجه کافی نیست",
            "bad"
        );

        return;
    }

    state.money-=900;

    territory.control=
        clamp(
            territory.control+8,
            0,
            100
        );

    territory.loyalty=
        clamp(
            territory.loyalty+7,
            0,
            100
        );

    territory.unrest=
        clamp(
            territory.unrest-9,
            0,
            100
        );

    territory.stability=
        clamp(
            territory.stability+6,
            0,
            100
        );

    state.reputation+=.3;

    saveGame();

    renderAll();

    openCountryPanel(id);
}


/* =========================================================
   FINAL TERRITORY INVEST
========================================================= */

function investTerritory(id)
{
    const territory=
        state.territoryData[id];

    if(!territory)
    {
        return;
    }

    if(state.money<1200)
    {
        toast(
            "بودجه کافی نیست",
            "bad"
        );

        return;
    }

    state.money-=1200;

    territory.infrastructure=
        clamp(
            territory.infrastructure+9,
            0,
            100
        );

    territory.localIndustry+=5;

    territory.loyalty=
        clamp(
            territory.loyalty+3,
            0,
            100
        );

    territory.unrest=
        clamp(
            territory.unrest-3,
            0,
            100
        );

    territory.reconstruction=
        Math.max(
            0,
            territory.reconstruction-8
        );

    state.industry+=.7;

    saveGame();

    renderAll();

    openCountryPanel(id);
}


/* =========================================================
   FINAL TERRITORY TAX
========================================================= */

function taxTerritory(id)
{
    const territory=
        state.territoryData[id];

    if(!territory)
    {
        return;
    }

    const income=
        Math.round(
            180+
            territory.localIndustry*15+
            territory.control*4+
            territory.infrastructure*2
        );

    state.money+=income;

    territory.loyalty=
        clamp(
            territory.loyalty-2.5,
            0,
            100
        );

    territory.unrest=
        clamp(
            territory.unrest+3,
            0,
            100
        );

    state.statistics
        .totalTax+=income;

    toast(
        `💰 ${formatMoney(income)} دریافت شد`,
        "good"
    );

    saveGame();

    renderAll();

    openCountryPanel(id);
}


/* =========================================================
   FINAL TERRITORY INCOME
========================================================= */

function calculateTerritoryIncome()
{
    let total=0;

    state.territories.forEach(
        id=>
        {
            const territory=
                state.territoryData[id];

            if(!territory)
            {
                return;
            }

            const control=
                territory.control/
                100;

            total+=
                (
                    territory.localIndustry*
                    .34+
                    territory.infrastructure*
                    .06+
                    territory.loyalty*
                    .025
                )*
                control;
        }
    );

    return total;
}

/* =========================================================
   MAP COLOR OVERRIDE
========================================================= */

function getCountryFill(item)
{
    if(
        state.territories.includes(
            item.id
        )
    )
    {
        return playerCountry().color;
    }

    if(state.mapMode==="military")
    {
        const strength=
            state.countryAI[
                item.id
            ]?.military||
            item.military;

        if(strength>=85)
        {
            return "#b94252";
        }

        if(strength>=70)
        {
            return "#cc7650";
        }

        if(strength>=55)
        {
            return "#c9a04b";
        }

        return "#4f9568";
    }

    if(state.mapMode==="economy")
    {
        const economy=
            state.countryAI[
                item.id
            ]?.economy||
            item.economy;

        if(economy>=85)
        {
            return "#3d9bd0";
        }

        if(economy>=70)
        {
            return "#4d8fc0";
        }

        if(economy>=55)
        {
            return "#5b8b92";
        }

        return "#716b70";
    }

    if(state.mapMode==="stability")
    {
        const stability=
            state.territoryData[
                item.id
            ]?.stability||
            item.stability;

        if(stability>=80)
        {
            return "#3c9a68";
        }

        if(stability>=60)
        {
            return "#8e9b55";
        }

        if(stability>=45)
        {
            return "#c98b49";
        }

        return "#b64a52";
    }

    return item.color;
}


/* =========================================================
   MAP RENDER OVERRIDE
========================================================= */

function renderMap()
{
    const countryLayer=
        $("countryLayer");

    const labelLayer=
        $("labelLayer");

    const capitalLayer=
        $("capitalLayer");

    countryLayer.innerHTML="";
    labelLayer.innerHTML="";
    capitalLayer.innerHTML="";

    const namespace=
        "http://www.w3.org/2000/svg";

    COUNTRIES.forEach(
        item=>
        {
            const polygon=
                document.createElementNS(
                    namespace,
                    "polygon"
                );

            polygon.setAttribute(
                "points",
                pointsToString(
                    item.points
                )
            );

            polygon.setAttribute(
                "fill",
                getCountryFill(item)
            );

            polygon.setAttribute(
                "data-id",
                item.id
            );

            polygon.classList.add(
                "countryShape"
            );

            if(
                state.territories.includes(
                    item.id
                )
            )
            {
                polygon.classList.add(
                    "owned"
                );
            }

            if(
                state.selectedCountry===
                item.id
            )
            {
                polygon.classList.add(
                    "selected"
                );
            }

            if(
                state.wars.some(
                    war=>
                        war.enemy===item.id&&
                        war.status==="war"
                )
            )
            {
                polygon.classList.add(
                    "enemy"
                );
            }

            polygon.addEventListener(
                "click",
                event=>
                {
                    event.stopPropagation();

                    state.selectedCountry=
                        item.id;

                    renderMap();

                    openCountryPanel(
                        item.id
                    );
                }
            );

            countryLayer.appendChild(
                polygon
            );


            const capitalRing=
                document.createElementNS(
                    namespace,
                    "circle"
                );

            capitalRing.setAttribute(
                "cx",
                item.capitalX
            );

            capitalRing.setAttribute(
                "cy",
                item.capitalY
            );

            capitalRing.setAttribute(
                "r",
                4.8
            );

            capitalRing.setAttribute(
                "class",
                "capitalRing"
            );

            capitalLayer.appendChild(
                capitalRing
            );


            const capitalDot=
                document.createElementNS(
                    namespace,
                    "circle"
                );

            capitalDot.setAttribute(
                "cx",
                item.capitalX
            );

            capitalDot.setAttribute(
                "cy",
                item.capitalY
            );

            capitalDot.setAttribute(
                "r",
                2.2
            );

            capitalDot.setAttribute(
                "class",
                "capitalDot"
            );

            capitalLayer.appendChild(
                capitalDot
            );


            const flag=
                document.createElementNS(
                    namespace,
                    "text"
                );

            flag.setAttribute(
                "x",
                item.labelX
            );

            flag.setAttribute(
                "y",
                item.labelY-10
            );

            flag.setAttribute(
                "class",
                "mapFlag"
            );

            flag.textContent=
                item.flag;

            labelLayer.appendChild(
                flag
            );


            const label=
                document.createElementNS(
                    namespace,
                    "text"
                );

            label.setAttribute(
                "x",
                item.labelX
            );

            label.setAttribute(
                "y",
                item.labelY+7
            );

            label.setAttribute(
                "class",
                item.points.length<9
                ? "mapLabel mapLabelSmall"
                : "mapLabel"
            );

            label.textContent=
                item.name;

            labelLayer.appendChild(
                label
            );
        }
    );

    applyMapTransform();
}

/* =========================================================
   POINTS STRING FIX
========================================================= */

function pointsToString(points)
{
    return points.map(
        point=>
            point[0]+
            ","+
            point[1]
    ).join(" ");
}


/* =========================================================
   MAP TRANSFORM FIX
========================================================= */

function applyMapTransform()
{
    $("mapTransform").style.transform=
        `translate(calc(-50% + ${state.mapX}px),calc(-50% + ${state.mapY}px)) scale(${state.mapZoom})`;
}


/* =========================================================
   ZOOM FIX
========================================================= */

function zoomMap(direction)
{
    state.mapZoom=
        clamp(
            state.mapZoom+
            direction*.12,
            .55,
            2.6
        );

    applyMapTransform();

    saveGame();
}


/* =========================================================
   RESET MAP
========================================================= */

function resetMapView()
{
    state.mapZoom=
        window.innerWidth<760
        ? .62
        : .90;

    state.mapX=0;

    state.mapY=
        window.innerWidth<760
        ? 35
        : 15;

    applyMapTransform();

    saveGame();
}

/* =========================================================
   WORLD RANKING OVERRIDE
========================================================= */

function worldRanking()
{
    initializeCountryAI();

    return COUNTRIES.map(
        item=>
        {
            let score;

            if(item.id===state.player)
            {
                score=
                    powerScore();
            }
            else
            {
                const ai=
                    state.countryAI[
                        item.id
                    ];

                score=
                    number(
                        ai?.military,
                        item.military
                    )*
                    .38+
                    number(
                        ai?.economy,
                        item.economy
                    )*
                    .30+
                    number(
                        ai?.technology,
                        item.technology
                    )*
                    .20+
                    item.stability*
                    .12;
            }

            return {
                id:item.id,
                name:item.name,
                flag:item.flag,
                score
            };
        }
    ).sort(
        (a,b)=>
            b.score-a.score
    );
}


/* =========================================================
   POWER SCORE OVERRIDE
========================================================= */

function powerScore()
{
    return (
        state.military*.30+
        state.industry*.20+
        state.technology*.20+
        state.stability*.10+
        state.reputation*.07+
        state.influence*.05+
        state.trade*.04+
        state.logistics*.04+
        state.territories.length*7+
        equipmentPower()*.012
    );
}


/* =========================================================
   EQUIPMENT COUNT FIX
========================================================= */

function equipmentCount()
{
    return Object.values(
        state.inventory
    ).reduce(
        (
            sum,
            amount
        )=>
            sum+
            number(
                amount,
                0
            ),
        0
    );
}


/* =========================================================
   EQUIPMENT POWER FIX
========================================================= */

function equipmentPower()
{
    let total=0;

    EQUIPMENT.forEach(
        item=>
        {
            total+=
                (
                    state.inventory[
                        item.id
                    ]||0
                )*
                item.power;
        }
    );

    return total;
}


/* =========================================================
   CATEGORY POWER FIX
========================================================= */

function categoryPower(type)
{
    let total=0;

    EQUIPMENT
    .filter(
        item=>
            item.type===type
    )
    .forEach(
        item=>
        {
            total+=
                (
                    state.inventory[
                        item.id
                    ]||0
                )*
                item.power;
        }
    );

    return total;
}

/* =========================================================
   BUY OVERRIDE
========================================================= */

function buyEquipment(id)
{
    const item=
        equipmentById(id);

    if(!item)
    {
        return;
    }

    if(state.technology<item.tech)
    {
        toast(
            "فناوری کافی نیست",
            "warn"
        );

        return;
    }

    if(state.money<item.cost)
    {
        toast(
            "بودجه کافی نیست",
            "bad"
        );

        return;
    }

    state.money-=item.cost;

    state.inventory[id]=
        (
            state.inventory[id]||
            0
        )+1;

    state.military+=
        item.power*.03;

    if(item.type==="airdef")
    {
        state.missileDefense+=
            item.defense*.025;
    }

    state.statistics
        .equipmentBought++;

    addNews(
        "🛒 خرید نظامی",
        `${item.name} خریداری شد.`,
        "military"
    );

    saveGame();

    renderAll();

    openStore(
        item.type
    );

    toast(
        `✅ ${item.name}`,
        "good"
    );
}


/* =========================================================
   SELL OVERRIDE
========================================================= */

function sellEquipment(id)
{
    const item=
        equipmentById(id);

    if(!item)
    {
        return;
    }

    if(
        (state.inventory[id]||0)<=0
    )
    {
        toast(
            "موجودی صفر است",
            "warn"
        );

        return;
    }

    state.inventory[id]--;

    state.money+=
        Math.round(
            item.cost*.55
        );

    state.military=
        Math.max(
            1,
            state.military-
            item.power*.018
        );

    saveGame();

    renderAll();

    openStore(
        item.type
    );
}

/* =========================================================
   DAILY MASTER
========================================================= */

function nextDay()
{
    if(
        !state.started||
        !state.player
    )
    {
        return;
    }

    state.day++;

    if(state.day>30)
    {
        state.day=1;

        state.month++;

        if(state.month>12)
        {
            state.month=1;

            state.year++;

            addNews(
                "📅 سال جدید",
                `سال ${state.year} آغاز شد.`,
                "world"
            );

            state.reputation+=.5;
        }
    }

    processEconomy();

    processTerritories();

    processWars();

    processTreaties();

    processCrises();

    processWorldAI();

    processWorldTension();

    processAchievements();

    state.statistics
        .daysPlayed++;

    if(
        state.statistics.daysPlayed%
        5===0
    )
    {
        recordHistory();
    }

    if(
        state.statistics.daysPlayed%
        7===0
    )
    {
        randomWorldEvent();
    }

    normalizeState();

    saveGame();

    renderAll();
}


/* =========================================================
   AUTO TIME
========================================================= */

let autoTimer=null;


function getAutoDelay()
{
    if(state.speed>=4)
    {
        return 450;
    }

    if(state.speed>=2)
    {
        return 850;
    }

    return 1500;
}


function startAutoTime()
{
    stopAutoTime();

    if(
        !state.autoTime||
        !state.started
    )
    {
        return;
    }

    autoTimer=
        setInterval(
            ()=>
            {
                nextDay();
            },
            getAutoDelay()
        );
}


function stopAutoTime()
{
    if(autoTimer)
    {
        clearInterval(
            autoTimer
        );

        autoTimer=null;
    }
}


function toggleAutoTime()
{
    state.autoTime=
        !state.autoTime;

    saveGame();

    if(state.autoTime)
    {
        startAutoTime();

        toast(
            "▶️ زمان خودکار فعال شد",
            "good"
        );
    }
    else
    {
        stopAutoTime();

        toast(
            "⏸️ زمان متوقف شد",
            "warn"
        );
    }
}


function setGameSpeed(value)
{
    state.speed=
        clamp(
            Number(value),
            1,
            4
        );

    saveGame();

    if(state.autoTime)
    {
        startAutoTime();
    }
}

/* =========================================================

========================================================= */

function loadGame()
{
    try
    {
        const raw=
            localStorage.getItem(
                SAVE_KEY
            );

        if(!raw)
        {
            return false;
        }

        const parsed=
            JSON.parse(
                raw
            );

        if(
            !parsed||
            typeof parsed!=="object"
        )
        {
            return false;
        }

        state=
            Object.assign(
                state,
                parsed
            );

        normalizeState();

        initializeCountryAI();

        return true;
    }
    catch(error)
    {
        console.warn(
            "LOAD ERROR",
            error
        );

        return false;
    }
}


/* =========================================================
   INITIAL TERRITORY FIX
========================================================= */

function initializeTerritory(id,core=false)
{
    const item=
        country(id);

    if(!item)
    {
        return;
    }

    if(
        state.territoryData[id]
    )
    {
        return;
    }

    state.territoryData[id]=
    {
        control:
            core
            ? 100
            : 58,

        loyalty:
            core
            ? 100
            : 45,

        unrest:
            core
            ? 4
            : 38,

        stability:
            core
            ? item.stability
            : 45,

        infrastructure:
            core
            ? 72
            : 48,

        localIndustry:
            Math.round(
                item.economy*.42
            ),

        localTax:10,

        defense:
            Math.round(
                item.military*.45
            ),

        food:60,

        energy:55,

        reconstruction:0
    };
}


/* =========================================================
   MAP COORDINATE FIX
========================================================= */

function countryCenter(id)
{
    const item=
        country(id);

    if(!item)
    {
        return {
            x:800,
            y:450
        };
    }

    return {
        x:
            item.capitalX||
            item.x||
            800,

        y:
            item.capitalY||
            item.y||
            450
    };
}


/* =========================================================
   SVG SCREEN POINT FIX
========================================================= */

function mapPointToScreen(point)
{
    const svg=
        $("worldMap");

    if(
        !svg||
        !svg.createSVGPoint
    )
    {
        return {
            x:
                window.innerWidth/2,

            y:
                window.innerHeight/2
        };
    }

    const svgPoint=
        svg.createSVGPoint();

    svgPoint.x=
        point.x;

    svgPoint.y=
        point.y;

    const matrix=
        svg.getScreenCTM();

    if(!matrix)
    {
        return {
            x:
                window.innerWidth/2,

            y:
                window.innerHeight/2
        };
    }

    const result=
        svgPoint.matrixTransform(
            matrix
        );

    return {
        x:result.x,
        y:result.y
    };
}


/* =========================================================
   MISSILE ANIMATION FIX
========================================================= */

function animateMissile(start,end,done)
{
    const element=
        document.createElement(
            "div"
        );

    element.className=
        "missile";

    $("fxLayer").appendChild(
        element
    );

    const startTime=
        performance.now();

    const distance=
        Math.hypot(
            end.x-start.x,
            end.y-start.y
        );

    const duration=
        clamp(
            850+
            distance*.8,
            900,
            1800
        );

    const arc=
        clamp(
            distance*.22,
            80,
            230
        );

    function frame(now)
    {
        const t=
            clamp(
                (
                    now-startTime
                )/
                duration,
                0,
                1
            );

        const ease=
            t<.5
            ? 2*t*t
            : 1-
              Math.pow(
                  -2*t+2,
                  2
              )/2;

        const x=
            start.x+
            (
                end.x-start.x
            )*
            ease;

        const linearY=
            start.y+
            (
                end.y-start.y
            )*
            ease;

        const y=
            linearY-
            Math.sin(
                Math.PI*t
            )*
            arc;

        const nextT=
            Math.min(
                1,
                t+.01
            );

        const nextEase=
            nextT<.5
            ? 2*nextT*nextT
            : 1-
              Math.pow(
                  -2*nextT+2,
                  2
              )/2;

        const nextX=
            start.x+
            (
                end.x-start.x
            )*
            nextEase;

        const nextLinearY=
            start.y+
            (
                end.y-start.y
            )*
            nextEase;

        const nextY=
            nextLinearY-
            Math.sin(
                Math.PI*nextT
            )*
            arc;

        const angle=
            Math.atan2(
                nextY-y,
                nextX-x
            )*
            180/
            Math.PI;

        element.style.left=
            x+"px";

        element.style.top=
            y+"px";

        element.style.transform=
            `translate(-50%,-50%) rotate(${angle}deg)`;

        if(t<1)
        {
            requestAnimationFrame(
                frame
            );
        }
        else
        {
            element.remove();

            if(done)
            {
                done();
            }
        }
    }

    requestAnimationFrame(
        frame
    );
}


/* =========================================================
   INTERCEPTOR FIX
========================================================= */

function animateInterceptor(end,done)
{
    const element=
        document.createElement(
            "div"
        );

    element.className=
        "interceptor";

    $("fxLayer").appendChild(
        element
    );

    const start=
    {
        x:end.x-70,
        y:end.y+100
    };

    const startTime=
        performance.now();

    const duration=
        470;

    function frame(now)
    {
        const t=
            clamp(
                (
                    now-startTime
                )/
                duration,
                0,
                1
            );

        const eased=
            1-
            Math.pow(
                1-t,
                2
            );

        const x=
            start.x+
            (
                end.x-start.x
            )*
            eased;

        const y=
            start.y+
            (
                end.y-start.y
            )*
            eased;

        element.style.left=
            x+"px";

        element.style.top=
            y+"px";

        if(t<1)
        {
            requestAnimationFrame(
                frame
            );
        }
        else
        {
            element.remove();

            if(done)
            {
                done();
            }
        }
    }

    requestAnimationFrame(
        frame
    );
}

/* =========================================================
   MAP DRAG SAFETY
========================================================= */

const viewport=
    $("mapViewport");


let finalPointer=
{
    active:false,
    moved:false,
    startClientX:0,
    startClientY:0,
    startMapX:0,
    startMapY:0
};


viewport.addEventListener(
    "pointerdown",
    event=>
    {
        finalPointer.active=true;
        finalPointer.moved=false;

        finalPointer.startClientX=
            event.clientX;

        finalPointer.startClientY=
            event.clientY;

        finalPointer.startMapX=
            state.mapX;

        finalPointer.startMapY=
            state.mapY;
    }
);


viewport.addEventListener(
    "pointermove",
    event=>
    {
        if(!finalPointer.active)
        {
            return;
        }

        const dx=
            event.clientX-
            finalPointer.startClientX;

        const dy=
            event.clientY-
            finalPointer.startClientY;

        if(
            Math.abs(dx)>3||
            Math.abs(dy)>3
        )
        {
            finalPointer.moved=true;
        }

        state.mapX=
            finalPointer.startMapX+
            dx;

        state.mapY=
            finalPointer.startMapY+
            dy;

        applyMapTransform();
    }
);


viewport.addEventListener(
    "pointerup",
    ()=>
    {
        finalPointer.active=false;

        saveGame();
    }
);


viewport.addEventListener(
    "pointercancel",
    ()=>
    {
        finalPointer.active=false;
    }
);


/* =========================================================
   WHEEL ZOOM
========================================================= */

viewport.addEventListener(
    "wheel",
    event=>
    {
        event.preventDefault();

        state.mapZoom=
            clamp(
                state.mapZoom+
                (
                    event.deltaY<0
                    ? .08
                    : -.08
                ),
                .55,
                2.6
            );

        applyMapTransform();
    },
    {
        passive:false
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>
    {
        const tag=
            event.target?.tagName;

        if(
            [
                "INPUT",
                "TEXTAREA",
                "SELECT"
            ].includes(tag)
        )
        {
            return;
        }

        if(event.key==="Escape")
        {
            closeModal();
        }

        if(
            event.key==="m"||
            event.key==="M"
        )
        {
            openMainMenu();
        }

        if(
            event.key==="s"||
            event.key==="S"
        )
        {
            openStore();
        }

        if(
            event.key==="a"||
            event.key==="A"
        )
        {
            openArmy();
        }

        if(
            event.key==="w"||
            event.key==="W"
        )
        {
            openWarCenter();
        }

        if(
            event.key==="e"||
            event.key==="E"
        )
        {
            openEconomy();
        }

        if(
            event.key==="d"||
            event.key==="D"
        )
        {
            openDiplomacy();
        }

        if(
            event.key==="t"||
            event.key==="T"
        )

            openTechnology();
        }

        if(event.code==="Space")
        {
            event.preventDefault();

            toggleAutoTime();
        }
    }
);


/* =========================================================
   AUTO SAVE
========================================================= */

let autosaveTimer=null;


function startAutosave()
{
    if(autosaveTimer)
    {
        clearInterval(
            autosaveTimer
        );
    }

    autosaveTimer=
        setInterval(
            ()=>
            {
                if(state.started)
                {
                    saveGame();
                }
            },
            12000
        );
}


/* =========================================================
   STARTUP
========================================================= */

function bootGame()
{
    ensureExtendedState();

    renderCountryChoices();

    const loaded=
        loadGame();

    if(
        loaded&&
        state.started&&
        state.player&&
        country(state.player)
    )
    {
        $("startScreen").style.display=
            "none";

        state.territories.forEach(
            id=>
            {
                if(
                    !state.territoryData[id]
                )
                {
                    initializeTerritory(
                        id,
                        id===state.player
                    );
                }
            }
        );

        if(
            !Number.isFinite(
                state.mapZoom
            )||
            state.mapZoom<=0
        )
        {
            resetMapView();
        }

        initializeCountryAI();

        renderAll();

        if(state.autoTime)
        {
            startAutoTime();
        }

        toast(
            "💾 ذخیره بازی بارگذاری شد",
            "good"
        );
    }
    else
    {
        $("startScreen").style.display=
            "flex";

        resetMapView();

        renderMap();
    }

    startAutosave();
}
