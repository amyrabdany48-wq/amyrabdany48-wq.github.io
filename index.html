<title>WORLD REVOLUTION — GRAND WAR</title>

<style>
:root{
--bg:#030711;
--bg2:#07111e;
--panel:rgba(8,17,31,.94);
--panel2:rgba(14,27,47,.94);
--line:rgba(255,255,255,.10);
--line2:rgba(40,220,255,.24);
--text:#eef8ff;
--muted:#7f97ae;
--cyan:#35ddff;
--blue:#3b86ff;
--green:#38df99;
--red:#ff526f;
--yellow:#ffd45f;
--purple:#a978ff;
--orange:#ff9a4c;
--shadow:0 24px 90px rgba(0,0,0,.58)

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
width:100%;
height:100%;
margin:0;
overflow:hidden;
background:var(--bg);
color:var(--text);
font-family:Tahoma,Arial,"Segoe UI",sans-serif
}

button,input,select{
font:inherit
}

button{
cursor:pointer
}

#world{
position:absolute;
inset:0;
background:
radial-gradient(
circle at 50% 40%,
rgba(18,62,91,.3),
transparent 34%
),
linear-gradient(
160deg,
#07111e,
#030711 70%
);
overflow:hidden
}

#mapCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
z-index:1
}

.gridfx{
position:absolute;
inset:0;
z-index:2;
pointer-events:none;
background:
linear-gradient(
rgba(70,170,230,.035) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(70,170,230,.035) 1px,
transparent 1px
);
background-size:42px 42px
}

.vignette{
position:absolute;
inset:0;
z-index:3;
pointer-events:none;
background:
radial-gradient(
circle,
transparent 38%,
rgba(0,0,0,.75) 115%
)
}

#topbar{
position:absolute;
z-index:20;
top:8px;
left:8px;
right:8px;
display:flex;
gap:6px;
align-items:stretch;
pointer-events:none
}

.brand,
.stat,
#rightPanel,
#dock,
#leftTools,
.floatBox{
backdrop-filter:blur(18px);
box-shadow:var(--shadow)
}

.brand{
width:225px;
border:1px solid var(--line);
border-radius:18px;
background:rgba(5,12,24,.93);
padding:10px 14px
}

.brand b{
font-size:14px;
color:var(--cyan);
letter-spacing:.6px
}

.brand small{
display:block;
margin-top:4px;
color:var(--muted);
font-size:8px
}

.stats{
flex:1;
display:flex;
gap:6px;
overflow:auto;
scrollbar-width:none
}

.stats::-webkit-scrollbar{
display:none
}

.stat{
min-width:92px;
border:1px solid var(--line);
border-radius:15px;
background:rgba(5,12,24,.92);
padding:8px 9px
}

.stat label{
display:block;
color:var(--muted);
font-size:8px
}

.stat strong{
display:block;
margin-top:4px;
font-size:12px
}

.stat.red strong{
color:var(--red)
}

.stat.green strong{
color:var(--green)
}

.stat.yellow strong{
color:var(--yellow)
}

.stat.purple strong{
color:var(--purple)
}

#leftTools{
position:absolute;
z-index:22;
top:86px;
left:8px;
display:flex;
flex-direction:column;
gap:6px;
padding:6px;
border:1px solid var(--line);
border-radius:16px;
background:rgba(5,12,24,.90)
}

.tool{
width:41px;
height:41px;
border:1px solid rgba(255,255,255,.08);
border-radius:12px;
background:rgba(255,255,255,.035);
color:#e7f8ff;
font-size:17px
}

.tool.on{
border-color:var(--cyan);
background:rgba(53,221,255,.14)
}

#rightPanel{
position:absolute;
z-index:18;
top:86px;
right:8px;
bottom:80px;
width:290px;
border:1px solid var(--line);
border-radius:20px;
background:var(--panel);
overflow:hidden

.panelHead{
height:48px;
padding:13px;
border-bottom:1px solid var(--line);
display:flex;
justify-content:space-between;
align-items:center
}

.panelHead b{
font-size:10px
}

.panelHead span{
font-size:8px;
color:var(--green)
}

#rankList{
height:calc(100% - 48px);
overflow:auto;
padding:8px
}

.rank{
display:flex;
gap:8px;
align-items:center;
padding:9px;
border-radius:13px;
border:1px solid rgba(255,255,255,.05);
background:rgba(255,255,255,.03);
margin-bottom:6px;
cursor:pointer
}

.rank:hover{
border-color:rgba(53,221,255,.23)
}

.rank .flag{
font-size:22px
}

.rank b{
font-size:10px
}

.rank small{
display:block;
color:var(--muted);
font-size:8px;
margin-top:2px
}

#dock{
position:absolute;
z-index:25;
bottom:7px;
left:50%;
transform:translateX(-50%);
width:min(1180px,calc(100vw - 15px));
display:flex;
gap:3px;
overflow:auto;
scrollbar-width:none;

#dock::-webkit-scrollbar{
display:none

.dockBtn{

min-width:64px;
border:0;
border-radius:13px;
background:transparent;
color:#87a0b8;
padding:6px

.dockBtn:hover{

.dockBtn span{
display:block
}

.dockIco{
font-size:18px
}

.dockTxt{
font-size:8px;
margin-top:3px;
font-weight:800

#modal{
position:fixed;
inset:0;
z-index:2000;
display:none;
align-items:center;
justify-content:center;
padding:12px;
background:rgba(0,0,0,.62);

#modal.show{
display:flex

.modalBox{

function economicAction(
type
){

const costs={

industry:900,

energy:800,

food:700,

steel:850,

oil:1000,

inflation:950

};

const cost=
costs[type];

if(
S.money<
cost
){

toast(
"بودجه کافی نیست"
);

return;

}

S.money-=cost;

if(
type==="industry"
){

S.industry+=10;
S.economy+=5;

}

if(
type==="energy"
){

S.energy+=15;
S.economy+=3;

}

if(
type==="food"
){

S.food+=16;
S.stability+=2;
S.unrest-=2;

}

if(
type==="steel"
){

S.steel+=18;
S.industry+=2;

}

if(
type==="oil"
){

S.oil+=16;
S.military+=1;

}

if(
type==="inflation"
){

S.inflation=
Math.max(
0,
S.inflation-1.25
);

S.stability+=2;

}

normalize();

render();

openEconomy();

}

function battleOperation(
warId,
type
){

const war=
S.wars.find(
w=>
w.id===warId
);

if(
!war ||
war.status!=="war"
)
return;

const commandCosts={

ground:6,

air:9,

artillery:7,

logistics:3

};

const fuelCosts={

ground:2,

air:8,

artillery:4,

logistics:1

};

const commandCost=
commandCosts[type];

const fuelCost=
fuelCosts[type];

if(
S.command<
commandCost
){

toast(
"فرماندهی کافی نیست"
);

return;

}

if(
S.oil<
fuelCost
){

toast(
"نفت کافی نیست"
);

return;

}

S.command-=
commandCost;

S.oil-=
fuelCost;

const enemy=
S.factions[
war.enemy
];

if(
!enemy
)
return;

let bonus=0;

if(
type==="ground"
){

bonus=
S.army.armor*2+
S.army.infantry*.25;

}

if(
type==="air"
){

bonus=
S.army.airForce*4+
S.technology*.18;

war.air+=4;

}

if(
type==="artillery"
){

bonus=
S.army.artillery*3+
S.technology*.11;

}

if(
type==="logistics"
){

war.supply=
clamp(
war.supply+13,
0,
100
);

war.morale+=2;

toast(
"تدارکات جبهه تقویت شد"
);

normalize();

render();

openWar();

return;

}

const ourPower=

S.military+

S.technology*.42+

S.warSupport*.25+

bonus+

Math.random()*65;

const enemyPower=

enemy.military+

enemy.technology*.34+

enemy.stability*.12+

Math.random()*65;

let result=
(
ourPower-
enemyPower
)/9;

if(
war.supply<
35
)
result*=.58;

if(
war.morale<
40
)
result*=.7;

if(
S.warExhaustion>
70
)
result*=.78;

war.score+=
result;

war.front=
clamp(
war.front+
result*.22,
0,
100
);

war.supply=
clamp(
war.supply-
(
type==="air"
?5
:3
),
0,
100
);

war.morale=
clamp(
war.morale+
(
result>0
?2.5
:-3
),
0,
100
);

war.casualties+=
Math.round(
Math.max(
1,
Math.abs(result)*3
)
);

S.manpower=
Math.max(
0,
S.manpower-
Math.max(
.1,
Math.abs(result)*.12
)
);

S.warExhaustion+=
.9+
Math.random()*1.7;

if(
result>0
){

toast(
"✅ عملیات موفق بود"
);

}

else{

toast(
"⚠️ عملیات با مشکل مواجه شد"
);

}

checkWarResult(
war
);

normalize();

render();

openWar();

}

function drawGrid(
ctx,
canvas
){

ctx.strokeStyle=
"rgba(70,180,230,.028)";

ctx.lineWidth=1;

const size=44;

for(
let x=0;
x<canvas.width;
x+=size
){

ctx.beginPath();

ctx.moveTo(
x,
0
);

ctx.lineTo(
x,
canvas.height
);

ctx.stroke();

}

for(
let y=0;
y<canvas.height;
y+=size
){

ctx.beginPath();

ctx.moveTo(
0,
y
);

ctx.lineTo(
canvas.width,
y
);

ctx.stroke();

}

}

ctx,
canvas
){

const g=
ctx.createRadialGradient(
canvas.width*.5,
canvas.height*.45,
60,
canvas.width*.5,
canvas.height*.45,
canvas.width*.72
);

g.addColorStop(
0,
"rgba(35,125,175,.10)"
);

g.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.fillStyle=g;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

}

color+"b8";

function loadGame(){

try{

const raw=
localStorage.getItem(
SAVE_KEY
);

if(
!raw
)
return false;

const saved=
JSON.parse(
raw
);

S={
...clone(
DEFAULT_STATE
),
...saved,

settings:{
...DEFAULT_STATE.settings,
...(saved.settings||{})
},

government:{
...DEFAULT_STATE.government,
...(saved.government||{})
},

army:{
...DEFAULT_STATE.army,
...(saved.army||{})
},

owned:{
...clone(
DEFAULT_STATE.owned
),
...(saved.owned||{})
}

};

return true;

}
catch(
error
){

console.error(
error
);

return false;

}

}

function buyAdvancedItem(id){

  ensureShopState();

  const item=
    ADVANCED_SHOP.find(
      x=>x.id===id
    );

  if(
    !item
  )
    return;

  if(
    S.money<
    item.cost
  ){

    toast(
      "بودجه کافی نیست"
    );

    return;

  }

  if(
    S.steel<
    (
      item.steel||0
    )
  ){

    toast(
      "فولاد کافی نیست"
    );

    return;

  }

  if(
    S.oil<
    (
      item.oil||0
    )
  ){

    toast(
      "نفت کافی نیست"
    );

    return;

  }

  S.money-=
    item.cost;

  S.steel-=
    item.steel||0;

  S.oil-=
    item.oil||0;

  S.shopInventory[id]=
    (
      S.shopInventory[id]||
      0
    )+1;

  if(
    item.military
  )
    S.military+=
      item.military;

  if(
    item.command
  )
    S.command+=
      item.command;

  if(
    item.intelligence
  )
    S.intelligence+=
      item.intelligence;

  if(
    item.stability
  )
    S.stability+=
      item.stability;

  if(
    item.industry
  )
    S.industry+=
      item.industry;

  if(
    item.energy
  )
    S.energy+=
      item.energy;

  normalize();

  render();

  openAdvancedShop();

  toast(
    `✅ ${item.name} خریداری شد`
  );

}

function researchAdvancedTech(id){

  const tech=
    ADVANCED_TECH_TREE.find(
      x=>x.id===id
    );

  if(
    !tech
  )
    return;

  if(
    S.technologies[id]
  ){

    toast(
      "این فناوری فعال است"
    );

    return;

  }

  if(
    S.technology<
    tech.requirement
  ){

    toast(
      "سطح فناوری کافی نیست"
    );

    return;

  }

  if(
    S.money<
    tech.cost
  ){

    toast(
      "بودجه کافی نیست"
    );

    return;

  }

  S.money-=
    tech.cost;

  S.technologies[id]=true;

  Object.entries(
    tech.effects
  )
  .forEach(
    ([key,value])=>{

      if(
        typeof S[key]==="number"
      ){

        S[key]+=value;

      }

    }
  );

  S.research+=
    tech.requirement*.03+
    2;

  normalize();

  render();

  openAdvancedTechnology();

  toast(
    "🧠 فناوری فعال شد"
  );

}

function upgradeAdvancedProject(id){

  const project=
    PROJECT_DATABASE.find(
      x=>x.id===id
    );

  if(
    !project
  )
    return;

  const level=
    S.projects[id]||0;

  const cost=
    Math.round(
      project.cost*
      Math.pow(
        1.24,
        level
      )
    );

  if(
    S.money<
    cost
  ){

    toast(
      "بودجه کافی نیست"
    );

    return;

  }

  S.money-=
    cost;

  S.projects[id]=
    level+1;

  if(
    project.type===
    "اقتصادی"
  ){

    S.economy+=
      project.effect;

  }

  if(
    project.type===
    "نظامی"
  ){

    S.military+=
      project.effect;

  }

  if(
    project.type===
    "زیرساخت"
  ){

    S.infrastructure=
      (
        S.infrastructure||0
      )+
      project.effect;

  }

  if(
    project.type===
    "صنعتی"
  ){

    S.industry+=
      project.effect;

  }

  if(
    project.type===
    "انرژی"
  ){

    S.energy+=
      project.effect*2;

  }

  if(
    project.type===
    "شهری"
  ){

    S.population+=
      project.effect*.02;

    S.stability+=
      project.effect*.1;

  }

  if(
    project.type===
    "پژوهشی"
  ){

    S.research+=
      project.effect;

    S.technology+=
      project.effect*.45;

  }

  if(
    project.type===
    "کشاورزی"
  ){

    S.food+=
      project.effect*2;

  }

  if(
    project.type===
    "سلامت"
  ){

    S.stability+=
      project.effect*.5;

    S.unrest-=
      project.effect*.15;

  }

  if(
    project.type===
    "لجستیک"
  ){

    S.command+=
      project.effect;

  }

  normalize();

  render();

  openAdvancedProjects();

  toast(
    "🏗️ پروژه توسعه یافت"
  );

}

    law.political

function missionProgress(
  mission
){

  if(
    mission.run===
    "industry"
  )
    return S.industry;

  if(
    mission.run===
    "military"
  )
    return S.military;

  if(
    mission.run===
    "technology"
  )
    return S.technology;

  if(
    mission.run===
    "alliances"
  )
    return S.alliances.length;

  if(
    mission.run===
    "economy"
  )
    return S.economy;

  if(
    mission.run===
    "stability"
  )
    return S.stability;

  return 0;

}

function openMissions(){

  openModal(

    "🎯 ماموریت‌های ملی",

    `

    <div class="grid">

      ${

        MISSIONS
        .map(
          mission=>{

            const progress=
              missionProgress(
                mission
              );

            const complete=
              S.missions[
                mission.id
              ];

            const pct=
              clamp(
                progress/
                mission.goal*
                100,
                0,
                100
              );

            return`

              <div class="card">

                <div class="cardHead">

                  <div class="cardIcon">
                    🎯
                  </div>

                  <div>

                    <b>
                      ${mission.title}
                    </b>

                    <small>
                      پاداش:
                      ${moneyText(
                        mission.reward
                      )}
                    </small>

                  </div>

                </div>

                <p>

                  پیشرفت:
                  ${Math.round(progress)}
                  /
                  ${mission.goal}

                </p>

                <div class="progress">
                  <i
                    style="
                      width:${pct}%;
                    "
                  ></i>
                </div>

                <button
                  class="btn yellow"
                  ${
                    complete
                    ||
                    progress<
                    mission.goal
                    ?"disabled"
                    :""
                  }
                  onclick="
                    claimMission(
                      '${mission.id}'
                    )
                  "
                >
                  ${
                    complete
                    ?"دریافت شد"
                    :
                    progress>=mission.goal
                    ?"دریافت پاداش"
                    :"در حال پیشرفت"
                  }
                </button>

              </div>

            `;

          }
        )
        .join("")

      }

    </div>

    `

  );

}

function claimMission(id){

  const mission=
    MISSIONS.find(
      x=>x.id===id
    );

  if(
    !mission
  )
    return;

  if(
    S.missions[id]
  )
    return;

  if(
    missionProgress(
      mission
    )<
    mission.goal
  ){

    toast(
      "ماموریت کامل نشده"
    );

    return;

  }

  S.missions[id]=true;

  S.money+=
    mission.reward;

  S.reputation+=
    2;

  S.influence+=
    1;

  addNews(
    "🏆 ماموریت تکمیل شد",
    mission.title,
    "mission"
  );

  render();

  openMissions();

  toast(
    "🏆 پاداش دریافت شد"
  );

}

   REVOLUTION COUNTER
   ============================================================== */

function revolutionRisk(){

  let risk=0;

  risk+=
    S.unrest*
    1.15;

  risk+=
    (100-S.legitimacy)*
    .65;

  risk+=
    S.corruption*
    .35;

  risk-=
    S.stability*
    .3;

  risk-=
    S.popularity*
    .15;

  return clamp(
    risk,
    0,
    100
  );

}

function revolutionCheck(){

  const risk=
    revolutionRisk();

  if(
    risk>
    85
  ){

    if(
      Math.random()<
      .015
    ){

      triggerRevolution();

    }

  }

  else if(
    risk>
    65
  ){

    if(
      Math.random()<
      .009
    ){

      addNews(
        "✊ شورش",
        "شورش‌های پراکنده در کشور شکل گرفت.",
        "revolution"
      );

      S.unrest+=
        4;

    }

  }

}

function triggerRevolution(){

  S.unrest=
    Math.max(
      0,
      S.unrest-8
    );

  S.legitimacy=
    Math.max(
      0,
      S.legitimacy-12
    );

  S.stability=
    Math.max(
      0,
      S.stability-10
    );

  S.politicalPower=
    Math.max(
      0,
      S.politicalPower-25
    );

  addNews(
    "🔥 انقلاب",
    "بحران سیاسی به مرحله انقلاب رسید.",
    "revolution"
  );

  toast(
    "🔥 انقلاب در کشور آغاز شد"
  );

}

/* ==============================================================
   EXTENDED ECONOMIC ENGINE
   ============================================================== */

function calculateDailyIncome(){

  const taxIncome=
    S.economy*
    .44;

  const industryIncome=
    S.industry*
    .34;

  const tradeIncome=
    S.influence*
    .18;

  const populationIncome=
    S.population*
    .035;

  const corruptionLoss=
    S.corruption*
    .12;

  const debtLoss=
    S.debt*
    .08;

  const inflationLoss=
    S.inflation*
    .13;

  let income=
    taxIncome+
    industryIncome+
    tradeIncome+
    populationIncome-
    corruptionLoss-
    debtLoss-
    inflationLoss;

  if(
    S.warSupport>
    65
  ){

    income-=
      S.economy*.03;

  }

  if(
    S.energy<
    40
  ){

    income-=
      S.economy*.06;

  }

  if(
    S.food<
    40
  ){

    income-=
      S.economy*.04;

  }

  return income;

}

function economySimulation(){

  const income=
    calculateDailyIncome();

  S.money+=
    income;

  if(
    S.money<
    100
  ){

    S.debt+=
      .25;

    S.inflation+=
      .02;

  }

  S.economy+=
    .008+
    (
      S.technology*
      .00028
    );

  S.industry+=
    .004;

  S.technology+=
    S.research*
    .00017;

  S.energy-=
    .025;

  S.food-=
    .018;

  if(
    S.tax>
    30
  ){

    S.popularity-=
      .012;

    S.unrest+=
      .012;

  }

  if(
    S.economy>
    100
  ){

    S.reputation+=
      .003;

  }

}

function socialSimulation(){

  if(
    S.food<
    30
  ){

    S.unrest+=
      .028;

    S.stability-=
      .018;

  }

  if(
    S.energy<
    25
  ){

    S.unrest+=
      .018;

    S.economy-=
      .025;

  }

  if(
    S.popularity>
    70
  ){

    S.unrest-=
      .01;

    S.stability+=
      .01;

  }

    S.stability+=
      .008;

  }

  if(
    S.corruption>

  ){

    S.unrest+=

  }

}

function militarySimulation(){

    S.wars.filter(
      w=>w.status==="war"
    );

  if(
    activeWars.length
  ){

    S.oil-=
      activeWars.length*
      .04;

    S.steel-=
      activeWars.length*
      .025;

      activeWars.length*
      .015;

    S.warSupport+=

function advanceDay(){

    return;

  S.day++;

  if(
    S.day>
    daysInMonth(
      S.month,
      S.year

      S.year++;

  }

}

/* ==============================================================
   AI EXTENDED BEHAVIOR
   ============================================================== */

function aiTurn(){

  setupFactions();

  FACTIONS
  .forEach(
    faction=>{

      if(
        faction.id===
        S.player
      )
        return;

      const f=
        S.factions[
          faction.id
        ];

      if(
        !f
      )
        return;

      const action=
        Math.floor(
          Math.random()*8
        );

      if(
        action===0
      ){

        f.economy+=
          .12+
          Math.random()*.25;

      }

      else if(
        action===1
      ){

        f.military+=
          .10+
          Math.random()*.32;

      }

      else if(
        action===2
      ){

        f.technology+=
          .08+
          Math.random()*.25;

      }

      else if(
        action===3
      ){

        f.stability+=
          Math.random()*.25;

      }

      else if(
        action===4
      ){

        f.unrest+=
          (
            Math.random()-.5
          )*
          .7;

      }

      else if(
        action===5
      ){

        const old=
          S.relations[
            faction.id
          ]||
          0;

        S.relations[
          faction.id
        ]=
          clamp(
            old+
            (
              Math.random()>
              .5
              ?1
              :-1
            ),
            -100,
            100
          );

      }

      else if(
        action===6
      ){

        f.loyalty=
          clamp(
            f.loyalty+
            (
              Math.random()-.5
            ),
            0,
            100
          );

      }

      else{

        f.economy+=
          .05;

        f.technology+=
          .03;

      }

      f.economy=
        clamp(
          f.economy,
          10,
          200
        );

      f.military=
        clamp(
          f.military,
          10,
          200
        );

      f.technology=
        clamp(
          f.technology,
          10,
          200
        );

      f.stability=
        clamp(
          f.stability,
          0,
          100
        );

      f.unrest=
        clamp(
          f.unrest,
          0,
          100
        );

    }
  );

}

  const amount=10;

  let available=0;

  if(
    id===
    "steel"
  )
    available=
      S.steel;

  if(
    id===
    "oil"
  )
    available=
      S.oil;

  if(
    id===

      S.food;

  if(

  const price=

function diplomaticPressure(){

  FACTIONS
  .forEach(
    f=>{

      if(
        f.id===
        S.player
      )
        return;

      const relation=
        S.relations[
          f.id
        ]||
        0;

      const target=
        S.factions[
          f.id
        ];

      if(
        !target
      )
        return;

      if(
        relation>
        70
      ){

        target.stability+=
          .015;

      }

      if(
        relation<
        -70
      ){

        target.unrest+=
          .018;

      }

    }
  );

}

   ============================================================== */

let lastAdvancedTick=
  performance.now();

let advancedAccumulator=
  0;

function advancedLoop(
  now
){

  const delta=
    now-
    lastAdvancedTick;

  lastAdvancedTick=
    now;

  if(
    S.started&&
    !S.settings.paused
  ){

    advancedAccumulator+=
      delta;

    const interval=
      1150/
      Math.max(
        1,
        S.settings.speed
      );

    while(
      advancedAccumulator>=
      interval
    ){

      advancedAccumulator-=
        interval;

      advancedDailyTick();

      supplyWarFronts();

      diplomaticPressure();

    }

  }

  requestAnimationFrame(
    advancedLoop
  );

}

/* ==============================================================
   MORE KEYBOARD SHORTCUTS
   ============================================================== */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.target &&
      event.target.tagName===
      "INPUT"
    )
      return;

    if(
      event.key==="8"
    )
      openAdvancedShop();

    if(
      event.key==="9"
    )
      openAdvancedTechnology();

    if(
      event.key==="0"
    )
      openGenerals();

    if(
      event.key==="q"||
      event.key==="Q"
    )
      openQuickCommand();

  }
);

/* ==============================================================
   FINAL UI RECOLOR
   ============================================================== */

function updateDynamicColors(){

  if(
    !S.started
  )
    return;

  const economy=
    document.getElementById(
      "economy"
    );

  const military=
    document.getElementById(
      "military"
    );

  const tech=
    document.getElementById(
      "technology"
    );

  const unrest=
    document.getElementById(
      "unrest"
    );

  const legitimacy=
    document.getElementById(
      "legitimacy"
    );

  if(
    economy
  ){

    economy.style.color=
      S.economy>100
        ?"var(--green)"
        :S.economy<40
        ?"var(--red)"
        :"var(--yellow)";

  }

  if(
    military
  ){

    military.style.color=
      S.military>100
        ?"var(--red)"
        :"#ff8495";

  }

  if(
    tech
  ){

    tech.style.color=
      S.technology>100
        ?"var(--purple)"
        :"#c29cff";

  }

  if(
    unrest
  ){

    unrest.style.color=
      S.unrest>65
        ?"var(--red)"
        :
        S.unrest>40
        ?"var(--yellow)"
        :"var(--green)";

  }

  if(
    legitimacy
  ){

    legitimacy.style.color=
      S.legitimacy<40
        ?"var(--red)"
        :
        S.legitimacy<65
        ?"var(--yellow)"
        :"var(--green)";

  }

}

setInterval(
  updateDynamicColors,
  400
);

/* ==============================================================
   WORLD STATUS POPUP
   ============================================================== */

function openWorldStatus(){

  const activeWars=
    S.wars.filter(
      w=>w.status==="war"
    ).length;

  const strongest=
    FACTIONS
    .map(
      f=>({

        f,

        score:
          S.factions[f.id].economy+
          S.factions[f.id].military+
          S.factions[f.id].technology

      })
    )
    .sort(
      (a,b)=>
        b.score-
        a.score
    )[0];

  openModal(

    "🌍 وضعیت زنده جهان",

    `

    <div class="kpis">

      ${kpi(
        "جنگ‌های فعال",
        activeWars
      )}

      ${kpi(
        "قدرت برتر",
        strongest?.f.name||
        "نامشخص"
      )}

      ${kpi(
        "اقتصاد شما",
        Math.round(
          S.economy
        )
      )}

      ${kpi(
        "ناآرامی",
        Math.round(
          S.unrest
        )+"%"
      )}

    </div>

    <div class="grid">

      <div class="card">

        <b>
          📊 سلامت دولت
        </b>

        <p>

          مشروعیت:
          ${Math.round(
            S.legitimacy
          )}%

          <br>

          ثبات:
          ${Math.round(
            S.stability
          )}%

          <br>

          فساد:
          ${Math.round(
            S.corruption
          )}%

        </p>

      </div>

      <div class="card">

        <b>
          💰 وضعیت مالی
        </b>

        <p>

          خزانه:
          ${moneyText(S.money)}

          <br>

          بدهی:
          ${Math.round(S.debt)}

          <br>

          تورم:
          ${S.inflation.toFixed(1)}%

        </p>

      </div>

      <div class="card">

        <b>
          ⚔️ وضعیت نظامی
        </b>

        <p>

          قدرت:
          ${Math.round(S.military)}

          <br>

          فرماندهی:
          ${Math.round(S.command)}

          <br>

          فرسایش:
          ${Math.round(S.warExhaustion)}%

        </p>

      </div>

      <div class="card">

        <b>
          🧠 وضعیت علمی
        </b>

        <p>

          فناوری:
          ${Math.round(S.technology)}

          <br>

          پژوهش:
          ${Math.round(S.research)}

          <br>

          اطلاعات:
          ${Math.round(S.intelligence)}

        </p>

      </div>

    </div>

    `

  );

}
