/* =========================================================
   EQUAL EARTH PROJECTION
   AREA DISTORTION MUCH LOWER THAN EQUIRECTANGULAR
========================================================= */

const GD_EQ_A1=
    1.340264;

const GD_EQ_A2=
    -0.081106;

const GD_EQ_A3=
    0.000893;

const GD_EQ_A4=
    0.003796;

const GD_EQ_M=
    Math.sqrt(
        3
    )/
    2;

const GD_DEG=
    Math.PI/
    180;


function GDEqualEarthRaw(
    longitude,
    latitude
)
{
    const lambda=
        longitude*
        GD_DEG;

    const phi=
        Math.max(
            -89.999999,
            Math.min(
                89.999999,
                latitude
            )
        )*
        GD_DEG;

    const theta=
        Math.asin(
            GD_EQ_M*
            Math.sin(
                phi
            )
        );

    const theta2=
        theta*
        theta;

    const theta6=
        theta2*
        theta2*
        theta2;

    const denominator=
        3*
        (
            9*
            GD_EQ_A4*
            theta6*
            theta2
            +
            7*
            GD_EQ_A3*
            theta6
            +
            3*
            GD_EQ_A2*
            theta2
            +
            GD_EQ_A1
        );

    const x=
        2*
        Math.sqrt(
            3
        )*
        lambda*
        Math.cos(
            theta
        )/
        denominator;

    const y=
        theta*
        (
            GD_EQ_A4*
            theta6*
            theta2
            +
            GD_EQ_A3*
            theta6
            +
            GD_EQ_A2*
            theta2
            +
            GD_EQ_A1
        );

    return[
        x,
        y
    ];
}


const GD_EQ_X_MAX=
    Math.abs(
        GDEqualEarthRaw(
            180,
            0
        )[0]
    );

const GD_EQ_Y_MAX=
    Math.abs(
        GDEqualEarthRaw(
            0,
            90
        )[1]
    );


function GDProject(
    coordinate
)
{
    if(
        !coordinate||
        coordinate.length<
        2
    ){
        return[
            800,
            400
        ];
    }

    let longitude=
        Number(
            coordinate[0]
        );

    let latitude=
        Number(
            coordinate[1]
        );

    if(
        !Number.isFinite(
            longitude
        )
    ){
        longitude=
            0;
    }

    if(
        !Number.isFinite(
            latitude
        )
    ){
        latitude=
            0;
    }

    while(
        longitude>
        180
    ){
        longitude-=
            360;
    }

    while(
        longitude<
        -180
    ){
        longitude+=
            360;
    }

    latitude=
        Math.max(
            -90,
            Math.min(
                90,
                latitude
            )
        );

    const raw=
        GDEqualEarthRaw(
            longitude,
            latitude
        );

    const x=
        800+
        raw[0]/
        GD_EQ_X_MAX*
        770;

    const y=
        400-
        raw[1]/
        GD_EQ_Y_MAX*
        355;

    return[
        x,
        y
    ];
}

function GDFeatureCode(
    feature
)
{
    const properties=
        feature&&
        feature.properties
        ?
        feature.properties
        :
        {};

    const candidates=
    [
        properties.ISO_A2_EH,
        properties.ISO_A2,
        properties.WB_A2,
        properties.POSTAL,
        properties.ADM0_A3_US,
        properties.iso_a2,
        properties.ISO2,
        properties["ISO3166-1-Alpha-2"]
    ];

    for(
        const candidate of
        candidates
    ){
        if(
            typeof candidate===
            "string"
        ){
            const code=
                candidate
                .trim()
                .toUpperCase();

            if(
                /^[A-Z]{2}$/
                .test(
                    code
                )&&
                code!==
                "-99"
            ){
                return code;
            }
        }
    }

    const names=
    [
        properties.ADMIN,
        properties.NAME,
        properties.NAME_EN,
        properties.name,
        properties.SOVEREIGNT,
        properties.BRK_NAME
    ];

    for(
        const name of
        names
    ){
        if(
            GD_NAME_FIX[
                name
            ]
        ){
            return GD_NAME_FIX[
                name
            ];
        }

        if(
            typeof COUNTRY_EN!==
            "undefined"&&
            COUNTRY_EN
        ){
            for(
                const[
                    code,
                    english
                ]of
                Object.entries(
                    COUNTRY_EN
                )
            ){
                if(
                    String(
                        english
                    )
                    .toLowerCase()===
                    String(
                        name||
                        ""
                    )
                    .toLowerCase()
                ){
                    return code;
                }
            }
        }
    }

    return null;
}


/* =========================================================
   DISTANCE HELPERS
========================================================= */

function GDSquaredDistance(
    a,
    b
)
{
    const dx=
        a[0]-
        b[0];

    const dy=
        a[1]-
        b[1];

    return dx*
    dx+
    dy*
    dy;
}


function GDSegmentDistanceSquared(
    point,
    start,
    end
)
{
    let x=
        start[0];

    let y=
        start[1];

    let dx=
        end[0]-
        x;

    let dy=
        end[1]-
        y;

    if(
        dx!==
        0||
        dy!==
        0
    ){
        const t=
            (
                (
                    point[0]-
                    x
                )*
                dx+
                (
                    point[1]-
                    y
                )*
                dy
            )/
            (
                dx*
                dx+
                dy*
                dy
            );

        if(
            t>
            1
        ){
            x=
                end[0];

            y=
                end[1];
        }
        else if(
            t>
            0
        ){
            x+=
                dx*
                t;

            y+=
                dy*
                t;
        }
    }

    dx=
        point[0]-
        x;

    dy=
        point[1]-
        y;

    return dx*
    dx+
    dy*
    dy;
}


/* =========================================================
   RADIAL SIMPLIFICATION
========================================================= */

function GDRadialSimplify(
    points,
    toleranceSquared
)
{
    if(
        points.length<=
        4
    ){
        return points;
    }

    let previous=
        points[0];

    const result=
    [
        previous
    ];

    for(
        let index=
            1;
        index<
            points.length;
        index++
    ){
        const point=
            points[index];

        if(
            GDSquaredDistance(
                point,
                previous
            )>
            toleranceSquared
        ){
            result.push(
                point
            );

            previous=
                point;
        }
    }

    const last=
        points[
            points.length-
            1
        ];

    if(
        previous!==
        last
    ){
        result.push(
            last
        );
    }

    return result;
}


/* =========================================================
   DOUGLAS PEUCKER
========================================================= */

function GDDPStep(
    points,
    first,
    last,
    toleranceSquared,
    result
)
{
    let maxDistance=
        toleranceSquared;

    let index=
        -1;

    for(
        let current=
            first+
            1;
        current<
            last;
        current++
    ){
        const distance=
            GDSegmentDistanceSquared(
                points[current],
                points[first],
                points[last]
            );

        if(
            distance>
            maxDistance
        ){
            index=
                current;

            maxDistance=
                distance;
        }
    }

    if(
        index>
        -1
    ){
        if(
            index-
            first>
            1
        ){
            GDDPStep(
                points,
                first,
                index,
                toleranceSquared,
                result
            );
        }

        result.push(
            points[index]
        );

        if(
            last-
            index>
            1
        ){
            GDDPStep(
                points,
                index,
                last,
                toleranceSquared,
                result
            );
        }
    }
}


function GDDouglasPeucker(
    points,
    toleranceSquared
)
{
    if(
        points.length<=
        4
    ){
        return points;
    }

    const last=
        points.length-
        1;

    const result=
    [
        points[0]
    ];

    GDDPStep(
        points,
        0,
        last,
        toleranceSquared,
        result
    );

    result.push(
        points[last]
    );

    return result;
}


function GDSimplifyProjected(
    points,
    tolerance
)
{
    if(
        points.length<=
        5
    ){
        return points;
    }

    const toleranceSquared=
        tolerance*
        tolerance;

    let simplified=
        GDRadialSimplify(
            points,
            toleranceSquared*
            .55
        );

    simplified=
        GDDouglasPeucker(
            simplified,
            toleranceSquared
        );

    return simplified;
}


/* =========================================================
   RING PREPROCESSING
========================================================= */

function GDNormalizeLongitude(
    longitude
)
{
    let value=
        longitude;

    while(
        value>
        180
    ){
        value-=
            360;
    }

    while(
        value<
        -180
    ){
        value+=
            360;
    }

    return value;
}


function GDPrepareRing(
    ring
)
{
    if(
        !Array.isArray(
            ring
        )||
        ring.length<
        4
    ){
        return[];
    }

    const segments=
        [];

    let segment=
        [];

    let previousLongitude=
        null;

    for(
        let index=
            0;
        index<
            ring.length;
        index++
    ){
        const coordinate=
            ring[index];

        if(
            !coordinate||
            coordinate.length<
            2
        ){
            continue;
        }

        const longitude=
            GDNormalizeLongitude(
                Number(
                    coordinate[0]
                )
            );

        const latitude=
            Number(
                coordinate[1]
            );

        if(
            !Number.isFinite(
                longitude
            )||
            !Number.isFinite(
                latitude
            )
        ){
            continue;
        }

        if(
            previousLongitude!==
            null&&
            Math.abs(
                longitude-
                previousLongitude
            )>
            180
        ){
            if(
                segment.length>=
                3
            ){
                segments.push(
                    segment
                );
            }

            segment=
                [];
        }

        segment.push(
            [
                longitude,
                latitude
            ]
        );

        previousLongitude=
            longitude;
    }

    if(
        segment.length>=
        3
    ){
        segments.push(
            segment
        );
    }

    return segments;
}


/* =========================================================
   RING TO PATH
========================================================= */

function GDRingToPath(
    ring,
    tolerance
)
{
    const geoSegments=
        GDPrepareRing(
            ring
        );

    let result=
        "";

    for(
        const geoSegment of
        geoSegments
    ){
        if(
            geoSegment.length<
            3
        ){
            continue;
        }

        const projected=
            geoSegment.map(
                GDProject
            );

        let simplified=
            GDSimplifyProjected(
                projected,
                tolerance
            );

        if(
            simplified.length<
            3
        ){
            simplified=
                projected;
        }

        if(
            simplified.length<
            3
        ){
            continue;
        }

        result+=
            "M"+
            simplified[0][0]
            .toFixed(
                2
            )+
            ","+
            simplified[0][1]
            .toFixed(
                2
            );

        for(
            let index=
                1;
            index<
                simplified.length;
            index++
        ){
            result+=
                "L"+
                simplified[index][0]
                .toFixed(
                    2
                )+
                ","+
                simplified[index][1]
                .toFixed(
                    2
                );
        }

        result+=
            "Z";
    }

    return result;
}


/* =========================================================
   GEOMETRY TO PATH
========================================================= */

function GDGeometryPath(
    geometry,
    tolerance
)
{
    if(
        !geometry
    ){
        return "";
    }

    let result=
        "";

    if(
        geometry.type===
        "Polygon"
    ){
        for(
            const ring of
            geometry.coordinates
        ){
            result+=
                GDRingToPath(
                    ring,
                    tolerance
                );
        }

        return result;
    }

    if(
        geometry.type===
        "MultiPolygon"
    ){
        for(
            const polygon of
            geometry.coordinates
        ){
            for(
                const ring of
                polygon
            ){
                result+=
                    GDRingToPath(
                        ring,
                        tolerance
                    );
            }
        }

        return result;
    }

    return "";
}


/* =========================================================
   GEOMETRY CENTER
========================================================= */

function GDGeometryCenter(
    geometry
)
{
    if(
        !geometry
    ){
        return[
            800,
            400
        ];
    }

    let totalX=
        0;

    let totalY=
        0;

    let totalWeight=
        0;


    function processRing(
        ring
    )
    {
        if(
            !ring||
            ring.length<
            3
        ){
            return;
        }

        const step=
            Math.max(
                1,
                Math.floor(
                    ring.length/
                    180
                )
            );

        for(
            let index=
                0;
            index<
                ring.length;
            index+=
                step
        ){
            const coordinate=
                ring[index];

            if(
                !coordinate
            ){
                continue;
            }

            const projected=
                GDProject(
                    coordinate
                );

            totalX+=
                projected[0];

            totalY+=
                projected[1];

            totalWeight++;
        }
    }


    if(
        geometry.type===
        "Polygon"
    ){
        if(
            geometry.coordinates[0]
        ){
            processRing(
                geometry.coordinates[0]
            );
        }
    }


    if(
        geometry.type===
        "MultiPolygon"
    ){
        for(
            const polygon of
            geometry.coordinates
        ){
            if(
                polygon[0]
            ){
                processRing(
                    polygon[0]
                );
            }
        }
    }


    if(
        totalWeight<=
        0
    ){
        return[
            800,
            400
        ];
    }

    return[
        totalX/
        totalWeight,

        totalY/
        totalWeight
    ];
}


/* =========================================================
   COLOR PALETTE
========================================================= */

function GDHash(
    text
)
{
    let hash=
        2166136261;

    const value=
        String(
            text
        );

    for(
        let index=
            0;
        index<
            value.length;
        index++
    ){
        hash^=
            value.charCodeAt(
                index
            );

        hash=
            Math.imul(
                hash,
                16777619
            );
    }

    return hash>>>
    0;
}


function GDPoliticalColor(
    code
)
{
    return GD_MAP_COLORS[
        GDHash(
            code
        )%
        GD_MAP_COLORS.length
    ];
}


/* =========================================================
   GAME STATE SAFE HELPERS
========================================================= */

function GDPlayerCode()
{
    if(
        typeof state===
        "undefined"||
        !state
    ){
        return null;
    }

    return state.player||
    state.playerId||
    null;
}


function GDSelectedCode()
{
    if(
        typeof state===
        "undefined"||
        !state
    ){
        return null;
    }

    return state.selected||
    state.selectedCountryId||
    null;
}


function GDMapMode()
{
    if(
        typeof state===
        "undefined"||
        !state
    ){
        return "political";
    }

    return state.map&&
    state.map.mode
    ?
    state.map.mode
    :
    "political";
}


function GDRelation(
    code
)
{
    try{
        if(
            typeof relation===
            "function"
        ){
            return Number(
                relation(
                    code
                )
            )||
            0;
        }
    }
    catch(
        error
    ){
    }

    try{
        return Number(
            state.relations&&
            state.relations[
                code
            ]
        )||
        0;
    }
    catch(
        error
    ){
        return 0;
    }
}


function GDIsAlly(
    code
)
{
    try{
        if(
            typeof isAlly===
            "function"
        ){
            return Boolean(
                isAlly(
                    code
                )
            );
        }
    }
    catch(
        error
    ){
    }

    try{
        return Array.isArray(
            state.alliances
        )&&
        state.alliances.some(
            item=>
                item.code===
                code||
                item.countryId===
                code
        );
    }
    catch(
        error
    ){
        return false;
    }
}


function GDIsSanctioned(
    code
)
{
    try{
        if(
            typeof isSanctioned===
            "function"
        ){
            return Boolean(
                isSanctioned(
                    code
                )
            );
        }
    }
    catch(
        error
    ){
    }

    try{
        return Array.isArray(
            state.sanctions
        )&&
        state.sanctions.some(
            item=>
                item.code===
                code||
                item.countryId===
                code
        );

    catch(

}


function GDIsEnemy(
    code
)
{
    const player=
        GDPlayerCode();

    if(
        !player||
        !code
    ){
        return false;
    }

    try{
        if(
            typeof playerWarAgainst===
            "function"
        ){
            return Boolean(
                playerWarAgainst(
                    code
                )
            );
        }
    }
    catch(
        error
    ){
    }

    try{
        return Array.isArray(
            state.wars
        )&&
        state.wars.some(
            war=>
            {
                const status=
                    war.status;

                const active=
                    status===
                    "active"||
                    status===
                    "war";

                return active&&
                (
                    (
                        war.attacker===
                        player&&
                        war.defender===
                        code
                    )||
                    (
                        war.defender===
                        player&&
                        war.attacker===
                        code
                    )
                );
            }
        );
    }
    catch(
        error
    ){
        return false;
    }
}


/* =========================================================
   ECONOMY VALUE
========================================================= */

function GDEconomyValue(
    code
)
{
    const player=
        GDPlayerCode();

    try{
        if(
            code===
            player
        ){
            return Number(
                state.nation&&
                state.nation.industry
            )||
            50;
        }

        if(
            state.ai&&
            state.ai[
                code
            ]
        ){
            return Number(
                state.ai[
                    code
                ].economy
            )||
            50;
        }

        if(
            typeof countryProfile===
            "function"
        ){
            return Number(
                countryProfile(
                    code
                ).industry
            )||
            50;
        }
    }
    catch(
        error
    ){
    }

    return 50;
}


/* =========================================================
   MILITARY VALUE
========================================================= */

function GDMilitaryValue(
    code
)
{
    const player=
        GDPlayerCode();

    try{
        if(
            code===
            player
        ){
            if(
                typeof calculateMilitaryPower===
                "function"
            ){
                return Number(
                    calculateMilitaryPower()
                )||
                50;
            }

            return Number(
                state.military&&
                state.military.basePower
            )||
            50;
        }

        if(
            state.ai&&
            state.ai[
                code
            ]
        ){
            return Number(
                state.ai[
                    code
                ].military
            )||
            50;
        }

        if(
            typeof countryProfile===
            "function"
        ){
            return Number(
                countryProfile(
                    code
                ).military
            )||
            50;
        }
    }
    catch(
        error
    ){
    }

    return 50;
}


/* =========================================================
   COUNTRY FILL
========================================================= */

function GDGetFill(
    code
)
{
    const player=
        GDPlayerCode();

    const mode=
        GDMapMode();


    if(
        mode===
        "political"
    ){
        if(
            code===
            player
        ){
            return "#1f9d78";
        }

        return GDPoliticalColor(
            code
        );
    }


    if(
        mode===
        "economy"
    ){
        const value=
            Math.max(
                0,
                Math.min(
                    120,
                    GDEconomyValue(
                        code
                    )
                )
            );

        const light=
            22+
            value*
            .30;

        return(
            "hsl(151 48% "+
            light.toFixed(
                1
            )+
            "%)"
        );
    }


    if(
        mode===
        "military"
    ){
        const value=
            Math.max(
                0,
                Math.min(
                    130,
                    GDMilitaryValue(
                        code
                    )
                )
            );

        const light=
            24+
            value*
            .22;

        return(
            "hsl(350 50% "+
            light.toFixed(
                1
            )+
            "%)"
        );
    }


    if(
        mode===
        "diplomacy"
    ){
        if(
            code===
            player
        ){
            return "#219d78";
        }

        const value=
            GDRelation(
                code
            );

        if(
            value>=
            70
        ){
            return "#397db0";
        }

        if(
            value>=
            35
        ){
            return "#4c8879";
        }

        if(
            value>=
            5
        ){
            return "#718071";
        }

        if(
            value>=
            -30
        ){
            return "#80766c";
        }

        if(
            value>=
            -65
        ){
            return "#926052";
        }

        return "#a4495a";
    }


    return GDPoliticalColor(
        code
    );
}

/* =========================================================
   INPUT FEATURE CHECK
========================================================= */

function GDValidGeoJSON(
    data
)
{
    return Boolean(
        data&&
        data.type===
        "FeatureCollection"&&
        Array.isArray(
            data.features
        )&&
        data.features.length>
        150
    );
}


/* =========================================================
   MAP PREPROCESS
========================================================= */

function GDPreprocess(
    geoJSON
)
{
    const result=
    {
        type:
            "FeatureCollection",

        features:
            []
    };

    GD10M.codeFeatureMap.clear();

    for(
        const feature of
        geoJSON.features
    ){
        if(
            !feature||
            !feature.geometry
        ){
            continue;
        }

        if(
            feature.geometry.type!==
            "Polygon"&&
            feature.geometry.type!==
            "MultiPolygon"
        ){
            continue;
        }

        const code=
            GDFeatureCode(
                feature
            );

        if(
            !code
        ){
            continue;
        }

        const entry=
        {
            type:
                "Feature",

            properties:
            {
                code:
                    code
            },

            geometry:
                feature.geometry
        };

        result.features.push(
            entry
        );

        if(
            !GD10M.codeFeatureMap.has(
                code
            )
        ){
            GD10M.codeFeatureMap.set(
                code,
                []
            );
        }

        GD10M.codeFeatureMap
        .get(
            code
        )
        .push(
            entry
        );
    }

    return result;
}


/* =========================================================
   SAVE CACHE
========================================================= */

function GDSaveCache(
    geoJSON
)
{
    try{
        const payload=
        {
            version:
                GD10M_CACHE_VERSION,

            data:
                geoJSON
        };

        localStorage.setItem(
            GD10M_CACHE_KEY,
            JSON.stringify(
                payload
            )
        );
    }
    catch(
        error
    ){
    }
}


/* =========================================================
   LOAD CACHE
========================================================= */

function GDLoadCache()
{
    try{
        const raw=
            localStorage.getItem(
                GD10M_CACHE_KEY
            );

        if(
            !raw
        ){
            return null;
        }

        const payload=
            JSON.parse(
                raw
            );

        if(
            !payload||
            payload.version!==
            GD10M_CACHE_VERSION||
            !GDValidGeoJSON(
                payload.data
            )
        ){
            return null;
        }

        return payload.data;
    }
    catch(
        error
    ){
        return null;
    }
}


/* =========================================================
   FETCH WITH TIMEOUT
========================================================= */

async function GDFetchJSON(
    url,
    timeout=
        30000
)
{
    const controller=
        new AbortController();

    const timer=
        setTimeout(
            function(){

                controller.abort();

            },
            timeout
        );

    try{
        const response=
            await fetch(
                url,
                {
                    cache:
                        "force-cache",

                    signal:
                        controller.signal
                }
            );

        if(
            !response.ok
        ){
            throw new Error(
                "HTTP "+
                response.status
            );
        }

        return await response.json();
    }
    finally{
        clearTimeout(
            timer
        );
    }
}


/* =========================================================
   COUNTRY ELEMENT STORAGE
========================================================= */

function GDClearElementRegistry()
{
    try{
        if(
            typeof countryElements!==
            "undefined"&&
            countryElements&&
            typeof countryElements.clear===
            "function"
        ){
            countryElements.clear();
        }
    }
    catch(
        error
    ){
    }
}


function GDRegisterCountryElement(
    code,
    element
)
{
    try{
        if(
            typeof countryElements!==
            "undefined"&&
            countryElements
        ){
            if(
                !countryElements.has(
                    code
                )
            ){
                countryElements.set(
                    code,
                    []
                );
            }

            countryElements
            .get(
                code
            )
            .push(
                element
            );
        }
    }
    catch(
        error
    ){
    }
}


/* =========================================================
   MAP CENTER STORAGE
========================================================= */

function GDStoreCenter(
    code,
    center
)
{
    GD10M.centerCache.set(
        code,
        center
    );

    try{
        if(
            typeof mapCenters!==
            "undefined"&&
            mapCenters
        ){
            mapCenters[
                code
            ]=
                center;
        }
    }
    catch(
        error
    ){
    }
}

========================================================= */

function GDCountryClick(
    code,
    event
)
{
    if(
        event
    ){
        event.stopPropagation();
    }

    try{
        if(
            typeof selectCountry===
            "function"
        ){
            selectCountry(
                code
            );

            setTimeout(
                GDUpdateStyles,
                0
            );

            return;
        }
    }
    catch(
        error
    ){
    }

    try{
        if(
            typeof state!==
            "undefined"&&
            state
        ){
            state.selected=
                code;
        }
    }
    catch(
        error
    ){
    }

    GDUpdateStyles();
}


/* =========================================================
   RENDER MICRO COUNTRIES
========================================================= */

function GDRenderMicroCountries(
    featureCodes
)
{
    const layer=
        document.getElementById(
            "microLayer"
        );

    if(
        !layer
    ){
        return;
    }

    layer.innerHTML=
        "";

    for(
        const[
            code,
            coordinate
        ]of
        Object.entries(
            GD_MICRO_LOCATIONS
        )
    ){
        if(
            featureCodes.has(
                code
            )
        ){
            continue;
        }

        const point=
            GDProject(
                coordinate
            );

        GDStoreCenter(
            code,
            point
        );

        const group=
            GDSVG(
                "g"
            );

        const hit=
            GDSVG(
                "circle"
            );

        hit.setAttribute(
            "cx",
            point[0]
        );

        hit.setAttribute(
            "cy",
            point[1]
        );

        hit.setAttribute(
            "r",
            window.innerWidth<=700
            ?
            5
            :
            4.2
        );

        hit.setAttribute(
            "fill",
            "transparent"
        );

        hit.style.cursor=
            "pointer";

        const circle=
            GDSVG(
                "circle"
            );

        circle.setAttribute(
            "cx",
            point[0]
        );

        circle.setAttribute(
            "cy",
            point[1]
        );

        circle.setAttribute(
            "r",
            2.2
        );

        circle.setAttribute(
            "class",
            "micro-country"
        );

        circle.dataset.code=
            code;

        group.dataset.code=
            code;

        group.style.cursor=
            "pointer";

        group.addEventListener(
            "click",
            function(
                event
            ){

                GDCountryClick(
                    code,
                    event
                );

            }
        );

        group.appendChild(
            hit
        );

        group.appendChild(
            circle
        );

        layer.appendChild(
            group
        );

        GDRegisterCountryElement(
            code,
            circle
        );
    }
}


/* =========================================================
   RENDER MAP
========================================================= */

function GDRenderMap()
{
    if(
        GD10M.rendering
    ){
        return;
    }

    const data=
        GD10M.processed||
        GD10M.raw;

    if(
        !GDValidGeoJSON(
            data
        )
    ){
        return;
    }

    const countryLayer=
        document.getElementById(
            "countryLayer"
        );

    const microLayer=
        document.getElementById(
            "microLayer"
        );

    if(
        !countryLayer||
        !microLayer
    ){
        return;
    }

    GD10M.rendering=
        true;

    GD10M.generation++;

    const generation=
        GD10M.generation;

    GDStatus(
        "در حال رسم نقشه 10m...",
        0
    );

    countryLayer.innerHTML=
        "";

    microLayer.innerHTML=
        "";

    GD10M.pathCache.clear();

    GD10M.centerCache.clear();

    GDClearElementRegistry();

    try{
        if(
            typeof mapFeatureCodes!==
            "undefined"
        ){
            mapFeatureCodes=
                new Set();
        }
    }
    catch(
        error
    ){
    }

    const fragment=
        document.createDocumentFragment();

    const featureCodes=
        new Set();

    let featureIndex=
        0;


    function renderChunk()
    {
        if(
            generation!==
            GD10M.generation
        ){
            GD10M.rendering=
                false;

            return;
        }

        const chunkStart=
            performance.now();

        while(
            featureIndex<
            data.features.length
        ){
            const feature=
                data.features[
                    featureIndex
                ];

            featureIndex++;

            const code=
                feature.properties&&
                feature.properties.code
                ?
                feature.properties.code
                :
                GDFeatureCode(
                    feature
                );

            if(
                !code||
                !feature.geometry
            ){
                continue;
            }

            const cacheKey=
                code+
                ":"+
                featureIndex;

            let pathData=
                GD10M.pathCache.get(
                    cacheKey
                );

            if(
                !pathData
            ){
                pathData=
                    GDGeometryPath(
                        feature.geometry,
                        GD10M.simplifyTolerance
                    );

                if(
                    pathData
                ){
                    GD10M.pathCache.set(
                        cacheKey,
                        pathData
                    );
                }
            }

            if(
                !pathData
            ){
                continue;
            }

            const path=
                GDSVG(
                    "path"
                );

            path.setAttribute(
                "d",
                pathData
            );

            path.setAttribute(
                "class",
                "country-shape"
            );

            path.setAttribute(
                "fill-rule",
                "evenodd"
            );

            path.dataset.code=
                code;

            path.addEventListener(
                "click",
                function(
                    event
                ){

                    GDCountryClick(
                        code,
                        event
                    );

                }
            );

            fragment.appendChild(
                path
            );

            featureCodes.add(
                code
            );

            GDRegisterCountryElement(
                code,
                path
            );

            if(
                !GD10M.centerCache.has(
                    code
                )
            ){
                const center=
                    GDGeometryCenter(
                        feature.geometry
                    );

                GDStoreCenter(
                    code,
                    center
                );
            }

            if(
                performance.now()-
                chunkStart>
                13
            ){
                requestAnimationFrame(
                    renderChunk
                );

                return;
            }
        }

        countryLayer.appendChild(
            fragment
        );

        try{
            if(
                typeof mapFeatureCodes!==
                "undefined"
            ){
                mapFeatureCodes=
                    featureCodes;
            }
        }
        catch(
            error
        ){
        }

        GDRenderMicroCountries(
            featureCodes
        );

        GD10M.rendering=
            false;

        GD10M.loaded=
            true;

        GDUpdateStyles();

        GDRenderRoutes();

        GDStatus(
            "نقشه 10m آماده شد",
            1200
        );

        const loader=
            document.getElementById(
                "mapLoading"
            );

        if(
            loader
        ){
            loader.classList.add(
                "hidden"
            );

            setTimeout(
                function(){

                    loader.style.display=
                        "none";

                },
                350
            );
        }
    }

    requestAnimationFrame(
        renderChunk
    );
}


/* =========================================================
   BUILD CENTERS
========================================================= */

function GDBuildCenters()
{
    const data=
        GD10M.processed||
        GD10M.raw;

    if(
        !GDValidGeoJSON(
            data
        )
    ){
        return;
    }

    for(
        const feature of
        data.features
    ){
        const code=
            feature.properties&&
            feature.properties.code
            ?
            feature.properties.code
            :
            GDFeatureCode(
                feature
            );

        if(
            !code||
            GD10M.centerCache.has(
                code
            )
        ){
            continue;
        }

        const center=
            GDGeometryCenter(
                feature.geometry
            );

        GDStoreCenter(
            code,
            center
        );
    }

    for(
        const[
            code,
            coordinate
        ]of
        Object.entries(
            GD_MICRO_LOCATIONS
        )
    ){
        if(
            !GD10M.centerCache.has(
                code
            )
        ){
            GDStoreCenter(
                code,
                GDProject(
                    coordinate
                )
            );
        }
    }
}

/* =========================================================
   ROUTE POINT
========================================================= */

function GDMapCenter(
    code
)
{
    if(
        GD10M.centerCache.has(
            code
        )
    ){
        return GD10M.centerCache.get(
            code
        );
    }

    try{
        if(
            typeof mapCenters!==
            "undefined"&&
            mapCenters[
                code
            ]
        ){
            return mapCenters[
                code
            ];
        }
    }
    catch(
        error
    ){
    }

    return[
        800,
        400
    ];
}


/* =========================================================
   ROUTE PATH
========================================================= */

function GDCurve(
    from,
    to
)
{
    let dx=
        to[0]-
        from[0];

    if(
        Math.abs(
            dx
        )>
        800
    ){
        if(
            dx>
            0
        ){
            dx-=
                1600;
        }
        else{
            dx+=
                1600;
        }
    }

    const endX=
        from[0]+
        dx;

    const midX=
        (
            from[0]+
            endX
        )/
        2;

    const midY=
        (
            from[1]+
            to[1]
        )/
        2-
        Math.min(
            80,
            Math.abs(
                dx
            )*
            .10+
            15
        );

    return(
        "M"+
        from[0]+
        " "+
        from[1]+
        " Q"+
        midX+
        " "+
        midY+
        " "+
        endX+
        " "+
        to[1]
    );
}


/* =========================================================
   ROUTE RENDER
========================================================= */

function GDRenderRoutes()
{
    const layer=
        document.getElementById(
            "routeLayer"
        );

    if(
        !layer
    ){
        return;
    }

    layer.innerHTML=
        "";

    const player=
        GDPlayerCode();

    if(
        !player
    ){
        return;
    }

    GDBuildCenters();

    const playerPoint=
        GDMapCenter(
            player
        );


    try{
        if(
            Array.isArray(
                state.tradeAgreements
            )
        ){
            for(
                const agreement of
                state.tradeAgreements
            ){
                const code=
                    agreement.code||
                    agreement.countryId;

                if(
                    !code
                ){
                    continue;
                }

                const path=
                    GDSVG(
                        "path"
                    );

                path.setAttribute(
                    "d",
                    GDCurve(
                        playerPoint,
                        GDMapCenter(
                            code
                        )
                    )
                );

                path.setAttribute(
                    "class",
                    "route-trade"
                );

                layer.appendChild(
                    path
                );
            }
        }
    }
    catch(
        error
    ){
    }


    try{
        if(
            Array.isArray(
                state.alliances
            )
        ){
            for(
                const alliance of
                state.alliances
            ){
                const code=
                    alliance.code||
                    alliance.countryId;

                if(
                    !code
                ){
                    continue;
                }

                const path=
                    GDSVG(
                        "path"
                    );

                path.setAttribute(
                    "d",
                    GDCurve(
                        playerPoint,
                        GDMapCenter(
                            code
                        )
                    )
                );

                path.setAttribute(
                    "class",
                    "route-alliance"
                );

                layer.appendChild(
                    path
                );
            }
        }
    }
    catch(
        error
    ){
    }


    try{
        if(
            Array.isArray(
                state.wars
            )
        ){
            for(
                const war of
                state.wars
            ){
                if(
                    war.status!==
                    "active"&&
                    war.status!==
                    "war"
                ){
                    continue;
                }

                const attacker=
                    war.attacker;

                const defender=
                    war.defender;

                if(
                    !attacker||
                    !defender
                ){
                    continue;
                }

                const path=
                    GDSVG(
                        "path"
                    );

                path.setAttribute(
                    "d",
                    GDCurve(
                        GDMapCenter(
                            attacker
                        ),
                        GDMapCenter(
                            defender
                        )
                    )
                );

                path.setAttribute(
                    "class",
                    "route-war"
                );

                layer.appendChild(
                    path
                );
            }
        }
    }
    catch(
        error
    ){
    }
}


/* =========================================================
   CAMERA
========================================================= */

function GDApplyTransform()
{
    const camera=
        document.getElementById(
            "camera"
        );

    if(
        !camera
    ){
        return;
    }

    let zoom=
        1;

    let x=
        0;

    let y=
        0;

    try{
        if(
            state.map
        ){
            zoom=
                Number(
                    state.map.zoom
                )||
                1;

            x=
                Number(
                    state.map.x
                )||
                0;

            y=
                Number(
                    state.map.y
                )||
                0;
        }
    }
    catch(
        error
    ){
    }

    camera.setAttribute(
        "transform",
        "translate("+
        x+
        " "+
        y+
        ") scale("+
        zoom+
        ")"
    );
}


/* =========================================================
   ZOOM
========================================================= */

function GDZoom(
    multiplier
)
{
    if(
        typeof state===
        "undefined"||
        !state
    ){
        return;
    }

    state.map=
        state.map||
        {};

    state.map.zoom=
        Math.max(
            .68,
            Math.min(
                6,
                (
                    Number(
                        state.map.zoom
                    )||
                    1
                )*
                multiplier
            )
        );

    GDApplyTransform();
}


/* =========================================================
   RESET
========================================================= */

function GDReset()
{
    if(
        typeof state===
        "undefined"||
        !state
    ){
        return;
    }

    state.map=
        state.map||
        {};

    state.map.zoom=
        1;

    state.map.x=
        0;

    state.map.y=
        0;

    GDApplyTransform();
}


/* =========================================================
   POINTER CAMERA
========================================================= */

function GDInstallCameraControls()
{
    const svg=
        document.getElementById(
            "worldSvg"
        );

    if(
        !svg||
        svg.dataset.gd10mCamera===
        "1"
    ){
        return;
    }

    svg.dataset.gd10mCamera=
        "1";

    let dragging=
        false;

    let moved=
        false;

    let previousX=
        0;

    let previousY=
        0;


    svg.addEventListener(
        "pointerdown",
        function(
            event
        ){
            if(
                event.button!==
                undefined&&
                event.button!==
                0
            ){
                return;
            }

            dragging=
                true;

            moved=
                false;

            previousX=
                event.clientX;

            previousY=
                event.clientY;

            try{
                svg.setPointerCapture(
                    event.pointerId
                );
            }
            catch(
                error
            ){
            }
        },
        true
    );


    svg.addEventListener(
        "pointermove",
        function(
            event
        ){
            if(
                !dragging
            ){
                return;
            }

            const dx=
                event.clientX-
                previousX;

            const dy=
                event.clientY-
                previousY;

            if(
                Math.abs(
                    dx
                )+
                Math.abs(
                    dy
                )>
                1.5
            ){
                moved=
                    true;
            }

            previousX=
                event.clientX;

            previousY=
                event.clientY;

            if(
                typeof state===
                "undefined"||
                !state
            ){
                return;
            }

            state.map=
                state.map||
                {};

            const box=
                svg.getBoundingClientRect();

            const factorX=
                1600/
                Math.max(
                    1,
                    box.width
                );

            const factorY=
                800/
                Math.max(
                    1,
                    box.height
                );

            state.map.x=
                (
                    Number(
                        state.map.x
                    )||
                    0
                )+
                dx*
                factorX;

            state.map.y=
                (
                    Number(
                        state.map.y
                    )||
                    0
                )+
                dy*
                factorY;

            GDApplyTransform();
        },
        true
    );


    function stopDragging(
        event
    ){
        if(
            !dragging
        ){
            return;
        }

        dragging=
            false;

        try{
            svg.releasePointerCapture(
                event.pointerId
            );
        }
        catch(
            error
        ){
        }

        setTimeout(
            function(){

                moved=
                    false;

            },
            20
        );
    }


    svg.addEventListener(
        "pointerup",
        stopDragging,
        true
    );

    svg.addEventListener(
        "pointercancel",
        stopDragging,
        true
    );


    svg.addEventListener(
        "wheel",
        function(
            event
        ){
            event.preventDefault();

            GDZoom(
                event.deltaY<
                0
                ?
                1.12
                :
                .89
            );
        },
        {
            passive:
                false,

            capture:
                true
        }
    );


    svg.addEventListener(
        "click",
        function(
            event
        ){
            if(
                moved
            ){
                event.preventDefault();
                event.stopPropagation();
            }
        },
        true
    );
}


/* =========================================================
   TOUCH PINCH
========================================================= */

function GDInstallTouchZoom()
{
    const viewport=
        document.getElementById(
            "mapViewport"
        );

    if(
        !viewport||
        viewport.dataset.gd10mTouch===
        "1"
    ){
        return;
    }

    viewport.dataset.gd10mTouch=
        "1";

    const touches=
        new Map();

    let previousDistance=
        null;


    viewport.addEventListener(
        "pointerdown",
        function(
            event
        ){
            if(
                event.pointerType===
                "touch"
            ){
                touches.set(
                    event.pointerId,
                    [
                        event.clientX,
                        event.clientY
                    ]
                );
            }
        }
    );


    viewport.addEventListener(
        "pointermove",
        function(
            event
        ){
            if(
                event.pointerType!==
                "touch"||
                !touches.has(
                    event.pointerId
                )
            ){
                return;
            }

            touches.set(
                event.pointerId,
                [
                    event.clientX,
                    event.clientY
                ]
            );

            if(
                touches.size===
                2
            ){
                const points=
                    Array.from(
                        touches.values()
                    );

                const distance=
                    Math.hypot(
                        points[0][0]-
                        points[1][0],
                        points[0][1]-
                        points[1][1]
                    );

                if(
                    previousDistance!==
                    null&&
                    previousDistance>
                    0
                ){
                    const ratio=
                        distance/
                        previousDistance;

                    if(
                        ratio>
                        1.015||
                        ratio<
                        .985
                    ){
                        GDZoom(
                            Math.max(
                                .94,
                                Math.min(
                                    1.06,
                                    ratio
                                )
                            )
                        );
                    }
                }

                previousDistance=
                    distance;
            }
        }
    );


    function remove(
        event
    ){
        touches.delete(
            event.pointerId
        );

        if(
            touches.size<
            2
        ){
            previousDistance=
                null;
        }
    }


    viewport.addEventListener(
        "pointerup",
        remove
    );

    viewport.addEventListener(
        "pointercancel",
        remove
    );
}

/* =========================================================
   LOAD 10M MAP
========================================================= */

async function GDLoad10M()
{
    if(
        GD10M.loaded&&
        GD10M.processed
    ){
        GDRenderMap();

        return;
    }

    GDStatus(
        "در حال بارگذاری نقشه واقعی 10m...",
        0
    );

    const cached=
        GDLoadCache();

    if(
        cached
    ){
        GD10M.raw=
            cached;

        GD10M.processed=
            GDPreprocess(
                cached
            );

        GDRenderMap();

        return;
    }

    let finalError=
        null;


    for(
        let index=
            0;
        index<
            GD10M_URLS.length;
        index++
    ){
        const url=
            GD10M_URLS[index];

        try{
            GDStatus(
                "دریافت نقشه 10m منبع "+
                (
                    index+
                    1
                )+
                "...",
                0
            );

            const data=
                await GDFetchJSON(
                    url,
                    35000
                );

            if(
                !GDValidGeoJSON(
                    data
                )
            ){
                throw new Error(
                    "Invalid GeoJSON"
                );
            }

            GD10M.raw=
                data;

            GD10M.processed=
                GDPreprocess(
                    data
                );

            GDSaveCache(
                data
            );

            GDRenderMap();

            return;
        }
        catch(
            error
        ){
            finalError=
                error;
        }
    }


    GDStatus(
        "خطا در دریافت نقشه 10m",
        4000
    );

    console.error(
        "10m map loading failed:",
        finalError
    );
}

/* =========================================================
   REFRESH WATCHER
========================================================= */

let GDPreviousStateSignature=
    "";


function GDStateSignature()
{
    try{
        const player=
            GDPlayerCode()||
            "";

        const selected=
            GDSelectedCode()||
            "";

        const mode=
            GDMapMode()||
            "";

        const wars=
            Array.isArray(
                state.wars
            )
            ?
            state.wars
            .filter(
                war=>
                    war.status===
                    "active"||
                    war.status===
                    "war"
            )
            .map(
                war=>
                    war.attacker+
                    ":"+
                    war.defender
            )
            .join(
                "|"
            )
            :
            "";

        const alliances=
            Array.isArray(
                state.alliances
            )
            ?
            state.alliances
            .map(
                item=>
                    item.code||
                    item.countryId||
                    ""
            )
            .join(
                "|"
            )
            :
            "";

        const sanctions=
            Array.isArray(
                state.sanctions
            )
            ?
            state.sanctions
            .map(
                item=>
                    item.code||
                    item.countryId||
                    ""
            )
            .join(
                "|"
            )
            :
            "";

        return[
            player,
            selected,
            mode,
            wars,
            alliances,
            sanctions
        ]
        .join(
            "#"
        );
    }
    catch(
        error
    ){
        return "";
    }
}


function GDWatchState()
{
    const signature=
        GDStateSignature();

    if(
        signature!==
        GDPreviousStateSignature
    ){
        GDPreviousStateSignature=
            signature;

        GDUpdateStyles();
    }

    requestAnimationFrame(
        GDWatchState
    );
}

function GDRemoveLabels()

        "#countryLabelLayer",
        ".country-label",
        ".capital-label",
        ".city-label",
        ".map-country-name",
        ".map-capital-name"
    ];

    for(
        const selector of
        selectors
    ){
        document
        .querySelectorAll(
            selector
        )
        .forEach(
            function(
                element
            ){

                if(
                    element.id===
                    "labelLayer"||
                    element.id===
                    "countryLabelLayer"
                ){
                    element.innerHTML=
                        "";

                    element.style.display=
                        "none";
                }

                    element.remove();
                }

        );
    }
}


/* =========================================================

========================================================= */

function GDInstallLabelObserver()
{
    const svg=
        document.getElementById(
            "worldSvg"
        );

    if(
        !svg

        return;

    const observer=
        new MutationObserver(

    observer.observe(
        svg,

            childList:
                true,

            subtree:
                true
        }
    );
}
