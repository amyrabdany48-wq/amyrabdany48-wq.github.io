<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Empire Horizon</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07131d;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    touch-action:manipulation;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =====================================================
   صفحه انتخاب کشور
===================================================== */

.screen{
    width:100%;
    height:100%;
    overflow:auto;
    background:
        radial-gradient(circle at 50% 10%,#173b50,#07131d 55%);
    padding:20px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-top:25px;
    letter-spacing:1px;
}

.subtitle{
    text-align:center;
    color:#9db4c2;
    margin:10px 0 25px;
    font-size:13px;
}

.countrySearch{
    width:min(650px,100%);
    display:block;
    margin:auto;
    padding:13px;
    border-radius:9px;
    border:1px solid #31576b;
    background:#0c2332;
    color:#fff;
    outline:none;
    font-family:inherit;
}

.countryGrid{
    width:min(950px,100%);
    margin:18px auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.countryBtn{
    min-height:48px;
    background:#102c3d;
    border:1px solid #294c60;
    color:#fff;
    border-radius:8px;
    padding:7px;
    font-size:10px;
    transition:.15s;
}

.countryBtn:hover{
    background:#19425a;
    transform:translateY(-1px);
}

.countryBtn.selected{
    background:#145c45;
    border-color:#66d6a0;
}

.nextBtn{
    display:block;
    width:min(420px,100%);
    margin:20px auto;
    padding:14px;
    border-radius:9px;
    background:#176b50;
    color:#fff;
    font-size:13px;
    font-weight:bold;
}

.nextBtn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =====================================================
   صفحه انتخاب منطقه
===================================================== */

.regionGrid{
    width:min(900px,100%);
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.region{
    min-height:120px;
    border-radius:12px;
    border:1px solid #31566b;
    background:linear-gradient(145deg,#123248,#0b202e);
    color:white;
    padding:18px;
    text-align:center;
}

.region strong{
    display:block;
    font-size:15px;
    margin-bottom:8px;
}

.region span{
    color:#9eb5c2;
    font-size:9px;
    line-height:1.8;
}

.region.selected{
    border-color:#6ce0ad;
    background:#14523f;
}

.backBtn{
    display:block;
    width:min(300px,100%);
    margin:10px auto;
    padding:11px;
    background:#263c4a;
    color:#fff;
    border-radius:8px;
}

/* =====================================================
   GAME
===================================================== */

#game{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#07131d;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    height:64px;
    flex-shrink:0;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    padding:5px;
    background:#091b28;
    border-bottom:1px solid #29485b;
}

.stat{
    background:#102b3d;
    border:1px solid #294b5e;
    border-radius:7px;
    text-align:center;
    padding:4px 2px;
    font-size:8px;
}

.stat b{
    display:block;
    margin-top:4px;
    font-size:10px;
}

/* =====================================================
   MAP
===================================================== */

#mapArea{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
    background:#b9dbea;
}

#map{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    user-select:none;
}

.country{
    stroke:#344650;
    stroke-width:.7;
    vector-effect:non-scaling-stroke;
    cursor:pointer;
    transition:filter .1s;
}

.country:hover{
    filter:brightness(1.12);
}

.country.selected{
    stroke:#ffffff;
    stroke-width:2;
}

.mapControls{
    position:absolute;
    left:7px;
    top:7px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.mapControls button{
    width:36px;
    height:36px;
    background:#082131eF;
    border:1px solid #34566a;
    border-radius:7px;
    color:white;
    font-size:17px;
}

/* =====================================================
   COUNTRY INFO
===================================================== */

#countryInfo{
    position:absolute;
    left:7px;
    bottom:7px;
    width:230px;
    max-width:calc(100% - 14px);
    background:#091c2aF4;
    border:1px solid #36566a;
    border-radius:9px;
    padding:9px;
    display:none;
    z-index:5;
}

#countryInfo h3{
    margin:0 0 7px;
    font-size:13px;
}

.infoRow{
    display:flex;
    justify-content:space-between;
    background:#102a3b;
    border-radius:5px;
    padding:6px;
    margin-top:4px;
    font-size:9px;
}

/* =====================================================
   BOTTOM MENU
===================================================== */

.bottom{
    height:57px;
    flex-shrink:0;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
    padding:5px;
    background:#081722;
    border-top:1px solid #294658;
}

.bottom button{
    background:#102b3d;
    color:#fff;
    border:1px solid #2b4c5e;
    border-radius:7px;
    font-size:8px;
}

/* =====================================================
   MODAL
===================================================== */

#modal{
    position:fixed;
    inset:0;
    background:#000b;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:10px;
}

.modalBox{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    background:#091c2a;
    border:1px solid #35576b;
    border-radius:10px;
    padding:11px;
}

.modalHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #254355;
    padding-bottom:8px;
    margin-bottom:8px;
}

.modalHeader h2{
    margin:0;
    font-size:15px;
}

.close{
    background:#4b222a;
    color:#fff;
    border-radius:6px;
    padding:7px 10px;
}

.card{
    background:#102a3b;
    border:1px solid #27495c;
    border-radius:7px;
    padding:8px;
    margin:5px 0;
}

.cardTitle{
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
}

.cardText{
    color:#b9cbd4;
    font-size:9px;
    line-height:1.8;
}

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:5px;
    margin-top:7px;
}

.actions button{
    padding:9px 4px;
    background:#123249;
    color:#fff;
    border:1px solid #34566a;
    border-radius:6px;
    font-size:9px;
}

input,select{
    width:100%;
    padding:9px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #35566a;
    background:#0b2233;
    color:#fff;
    outline:none;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .countryGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .regionGrid{
        grid-template-columns:repeat(2,1fr);
    }

    .topbar{
        height:78px;
        grid-template-columns:repeat(3,1fr);
    }

    .bottom{
        height:55px;
    }

}

@media(max-width:430px){

    .screen{
        padding:12px;
    }

    .logo{
        font-size:24px;
    }

    .countryGrid{
        grid-template-columns:repeat(2,1fr);
    }

    .regionGrid{
        grid-template-columns:1fr 1fr;
        gap:7px;
    }

    .region{
        min-height:95px;
        padding:10px;
    }

    .bottom button{
        font-size:7px;
    }
}

</style>
</head>

    <div class="logo">

     PAGE 3 - GAME

            🛡 ارتش

<!-- =====================================================
     MODAL
===================================================== -->

<div id="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <h2 id="modalTitle">
                پنل
            </h2>

                class="close"
                onclick="closeModal()">

                ✕

            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =====================================================
   COUNTRY LIST
===================================================== */

const countries=[

"ایران","عراق","افغانستان","پاکستان","هند",
"چین","ژاپن","کره جنوبی","کره شمالی","ترکیه",
"عربستان سعودی","امارات متحده عربی","قطر","کویت",
"بحرین","عمان","اردن","سوریه","لبنان","اسرائیل",
"مصر","لیبی","الجزایر","تونس","مراکش",
"اتیوپی","کنیا","نیجریه","آفریقای جنوبی","سودان",
"روسیه","اوکراین","آلمان","فرانسه","ایتالیا",
"اسپانیا","پرتغال","هلند","بلژیک","سوئیس",
"اتریش","لهستان","سوئد","نروژ","فنلاند",
"بریتانیا","ایرلند","یونان","رومانی","صربستان",
"آمریکا","کانادا","مکزیک","کوبا","برزیل",
"آرژانتین","شیلی","کلمبیا","پرو","ونزوئلا",
"بولیوی","اکوادور","استرالیا","نیوزیلند",
"اندونزی","مالزی","تایلند","ویتنام",
"فیلیپین","سنگاپور","مغولستان","قزاقستان",
"ازبکستان","ترکمنستان","تاجیکستان","گرجستان",
"ارمنستان","آذربایجان"

];


/* =====================================================
   STATE
===================================================== */

let selectedCountry=null;

let selectedRegion=null;

let selectedPath=null;

let scale=1;

let offsetX=0;

let offsetY=0;

let dragging=false;

let lastX=0;

let lastY=0;


/* =====================================================
   PLAYER
===================================================== */

const player={

 country:"",

 region:"",

 money:50000,

 inflation:4,

 production:100,

 resources:100,

 power:25,

 day:1,

 sanctions:[],

 treaties:[]

};


/* =====================================================
   AI
===================================================== */

const AI={};


/* =====================================================
   COUNTRY SCREEN
===================================================== */

const countryGrid=
document.getElementById("countryGrid");


function renderCountries(filter=""){

    countryGrid.innerHTML="";

    countries
    .filter(c=>
        c.includes(filter)
    )
    .forEach(country=>{

        const btn=
        document.createElement("button");

        btn.className="countryBtn";

        btn.textContent=country;

        btn.onclick=()=>{

            selectedCountry=country;

            document
            .querySelectorAll(".countryBtn")
            .forEach(x=>
                x.classList.remove("selected")
            );

            btn.classList.add("selected");

            document
            .getElementById("countryNext")
            .disabled=false;

        };

        countryGrid.appendChild(btn);

    });

}


document
.getElementById("countrySearch")
.addEventListener(
    "input",
    e=>{
        renderCountries(e.target.value);
    }
);


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function goToRegion(){

    if(!selectedCountry)
        return;

    player.country=
        selectedCountry;

    document
    .getElementById("countryScreen")
    .classList.add("hidden");

    document
    .getElementById("regionScreen")
    .classList.remove("hidden");

    document
    .getElementById("selectedCountryText")
    .textContent=
        "کشور انتخاب‌شده: "+
        selectedCountry;

}


function backToCountry(){

    document
    .getElementById("regionScreen")
    .classList.add("hidden");

    document
    .getElementById("countryScreen")
    .classList.remove("hidden");

}


function chooseRegion(region,element){

    selectedRegion=region;

    document
    .querySelectorAll(".region")
    .forEach(x=>
        x.classList.remove("selected")
    );

    element.classList.add("selected");

    document
    .getElementById("regionNext")
    .disabled=false;

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    if(!selectedRegion)
        return;

    player.region=
        selectedRegion;

    document
    .getElementById("regionScreen")
    .classList.add("hidden");

    document
    .getElementById("game")
    .classList.remove("hidden");

    loadMap();

    updateUI();

}


/* =====================================================
   MAP
===================================================== */

const MAP_URL=
"https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_0_countries.geojson";

const svg=
document.getElementById("map");

const world=
document.getElementById("world");


const colors=[

"#4e79a7",
"#59a14f",
"#e15759",
"#f28e2b",
"#b07aa1",
"#76b7b2",
"#edc948",
"#ff9da7",
"#9c755f",
"#6b7c93",
"#3d8b5a",
"#a84d4d",
"#7c5aa6",
"#c47d22",
"#4c9a9a",
"#8c6d31",
"#6b7c93",
"#a05a5a",
"#527a5c",
"#4176a8"

];


/* =====================================================
   MAP PROJECTION
===================================================== */

function project(lon,lat){

    const x=
        (lon+180)/360*1200;

    const r=
        lat*Math.PI/180;

    const m=
        Math.log(
            Math.tan(
                Math.PI/4+r/2
            )
        );

    const y=
        325-(m/4)*260;

    return [x,y];

}


/* =====================================================
   PATH
===================================================== */

function ringPath(ring){

    let d="";

    for(let i=0;i<ring.length;i++){

        const p=
            project(
                ring[i][0],
                ring[i][1]
            );

        d+=
            i===0
            ?"M"
            :"L";

        d+=
            p[0].toFixed(2)+
            " "+
            p[1].toFixed(2);

    }

    return d+"Z";

}


function geometryPath(geometry){

    let d="";

    if(
        geometry.type==="Polygon"
    ){

        geometry.coordinates
        .forEach(ring=>{
            d+=ringPath(ring);
        });

    }


    if(
        geometry.type==="MultiPolygon"
    ){

        geometry.coordinates
        .forEach(polygon=>{

            polygon.forEach(ring=>{
                d+=ringPath(ring);
            });

        });

    }

    return d;

}


/* =====================================================
   LOAD MAP
===================================================== */

async function loadMap(){

    world.innerHTML="";

    try{

        const response=
            await fetch(
                MAP_URL,
                {
                    cache:"force-cache"
                }
            );

        const data=
            await response.json();


        data.features
        .forEach(
            (feature,index)=>{

                if(!feature.geometry)
                    return;


                const name=
                    feature.properties.NAME ||
                    feature.properties.ADMIN ||
                    "کشور";


                createAI(name);


                const path=
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "path"
                    );


                path.setAttribute(
                    "d",
                    geometryPath(
                        feature.geometry
                    )
                );


                path.classList.add(
                    "country"
                );


                path.style.fill=
                    colors[
                        index%colors.length
                    ];


                path.dataset.name=
                    name;


                path.addEventListener(
                    "click",
                    e=>{

                        e.stopPropagation();

                        selectCountryOnMap(
                            name,
                            path
                        );

                    }
                );


                world.appendChild(path);

            }
        );


    }catch(error){

        console.log(
            "Map error:",
            error
        );

    }

}


/* =====================================================
   MAP COUNTRY SELECT
===================================================== */

function selectCountryOnMap(name,path){

    if(selectedPath)
        selectedPath.classList.remove(
            "selected"
        );


    selectedPath=path;

    selectedPath.classList.add(
        "selected"
    );


    const ai=
        createAI(name);


    document
    .getElementById("countryName")
    .textContent=
        "🌍 "+name;


    document
    .getElementById("countryEconomy")
    .textContent=
        Math.round(ai.economy)+
        " B$";


    document
    .getElementById("countryInflation")
    .textContent=
        ai.inflation.toFixed(1)+"%";


    document
    .getElementById("countryRelation")
    .textContent=
        Math.round(ai.relation)+
        "/100";


    document
    .getElementById("countryPower")
    .textContent=
        Math.round(ai.power);


    document
    .getElementById("countryInfo")
    .style.display=
        "block";

}


/* =====================================================
   AI COUNTRY
===================================================== */

function createAI(name){

    if(!AI[name]){

        AI[name]={

            name:name,

            economy:
                100+
                Math.random()*2000,

            power:
                20+
                Math.random()*80,

    }

function improveRelation(name){

        createAI(name);

    const cost=2500;

    if(player.money<cost){

        alert(

        );

        return;

    }

    player.money-=cost;

    ai.relation=
        Math.min(
            100,
            ai.relation+8
        );

    ai.trust=
        Math.min(
            100,
            ai.trust+4
        );

/* =====================================================
   TREATY
===================================================== */

function offerTreaty(name){

    const ai=
        createAI(name);

    const chance=
        ai.relation*.55+
        ai.trust*.4+
        player.power*.15-
        ai.aggression*.15+
        Math.random()*25;


    if(chance>70){

        ai.relation=
            Math.min(
                100,
                ai.relation+10
            );

        ai.trust=
            Math.min(
                100,
                ai.trust+10
            );

        ai.treaties.push(
            player.country
        );

        player.treaties.push(name);

        alert(
            "📜 قرارداد با "+
            name+
            " امضا شد."
        );

    }else{

        ai.relation=
            Math.max(
                0,
                ai.relation-2
            );

        alert(
            "❌ "+
            name+
            " قرارداد را رد کرد."
        );

    }

    openDiplomacy();

}

/* =====================================================
   SEND TRADE
===================================================== */

function sendTrade(name){

    const ai=
        createAI(name);

    const amount=
        Math.max(
            1,
            Number(
                document
                .getElementById("tradeAmount")
                .value
            )
        );


    const score=
        ai.relation*.45+
        ai.trust*.3+
        ai.tradeNeed*.4+
        Math.random()*30;


    if(score>70){

        player.resources=
            Math.max(
                0,
                player.resources-amount
            );

        player.money+=
            amount*60;

        ai.relation=
            Math.min(
                100,
                ai.relation+3
            );

        ai.trust=
            Math.min(
                100,
                ai.trust+2
            );

        alert(
            "✅ "+
            name+
            " پیشنهاد معامله را پذیرفت."
        );

    }else{

        ai.relation=
            Math.max(
                0,
                ai.relation-1
            );

        alert(
            "❌ پیشنهاد معامله رد شد."
        );

    }

    updateUI();

    openTrade();

}

/* =====================================================
   TIME + AI ECONOMY
===================================================== */

setInterval(()=>{

    if(
        document
        .getElementById("game")
        .classList
        .contains("hidden")
    )
        return;


    player.day++;


    /* درآمد */

    let income=
        player.production*.55;


    /* تورم درآمد را کم می‌کند */

    income*=
        Math.max(
            .2,
            1-player.inflation/100
        );


    /* هزینه ارتش */

    const armyCost=
        player.power*1.8;


    player.money+=
        income-armyCost;


    /* کسری بودجه */

    if(player.money<5000){

        player.inflation+=.18;

    }


    /* اقتصاد سالم */

    if(
        player.money>100000 &&
        player.inflation>2
    ){

        player.inflation-=.025;

    }


    /* تولید بیش از ظرفیت */

    if(player.production>180){

        player.inflation+=.035;

    }


    /* منابع */

    player.resources+=
        player.production*.008;


    player.inflation=
        Math.max(
            .5,
            Math.min(
                80,
                player.inflation
            )
        );


    /* AI کشورها */

    Object.values(AI)
    .forEach(ai=>{

        const economyChange=
            (Math.random()-.48)*.8;

        ai.economy=
            Math.max(
                10,
                ai.economy+
                economyChange
            );


        if(ai.economy<100){

            ai.inflation+=.08;

        }else{

            ai.inflation-=.03;

        }


        ai.inflation=
            Math.max(
                .5,
                Math.min(
                    70,
                    ai.inflation
                )
            );


        ai.relation+=
            (Math.random()-.5)*.8;


        ai.relation=
            Math.max(
                0,
                Math.min(
                    100,
                    ai.relation
                )
            );


        /*
           احتمال واکنش دیپلماتیک
        */

        if(
            ai.relation<20 &&
            Math.random()<.04
        ){

            player.inflation+=.25;

        }

    });


    updateUI();

},3000);

/* =====================================================
   MAP ZOOM
===================================================== */

function applyMap(){

    const transform=
        `translate(${offsetX} ${offsetY}) scale(${scale})`;

    world.setAttribute(
        "transform",
        transform
    );

}


function zoomMap(value){

    scale*=value;

    scale=
        Math.max(
            1,
            Math.min(
                5,
                scale
            )
        );

    applyMap();

}


function resetMap(){

    scale=1;

    offsetX=0;

    offsetY=0;

    applyMap();

}


/* =====================================================
   MAP DRAG
===================================================== */

svg.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        lastX=e.clientX;

        lastY=e.clientY;

        svg.setPointerCapture(
            e.pointerId
        );

    }
);


svg.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx=
            e.clientX-lastX;

        const dy=
            e.clientY-lastY;


        lastX=e.clientX;

        lastY=e.clientY;


        offsetX+=
            dx/svg.clientWidth*1200;

        offsetY+=
            dy/svg.clientHeight*650;


        applyMap();

    }
);


svg.addEventListener(
    "pointerup",
    e=>{

        dragging=false;

        try{

            svg.releasePointerCapture(
                e.pointerId
            );

        }catch(error){}

    }
);


/* =====================================================
   ESCAPE
===================================================== */

function safe(text){

    return text
        .replaceAll(
            "'",
            "\\'"
        );

}
