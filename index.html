<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire Horizon</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#08131d;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

/* =========================
   صفحه انتخاب کشور
========================= */

#countryPage{
    min-height:100vh;
    padding:20px;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#4bd7ff;
    margin:15px 0 5px;
}

.desc{
    text-align:center;
    color:#8fa8ba;
    font-size:12px;
    margin-bottom:20px;
}

.search{
    width:100%;
    max-width:600px;
    display:block;
    margin:auto;
    padding:12px;
    background:#0c202f;
    border:1px solid #27465c;
    color:white;
    border-radius:8px;
    outline:none;
}

.countries{
    max-width:900px;
    margin:15px auto;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:7px;
}

.country{
    background:#0c2233;
    border:1px solid #27485f;
    color:white;
    border-radius:8px;
    padding:12px 5px;
    min-height:70px;
}

.country:hover{
    background:#12344b;
}

.flag{
    font-size:22px;
    display:block;
    margin-bottom:5px;
}


/* =========================
   بازی
========================= */

#game{
    display:none;
    min-height:100vh;
}

.top{
    padding:6px;
    background:#091923;
    border-bottom:1px solid #254357;
}

.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
}

.stat{
    background:#0c2232;
    border:1px solid #1d3c51;
    border-radius:7px;
    text-align:center;
    padding:5px 2px;
    font-size:9px;
}

.stat b{
    display:block;
    font-size:12px;
    margin-top:3px;
}


/* =========================
   نقشه ساده
========================= */

.mapBox{
    position:relative;
    background:#091b27;
    overflow:hidden;
}

#map{
    width:100%;
    height:650px;
    display:block;
    touch-action:none;
}

/*
 فقط خطوط ساده
 هیچ شکل تزئینی
 هیچ دایره
 هیچ مستطیل برای کشورها
*/

.countryLine{
    fill:#10293a;
    stroke:#7191a4;
    stroke-width:1.4;
    vector-effect:non-scaling-stroke;
    cursor:pointer;
}

.countryLine:hover{
    fill:#173d52;
}

.countryName{
    fill:#dceaf2;
    font-size:11px;
    text-anchor:middle;
    pointer-events:none;
}


/* =========================
   کنترل نقشه
========================= */

.mapControls{
    position:absolute;
    top:8px;
    left:8px;
    display:flex;
    gap:5px;
    z-index:5;
}

.mapControls button{
    width:38px;
    height:35px;
    background:#0c2638;
    color:white;
    border:1px solid #31556c;
    border-radius:7px;
}


/* =========================
   منوی پایین
========================= */

.menu{
    padding:8px;
    background:#081722;
    border-top:1px solid #254357;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
}

.menu button{
    padding:9px 4px;
    background:#0d293c;
    color:white;
    border:1px solid #294b60;
    border-radius:7px;
    font-size:10px;
}


/* =========================
   پنل
========================= */

#panel{
    display:none;
    position:fixed;
    inset:0;
    background:#000b;
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:12px;
}

.panel{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#091c2b;
    border:1px solid #31536b;
    border-radius:10px;
    padding:13px;
}

.close{
    float:left;
    background:#47232b;
    color:white;
    border:0;
    padding:6px 10px;
    border-radius:6px;
}

.row{
    background:#0e293c;
    padding:9px;
    border-radius:6px;
    margin:5px 0;
    display:flex;
    justify-content:space-between;
    font-size:11px;
}

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:5px;
    margin-top:8px;
}

.actions button{
    padding:10px;
    background:#123149;
    color:white;
    border:1px solid #31546a;
    border-radius:7px;
}


/* =========================
   موبایل
========================= */

@media(max-width:700px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    #map{
        height:500px;
    }

    .menu{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:430px){

    #map{
        height:420px;
    }

    .menu button{
        font-size:9px;
        padding:8px 2px;
    }

    .countries{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>

<script>

/* =====================================================

===================================================== */

const countries=[
"ایران",
"عراق",
"افغانستان",
"پاکستان",
"ترکیه",
"آمریکا",
"کانادا",
"مکزیک",
"برزیل",
"آرژانتین",
"انگلستان",
"فرانسه",
"آلمان",
"ایتالیا",
"اسپانیا",
"روسیه",
"چین",
"ژاپن",
"هند",
"کره جنوبی",
"کره شمالی",
"مصر",
"الجزایر",
"نیجریه",
"آفریقای جنوبی",
"عربستان",
"امارات",
"قطر",
"عمان",
"سوریه",
"اوکراین",
"لهستان",
"سوئد",
"نروژ",
"فنلاند",
"یونان",
"هلند",
"بلژیک",
"سوئیس",
"اتریش",
"استرالیا",
"نیوزیلند",
"اندونزی",
"ویتنام",
"تایلند",
"قزاقستان",
"مغولستان",
"شیلی",
"پرو",
"کلمبیا",
"ونزوئلا"
];


/* =====================================================
 بازی
===================================================== */

let game={
    country:"",
    money:50000,
    production:100,
    inflation:4,
    resources:100,
    army:25,
    day:1,
    month:1,
    year:2026,
    paused:false
};


/* =====================================================
 ساخت لیست کشورها
===================================================== */

function renderCountries(){

    const box=
        document.getElementById("countries");

    box.innerHTML="";

    countries.forEach(
        country=>{

            const button=
                document.createElement("button");

            button.className="country";

            button.dataset.name=country;

            button.innerHTML=
                `<span class="flag">🌐</span>
                 <b>${country}</b>`;

            button.onclick=
                ()=>{
                    startGame(country);
                };

            box.appendChild(button);
        }
    );
}


/* =====================================================
 جستجو
===================================================== */

function searchCountry(){

    const value=
        document
        .getElementById("search")
        .value
        .toLowerCase();

    document
    .querySelectorAll(".country")
    .forEach(
        button=>{

            button.style.display=
                button.dataset.name
                .toLowerCase()
                .includes(value)
                ?
                "block"
                :
                "none";
        }
    );
}


/* =====================================================
 شروع
===================================================== */

function startGame(country){

    game.country=country;

    document
    .getElementById("countryPage")
    .style.display="none";

    document
    .getElementById("game")
    .style.display="block";

    save();

    update();

}


/* =====================================================
 بروزرسانی
===================================================== */

function update(){

    document
    .getElementById("money")
    .textContent=
        Math.floor(game.money)
        .toLocaleString();

    document
    .getElementById("production")
    .textContent=
        Math.floor(game.production);

    document
    .getElementById("inflation")
    .textContent=
        game.inflation.toFixed(2)+"%";

    document
    .getElementById("resources")
    .textContent=
        Math.floor(game.resources);

    document
    .getElementById("army")
    .textContent=
        Math.floor(game.army);

    document
    .getElementById("time")
    .textContent=
        "روز "+
        game.day;

}


/* =====================================================
 زمان
===================================================== */

setInterval(
    ()=>{

        if(
            !game.country ||
            game.paused
        )
            return;

        game.day++;

        if(
            game.day>30
        ){

            game.day=1;

            game.month++;

        }

        if(
            game.month>12
        ){

            game.month=1;

            game.year++;

        }


        /*
         درآمد بسیار محدود
        */

        let income=
            game.production*
            0.8;

        income*=
            Math.max(
                0.25,
                1-game.inflation/100
            );


        /*
         هزینه ارتش
        */

        let armyCost=
            game.army*2;


        game.money+=
            income-armyCost;


        /*
         تغییر تورم
        */

        if(
            game.money<10000
        )
            game.inflation+=0.04;

        if(
            game.money>100000
        )
            game.inflation-=0.015;

        game.inflation=
            Math.max(
                0.5,
                Math.min(
                    50,
                    game.inflation
                )
            );


        /*
         منابع
        */

        game.resources+=
            game.production*.01;


        update();

    },
    1000
);


/* =====================================================
 کلیک کشور
===================================================== */

function countryClick(name){

    if(!game.country)
        return;

    showPanel(`

        <h2>🌍 ${name}</h2>

        <div class="row">
            <span>کشور شما</span>
            <b>${game.country}</b>
        </div>

        <div class="row">
            <span>وضعیت</span>
            <b>کشور مستقل</b>
        </div>

        <div class="row">

/* =====================================================
 نقشه
===================================================== */

let scale=1;

let tx=0;

let ty=0;


function zoom(value){

    scale*=value;

    scale=
        Math.max(
            .7,
            Math.min(
                2.5,
                scale
            )
        );

    applyMap();

}


function resetMap(){

    scale=1;

    tx=0;

    ty=0;

    applyMap();

}


function applyMap(){

    document
    .getElementById("world")
    .setAttribute(
        "transform",
        `translate(${tx} ${ty})
         scale(${scale})`
    );

}


/* =====================================================
 حرکت نقشه
===================================================== */

let dragging=false;

let lastX=0;

let lastY=0;

const map=
    document.getElementById("map");


map.addEventListener(
    "pointerdown",
    event=>{

        dragging=true;

        lastX=event.clientX;

        lastY=event.clientY;

        map.setPointerCapture(
            event.pointerId
        );

    }
);


map.addEventListener(
    "pointermove",
    event=>{

        if(!dragging)
            return;

        tx+=
            event.clientX-lastX;

        ty+=
            event.clientY-lastY;

        lastX=event.clientX;

        lastY=event.clientY;

        applyMap();

    }
);


map.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


map.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);
