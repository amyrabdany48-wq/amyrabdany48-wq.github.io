function GD8Number(
    value,
    fallback=
        0
)
{
    const number=
        Number(
            value
        );

    return Number.isFinite(
        number
    )
    ?
    number
    :
    fallback;
}


function GD8Clamp(
    value,
    min,
    max
)
{
    return Math.max(
        min,
        Math.min(
            max,
            GD8Number(
                value,
                min
            )
        )
    );
}


function GD8Chance(
    value
)
{
    return Math.random()*
    100<
    GD8Clamp(
        value,
        0,
        100
    );
}


function GD8Pick(
    array
)
{
    if(
        !Array.isArray(
            array
        )||
        !array.length
    ){
        return null;
    }

    return array[
        Math.floor(
            Math.random()*
            array.length

    ];
}


function GD8Safe(

{

}

function GD8Migrate()
{
    if(
        typeof state===
        "undefined"||
        !state
    ){
        return;
    }

    state.tradeSystem=
        state.tradeSystem||
        {};

    state.tradeSystem.offers=

/* =========================================================
   RESOURCE PRICE
========================================================= */

function GD8ResourcePrice(
    resourceId
)
{
    try{
        if(
            typeof resourcePrice===
            "function"
        ){
            return GD8Number(
                resourcePrice(
                    resourceId
                ),
                50
            );
        }
    }
    catch(
        error
    ){
    }

    const resource=
        GD8_RESOURCES.find(
            item=>
                item.id===
                resourceId
        );

    const base=
        resource
        ?
        resource.basePrice
        :
        50;

    const inflation=
        GD8Number(
            state.economy&&
            state.economy.inflation
        );

    const stock=
        GD8Number(
            state.resources[
                resourceId
            ]
        );

    const shortage=
        Math.max(
            0,
            50-
            stock
        );

    return base+
    inflation*
    .6+
    shortage*
    .22;
}

    }

    window.currentInfrastructureCategory=
        category;

    [
        [
            "all",

        ],

        [

            "انرژی"

                    GD8Number(

                    queue.some(

                    GD8Safe(

                    '</div>'+

/* =========================================================
   TRADE COUNTRY ECONOMY
========================================================= */

function GD8CountryResourceStock(
    code,
    resourceId
)
{
    const ai=
        GD8AI(
            code
        );

    const economy=
        GD8Number(
            ai.economy,
            50
        );

    const technology=
        GD8Number(
            ai.technology,
            50
        );

    const military=
        GD8Number(
            ai.military,
            50
        );

    const seedBase=
        (
            typeof hashString===
            "function"
            ?
            hashString(
                code+
                ":"+
                resourceId
            )
            :
            (
                code.charCodeAt(
                    0
                )*
                41+
                resourceId.charCodeAt(
                    0
                )*
                17
            )
        )%
        100;

    if(
        resourceId===
        "food"
    ){
        return 35+
        economy*
        .72+
        seedBase*
        .5;
    }

    if(
        resourceId===
        "energy"
    ){
        return 30+
        economy*
        .75+
        technology*
        .25+
        seedBase*
        .4;
    }

    if(
        resourceId===
        "oil"
    ){
        return 15+
        seedBase*
        1.3+
        military*
        .18;
    }

    if(
        resourceId===
        "steel"
    ){
        return 25+
        economy*
        .82+
        seedBase*
        .35;
    }

    if(
        resourceId===
        "electronics"
    ){
        return 15+
        technology*
        .92+
        seedBase*
        .28;
    }

    return 50;
}


/* =========================================================
   TRADE ACCEPTANCE SCORE
========================================================= */

function GD8TradeAcceptanceScore(
    code,
    resourceId,
    direction,
    amount,
    unitPrice
)
{
    const ai=
        GD8AI(
            code
        );

    const relationValue=
        GD8Relation(
            code
        );

    const reputation=
        GD8Number(
            state.nation&&
            state.nation.reputation,
            50
        );

    const tradeInterest=
        GD8Number(
            ai.tradeInterest,
            50
        );

    const aiStock=
        GD8CountryResourceStock(
            code,
            resourceId
        );

    const marketPrice=
        GD8ResourcePrice(
            resourceId
        );

    let score=
        42;

    score+=
        relationValue*
        .23;

    score+=
        (
            reputation-
            50
        )*
        .12;

    score+=
        (
            tradeInterest-
            50
        )*
        .23;

    if(
        direction===
        "buy"
    ){
        score+=
            Math.min(
                18,
                Math.max(
                    -18,
                    (
                        unitPrice/
                        marketPrice-
                        1
                    )*
                    60
                )
            );

        score+=
            Math.min(
                15,
                (
                    80-
                    aiStock
                )*
                .14
            );
    }
    else{
        score+=
            Math.min(
                18,
                Math.max(
                    -18,
                    (
                        1-
                        unitPrice/
                        marketPrice
                    )*
                    60
                )
            );

        score+=
            Math.min(
                14,
                (
                    aiStock-
                    55
                )*
                .10
            );
    }

    score-=
        Math.max(
            0,
            amount-
            25
        )*
        .15;

    try{
        if(
            typeof isSanctioned===
            "function"&&
            isSanctioned(
                code
            )
        ){
            score-=
                35;
        }
    }
    catch(
        error
    ){
    }

    try{
        if(
            typeof playerWarAgainst===
            "function"&&
            playerWarAgainst(
                code
            )
        ){
            score-=
                100;
        }
    }
    catch(
        error
    ){
    }

    score+=
        Math.random()*
        16-
        8;

    return GD8Clamp(
        score,
        0,
        100
    );
}


/* =========================================================
   TRADE OFFER
========================================================= */

function GD8MakeTradeOffer(
    countryCode,
    resourceId,
    direction,
    amount,
    unitPrice
)
{
    GD8Migrate();

    amount=
        Math.max(
            1,
            Math.floor(
                GD8Number(
                    amount,
                    1
                )
            )
        );

    unitPrice=
        Math.max(
            1,
            GD8Number(
                unitPrice,
                GD8ResourcePrice(
                    resourceId
                )
            )
        );

    if(
        !countryCode||
        countryCode===
        state.player
    ){
        GD8Toast(
            "کشور مقصد معتبر نیست"
        );

        return;
    }

    const resource=
        GD8_RESOURCES.find(
            item=>
                item.id===
                resourceId
        );

    if(
        !resource
    ){
        return;
    }

    if(
        direction===
        "sell"&&
        GD8Number(
            state.resources[
                resourceId
            ]
        )<
        amount
    ){
        GD8Toast(
            "موجودی کافی نیست"
        );

        return;
    }

    const total=
        amount*
        unitPrice;

    if(
        direction===
        "buy"&&
        GD8Number(
            state.economy.money
        )<
        total
    ){
        GD8Toast(
            "بودجه کافی نیست"
        );

        return;
    }

    const score=
        GD8TradeAcceptanceScore(
            countryCode,
            resourceId,
            direction,
            amount,
            unitPrice
        );

    const accepted=
        GD8Chance(
            score
        );

    const offer=
    {
        id:
            "TRADE-"+
            Date.now()+
            "-"+
            Math.random()
            .toString(
                36
            )
            .slice(
                2
            ),

        countryCode,

        resourceId,

        direction,

        amount,

        unitPrice,

        total,

        acceptanceScore:
            score,

        status:
            accepted
            ?
            "accepted"
            :
            "rejected",

        date:
        {
            year:
                state.date.year,

            month:
                state.date.month,

            day:
                state.date.day
        }
    };

    state.tradeSystem.offers.unshift(
        offer
    );

    state.tradeSystem.history.unshift(
        offer
    );

    if(
        accepted
    ){
        if(
            direction===
            "buy"
        ){
            state.economy.money-=
                total;

            state.resources[
                resourceId
            ]+=
                amount;

            state.economy.imports=
                GD8Number(
                    state.economy.imports
                )+
                total;
        }
        else{
            state.resources[
                resourceId
            ]-=
                amount;

            state.economy.money+=
                total;

            state.economy.exports=
                GD8Number(
                    state.economy.exports
                )+
                total;
        }

        GD8ChangeRelation(
            countryCode,
            2+
            Math.min(
                4,
                amount/
                25
            )
        );

        GD8PushAIMessage(
            {
                from:
                    countryCode,

                type:
                    "trade",

                title:
                    "معامله پذیرفته شد",

                text:
                    direction===
                    "buy"
                    ?
                    `${GD8CountryName(countryCode)} با فروش ${amount} واحد ${resource.name} به کشور شما موافقت کرد.`
                    :
                    `${GD8CountryName(countryCode)} با خرید ${amount} واحد ${resource.name} از کشور شما موافقت کرد.`,

                importance:
                    2,

                status:
                    "info"
            }
        );

        GD8Toast(
            "✅ پیشنهاد تجاری پذیرفته شد"
        );
    }
    else{
        GD8ChangeRelation(
            countryCode,
            -.5
        );

        GD8PushAIMessage(
            {
                from:
                    countryCode,

                type:
                    "trade",

                title:
                    "معامله رد شد",

                text:
                    `${GD8CountryName(countryCode)} شرایط پیشنهاد ${resource.name} را نپذیرفت.`,

                importance:
                    1,

                status:
                    "info"
            }
        );

        GD8Toast(
            "❌ پیشنهاد تجاری رد شد"
        );
    }

    GD8Save();

    GD8Render();

    GD8OpenTradeHub(
        resourceId,
        countryCode
    );
}


/* =========================================================
   TRADE HUB
========================================================= */

function GD8OpenTradeHub(
    defaultResource=
        "food",
    selectedCountry=
        null
)
{
    GD8Migrate();

    const countries=

/* =========================================================
   TRADE BUTTON HANDLER
========================================================= */

function GD8SendTradeOffer(
    countryCode,
    resourceId,
    direction
)
{
    const amountElement=
        document.getElementById(
            "gdTradeAmount_"+
            resourceId
        );

    const priceElement=
        document.getElementById(
            "gdTradePrice_"+
            resourceId
        );

    const amount=
        amountElement
        ?
        GD8Number(
            amountElement.value,
            10
        )
        :
        10;

    const price=
        priceElement
        ?
        GD8Number(
            priceElement.value,
            GD8ResourcePrice(
                resourceId
            )
        )
        :
        GD8ResourcePrice(
            resourceId
        );

    GD8MakeTradeOffer(
        countryCode,
        resourceId,
        direction,
        amount,
        price
    );
}


/* =========================================================
   TRADE COUNTRY SEARCH
========================================================= */

function GD8FilterTradeCountries(
    value
)
{
    const query=
        String(
            value||
            ""
        )
        .trim()
        .toLowerCase();

    const cards=
        document.querySelectorAll(
            "[data-trade-country]"
        );

    for(
        const card of
        cards
    ){
        const code=
            card.dataset.tradeCountry;

        const name=
            GD8CountryName(
                code
            )
            .toLowerCase();

        card.style.display=
            !query||
            name.includes(
                query
            )||
            code.toLowerCase()
            .includes(
                query
            )
            ?
            ""
            :
            "none";
    }
}

                "-"+
                Math.random()

        type:
            message.type||
            "diplomatic",

        title:
            message.title||
            "پیام بین‌المللی",

        text:
            message.text||
            "",

        importance:
            GD8Number(
                message.importance,
                1
            ),

            message.status||
            "info",

        created:
        {
            year:
                state.date.year,

            month:
                state.date.month,

            day:
                state.date.day

        entry
    );

    if(
        state.aiNews.length>
        160
    ){
        state.aiNews.length=
            160;
    }
}


/* =========================================================
   DETAILED AI NEWS GENERATOR
========================================================= */

function GD8GenerateDetailedAINews()
{
    GD8Migrate();

    const countries=
        GD8CountryCodes()
        .filter(
            code=>
                code!==
                state.player
        );

    if(
        !countries.length
    ){
        return;
    }

    const eventCount=
        state.difficulty===
        "expert"
        ?
        5
        :
        state.difficulty===
        "hard"
        ?
        4
        :
        3;

    for(
        let index=
            0;
        index<
            eventCount;
        index++
    ){
        const code=
            GD8Pick(
                countries
            );

        if(
            !code
        ){
            continue;
        }

        const ai=
            GD8AI(
                code
            );

        const relationValue=
            GD8Relation(
                code
            );

        const possibleTypes=
        [
            "diplomatic",
            "trade",
            "economic",
            "intelligence"
        ];

        if(
            GD8Number(
                ai.aggression,
                50
            )>
            60
        ){
            possibleTypes.push(
                "military"
            );
        }

        if(
            GD8Number(
                ai.stability,
                60
            )<
            40
        ){
            possibleTypes.push(
                "crisis"
            );
        }

        if(
            relationValue>
            40
        ){
            possibleTypes.push(
                "alliance"
            );
        }

        if(
            relationValue<
            -35
        ){
            possibleTypes.push(
                "warning"
            );
        }

        const type=
            GD8Pick(
                possibleTypes
            );

        const textTemplate=
            GD8Pick(
                GD8_AI_MESSAGE_TEMPLATES[
                    type
                ]
            );

        const titles=
        {
            diplomatic:
                "پیام دیپلماتیک",

            trade:
                "خبر تجاری",

            economic:
                "گزارش اقتصادی",

            alliance:
                "تحرک سیاسی",

            warning:
                "هشدار سیاسی",

            intelligence:
                "گزارش اطلاعاتی",

            crisis:
                "بحران داخلی",

            military:
                "گزارش نظامی"
        };

        GD8PushAIMessage(
            {
                from:
                    code,

                type,

                title:
                    titles[
                        type
                    ],

                text:
                    `${GD8CountryName(code)} ${textTemplate}`,

                importance:
                    type===
                    "crisis"||
                    type===
                    "warning"
                    ?
                    3
                    :
                    type===
                    "military"
                    ?
                    2
                    :
                    1
            }
        );
    }
}

function GD8GenerateAIDirectProposal()
{

        );

        Math.random();

        roll<
        .22&&
        GD8Number(
            ai.tradeInterest,
            50
        )>
        45
    ){
        const resource=
            GD8Pick(
                GD8_RESOURCES

            [

                20,
                30,
                50
            ][
                Math.floor(
                    Math.random()*
                    4

            ];

        const price=
            GD8ResourcePrice(
                resource.id
            )*
            (
                .91+
                Math.random()*
                .20
            );

            ?

            :
            [];

                status:

        );

        GD8Toast(
            "📨 پیشنهاد تجاری جدید"
        );

        return;
    }

    if(
        roll<
        .38&&
        relationValue>
        20
    ){
        state.inbox.unshift(
            {
                id:
                    "AIPROP-"+
                    Date.now()+
                    Math.random(),

                from:
                    code,

                type:
                    "economicCooperation",

                title:
                    "همکاری اقتصادی",

                text:
                    `${GD8CountryName(code)} پیشنهاد برنامه همکاری صنعتی مشترک داده است.`,

                value:
                    900+
                    Math.random()*
                    1300,

                status:
                    "pending"
            }
        );

        return;
    }

    if(
        roll<
        .52&&
        relationValue>
        45
    ){
        state.inbox.unshift(
            {
                id:
                    "AIPROP-"+
                    Date.now()+
                    Math.random(),

                from:
                    code,

                type:
                    "research",

                title:
                    "پیشنهاد همکاری فناوری",

                text:
                    `${GD8CountryName(code)} پیشنهاد تبادل فناوری و همکاری دانشگاهی داده است.`,

                status:
                    "pending"
            }
        );

        return;
    }

    if(
        roll<
        .67&&
        relationValue<
        -25
    ){
        state.inbox.unshift(
            {
                id:
                    "AIPROP-"+
                    Date.now()+
                    Math.random(),

                from:
                    code,

                type:
                    "ultimatum",

                title:
                    "فشار دیپلماتیک",

                text:
                    `${GD8CountryName(code)} خواهان کاهش فوری تنش سیاسی شده است.`,

                status:
                    "pending"
            }
        );

        return;
    }

    if(
        roll<
        .78&&
        relationValue>
        10
    ){
        state.inbox.unshift(
            {
                id:
                    "AIPROP-"+
                    Date.now()+
                    Math.random(),

                from:
                    code,

                type:
                    "aid",

                title:
                    "پیشنهاد کمک مالی",

                text:
                    `${GD8CountryName(code)} پیشنهاد بسته کمک اقتصادی داده است.`,

                value:
                    500+
                    Math.random()*
                    1800,

                status:
                    "pending"
            }
        );

        return;
    }

    GD8GenerateDetailedAINews();

/* =========================================================
   RESPOND TO NEW AI PROPOSALS
========================================================= */

function GD8RespondProposal(
    id,
    accepted
)
{
    const proposal=
        state.inbox.find(
            item=>
                item.id===
                id
        );

    if(
        !proposal||
        proposal.status!==
        "pending"
    ){
        return;
    }

    proposal.status=
        accepted
        ?
        "accepted"
        :
        "rejected";

    if(
        !accepted
    ){
        GD8ChangeRelation(
            proposal.from,
            -3
        );

        GD8PushAIMessage(
            {
                from:
                    proposal.from,

                type:
                    "diplomatic",

                title:
                    "پیشنهاد رد شد",

                text:
                    `${GD8CountryName(proposal.from)} از رد شدن پیشنهاد خود ابراز نارضایتی کرد.`,

                importance:
                    1
            }
        );

        GD8Toast(
            "پیشنهاد رد شد"
        );

        GD8Save();

        GD8OpenAIInbox(
            "messages"
        );

        return;
    }

    if(
        proposal.type===
        "resourceTrade"
    ){
        const resource=
            GD8_RESOURCES.find(
                item=>
                    item.id===
                    proposal.resourceId
            );

        const amount=
            GD8Number(
                proposal.amount
            );

        const total=
            amount*
            GD8Number(
                proposal.unitPrice
            );

        if(
            GD8Number(
                state.resources[
                    proposal.resourceId
                ]
            )<
            amount
        ){
            proposal.status=
                "failed";

            GD8Toast(
                "منبع کافی برای قبول پیشنهاد نیست"
            );

            GD8OpenAIInbox(
                "messages"
            );

            return;
        }

        state.resources[
            proposal.resourceId
        ]-=
            amount;

        state.economy.money+=
            total;

        state.economy.exports=
            GD8Number(
                state.economy.exports
            )+
            total;

        GD8ChangeRelation(
            proposal.from,
            5
        );

        GD8PushAIMessage(
            {
                from:
                    proposal.from,

                type:
                    "trade",

                title:
                    "قرارداد اجرا شد",

                text:
                    `معامله ${resource?resource.name:proposal.resourceId} با ${GD8CountryName(proposal.from)} با موفقیت انجام شد.`,

                importance:
                    2
            }
        );
    }

    if(
        proposal.type===
        "economicCooperation"
    ){
        state.economy.money+=
            GD8Number(
                proposal.value,
                1000
            )*
            .35;

        state.nation.industry=
            GD8Number(
                state.nation.industry,
                50
            )+
            .8;

        state.nation.trade=
            GD8Number(
                state.nation.trade,
                50
            )+
            1;

        GD8ChangeRelation(
            proposal.from,
            8
        );
    }

    if(
        proposal.type===
        "research"
    ){
        state.nation.technology=
            GD8Number(
                state.nation.technology,
                50
            )+
            .7;

        state.society.education=
            GD8Number(
                state.society.education,
                50
            )+
            .5;

        GD8ChangeRelation(
            proposal.from,
            7
        );
    }

    if(
        proposal.type===
        "ultimatum"
    ){
        GD8ChangeRelation(
            proposal.from,
            12
        );

        state.nation.reputation=
            GD8Clamp(
                GD8Number(
                    state.nation.reputation,
                    50
                )-
                1,
                0,
                100
            );
    }

    if(
        proposal.type===
        "aid"
    ){
        state.economy.money+=
            GD8Number(
                proposal.value,
                1000
            );

        GD8ChangeRelation(
            proposal.from,
            5
        );
    }

    GD8Toast(
        "✅ پیشنهاد پذیرفته شد"
    );

    GD8Save();

    GD8Render();

    GD8OpenAIInbox(
        "messages"
    );
}

/* =========================================================
   SVG MAP POINT TO SCREEN
========================================================= */

function GD8MapPointToScreen(
    point
)
{
    const svg=
        document.getElementById(
            "worldSvg"
        );

    const viewport=
        document.getElementById(
            "mapViewport"
        );

    if(
        !svg||
        !viewport
    ){
        return{
            x:
                0,

            y:
                0
        };
    }

    const rect=
        svg.getBoundingClientRect();

    let mapX=
        point[0];

    let mapY=
        point[1];

    let zoom=
        1;

    let translateX=
        0;

    let translateY=
        0;

    try{
        zoom=
            GD8Number(
                state.map.zoom,
                1
            );

        translateX=
            GD8Number(
                state.map.x
            );

        translateY=
            GD8Number(
                state.map.y
            );
    }
    catch(
        error
    ){
    }

    mapX=
        translateX+
        mapX*
        zoom;

    mapY=
        translateY+
        mapY*
        zoom;

    const x=
        rect.left+
        mapX/
        1600*
        rect.width;

    const y=
        rect.top+
        mapY/
        800*
        rect.height;

    const viewportRect=
        viewport.getBoundingClientRect();

    return{
        x:
            x-
            viewportRect.left,

        y:
            y-
            viewportRect.top
    };
}


/* =========================================================
   FLIGHT TRAIL
========================================================= */

function GD8CreateTrail(
    from,
    to,
    className=
        ""
)
{
    const layer=
        GD8EnsureFxLayer();

    if(
        !layer
    ){
        return null;
    }

    const dx=
        to.x-
        from.x;

    const dy=
        to.y-
        from.y;

    const length=
        Math.hypot(
            dx,
            dy
        );

    const angle=
        Math.atan2(
            dy,
            dx
        )*
        180/
        Math.PI;

    const trail=
        document.createElement(
            "div"
        );

    trail.className=
        "gd-flight-trail "+
        className;

    trail.style.left=
        from.x+
        "px";

    trail.style.top=
        from.y+
        "px";

    trail.style.width=
        length+
        "px";

    trail.style.transform=
        "rotate("+
        angle+
        "deg)";

    layer.appendChild(
        trail
    );

    return trail;
}


/* =========================================================
   ANIMATE ELEMENT
========================================================= */

function GD8AnimateProjectile(
    element,
    from,
    to,
    duration
)
{
    const dx=
        to.x-
        from.x;

    const dy=
        to.y-
        from.y;

    const angle=
        Math.atan2(
            dy,
            dx
        )*
        180/
        Math.PI;

    element.style.left=
        from.x+
        "px";

    element.style.top=
        from.y+
        "px";

    element.style.transform=
        "translate(-50%,-50%) rotate("+
        angle+
        "deg)";

    const start=
        performance.now();

    return new Promise(
        resolve=>
        {
            function frame(
                now
            ){
                const progress=
                    Math.min(
                        1,
                        (
                            now-
                            start
                        )/
                        duration
                    );

                const eased=
                    progress<
                    .5
                    ?
                    2*
                    progress*
                    progress
                    :
                    1-
                    Math.pow(
                        -2*
                        progress+
                        2,
                        2
                    )/
                    2;

                const arc=
                    Math.sin(
                        Math.PI*
                        progress
                    )*
                    Math.min(
                        90,
                        Math.abs(
                            dx
                        )*
                        .11+
                        25
                    );

                const x=
                    from.x+
                    dx*
                    eased;

                const y=
                    from.y+
                    dy*
                    eased-
                    arc;

                element.style.left=
                    x+
                    "px";

                element.style.top=
                    y+
                    "px";

                const tangentY=
                    dy-
                    Math.cos(
                        Math.PI*
                        progress
                    )*
                    Math.PI*
                    Math.min(
                        90,
                        Math.abs(
                            dx
                        )*
                        .11+
                        25
                    );

                const dynamicAngle=
                    Math.atan2(
                        tangentY,
                        dx
                    )*
                    180/
                    Math.PI;

                element.style.transform=
                    "translate(-50%,-50%) rotate("+
                    dynamicAngle+
                    "deg)";

                if(
                    progress<
                    1
                ){
                    requestAnimationFrame(
                        frame
                    );
                }
                else{
                    resolve();
                }
            }

            requestAnimationFrame(
                frame
            );
        }
    );
}

/* =========================================================
   MISSILE LAUNCH ANIMATION
========================================================= */

async function GD8PlayMissileAnimation(
    targetCode,
    intercepted
)
{
    const layer=
        GD8EnsureFxLayer();

    if(
        !layer
    ){
        return;
    }

    const playerCode=
        state.player||
        state.playerId;

    const fromMap=
        GD8MapCenter(
            playerCode
        );

    const toMap=
        GD8MapCenter(
            targetCode
        );

    const from=
        GD8MapPointToScreen(
            fromMap
        );

    const to=
        GD8MapPointToScreen(
            toMap
        );

    const missile=
        document.createElement(
            "div"
        );

    missile.className=
        "gd-missile";

    layer.appendChild(
        missile
    );

    const missileTrail=
        GD8CreateTrail(
            from,
            to
        );

    if(
        intercepted
    ){
        const interceptPoint=
        {
            x:
                from.x+
                (
                    to.x-
                    from.x
                )*
                .78,

            y:
                from.y+
                (
                    to.y-
                    from.y
                )*
                .78-
                20
        };

        const defenderStart=
        {
            x:
                to.x+
                (
                    Math.random()*
                    70-
                    35
                ),

            y:
                to.y+
                25
        };

        const interceptor=
            document.createElement(
                "div"
            );

        interceptor.className=
            "gd-interceptor";

        layer.appendChild(
            interceptor
        );

        const interceptorTrail=
            GD8CreateTrail(
                defenderStart,
                interceptPoint,
                "intercept"
            );

        const missilePromise=
            GD8AnimateProjectile(
                missile,
                from,
                interceptPoint,
                1450
            );

        await new Promise(
            resolve=>
                setTimeout(
                    resolve,
                    620
                )
        );

        const interceptorPromise=
            GD8AnimateProjectile(
                interceptor,
                defenderStart,
                interceptPoint,
                800
            );

        await Promise.all(
            [
                missilePromise,
                interceptorPromise
            ]
        );

        missile.remove();

        interceptor.remove();

        if(
            missileTrail
        ){
            missileTrail.remove();
        }

        if(
            interceptorTrail
        ){
            interceptorTrail.remove();
        }

        GD8InterceptRing(
            interceptPoint
        );

        GD8Explosion(
            interceptPoint
        );

        GD8ImpactLabel(
            interceptPoint,
            "🛡️ موشک رهگیری شد",
            "intercepted"
        );

        return;
    }

    await GD8AnimateProjectile(
        missile,
        from,
        to,
        1750
    );

    missile.remove();

    if(
        missileTrail
    ){
        missileTrail.remove();
    }

    GD8Explosion(
        to
    );

    GD8ImpactLabel(
        to,
        "💥 اصابت ثبت شد",
        "hit"
    );
}

            state.inventory[
                missileId
            ]
        );

    if(
        owned<=
        0
    ){
        GD8Toast(
            "این موشک در انبار موجود نیست"
        );

        return;
    }

    const activeWar=
        typeof playerWarAgainst===
        "function"
        ?
        playerWarAgainst(
            targetCode
        )
        :
        null;

    if(
        !activeWar
    ){
        GD8Toast(
            "برای استفاده از موشک باید با کشور هدف در جنگ باشی"
        );

        return;
    }

    state.inventory[
        missileId
    ]=
        owned-
        1;

    const targetDefense=
        GD8TargetDefense(
            targetCode
        );

    const attackerTech=
        GD8Number(
            state.nation.technology,
            50
        );

    const missilePower=
        GD8Number(
            equipment.power,
            60
        );

    let interceptChance=
        targetDefense*
        .72-
        attackerTech*
        .13-
        missilePower*
        .08+
        18;

    interceptChance=
        GD8Clamp(
            interceptChance,
            8,
            82
        );

    const intercepted=
        GD8Chance(
            interceptChance
        );

    state.missileHistory.unshift(
        {
            id:
                "MISSILE-"+
                Date.now(),

            targetCode,

            missileId,

            intercepted,

            interceptChance,

            date:
            {
                year:
                    state.date.year,

                month:
                    state.date.month,

                day:
                    state.date.day
            }
        }
    );

    GD8Save();

    try{
        if(
            typeof closeModal===
            "function"
        ){
            closeModal();
        }
    }
    catch(
        error
    ){
    }

    await GD8PlayMissileAnimation(
        targetCode,
        intercepted
    );

    if(
        intercepted
    ){
        GD8PushAIMessage(
            {
                from:
                    targetCode,

                type:
                    "military",

                title:
                    "رهگیری موشک",

                text:
                    `سامانه‌های دفاعی ${GD8CountryName(targetCode)} یک حمله موشکی را در بازی رهگیری کردند.`,

                importance:
                    3
            }
        );

        GD8Toast(
            "🛡️ موشک رهگیری شد"
        );
    }
    else{
        const abstractDamage=
            GD8Clamp(
                missilePower*
                .10+
                Math.random()*
                5,
                2,
                15
            );

        const ai=
            GD8AI(
                targetCode
            );

        if(
            ai
        ){
            ai.readiness=
                GD8Clamp(
                    GD8Number(
                        ai.readiness,
                        60
                    )-
                    abstractDamage*
                    .35,
                    10,
                    100
                );

            ai.stability=
                GD8Clamp(
                    GD8Number(
                        ai.stability,
                        60
                    )-
                    abstractDamage*
                    .12,
                    10,
                    100
                );
        }

        GD8PushAIMessage(
            {
                from:
                    targetCode,

                type:
                    "military",

                title:
                    "اصابت موشکی",

                text:
                    `یک حمله موشکی در شبیه‌سازی به ${GD8CountryName(targetCode)} اصابت کرد و آمادگی آن کشور کاهش یافت.`,

                importance:
                    3
            }
        );

        GD8Toast(
            "💥 موشک به هدف اصابت کرد"
        );
    }

    GD8Save();

    GD8Render();
}

function GD8OpenMissileHistory()

        .slice(

                    '<div class="card-desc">'+

                    " "+
                    GD8Safe(
                        GD8CountryName(
                            event.targetCode
                        )
                    )+

                        equipment

    );
}


/* =========================================================
   ADD TRADE BUTTON TO DOCK
========================================================= */

function GD8InstallDockButtons()
{
    const dock=
        document.getElementById(
            "dock"
        );

    if(
        !dock
    ){
        return;
    }

    if(
        !document.getElementById(
            "gdTradeDockButton"
        )
    ){
        const tradeButton=
            document.createElement(
                "button"
            );

        tradeButton.id=
            "gdTradeDockButton";

        tradeButton.className=
            "dock-btn";

        tradeButton.innerHTML=
            '<span>📦</span><small>تجارت</small>';

        tradeButton.addEventListener(
            "click",
            function(){

                GD8OpenTradeHub(
                    "food"
                );

            }
        );

        const diplomacyButtons=
            Array.from(
                dock.children
            );

        const diplomacy=
            diplomacyButtons.find(
                element=>
                    element.textContent
                    .includes(
                        "دیپلماسی"
                    )
            );

        if(
            diplomacy
        ){
            dock.insertBefore(
                tradeButton,
                diplomacy
            );
        }
        else{
            dock.appendChild(
                tradeButton
            );
        }
    }

    if(
        !document.getElementById(
            "gdMissileHistoryDockButton"
        )
    ){
        const missileButton=
            document.createElement(
                "button"
            );

        missileButton.id=
            "gdMissileHistoryDockButton";

        missileButton.className=
            "dock-btn";

        missileButton.innerHTML=
            '<span>🚀</span><small>موشک‌ها</small>';

        missileButton.addEventListener(
            "click",
            GD8OpenMissileHistory
        );

        dock.appendChild(
            missileButton
        );
    }
}

function GD8DailyDetailProcess()
{
    GD8Migrate();

    const day=
        GD8Number(
            state.date&&
            state.date.day,
            1
        );

    if(
        day%
        2===
        0
    ){
        GD8GenerateDetailedAINews();
    }

    if(
        day%
        3===
        0&&
        GD8Chance(
            55
        )
    ){
        GD8GenerateAIDirectProposal();
    }
}
