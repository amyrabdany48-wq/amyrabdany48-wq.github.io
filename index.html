<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WORLD EMPIRE — MODERN ERA</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    :root{
      --bg:#04070d;
      --panel:rgba(8,14,24,.88);
      --panel2:rgba(14,23,38,.92);
      --border:rgba(255,255,255,.10);
      --cyan:#31e8ff;
      --blue:#388cff;
      --green:#35e59b;
      --red:#ff516c;
      --yellow:#ffd54a;
      --purple:#a674ff;
      --orange:#ff9b42;
      --text:#eef7ff;
      --muted:#8da4b8;
      --shadow:0 15px 55px rgba(0,0,0,.55);
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Tahoma,Arial,sans-serif;
    }

    button,
    input,
    select{
      font-family:inherit;
    }

    #map{
      position:fixed;
      inset:0;
      z-index:1;
      background:#07111b;
    }

    .leaflet-container{
      background:#07111b !important;
    }

    .leaflet-control-attribution{
      display:none!important;
    }

    #particles{
      position:fixed;
      inset:0;
      z-index:3;
      pointer-events:none;
      opacity:.6;
    }

    .vignette{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:4;
      background:
        radial-gradient(circle at center, transparent 40%, rgba(0,0,0,.28) 75%, rgba(0,0,0,.65) 100%);
    }

    .scanlines{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:5;
      opacity:.06;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          #fff 3px
        );
    }

    .glass{
      background:linear-gradient(
        180deg,
        rgba(12,21,34,.94),
        rgba(5,10,18,.90)
      );
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
    }

    /* =========================
       TOP HUD
    ========================= */

    #topbar{
      position:fixed;
      z-index:20;
      top:10px;
      left:10px;
      right:10px;
      height:68px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px;
      border-radius:18px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
    }

    #topbar::-webkit-scrollbar{
      display:none;
    }

    .brand{
      min-width:165px;
      height:50px;
      border-radius:14px;
      padding:7px 11px;
      border:1px solid rgba(49,232,255,.25);
      background:
        linear-gradient(135deg,rgba(49,232,255,.12),rgba(166,116,255,.09));
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .brand strong{
      font-size:15px;
      color:var(--cyan);
      letter-spacing:.5px;
    }

    .brand small{
      color:var(--muted);
      margin-top:2px;
      font-size:10px;
    }

    .stat{
      min-width:92px;
      height:50px;
      border-radius:14px;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.07);
      padding:6px 9px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .stat span{
      font-size:10px;
      color:var(--muted);
      margin-bottom:3px;
    }

    .stat b{
      color:#fff;
      font-size:14px;
    }

    .stat.money b{color:var(--green)}
    .stat.population b{color:var(--cyan)}
    .stat.economy b{color:var(--yellow)}
    .stat.military b{color:var(--red)}
    .stat.technology b{color:var(--purple)}
    .stat.stability b{color:var(--green)}

    .dateStat{
      min-width:105px;
    }

    /* =========================
       MAP MODES
    ========================= */

    #mapModes{
      position:fixed;
      z-index:15;
      top:90px;
      left:12px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .mapBtn{
      width:44px;
      height:44px;
      border:none;
      border-radius:13px;
      color:#d9ecff;
      background:rgba(5,12,22,.90);
      border:1px solid rgba(255,255,255,.1);
      box-shadow:0 8px 25px rgba(0,0,0,.35);
      cursor:pointer;
      font-size:18px;
      transition:.2s;
    }

    .mapBtn:active{
      transform:scale(.94);
    }

    .mapBtn.active{
      background:linear-gradient(135deg,var(--cyan),var(--blue));
      color:#02131c;
      border-color:transparent;
      box-shadow:0 0 24px rgba(49,232,255,.35);
    }

    /* =========================
       RIGHT PANEL
    ========================= */

    #worldPanel{
      position:fixed;
      z-index:15;
      top:90px;
      right:12px;
      width:245px;
      max-height:calc(100vh - 190px);
      border-radius:18px;
      overflow:hidden;
    }

    .panelTitle{
      height:46px;
      padding:0 13px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--border);
    }

    .panelTitle b{
      font-size:13px;
    }

    .panelTitle span{
      color:var(--cyan);
      font-size:11px;
    }

    #rankList{
      padding:8px;
      overflow-y:auto;
      max-height:calc(100vh - 240px);
    }

    .rank{
      display:flex;
      gap:8px;
      align-items:center;
      padding:8px;
      border-radius:12px;
      margin-bottom:5px;
      cursor:pointer;
      background:rgba(255,255,255,.025);
      border:1px solid rgba(255,255,255,.05);
      transition:.2s;
    }

    .rank:hover{
      background:rgba(49,232,255,.06);
    }

    .rankNum{
      width:25px;
      height:25px;
      flex:0 0 auto;
      border-radius:8px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.06);
      color:var(--cyan);
      font-size:10px;
    }

    .rankText{
      min-width:0;
      flex:1;
    }

    .rankText b{
      font-size:11px;
      display:block;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .rankText small{
      display:block;
      color:var(--muted);
      font-size:9px;
      margin-top:2px;
    }

    /* =========================
       BOTTOM DOCK
    ========================= */

    #dock{
      position:fixed;
      z-index:20;
      bottom:10px;
      left:50%;
      transform:translateX(-50%);
      width:min(920px,calc(100% - 20px));
      border-radius:20px;
      padding:8px;
      display:flex;
      justify-content:center;
      gap:6px;
      overflow-x:auto;
      scrollbar-width:none;
    }

    #dock::-webkit-scrollbar{
      display:none;
    }

    .dockBtn{
      min-width:83px;
      height:55px;
      flex:1;
      max-width:115px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      background:rgba(255,255,255,.025);
      color:#dcefff;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:3px;
      cursor:pointer;
      transition:.2s;
    }

    .dockBtn:hover{
      background:rgba(49,232,255,.07);
      border-color:rgba(49,232,255,.22);
    }

    .dockBtn:active{
      transform:scale(.95);
    }

    .dockBtn span{
      font-size:18px;
    }

    .dockBtn small{
      font-size:9px;
      color:#abc1d4;
    }

    /* =========================
       MODAL
    ========================= */

    #modalOverlay{
      position:fixed;
      z-index:100;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:14px;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(9px);
    }

    #modalOverlay.show{
      display:flex;
    }

    #modal{
      width:min(950px,100%);
      max-height:88vh;
      border-radius:24px;
      overflow:hidden;
      animation:modalIn .18s ease-out;
    }

    @keyframes modalIn{
      from{
        opacity:0;
        transform:scale(.96) translateY(10px);
      }
      to{
        opacity:1;
        transform:scale(1) translateY(0);
      }
    }

    .modalHeader{
      height:58px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 15px;
      border-bottom:1px solid var(--border);
    }

    .modalHeader h2{
      font-size:16px;
      color:var(--cyan);
    }

    .closeBtn{
      width:36px;
      height:36px;
      border:none;
      border-radius:11px;
      color:#fff;
      background:rgba(255,81,108,.12);
      border:1px solid rgba(255,81,108,.25);
      font-size:18px;
      cursor:pointer;
    }

    #modalBody{
      padding:12px;
      max-height:calc(88vh - 58px);
      overflow-y:auto;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:9px;
    }

    .card{
      border-radius:16px;
      padding:12px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
      border:1px solid rgba(255,255,255,.07);
      min-height:120px;
    }

    .card h3,
    .card b{
      font-size:13px;
      color:#fff;
    }

    .card p{
      color:var(--muted);
      font-size:10px;
      line-height:1.8;
      margin:7px 0;
    }

    .card small{
      color:#7690a6;
      display:block;
      margin-top:4px;
      font-size:9px;
    }

    .btn{
      border:none;
      border-radius:10px;
      padding:8px 11px;
      color:#06111b;
      background:linear-gradient(135deg,var(--cyan),#86f8ff);
      cursor:pointer;
      font-weight:bold;
      font-size:10px;
      margin:3px 2px 0 0;
    }

    .btn.green{
      background:linear-gradient(135deg,var(--green),#8fffcf);
    }

    .btn.red{
      background:linear-gradient(135deg,var(--red),#ff91a3);
    }

    .btn.purple{
      background:linear-gradient(135deg,var(--purple),#d3bfff);
    }

    .btn.yellow{
      background:linear-gradient(135deg,var(--yellow),#ffe998);
    }

    .btn.dark{
      color:#dcefff;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.1);
    }

    .kpis{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:8px;
      margin-bottom:10px;
    }

    .kpi{
      padding:10px;
      border-radius:14px;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.065);
    }

    .kpi span{
      display:block;
      font-size:9px;
      color:var(--muted);
      margin-bottom:4px;
    }

    .kpi b{
      color:var(--cyan);
      font-size:14px;
    }

    .sectionTitle{
      font-size:12px;
      margin:15px 2px 8px;
      color:#cbeaff;
    }

    .search{
      width:100%;
      height:42px;
      border:none;
      outline:none;
      border-radius:12px;
      padding:0 12px;
      color:#fff;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1);
      margin-bottom:10px;
    }

    .progress{
      height:7px;
      background:rgba(255,255,255,.05);
      border-radius:999px;
      overflow:hidden;
      margin-top:7px;
    }

    .progress > div{
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,var(--cyan),var(--blue));
    }

    /* =========================
       TOAST
    ========================= */

    #toasts{
      position:fixed;
      z-index:150;
      top:90px;
      left:50%;
      transform:translateX(-50%);
      width:min(330px,calc(100% - 24px));
      pointer-events:none;
    }

    .toast{
      background:rgba(7,15,26,.95);
      border:1px solid rgba(49,232,255,.25);
      border-radius:13px;
      padding:10px 12px;
      margin-bottom:7px;
      box-shadow:0 15px 35px rgba(0,0,0,.35);
      animation:toastIn .2s ease-out;
      color:#dff9ff;
      font-size:11px;
    }

    @keyframes toastIn{
      from{
        opacity:0;
        transform:translateY(-8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* =========================
       LOADER
    ========================= */

    #loader{
      position:fixed;
      z-index:999;
      inset:0;
      background:
        radial-gradient(circle at center,#0e2333,#04070d 65%);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      transition:.5s;
    }

    #loader.hide{
      opacity:0;
      pointer-events:none;
    }

    .logoRing{
      width:110px;
      height:110px;
      border-radius:50%;
      border:2px solid rgba(49,232,255,.15);
      border-top-color:var(--cyan);
      border-right-color:var(--purple);
      animation:spin 1.1s linear infinite;
      display:grid;
      place-items:center;
      box-shadow:0 0 55px rgba(49,232,255,.16);
    }

    .logoRing::after{
      content:"🌐";
      font-size:42px;
      transform:rotate(0deg);
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .loaderTitle{
      margin-top:20px;
      color:var(--cyan);
      font-size:21px;
      letter-spacing:1px;
    }

    .loaderSub{
      margin-top:8px;
      color:#6e889f;
      font-size:10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:850px){
      #worldPanel{
        display:none;
      }

      #topbar{
        height:64px;
        top:6px;
        left:6px;
        right:6px;
      }

      .brand{
        min-width:138px;
        height:46px;
      }

      .brand strong{
        font-size:12px;
      }

      .stat{
        min-width:80px;
        height:46px;
      }

      .stat span{
        font-size:8px;
      }

      .stat b{
        font-size:12px;
      }

      #mapModes{
        top:80px;
        left:7px;
      }

      .mapBtn{
        width:39px;
        height:39px;
      }

      #dock{
        bottom:6px;
        left:6px;
        right:6px;
        transform:none;
        width:auto;
        justify-content:flex-start;
      }

      .dockBtn{
        min-width:66px;
        height:50px;
      }

      .dockBtn span{
        font-size:16px;
      }

      .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .kpis{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      #modal{
        max-height:92vh;
      }

      #modalBody{
        max-height:calc(92vh - 58px);
      }
    }

    @media(max-width:480px){
      .grid{
        grid-template-columns:1fr;
      }

      .card{
        min-height:auto;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>
  <canvas id="particles"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div id="loader">
    <div class="logoRing"></div>
    <div class="loaderTitle">WORLD EMPIRE</div>
    <div class="loaderSub">MODERN ERA • 2026</div>
  </div>

  <div id="topbar" class="glass">
    <div class="brand">
      <strong>WORLD EMPIRE</strong>
      <small>Modern Grand Strategy</small>
    </div>

    <div class="stat money">
      <span>💰 بودجه</span>
      <b id="money">0</b>
    </div>

    <div class="stat population">
      <span>👥 جمعیت</span>
      <b id="population">0</b>
    </div>

    <div class="stat economy">
      <span>📈 اقتصاد</span>
      <b id="economy">0</b>
    </div>

    <div class="stat military">
      <span>⚔️ نظامی</span>
      <b id="military">0</b>
    </div>

    <div class="stat technology">
      <span>🧠 فناوری</span>
      <b id="technology">0</b>
    </div>

    <div class="stat stability">
      <span>🛡️ ثبات</span>
      <b id="stability">0%</b>
    </div>

    <div class="stat dateStat">
      <span>📅 تاریخ</span>
      <b id="gameDate">2026/09/04</b>
    </div>
  </div>

  <div id="mapModes">
    <button class="mapBtn active" id="mode-normal" onclick="setMapMode('normal')">🌐</button>
    <button class="mapBtn" id="mode-economy" onclick="setMapMode('economy')">💰</button>
    <button class="mapBtn" id="mode-military" onclick="setMapMode('military')">⚔️</button>
    <button class="mapBtn" id="mode-relations" onclick="setMapMode('relations')">🤝</button>
    <button class="mapBtn" id="mode-stability" onclick="setMapMode('stability')">🛡️</button>
  </div>

  <div id="worldPanel" class="glass">
    <div class="panelTitle">
      <b>🌍 قدرت‌های جهان</b>
      <span>LIVE</span>
    </div>
    <div id="rankList"></div>
  </div>

  <div id="dock" class="glass">

    <button class="dockBtn" onclick="openCountryMenu()">
      <span>🏳️</span>
      <small>کشور</small>
    </button>

    <button class="dockBtn" onclick="openEconomy()">
      <span>💰</span>
      <small>اقتصاد</small>
    </button>

    <button class="dockBtn" onclick="openMilitary()">
      <span>⚔️</span>
      <small>ارتش</small>
    </button>

    <button class="dockBtn" onclick="openTechnology()">
      <span>🧠</span>
      <small>فناوری</small>
    </button>

    <button class="dockBtn" onclick="openDiplomacy()">
      <span>🤝</span>
      <small>دیپلماسی</small>
    </button>

    <button class="dockBtn" onclick="openWarMenu()">
      <span>🔥</span>
      <small>جنگ</small>
    </button>

    <button class="dockBtn" onclick="openProjects()">
      <span>🏗️</span>
      <small>پروژه‌ها</small>
    </button>

    <button class="dockBtn" onclick="openNews()">
      <span>📰</span>
      <small>اخبار</small>
    </button>

    <button class="dockBtn" onclick="openSettings()">
      <span>⚙️</span>
      <small>تنظیمات</small>
    </button>

  </div>

  <div id="modalOverlay">
    <div id="modal" class="glass">
      <div class="modalHeader">
        <h2 id="modalTitle">پنجره</h2>
        <button class="closeBtn" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    /* ==============================================================
       DATABASE
    ============================================================== */

    const COUNTRY_DB = {

    const $ = id => document.getElementById(id);

    function clamp(v,min,max){
      return Math.max(min,Math.min(max,v));
    }

    function hash(str){
      let h=0;
      str=String(str);

      for(let i=0;i<str.length;i++){
        h=((h<<5)-h)+str.charCodeAt(i);
        h|=0;
      }

      return Math.abs(h);
    }

    function moneyText(n){
      n=Math.round(n);

      if(n>=1e9)
        return (n/1e9).toFixed(2)+"B";

      if(n>=1e6)
        return (n/1e6).toFixed(2)+"M";

      if(n>=1000)
        return (n/1000).toFixed(1)+"K";

      return String(n);
    }

    function popText(n){
      if(n>=1000)
        return (n/1000).toFixed(2)+"B";

      return Number(n).toFixed(1)+"M";
    }

    function statKpi(title,value){
      return `
        <div class="kpi">
          <span>${title}</span>
          <b>${value}</b>
        </div>
      `;
    }

    function getFeatureCode(feature){
      const p=feature.properties||{};

      const candidates=[
        p.ISO_A3,
        p.iso_a3,
        p.ADM0_A3,
        p.adm0_a3,
        p.SOV_A3,
        p.GU_A3
      ];

      for(const c of candidates){
        if(c && c!=="-99")
          return String(c).toUpperCase();
      }

      return "X"+hash(JSON.stringify(p));
    }

    function getFeatureName(feature){
      const p=feature.properties||{};

      return (
        p.ADMIN ||
        p.NAME ||
        p.name ||
        p.NAME_LONG ||
        "کشور ناشناس"
      );
    }

    function ensureCountry(code,name){
      if(!code)
        return null;

      if(!COUNTRY_DB[code]){
        const seed=hash(code);

        COUNTRY_DB[code]={
          name:name||code,
          pop:5+(seed%180),
          economy:40+(hash(code+"eco")%50),
          military:35+(hash(code+"mil")%55),
          technology:30+(hash(code+"tech")%60),
          stability:45+(hash(code+"stab")%45)
        };
      }

      if(!S.countries[code]){
        const c=COUNTRY_DB[code];

        S.countries[code]={
          economy:c.economy,
          military:c.military,
          technology:c.technology,
          stability:c.stability,
          energy:60+(hash(code+"en")%50),
          food:60+(hash(code+"fd")%50),
          influence:20+(hash(code+"inf")%70),
          owner:code,
          ai:true
        };
      }

      if(typeof S.diplomacy[code] !== "number")
        S.diplomacy[code]=0;

      return S.countries[code];
    }

    const PALETTE=[
      "#315f7a",
      "#426c73",
      "#5a5678",
      "#426d5d",
      "#6d6043",
      "#6d5163",
      "#3d6478",
      "#576a49",
      "#605174",
      "#446b68",
      "#4e5d78",

    function countryColor(code){
      const c=S.countries[code];

      if(
        S.started &&
        c &&
        c.owner===S.player
      ){
        if(code===S.player)
          return "#24dff5";

        return "#c63855";
      }

      if(!c)
        return PALETTE[hash(code)%PALETTE.length];

      if(mapMode==="normal")
        return PALETTE[hash(code)%PALETTE.length];

      if(mapMode==="economy"){
        const v=clamp(c.economy,0,120);
        return `hsl(${215-v*1.4},70%,42%)`;
      }

      if(mapMode==="military"){
        const v=clamp(c.military,0,120);
        return `hsl(${125-v*1.05},72%,42%)`;
      }

      if(mapMode==="stability"){
        const v=clamp(c.stability,0,100);
        return `hsl(${v*1.2},60%,39%)`;
      }

      if(mapMode==="relations"){
        if(code===S.player)
          return "#28dff2";

        const relation=S.diplomacy[code]||0;

        if(relation>=40)
          return "#36dc96";

        if(relation<=-40)
          return "#e94f69";

        return "#667381";
      }

      return "#557080";
    }

    function countryStyle(feature){
      const code=getFeatureCode(feature);

      return {
        fillColor:countryColor(code),
        fillOpacity:.84,
        color:"rgba(225,242,255,.78)",
        weight:1.05

    function setMapMode(mode){

    function onEachCountry(feature,layer){
      const code=getFeatureCode(feature);

      ensureCountry(code,name);

      layer.on({

          e.target.setStyle({
            weight:2,
            color:"#ffffff",
            fillOpacity:.95

        mouseout(e){

        click(){

    }

    async function loadWorldMap(){
      try{
        const response=await fetch(
          "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
        );

        const geo=await response.json();

        geo.features.forEach(feature=>{
          ensureCountry(
            getFeatureCode(feature),
            getFeatureName(feature)
          );
        });

        worldLayer=L.geoJSON(
          geo,
          {
            style:countryStyle,
            onEachFeature:onEachCountry
          }
        ).addTo(map);

        finishGameLoad();

      }catch(err){

        toast("نقشه کامل بارگذاری نشد");

        finishGameLoad();

        .filter(([code,c])=>{

            c.name.toLowerCase().includes(q) ||
            code.toLowerCase().includes(q)

      $("countrySelectGrid").innerHTML=items
        .map(([code,c])=>`

            <h3>🌐 ${c.name}</h3>

            <p>

      ensureCountry(code,base.name);

      S.started=true;
      S.player=code;

      c.owner=code;
      c.ai=false;

      S.population=base.pop;
      S.economy=c.economy;
      S.military=c.military;
      S.technology=c.technology;
      S.stability=c.stability;

      closeModal();
      render();
      saveGame();

      S.money-=cost;

      if(type==="welfare"){
        S.stability+=4;
        S.popularity+=5;

        S.popularity+=6;
        S.reputation+=2;

    function economicAction(id,cost){
      if(S.money<cost){
        toast("بودجه کافی نیست");
        return;
      }

      S.money-=cost;

      if(id==="industry"){
        S.industry+=8;
        S.economy+=5;
      }

      if(id==="energy"){
        S.energy+=16;
        S.economy+=3;
      }

      if(id==="food"){
        S.food+=16;
        S.stability+=2;
      }

      if(id==="digital"){
        S.technology+=4;
        S.economy+=5;
      }

      if(id==="exports"){
        S.economy+=6;
        S.influence+=5;
        S.reputation+=2;
      }

      if(id==="inflation"){
        S.inflation=Math.max(0,S.inflation-1.2);
        S.stability+=2;
      }

      clampStats();
      render();
      openEconomy();

      if(id==="logistics")
        S.command+=3;

      render();
      openMilitary();

                .filter(v=>v>=40)
                .length
            )}

            ${
              list.map(([code,c])=>{
                const relation=S.diplomacy[code]||0;

    function diplomaticAction(code,type){
      if(code===S.player)
        return;

      const relation=S.diplomacy[code]||0;

      let cost=0;

      if(type==="improve")
        cost=180;

      if(type==="trade")
        cost=300;

      if(type==="alliance")
        cost=700;

      if(type==="alliance" && relation<30){
        toast("روابط برای اتحاد کافی نیست");
        return;
      }

      if(S.money<cost){
        toast("بودجه کافی نیست");
        return;
      }

      S.money-=cost;

      if(type==="improve"){
        S.diplomacy[code]=clamp(
          relation+10,
          -100,
          100
        );

        S.reputation+=.5;

        toast("روابط بهبود یافت");
      }

      if(type==="trade"){
        S.diplomacy[code]=clamp(
          relation+6,
          -100,
          100
        );

        S.economy+=1.3;
        S.money+=150;

        toast("قرارداد تجاری انجام شد");
      }

      if(type==="alliance"){
        if(!S.alliances.includes(code))
          S.alliances.push(code);

        S.diplomacy[code]=Math.max(
          60,
          relation
        );

        addNews(
          "اتحاد دفاعی",
          `${COUNTRY_DB[code].name} وارد اتحاد با کشور شما شد.`
        );

        toast("اتحاد تشکیل شد");
      }

      render();
    }

    function declareWar(code){
      if(!S.started)
        return;

      if(code===S.player)
        return;

      if(S.alliances.includes(code)){
        toast("این کشور متحد شماست");
        return;
      }

      if(
        S.wars.some(
          w=>
            w.enemy===code &&
            w.status==="war"
        )
      ){
        toast("جنگ با این کشور فعال است");
        return;
      }

      if(S.command<15){
        toast("امتیاز فرماندهی کافی نیست");
        return;
      }

      S.command-=15;
      S.diplomacy[code]=-100;

      S.wars.push({
        id:"W"+Date.now(),
        enemy:code,
        score:0,
        days:0,
        status:"war"
      });

      addNews(
        "آغاز جنگ",
        `درگیری نظامی با ${COUNTRY_DB[code]?.name||code} آغاز شد.`
      );

      recolorMap();
      openWarMenu();
    }

    function militaryOperation(warId){
      const war=S.wars.find(w=>w.id===warId);

      if(!war || war.status!=="war")
        return;

      if(S.command<6){
        toast("فرماندهی کافی نیست");
        return;
      }

      S.command-=6;

      const enemy=S.countries[war.enemy];

      const armyBonus=
        Object.entries(S.armies)
          .reduce(
            (sum,[id,count])=>
              sum+
              (UNIT_DB[id]?.power||0)*
              count,
            0
          )*.04;

      const ourPower=
        S.military+
        S.technology*.38+
        armyBonus+
        Math.random()*38;

      const enemyPower=
        enemy.military+
        enemy.technology*.34+
        Math.random()*38;

      const delta=
        (ourPower-enemyPower)/10;

      war.score+=delta;

      S.warExhaustion+=
        0.8+
        Math.random()*1.4;

      if(delta>0){
        toast(
          "عملیات موفق: +"+
          delta.toFixed(1)
        );
      }else{
        toast(
          "عملیات ناموفق: "+
          delta.toFixed(1)
        );
      }

      checkWarResult(war);

      render();
      openWarMenu();
    }

    function checkWarResult(war){
      if(war.status!=="war")
        return;

      if(war.score>=100){
        war.status="won";

        const enemy=S.countries[war.enemy];

        enemy.owner=S.player;
        enemy.ai=false;

        S.money+=2200;
        S.reputation-=4;
        S.stability+=2;

        addNews(
          "پیروزی در جنگ",
          `${COUNTRY_DB[war.enemy]?.name||war.enemy} تحت کنترل کشور شما قرار گرفت.`
        );

        toast("پیروزی کامل");

        recolorMap();
      }

      if(war.score<=-100){
        war.status="lost";

        S.stability-=7;
        S.popularity-=8;
        S.money=Math.max(0,S.money-1400);

        addNews(
          "شکست نظامی",
          `نیروهای شما در جنگ با ${COUNTRY_DB[war.enemy]?.name||war.enemy} شکست خوردند.`
        );

        toast("شکست در جنگ");
      }
    }

    function peaceWar(id){
      const war=S.wars.find(w=>w.id===id);

      if(!war)
        return;

      war.status="peace";

      S.diplomacy[war.enemy]=
        Math.max(
          -50,
          S.diplomacy[war.enemy]||-100
        );

      addNews(
        "پایان جنگ",
        `توافق صلح با ${COUNTRY_DB[war.enemy]?.name||war.enemy} امضا شد.`
      );

      openWarMenu();
    }

    function simulateWars(){
      S.wars
        .filter(w=>w.status==="war")
        .forEach(w=>{
          w.days++;

          const enemy=S.countries[w.enemy];

          if(!enemy)
            return;

          const drift=
            (
              S.military+
              S.technology*.25-
              enemy.military-
              enemy.technology*.22
            )/520;

          w.score+=drift;

          S.warExhaustion+=.04;

          checkWarResult(w);
        });
    }

    function upgradeProject(id){
      const p=PROJECTS.find(
        x=>x.id===id
      );

      if(!p)
        return;

      const level=S.projects[id]||0;

      if(level>=p.max){
        toast("پروژه به حداکثر سطح رسیده");
        return;
      }

      const cost=Math.round(
        p.baseCost*
        Math.pow(1.25,level)
      );

      if(S.money<cost){
        toast("بودجه کافی نیست");
        return;
      }

      S.money-=cost;
      S.projects[id]=level+1;

      if(p.group==="economy"){
        S.economy+=1.6;
        S.industry+=1;
      }

      if(p.group==="military"){
        S.military+=1.7;
        S.command+=1;
      }

      if(p.group==="technology"){
        S.technology+=1.5;
        S.research+=1;
      }

      if(p.group==="infrastructure"){
        S.economy+=.7;
        S.stability+=.5;
        S.energy+=1.2;
      }

      clampStats();
      render();
      openProjects(p.group);
    }

        title:"کنفرانس جهانی",
        text:"کشور شما در یک نشست مهم بین‌المللی حضور یافت.",
        run(){
          S.reputation+=3;
          S.influence+=2;
        }
      },
      {
        title:"رشد صنعتی",
        text:"ظرفیت تولید کارخانه‌های کشور افزایش یافت.",
        run(){
          S.industry+=3;
          S.economy+=1;
        }
      },
      {
        title:"فشار تورمی",
        text:"افزایش قیمت کالاها باعث فشار اقتصادی شد.",
        run(){
          S.inflation+=.6;
          S.popularity-=1;
        }
      },
      {
        title:"پروژه زیرساختی",
        text:"تکمیل یک پروژه داخلی به ثبات اقتصادی کمک کرد.",
        run(){
          S.stability+=1.5;
          S.energy+=2;
        }
      }
    ];

    function randomWorldEvent(){
      const e=
        WORLD_EVENTS[
          Math.floor(
            Math.random()*
            WORLD_EVENTS.length
          )
        ];

      e.run();

      addNews(
        e.title,
        e.text
      );

      toast(e.title);
    }

    /* ==============================================================
       AI
    ============================================================== */

    function aiTurn(){
      const entries=Object.entries(S.countries);

      const iterations=Math.min(
        22,
        entries.length
      );

      for(let i=0;i<iterations;i++){
        const [code,c]=
          entries[
            Math.floor(
              Math.random()*
              entries.length
            )
          ];

        if(
          code===S.player ||
          c.owner===S.player
        )
          continue;

        c.economy+=
          (Math.random()-.42)*.18;

        c.military+=
          (Math.random()-.43)*.14;

        c.technology+=
          Math.random()*.05;

        c.stability+=
          (Math.random()-.5)*.12;

        c.economy=clamp(c.economy,20,130);
        c.military=clamp(c.military,20,130);
        c.technology=clamp(c.technology,20,130);
        c.stability=clamp(c.stability,20,100);

        if(
          S.started &&
          Math.random()<.008
        ){
          S.diplomacy[code]=clamp(
            (S.diplomacy[code]||0)+
            (Math.random()>.5?2:-2),
            -100,
            100
          );
        }
      }
    }

    /* ==============================================================
       TIME
    ============================================================== */

    function daysInMonth(month,year){
      if(
        [
          4,
          6,
          9,
          11
        ].includes(month)
      )
        return 30;

      if(month===2){
        const leap=
          (
            year%4===0 &&
            year%100!==0
          ) ||
          year%400===0;

        return leap?29:28;
      }

      return 31;
    }

    function nextDay(){
      if(
        !S.started ||
        S.settings.paused
      )
        return;

      S.day++;

      if(
        S.day>
        daysInMonth(
          S.month,
          S.year
        )
      ){
        S.day=1;
        S.month++;

        if(S.month>12){
          S.month=1;
          S.year++;
        }
      }

      const taxIncome=
        S.economy*.55+
        S.industry*.27+
        S.tax*4.4;

      const inflationLoss=
        taxIncome*
        (
          S.inflation/100
        );

      const warCost=
        S.wars.filter(
          w=>w.status==="war"
        ).length*
        12;

      S.money+=
        taxIncome-
        inflationLoss-
        warCost;

      S.economy+=
        .012+
        S.technology*.00045;

      S.technology+=
        S.research*.00025;

      S.command=Math.min(
        200,
        S.command+.45
      );

      S.energy-=.06;
      S.food-=.05;

      if(S.energy<40)
        S.economy-=.025;

      if(S.food<40)
        S.stability-=.025;

      S.inflation+=
        (
          S.tax>30
            ? -.002
            : .001
        );

      S.warExhaustion=
        Math.max(
          0,
          S.warExhaustion-.015
        );

      simulateWars();
      aiTurn();

      if(Math.random()<.018)
        randomWorldEvent();

      clampStats();

      if(S.day%5===0)
        saveGame();

      render();
    }

    function clampStats(){
      S.economy=clamp(S.economy,0,200);
      S.military=clamp(S.military,0,200);
      S.technology=clamp(S.technology,0,200);
      S.stability=clamp(S.stability,0,100);
      S.popularity=clamp(S.popularity,0,100);
      S.reputation=clamp(S.reputation,-100,100);
      S.energy=clamp(S.energy,0,200);
      S.food=clamp(S.food,0,200);
      S.command=clamp(S.command,0,200);
      S.inflation=clamp(S.inflation,0,100);
      S.warExhaustion=clamp(S.warExhaustion,0,100);
      S.money=Math.max(0,S.money);
    }

    let lastTime=performance.now();
    let timeAccumulator=0;

    function gameLoop(now){
      const delta=now-lastTime;
      lastTime=now;

      if(
        S.started &&
        !S.settings.paused
      ){
        timeAccumulator+=delta;

        const interval=
          1200/
          Math.max(
            1,
            S.settings.speed
          );

        while(
          timeAccumulator>=interval
        ){
          timeAccumulator-=interval;
          nextDay();
        }
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

    /* ==============================================================
       RENDER
    ============================================================== */

    function render(){
      if(!S.started)
        return;

      $("money").textContent=
        moneyText(S.money);

      $("population").textContent=
        popText(S.population);

      $("economy").textContent=
        Math.round(S.economy);

      $("military").textContent=
        Math.round(S.military);

      $("technology").textContent=
        Math.round(S.technology);

      $("stability").textContent=
        Math.round(S.stability)+"%";

      $("gameDate").textContent=
        `${S.year}/${String(S.month).padStart(2,"0")}/${String(S.day).padStart(2,"0")}`;

      renderRanking();

      recolorMap();
    }

    function renderRanking(){
      const ranking=Object.entries(
        S.countries
      )
        .map(([code,c])=>({
          code,
          score:
            c.economy+
            c.military+
            c.technology+
            c.influence*.25
        }))
        .sort(
          (a,b)=>
            b.score-a.score
        )
        .slice(0,18);

      $("rankList").innerHTML=
        ranking
          .map((item,index)=>{
            const country=
              COUNTRY_DB[item.code];

            return `
              <div
                class="rank"
                onclick="openCountryProfile('${item.code}')"
              >
                <div class="rankNum">
                  ${index+1}
                </div>

                <div class="rankText">
                  <b>
                    🌐
                    ${country?.name||item.code}
                  </b>

                  <small>
                    قدرت:
                    ${Math.round(item.score)}
                  </small>
                </div>
              </div>
            `;
          })
          .join("");
    }

    /* ==============================================================
       SAVE LOAD
    ============================================================== */

    function saveGame(showToast=false){
      try{
        localStorage.setItem(
          SAVE_KEY,
          JSON.stringify(S)
        );

        if(showToast)
          toast("بازی ذخیره شد");

      }catch(err){
        console.error(err);
      }
    }

    function mergeState(saved){
      S={
        ...structuredClone(DEFAULT_STATE),
        ...saved,

        armies:{
          ...DEFAULT_STATE.armies,
          ...(saved.armies||{})
        },

        settings:{
          ...DEFAULT_STATE.settings,
          ...(saved.settings||{})
        },

        countries:{
          ...(saved.countries||{})
        },

        diplomacy:{
          ...(saved.diplomacy||{})
        },

        projects:{
          ...(saved.projects||{})
        },

        technologies:{
          ...(saved.technologies||{})
        },

        wars:Array.isArray(saved.wars)
          ? saved.wars
          : [],

        alliances:Array.isArray(saved.alliances)
          ? saved.alliances
          : [],

        news:Array.isArray(saved.news)
          ? saved.news
          : []
      };
    }

    function loadGame(){
      try{
        const raw=
          localStorage.getItem(
            SAVE_KEY
          );

        if(!raw)
          return false;

        const saved=
          JSON.parse(raw);

        mergeState(saved);

        return !!S.started;

      }catch(err){
        console.error(err);
        return false;
      }
    }

    /* ==============================================================
       PARTICLES
    ============================================================== */

    const canvas=$("particles");
    const ctx=canvas.getContext("2d");

    let particles=[];

    function resizeCanvas(){
      canvas.width=innerWidth;
      canvas.height=innerHeight;
    }

    window.addEventListener(
      "resize",
      resizeCanvas
    );

    resizeCanvas();

    function makeParticles(){
      particles=[];

      const count=
        innerWidth<600
          ? 28
          : 55;

      for(let i=0;i<count;i++){
        particles.push({
          x:Math.random()*canvas.width,
          y:Math.random()*canvas.height,
          vx:(Math.random()-.5)*.14,
          vy:-.04-Math.random()*.18,
          r:.5+Math.random()*1.7,
          a:.1+Math.random()*.4
        });
      }
    }

    makeParticles();

    function drawParticles(){
      requestAnimationFrame(
        drawParticles
      );

      if(
        !S.settings.particles
      ){
        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        return;
      }

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;

        if(p.y<-5){
          p.y=canvas.height+5;
          p.x=Math.random()*canvas.width;
        }

        if(p.x<0)
          p.x=canvas.width;

        if(p.x>canvas.width)
          p.x=0;

        ctx.beginPath();

        ctx.fillStyle=
          `rgba(90,225,255,${p.a})`;

        ctx.arc(
          p.x,
          p.y,
          p.r,
          0,
          Math.PI*2
        );

        ctx.fill();
      });
    }

    drawParticles();

    /* ==============================================================
       KEYBOARD
    ============================================================== */

    document.addEventListener(
      "keydown",
      e=>{
        if(
          e.target.tagName==="INPUT"
        )
          return;

        if(e.key==="1")
          openCountryMenu();

        if(e.key==="2")
          openEconomy();

        if(e.key==="3")
          openMilitary();

        if(e.key==="4")
          openTechnology();

        if(e.key==="5")
          openDiplomacy();

        if(e.key==="6")
          openWarMenu();

        if(e.key==="Escape")
          closeModal();
      }
    );

    /* ==============================================================
       START
    ============================================================== */

    function finishGameLoad(){
      const loaded=
        loadGame();

      Object.keys(COUNTRY_DB)
        .forEach(code=>{
          ensureCountry(
            code,
            COUNTRY_DB[code].name
          );
        });

      $("loader").classList.add(
        "hide"
      );

      if(loaded){
        render();

        toast("ذخیره قبلی بارگذاری شد");
      }else{
        openCountrySelector();
      }
    }

    loadWorldMap();

    setTimeout(()=>{
      $("loader").classList.add(
        "hide"
      );
    },5000);

    setInterval(()=>{
      if(S.started)
        saveGame();
    },12000);

  </script>

</body>
