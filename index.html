function processAIWars()
{
    const activeCount=
        state.wars.filter(
            war=>
            war.status===
            "active"
        ).length;

    if(
        activeCount>
        12
    )
    {
        return;
    }

    const attempts=
        state.difficulty===
        "expert"
        ?
        9
        :
        state.difficulty===
        "hard"
        ?
        7
        :
        4;

    for(
        let index=
            0;
        index<
            attempts;
        index++
    )
    {
        const attacker=
            pick(
                COUNTRY_CODES.filter(
                    code=>
                    code!==
                    state.player
                )
            );

        const ai=
            state.ai[
                attacker
            ];

        if(
            !ai
        )
        {
            continue;
        }

        if(
            !chance(
                ai.aggression*
                .016
            )
        )
        {
            continue;
        }

        const targetPlayer=
            chance(
                17
            );

        const defender=
            targetPlayer
            ?
            state.player
            :
            pick(
                COUNTRY_CODES.filter(
                    code=>
                    code!==
                    attacker&&
                    code!==
                    state.player
                )
            );

        if(
            activeWarBetween(
                attacker,
                defender
            )
        )
        {
            continue;
        }

        const score=
            aiWarScore(
                attacker,
                defender
            );

        const threshold=
            state.difficulty===
            "expert"
            ?
            63
            :
            state.difficulty===
            "hard"
            ?
            70
            :
            77;

        if(
            score>
            threshold
        )
        {
            startWar(
                attacker,
                defender,
                pick(
                    WAR_TYPES
                ).id,
                true
            );

            return;
        }
    }
}

function processWars()
{
    for(
        const war of
        state.wars
    )
    {
        if(
            war.status!==
            "active"
        )
        {
            continue;
        }

        war.days++;

        const attackerPower=
            countryWarPower(
                war.attacker
            );

        const defenderPower=
            countryWarPower(
                war.defender
            );

        const total=
            attackerPower+
            defenderPower;

        const attackerShare=
            attackerPower/
            Math.max(
                1,
                total
            );

        const defenderShare=
            defenderPower/
            Math.max(
                1,
                total
            );

        war.attackerScore+=
            attackerShare*
            war.intensity*
            random(
                .4,
                1.2
            );

        war.defenderScore+=
            defenderShare*
            war.intensity*
            random(
                .4,
                1.2
            );

        if(
            war.attacker===
            state.player||
            war.defender===
            state.player
        )
        {
            state.military.warExhaustion=
                clamp(
                    state.military.warExhaustion+
                    .08*
                    war.intensity,
                    0,
                    100
                );

            state.military.readiness=
                clamp(
                    state.military.readiness-
                    .018*
                    war.intensity,
                    0,
                    100
                );

            state.resources.oil=
                Math.max(
                    0,
                    state.resources.oil-
                    .08*
                    war.intensity
                );

            state.economy.money=
                Math.max(
                    0,
                    state.economy.money-
                    5*
                    war.intensity
                );
        }

        if(
            war.days>
            30&&
            (
                war.attackerScore>
                45||
                war.defenderScore>
                45
            )
        )
        {
            resolveWar(
                war
            );
        }
    }
}

function resolveWar(
    war
)
{
    if(
        war.status!==
        "active"
    )
    {
        return;
    }

    const attackerWins=
        war.attackerScore>
        war.defenderScore;

    const winner=
        attackerWins
        ?
        war.attacker
        :
        war.defender;

    const loser=
        attackerWins
        ?
        war.defender
        :
        war.attacker;

    war.status=
        "ended";

    war.winner=
        winner;

    war.loser=
        loser;

    if(
        winner===
        state.player
    )
    {
        state.nation.reputation=
            clamp(
                state.nation.reputation+
                2,
                0,
                100
            );

        state.military.morale=
            clamp(
                state.military.morale+
                5,
                0,
                100
            );

        toast(
            "🏆 پیروزی در جنگ"
        );
    }

    if(
        loser===
        state.player
    )
    {
        state.society.approval=
            clamp(
                state.society.approval-
                5,
                0,
                100
            );

        state.military.morale=
            clamp(
                state.military.morale-
                6,
                0,
                100
            );

        toast(
            "⚠️ شکست در جنگ"
        );
    }

    const winnerAI=
        state.ai[
            winner
        ];

    const loserAI=
        state.ai[
            loser
        ];

    if(
        winnerAI
    )
    {
        winnerAI.military+=
            .8;

        winnerAI.warWeariness=
            Math.max(
                0,
                winnerAI.warWeariness-
                4
            );
    }

    if(
        loserAI
    )
    {
        loserAI.military=
            Math.max(
                10,
                loserAI.military-
                1.4
            );

        loserAI.stability=
            Math.max(
                15,
                loserAI.stability-
                3
            );
    }

    addNews(
        "🏳️ پایان جنگ",
        `${countryName(winner)} در جنگ با ${countryName(loser)} پیروز شد.`
    );

    updateMapStyles();
}

/* =========================================================
   MAP ROUTES
========================================================= */

function mapCenter(
    code
)
{
    return mapCenters[
        code
    ]||
    [
        800,
        400
    ];
}

function curvedRoute(
    from,
    to
)
{
    const midX=
        (
            from[
                0
            ]+
            to[
                0
            ]
        )/
        2;

    const midY=
        (
            from[
                1
            ]+
            to[
                1
            ]
        )/
        2-
        Math.min(
            80,
            Math.abs(
                from[
                    0
                ]-
                to[
                    0
                ]
            )*
            .10+
            18
        );

    return`
    M
    ${from[0]}
    ${from[1]}
    Q
    ${midX}
    ${midY}
    ${to[0]}
    ${to[1]}
    `;
}

function renderRoutes()
{
    const layer=
        $("routeLayer");

    layer.innerHTML=
        "";

    if(
        !state.started||
        !state.player
    )
    {
        return;
    }

    if(
        !Object.keys(
            mapCenters
        ).length
    )
    {
        buildMapCenters();
    }

    const playerPoint=
        mapCenter(
            state.player
        );

    for(
        const agreement of
        state.tradeAgreements
    )
    {
        const target=
            mapCenter(
                agreement.code
            );

        const path=
            svgElement(
                "path"
            );

        path.setAttribute(
            "d",
            curvedRoute(
                playerPoint,
                target
            )
        );

        path.setAttribute(
            "class",
            "route-trade"
        );

        layer.appendChild(
            path
        );
    }

    for(
        const alliance of
        state.alliances
    )
    {
        const target=
            mapCenter(
                alliance.code
            );

        const path=
            svgElement(
                "path"
            );

        path.setAttribute(
            "d",
            curvedRoute(
                playerPoint,
                target
            )
        );

        path.setAttribute(
            "class",
            "route-alliance"
        );

        layer.appendChild(
            path
        );
    }

    for(
        const war of
        state.wars
    )
    {
        if(
            war.status!==
            "active"
        )
        {
            continue;
        }

        const from=
            mapCenter(
                war.attacker
            );

        const to=
            mapCenter(
                war.defender
            );

        const path=
            svgElement(
                "path"
            );

        path.setAttribute(
            "d",
            curvedRoute(
                from,
                to
            )
        );

        path.setAttribute(
            "class",
            "route-war"
        );

        layer.appendChild(
            path
        );
    }
}

function processAIEconomies()
{

        state.difficulty===
        "expert"
        ?
        1.16
        :
        state.difficulty===
        "hard"
        ?
        1.08
        :
        state.difficulty===
        "easy"
        ?

        :
        1;

        COUNTRY_CODES
    )
    {
        if(
            code===
            state.player
        )
        {
            continue;
        }

        const ai=
            state.ai[
                code
            ];

        if(
            !ai
        )
        {
            continue;
        }

        const personality=
            aiPersonality(
                code
            );

        let economyGrowth=
            .0045*
            difficultyMultiplier;

        let militaryGrowth=
            .0035*
            difficultyMultiplier;

        let techGrowth=
            .0028*
            difficultyMultiplier;

        if(
            personality.id===
            "economic"
        )
        {
            economyGrowth*=
                1.7;
        }

        if(
            personality.id===
            "aggressive"
        )
        {
            militaryGrowth*=
                1.75;
        }

        if(
            personality.id===
            "technocratic"
        )
        {
            techGrowth*=
                1.8;
        }

        ai.economy=
            clamp(
                ai.economy+
                economyGrowth+
                random(
                    -.01,
                    .015
                ),
                10,
                160
            );

        ai.military=
            clamp(
                ai.military+
                militaryGrowth+
                random(
                    -.01,
                    .014
                ),
                10,
                160
            );

        ai.technology=
            clamp(
                ai.technology+
                techGrowth+
                random(
                    -.008,
                    .012
                ),
                10,
                160
            );

        ai.treasury+=
            ai.economy*
            .18*
            difficultyMultiplier;

        const inWar=
            state.wars.some(
                war=>
                war.status===
                "active"&&
                (
                    war.attacker===
                    code||
                    war.defender===
                    code
                )
            );

        if(
            inWar
        )
        {
            ai.warWeariness=
                clamp(
                    ai.warWeariness+
                    .06,
                    0,
                    100
                );

            ai.readiness=
                clamp(
                    ai.readiness-
                    .018,
                    20,
                    100
                );
        }
        else
        {
            ai.warWeariness=
                clamp(
                    ai.warWeariness-
                    .08,
                    0,
                    100
                );

            ai.readiness=
                clamp(
                    ai.readiness+
                    .025,
                    20,
                    100
                );
        }
    }
}

function processAIRelations()
{
    for(
        const code of
        COUNTRY_CODES
    )
    {
        if(
            code===
            state.player
        )
        {
            continue;
        }

        let drift=
            random(
                -.08,
                .08
            );

        const personality=
            aiPersonality(
                code
            );

        if(
            personality.id===
            "diplomatic"
        )
        {
            drift+=
                .035;
        }

        if(
            personality.id===
            "aggressive"
        )
        {
            drift-=
                .025;
        }

        if(
            isAlly(
                code
            )
        )
        {
            drift+=
                .04;
        }

        if(
            hasTrade(
                code
            )
        )
        {
            drift+=
                .025;
        }

        if(
            isSanctioned(
                code
            )
        )
        {
            drift-=
                .08;
        }

        changeRelation(
            code,
            drift
        );
    }
}

/* =========================================================
   CONSTRUCTION PROCESS
========================================================= */

function processConstruction()
{
    for(
        const project of
        state.construction
    )
    {
        let speed=
            1+
            state.nation.logistics/
            300+
            state.nation.technology/
            500;

        if(
            state.resources.energy<
            15
        )
        {
            speed*=
                .6;
        }

        if(
            state.society.stability<
            35
        )
        {
            speed*=
                .75;
        }

        project.daysLeft-=
            speed;
    }

    const completed=
        state.construction.filter(
            project=>
            project.daysLeft<=
            0
        );

    for(
        const project of
        completed
    )
    {
        const building=
            BUILDINGS.find(
                item=>
                item.id===
                project.buildingId
            );

        if(
            !building
        )
        {
            continue;
        }

        state.buildings[
            building.id
        ]=
            project.targetLevel;

        applyBuildingEffects(
            building
        );

        addNews(
            "🏗️ پروژه تکمیل شد",
            `${building.name} به سطح ${project.targetLevel} رسید.`
        );
    }

    state.construction=
        state.construction.filter(
            project=>
            project.daysLeft>
            0
        );
}

/* =========================================================
   PRODUCTION PROCESS
========================================================= */

function processProduction()
{
    for(
        const project of
        state.production
    )
    {
        let speed=
            1+
            state.nation.industry/
            300+
            state.nation.technology/
            500;

        if(
            state.resources.energy<
            15
        )
        {
            speed*=
                .65;
        }

        project.daysLeft-=
            speed;
    }

    const completed=
        state.production.filter(
            project=>
            project.daysLeft<=
            0
        );

    for(
        const project of
        completed
    )
    {
        const equipment=
            EQUIPMENT.find(
                item=>
                item.id===
                project.equipmentId
            );

        if(
            !equipment
        )
        {
            continue;
        }

        state.inventory[
            equipment.id
        ]=
            (
                state.inventory[
                    equipment.id
                ]||
                0
            )+
            project.amount;

        state.military.basePower+=
            equipment.power*
            project.amount*
            .006;

        addNews(
            "🏭 تولید تکمیل شد",
            `${project.amount} واحد ${equipment.name} آماده شد.`
        );
    }

    state.production=
        state.production.filter(
            project=>
            project.daysLeft>
            0
        );
}

/* =========================================================
   RESOURCE PROCESS
========================================================= */

function processResources()
{
    const foodProduction=
        (
            state.buildings.farm||
            0
        )*
        1.4+
        state.society.population*
        .004;

    const foodConsumption=
        state.society.population*
        .012;

    state.resources.food=
        Math.max(
            0,
            state.resources.food+
            foodProduction-
            foodConsumption
        );

    const energyProduction=
        (
            state.buildings.power||
            0
        )*
        1.7+
        (
            state.buildings.solar||
            0
        )*
        1.2;

    const energyConsumption=
        state.nation.industry*
        .015+
        state.society.population*
        .004+
        state.production.length*
        .22;

    state.resources.energy=
        Math.max(
            0,
            state.resources.energy+
            energyProduction-
            energyConsumption
        );

    state.resources.oil=
        Math.max(
            0,
            state.resources.oil+
            (
                state.buildings.oilField||
                0
            )*
            .95-
            equipmentPower()*
            .00022
        );

    state.resources.steel+=
        (
            state.buildings.steelMill||
            0
        )*
        .55;

    state.resources.electronics+=
        (
            state.buildings.electronicsPlant||
            0
        )*
        .40;
}

/* =========================================================
   MACRO ECONOMY PROCESS
========================================================= */

function processEconomy()
{
    const revenue=
        calculateDailyRevenue();

    const expenses=
        calculateDailyExpenses();

    state.economy.budgetBalance=
        revenue-
        expenses;

    state.economy.money+=
        state.economy.budgetBalance;

    if(
        state.economy.money<
        0
    )
    {
        state.economy.debt+=
            Math.abs(
                state.economy.money
            );

        state.economy.money=
            0;
    }

    state.economy.debt+=
        state.economy.debt*
        state.economy.interestRate/
        100/
        365;

    const growth=
        calculateGrowth();

    state.economy.growth=
        growth;

    state.economy.gdp=
        calculateGDP();

    state.nation.industry=
        Math.max(
            1,
            state.nation.industry+
            growth*
            .003
        );

    state.economy.unemployment=
        clamp(
            state.economy.unemployment-
            growth*
            .004+
            random(
                -.025,
                .025
            ),
            0,
            65
        );

    let inflationPressure=
        .002;

    if(
        state.resources.food<
        30
    )
    {
        inflationPressure+=
            .035;
    }

    if(
        state.resources.energy<
        30
    )
    {
        inflationPressure+=
            .032;
    }

    if(
        state.resources.oil<
        20
    )
    {
        inflationPressure+=
            .020;
    }

    if(
        state.economy.debt>
        state.economy.gdp*
        .7
    )
    {
        inflationPressure+=
            .022;
    }

    inflationPressure-=
        Math.max(
            0,
            state.economy.interestRate-
            5
        )*
        .007;

    state.economy.inflation=
        clamp(
            state.economy.inflation+
            inflationPressure+
            random(
                -.018,
                .020
            ),
            -3,
            100
        );

    state.economy.currency=
        clamp(
            state.economy.currency+
            growth*
            .014-
            state.economy.inflation*
            .008+
            state.economy.interestRate*
            .003+
            random(
                -.1,
                .1
            ),
            5,
            300
        );

    state.economy.stockMarket=
        clamp(
            state.economy.stockMarket+
            growth*
            .08-
            state.economy.inflation*
            .012+
            random(
                -.65,
                .65
            ),
            10,
            1000
        );

    state.economy.consumerConfidence=
        clamp(
            state.economy.consumerConfidence+
            growth*
            .015-
            state.economy.inflation*
            .008-
            state.economy.unemployment*
            .004,
            0,
            100
        );

    state.society.poverty=
        clamp(
            state.society.poverty-
            growth*
            .004+
            state.economy.unemployment*
            .002+
            state.economy.inflation*
            .0015,
            0,
            100
        );

    state.society.approval=
        clamp(
            state.society.approval+
            growth*
            .01-
            state.economy.inflation*
            .005-
            state.economy.unemployment*
            .004-
            state.government.protest*
            .001,
            0,
            100
        );

    state.government.protest=
        clamp(
            state.government.protest+
            Math.max(
                0,
                state.economy.inflation-
                15
            )*
            .004+
            Math.max(
                0,
                state.economy.unemployment-
                15
            )*
            .005+
            Math.max(
                0,
                40-
                state.society.approval
            )*
            .006-
            state.society.stability*
            .001,
            0,
            100
        );

    state.society.stability=
        clamp(
            state.society.stability+
            (
                state.society.approval-
                50
            )*
            .001-
            state.government.protest*
            .002,
            0,
            100
        );

    state.society.manpower=
        Math.min(
            state.society.population*
            .075,
            state.society.manpower+
            state.society.population*
            .00001
        );
}

/* =========================================================
   TRADE AGREEMENT PROCESS
========================================================= */

function processTreaties()
{
    for(
        const agreement of
        state.tradeAgreements
    )
    {
        agreement.days--;

        state.economy.money+=
            agreement.income;

        state.economy.exports+=
            agreement.income;
    }

    state.tradeAgreements=
        state.tradeAgreements.filter(
            agreement=>
            agreement.days>
            0
        );

    for(
        const treaty of
        state.nonAggression
    )
    {
        treaty.days--;
    }

    state.nonAggression=
        state.nonAggression.filter(
            treaty=>
            treaty.days>
            0
        );
}

/* =========================================================
   GOVERNMENT PROCESS
========================================================= */

function processGovernment()
{
    state.government.electionDays--;

    if(
        state.government.electionDays<=
        0
    )
    {
        if(
            chance(
                state.society.approval
            )
        )
        {
            addNews(
                "🗳️ انتخابات",
                "دولت توانست اکثریت لازم را حفظ کند."
            );

            state.society.approval=
                clamp(
                    state.society.approval+
                    2,
                    0,
                    100
                );
        }
        else
        {
            addNews(
                "🗳️ انتخابات",
                "نتیجه انتخابات باعث تغییر سیاسی شد."
            );

            state.society.approval=
                55;

            state.government.corruption=
                Math.max(
                    0,
                    state.government.corruption-
                    2
                );
        }

        state.government.electionDays=
            1080;
    }
}

   NEWS
========================================================= */

function addNews(
    title,
    text
)
{
    state.news.unshift(
        {
            title,
            text,

            date:
                `${state.date.year}/${state.date.month}/${state.date.day}`
        }
    );

    if(
        state.news.length>
        120
    )
    {
        state.news.length=
            120;
    }
}

/* =========================================================
   DATE
========================================================= */

function advanceDate()
{
    state.date.day++;

    if(
        state.date.day>
        30
    )
    {
        state.date.day=
            1;

        state.date.month++;

        if(
            state.date.month>
            12
        )
        {
            state.date.month=
                1;

            state.date.year++;
        }
    }
}

/* =========================================================
   NEXT DAY
========================================================= */

function nextDay()
{
    if(
        !state.started
    )
    {
        return;
    }

    advanceDate();

    processConstruction();

    processProduction();

    processResources();

    processEconomy();

    processGovernment();

    processTreaties();

    processAIEconomies();

    processAIRelations();

    processWars();

    if(
        state.date.day%
        3===
        0
    )
    {
        processAIPlayerDiplomacy();
    }

    if(
        state.date.day%
        2===
        0
    )
    {
        processAIWars();
    }

    saveGame();

    renderAll();
}

function setSpeed(
    speed
)
{
    state.time.speed=
        speed;

    if(
        autoTimer
    )
    {
        clearInterval(
            autoTimer
        );
    }

    autoTimer=
        setInterval(
            nextDay,
            Math.max(
                230,
                1650/
                speed
            )
        );

    toast(
        "سرعت ×"+
        speed
    );
}

function pauseTime()
{
    state.time.speed=
        0;

    if(
        autoTimer
    )
    {
        clearInterval(
            autoTimer
        );

        autoTimer=
            null;
    }

    toast(
        "زمان متوقف شد"
    );
}

/* =========================================================
   STATE NORMALIZATION
========================================================= */

function normalizeState()
{
    state.map=
        state.map||
        {
            mode:"political",
            zoom:1,
            x:0,
            y:0
        };

    state.economy=
        state.economy||
        {};

    state.resources=
        state.resources||
        {};

    state.society=
        state.society||
        {};

    state.nation=
        state.nation||
        {};

    state.government=
        state.government||
        {};

    state.government.laws=
        state.government.laws||
        {
            welfare:"normal",
            trade:"open",
            militaryBudget:"normal",
            media:"free"
        };

    state.military=
        state.military||
        {};

    state.inventory=
        state.inventory||
        {};

    state.buildings=
        state.buildings||
        {};

    state.construction=
        Array.isArray(
            state.construction
        )
        ?
        state.construction
        :
        [];

    state.production=
        Array.isArray(
            state.production
        )
        ?
        state.production
        :
        [];

    state.relations=
        state.relations||
        {};

    state.ai=
        state.ai||
        {};

    state.inbox=
        Array.isArray(
            state.inbox
        )
        ?
        state.inbox
        :
        [];

    state.alliances=
        Array.isArray(
            state.alliances
        )
        ?
        state.alliances
        :
        [];

    state.tradeAgreements=
        Array.isArray(
            state.tradeAgreements
        )
        ?
        state.tradeAgreements
        :
        [];

    state.nonAggression=
        Array.isArray(
            state.nonAggression
        )
        ?
        state.nonAggression
        :
        [];

    state.sanctions=
        Array.isArray(
            state.sanctions
        )
        ?
        state.sanctions
        :
        [];

    state.wars=
        Array.isArray(
            state.wars
        )
        ?
        state.wars
        :
        [];

    state.news=
        Array.isArray(
            state.news
        )
        ?
        state.news
        :
        [];

    state.time=
        state.time||
        {
            speed:0
        };
}

/* =========================================================
   SAVE
========================================================= */

function saveGame()
{
    try
    {
        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(
                state
            )
        );
    }
    catch(
        error
    )
    {
    }
}

function loadGame()
{
    try
    {
        const raw=
            localStorage.getItem(
                SAVE_KEY
            );

        if(
            !raw
        )
        {
            return false;
        }

        const loaded=
            JSON.parse(
                raw
            );

        state=
            Object.assign(
                state,
                loaded
            );

        normalizeState();

        initializeAI();

        return(
            state.started&&
            !!state.player
        );
    }
    catch(
        error
    )
    {
        return false;
    }
}

========================================================= */

document
.addEventListener(
    "keydown",
    event=>
    {
        if(
            event.key===
            "Escape"
        )
        {
            closeModal();

            return;
        }

        if(
            !state.started
        )
        {
            return;
        }

        if(
            event.key===
            " "
        )
        {
            event.preventDefault();

            if(
                state.time.speed>
                0
            )
            {
                pauseTime();
            }
            else
            {
                setSpeed(
                    1
                );
            }
        }

        if(
            event.key===
            "1"
        )
        {
            setSpeed(
                1
            );
        }

        if(
            event.key===
            "2"
        )
        {
            setSpeed(
                2
            );
        }

        if(
            event.key===
            "4"
        )
        {
            setSpeed(
                4
            );
        }

        if(
            event.key===
            "8"
        )
        {
            setSpeed(
                8
            );
        }
    }
);

/* =========================================================
   BOOT
========================================================= */

async function boot()
{
    initializeAI();

    renderCountrySelection();

    const loaded=
        loadGame();

    if(
        loaded
    )
    {
        $("startScreen")
        .style.display=
            "none";
    }

    await loadRealWorldMap();

    buildMapCenters();

    applyMapTransform();

    renderAll();
}

boot();
