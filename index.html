<!DOCTYPE html>

<meta charset="UTF-8">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111b;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   COUNTRY SCREEN
========================================================= */

#countryScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at 50% 10%,#173c5c 0,#091624 45%,#03070c 100%);
}

.countryHeader{
    text-align:center;
    padding:20px 12px 8px;
}

.countryHeader h1{
    margin:0;
    font-size:29px;
}

.countryHeader p{
    margin:8px 0;
    color:#9fb8cb;
}

.countrySearch{
    width:min(700px,94%);
    background:#101f2e;
    color:#fff;
    border:1px solid #29465d;
    border-radius:13px;
    padding:12px;
    outline:none;
}

.countryList{
    flex:1;
    width:min(1100px,100%);
    margin:auto;
    overflow:auto;
    padding:10px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:10px;
}

.countryCard{
    background:linear-gradient(145deg,#13283b,#0c1723);
    border:1px solid #29465d;
    border-radius:15px;
    padding:13px;
}

.countryCard:hover{
    border-color:#5b92bb;
    transform:translateY(-2px);
}

.flag{
    font-size:28px;
    margin-left:6px;
}

.countryName{
    font-weight:bold;
}

.countryPop{
    color:#9cb2c4;
    font-size:12px;
    margin-top:8px;
}

.startBox{
    text-align:center;
    padding:12px;
    border-top:1px solid #243c50;
    background:#07121e;
}

.startBtn{
    border:0;
    background:#1b82c9;
    color:#fff;
    padding:13px 38px;
    border-radius:13px;
    font-weight:bold;
}

/* =========================================================
   GAME
========================================================= */

#game{
    display:none;
    position:relative;
    width:100%;
    height:100%;
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

/* =========================================================
   TOP BAR
========================================================= */

.topBar{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    z-index:5000;
    background:rgba(7,16,27,.95);
    border:1px solid #2b465b;
    border-radius:14px;
    padding:7px;
    box-shadow:0 5px 20px #0008;
}

.stats{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
}

.stat{
    flex:0 0 auto;
    min-width:82px;
    text-align:center;
    background:#102131;
    border:1px solid #294359;
    border-radius:10px;
    padding:7px 9px;
}

.stat b{
    display:block;
    font-size:12px;
}

.stat span{
    color:#91a8ba;
    font-size:9px;
}

.controlled{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-top:7px;
    scrollbar-width:none;
}

.controlCountry{
    flex:0 0 auto;
    background:#142a3d;
    color:#fff;
    border:1px solid #35556c;
    border-radius:10px;
    padding:6px 9px;
    font-size:11px;
}

.controlCountry.mine{
    background:#491c24;
    border-color:#ef3a45;
}

/* =========================================================
   BOTTOM
========================================================= */

.bottomDock{
    position:absolute;
    bottom:9px;
    left:8px;
    right:8px;
    z-index:5000;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
}

.dockBtn{
    min-height:50px;
    border-radius:13px;
    border:1px solid #31546b;
    background:rgba(8,19,31,.96);
    color:white;
    font-size:10px;
    font-weight:bold;
}

.dockBtn:hover{
    background:#18364b;
}

/* =========================================================
   MODALS
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:20000;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:#0009;
}

.modal.show{
    display:flex;
}

.panel{
    width:min(900px,100%);
    max-height:91vh;
    overflow:auto;
    background:linear-gradient(#102131,#08131e);
    border:1px solid #31536b;
    border-radius:20px 20px 0 0;
    padding:15px;
    box-shadow:0 -10px 40px #000c;
}

.close{
    float:left;
    background:#48242b;
    color:#fff;
    border:1px solid #743743;
    border-radius:8px;
    padding:6px 10px;
}

.section{
    background:#0d1d2b;
    border:1px solid #223e53;
    border-radius:13px;
    padding:11px;
    margin-bottom:9px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
    gap:8px;
}

.card{
    background:#13283a;
    border:1px solid #2b475d;
    border-radius:11px;
    padding:10px;
}

.card small{
    color:#91a8b9;
}

.action{
    width:100%;
    margin-top:7px;
    padding:9px;
    border:0;
    border-radius:9px;
    background:#176fa9;
    color:white;
    font-weight:bold;
}

.action.danger{
    background:#7e2934;
}

.action.success{
    background:#237447;
}

.action.gold{
    background:#80611e;
}

.progress{
    height:8px;
    background:#07111a;
    border-radius:20px;
    overflow:hidden;
    margin-top:7px;
}

.progress i{
    display:block;
    height:100%;
    background:#348bc3;
}

.newsItem{
    background:#101f2d;
    border:1px solid #28465c;
    border-radius:12px;
    padding:11px;
    margin-bottom:7px;
}

.newsTime{
    color:#6f9dbb;
    font-size:10px;
}

.newsTitle{
    font-weight:bold;
    margin:4px 0;
}

.newsText{
    color:#b3c4d0;
    font-size:12px;
    line-height:1.8;
}

.tag{
    display:inline-block;
    padding:3px 7px;
    border-radius:7px;
    background:#19364b;
    font-size:9px;
    margin-left:5px;
}

/* =========================================================
   WAR ANIMATION
========================================================= */

#warAnimationLayer{
    position:fixed;
    inset:0;
    z-index:18000;
    pointer-events:none;
    display:none;
    overflow:hidden;
}

#warAnimationLayer.active{
    display:block;
}

.battleSky{
    position:absolute;
    inset:0;
    background:linear-gradient(#06132155,#06132100 50%,#07111d55);
}

.fighterAnim{
    position:absolute;
    font-size:39px;
    filter:drop-shadow(0 4px 5px #000);
    animation:flyAcross 1.8s linear forwards;
}

.explosion{
    position:absolute;
    font-size:45px;
    animation:boom .8s ease-out forwards;
}

.battleResult{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#091522ee;
    border:1px solid #456a83;
    padding:22px 30px;
    border-radius:18px;
    text-align:center;
}

@keyframes flyAcross{
    0%{
        transform:translate(-120px,50px) rotate(-5deg);
        opacity:0;
    }
    15%{
        opacity:1;
    }
    85%{
        opacity:1;
    }
    100%{
        transform:translate(calc(100vw + 150px),-80px) rotate(-5deg);
        opacity:0;
    }
}

@keyframes boom{
    0%{
        transform:scale(.2);
        opacity:0;
    }
    25%{
        transform:scale(1.3);
        opacity:1;
    }
    100%{
        transform:scale(2);
        opacity:0;
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:650px){

    .bottomDock{
        grid-template-columns:repeat(3,1fr);
    }

    .dockBtn{
        min-height:45px;
    }

    .countryList{
        grid-template-columns:repeat(2,1fr);
    }

    .countryCard{
        padding:10px;
    }

}

@media(max-width:390px){

    .countryList{
        grid-template-columns:1fr;
    }

}

const DB={};

    DB[c[0]]={
        name:c[0],
        flag:c[1],
        iso:c[2],

    };

});

function countryData(name){

    return DB[name] || {
        name:name,
        flag:"🏳️",
        iso:"",
        population:1000000
    };

}

function formatNum(n){

    n=Math.round(n||0);

    if(n>=1000000000)
        return (n/1000000000).toFixed(2)+"B";

    if(n>=1000000)
        return (n/1000000).toFixed(1)+"M";

    if(n>=1000)
        return (n/1000).toFixed(1)+"K";

    return n.toLocaleString("en-US");

}

function clamp(n,a,b){

    return Math.max(a,Math.min(b,n));

}

function rnd(a,b){

    return Math.floor(Math.random()*(b-a+1))+a;

}

/* =========================================================
   COUNTRY SELECTION
========================================================= */

function renderCountryList(list=COUNTRIES){

    const box=document.getElementById("countryList");

    box.innerHTML=list.map(c=>`

        <div
            class="countryCard"
            onclick="selectCountry('${c[0].replace(/'/g,"\\'")}')">

            <div>
                <span class="flag">${c[1]}</span>
                <span class="countryName">${c[0]}</span>
            </div>

            <div class="countryPop">
                جمعیت: ${formatNum(c[3])}
            </div>

        </div>

    `).join("");

}

function filterCountries(){

    const q=
        document.getElementById("countrySearch")
        .value
        .trim()
        .toLowerCase();

    renderCountryList(
        COUNTRIES.filter(c=>
            c[0].toLowerCase().includes(q)
        )
    );

}

function selectCountry(name){

    selectedCountry=name;

    const d=countryData(name);

    document.getElementById("selectedCountry")
        .innerHTML=
        `${d.flag} <b>${d.name}</b> — جمعیت ${formatNum(d.population)}`;

}

renderCountryList();

/* =========================================================
   START
========================================================= */

function startGame(){

    if(!selectedCountry){

        alert("ابتدا یک کشور انتخاب کنید.");

        return;
    }

    game.started=true;

    game.countryCode=selectedCountry;

    const d=countryData(selectedCountry);

    game.population=d.population;

    game.money=
        100000+
        Math.floor(d.population/5000);

    game.army=
        Math.max(
            800,
            Math.floor(d.population/100000)
        );

    game.soldiers=game.army;

    game.reserves=
        Math.floor(game.army*.15);

    initAI();

    createInitialNews();

    document.getElementById("countryScreen")
        .style.display="none";

    document.getElementById("game")
        .style.display="block";

    initMap();

    addNews(
        "سیاسی",
        "شروع عصر جدید",
        `${d.flag} ${d.name} وارد رقابت جهانی شد.`,
        "اکنون"
    );

    addLog(
        "🌍 بازی با موفقیت آغاز شد."
    );

    updateUI();

}

"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";

const COUNTRY_COLORS=[

"#357ABD","#8B5CF6","#0E9F6E","#D97706",
"#0891B2","#BE185D","#65A30D","#7C3AED",
"#0369A1","#C2410C","#15803D","#9333EA",
"#B45309","#BE123C","#4D7C0F","#6D28D9",
"#0F766E","#A16207","#9D174D","#1D4ED8",
"#047857","#B91C1C","#7E22CE","#0369A1",
"#CA8A04","#166534","#9F1239","#4338CA"

];

const colorCache={};

function colorHash(str){

    let h=0;

    for(let i=0;i<str.length;i++)
        h=(h*31+str.charCodeAt(i))>>>0;

    return COUNTRY_COLORS[
        h%COUNTRY_COLORS.length
    ];

}

function getCountryColor(name){

    if(
        name===game.countryCode ||
        game.conquered.includes(name)
    ){
        return "#d91f26";
    }

    if(!colorCache[name])
        colorCache[name]=colorHash(name);

    return colorCache[name];

}

function getFeatureName(feature){

    const p=feature.properties||{};

    return p.ADMIN ||
           p.name ||
           p.NAME ||
           p.NAME_EN ||
           p.SOVEREIGNT ||
           "";

}

function countryStyle(feature){

    const name=getFeatureName(feature);

    return {

        color:"#263d4e",

        weight:1,

        fillColor:getCountryColor(name),

        fillOpacity:.66

    };

}

function refreshCountryColors(){

    if(!geoLayer)return;

    geoLayer.eachLayer(layer=>{

        const name=
            getFeatureName(layer.feature);

        layer.setStyle({

            fillColor:getCountryColor(name),

            fillOpacity:.66,

            color:"#263d4e",

            weight:1

        });

    });

}

function initMap(){

    map=L.map("map",{

        worldCopyJump:false,

        zoomControl:false,

        minZoom:2,

        maxZoom:7

    }).setView([25,10],2);

    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom:19,

            attribution:"© OpenStreetMap"

        }

    ).addTo(map);

    fetch(MAP_GEOJSON)

    .then(r=>r.json())

    .then(data=>{

        geoData=data;

        geoLayer=L.geoJSON(data,{

            style:countryStyle,

            onEachFeature:(feature,layer)=>{

                layer.on({

                    click:()=>{

                        const name=
                            getFeatureName(feature);

                        showCountryInfo(name);

                    },

                    mouseover:e=>{

                        e.target.setStyle({

                            weight:2,

                            color:"#ffffff",

                            fillOpacity:.78

                        });

                    },

                    mouseout:e=>{

                        geoLayer.resetStyle(
                            e.target
                        );

                    }

                });

            }

        }).addTo(map);

        refreshCountryColors();

    });

}

/* =========================================================
   NEWS ENGINE
========================================================= */

function addNews(type,title,text,time){

    game.news.unshift({

        type:type,

        title:title,

        text:text,

        time:
            time ||
            `${game.year} — ${String(game.hour).padStart(2,"0")}:00`

    });

    if(game.news.length>250)
        game.news.pop();

}

function createInitialNews(){

    game.news=[];

    const names=
        COUNTRIES
        .filter(c=>c[0]!==game.countryCode)
        .slice(0,12);

    for(let i=0;i<names.length;i++){

        addNews(
            "جهان",
            "تحولات بین‌المللی",
            `${names[i][1]} ${names[i][0]} در حال بررسی سیاست‌های اقتصادی و دیپلماتیک خود است.`,
            "قبل از شروع"
        );

    }

}

function openNews(){

    renderNews();

    document
        .getElementById("newsModal")
        .classList.add("show");

}

function renderNews(){

    const box=
        document.getElementById(
            "newsContent"
        );

    if(!game.news.length){

        box.innerHTML=
            "<div class='section'>هنوز خبری منتشر نشده.</div>";

        return;
    }

    box.innerHTML=
        game.news.map(n=>`

            <div class="newsItem">

                <div>

                    <span class="tag">
                        ${n.type}
                    </span>

                    <span class="newsTime">
                        ${n.time}
                    </span>

                </div>

                <div class="newsTitle">
                    ${n.title}
                </div>

                <div class="newsText">
                    ${n.text}
                </div>

            </div>

        `).join("");

}

/* =========================================================
   DIPLOMACY AI
========================================================= */

function initAI(){

    game.ai={};

    COUNTRIES.forEach(c=>{

        if(c[0]===game.countryCode)
            return;

        game.ai[c[0]]={

            name:c[0],

            flag:c[1],

            population:c[3],

            economy:rnd(35,90),

            stability:rnd(45,90),

            readiness:rnd(35,90),

            diplomacy:rnd(30,90),

            aggression:rnd(20,90),

            development:rnd(25,85),

            trust:rnd(30,80),

            warWeariness:rnd(0,20),

            relations:rnd(-30,45),

            treasury:
                Math.floor(c[3]/5000)+
                rnd(10000,50000),

            cities:
                Math.max(
                    2,
                    Math.floor(
                        Math.sqrt(c[3]/1000000)
                    )
                ),

            cooldown:rnd(1,4),

            lastAction:"آرام",

            targets:[],

            alliances:[],

            wars:[],

            memory:[],

            personality:
                pickPersonality()

        };

    });

    createInitialDiplomacy();

}

function pickPersonality(){

    const personalities=[

        "صلح‌طلب",

        "اقتصادی",

        "رقابتی",

        "تهاجمی",

        "دفاعی",

        "متعادل",

        "فرصت‌طلب"

    ];

    return personalities[
        rnd(0,personalities.length-1)
    ];

}

function createInitialDiplomacy(){

    for(const a in game.ai){

        game.diplomaticRelations[a]={};

        for(const b in game.ai){

            if(a===b)continue;

            game.diplomaticRelations[a][b]=
                rnd(-20,40);

        }

        game.diplomaticRelations[a]
            [game.countryCode]=rnd(-10,45);

    }

}

/* =========================================================
   AI STRATEGIC BRAIN
========================================================= */

function updateAI(){

    const all=
        Object.values(game.ai);

    for(const ai of all){

        if(ai.cooldown>0){

            ai.cooldown--;

            continue;
        }

        /* -----------------------------------------------
           1. رشد اقتصادی
        ------------------------------------------------ */

        ai.economy=
            clamp(
                ai.economy+rnd(-1,3),
                10,
                100
            );

        ai.development=
            clamp(
                ai.development+rnd(-1,2),
                10,
                100
            );

        /* -----------------------------------------------
           2. ثبات
        ------------------------------------------------ */

        if(ai.economy<45){

            ai.stability=
                clamp(
                    ai.stability-rnd(0,2),
                    10,
                    100
                );

        }else{

            ai.stability=
                clamp(
                    ai.stability+rnd(0,2),
                    10,
                    100
                );

        }

        /* -----------------------------------------------
           3. بازیابی آمادگی
        ------------------------------------------------ */

        if(ai.warWeariness>30){

            ai.warWeariness=
                clamp(
                    ai.warWeariness-rnd(1,3),
                    0,
                    100
                );

            ai.readiness=
                clamp(
                    ai.readiness+rnd(1,4),
                    10,
                    100
                );

        }else{

            ai.readiness=
                clamp(
                    ai.readiness+rnd(-1,3),
                    10,
                    100
                );

        }

        /* -----------------------------------------------
           4. حافظه سیاسی
        ------------------------------------------------ */

        ai.trust=
            clamp(
                ai.trust+rnd(-2,2),
                0,
                100
            );

        /* -----------------------------------------------
           5. تشخیص شرایط
        ------------------------------------------------ */

        const economyScore=
            ai.economy+
            ai.development;

        const defenseScore=
            ai.readiness+
            ai.stability+
            ai.trust;

        const aggressionScore=
            ai.aggression+
            ai.readiness+
            ai.economy-
            ai.warWeariness;

        /* -----------------------------------------------
           6. شخصیت AI
        ------------------------------------------------ */

        let action="آرام";

        if(ai.personality==="صلح‌طلب"){

            if(ai.diplomacy<70)
                ai.diplomacy+=3;

            ai.trust+=2;

            action="دیپلماسی";

        }

        else if(ai.personality==="اقتصادی"){

            ai.economy+=4;

            ai.treasury+=rnd(1000,5000);

            action="اقتصاد";

        }

        else if(ai.personality==="دفاعی"){

            ai.readiness+=4;

            ai.stability+=1;

            action="تقویت آمادگی";

        }

        else if(
            ai.personality==="تهاجمی" &&
            aggressionScore>150
        ){

            action=
                ai.readiness>65 &&
                ai.stability>45
                ?
                "بررسی توسعه"
                :
                "آماده‌سازی";

        }

        else if(
            ai.personality==="فرصت‌طلب"
        ){

            if(
                ai.readiness>70 &&
                ai.economy>60
            )
                action="بررسی فرصت";

            else
                action="اقتصاد";

        }

        else{

            if(economyScore<100)
                action="اقتصاد";

            else if(defenseScore<150)
                action="دفاع";

            else
                action="دیپلماسی";

        }

        ai.lastAction=action;

        /* -----------------------------------------------
           7. تصمیم‌های واقعی جهان
        ------------------------------------------------ */

        aiDiplomaticDecision(ai);

        aiEconomicDecision(ai);

        aiConflictDecision(ai);

        ai.cooldown=rnd(1,4);

    }

    /* تعامل چند کشور با هم */
    simulateInternationalPolitics();

}

/* =========================================================
   AI ECONOMIC DECISION
========================================================= */

function aiEconomicDecision(ai){

    if(ai.economy<40){

        ai.economy+=rnd(3,7);

        ai.treasury=
            Math.max(
                0,
                ai.treasury-rnd(500,2500)
            );

        addNews(
            "اقتصادی",
            `${ai.flag} ${ai.name} برنامه اقتصادی جدیدی آغاز کرد`,
            `${ai.name} برای افزایش تولید و توسعه داخلی سرمایه‌گذاری کرد.`
        );

        return;
    }

    if(
        ai.economy>70 &&
        Math.random()<.12
    ){

        ai.development+=rnd(2,5);

        addNews(
            "اقتصادی",
            `رشد اقتصادی ${ai.name}`,
            `${ai.name} از افزایش فعالیت اقتصادی و سرمایه‌گذاری خبر داد.`
        );

    }

}

/* =========================================================
   AI DIPLOMACY
========================================================= */

function aiDiplomaticDecision(ai){

    const others=
        Object.values(game.ai)
        .filter(x=>x.name!==ai.name);

    if(!others.length)return;

    const target=
        others[
            rnd(0,others.length-1)
        ];

    const relation=
        getRelation(
            ai.name,
            target.name
        );

    /* دو کشور نزدیک سیاسی می‌شوند */

    if(
        relation>35 &&
        Math.random()<.18
    ){

        setRelation(
            ai.name,
            target.name,
            relation+12
        );

        addNews(
            "دیپلماسی",
            `🤝 ${ai.flag} ${ai.name} و ${target.flag} ${target.name}`,
            `${ai.name} و ${target.name} یک توافق همکاری امضا کردند.`
        );

        ai.lastAction="توافق صلح";

        return;
    }

    /* روابط بد ممکن است به تنش تبدیل شود */

    if(
        relation<-35 &&
        Math.random()<.13
    ){

        setRelation(
            ai.name,
            target.name,
            relation-8
        );

        addNews(
            "تنش",
            `⚠️ افزایش تنش میان ${ai.name} و ${target.name}`,
            `روابط دو کشور وارد مرحله جدیدی از تنش سیاسی شده است.`
        );

        ai.lastAction="تنش";

    }

}

/* =========================================================
   AI CONFLICT DECISION
========================================================= */

function aiConflictDecision(ai){

    if(
        ai.readiness<65 ||
        ai.stability<45 ||
        ai.warWeariness>55
    ){
        return;
    }

    const candidates=
        Object.values(game.ai)
        .filter(x=>
            x.name!==ai.name &&
            !ai.alliances.includes(x.name)
        );

    if(!candidates.length)return;

    const target=
        candidates.sort(
            (a,b)=>
            calculateAIPower(a)-
            calculateAIPower(b)
        )[0];

    const myPower=
        calculateAIPower(ai);

    const enemyPower=
        calculateAIPower(target);

    const relation=
        getRelation(
            ai.name,
            target.name
        );

    /* AI فقط زمانی وارد درگیری می‌شود
       که اختلاف قدرت و روابط شرایط خاصی داشته باشد. */

    if(
        relation<-35 &&
        myPower>enemyPower*1.15 &&
        Math.random()<.08
    ){

        ai.wars.push(target.name);

        ai.readiness-=rnd(8,14);

        ai.warWeariness+=rnd(10,18);

        target.readiness-=rnd(4,9);

        addNews(
            "جنگ",
            `⚔️ ${ai.flag} ${ai.name} با ${target.flag} ${target.name} وارد جنگ شد`,
            `درگیری میان دو کشور آغاز شده است و نتیجه آن هنوز مشخص نیست.`
        );

        resolveAIWar(ai,target);

    }

}

/* =========================================================
   AI POWER
========================================================= */

function calculateAIPower(ai){

    return (

        ai.population/1000000*.8+

        ai.economy*8+

        ai.development*5+

        ai.readiness*12+

        ai.stability*7+

        ai.cities*30

    );

}

/* =========================================================
   AI WAR RESOLUTION
========================================================= */

function resolveAIWar(a,b){

    const powerA=
        calculateAIPower(a)*
        (rnd(90,110)/100);

    const powerB=
        calculateAIPower(b)*
        (rnd(90,110)/100);

    let winner;
    let loser;

    if(powerA>=powerB){

        winner=a;
        loser=b;

    }else{

        winner=b;
        loser=a;

    }

    winner.readiness=
        clamp(
            winner.readiness-rnd(5,15),
            0,
            100
        );

    winner.warWeariness+=rnd(10,20);

    loser.readiness=
        clamp(
            loser.readiness-rnd(12,25),
            0,
            100
        );

    loser.stability=
        clamp(
            loser.stability-rnd(4,12),
            10,
            100
        );

    /*
     * همیشه تصرف کامل اتفاق نمی‌افتد.
     * فقط بعضی جنگ‌ها به تغییر مرز/کنترل منجر می‌شوند.
     */

    if(
        powerA>powerB*1.35 ||
        powerB>powerA*1.35
    ){

        winner.cities+=1;

        addNews(
            "جنگ",
            `🏆 ${winner.flag} ${winner.name} پیروز شد`,
            `${winner.name} در جنگ اخیر برتری به دست آورد و بخشی از نفوذ ${loser.name} را در اختیار گرفت.`
        );

    }else{

        addNews(
            "جنگ",
            `⚠️ جنگ ${a.name} و ${b.name} ادامه دارد`,
            `هیچ‌کدام از دو کشور نتوانستند پیروزی قاطع به دست آورند.`
        );

    }

}

/* =========================================================
   INTERNATIONAL POLITICS
========================================================= */

function simulateInternationalPolitics(){

    const list=
        Object.values(game.ai);

    if(list.length<2)return;

    for(let i=0;i<3;i++){

        const a=
            list[rnd(0,list.length-1)];

        const b=
            list[rnd(0,list.length-1)];

        if(a===b)continue;

        const relation=
            getRelation(a.name,b.name);

        /* صلح */
        if(
            relation>55 &&
            Math.random()<.06
        ){

            setRelation(
                a.name,
                b.name,
                relation+10
            );

            addNews(
                "صلح",
                `🕊️ پیمان صلح میان ${a.flag} ${a.name} و ${b.flag} ${b.name}`,
                `دو کشور پس از مذاکرات دیپلماتیک روابط خود را بهبود دادند و یک پیمان صلح امضا کردند.`
            );

        }

        /* قطع روابط */
        else if(
            relation<-55 &&
            Math.random()<.04
        ){

            setRelation(
                a.name,
                b.name,
                relation-10
            );

            addNews(
                "دیپلماسی",
                `📉 روابط ${a.name} و ${b.name} تیره شد`,
                `مذاکرات میان دو کشور نتیجه مطلوبی نداشت و سطح روابط کاهش یافت.`
            );

        }

        /* اتحاد */
        else if(
            relation>65 &&
            a.trust>65 &&
            b.trust>65 &&
            Math.random()<.025
        ){

            if(!a.alliances.includes(b.name))
                a.alliances.push(b.name);

            if(!b.alliances.includes(a.name))
                b.alliances.push(a.name);

            addNews(
                "اتحاد",
                `🤝 اتحاد جدید در جهان`,
                `${a.flag} ${a.name} و ${b.flag} ${b.name} یک اتحاد رسمی تشکیل دادند.`
            );

        }

    }

}

/* =========================================================
   RELATION HELPERS
========================================================= */

function getRelation(a,b){

    if(
        game.diplomaticRelations[a] &&
        typeof game.diplomaticRelations[a][b]==="number"
    ){
        return game.diplomaticRelations[a][b];
    }

    if(
        game.diplomaticRelations[b] &&
        typeof game.diplomaticRelations[b][a]==="number"
    ){
        return game.diplomaticRelations[b][a];
    }

    return 0;

}

function setRelation(a,b,value){

    if(!game.diplomaticRelations[a])
        game.diplomaticRelations[a]={};

    if(!game.diplomaticRelations[b])
        game.diplomaticRelations[b]={};

    game.diplomaticRelations[a][b]=
        clamp(value,-100,100);

    game.diplomaticRelations[b][a]=
        clamp(value,-100,100);

}

/* =========================================================
   HOURLY PRODUCTION
========================================================= */

function calculateProduction(){

    let base=

        100+

        game.population/500000+

        game.cities*70+

        game.industry*4+

        game.infrastructure*2+

        game.economyLevel*120;

    base*=

        1+
        (game.stability-50)/500;

    base*=

        1+
        (game.tax-15)/500;

    return Math.max(
        50,
        Math.floor(base)
    );

}

function hourlyProduction(){

    game.production=
        calculateProduction();

    const income=
        game.production;

    game.money+=income;

    game.food+=
        Math.floor(
            income*.18
        );

    game.energy+=
        Math.floor(
            income*.08
        );

    game.industry+=
        Math.floor(
            income*.015
        );

    game.population+=
        Math.floor(
            game.population*.000025
        );

    /* بازیابی */

    if(game.warWeariness>0){

        game.warWeariness=
            clamp(
                game.warWeariness-.8,
                0,
                100
            );

    }

    if(game.warWeariness<25){

        game.warReadiness=
            clamp(
                game.warReadiness+1.5,
                0,
                100
            );

    }

    game.commandPoints=
        clamp(
            game.commandPoints+2,
            0,
            15
        );

    produceSoldiers();

}

/* =========================================================
   SOLDIER PRODUCTION
========================================================= */

function produceSoldiers(){

    const hourly=

        Math.floor(

            10+

            game.industry*.7+

            game.infrastructure*.3

        );

    const capacity=
        Math.max(
            0,
            game.armyCapacity-game.army
        );

    const produced=
        Math.min(
            hourly,
            capacity
        );

    if(produced<=0)return;

    game.soldiers+=produced;

    game.army+=produced;

    addLog(
        `👥 ${produced} نیروی جدید آموزش دید.`
    );

}

/* =========================================================
   NEXT HOUR
========================================================= */

function nextTurn(){

    if(!game.started)return;

    game.hour++;

    if(game.hour>=24){

        game.hour=0;

        game.year++;

        dailyWorldEvents();

    }

    hourlyProduction();

    updateAI();

    updateGovernmentEffects();

    updateUI();

    if(
        document
        .getElementById("newsModal")
        .classList.contains("show")
    ){
        renderNews();
    }

}

/* =========================================================
   AUTOMATIC WORLD NEWS
========================================================= */

function dailyWorldEvents(){

    const r=rnd(1,14);

    if(r===1){

function calculateCountryPower(name){

    const d=countryData(name);

    return Math.floor(

        Math.log10(
            Math.max(
                100000,
                d.population
            )
        )*180+

        Math.sqrt(
            d.population/1000000
        )*100+

        Math.log10(
            Math.max(
                1000,
                d.population
            )
        )*90

    );

}

function getOurWarPower(){

    return Math.floor(

        game.army*.55+

        game.soldiers*.35+

        game.infrastructure*4+

        game.industry*3+

        game.warReadiness*25+

        game.stability*12+

        game.commandPoints*70

    );

}

function warDifficulty(name){

    return Math.floor(

        calculateCountryPower(name)*

        (
            .85+
            ((name.length*13)%30)/100
        )

    );

}

/* =========================================================
   RESOLVE WAR
========================================================= */

function resolveWar(target,targetPower){

    const ours=
        getOurWarPower();

    const finalOur=
        ours*
        (rnd(85,115)/100);

    const finalEnemy=
        targetPower*
        (rnd(88,112)/100);

    const ratio=
        finalOur/
        Math.max(
            finalEnemy,
            1
        );

    if(ratio>=1.18){

        winWar(
            target,
            ratio
        );

    }

    else if(ratio>=.9){

        costlyWar(
            target,
            ratio
        );

    }

    else{

        loseWar(
            target,
            ratio
        );

    }

    updateUI();

}

/* =========================================================
   WIN
========================================================= */

function winWar(target,ratio){

    const d=
        countryData(target);

    if(!game.conquered.includes(target))
        game.conquered.push(target);

    game.population+=
        Math.floor(
            d.population*.72
        );

    game.money+=
        Math.floor(
            d.population/1500
        );

    game.reputation+=4;

    game.stability=
        clamp(
            game.stability-rnd(2,7),
            0,
            100
        );

    game.warReadiness=
        clamp(
            game.warReadiness-rnd(12,22),
            0,
            100
        );

    game.warWeariness+=
        rnd(15,25);

    game.commandPoints=
        Math.max(
            0,
            game.commandPoints-2
        );

    game.cities+=
        Math.max(
            1,
            Math.floor(
                Math.sqrt(
                    d.population/
                    30000000
                )
            )
        );

    game.army=
        Math.floor(
            game.army*.94
        );

    game.soldiers=
        Math.floor(
            game.soldiers*.93
        );

    addNews(
        "جنگ",
        `🏆 پیروزی ${game.countryCode} بر ${target}`,
        `${d.flag} ${target} تحت کنترل ${countryData(game.countryCode).flag} ${game.countryCode} قرار گرفت.`
    );

    addLog(
        `🏆 ${target} تصرف شد.`
    );

    refreshCountryColors();

    renderControlledCountries();

}

   COSTLY WAR
========================================================= */

        );

        );

    game.warReadiness=
        Math.max(
            0,
            game.warReadiness-20
        );

    game.warWeariness+=25;

    game.stability=
        Math.max(
            0,
            game.stability-8
        );

    addNews(
        "جنگ",
        `⚠️ جنگ با ${target} بدون پیروزی قاطع`,
        "نبرد بسیار نزدیک بود و هیچ طرفی نتوانست پیروزی کامل به دست آورد."
    );

    addLog(
        `⚠️ جنگ با ${target} هزینه سنگینی داشت.`
    );

}

/* =========================================================
   LOSS
========================================================= */

function loseWar(target,ratio){

    game.army=
        Math.floor(
            game.army*.78
        );

    game.soldiers=
        Math.floor(
            game.soldiers*.72
        );

    game.reserves=
        Math.floor(
            game.reserves*.85
        );

    game.money=
        Math.floor(
            game.money*.92
        );

    game.warReadiness=
        Math.max(
            10,
            game.warReadiness-30
        );

    game.warWeariness=
        Math.min(
            100,
            game.warWeariness+35
        );

    game.stability=
        Math.max(
            15,
            game.stability-12
        );

    game.reputation=
        Math.max(
            0,
            game.reputation-6
        );

    addNews(
        "جنگ",
        `❌ شکست ${game.countryCode} در برابر ${target}`,
        `حمله بدون موفقیت پایان یافت و کشور برای بازسازی نیاز به زمان دارد.`
    );

    addLog(
        `❌ حمله به ${target} شکست خورد.`
    );

}

/* =========================================================
   COUNTRY INFORMATION
========================================================= */

function showCountryInfo(name){

    const d=
        countryData(name);

    const owned=
        name===game.countryCode ||
        game.conquered.includes(name);

    document.getElementById(
        "countryContent"
    ).innerHTML=`

        <div class="section">

            <h2>
                ${d.flag}
                ${d.name}
            </h2>

            <div class="grid">

                <div class="card">
                    جمعیت
                    <b>${formatNum(d.population)}</b>
                </div>

                <div class="card">
                    وضعیت
                    <b>
                        ${owned
                            ?"تحت کنترل شما"
                            :"مستقل"}
                    </b>
                </div>

                <div class="card">
                    قدرت تقریبی
                    <b>
                        ${formatNum(
                            calculateCountryPower(name)
                        )}
                    </b>
                </div>

            </div>

        </div>

        <div class="section">

            ${
                owned
                ?
                `
                    <h3>👑 قلمرو شما</h3>

                    <p>
                        این کشور بخشی از قلمرو شماست.
                    </p>
                `
                :
                `
                    <button
                        class="action danger"
                        onclick="
                            closeModal('countryModal');
                            openWar();
                        ">

                        ⚔️ بررسی جنگ

                    </button>
                `
            }

        </div>

    `;

    document
        .getElementById("countryModal")
        .classList.add("show");

}

/* =========================================================
   GOVERNMENT EFFECTS
========================================================= */

function updateGovernmentEffects(){

    const pressure=
        Math.max(
            0,
            game.tax-20
        );

    game.stability=
        clamp(
            game.stability-
            pressure*.015,
            0,
            100
        );

    game.reputation=
        clamp(
            game.reputation+
            (game.tax<12?.03:-.02),
            0,
            100
        );

}

/* =========================================================
   LOG
========================================================= */

function addLog(text){

    game.logs.push(

        "["+
        String(game.hour).padStart(2,"0")+
        ":00] "+
        text

    );

    if(game.logs.length>150)
        game.logs.shift();

}

/* =========================================================
   MODAL
========================================================= */

function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("show");

}

document
.querySelectorAll(".modal")
.forEach(m=>{

    m.addEventListener(
        "click",
        e=>{

            if(e.target===m)
                m.classList.remove("show");

        }
    );

});

/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    localStorage.setItem(
        "WORLD_EMPIRE_SAVE",
        JSON.stringify(game)
    );

}

function loadGame(){

    const raw=
        localStorage.getItem(
            "WORLD_EMPIRE_SAVE"
        );

    if(!raw)return;

    try{

        Object.assign(
            game,
            JSON.parse(raw)
        );

    }catch(e){}

}

setInterval(()=>{

    if(game.started)
        saveGame();

},30000);

/* =========================================================
   NEWS LIVE REFRESH
========================================================= */

setInterval(()=>{

    if(!game.started)return;

    /*
     * مغز هوش مصنوعی در پس‌زمینه
     * بدون نیاز به کلیک کار می‌کند.
     */

    updateAI();

    updateUI();

    if(
        document
        .getElementById("newsModal")
        .classList.contains("show")
    ){

        renderNews();

    }

},45000);

/* =========================================================
   UI CLOCK
========================================================= */

setInterval(()=>{

    if(!game.started)return;

    updateUI();

},1000);

/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Escape"){

            document
            .querySelectorAll(".modal.show")
            .forEach(x=>
                x.classList.remove("show")
            );

        }

    }
);

/* =========================================================
   INITIAL
========================================================= */

updateUI();

</script>
