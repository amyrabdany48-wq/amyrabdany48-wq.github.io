<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Empire Nations — Global Strategy</title>
<style>
:root{
  --bg:#07111a;
  --panel:#0d1a25;
  --panel2:#122331;
  --panel3:#182b3a;
  --line:rgba(255,255,255,.09);
  --text:#eef6ff;
  --muted:#8ea4b7;
  --green:#32d89a;
  --cyan:#45d8ff;
  --blue:#4285ff;
  --red:#ff5f73;
  --yellow:#ffd166;
  --purple:#a981ff;
  --orange:#ff9e56;
  --shadow:0 18px 55px rgba(0,0,0,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#061019
}
#world{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
  radial-gradient(circle at 50% 50%,rgba(32,91,125,.14),transparent 45%),
  linear-gradient(180deg,#0b1d2a,#061018)
}
#ocean{
  position:absolute;
  inset:0;
  background:
  linear-gradient(rgba(80,170,215,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(80,170,215,.035) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none
}
#mapLayer{
  position:absolute;
  inset:0;
  transform-origin:50% 50%;
  transition:transform .12s linear
}
.country{
  position:absolute;
  border:2px solid rgba(255,255,255,.28);
  border-radius:7px;
  color:#fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2px;
  font-weight:900;
  font-size:9px;
  text-shadow:0 2px 5px rgba(0,0,0,.9);
  box-shadow:0 6px 16px rgba(0,0,0,.22),inset 0 0 12px rgba(255,255,255,.08);
  transition:.16s;
  z-index:3
}
.country:hover{
  filter:brightness(1.16);
  z-index:8
}
.country.selected{
  outline:3px solid #fff;
  z-index:9;
  box-shadow:0 0 24px rgba(255,255,255,.55)
}
.country.enemy{
  box-shadow:0 0 24px rgba(255,69,89,.65);
  outline:2px solid #ff5069
}
.country.owned{
  box-shadow:0 0 22px rgba(60,225,170,.32)
}
.country .flag{
  font-size:16px;
  display:block;
  margin-bottom:2px
}
.country .mini{
  font-size:7px;
  opacity:.8
}
#fx{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:30
}
.projectile{
  position:absolute;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff;
  box-shadow:
  0 0 9px #fff,
  0 0 20px #ffb84a,
  0 0 36px #ff5b39;
  z-index:35
}
.projectile:after{
  content:"";
  position:absolute;
  left:-38px;
  top:4px;
  width:40px;
  height:4px;
  border-radius:99px;
  background:linear-gradient(90deg,transparent,#ff7547,#fff)
}
.intercept{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#6de6ff;
  box-shadow:0 0 10px #6de6ff,0 0 20px #439cff;
  z-index:36
}
.explosion{
  position:absolute;
  width:20px;
  height:20px;
  margin:-10px;
  border-radius:50%;
  border:4px solid #ffd65e;
  box-shadow:0 0 25px #ff8338,0 0 55px #ff3f43;
  animation:explode .85s ease-out forwards;
  z-index:40
}
@keyframes explode{
  0%{transform:scale(.15);opacity:1}
  55%{transform:scale(3);opacity:.85}
  100%{transform:scale(6);opacity:0}
}
#topbar{
  position:absolute;
  top:8px;
  left:8px;
  right:8px;
  z-index:60;
  display:flex;
  gap:7px;
  align-items:stretch
}
.brand,.resource,.glass,#dock,#side,#modalBox{
  background:rgba(8,18,28,.87);
  border:1px solid var(--line);
  backdrop-filter:blur(17px);
  box-shadow:var(--shadow)
}
.brand{
  min-width:210px;
  padding:10px 14px;
  border-radius:15px
}
.brand b{
  display:block;
  font-size:16px;
  letter-spacing:.7px
}
.brand small{
  color:var(--muted);
  font-size:8px
}
.resourceRow{
  display:flex;
  gap:6px;
  flex:1;
  overflow:auto;
  scrollbar-width:none
}
.resourceRow::-webkit-scrollbar{display:none}
.resource{
  min-width:102px;
  border-radius:14px;
  padding:8px 10px
}
.resource small{
  display:block;
  font-size:8px;
  color:var(--muted)
}
.resource b{
  display:block;
  margin-top:4px;
  font-size:12px
}
#mapTools{
  position:absolute;
  left:8px;
  top:91px;
  z-index:55;
  display:flex;
  flex-direction:column;
  gap:6px
}
.tool{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(9,19,30,.91);
  color:#eaf6ff
}
.tool.active{
  border-color:var(--cyan);
  box-shadow:0 0 18px rgba(69,216,255,.26)
}
#side{
  position:absolute;
  right:8px;
  top:91px;
  width:315px;
  max-height:calc(100vh - 176px);
  z-index:55;
  border-radius:18px;
  overflow:hidden
}
.sideHead{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center
}
.sideBody{
  padding:11px;
  overflow:auto;
  max-height:calc(100vh - 230px)
}
#dock{
  position:absolute;
  bottom:7px;
  left:50%;
  transform:translateX(-50%);
  z-index:60;
  width:min(1040px,calc(100vw - 16px));
  border-radius:18px;
  padding:7px;
  display:flex;
  gap:4px;
  overflow:auto;
  scrollbar-width:none
}
#dock::-webkit-scrollbar{display:none}
.dockBtn{
  flex:1;
  min-width:72px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#a9bccb;
  padding:7px 5px
}
.dockBtn:hover{
  background:rgba(255,255,255,.06);
  color:#fff
}
.dockBtn i{
  display:block;
  font-style:normal;
  font-size:18px
}
.dockBtn span{
  display:block;
  margin-top:3px;
  font-size:8px;
  font-weight:900
}
.card{
  border:1px solid rgba(255,255,255,.065);
  background:rgba(255,255,255,.033);
  border-radius:14px;
  padding:11px;
  margin-bottom:8px
}
.cardHead{
  display:flex;
  align-items:center;
  gap:8px
}
.icon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:rgba(60,150,255,.12);
  font-size:19px
}
.title{
  font-size:11px;
  font-weight:1000
}
.sub{
  font-size:8px;
  color:var(--muted);
  margin-top:3px
}
.desc{
  font-size:9px;
  line-height:1.85;
  color:#b6c7d5;
  margin-top:8px
}
.row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px
}
.btn{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.045);
  color:#eaf5ff;
  border-radius:9px;
  padding:7px 9px;
  font-size:9px;
  font-weight:900
}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.green{background:linear-gradient(135deg,#187c60,#176b78)}
.btn.red{background:linear-gradient(135deg,#9a2f46,#693042)}
.btn.blue{background:linear-gradient(135deg,#1976b9,#3156a6)}
.btn.purple{background:linear-gradient(135deg,#6d51bc,#8c4ca8)}
.btn.orange{background:linear-gradient(135deg,#b0692e,#91512b)}
.progress{
  height:6px;
  border-radius:99px;
  overflow:hidden;
  background:#172a38;
  margin-top:7px
}
.progress>div{
  height:100%;
  background:linear-gradient(90deg,#35d7ff,#8b78ff,#35dc9d)
}
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:7px;
  margin-bottom:10px
}
.kpi{
  padding:10px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:12px;
  background:rgba(255,255,255,.03)
}
.kpi small{
  display:block;
  color:var(--muted);
  font-size:8px
}
.kpi b{
  display:block;
  margin-top:4px;
  font-size:14px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
  gap:8px
}
.section{
  margin:14px 0 8px;
  font-size:11px;
  font-weight:1000
}
.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:8px;
  background:rgba(255,255,255,.06);
  font-size:8px;
  margin:2px
}
.search{
  width:100%;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0b1722;
  color:#fff;
  outline:none
}
.tabs{
  display:flex;
  gap:5px;
  overflow:auto;
  scrollbar-width:none;
  margin-bottom:10px
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  white-space:nowrap;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:9px;
  background:rgba(255,255,255,.035);
  color:#99adbe;
  font-size:8px;
  font-weight:900
}
.tab.active{
  color:#fff;
  border-color:var(--cyan);
  background:rgba(55,170,255,.1)
}
#modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:10px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(6px)
}
#modal.show{display:flex}
#modalBox{
  width:min(1120px,97vw);
  max-height:94vh;
  border-radius:20px;
  overflow:hidden
}
.modalHead{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center
}
.modalBody{
  padding:13px;
  overflow:auto;
  max-height:calc(94vh - 58px)
}
.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.07);
  color:#fff
}
.notice{
  padding:9px 10px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(60,150,255,.045);
  border-radius:10px;
  color:#abc0d0;
  font-size:8px;
  line-height:1.9;
  margin-bottom:9px
}
#toast{
  position:absolute;
  top:82px;
  left:50%;
  transform:translateX(-50%);
  z-index:900;
  width:min(430px,92vw)
}
.toast{
  background:rgba(8,17,27,.96);
  border:1px solid rgba(255,255,255,.09);
  border-right:3px solid var(--cyan);
  border-radius:10px;
  padding:9px 11px;
  font-size:9px;
  margin-bottom:5px;
  box-shadow:var(--shadow)
}
.toast.good{border-right-color:var(--green)}
.toast.bad{border-right-color:var(--red)}
.toast.warn{border-right-color:var(--yellow)}
#startScreen{
  position:fixed;
  inset:0;
  z-index:1000;
  background:
  radial-gradient(circle at 50% 40%,rgba(45,111,156,.26),transparent 34%),
  linear-gradient(180deg,#091725,#04090e);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px
}
.startBox{
  width:min(950px,96vw);
  max-height:92vh;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(7,15,24,.86);
  padding:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.65);
  backdrop-filter:blur(16px)
}
.logo{
  text-align:center;
  font-size:clamp(30px,7vw,58px);
  font-weight:1000;
  letter-spacing:1px;
  background:linear-gradient(90deg,#fff,#4bd8ff,#a982ff,#fff);
  -webkit-background-clip:text;
  color:transparent
}
.startSub{
  text-align:center;
  color:#8fa5b8;
  font-size:9px;
  margin:5px 0 15px
}
.countryChoice{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:7px
}
.choice{
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03);
  border-radius:12px;
  padding:10px;
  color:#fff;
  text-align:right
}
.choice:hover{
  border-color:var(--cyan);
  background:rgba(60,160,255,.07)
}
.choice b{font-size:10px}
.choice small{display:block;color:var(--muted);font-size:8px;margin-top:3px}
@media(max-width:760px){
  #topbar{flex-wrap:wrap}
  .brand{width:100%}
  .resourceRow{width:100%}
  #mapTools{top:145px}
  #side{
    top:auto;
    bottom:73px;
    right:6px;
    left:6px;
    width:auto;
    max-height:250px;
    transform:translateY(calc(100% + 12px));
    transition:.22s
  }
  #side.open{transform:none}
  .sideBody{max-height:190px}
  #dock{bottom:5px}
  .country{font-size:7px}
}
</style>
</head>

    <button class="dockBtn" onclick="nextDay()"><i>⏩</i><span>روز بعد</span></button>

  <div id="toast"></div>

  <div id="modal">
    <div id="modalBox">
      <div class="modalHead">
        <b id="modalTitle"></b>
        <button class="close" onclick="closeModal()">×</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
    </div>
  </div>
</div>

<div id="startScreen">
  <div class="startBox">
    <div class="logo">EMPIRE NATIONS</div>
    <div class="startSub">یک کشور را انتخاب کن و قدرت خودت را بساز</div>
    <input id="countrySearch" class="search" placeholder="جستجوی کشور..." oninput="renderCountryChoices()">
    <div class="countryChoice" id="countryChoices" style="margin-top:10px"></div>
  </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}
function num(v,d=0){
  const n=Number(v);
  return Number.isFinite(n)?n:d;
}
function money(v){
  return Math.round(v||0).toLocaleString("en-US")+"$";
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,s=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[s]));
}
function toast(text,type="info"){
  const el=document.createElement("div");
  el.className="toast "+type;
  el.textContent=text;
  $("toast").appendChild(el);
  setTimeout(()=>el.remove(),2600);
}
function openModal(title,html){
  $("modalTitle").textContent=title;
  $("modalBody").innerHTML=html;
  $("modal").classList.add("show");
}
function closeModal(){
  $("modal").classList.remove("show");
}
$("modal").addEventListener("click",e=>{
  if(e.target===$("modal"))closeModal();
});

function country(id){
  return COUNTRY_DATA.find(c=>c.id===id)||null;
}
function playerCountry(){
  return country(state.player)||COUNTRY_DATA[0];
}
function relation(id){
  return num(state.relations[id],0);
}
function setRelation(id,v){
  if(id!==state.player)state.relations[id]=clamp(v,-100,100);
}
function changeRelation(id,v){
  setRelation(id,relation(id)+v);
}
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      state=Object.assign(state,parsed);
      normalizeState();
      return true;
    }
  }catch(e){}
  return false;
}
function normalizeState(){
  state.money=Math.max(0,num(state.money));
  state.population=Math.max(.1,num(state.population));
  state.energy=Math.max(0,num(state.energy));
  state.oil=Math.max(0,num(state.oil));
  state.food=Math.max(0,num(state.food));
  state.industry=Math.max(1,num(state.industry));
  state.military=Math.max(1,num(state.military));
  state.technology=Math.max(0,num(state.technology));
  state.stability=clamp(num(state.stability),0,100);
  state.approval=clamp(num(state.approval),0,100);
  state.reputation=clamp(num(state.reputation),0,100);
  state.influence=clamp(num(state.influence),0,100);
  state.research=Math.max(0,num(state.research));
  state.command=clamp(num(state.command),0,200);
  state.warExhaustion=clamp(num(state.warExhaustion),0,100);
  state.taxRate=clamp(num(state.taxRate),0,40);
  state.inventory=state.inventory||{};
  state.buildings=state.buildings||{};
  state.technologies=state.technologies||{};
  state.territories=Array.isArray(state.territories)?state.territories:[];
  state.territoryData=state.territoryData||{};
  state.wars=Array.isArray(state.wars)?state.wars:[];
  state.relations=state.relations||{};
  state.treaties=Array.isArray(state.treaties)?state.treaties:[];
  state.alliances=Array.isArray(state.alliances)?state.alliances:[];
  state.sanctions=Array.isArray(state.sanctions)?state.sanctions:[];
  state.news=Array.isArray(state.news)?state.news:[];
  state.statistics=Object.assign({
    wars:0,wins:0,losses:0,launches:0,interceptions:0,territoriesTaken:0
  },state.statistics||{});
}

function addNews(title,text,type="world"){
  state.news.unshift({
    title,text,type,
    year:state.year,
    month:state.month,
    day:state.day
  });
  if(state.news.length>300)state.news.length=300;
}

function startGame(id){
  const c=country(id);
  if(!c)return;

  state.started=true;
  state.player=id;
  state.selectedCountry=id;
  state.population=c.pop;
  state.money=Math.round(11000+c.economy*140);
  state.energy=75+c.economy*.18;
  state.oil=70+c.military*.10;
  state.food=95;
  state.industry=35+c.economy*.45;
  state.military=45+c.military*.62;
  state.technology=30+c.economy*.35;
  state.stability=c.stability;
  state.approval=70;
  state.reputation=55;
  state.influence=30;
  state.research=30;
  state.command=100;
  state.inventory={};
  state.buildings={};
  state.technologies={};
  state.territories=[id];
  state.territoryData={};
  state.wars=[];
  state.treaties=[];
  state.alliances=[];
  state.sanctions=[];
  state.news=[];
  state.relations={};

  COUNTRY_DATA.forEach(x=>{
    state.relations[x.id]=x.id===id?100:Math.round(Math.random()*40-10);
  });

  initializeTerritory(id,true);
  addNews("🏛️ آغاز حکومت",`حکومت جدید در ${c.name} آغاز شد.`,"politics");
  $("startScreen").style.display="none";
  saveGame();
  renderAll();
  toast(`✅ ${c.name} انتخاب شد`,"good");
}

function initializeTerritory(id,isCore=false){
  const c=country(id);
  if(!c)return;
  if(!state.territoryData[id]){
    state.territoryData[id]={
      loyalty:isCore?100:48,
      control:isCore?100:58,
      stability:isCore?c.stability:46,
      infrastructure:50,
      localIndustry:Math.round(c.economy*.35),
      localTax:10,
      unrest:isCore?5:35,
      defense:Math.round(c.military*.4)
    };
  }
}

function territoryOwner(id){
  return state.territories.includes(id)?state.player:id;
}

function renderCountryChoices(){
  const q=($("countrySearch").value||"").trim().toLowerCase();
  $("countryChoices").innerHTML=COUNTRY_DATA
    .filter(c=>!q||c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q))
    .map(c=>`
      <button class="choice" onclick="startGame('${c.id}')">
        <b>${c.flag} ${esc(c.name)}</b>
        <small>قدرت ${c.military} • اقتصاد ${c.economy} • ثبات ${c.stability}</small>
      </button>
    `).join("");
}

function renderMap(){
  const layer=$("mapLayer");
  layer.innerHTML="";
  layer.style.transform=`scale(${state.mapZoom})`;

  COUNTRY_DATA.forEach(c=>{
    const el=document.createElement("button");
    el.className="country";
    el.dataset.id=c.id;

    const owned=state.territories.includes(c.id);
    const activeWar=state.wars.some(w=>w.enemy===c.id&&w.status==="war");

    if(owned)el.classList.add("owned");
    if(activeWar)el.classList.add("enemy");
    if(state.selectedCountry===c.id)el.classList.add("selected");

    const baseColor=owned?playerCountry().color:c.color;
    el.style.background=baseColor;
    el.style.left=c.x+"%";
    el.style.top=c.y+"%";
    el.style.width=c.w+"%";
    el.style.height=c.h+"%";

    const t=state.territoryData[c.id];

    el.innerHTML=`
      <span>
        <span class="flag">${c.flag}</span>
        ${esc(c.name)}
        ${owned?`<div class="mini">کنترل ${Math.round(t?.control||100)}%</div>`:""}
      </span>
    `;

    el.onclick=()=>{
      state.selectedCountry=c.id;
      renderMap();
      openCountryPanel(c.id);
    };

    layer.appendChild(el);
  });

  applyMapMode();
}

function applyMapMode(){
  document.querySelectorAll(".country").forEach(el=>{
    const c=country(el.dataset.id);
    if(!c)return;

    if(state.mapMode==="political"){
      el.style.filter="none";
    }
    if(state.mapMode==="military"){
      const v=state.territories.includes(c.id)?state.military:c.military;
      el.style.filter=`brightness(${.65+v/180}) saturate(${.75+v/100})`;
    }
    if(state.mapMode==="economy"){
      const v=state.territories.includes(c.id)?state.industry:c.economy;
      el.style.filter=`brightness(${.65+v/180}) saturate(${.75+v/100})`;
    }
    if(state.mapMode==="stability"){
      const v=state.territories.includes(c.id)?state.stability:c.stability;
      el.style.filter=`brightness(${.65+v/180}) saturate(${.70+v/100})`;
    }
  });
}
function setMapMode(mode){
  state.mapMode=mode;
  document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));
  applyMapMode();
  saveGame();
}
function zoomMap(dir){
  state.mapZoom=clamp(state.mapZoom+(dir*.1),.8,1.5);
  renderMap();
}
function toggleSide(){
  $("side").classList.toggle("open");
}

function renderTop(){
  $("money").textContent=money(state.money);
  $("population").textContent=state.population.toFixed(1)+"M";
  $("energy").textContent=Math.round(state.energy);
  $("oil").textContent=Math.round(state.oil);
  $("food").textContent=Math.round(state.food);
  $("industry").textContent=Math.round(state.industry);
  $("military").textContent=Math.round(state.military);
  $("date").textContent=`${state.year}/${String(state.month).padStart(2,"0")}/${String(state.day).padStart(2,"0")}`;
}

function powerScore(){
  return state.military*.32+

function findEquipment(name){
  return EQUIPMENT.find(x=>x.name===name)||null;
}
function buyEquipment(name){
  const item=findEquipment(name);
  if(!item)return;
  if(state.money<item.cost){
    toast("بودجه کافی نیست","bad");
    return;
  }
  state.money-=item.cost;
  state.inventory[name]=(state.inventory[name]||0)+1;
  state.military+=item.power*.035;
  if(item.type==="airdef")state.missileDefense+=item.defense*.04;
  addNews("🛒 خرید تجهیزات",`${name} به ارتش اضافه شد.`,"military");
  saveGame();
  renderAll();
  openStore();
}
function sellEquipment(name){
  const item=findEquipment(name);
  if(!item||!(state.inventory[name]>0)){
    toast("این تجهیز در انبار نیست","warn");
    return;
  }
  state.inventory[name]--;
  state.money+=Math.round(item.cost*.55);
  state.military=Math.max(1,state.military-item.power*.02);
  saveGame();
  renderAll();
  openStore();
}

function equipmentCount(){
  return Object.values(state.inventory).reduce((a,b)=>a+b,0);
}
function militaryAssetPower(){
  let total=0;
  EQUIPMENT.forEach(x=>{
    total+=(state.inventory[x.name]||0)*x.power;
  });
  return total;
}
function categoryPower(type){
  let total=0;
  EQUIPMENT.filter(x=>x.type===type).forEach(x=>{
    total+=(state.inventory[x.name]||0)*x.power;
  });
  return total;
}

function calculatePlayerWarPower(){
  return state.military+
         state.technology*.42+
         state.industry*.18+
         state.command*.15+
         militaryAssetPower()*.018-
         state.warExhaustion*.35;
}
function calculateEnemyPower(id){
  const c=country(id);
  if(!c)return 50;
  return c.military*1.35+c.economy*.32+c.stability*.22+Math.random()*15;
}

function declareWar(id){
  if(state.territories.includes(id))return;
  if(state.wars.some(w=>w.enemy===id&&w.status==="war")){
    toast("با این کشور در جنگ هستی","warn");
    return;
  }
  if(state.command<10){
    toast("امتیاز فرماندهی کافی نیست","bad");
    return;
  }

  state.command-=10;
  state.statistics.wars++;
  state.wars.push({
    id:"WAR-"+Date.now(),
    enemy:id,
    status:"war",
    score:0,
    control:0,
    enemyDefense:100,
    enemyInfrastructure:100,
    enemyMorale:100,
    ourMorale:100,
    days:0
  });
  setRelation(id,-100);
  addNews("⚔️ آغاز جنگ",`جنگ با ${country(id)?.name||id} آغاز شد.`,"military");
  saveGame();
  renderAll();
  openWarCenter();
}

function getWar(id){
  return state.wars.find(w=>w.id===id)||null;
}
function groundOperation(id){
  const w=getWar(id);
  if(!w)return;
  if(state.command<5||state.energy<2||state.food<1){
    toast("منابع عملیات کافی نیست","bad");
    return;
  }
  state.command-=5;
  state.energy-=2;
  state.food-=1;

  const our=calculatePlayerWarPower()+categoryPower("tank")*.02+categoryPower("artillery")*.018;
  const enemy=calculateEnemyPower(w.enemy)+w.enemyDefense*.35;
  const result=(our-enemy+Math.random()*60-30)/22;

  w.score+=result;
  w.control=clamp(w.control+Math.max(-2,result*.6),0,100);
  w.enemyDefense=clamp(w.enemyDefense-Math.max(.5,result*.35+1),0,100);
  w.enemyMorale=clamp(w.enemyMorale-Math.max(.3,result*.25+1),0,100);
  w.days++;
  state.warExhaustion+=.7;

  if(w.control>=100||w.enemyMorale<=0||w.enemyDefense<=0){
    conquerCountry(w);
  }else{
    toast(result>0?"✅ پیشروی زمینی موفق بود":"⚠️ پیشروی متوقف شد",result>0?"good":"warn");
  }

  saveGame();
  renderAll();
  openWarCenter();
}

function airOperation(id){
  const w=getWar(id);
  if(!w)return;
  if(state.command<7||state.energy<3||state.oil<2){
    toast("منابع عملیات هوایی کافی نیست","bad");
    return;
  }
  state.command-=7;
  state.energy-=3;
  state.oil-=2;

  const air=categoryPower("fighter")+categoryPower("bomber")+categoryPower("drone");
  const our=calculatePlayerWarPower()+air*.022;
  const enemy=calculateEnemyPower(w.enemy)+w.enemyDefense*.28;
  const result=(our-enemy+Math.random()*55-25)/24;

  w.score+=result;
  w.enemyDefense=clamp(w.enemyDefense-Math.max(.4,result*.42+1),0,100);
  w.enemyInfrastructure=clamp(w.enemyInfrastructure-Math.max(.2,result*.32+.8),0,100);
  w.enemyMorale=clamp(w.enemyMorale-Math.max(.2,result*.2+.5),0,100);
  state.warExhaustion+=.5;

  if(w.enemyDefense<=0||w.enemyMorale<=0){
    w.control=clamp(w.control+8,0,100);
  }

  saveGame();
  renderAll();
  openWarCenter();
}

function countryCenter(id){
  const c=country(id);
  if(!c)return{x:50,y:50};
  return{
    x:c.x+c.w/2,
    y:c.y+c.h/2
  };
}

function launchMissile(warId,name){
  const w=getWar(warId);
  const missile=findEquipment(name);
  if(!w||!missile)return;
  if(!(state.inventory[name]>0)){
    toast("موشک موجود نیست","bad");
    return;
  }
  if(state.command<4||state.energy<1){
    toast("منابع شلیک کافی نیست","bad");
    return;
  }

  state.inventory[name]--;
  state.command-=4;
  state.energy-=1;
  state.statistics.launches++;

  closeModal();

  const start=countryCenter(state.player);
  const end=countryCenter(w.enemy);

  animateProjectile(start,end,()=>{
    const enemy=country(w.enemy);
    const interceptionChance=clamp(
      enemy.military*.25+
      enemy.stability*.12+
      Math.random()*18,
      8,
      70
    );

    const intercepted=Math.random()*100<interceptionChance;

    if(intercepted){
      state.statistics.interceptions++;
      animateIntercept(end,()=>{
        explosionAt(end.x,end.y);
        toast("🛡️ موشک رهگیری شد","warn");
      });
    }else{
      explosionAt(end.x,end.y);
      const damage=missile.power*(.18+Math.random()*.14);
      w.enemyDefense=clamp(w.enemyDefense-damage*.34,0,100);
      w.enemyInfrastructure=clamp(w.enemyInfrastructure-damage*.42,0,100);
      w.enemyMorale=clamp(w.enemyMorale-damage*.24,0,100);
      w.score+=damage*.10;
      toast("💥 برخورد ثبت شد","good");

      if(w.enemyDefense<=0||w.enemyMorale<=0){
        w.control=clamp(w.control+10,0,100);
      }
    }

    addNews("🚀 حمله موشکی",`${name} در جنگ با ${country(w.enemy)?.name||w.enemy} استفاده شد.`,"military");
    saveGame();
    renderAll();
  });
}

function animateProjectile(start,end,done){
  const fx=$("fx");
  const p=document.createElement("div");
  p.className="projectile";
  fx.appendChild(p);

  const startTime=performance.now();
  const duration=1200;
  const arc=18;

  function frame(now){
    const t=clamp((now-startTime)/duration,0,1);
    const ease=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const x=start.x+(end.x-start.x)*ease;
    const linearY=start.y+(end.y-start.y)*ease;
    const y=linearY-Math.sin(Math.PI*t)*arc;
    p.style.left=x+"%";
    p.style.top=y+"%";

    if(t<1){
      requestAnimationFrame(frame);
    }else{
      p.remove();
      done&&done();
    }
  }
  requestAnimationFrame(frame);
}

function animateIntercept(end,done){
  const fx=$("fx");
  const p=document.createElement("div");
  p.className="intercept";
  fx.appendChild(p);

  const start={x:end.x-7,y:end.y+10};
  const startTime=performance.now();
  const duration=480;

  function frame(now){
    const t=clamp((now-startTime)/duration,0,1);
    p.style.left=(start.x+(end.x-start.x)*t)+"%";
    p.style.top=(start.y+(end.y-start.y)*t)+"%";

    if(t<1){
      requestAnimationFrame(frame);
    }else{
      p.remove();
      done&&done();
    }
  }
  requestAnimationFrame(frame);
}

function explosionAt(x,y){
  const e=document.createElement("div");
  e.className="explosion";
  e.style.left=x+"%";
  e.style.top=y+"%";
  $("fx").appendChild(e);
  setTimeout(()=>e.remove(),900);
}

function conquerCountry(w){
  if(state.territories.includes(w.enemy))return;

  state.territories.push(w.enemy);
  initializeTerritory(w.enemy,false);
  const t=state.territoryData[w.enemy];
  t.control=62;
  t.loyalty=42;
  t.unrest=38;
  t.stability=45;
  t.infrastructure=Math.max(28,w.enemyInfrastructure*.65);
  t.defense=35;

  w.status="won";
  state.statistics.wins++;
  state.statistics.territoriesTaken++;
  state.money+=1800;
  state.reputation+=2;
  state.influence+=3;
  state.warExhaustion=Math.max(0,state.warExhaustion-3);

  addNews("🏆 تصرف کشور",`${country(w.enemy)?.name||w.enemy} به قلمرو شما اضافه شد.`,"military");
  toast(`🏆 ${country(w.enemy)?.name||w.enemy} تصرف شد`,"good");
}

function peaceWar(id){
  const w=getWar(id);
  if(!w)return;
  w.status="peace";
  state.reputation+=1;
  state.warExhaustion=Math.max(0,state.warExhaustion-2);
  changeRelation(w.enemy,10);
  addNews("🕊️ صلح",`جنگ با ${country(w.enemy)?.name||w.enemy} پایان یافت.`,"diplomacy");
  saveGame();
  renderAll();
  openWarCenter();
}

function stabilizeTerritory(id){
  const t=state.territoryData[id];
  if(!t)return;
  if(state.money<900){
    toast("بودجه کافی نیست","bad");
    return;
  }
  state.money-=900;
  t.control=clamp(t.control+8,0,100);
  t.loyalty=clamp(t.loyalty+7,0,100);
  t.unrest=clamp(t.unrest-8,0,100);
  t.stability=clamp(t.stability+6,0,100);
  state.reputation+=.5;
  saveGame();
  renderAll();
  openCountryPanel(id);
}
function investTerritory(id){
  const t=state.territoryData[id];
  if(!t)return;
  if(state.money<1200){
    toast("بودجه کافی نیست","bad");
    return;
  }
  state.money-=1200;
  t.infrastructure=clamp(t.infrastructure+9,0,100);
  t.localIndustry+=5;
  t.loyalty=clamp(t.loyalty+3,0,100);
  t.unrest=clamp(t.unrest-3,0,100);
  state.industry+=1;
  saveGame();
  renderAll();
  openCountryPanel(id);
}
function taxTerritory(id){
  const t=state.territoryData[id];
  if(!t)return;
  const income=Math.round(180+t.localIndustry*15+t.control*4);
  state.money+=income;
  t.loyalty=clamp(t.loyalty-2,0,100);
  t.unrest=clamp(t.unrest+3,0,100);
  toast(`💰 ${money(income)} دریافت شد`,"good");
  saveGame();
  renderAll();
  openCountryPanel(id);
}

function openTerritories(){
  openModal("🗺️ قلمروهای شما",`
    <div class="kpis">
      <div class="kpi"><small>تعداد قلمرو</small><b>${state.territories.length}</b></div>
      <div class="kpi"><small>مالیات تقریبی</small><b>${money(calculateTerritoryIncome())}</b></div>
    </div>
    <div class="grid">
      ${state.territories.map(id=>{
        const c=country(id);
        const t=state.territoryData[id];
        return `
          <div class="card">
            <div class="cardHead">
              <div class="icon">${c?.flag||"🏳️"}</div>
              <div>
                <div class="title">${esc(c?.name||id)}</div>
                <div class="sub">${id===state.player?"کشور اصلی":"قلمرو فتح‌شده"}</div>
              </div>
            </div>
            <div class="desc">
              کنترل ${Math.round(t?.control||100)}%<br>
              وفاداری ${Math.round(t?.loyalty||100)}%<br>
              ناآرامی ${Math.round(t?.unrest||0)}%<br>
              زیرساخت ${Math.round(t?.infrastructure||50)}
            </div>
            <button class="btn blue" onclick="openCountryPanel('${id}')">مدیریت</button>
          </div>
        `;
      }).join("")}
    </div>
  `);
}

function calculateTerritoryIncome(){
  let total=0;
  state.territories.forEach(id=>{
    const t=state.territoryData[id];
    if(!t)return;
    total+=(t.localIndustry*.35+t.control*.08+t.infrastructure*.05);
  });
  return total;
}

function openEconomy(){
  openModal("💰 اقتصاد و توسعه",`
    <div class="kpis">
      <div class="kpi"><small>صنعت</small><b>${Math.round(state.industry)}</b></div>
      <div class="kpi"><small>مالیات</small><b>${state.taxRate}%</b></div>
      <div class="kpi"><small>درآمد قلمرو</small><b>${money(calculateTerritoryIncome())}</b></div>
      <div class="kpi"><small>خزانه</small><b>${money(state.money)}</b></div>
    </div>
    <div class="grid">
      ${BUILDINGS.map(b=>{
        const level=state.buildings[b.id]||0;
        const cost=Math.round(b.cost*Math.pow(1.18,level));
        return `
          <div class="card">
            <div class="cardHead">
              <div class="icon">${b.icon}</div>
              <div>
                <div class="title">${b.name}</div>
                <div class="sub">سطح ${level}</div>
              </div>
            </div>
            <div class="desc">
              هزینه ${money(cost)}<br>
              صنعت ${b.industry>=0?"+":""}${b.industry}<br>
              انرژی ${b.energy>=0?"+":""}${b.energy}<br>
              غذا ${b.food>=0?"+":""}${b.food}<br>
              ثبات ${b.stability>=0?"+":""}${b.stability}
            </div>
            <button class="btn green" onclick="buildStructure('${b.id}')">ساخت / ارتقا</button>
          </div>
        `;
      }).join("")}
    </div>
  `);
}

function buildStructure(id){
  const b=BUILDINGS.find(x=>x.id===id);
  if(!b)return;
  const level=state.buildings[id]||0;
  const cost=Math.round(b.cost*Math.pow(1.18,level));
  if(state.money<cost){
    toast("بودجه کافی نیست","bad");
    return;
  }
  state.money-=cost;
  state.buildings[id]=level+1;
  state.food+=b.food;
  state.industry+=b.industry;
  state.energy+=b.energy;
  state.stability+=b.stability;
  if(id==="university")state.research+=7;
  if(id==="defense")state.missileDefense+=8;
  addNews("🏗️ توسعه ملی",`${b.name} توسعه یافت.`,"economy");
  saveGame();
  renderAll();
  openEconomy();
}

function openGovernment(){
  openModal("🏛️ دولت و سیاست داخلی",`
    <div class="kpis">
      <div class="kpi"><small>رضایت</small><b>${Math.round(state.approval)}%</b></div>
      <div class="kpi"><small>ثبات</small><b>${Math.round(state.stability)}%</b></div>
      <div class="kpi"><small>مالیات</small><b>${state.taxRate}%</b></div>
      <div class="kpi"><small>اعتبار</small><b>${Math.round(state.reputation)}</b></div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="title">❤️ برنامه رفاهی</div>
        <div class="desc">افزایش رضایت و ثبات داخلی.</div>
        <button class="btn green" onclick="governmentAction('welfare')">اجرا</button>
      </div>
      <div class="card">
        <div class="title">🏭 برنامه تولید ملی</div>
        <div class="desc">تقویت صنعت با سرمایه‌گذاری دولتی.</div>
        <button class="btn blue" onclick="governmentAction('industry')">اجرا</button>
      </div>
      <div class="card">
        <div class="title">🛡️ امنیت داخلی</div>
        <div class="desc">کاهش ناآرامی در قلمروها.</div>
        <button class="btn purple" onclick="governmentAction('security')">اجرا</button>
      </div>
      <div class="card">
        <div class="title">💰 اصلاح مالیاتی</div>
        <div class="desc">کاهش فشار مالیاتی و افزایش محبوبیت.</div>
        <button class="btn orange" onclick="governmentAction('tax')">اجرا</button>
      </div>
    </div>
  `);
}
function governmentAction(type){
  if(state.money<1000){
    toast("بودجه کافی نیست","bad");
    return;
  }
  state.money-=1000;

  if(type==="welfare"){
    state.approval+=7;
    state.stability+=3;
  }
  if(type==="industry"){
    state.industry+=7;
    state.energy-=2;
  }
  if(type==="security"){
    state.stability+=4;
    state.territories.forEach(id=>{
      const t=state.territoryData[id];
      if(t){
        t.unrest=clamp(t.unrest-5,0,100);
        t.control=clamp(t.control+3,0,100);
      }
    });
  }
  if(type==="tax"){
    state.taxRate=Math.max(5,state.taxRate-3);
    state.approval+=4;
  }

  normalizeState();
  saveGame();
  renderAll();
  openGovernment();
}

function diplomaticAction(id,amount,cost){
  if(id===state.player)return;
  if(state.money<cost){
    toast("بودجه کافی نیست","bad");
    return;
  }
  state.money-=cost;
  changeRelation(id,amount);
  state.reputation+=.5;
  state.influence+=.4;
  addNews("🤝 دیپلماسی",`روابط با ${country(id)?.name||id} بهبود یافت.`,"diplomacy");
  saveGame();
  renderAll();
  openDiplomacy();
}
function tradeDeal(id){
  if(relation(id)<-20){
    toast("روابط برای تجارت مناسب نیست","warn");
    return;
  }
  if(state.money<700){
    toast("بودجه کافی نیست","bad");
    return;
  }
  state.money-=700;
  changeRelation(id,6);
  state.industry+=2;
  state.money+=300;
  state.treaties.push({
    id:"T-"+Date.now(),
    country:id,
    type:"trade",
    days:90
  });
  addNews("💹 توافق تجاری",`توافق تجاری با ${country(id)?.name||id} امضا شد.`,"diplomacy");
  saveGame();
  renderAll();
  openDiplomacy();
}
function allianceOffer(id){
  if(relation(id)<60){
    toast("رابطه برای اتحاد باید حداقل ۶۰ باشد","warn");
    return;
  }
  if(state.money<1400){
    toast("بودجه کافی نیست","bad");
    return;
  }
  if(state.alliances.some(a=>a.country===id)){
    toast("این کشور متحد شماست","warn");
    return;
  }
  state.money-=1400;
  state.alliances.push({country:id});
  state.influence+=4;
  state.reputation+=2;
  changeRelation(id,12);
  addNews("🤝 اتحاد",`با ${country(id)?.name||id} اتحاد ایجاد شد.`,"diplomacy");
  saveGame();
  renderAll();
  openDiplomacy();
}

function openDiplomacy(){
  openModal("🤝 دیپلماسی",`
    <div class="kpis">
      <div class="kpi"><small>اعتبار</small><b>${Math.round(state.reputation)}</b></div>
      <div class="kpi"><small>نفوذ</small><b>${Math.round(state.influence)}</b></div>
      <div class="kpi"><small>اتحادها</small><b>${state.alliances.length}</b></div>
      <div class="kpi"><small>پیمان‌ها</small><b>${state.treaties.length}</b></div>
    </div>
    <div class="grid">
      ${COUNTRY_DATA.filter(c=>c.id!==state.player&&!state.territories.includes(c.id)).map(c=>{
        const r=Math.round(relation(c.id));
        return `
          <div class="card">
            <div class="cardHead">
              <div class="icon">${c.flag}</div>
              <div>
                <div class="title">${esc(c.name)}</div>
                <div class="sub">روابط ${r}</div>
              </div>
            </div>
            <div class="progress"><div style="width:${clamp((r+100)/2,0,100)}%"></div></div>
            <div class="row">
              <button class="btn green" onclick="diplomaticAction('${c.id}',7,300)">مذاکره</button>
              <button class="btn blue" onclick="tradeDeal('${c.id}')">تجارت</button>
              <button class="btn purple" onclick="allianceOffer('${c.id}')">اتحاد</button>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `);
}

function openTechnology(){
  openModal("🧠 فناوری و پژوهش",`
    <div class="kpis">
      <div class="kpi"><small>فناوری</small><b>${Math.round(state.technology)}</b></div>
      <div class="kpi"><small>تحقیق</small><b>${Math.round(state.research)}</b></div>
      <div class="kpi"><small>صنعت</small><b>${Math.round(state.industry)}</b></div>
    </div>
    <div class="grid">
      ${TECH_TREE.map(t=>{
        const level=state.technologies[t.id]||0;
        const cost=Math.round(t.cost*Math.pow(1.22,level));
        return `
          <div class="card">
            <div class="cardHead">
              <div class="icon">${t.icon}</div>
              <div>
                <div class="title">${t.name}</div>
                <div class="sub">سطح ${level}</div>
              </div>
            </div>
            <div class="desc">
              هزینه ${money(cost)}<br>
              فناوری +${t.tech}<br>
              صنعت +${t.industry}<br>
              نظامی +${t.military}
            </div>
            <button class="btn purple" onclick="researchTechnology('${t.id}')">تحقیق</button>
          </div>
        `;
      }).join("")}
    </div>
  `);
}
function researchTechnology(id){
  const t=TECH_TREE.find(x=>x.id===id);
  if(!t)return;
  const level=state.technologies[id]||0;
  const cost=Math.round(t.cost*Math.pow(1.22,level));
  if(state.money<cost){
    toast("بودجه کافی نیست","bad");
    return;
  }
  if(state.research<8){
    toast("امتیاز تحقیق کافی نیست","warn");
    return;
  }
  state.money-=cost;
  state.research-=8;
  state.technologies[id]=level+1;
  state.technology+=t.tech;
  state.industry+=t.industry;
  state.military+=t.military;
  if(id==="radar")state.missileDefense+=5;
  addNews("🧠 فناوری",`${t.name} به سطح ${level+1} رسید.`,"science");
  saveGame();
  renderAll();
  openTechnology();
}

function openNews(){
  openModal("📰 اخبار",`
    <div class="grid">
      ${state.news.slice(0,100).map(n=>`
        <div class="card">
          <div class="sub">${n.year}/${n.month}/${n.day} • ${esc(n.type)}</div>
          <div class="title">${esc(n.title)}</div>
          <div class="desc">${esc(n.text)}</div>
        </div>
      `).join("")||`<div class="card">هنوز خبری ثبت نشده است.</div>`}
    </div>
  `);
}

function processEconomy(){
  let income=state.industry*4.2;
  income+=state.population*1.1;
  income+=calculateTerritoryIncome();
  income*=1+(state.taxRate/100);

  const maintenance=EQUIPMENT.reduce((sum,item)=>{
    return sum+(state.inventory[item.name]||0)*item.maintenance;
  },0);

  income-=maintenance*.18;
  state.money+=Math.max(20,income);
  state.treasuryIncome=income;

  state.food+=8+(state.buildings.farm||0)*9-state.population*.012;
  state.energy+=6+(state.buildings.power||0)*9-state.industry*.035;
  state.oil+=4+(state.buildings.oil||0)*6;
  state.industry+=.03+(state.buildings.factory||0)*.015;
  state.research+=.05+(state.buildings.university||0)*.08;
  state.command=clamp(state.command+.65,0,200);

  const taxPressure=Math.max(0,state.taxRate-15)*.012;
  state.approval-=taxPressure;

  if(state.food<20){
    state.approval-=.08;
    state.stability-=.04;
  }
  if(state.energy<20){
    state.industry-=.03;
  }
}

function processTerritories(){
  state.territories.forEach(id=>{
    const t=state.territoryData[id];
    if(!t)return;

    if(id!==state.player){
      t.control=clamp(
        t.control+
        (t.loyalty-45)*.002+
        (state.stability-50)*.0015-
        t.unrest*.0015,
        0,100
      );

      t.loyalty=clamp(
        t.loyalty+
        (t.infrastructure-40)*.001+
        (state.approval-50)*.001-
        state.taxRate*.0008,
        0,100
      );

      t.unrest=clamp(
        t.unrest+
        (50-t.loyalty)*.002+
        (45-t.stability)*.0015-
        t.infrastructure*.0005,
        0,100
      );

      if(t.unrest>80&&Math.random()<.02){
        t.control-=8;
        addNews("⚠️ شورش محلی",`ناآرامی در ${country(id)?.name||id} افزایش یافت.`,"territory");
      }

      if(t.control<=0){
        loseTerritory(id);
      }
    }
  });
}

function loseTerritory(id){
  if(id===state.player)return;
  state.territories=state.territories.filter(x=>x!==id);
  delete state.territoryData[id];
  state.statistics.losses++;
  state.reputation-=2;
  addNews("🏳️ از دست رفتن قلمرو",`${country(id)?.name||id} از کنترل شما خارج شد.`,"territory");
}

function processWars(){
  state.wars.filter(w=>w.status==="war").forEach(w=>{
    w.days++;
    state.warExhaustion+=.04;
    w.enemyMorale=clamp(w.enemyMorale-.015,0,100);
  });
}

function processTreaties(){
  state.treaties.forEach(t=>{
    t.days--;
    if(t.type==="trade"){
      state.money+=22;
      state.industry+=.005;
    }
  });
  state.treaties=state.treaties.filter(t=>t.days>0);
}

function randomEvent(){
  const events=[
    {
      title:"📈 رونق بازار",
      text:"تقاضای داخلی و صادرات افزایش یافت.",
      run(){state.money+=800;state.industry+=1.5;}
    },
    {
      title:"⚡ فشار انرژی",
      text:"مصرف انرژی بیشتر از انتظار بود.",
      run(){state.energy=Math.max(0,state.energy-15);}
    },
    {
      title:"🌾 برداشت خوب",
      text:"تولید غذایی افزایش پیدا کرد.",
      run(){state.food+=22;state.approval+=1;}
    },
    {
      title:"🎓 موفقیت علمی",
      text:"یک پروژه پژوهشی نتیجه مثبت داد.",
      run(){state.research+=6;state.technology+=1;}
    },
    {
      title:"🌐 نشست سیاسی",
      text:"اعتبار بین‌المللی کمی افزایش یافت.",
      run(){state.reputation+=1.5;state.influence+=1;}
    },
    {
      title:"📉 شوک اقتصادی",
      text:"بخشی از بازار با افت تقاضا مواجه شد.",
      run(){state.money=Math.max(0,state.money-600);state.approval-=1;}
    }
  ];
  const e=events[Math.floor(Math.random()*events.length)];
  e.run();
  addNews(e.title,e.text,"world");
}

function nextDay(){
  if(!state.started)return;

  state.day++;
  if(state.day>30){
    state.day=1;
    state.month++;
    if(state.month>12){
      state.month=1;
      state.year++;
      addNews("📅 سال جدید",`سال ${state.year} آغاز شد.`,"world");
    }
  }

  processEconomy();
  processTerritories();
  processWars();
  processTreaties();

  state.population+=state.population*.00008;
  state.warExhaustion=Math.max(0,state.warExhaustion-.03);
  state.stability=clamp(state.stability,0,100);
  state.approval=clamp(state.approval,0,100);
  state.reputation=clamp(state.reputation,0,100);
  state.influence=clamp(state.influence,0,100);

  if(state.day%7===0)randomEvent();

  normalizeState();
  saveGame();
  renderAll();
}

function boot(){
  renderCountryChoices();

  if(loadGame()&&state.started&&state.player){
    $("startScreen").style.display="none";
    renderAll();
    toast("💾 بازی ذخیره‌شده بارگذاری شد","good");
  }
}

window.startGame=startGame;
window.renderCountryChoices=renderCountryChoices;
window.openCountryPanel=openCountryPanel;
window.openCountryOverview=openCountryOverview;
window.openStore=openStore;

window.taxTerritory=taxTerritory;
window.openTerritories=openTerritories;
window.openEconomy=openEconomy;
window.buildStructure=buildStructure;

window.governmentAction=governmentAction;
window.diplomaticAction=diplomaticAction;

window.allianceOffer=allianceOffer;

window.openTechnology=openTechnology;
window.researchTechnology=researchTechnology;

window.setMapMode=setMapMode;
window.zoomMap=zoomMap;
window.toggleSide=toggleSide;
window.closeModal=closeModal;

boot();
</script>
