<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>World Empire</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061522;color:#fff;font-family:Tahoma,Arial,sans-serif}
button{font-family:inherit;border:0;cursor:pointer}

#app{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
 background:#061522;
}

#top{
 height:86px;
 min-height:86px;
 background:#0a1e2d;
 border-bottom:1px solid #23465d;
 display:flex;
 align-items:center;
 gap:7px;
 padding:7px;
 overflow-x:auto;
}

.title{
 min-width:120px;
 font-size:18px;
 font-weight:bold;
 text-align:center;
}

.stat{
 min-width:100px;
 height:65px;
 background:#102c40;
 border:1px solid #234b63;
 border-radius:12px;
 padding:7px;
 text-align:center;
}

.stat b{
 display:block;
 color:#8bdcff;
 font-size:13px;
 margin-bottom:7px;
}

.stat span{
 font-size:17px;
 font-weight:bold;
}

#mapBox{
 position:relative;
 flex:1;
 min-height:0;
 overflow:hidden;
 background:
 radial-gradient(circle at center,#0d3047 0,#061722 65%,#03101a 100%);
}

#map{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 touch-action:none;
}

#loading{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 background:rgba(3,17,27,.92);
 border:1px solid #2b607e;
 border-radius:14px;
 padding:18px 24px;
 text-align:center;
 z-index:5;
}

#loading small{
 display:block;
 margin-top:8px;
 color:#8db7ca;
}

#countryInfo{
 position:absolute;
 top:12px;
 right:12px;
 min-width:170px;
 max-width:230px;
 background:rgba(6,23,34,.93);
 border:1px solid #315a70;
 border-radius:13px;
 padding:12px;
 z-index:4;
 display:none;
}

#countryInfo b{
 color:#65d7ff;
 display:block;
 margin-bottom:7px;
}

.mapButtons{
 position:absolute;
 left:10px;
 top:10px;
 z-index:4;
 display:flex;
 flex-direction:column;
 gap:6px;
}

.mapButtons button{
 width:42px;
 height:42px;
 border-radius:10px;
 background:#1179a9;
 color:#fff;
 font-size:20px;
}

#bottom{
 height:78px;
 min-height:78px;
 background:#0a1d2c;
 border-top:1px solid #23465d;
 display:flex;
 justify-content:space-around;
 align-items:center;
 padding:5px;
}

.nav{
 width:18%;
 min-width:60px;
 height:62px;
 background:#102f44;
 border:1px solid #28536c;
 color:white;
 border-radius:12px;
 font-size:12px;
}

.nav div{
 font-size:22px;
 margin-bottom:3px;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.68);
 display:none;
 align-items:flex-end;
 justify-content:center;
 z-index:20;
}

.panel{
 width:100%;
 max-width:620px;
 max-height:88%;
 overflow:auto;
 background:#092131;
 border:1px solid #315d75;
 border-radius:20px 20px 0 0;
 padding:16px;
}

.panel h2{
 margin:3px 0 15px;
 color:#76dcff;
}

.close{
 float:left;
 width:38px;
 height:38px;
 border-radius:9px;
 background:#183b50;
 color:#fff;
 font-size:20px;
}

.item{
 background:#102f43;
 border:1px solid #2a5269;
 border-radius:12px;
 padding:13px;
 margin:8px 0;
}

.item strong{display:block;color:#9ae5ff;margin-bottom:5px}

.buy{
 margin-top:10px;
 width:100%;
 padding:11px;
 border-radius:9px;
 background:#0d83b5;
 color:#fff;
 font-weight:bold;
}

.buy:disabled{
 opacity:.4;
}

.notice{
 padding:10px;
 border-radius:10px;
 background:#0c2b3e;
 color:#9fc1d1;
 font-size:12px;
 margin-bottom:10px;
}
</style>
</head>

<body>

<div id="app">

<header id="top">
 <div class="title">🌍 WORLD EMPIRE</div>

 <div class="stat">
  <b>💰 خزانه</b>
  <span id="money">8856</span>
 </div>

 <div class="stat">
  <b>⚙️ فولاد</b>
  <span id="steel">505</span>
 </div>

 <div class="stat">
  <b>🛢️ نفت</b>
  <span id="oil">509</span>
 </div>

 <div class="stat">
  <b>🌾 غذا</b>
  <span id="food">505</span>
 </div>

 <div class="stat">
  <b>📈 تورم</b>
  <span id="inflation">2.0%</span>
 </div>
</header>

<main id="mapBox">

 <canvas id="map"></canvas>

 <div id="loading">
  🌍 در حال بارگذاری نقشه جهان...
  <small>نقشه 10m</small>
 </div>

 <div id="countryInfo">
  <b id="countryName">کشور</b>
  <div id="countryText">برای انتخاب روی نقشه لمس کنید.</div>
 </div>

 <div class="mapButtons">
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <button id="resetMap">↻</button>
 </div>

</main>

<nav id="bottom">

 <button class="nav" onclick="openPanel('save')">
  <div>💾</div>ذخیره
 </button>

 <button class="nav" onclick="openPanel('diplomacy')">
  <div>🤝</div>دیپلماسی
 </button>

 <button class="nav" onclick="openPanel('army')">
  <div>🛡️</div>ارتش
 </button>

 <button class="nav" onclick="openPanel('economy')">
  <div>📊</div>اقتصاد
 </button>

 <button class="nav" onclick="openPanel('shop')">
  <div>🏪</div>فروشگاه
 </button>

</nav>

</div>

<div id="modal" class="modal">
 <div class="panel">
  <button class="close" onclick="closePanel()">×</button>
  <div id="panelContent"></div>
 </div>
</div>

<script>
"use strict";

/* =========================================================
   WORLD EMPIRE
   نسخه پایدار نقشه
   ========================================================= */

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d", {alpha:false});

let W=0,H=0;
let dpr=1;

let mapData=null;
let countries=[];

let scale=1;
let offsetX=0;
let offsetY=0;

let dragging=false;
let moved=false;
let lastX=0;
let lastY=0;

let selectedCountry=null;

/* وضعیت بازی */
let game={
 money:8856,
 steel:505,
 oil:509,
 food:505,
 inflation:2.0
};

/* -----------------------------
   ذخیره سازی
------------------------------ */

function saveGame(){
 localStorage.setItem("worldEmpireSave",JSON.stringify(game));
}

function loadGame(){
 try{
  const s=localStorage.getItem("worldEmpireSave");
  if(s){
   const x=JSON.parse(s);
   if(x && typeof x==="object"){
    game=Object.assign(game,x);
   }
  }
 }catch(e){}
 updateStats();
}

function updateStats(){
 document.getElementById("money").textContent=Math.floor(game.money);
 document.getElementById("steel").textContent=Math.floor(game.steel);
 document.getElementById("oil").textContent=Math.floor(game.oil);
 document.getElementById("food").textContent=Math.floor(game.food);
 document.getElementById("inflation").textContent=game.inflation.toFixed(1)+"%";
}

/* -----------------------------
   اندازه Canvas
------------------------------ */

function resize(){
 const r=canvas.getBoundingClientRect();

 W=Math.max(1,r.width);
 H=Math.max(1,r.height);

 dpr=Math.min(window.devicePixelRatio||1,1.5);

 canvas.width=Math.floor(W*dpr);
 canvas.height=Math.floor(H*dpr);

 ctx.setTransform(dpr,0,0,dpr,0,0);

 draw();
}

window.addEventListener("resize",resize,{passive:true});

/* -----------------------------
   تبدیل مختصات جغرافیایی
------------------------------ */

function project(lon,lat){

 const x=(lon+180)/360;
 const y=(90-lat)/180;

 return {
  x:x*W,
  y:y*H
 };
}

/* -----------------------------
   رسم یک حلقه GeoJSON
------------------------------ */

function drawRing(ring){

 if(!ring || ring.length<2)return;

 const p0=project(ring[0][0],ring[0][1]);

 ctx.moveTo(
  p0.x*scale+offsetX,
  p0.y*scale+offsetY
 );

 for(let i=1;i<ring.length;i++){

  const p=project(ring[i][0],ring[i][1]);

  ctx.lineTo(
   p.x*scale+offsetX,
   p.y*scale+offsetY
  );
 }

 ctx.closePath();
}

/* -----------------------------
   رسم کشور
------------------------------ */

function drawCountry(country){

 const g=country.geometry;

 if(!g)return;

 ctx.beginPath();

 if(g.type==="Polygon"){

  for(const ring of g.coordinates){
   drawRing(ring);
  }

 }else if(g.type==="MultiPolygon"){

  for(const polygon of g.coordinates){
   for(const ring of polygon){
    drawRing(ring);
   }
  }
 }

 ctx.fill();
 ctx.stroke();
}

/* -----------------------------
   نقشه اصلی
------------------------------ */

function draw(){

 if(!W||!H)return;

 ctx.setTransform(dpr,0,0,dpr,0,0);

 ctx.fillStyle="#061722";
 ctx.fillRect(0,0,W,H);

 /*
  شبکه جغرافیایی
 */
 ctx.lineWidth=0.45;
 ctx.strokeStyle="rgba(69,132,157,.18)";

 for(let lon=-180;lon<=180;lon+=20){

  const a=project(lon,90);
  const b=project(lon,-90);

  ctx.beginPath();

  ctx.moveTo(a.x*scale+offsetX,a.y*scale+offsetY);
  ctx.lineTo(b.x*scale+offsetX,b.y*scale+offsetY);

  ctx.stroke();
 }

 for(let lat=-60;lat<=80;lat+=20){

  const a=project(-180,lat);
  const b=project(180,lat);

  ctx.beginPath();

  ctx.moveTo(a.x*scale+offsetX,a.y*scale+offsetY);
  ctx.lineTo(b.x*scale+offsetX,b.y*scale+offsetY);

  ctx.stroke();
 }

 if(!countries.length){
  drawFallbackWorld();
  return;
 }

 for(const c of countries){

  const name=getCountryName(c);

  ctx.fillStyle=
   c===selectedCountry
   ? "#1ba7d1"
   : "#27546a";

  ctx.strokeStyle=
   c===selectedCountry
   ? "#a9efff"
   : "#123646";

  ctx.lineWidth=
   c===selectedCountry ? 1.5 : .7;

  drawCountry(c);
 }

}

/* -----------------------------
   نقشه پشتیبان
   اگر اینترنت/GeoJSON خراب شد
------------------------------ */

function drawFallbackWorld(){

 ctx.fillStyle="#20495d";
 ctx.strokeStyle="#3c7188";
 ctx.lineWidth=1;

 const shapes=[

  [[-168,72],[-140,70],[-120,55],[-105,50],[-95,35],[-80,25],
   [-88,15],[-105,20],[-120,30],[-135,45],[-155,50]],

  [[-82,12],[-65,8],[-55,-5],[-52,-20],[-62,-35],[-70,-55],
   [-80,-45],[-78,-20],[-88,-5]],

  [[-60,80],[-30,80],[-20,65],[-40,55],[-55,65]],

  [[-10,70],[25,70],[45,55],[60,45],[50,30],[40,15],
   [30,5],[20,-5],[10,-25],[5,-35],[-10,-20],[-20,0],
   [-15,20],[-30,35],[-20,50]],

  [[30,65],[70,70],[110,65],[150,55],[170,45],[150,30],
   [125,20],[110,5],[90,10],[75,25],[55,25],[45,40],[30,50]],

  [[110,-10],[150,-10],[155,-30],[140,-45],[120,-40],
   [110,-25]],

  [[135,-5],[160,-5],[170,-20],[150,-20]],

  [[-180,-70],[180,-70],[180,-90],[-180,-90]]
 ];

 for(const shape of shapes){

  ctx.beginPath();

  shape.forEach((p,i)=>{

   const q=project(p[0],p[1]);

   if(i===0)
    ctx.moveTo(q.x*scale+offsetX,q.y*scale+offsetY);
   else
    ctx.lineTo(q.x*scale+offsetX,q.y*scale+offsetY);

  });

  ctx.closePath();
  ctx.fill();
  ctx.stroke();
 }
}

/* -----------------------------
   نام کشور
------------------------------ */

function getCountryName(c){

 const p=c.properties||{};

 return p.NAME_FA ||
        p.NAME ||
        p.ADMIN ||
        p.SOVEREIGNT ||
        "کشور ناشناس";
}

/* -----------------------------
   بارگذاری 10m
------------------------------ */

async function loadWorld(){

 const loading=document.getElementById("loading");

 const url=
 "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries_iso.geojson";

 try{

  const response=await fetch(url,{
   method:"GET",
   cache:"force-cache"
  });

  if(!response.ok)
   throw new Error("map download failed");

  mapData=await response.json();

  if(!mapData.features)
   throw new Error("invalid geojson");

  countries=mapData.features;

  loading.style.display="none";

  draw();

 }catch(error){

  console.log("10m map error:",error);

  loading.innerHTML=
   "🌍 نقشه پایه فعال شد"+
   "<small>برای دریافت نقشه جزئی‌تر، اتصال اینترنت را بررسی کنید.</small>";

  setTimeout(()=>{
   loading.style.display="none";
  },1200);

  drawFallbackWorld();
 }
}

/* -----------------------------
   پیدا کردن کشور با کلیک
------------------------------ */

function pointInPolygon(point,polygon){

 let x=point.x;
 let y=point.y;
 let inside=false;

 for(
  let i=0,j=polygon.length-1;
  i<polygon.length;
  j=i++
 ){

  const xi=polygon[i][0];
  const yi=polygon[i][1];

  const xj=polygon[j][0];
  const yj=polygon[j][1];

  const intersect=
   ((yi>y)!==(yj>y)) &&
   (x<(xj-xi)*(y-yi)/(yj-yi)+xi);

  if(intersect)inside=!inside;
 }

 return inside;
}

function geoHit(country,lon,lat){

 const g=country.geometry;

 if(!g)return false;

 if(g.type==="Polygon"){

  return pointInPolygon(
   {x:lon,y:lat},
   g.coordinates[0]
  );

 }

 if(g.type==="MultiPolygon"){

  for(const poly of g.coordinates){

   if(pointInPolygon(
    {x:lon,y:lat},
    poly[0]
   ))return true;

  }
 }

 return false;
}

function screenToGeo(x,y){

 return {
  lon:((x-offsetX)/scale/W)*360-180,
  lat:90-((y-offsetY)/scale/H)*180
 };
}

function selectCountryAt(x,y){

 if(!countries.length)return;

 const geo=screenToGeo(x,y);

 for(let i=countries.length-1;i>=0;i--){

  if(geoHit(countries[i],geo.lon,geo.lat)){

   selectedCountry=countries[i];

   const name=getCountryName(selectedCountry);

   document.getElementById("countryInfo").style.display="block";

   document.getElementById("countryName").textContent=
    "🌍 "+name;

   document.getElementById("countryText").innerHTML=
    "برای شروع مدیریت این کشور انتخاب شده است.<br><br>"+
    "🗺️ موقعیت: "+
    geo.lon.toFixed(1)+"° ، "+
    geo.lat.toFixed(1)+"°";

   draw();
   return;
  }
 }
}

/* -----------------------------
   لمس / موس
------------------------------ */

canvas.addEventListener("pointerdown",e=>{

 dragging=true;
 moved=false;

 lastX=e.clientX;
 lastY=e.clientY;

 canvas.setPointerCapture(e.pointerId);

});

canvas.addEventListener("pointermove",e=>{

 if(!dragging)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 if(Math.abs(dx)+Math.abs(dy)>3)
  moved=true;

 offsetX+=dx;
 offsetY+=dy;

 lastX=e.clientX;
 lastY=e.clientY;

 draw();
});

canvas.addEventListener("pointerup",e=>{

 if(!moved)
  selectCountryAt(
   e.clientX-canvas.getBoundingClientRect().left,
   e.clientY-canvas.getBoundingClientRect().top
  );

 dragging=false;
});

canvas.addEventListener("wheel",e=>{

 e.preventDefault();

 const rect=canvas.getBoundingClientRect();

 const mx=e.clientX-rect.left;
 const my=e.clientY-rect.top;

 const old=scale;

 scale+=e.deltaY<0?.15:-.15;

 scale=Math.max(.7,Math.min(4,scale));

 offsetX=mx-(mx-offsetX)*(scale/old);
 offsetY=my-(my-offsetY)*(scale/old);

 draw();

},{passive:false});

/* -----------------------------
   دکمه‌های نقشه
------------------------------ */

document.getElementById("zoomIn").onclick=()=>{
 scale=Math.min(4,scale+.3);
 draw();
};

document.getElementById("zoomOut").onclick=()=>{
 scale=Math.max(.7,scale-.3);
 draw();
};

document.getElementById("resetMap").onclick=()=>{
 scale=1;
 offsetX=0;
 offsetY=0;
 draw();
};

/* -----------------------------
   پنل‌ها
------------------------------ */

function openPanel(type){

 const modal=document.getElementById("modal");
 const content=document.getElementById("panelContent");

 if(type==="shop"){

  content.innerHTML=`
   <h2>🏪 فروشگاه ملی</h2>

   <div class="notice">
   قیمت‌ها با تورم تغییر می‌کنند و خریدهای بزرگ
   فشار بیشتری به اقتصاد وارد می‌کنند.
   </div>

   <div class="item">
    <strong>🏭 کارخانه فولاد</strong>
    افزایش تولید فولاد
    <button class="buy" onclick="buyItem('steel')">
     خرید — 1200 💰
    </button>
   </div>

   <div class="item">
    <strong>🛢️ پالایشگاه</strong>
    افزایش تولید نفت
    <button class="buy" onclick="buyItem('oil')">
     خرید — 1500 💰
    </button>
   </div>

   <div class="item">
    <strong>🌾 مجتمع کشاورزی</strong>
    افزایش تولید غذا
    <button class="buy" onclick="buyItem('food')">
     خرید — 900 💰
    </button>
   </div>

   <div class="item">
    <strong>🏗️ زیرساخت حمل‌ونقل</strong>
    رشد اقتصاد و کاهش هزینه تجارت
    <button class="buy" onclick="buyItem('infra')">
     ساخت — 1800 💰
    </button>
   </div>
  `;

 }

 if(type==="economy"){

  content.innerHTML=`
   <h2>📊 اقتصاد</h2>

   <div class="item">
    💰 خزانه: ${Math.floor(game.money)}
   </div>

   <div class="item">
    📈 تورم: ${game.inflation.toFixed(1)}%
   </div>

   <div class="item">
    ⚙️ فولاد: ${Math.floor(game.steel)}
   </div>

   <div class="item">
    🛢️ نفت: ${Math.floor(game.oil)}
   </div>

   <div class="item">
    🌾 غذا: ${Math.floor(game.food)}
   </div>
  `;
 }

 if(type==="diplomacy"){

  content.innerHTML=`
   <h2>🤝 دیپلماسی</h2>

   <div class="notice">
   در نسخه بعدی می‌توانیم سیستم کامل کشورها،
   روابط، پیمان‌ها و بازار جهانی را به همین بخش اضافه کنیم.
   </div>

   <div class="item">
    🌐 کشور انتخاب‌شده:
    <strong>
     ${selectedCountry?getCountryName(selectedCountry):"هنوز انتخاب نشده"}
    </strong>
   </div>
  `;
 }

 if(type==="army"){

  content.innerHTML=`
   <h2>🛡️ مدیریت کشور</h2>

   <div class="notice">
   این نسخه تمرکز اصلی را روی نقشه و پایداری گذاشته‌ایم.
   سیستم درگیری منطقه‌ای را می‌توانیم در مرحله بعد به‌صورت
   غیرگرافیکی و مدیریتی اضافه کنیم.
   </div>
  `;
 }

 if(type==="save"){

  saveGame();

  content.innerHTML=`
   <h2>💾 ذخیره بازی</h2>

   <div class="item">
    وضعیت بازی با موفقیت در همین دستگاه ذخیره شد.
   </div>

   <button class="buy" onclick="closePanel()">
    بازگشت به بازی
   </button>
  `;
 }

 modal.style.display="flex";
}

function closePanel(){
 document.getElementById("modal").style.display="none";
}

/* -----------------------------
   خرید
------------------------------ */

function buyItem(type){

 const prices={
  steel:1200,
  oil:1500,
  food:900,
  infra:1800
 };

 const price=prices[type];

 if(game.money<price){
  alert("❌ موجودی خزانه کافی نیست.");
  return;
 }

 game.money-=price;

 if(type==="steel")
  game.steel+=100;

 if(type==="oil")
  game.oil+=100;

 if(type==="food")
  game.food+=100;

 if(type==="infra")
  game.inflation=Math.max(0,game.inflation-.2);

 updateStats();
 saveGame();

 alert("✅ خرید با موفقیت انجام شد.");
}

/* -----------------------------
   اقتصاد پویا
------------------------------ */

let lastEconomicTick=Date.now();

function economicTick(){

 const now=Date.now();

 if(now-lastEconomicTick<5000)return;

 lastEconomicTick=now;

 /*
  تغییر بسیار آهسته برای جلوگیری از
  فشار CPU و تغییرات غیرمنطقی
 */

 const pressure=
  (game.money<3000?0.03:0)+
  (game.food<100?-0.02:0)+
  (game.oil<100?0.01:0);

 game.inflation+=pressure;

 game.inflation+=
  (Math.random()-.5)*.02;

 game.inflation=
  Math.max(0,Math.min(40,game.inflation));

 updateStats();
 saveGame();
}

/*
 فقط یک تایمر اقتصادی سبک.
 هیچ reload یا ساخت مجدد صفحه وجود ندارد.
*/
setInterval(economicTick,5000);

/* -----------------------------
   شروع
------------------------------ */

loadGame();
resize();
loadWorld();

</script>
</body>
      </html>
