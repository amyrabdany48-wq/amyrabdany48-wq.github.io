<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>WORLD EMPIRE — GeoStrategy</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08111d;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

button,input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

#countryScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:
        radial-gradient(circle at 50% 10%,#193c61 0,#0b1727 45%,#03080e 100%);
}

.countryBox{
    width:min(900px,97vw);
    max-height:95vh;
    background:rgba(7,17,29,.97);
    border:1px solid #355d7d;
    border-radius:22px;
    box-shadow:0 25px 90px #000;
    padding:20px;
    display:flex;
    flex-direction:column;
}

.countryTitle{
    text-align:center;
    font-size:30px;
    font-weight:900;
}

.countrySub{
    text-align:center;
    color:#9db7cb;
    margin:5px 0 15px;
}

.countrySearch{
    width:100%;
    padding:13px;
    border-radius:12px;
    outline:none;
    color:white;
    background:#101f31;
    border:1px solid #31516d;
    margin-bottom:10px;
}

.countryGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:8px;
    overflow:auto;
    max-height:58vh;
    padding:3px;
}

.countryBtn{
    background:#0e2135;
    color:white;
    border:1px solid #294a63;
    border-radius:12px;
    padding:10px;
    text-align:right;
}

.countryBtn:hover,
.countryBtn.selected{
    background:#164c73;
    border-color:#63bdf5;
}

.flag{
    font-size:24px;
    vertical-align:middle;
    margin-left:7px;
}

.countryName{
    font-size:14px;
    font-weight:bold;
}

.countryMeta{
    color:#8ea9bd;
    font-size:11px;
    margin-top:5px;
}

.startGame{
    width:100%;
    padding:15px;
    margin-top:13px;
    border-radius:13px;
    color:#fff;
    font-size:18px;
    font-weight:900;
    background:linear-gradient(135deg,#126fb4,#168563);
}

.startGame:disabled{
    opacity:.35;
}

#game{
    display:none;
    position:fixed;
    inset:0;
}

#map{
    position:absolute;
    inset:0;
    z-index:1;
    background:#dce8ee;
}

.topbar{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    z-index:1000;
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

.topbar::-webkit-scrollbar{
    display:none;
}

.stat{
    min-width:108px;
    background:rgba(7,17,29,.93);
    border:1px solid #31516d;
    border-radius:11px;
    padding:7px 10px;
    box-shadow:0 5px 15px #0006;
}

.stat b{
    display:block;
    color:#91aec4;
    font-size:11px;
}

.stat span{
    display:block;
    margin-top:3px;
    font-weight:bold;
    font-size:14px;
}

.mapTools{
    position:absolute;
    right:9px;
    top:76px;
    z-index:1000;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.toolBtn{
    width:44px;
    height:44px;
    border-radius:12px;
    color:white;
    background:rgba(7,17,29,.92);
    border:1px solid #385873;
    font-size:19px;
}

.bottomDock{
    position:absolute;
    z-index:3000;
    bottom:9px;
    left:8px;
    right:8px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.dockBtn{
    min-height:58px;
    border-radius:13px;
    color:white;
    font-size:12px;
    font-weight:bold;
    background:rgba(6,17,29,.96);
    border:1px solid #34536e;
    box-shadow:0 7px 18px #0007;
}

.dockBtn strong{
    display:block;
    font-size:19px;
    margin-bottom:3px;
}

.storeDock{
    background:linear-gradient(135deg,#744e0b,#b57a11);
    border-color:#dca92e;
}

.nextBtn{
    background:linear-gradient(135deg,#125d91,#087a67);
}

.modal{
    position:fixed;
    inset:0;
    z-index:10000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:12px;
    background:#0009;
}

.modal.show{
    display:flex;
}

.panel{
    width:min(950px,97vw);
    max-height:92vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:#091625;
    border:1px solid #355a78;
    border-radius:18px;
    box-shadow:0 25px 80px #000;
}

.panelHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px;
    background:#0d2033;
    border-bottom:1px solid #294760;
}

.panelHead h2{
    margin:0;
    font-size:19px;
}

.closeBtn{
    width:36px;
    height:36px;
    border-radius:9px;
    background:#51232a;
    color:white;
    font-size:20px;
}

.panelBody{
    overflow:auto;
    padding:13px;
}

.tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:12px;
}

.tab{
    white-space:nowrap;
    padding:9px 13px;
    border-radius:9px;
    color:#b8d0e2;
    background:#132a40;
    border:1px solid #31506a;
}

.tab.active{
    background:#1c638f;
    color:#fff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:9px;
}

.card,
.govCard{
    background:#0d2032;
    border:1px solid #294963;
    border-radius:12px;
    padding:11px;
}

.card h3,
.govCard h3{
    margin:0 0 7px;
    font-size:14px;
}

.card p,
.govCard p{
    margin:4px 0;
    color:#9eb5c8;
    font-size:12px;
    line-height:1.7;
}

.price{
    color:#ffd45b!important;
    font-weight:bold;
}

.buy{
    width:100%;
    margin-top:8px;
    padding:9px;
    border-radius:8px;
    color:#fff;
    background:#166f9e;
    font-weight:bold;
}

.sell{
    background:#59672a;
}

.buy:disabled{
    opacity:.35;
}

.sectionTitle{
    margin:15px 0 9px;
    color:#77c8ff;
    border-right:3px solid #3ea9e9;
    padding-right:8px;
}

.govGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.action{
    width:100%;
    padding:10px;
    margin-top:7px;
    border-radius:9px;
    color:#fff;
    background:#185f87;
}

.action.green{
    background:#176e59;
}

.action.red{
    background:#71313a;
}

.action.gold{
    background:#765914;
}

.powerBox{
    background:#101f31;
    border:1px solid #35526a;
    padding:13px;
    border-radius:12px;
    margin-bottom:12px;
}

.powerLine{
    display:flex;
    justify-content:space-between;
    margin:7px 0;
    gap:10px;
}

.bar{
    height:10px;
    background:#172d41;
    border-radius:20px;
    overflow:hidden;
}

.bar i{
    display:block;
    height:100%;
    width:50%;
    background:#39a5d8;
}

.warTarget{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px;
    margin-bottom:7px;
    border-radius:10px;
    background:#0e2235;
    border:1px solid #294b64;
}

.warTarget button{
    background:#853b42;
    color:white;
    padding:8px 12px;
    border-radius:8px;
}

.log{
    max-height:190px;
    overflow:auto;
    padding:10px;
    border-radius:10px;
    background:#06111d;
    border:1px solid #213b51;
    font-size:12px;
    line-height:1.9;
}

.log div{
    padding:3px;
    border-bottom:1px solid #ffffff0d;
}

.good{color:#54d49a}
.bad{color:#ff7070}
.gold{color:#ffd35a}
.blue{color:#65c5ff}
.gray{color:#93a9b9}

.range{
    width:100%;
}

.notice{
    padding:11px;
    border-radius:10px;
    background:#12283b;
    border:1px solid #2c536d;
    margin-bottom:10px;
    font-size:12px;
    line-height:1.8;
}

@media(max-width:650px){

    .stat{
        min-width:94px;
    }

    .dockBtn{
        min-height:54px;
        font-size:10px;
    }

    .dockBtn strong{
        font-size:17px;
    }

    .panel{
        max-height:94vh;
    }
}
</style>
</head>

<body>

<div id="countryScreen">

    <div class="countryBox">

        <div class="countryTitle">
            🌍 WORLD EMPIRE
        </div>

        <div class="countrySub">
            کشور خود را انتخاب کن و امپراتوری خودت را بساز
        </div>

        <input
            id="countrySearch"
            class="countrySearch"
            placeholder="🔎 جستجوی کشور..."
            autocomplete="off"
        >

        <div id="countryGrid" class="countryGrid"></div>

        <button
            id="startBtn"
            class="startGame"
            disabled
        >
            شروع بازی
        </button>

    </div>
</div>

<div id="game">

    <div id="map"></div>

    <div class="topbar">

        <div class="stat">
            <b>💰 خزانه</b>
            <span id="money">0</span>
        </div>

        <div class="stat">
            <b>👥 جمعیت</b>
            <span id="population">0</span>
        </div>

        <div class="stat">
            <b>🏭 تولید</b>
            <span id="production">0</span>
        </div>

        <div class="stat">
            <b>🛡️ توان کشور</b>
            <span id="power">0</span>
        </div>

        <div class="stat">
            <b>🏙️ شهرها</b>
            <span id="cities">0</span>
        </div>

        <div class="stat">
            <b>🌍 قلمروها</b>
            <span id="conquests">0</span>
        </div>

        <div class="stat">
            <b>📈 اعتبار</b>
            <span id="reputation">0</span>
        </div>

        <div class="stat">
            <b>🗓️ سال</b>
            <span id="year">1</span>
        </div>

        <div class="stat">
            <b>📊 تورم</b>
            <span id="inflation">0%</span>
        </div>

    </div>

    <div class="mapTools">

        <button class="toolBtn" onclick="map.setZoom(map.getZoom()+1)">+</button>

        <button class="toolBtn" onclick="map.setZoom(map.getZoom()-1)">−</button>

        <button class="toolBtn" onclick="cycleMapMode()">◈</button>

        <button class="toolBtn" onclick="openGovernment()">🏛️</button>

    </div>

    <div class="bottomDock">

        <button class="dockBtn storeDock" onclick="openStore()">
            <strong>🛒</strong>
            فروشگاه
        </button>

        <button class="dockBtn" onclick="openGovernment()">
            <strong>🏛️</strong>
            دولت
        </button>

        <button class="dockBtn" onclick="openWar()">
            <strong>⚔️</strong>
            جنگ
        </button>

        <button class="dockBtn" onclick="openCountryManagement()">
            <strong>🌐</strong>
            کشور
        </button>

        <button class="dockBtn nextBtn" onclick="nextTurn()">
            <strong>⏭️</strong>
            سال بعد
        </button>

    </div>

</div>

<!-- STORE -->

<div id="storeModal" class="modal">

    <div class="panel">

        <div class="panelHead">

            <h2>🛒 فروشگاه ملی</h2>

            <button
                class="closeBtn"
                onclick="closeModal('storeModal')"
            >
                ×
            </button>

        </div>

        <div class="panelBody">

            <div id="storeTabs" class="tabs"></div>

            <div id="storeGrid" class="grid"></div>

        </div>

    </div>

</div>

<!-- GOVERNMENT -->

<div id="governmentModal" class="modal">

    <div class="panel">

        <div class="panelHead">

            <h2>🏛️ دولت و مدیریت کشور</h2>

            <button
                class="closeBtn"
                onclick="closeModal('governmentModal')"
            >
                ×
            </button>

        </div>

        <div
            id="governmentBody"
            class="panelBody"
        ></div>

    </div>

</div>

<!-- WAR -->

<div id="warModal" class="modal">

    <div class="panel">

        <div class="panelHead">

            <h2>⚔️ مرکز جنگ و عملیات</h2>

            <button
                class="closeBtn"
                onclick="closeModal('warModal')"
            >
                ×
            </button>

        </div>

        <div
            id="warBody"
            class="panelBody"
        ></div>

    </div>

</div>

<!-- COUNTRY -->

<div id="countryModal" class="modal">

    <div class="panel">

        <div class="panelHead">

            <h2>🌐 مدیریت کشور</h2>

            <button
                class="closeBtn"
                onclick="closeModal('countryModal')"
            >
                ×
            </button>

        </div>

        <div
            id="countryBody"
            class="panelBody"
        ></div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

function renderCountries(filter=""){

    const grid=document.getElementById("countryGrid");

    grid.innerHTML="";

    const f=filter.trim().toLowerCase();

    COUNTRIES
    .filter(c=>{
        return !f ||
        c[0].toLowerCase().includes(f) ||
        c[1].toLowerCase().includes(f);
    })
    .forEach(c=>{

        const btn=document.createElement("button");

        btn.className=
            "countryBtn"+
            (game.countryCode===c[0]?" selected":"");

        btn.innerHTML=`

            <div>
                <span class="flag">${c[2]}</span>
                <span class="countryName">${c[1]}</span>
            </div>

            <div class="countryMeta">
                👥 جمعیت:
                ${formatPopulation(c[3])}
                میلیون
            </div>

            <div class="countryMeta">
                🏭 اقتصاد پایه:
                ${formatNumber(c[4])}
            </div>

        `;

        btn.onclick=()=>{

            game.countryCode=c[0];
            game.country=c[1];

            selectedCountry=c;

            renderCountries(
                document.getElementById("countrySearch").value
            );

            document.getElementById("startBtn").disabled=false;
        };

        grid.appendChild(btn);
    });
}

document
.getElementById("countrySearch")
.addEventListener("input",e=>{
    renderCountries(e.target.value);
});

renderCountries();

/* =========================================================

========================================================= */

document
.getElementById("startBtn")
.addEventListener("click",()=>{

    if(!game.countryCode)return;

    const c=
        COUNTRIES.find(x=>x[0]===game.countryCode);

    game.population=c[3];
    game.production=c[4];

    game.money=
        18000+
        c[4]*150+
        Math.sqrt(c[3])*500;

    game.cities=
        Math.max(
            2,
            Math.round(c[3]/18)
        );

    game.power=Math.round(
        c[4]*2.2+
        game.cities*11+
        c[3]/12
    );

    game.stability=
        c[3]<5
        ?78
        :c[3]>100
        ?64
        :72;

    game.reputation=70;
    game.popularity=65;

    COUNTRIES.forEach(x=>{
        game.relations[x[0]]=50;
    });

    game.relations[game.countryCode]=100;

    document
    .getElementById("countryScreen")
    .style.display="none";

    document
    .getElementById("game")
    .style.display="block";

    initMap();

    updateUI();

    logEvent(
        `کشور ${game.country} انتخاب شد. برای گسترش باید ابتدا اقتصاد و دولت را تقویت کنی.`
    );
});

/* =========================================================
   MAP
   دقیقاً همان ساختار نقشه قبلی
========================================================= */

function initMap(){

    map=L.map("map",{
        worldCopyJump:false,
        zoomControl:false,
        minZoom:2,
        maxZoom:7
    }).setView([25,10],2);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);

    fetch(MAP_GEOJSON)
    .then(r=>r.json())
    .then(data=>{

        geoData=data;

        geoLayer=L.geoJSON(data,{

            style:countryStyle,

            onEachFeature:(feature,layer)=>{

                layer.on({

                    click:()=>{
                        const name=getFeatureName(feature);
                        showCountryInfo(name);
                    },

                    mouseover:e=>{
                        e.target.setStyle({
                            weight:2,
                            color:"#ffffff",
                            fillOpacity:.7
                        });
                    },

                    mouseout:e=>{
                        geoLayer.resetStyle(e.target);
                    }

                });

            }

        }).addTo(map);

    })
    .catch(()=>{

        logEvent(
            "نقشه در حالت آفلاین بارگذاری نشد؛ سیستم بازی همچنان فعال است."
        );

    });
}

function getFeatureName(feature){

    const p=feature.properties||{};

    return p.ADMIN ||
        p.NAME ||
        p.name ||
        p.ADMIN_NAME ||
        p.Country ||
        "کشور ناشناس";
}

function countryStyle(){

    return{
        color:"#536b78",
        weight:1,
        fillColor:"#b9cbd1",
        fillOpacity:.48
    };
}

/* =========================================================
   MAP MODE
========================================================= */

function cycleMapMode(){

    game.mapMode=
        (game.mapMode+1)%4;

    if(!geoLayer)return;

    geoLayer.eachLayer(layer=>{

        const name=
            getFeatureName(layer.feature);

        let fill="#b9cbd1";

        if(game.mapMode===1){

            const hash=
                hashName(name);

            fill=
                `hsl(${(hash%100)+120},35%,${42+(hash%20)}%)`;
        }

        if(game.mapMode===2){

            const hash=
                hashName(name);

            fill=
                `hsl(${(hash%50)+5},55%,${40+(hash%18)}%)`;
        }

        if(game.mapMode===3){

            const hash=
                hashName(name);

            fill=
                `hsl(${(hash%90)+190},45%,${38+(hash%20)}%)`;
        }

        layer.setStyle({
            color:"#536b78",
            weight:1,
            fillColor:fill,
            fillOpacity:.55
        });

    });
}

function hashName(s){

    let h=0;

    for(let i=0;i<s.length;i++){

        h=((h<<5)-h)+
            s.charCodeAt(i);

        h|=0;
    }

    return Math.abs(h);
}

function openStore(){

    document
    .getElementById("storeModal")
    .classList.add("show");

    renderStore();
}

function renderStore(){

    const tabs=
        document.getElementById("storeTabs");

    const grid=
        document.getElementById("storeGrid");

    tabs.innerHTML="";
    grid.innerHTML="";

    storeCategories.forEach(cat=>{

        const b=
            document.createElement("button");

        b.className=
            "tab"+
            (game.storeCategory===cat
                ?" active"
                :"");

        b.textContent=cat;

        b.onclick=()=>{
            game.storeCategory=cat;
            renderStore();
        };

        tabs.appendChild(b);
    });

    let items=[];

    if(game.storeCategory==="همه"){

        Object.entries(STORE)
        .forEach(([cat,list])=>{

            list.forEach(item=>{
                items.push({
                    category:cat,
                    data:item
                });
            });

        });

    }else{

        STORE[game.storeCategory]
        .forEach(item=>{
            items.push({
                category:game.storeCategory,
                data:item
            });
        });
    }

    items.forEach(obj=>{

        const[
            name,
            desc,
            basePrice,
            effect,
            kind
        ]=obj.data;

        const price=
            Math.round(
                basePrice*
                (1+game.inflation/100)
            );

        const owned=
            game.inventory[name]||0;

        const card=
            document.createElement("div");

        card.className="card";

        card.innerHTML=`

            <h3>${name}</h3>

            <p>${desc}</p>

            <p>
                بخش:
                <span class="blue">
                    ${obj.category}
                </span>
            </p>

            <p>
                اثر:
                <span class="blue">
                    +${effect}
                </span>
            </p>

            <p>
                دارایی:
                <b>${owned}</b>
            </p>

            <p class="price">
                💰 ${formatMoney(price)}
            </p>

            <button
                class="buy"
                ${game.money<price?"disabled":""}
                onclick="buyItem(
                    '${escapeJs(name)}',
                    ${price},
                    ${effect},
                    '${kind}'
                )"
            >
                خرید
            </button>

            <button
                class="buy sell"
                ${owned<=0?"disabled":""}
                onclick="sellItem(
                    '${escapeJs(name)}',
                    ${Math.round(price*.75)},
                    ${effect},
                    '${kind}'
                )"
            >
                فروش
            </button>
        `;

        grid.appendChild(card);
    });
}

function buyItem(
    name,
    price,
    effect,
    kind
){

    if(game.money<price)return;

    game.money-=price;

    game.inventory[name]=
        (game.inventory[name]||0)+1;

    applyStoreEffect(
        effect,
        kind,
        1
    );

    logEvent(
        `خرید «${name}» انجام شد.`
    );

    updateUI();
    renderStore();
}

function sellItem(
    name,
    price,
    effect,
    kind
){

    if(!game.inventory[name])return;

    game.inventory[name]--;

    if(game.inventory[name]<=0)
        delete game.inventory[name];

    game.money+=price;

    applyStoreEffect(
        effect,
        kind,
        -1
    );

    logEvent(
        `«${name}» فروخته شد.`
    );

    updateUI();
    renderStore();
}

function applyStoreEffect(
    effect,
    kind,
    sign
){

    if(kind==="production")
        game.production=
            Math.max(
                1,
                game.production+
                effect*.04*sign
            );

    if(kind==="stability")
        game.stability=
            clamp(
                game.stability+
                effect*.35*sign,
                0,100
            );

    if(kind==="reputation")
        game.reputation=
            clamp(
                game.reputation+
                effect*.3*sign,
                0,100
            );

    if(kind==="popularity")
        game.popularity=
            clamp(
                game.popularity+
                effect*.35*sign,
                0,100
            );

    if(kind==="technology")
        game.governmentLevel=
            Math.max(
                1,
                game.governmentLevel+
                effect*.015*sign
            );

    if(kind==="cities")
        game.cities=
            Math.max(
                1,
                game.cities+
                Math.round(effect*.05*sign)
            );

    if(kind==="population")
        game.population=
            Math.max(
                .1,
                game.population+
                effect*.03*sign
            );

    if(kind==="money")
        game.money=
            Math.max(
                0,
                game.money+
                effect*25*sign
            );

    if(kind==="trade")
        game.reputation=
            clamp(
                game.reputation+
                effect*.2*sign,
                0,100
            );

    if(kind==="crisis")
        game.stability=
            clamp(
                game.stability+
                effect*.4*sign,
                0,100
            );
}

function calculatePower(){

    const budgetBonus=
        game.budget.army*.9;

    const stabilityBonus=
        game.stability*.42;

    const governmentBonus=
        game.governmentLevel*9;

    const readinessBonus=
        game.warReadiness*.45;

    const cityBonus=
        game.cities*4.5;

    const economyBonus=
        Math.sqrt(
            Math.max(
                1,
                game.production
            )
        )*1.7;

    return Math.max(
        1,
        Math.round(
            game.power+
            budgetBonus+
            stabilityBonus+
            governmentBonus+
            readinessBonus+
            cityBonus+
            economyBonus
        )
    );
}

function enemyPower(country){

    const c=
        COUNTRIES.find(
            x=>x[0]===country
        );

    if(!c)return 100;

    let p=
        c[4]*2.15+
        c[3]/11+
        Math.max(
            1,
            c[3]/30
        )*9;

    const relation=
        game.relations[country]??50;

    p*=
        1+
        (50-relation)/300;

    if(game.conquered.includes(country))
        p*=.72;

    return Math.max(
        20,
        Math.round(p)
    );
}

function warDifficulty(country){

    const ep=
        enemyPower(country);

    const mp=
        calculatePower();

    const ratio=
        mp/ep;

    if(ratio>=1.45)
        return "آسان";

    if(ratio>=1.12)
        return "متوسط";

    if(ratio>=.9)
        return "سخت";

    return "بسیار سخت";
}

function warRequirements(target){

    const ep=
        enemyPower(target);

    const cost=
        Math.round(
            4500+
            ep*45+
            game.cities*100
        );

    const commandCost=
        Math.round(
            15+
            ep/80
        );

    const readinessNeed=
        Math.round(
            45+
            ep/25
        );

    return{
        money:cost,
        command:commandCost,
        readiness:readinessNeed
    };
}

function startWar(target){

    const req=
        warRequirements(target);

    if(game.warCooldown>0){

        logEvent(
            `برای عملیات بعدی باید ${game.warCooldown} سال صبر کنی.`,
            "bad"
        );

        return;
    }

    if(game.commandPoints<req.command){

        logEvent(
            `امتیاز فرماندهی کافی نیست. نیاز: ${req.command}`,
            "bad"
        );

        return;
    }

    if(game.money<req.money){

        logEvent(
            `هزینه آماده‌سازی کافی نیست. نیاز: ${formatMoney(req.money)}`,
            "bad"
        );

        return;
    }

    if(game.warReadiness<req.readiness){

        logEvent(
            `آمادگی جنگی کافی نیست. نیاز: ${req.readiness}%`,
            "bad"
        );

        return;
    }

    if(game.stability<45){

        logEvent(
            "ثبات داخلی کشور برای یک درگیری بزرگ کافی نیست.",
            "bad"
        );

        return;
    }

    const relation=
        game.relations[target]??50;

    if(relation>85){

        if(!confirm(
            "رابطه با این کشور خوب است. آیا مطمئن هستید؟"
        ))
            return;
    }

    const enemy=
        enemyPower(target);

    const mine=
        calculatePower();

    const preparation=
        game.warReadiness/100;

    const morale=
        (game.stability-50)/300;

    const economyFactor=
        Math.min(
            .18,
            game.production/
            Math.max(1,enemy*18)
        );

    const random=
        (Math.random()-.5)*.24;

    const attackScore=
        mine*
        (
            .78+
            preparation*.35+
            morale+
            economyFactor+
            random
        );

    const defenseScore=
        enemy*
        (
            .90+
            Math.random()*.22
        );

    game.money-=req.money;
    game.commandPoints-=req.command;

    game.warReadiness=
        clamp(
            game.warReadiness-25,
            0,100
        );

    game.warWeariness=
        clamp(
            game.warWeariness+18,
            0,100
        );

    game.warCooldown=2;

    if(attackScore>=defenseScore){

        game.victories++;

        game.reputation=
            clamp(
                game.reputation+3,
                0,100
            );

        game.stability=
            clamp(
                game.stability-4,
                0,100
            );

        game.relations[target]=-70;

        game.wars.push(
            `🏆 پیروزی مقابل ${countryDisplay(target)} | ${Math.round(attackScore)} در برابر ${Math.round(defenseScore)}`

        logEvent(

            "good"
        );

        showWarVictory(target);

    }else{

        game.defeats++;

        game.money=
            Math.max(
                0,
                game.money-
                Math.round(enemy*30)
            );

        game.reputation=
            clamp(
                game.reputation-8,
                0,100
            );

        game.stability=
            clamp(
                game.stability-10,
                0,100
            );

        game.warWeariness=
            clamp(
                game.warWeariness+15,
                0,100
            );

        game.wars.push(
            `❌ شکست مقابل ${countryDisplay(target)} | ${Math.round(attackScore)} در برابر ${Math.round(defenseScore)}`
        );

        logEvent(
            `درگیری با ${countryDisplay(target)} با شکست پایان یافت.`,
            "bad"
        );

        showWarLoss(target);
    }

    updateUI();
}

function conquerCountry(target){

    const ep=
        enemyPower(target);

    const cost=
        Math.round(
            ep*80+
            5000
        );

    if(game.money<cost){

        logEvent(
            "خزانه برای اداره کشور جدید کافی نیست.",
            "bad"
        );

        return;
    }

    if(game.stability<50){

        logEvent(
            "ثبات کشور برای اداره سرزمین جدید کافی نیست.",
            "bad"
        );

        return;
    }

    game.money-=cost;

    game.conquered.push(target);

    game.occupied[target]={
        years:0,
        income:Math.max(
            100,
            Math.round(ep*18)
        )
    };

    const c=
        COUNTRIES.find(
            x=>x[0]===target
        );

    if(c){

        game.population+=
            c[3]*.25;

        game.production+=
            c[4]*.22;

        game.cities+=
            Math.max(
                1,
                Math.round(c[3]/40)
            );
    }

    game.stability=
        clamp(
            game.stability-7,
            0,100
        );

    game.reputation=
        clamp(
            game.reputation-3,
            0,100
        );

    logEvent(
        `🏛️ ${countryDisplay(target)} به قلمروهای تحت کنترل شما اضافه شد.`,
        "good"
    );

    game.wars.push(
        `🏛️ الحاق ${countryDisplay(target)} انجام شد.`
    );

    updateUI();
    renderWar();
}

/* =========================================================
   TURN SYSTEM
========================================================= */

function nextTurn(){

    game.year++;

    if(game.warCooldown>0)
        game.warCooldown--;

    const gov=
        GOVERNMENTS.find(
            g=>
                g.name===
                game.governmentType
        )
        ||
        GOVERNMENTS[0];

    const taxIncome=
        game.production*
        (game.tax/20)*
        gov.economy*
        (1+game.budget.economy/100);

    const upkeep=
        game.cities*70+
        game.power*.8+
        game.population*3;

    const welfareCost=
        game.population*
        (game.budget.welfare/100)*
        20;

    const net=
        taxIncome-
        upkeep-
        welfareCost+
        game.production*2;

    game.money=
        Math.max(
            0,
            game.money+net
        );

    game.production*=
        (
            1+
            .005+
            game.budget.economy/2000+
            game.budget.infrastructure/10000
        );

    game.population*=1.004;

    game.inflation=
        clamp(
            game.inflation+
            (game.tax-20)*.03+
            (Math.random()-.45)*.8,
            0,40
        );

    game.commandPoints=
        clamp(
            game.commandPoints+
            15+
            game.budget.army*.1,
            0,100
        );

    game.warWeariness=
        clamp(
            game.warWeariness-5,
            0,100
        );

    game.warReadiness=
        clamp(
            game.warReadiness+
            5+
            game.budget.army*.12+
            (game.stability-50)*.04,
            0,100
        );

    game.stability=
        clamp(
            game.stability+
            (game.budget.welfare-20)*.04+
            (game.budget.infrastructure-20)*.02-
            (game.tax-20)*.08,
            0,100
        );

    game.popularity=
        clamp(
            game.popularity+
            (game.budget.welfare-20)*.05-
            (game.tax-20)*.12+
            (game.stability-60)*.015,
            0,100
        );

    processControlledTerritories();

    randomEvent();

    updateUI();

    if(
        document
        .getElementById(
            "governmentModal"
        )
        .classList.contains("show")
    )
        renderGovernment();

    if(
        document
        .getElementById(
            "countryModal"
        )
        .classList.contains("show")
    )
        renderCountryManagement();

    if(
        document
        .getElementById(
            "warModal"
        )
        .classList.contains("show")
    )
        renderWar();

    logEvent(
        `سال ${game.year} آغاز شد.`
    );
}

/* =========================================================
   CONTROLLED TERRITORIES ECONOMY
========================================================= */

function processControlledTerritories(){

    let income=0;

    Object.keys(
        game.occupied
    )
    .forEach(code=>{

        const data=
            game.occupied[code];

        data.years++;

        income+=
            data.income;

        if(!data.vassal){

            game.stability=
                clamp(
                    game.stability-
                    .35,
                    0,100
                );
        }
    });

    if(income>0){

        game.money+=
            Math.round(
                income*
                (1-game.inflation/200)
            );

        logEvent(
            `💰 درآمد سرزمین‌های تحت کنترل: ${formatMoney(income)}`
        );
    }
}

/* =========================================================
   RANDOM EVENTS
========================================================= */

function randomEvent(){

    const r=Math.random();

    if(r<.08){

        const bonus=
            Math.round(
                1000+
                Math.random()*3000
            );

        game.money+=bonus;

        logEvent(
            `📦 رونق تجاری: ${formatMoney(bonus)} به خزانه اضافه شد.`,
            "good"
        );

    }else if(r<.15){

        game.inflation=
            clamp(
                game.inflation+2,
                0,40
            );

        game.popularity=
            clamp(
                game.popularity-3,
                0,100
            );

        logEvent(
            "📈 فشار اقتصادی باعث افزایش تورم شد.",
            "bad"
        );

    }else if(r<.21){

        game.production+=2;

        game.reputation=
            clamp(
                game.reputation+2,
                0,100
            );

        logEvent(
            "🔬 پیشرفت علمی باعث افزایش تولید شد.",
            "good"
        );

    }else if(r<.27){

        game.stability=
            clamp(
                game.stability-5,
                0,100
            );

        game.warReadiness=
            clamp(
                game.warReadiness-3,
                0,100
            );

        logEvent(
            "⚠️ بحران داخلی کوچکی رخ داد.",
            "bad"
        );

    }else if(r<.32){

        game.reputation=
            clamp(
                game.reputation+4,
                0,100
            );

        logEvent(
            "🤝 اعتبار بین‌المللی کشور افزایش یافت.",
            "good"
        );
    }
}

/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){

    localStorage.setItem(
        "WORLD_EMPIRE_SAVE",
        JSON.stringify(game)
    );

    logEvent(
        "💾 بازی ذخیره شد.",
        "good"
    );
}

function loadGame(){

    const raw=
        localStorage.getItem(
            "WORLD_EMPIRE_SAVE"
        );

    if(!raw){

        logEvent(
            "ذخیره‌ای پیدا نشد.",
            "bad"
        );

        return;
    }

    try{

        const saved=
            JSON.parse(raw);

        Object.assign(
            game,
            saved
        );

        logEvent(
            "💾 بازی بارگذاری شد.",
            "good"
        );

        updateUI();

    }catch(e){

        logEvent(
            "ذخیره خراب است.",
            "bad"
        );
    }
}

function logEvent(

/* =========================================================
   UTILITIES
========================================================= */

function clamp(
    v,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            v
        )
    );
}

function formatMoney(n){

    n=Math.round(
        Number(n)||0
    );

    if(n>=1000000000)
        return(
            n/1000000000
        ).toFixed(1)+"B";

    if(n>=1000000)
        return(
            n/1000000
        ).toFixed(1)+"M";

    if(n>=1000)
        return(
            n/1000
        ).toFixed(1)+"K";

    return n.toLocaleString("fa-IR");
}

function formatNumber(n){

    n=Number(n)||0;

    if(n>=1000)
        return(
            n/1000
        ).toFixed(1)+"K";

    if(n>=100)
        return Math.round(n)
        .toLocaleString("fa-IR");

    return n.toFixed(1);
}

function formatPopulation(n){

    n=Number(n)||0;

    if(n>=1000)
        return(
            n/1000
        ).toFixed(2);

    if(n>=100)
        return(
            n
        ).toFixed(1);

    if(n>=10)
        return(
            n
        ).toFixed(2);

    return(
        n
    ).toFixed(3);
}

function countryFlag(code){

    const c=
        COUNTRIES.find(
            x=>x[0]===code
        );

    return c?c[2]:"🌍";
}

function countryDisplay(code){

    const c=
        COUNTRIES.find(
            x=>x[0]===code
        );

    return c?c[1]:code;
}

function escapeJs(s){

    return s
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );
}
