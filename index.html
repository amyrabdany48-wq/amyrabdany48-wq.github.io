/* =========================================================
   تولید صدها آیتم
========================================================= */

let storeItems = [];

const levels = [
    "استاندارد",
    "پیشرفته",
    "توسعه‌یافته",
    "مدرن",
    "ممتاز",
    "پیشرفته پلاس",
    "نسل جدید",
    "نسخه ویژه",
    "سطح ملی",
    "سطح راهبردی"
];


let itemNumber = 0;


storeBases.forEach(base => {

    base.names.forEach(name => {

        levels.forEach((level,levelIndex) => {

            itemNumber++;

            const multiplier =
                1 + (levelIndex * 0.42);

            const cost =
                Math.round(
                    base.base * multiplier
                );

            const effects = {};

            Object.keys(base.effects).forEach(key => {

                effects[key] =
                    Math.max(
                        1,
                        Math.round(
                            base.effects[key] *
                            (1 + levelIndex * 0.22)
                        )
                    );

            });


            storeItems.push({

                id:"store_" + itemNumber,

                name:
                    name +
                    " — " +
                    level,

                category:base.category,

                icon:base.icon,

                cost:cost,

                level:levelIndex + 1,

                effects:effects,

                description:
                    "این پروژه باعث توسعه " +
                    getCategoryName(base.category) +
                    " کشور شما می‌شود و مزایای دائمی ایجاد می‌کند."

            });

        });

    });

/* =========================================================
   دسته‌بندی
========================================================= */

function getCategoryName(id){

    const item =
        storeCategories.find(
            c => c.id === id
        );

    return item ?
        item.name :
        "کشور";

}


/* =========================================================
   نمایش دسته‌بندی‌ها
========================================================= */

const categoriesBox =
    document.getElementById("storeCategories");


function renderCategories(){

    categoriesBox.innerHTML = "";

    storeCategories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "storeCategory";

        button.dataset.category =
            category.id;

        button.textContent =
            category.icon +
            " " +
            category.name;

        if(category.id === "all"){
            button.classList.add("active");
        }

        categoriesBox.appendChild(button);

    });

}


renderCategories();


/* =========================================================
   فرمت پول
========================================================= */

function formatMoney(value){

    return Number(value || 0)
        .toLocaleString("fa-IR");

}


/* =========================================================
   افکت‌های آیتم
========================================================= */

function effectsHTML(effects){

    return Object.entries(effects)
        .map(([key,value]) => {

            const names = {

                treasury:"💰 خزانه",

                production:"🏭 تولید",

                population:"👥 جمعیت",

                reputation:"⭐ اعتبار",

                army:"⚔️ ارتش",

                defense:"🛡️ دفاع",

                technology:"🧠 فناوری",

                stability:"😊 ثبات",

                food:"🌾 غذا",

                energy:"⚡ انرژی",

                industry:"🏭 صنعت",

                trade:"📦 تجارت",

                cities:"🏙️ شهر"

            };

            return `
                <span class="storeEffect">
                    ${names[key] || key}
                    +${formatMoney(value)}
                </span>
            `;

        })
        .join("");

}


/* =========================================================
   نمایش آیتم‌ها
========================================================= */

let activeCategory = "all";


function renderStore(){

    const container =
        document.getElementById("storeItems");

    const search =
        document
            .getElementById("storeSearch")
            .value
            .trim()
            .toLowerCase();


    let filtered =
        storeItems.filter(item => {

            const categoryOK =
                activeCategory === "all" ||
                item.category === activeCategory;

            const searchOK =
                !search ||
                item.name
                    .toLowerCase()
                    .includes(search) ||
                item.description
                    .toLowerCase()
                    .includes(search);

            return categoryOK && searchOK;

        });


    container.innerHTML = "";


    if(filtered.length === 0){

        container.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                opacity:.6;
                font-size:18px;
            ">
                چیزی پیدا نشد.
            </div>
        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    filtered.forEach(item => {

        const card =
            document.createElement("div");

        card.className =
            "storeItem";


        const owned =
            game.inventory[item.id] || 0;


        const canBuy =
            Number(game.treasury || 0) >= item.cost;


        card.innerHTML = `

            <div class="storeItemIcon">
                ${item.icon}
            </div>

            <div class="storeItemName">
                ${item.name}
            </div>

            <div class="storeItemCategory">
                ${getCategoryName(item.category)}
                • سطح ${item.level}
            </div>

            <div class="storeItemDescription">
                ${item.description}
            </div>

            <div class="storeEffects">
                ${effectsHTML(item.effects)}
            </div>

            <div style="
                font-size:11px;
                opacity:.55;
                margin-bottom:7px;
            ">
                مالکیت: ${owned}
            </div>

            <div class="storeBottom">

                <div class="storePrice">
                    💰 ${formatMoney(item.cost)}
                </div>

                <button
                    class="storeBuy ${canBuy ? "" : "disabled"}"
                    data-buy="${item.id}"
                    ${canBuy ? "" : "disabled"}
                >
                    خرید
                </button>

            </div>

        `;


        fragment.appendChild(card);

    });


    container.appendChild(fragment);

}

    "click",

        const button =
            event.target.closest(

            );

        if(!button) return;


        activeCategory =
            button.dataset.category;


        document
            .querySelectorAll(
                ".storeCategory"
            )
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );

            });


        button.classList.add(
            "active"
        );


        renderStore();

    }
);

    .addEventListener(

        renderStore

/* =========================================================
   خرید آیتم
========================================================= */

function buyStoreItem(id){

    const item =
        storeItems.find(
            x => x.id === id
        );

    if(!item) return;


    if(Number(game.treasury || 0) < item.cost){

        showStoreMessage(
            "❌ موجودی خزانه کافی نیست."
        );

        return;

    }


    game.treasury -= item.cost;


    game.inventory[item.id] =
        (game.inventory[item.id] || 0) + 1;


    Object.entries(item.effects)
        .forEach(([key,value]) => {

            if(typeof game[key] !== "number"){
                game[key] = 0;
            }

            game[key] += value;

        });


    updateStoreMoney();

    renderStore();


    /* بروزرسانی رابط بازی قبلی */

    if(typeof updateUI === "function"){
        try{
            updateUI();
        }catch(e){}
    }

    if(typeof updateStats === "function"){
        try{
            updateStats();
        }catch(e){}
    }

    if(typeof renderStats === "function"){
        try{
            renderStats();
        }catch(e){}
    }


    /* ذخیره بازی */

    try{

        localStorage.setItem(
            "worldEmpireSave",
            JSON.stringify(game)
        );

    }catch(e){}


    showStoreMessage(
        "✅ " +
        item.name +
        " خریداری شد."
    );

}

   کلیک خرید

                event.target.closest(

            buyStoreItem(

            left:50%;
            bottom:95px;
            transform:translateX(-50%);
            z-index:20000;
            background:#182033;
            color:#fff;
            padding:13px 20px;
            border-radius:13px;
            box-shadow:0 10px 30px rgba(0,0,0,.4);
            font-weight:900;
            border:1px solid rgba(255,255,255,.12);
            max-width:90vw;
            text-align:center;
        `;

        document.body.appendChild(box);

    }


    box.textContent = text;

    box.style.display =
        "block";


    clearTimeout(messageTimer);


    messageTimer =
        setTimeout(
            () => {
                box.style.display =
                    "none";
            },
            2200
        );

}


/* =========================================================
   موجودی خزانه
========================================================= */

function updateStoreMoney(){

    document
        .getElementById(
            "storeMoneyValue"
        )
        .textContent =
        formatMoney(
            game.treasury
        );

}


/* =========================================================
   باز کردن فروشگاه
========================================================= */

const storeOverlay =
    document.getElementById(
        "storeOverlay"
    );


document
    .getElementById(
        "storeBottomButton"
    )
    .addEventListener(
        "click",
        function(){

            updateStoreMoney();

            renderStore();

            storeOverlay.classList.add(
                "active"
            );

        }
    );


/* =========================================================
   بستن فروشگاه
========================================================= */

document
    .getElementById(
        "closeStore"
    )
    .addEventListener(
        "click",
        function(){

            storeOverlay.classList.remove(
                "active"
            );

        }
    );


storeOverlay.addEventListener(
    "click",
    function(event){

        if(event.target === storeOverlay){

            storeOverlay.classList.remove(
                "active"
            );

        }

    }
);


/* ESC */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            storeOverlay.classList.remove(
                "active"
            );

        }

    }
);


/* =========================================================
   شروع
========================================================= */

updateStoreMoney();

renderStore();

})();
  </script>
