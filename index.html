function hash(str){

let h=0;

for(const ch of String(str)){

h=
((h<<5)-h)+
ch.charCodeAt(0);

h|=0;

}

return Math.abs(h);

}

function colorFor(code){

const c=
S.countries[code];

if(!c)
return normalColor(code);

if(
mapMode===
"normal"
)
return normalColor(code);

if(
mapMode===
"economy"
){

return`hsl(${190-Math.min(100,c.economy)*1.1},62%,41%)`;

}

if(
mapMode===
"military"
){

return`hsl(${5+Math.min(100,c.military)*.65},70%,42%)`;

}

if(
mapMode===
"stability"
){

return`hsl(${Math.min(120,c.stability*1.2)},60%,40%)`;

}

if(
mapMode===
"relations"
){

if(code===S.player)
return"#2bdcff";

const r=
S.diplomacy[code]||0;

if(r>35)
return"#38e59a";

if(r<-35)
return"#ff506b";

return"#69737e";

}

return normalColor(code);

}

function militaryOperation(id){

const w=
S.wars.find(
x=>
x.id===id
);

if(!w)
return;

if(
S.command<
5
)
return toast(
"فرماندهی کافی نیست",
"bad"
);

S.command-=5;

const enemy=
S.countries[w.enemy];

const playerPower=

S.military+

S.technology*.45+

S.units.air*2+

S.units.drone*1.5+

S.units.cyber+

Math.random()*40;

const enemyPower=

enemy.military+

enemy.technology*.35+

Math.random()*40;

const delta=
(playerPower-enemyPower)/12;

w.score+=delta;

S.warExhaustion+=1.2;

if(
delta>0
)
toast(
"عملیات موفق بود",
"good"
);

else
toast(
"عملیات سختی بود",
"warn"
);

checkWar(w);

render();

openWar();

}

w.status=
"won";

S.countries[
w.enemy

S.money+=1800;

toast(

);

if(
w.score<=-100
){

w.status=
"lost";

S.money=
Math.max(

S.money-1400

S.stability-=6;

addNews(

function daysInMonth(
month,
year
){

if(
[
4,
6,
9,
11
]
.includes(
month
)
)
return 30;

if(
month===2
)
return year%4===0
?29
:28;

return 31;

}

function aiTurn(){

const codes=
Object.keys(
S.countries
);

for(
let i=0;
i<
Math.min(
20,
codes.length
);
i++
){

const code=
codes[
Math.floor(
Math.random()*
codes.length
)
];

if(
code===
S.player
)
continue;

const c=
S.countries[code];

if(!c)
continue;

const r=
Math.random();

if(
r<.35
)
c.economy+=
Math.random()*1.2;

else if(
r<.6
)
c.military+=
Math.random();

else if(
r<.8
)
c.technology+=
Math.random()*.8;

else
c.stability=
Math.max(
20,
Math.min(
100,
c.stability+
(Math.random()-.5)*.7
)
);

}

}

function simulateWars(){

S.wars
.filter(
w=>
w.status==="war"
)
.forEach(
w=>{

w.days++;

const enemy=
S.countries[
w.enemy
];

if(!enemy)
return;

const diff=

(
S.military+
S.technology*.3
)

-

(
enemy.military+
enemy.technology*.25
);

w.score+=
diff/350;

S.warExhaustion+=
.04;

checkWar(w);

}
);

}

function nextDay(){

if(
!S.started||
S.settings.paused
)
return;

S.day++;

if(
S.day>
daysInMonth(
S.month,
S.year
)
){

S.day=1;

S.month++;

if(
S.month>12
){

S.month=1;

S.year++;

addNews(
"سال جدید",
`سال ${S.year} آغاز شد.`
);

}

}

let income=

S.economy*.72+

S.industry*.28+

S.population*.09+

S.tax*4.2;

income*=

Math.max(
.5,
1-
S.inflation/100
);

S.money+=income;

S.economy+=
.02+
S.technology*.0007;

S.technology+=
S.research*.0004;

S.energy-=.02;

S.food-=.015;

S.command+=.45;

S.warExhaustion-=.05;

S.inflation+=.002;

if(
S.inflation>8
)
S.popularity-=.02;

if(
S.energy<25
)
S.economy-=.04;

if(
S.food<25
)
S.stability-=.03;

simulateWars();

aiTurn();

if(
Math.random()<.03
)
triggerEvent();

clamp();

render();

if(
S.day%5===0
)
save();

}

);

}
catch(e){}

}

function load(){

try{

const raw=
localStorage
.getItem(
"WORLD_EMPIRE_ULTRA"
);

if(
!raw
)
return openCountrySelect();

const data=
JSON.parse(
raw
);

S=
Object.assign(
S,
data
);

S.settings=
Object.assign(
{
speed:1,
paused:false
},
data.settings||{}
);

render();

toast(
"بازی ذخیره‌شده بارگذاری شد",
"good"
);

}
catch(e){

openCountrySelect();

}

}

let last=
performance.now();

let accumulator=0;

function gameLoop(now){

if(
S.started&&
!S.settings.paused
){

accumulator+=
now-last;

const interval=
1300/
Math.max(
1,
S.settings.speed
);

while(
accumulator>=
interval
){

accumulator-=
interval;

nextDay();

}

}

last=now;

requestAnimationFrame(
gameLoop
);

}

requestAnimationFrame(
gameLoop
);

fetch(
GEO_URL
)

.then(
r=>
r.json()
)

.then(
data=>{

data.features
.forEach(
f=>{

ensureCountry(
codeFromFeature(f),
featureName(f)
);

}
);

geoLayer=
L.geoJSON(
data,
{

style:
mapStyle,

onEachFeature:
(
feature,
layer
)=>{

layer.on(
{

click:
()=>{

showCountry(
codeFromFeature(
feature
)
);

},

mouseover:
e=>{

e.target
.setStyle(
{

weight:2.2,

color:"#ffffff",

fillOpacity:.9

}
);

},

mouseout:
e=>{

geoLayer
.resetStyle(
e.target
);

}

}
);

}

}
)
.addTo(
map
);

finishLoading();

}
)

.catch(
()=>{

finishLoading();

toast(
"نقشه آنلاین بارگذاری نشد",
"warn"
);

}
);

let loadValue=0;

const loadingInterval=
setInterval(
()=>{

loadValue=
Math.min(
92,
loadValue+
5+
Math.random()*9
);

$("loaderFill")
.style.width=
loadValue+"%";

if(
loadValue<30
)
$("loaderText")
.textContent=
"در حال آماده‌سازی نقشه...";

else if(
loadValue<55
)
$("loaderText")
.textContent=
"راه‌اندازی اقتصاد جهان...";

else if(
loadValue<75
)
$("loaderText")
.textContent=
"فعال‌سازی نیروهای نظامی...";

else
$("loaderText")
.textContent=
"فعال‌سازی هوش مصنوعی کشورها...";

},
140
);

let loaded=false;

function finishLoading(){

if(
loaded
)
return;

loaded=true;

clearInterval(
loadingInterval
);

$("loaderFill")
.style.width=
"100%";

$("loaderText")
.textContent=
"جهان آماده است";

setTimeout(
()=>{

$("loading")
.classList
.add(
"hide"
);

load();

},
350
);

}

setTimeout(
finishLoading,
3500
);

setInterval(
()=>{

if(
S.started
)
save();

},
12000
);

document
.addEventListener(
"keydown",
e=>{

if(
e.key===
"Escape"
)
closeModal();

}
);

</script>

</body>
    </html>
