<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<title>WORLD EMPIRE — Geo Strategy</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#e8f1fb;font-family:Tahoma,Arial,sans-serif}
body{touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:
radial-gradient(circle at 50% 20%,#13283b 0,#07111d 52%,#03080d 100%)}
#top{
height:58px;min-height:58px;display:flex;align-items:center;gap:8px;
padding:7px 10px;background:rgba(5,12,21,.96);
border-bottom:1px solid #23384c;z-index:20;box-shadow:0 4px 20px #0008
}
.logo{font-weight:900;font-size:17px;color:#6ed6ff;letter-spacing:.5px;white-space:nowrap}
.stats{display:flex;gap:6px;flex:1;overflow:auto}
.stat{
min-width:92px;background:#0d1c2a;border:1px solid #263d51;border-radius:9px;
padding:5px 9px;text-align:center;font-size:10px;color:#8fa8bd
}
.stat b{display:block;color:#fff;font-size:13px;margin-top:2px}
button{
border:1px solid #34516a;background:#112638;color:#dceeff;border-radius:8px;
padding:9px 12px;font-weight:700;cursor:pointer
}
button:hover{background:#18344b}
button:active{transform:scale(.97)}
#game{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;overflow:hidden;background:
linear-gradient(#071725aa,#071725aa),
radial-gradient(circle,#12334b 0,#07131e 70%)}
#world{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#world.drag{cursor:grabbing}
.country{stroke:#101c27;stroke-width:.55;vector-effect:non-scaling-stroke;cursor:pointer;transition:filter .15s,opacity .15s}
.country:hover{filter:brightness(1.35);stroke:#fff;stroke-width:1}
.country.selected{stroke:#fff;stroke-width:2;filter:brightness(1.3)}
.ocean{fill:#081b2b}
.graticule{fill:none;stroke:#21435a;stroke-width:.35;opacity:.42;vector-effect:non-scaling-stroke}
#hud{
position:absolute;right:12px;top:12px;width:270px;max-height:calc(100% - 24px);
display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5
}
.panel{
pointer-events:auto;background:rgba(7,16,26,.94);border:1px solid #29465c;
border-radius:12px;box-shadow:0 8px 30px #0008;overflow:hidden
}
.panelHead{padding:10px 12px;border-bottom:1px solid #223b50;font-weight:900;color:#72d8ff}
.panelBody{padding:10px}
.countryName{font-size:19px;font-weight:900;margin-bottom:8px}
.flag{
width:100%;height:70px;border-radius:8px;display:flex;align-items:center;justify-content:center;
font-size:34px;background:#10283b;border:1px solid #31516a;margin-bottom:9px
}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #183044;font-size:11px}
.row:last-child{border:0}
.row span{color:#8da7bb}.row b{color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.actions button{font-size:11px}
.danger{border-color:#713333;background:#34191c;color:#ff9a9a}
.good{border-color:#356d51;background:#153526;color:#9ff0bd}
.gold{border-color:#6b5b27;background:#352d13;color:#ffe58b}
#bottom{
position:absolute;left:12px;bottom:12px;z-index:10;display:flex;gap:7px;align-items:flex-end
}
#tools{display:flex;flex-direction:column;gap:6px}
.tool{width:42px;height:42px;padding:0;font-size:17px}
#timeline{
position:absolute;left:50%;bottom:13px;transform:translateX(-50%);
width:min(520px,55vw);background:#07121eec;border:1px solid #29465c;
border-radius:11px;padding:7px 12px;z-index:8
}
.timelineTop{display:flex;justify-content:space-between;font-size:10px;color:#8ca6b9}
input[type=range]{width:100%;accent-color:#46bde8}
#mini{
position:absolute;left:12px;top:12px;width:190px;height:125px;border:1px solid #29465c;
border-radius:10px;background:#06121de8;z-index:4;overflow:hidden
}
#mini svg{width:100%;height:100%}
#toast{
position:absolute;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);
background:#0d2435;border:1px solid #3b6885;padding:10px 16px;border-radius:9px;
opacity:0;transition:.25s;z-index:50;pointer-events:none;font-size:12px
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{
display:none;position:absolute;inset:0;background:#0009;z-index:100;
align-items:center;justify-content:center;padding:18px
}
.modalBox{
width:min(600px,95vw);max-height:90vh;overflow:auto;background:#081521;
border:1px solid #34546c;border-radius:14px;box-shadow:0 20px 70px #000;
padding:18px
}
.modalTitle{font-size:20px;font-weight:900;color:#69d5ff;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{
background:#0d2030;border:1px solid #27445a;border-radius:10px;padding:10px
}
.card b{display:block;margin-bottom:4px}
.small{font-size:10px;color:#91a9bb;line-height:1.8}
@media(max-width:800px){
#top{height:52px;min-height:52px}.logo{font-size:13px}
.stat{min-width:75px}.stat b{font-size:11px}
#hud{width:225px;right:7px;top:7px}.panelBody{padding:8px}
#mini{display:none}#timeline{width:48vw}
}
@media(max-width:560px){
#hud{width:190px}.countryName{font-size:15px}.flag{height:52px}
.row{font-size:9px}.actions button{padding:7px 4px}
#timeline{left:8px;right:8px;bottom:7px;transform:none;width:auto}
#bottom{bottom:75px;left:7px}
}
</style>
</head>

</div>
</div>
</div>
</div>

<div class="panel">

<button onclick="openEconomy()">🏭 اقتصاد</button>
<button onclick="openDiplomacy()">🌐 روابط</button>
</div>
</div>
</div>

<div id="mini">

</div>

<div id="bottom">
<div id="tools">

<button class="tool" onclick="zoomOut()">−</button>
<button class="tool" onclick="resetMap()">⌖</button>
<button class="tool" onclick="toggleGrid()">▦</button>
</div>
</div>

<div id="timeline">
<div class="timelineTop">
<span>سرعت زمان</span><span id="speedText">1×</span>
</div>
<input id="speed" type="range" min="0" max="4" value="1">
</div>

<div id="toast"></div>

<div id="modal">
<div class="modalBox">
<div class="modalTitle" id="modalTitle">WORLD EMPIRE</div>
<div id="modalContent"></div>
<button style="margin-top:12px;width:100%" onclick="closeModal()">بستن</button>
</div>
</div>
</main>
</div>

const svg=d3.select("#world");
const mini=d3.select("#miniMap");
let width=1000,height=600;
let projection,geoPath,worldLayer;
let scale=1,tx=0,ty=0;
let countries=[];
let gridVisible=true;

function showToast(text){
    const t=document.getElementById("toast");
    t.textContent=text;
    t.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer=setTimeout(()=>t.classList.remove("show"),2200);
}

function initMap(){
    width=document.getElementById("map").clientWidth;
    height=document.getElementById("map").clientHeight;
    projection=d3.geoNaturalEarth1()
        .fitSize([width,height],{type:"Sphere"});
    geoPath=d3.geoPath(projection);

    svg.attr("viewBox",`0 0 ${width} ${height}`);
    svg.selectAll("*").remove();

    svg.append("path")
       .datum({type:"Sphere"})
       .attr("class","ocean")
       .attr("d",geoPath);

    const defs=svg.append("defs");
    const glow=defs.append("filter").attr("id","glow");
    glow.append("feGaussianBlur").attr("stdDeviation","2").attr("result","blur");
    const merge=glow.append("feMerge");
    merge.append("feMergeNode").attr("in","blur");
    merge.append("feMergeNode").attr("in","SourceGraphic");

    drawWorld();
    drawGrid();
}

function drawGrid(){
    svg.selectAll(".graticule").remove();
    if(!gridVisible)return;
    const graticule=d3.geoGraticule().step([20,20]);
    svg.append("path").datum(graticule()).attr("class","graticule").attr("d",geoPath);
}

function drawWorld(){
    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
    .then(world=>{
        const features=topojson.feature(world,world.objects.countries).features;
        countries=features;
        worldLayer=svg.append("g").attr("id","countries");
        worldLayer.selectAll("path")
        .data(features)
        .enter()
        .append("path")
        .attr("class","country")
        .attr("d",geoPath)
        .attr("fill",d=>countryColor(d))
        .on("click",(e,d)=>{
            e.stopPropagation();
            selectCountry(d);
        })
        .append("title")
        .text(d=>getCountryName(d));
        buildMini(features);
    })
    .catch(()=>{
        showToast("خطا در دریافت نقشه جهان");
    });
}

function countryColor(d){
    const n=getCountryName(d);
    if(n==="Iran")return "#168a72";
    const data=countryDB[n];
    if(!data)return "#315269";
    const e=data.eco;
    if(e>=90)return "#527a94";
    if(e>=75)return "#496d86";
    if(e>=60)return "#456579";
    if(e>=45)return "#3f5e6e";
    if(e>=30)return "#395466";
    return "#344c5d";
}

function getCountryName(d){
    const n=d.properties||{};
    return n.name||n.NAME||n.admin||n.NAME_EN||"Unknown";
}

function buildMini(features){
    mini.selectAll("*").remove();
    const p=d3.geoNaturalEarth1().fitSize([190,125],{type:"Sphere"});
    const path=d3.geoPath(p);
    mini.append("path").datum({type:"Sphere"}).attr("fill","#071b2b").attr("d",path);
    mini.selectAll("path.c")
        .data(features).enter().append("path")
        .attr("class","c")
        .attr("d",path)
        .attr("fill",d=>countryColor(d))
        .attr("stroke","#10202c").attr("stroke-width",".25");
}

function selectCountry(feature){
    document.querySelectorAll(".country").forEach(x=>x.classList.remove("selected"));
    const name=getCountryName(feature);
    const data=countryDB[name]||{
        fa:name,capital:"نامشخص",pop:"—",eco:40,army:0,res:"—",flag:"🌍"
    };
    game.selected=name;
    document.querySelectorAll(".country").forEach(p=>{
        if(p.__data__===feature)p.classList.add("selected");
    });

    document.getElementById("countryEmpty").style.display="none";
    document.getElementById("countryInfo").style.display="block";
    document.getElementById("flag").textContent=data.flag;
    document.getElementById("cname").textContent=data.fa;
    document.getElementById("capital").textContent=data.capital;
    document.getElementById("cpop").textContent=data.pop;
    document.getElementById("ceco").textContent=data.eco+"/100";
    document.getElementById("carmy").textContent=data.army.toLocaleString();
    document.getElementById("cres").textContent=data.res;

    let rel=game.relations[name];
    if(!rel){
        rel=name==="Iran"?100:Math.round(20+Math.random()*50);
        game.relations[name]=rel;
    }
    document.getElementById("crel").textContent=rel+"/100";
}

function updateStats(){
    document.getElementById("money").textContent=Math.floor(game.money).toLocaleString();
    document.getElementById("population").textContent=formatPopulation(game.population);
    document.getElementById("army").textContent=game.army.toLocaleString();
    document.getElementById("economy").textContent=Math.round(game.economy);
    document.getElementById("rep").textContent=Math.round(game.reputation);
    document.getElementById("date").textContent=
        game.date.getFullYear()+"/"+
        String(game.date.getMonth()+1).padStart(2,"0")+"/"+
        String(game.date.getDate()).padStart(2,"0");
}

function formatPopulation(n){
    if(n>=1e9)return (n/1e9).toFixed(2)+"B";
    if(n>=1e6)return (n/1e6).toFixed(1)+"M";
    if(n>=1e3)return (n/1e3).toFixed(1)+"K";
    return n;
}

function advanceDay(){
    const d=new Date(game.date);
    d.setDate(d.getDate()+1);
    game.date=d;

    const income=
        800+
        game.economy*40+
        game.population/1000000*8+
        game.reputation*5;

    game.money+=income;
    game.population+=Math.floor(game.population*.000015);

    if(game.economy<100)game.economy+=.015;
    if(game.reputation<100)game.reputation+=.005;

    if(game.wars.length){
        game.wars.forEach(w=>{
            w.days++;
            if(Math.random()<.035){
                const loss=Math.floor(500+Math.random()*2000);
                game.army=Math.max(0,game.army-loss);
            }
        });
    }
    updateStats();
}

setInterval(()=>{
    if(game.speed>0){
        const delay=12000/game.speed;
        clearTimeout(window.__gameClock);
        window.__gameClock=setTimeout(advanceDay,delay);
    }
},1000);

document.getElementById("speed").addEventListener("input",e=>{
    game.speed=Number(e.target.value);
    document.getElementById("speedText").textContent=
        game.speed===0?"⏸":game.speed+"×";
});

function zoomIn(){
    scale=Math.min(8,scale*1.35);
    applyTransform();
}
function zoomOut(){
    scale=Math.max(.65,scale/1.35);
    applyTransform();
}
function resetMap(){
    scale=1;tx=0;ty=0;applyTransform();
}
function applyTransform(){
    if(!worldLayer)return;
    svg.select("#countries").attr("transform",`translate(${tx},${ty}) scale(${scale})`);
    svg.selectAll(".graticule").attr("transform",`translate(${tx},${ty}) scale(${scale})`);
}
function toggleGrid(){
    gridVisible=!gridVisible;
    drawGrid();
    applyTransform();
}

let dragging=false,lastX=0,lastY=0;
svg.on("pointerdown",(e)=>{
    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
    document.getElementById("world").classList.add("drag");
});
svg.on("pointermove",(e)=>{
    if(!dragging)return;
    tx+=e.clientX-lastX;
    ty+=e.clientY-lastY;
    lastX=e.clientX;
    lastY=e.clientY;
    applyTransform();
});
svg.on("pointerup",()=>{
    dragging=false;
    document.getElementById("world").classList.remove("drag");
});
svg.on("pointerleave",()=>{
    dragging=false;
    document.getElementById("world").classList.remove("drag");
});
svg.on("wheel",(e)=>{
    e.preventDefault();
    const old=scale;
    scale*=e.deltaY<0?1.12:.89;
    scale=Math.max(.65,Math.min(8,scale));
    const rect=document.getElementById("map").getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    tx=mx-(mx-tx)*(scale/old);
    ty=my-(my-ty)*(scale/old);
    applyTransform();
},{passive:false});

    document.getElementById("modalTitle").textContent=title;
    document.getElementById("modalContent").innerHTML=content;
    document.getElementById("modal").style.display="flex";

}

    <div class="grid">
      <div class="card"><b>📈 تولید ناخالص</b><div class="small">رشد پایدار اقتصادی</div></div>
      <div class="card"><b>⛏ منابع</b><div class="small">نفت، گاز، مس</div></div>
      <div class="card"><b>🏦 بانک مرکزی</b><div class="small">ثبات پولی: 72%</div></div>
      <div class="card"><b>🚢 تجارت</b><div class="small">شبکه تجاری فعال</div></div>
    </div>
    <div class="actions">
      <button onclick="tradeMarket()">بازار جهانی</button>
      <button onclick="buildFactory()">ساخت کارخانه</button>
    </div>`);
}

function openDiplomacy(){
    openModal("🌐 وزارت خارجه",`
    <div class="grid">
      <div class="card"><b>🤝 پیمان‌ها</b><div class="small">0 پیمان فعال</div></div>
      <div class="card"><b>🕊 اعتبار</b><div class="small">${game.reputation}/100</div></div>
      <div class="card"><b>🌍 نفوذ جهانی</b><div class="small">متوسط</div></div>
      <div class="card"><b>📡 اطلاعات</b><div class="small">سطح 1</div></div>
    </div>`);
}

function openResearch(){
    openModal("🔬 مرکز تحقیقات",`
    <div class="grid">
      <div class="card"><b>⚡ انرژی</b><div class="small">هزینه 12,000 — افزایش اقتصاد</div><button onclick="research('انرژی')">تحقیق</button></div>
      <div class="card"><b>🧠 هوش مصنوعی</b><div class="small">هزینه 18,000 — افزایش فناوری</div><button onclick="research('هوش مصنوعی')">تحقیق</button></div>
      <div class="card"><b>🏗 مهندسی</b><div class="small">هزینه 14,000 — افزایش زیرساخت</div><button onclick="research('مهندسی')">تحقیق</button></div>
      <div class="card"><b>🛰 ماهواره</b><div class="small">هزینه 25,000 — افزایش اطلاعات</div><button onclick="research('ماهواره')">تحقیق</button></div>
    </div>`);
}

function invest(){
    if(game.money<15000)return showToast("بودجه کافی نیست");
    game.money-=15000;game.economy+=2;
    updateStats();showToast("سرمایه‌گذاری انجام شد");
}
function education(){
    if(game.money<8000)return showToast("بودجه کافی نیست");
    game.money-=8000;game.economy+=.8;game.reputation+=1;
    updateStats();showToast("سرمایه‌گذاری آموزشی انجام شد");
}
function infrastructure(){
    if(game.money<12000)return showToast("بودجه کافی نیست");
    game.money-=12000;game.economy+=1.5;
    updateStats();showToast("زیرساخت توسعه یافت");
}
function health(){
    if(game.money<7000)return showToast("بودجه کافی نیست");
    game.money-=7000;game.population+=50000;game.reputation+=.5;
    updateStats();showToast("سلامت عمومی ارتقا یافت");
}
function buyUnit(type){
    const prices={fighters:3000,tanks:900,drones:450,missiles:5000};
    const power={fighters:600,tanks:150,drones:70,missiles:1000};
    if(game.money<prices[type])return showToast("خزانه کافی نیست");
    game.money-=prices[type];
    game.units[type]++;
    game.army+=power[type];
    updateStats();
    showToast("واحد جدید خریداری شد");
}
function research(name){
    const costs={"انرژی":12000,"هوش مصنوعی":18000,"مهندسی":14000,"ماهواره":25000};
    if(game.research.includes(name))return showToast("این فناوری قبلاً تحقیق شده");
    if(game.money<costs[name])return showToast("بودجه کافی نیست");
    game.money-=costs[name];
    game.research.push(name);
    game.economy+=3;
    updateStats();
    showToast("فناوری "+name+" توسعه یافت");
}
function tradeMarket(){
    if(game.money<5000)return showToast("سرمایه کافی نیست");
    game.money-=5000;
    game.money+=Math.floor(Math.random()*14000);
    game.reputation+=.3;
    updateStats();
    showToast("معامله تجاری انجام شد");
}
function buildFactory(){
    if(game.money<25000)return showToast("بودجه کافی نیست");
    game.money-=25000;game.economy+=4;
    updateStats();showToast("کارخانه ساخته شد");
}

function diplomacy(){
    if(!game.selected)return;
    const r=game.relations[game.selected]||30;
    game.relations[game.selected]=Math.min(100,r+10);
    document.getElementById("crel").textContent=game.relations[game.selected]+"/100";
    game.reputation+=1;
    updateStats();
    showToast("روابط دیپلماتیک بهبود یافت");
}
function trade(){
    if(!game.selected)return;
    if(game.money<4000)return showToast("بودجه کافی نیست");
    game.money-=4000;
    const gain=5000+Math.floor(Math.random()*9000);
    game.money+=gain;
    game.relations[game.selected]=Math.min(100,(game.relations[game.selected]||30)+3);
    updateStats();
    document.getElementById("crel").textContent=game.relations[game.selected]+"/100";
    showToast("قرارداد تجاری موفق بود");
}
function spy(){
    if(!game.selected)return;
    if(game.money<3000)return showToast("بودجه اطلاعاتی کافی نیست");
    game.money-=3000;
    updateStats();
    const d=countryDB[game.selected];
    openModal("🕵️ گزارش اطلاعاتی",`
      <div class="card">
      <b>${d?.fa||game.selected}</b>
      <div class="small">
      سطح اقتصادی: ${d?.eco||"نامشخص"}/100<br>
      نیروی نظامی: ${(d?.army||0).toLocaleString()}<br>
      منابع: ${d?.res||"نامشخص"}<br>
      وضعیت: ${Math.random()>.5?"پایدار":"در حال تغییر"}<br>
      برآورد اطلاعاتی: ${Math.floor(45+Math.random()*50)}%
      </div></div>`);
}
function war(){
    if(!game.selected)return;
    if(game.selected===game.playerCountry)return showToast("نمی‌توانی به کشور خودت حمله کنی");
    const d=countryDB[game.selected];
    if(!d)return showToast("اطلاعات این کشور موجود نیست");
    if(game.army<10000)return showToast("نیروی کافی برای عملیات وجود ندارد");

    const enemy=d.army;
    const tech=
        game.units.fighters*2+
        game.units.tanks+
        game.units.drones*.5+
        game.units.missiles*3;
    const score=game.army+tech;
    const enemyScore=enemy*(.65+Math.random()*.7);

    openModal("⚔️ عملیات نظامی",`
    <div class="card">
    <b>عملیات علیه ${d.fa}</b>
    <div class="small">
    قدرت نظامی شما: ${Math.floor(score).toLocaleString()}<br>
    قدرت برآوردی طرف مقابل: ${Math.floor(enemyScore).toLocaleString()}<br>
    نتیجه بر اساس آمادگی، اقتصاد، فناوری و شانس محاسبه می‌شود.
    </div>
    </div>
    <div class="actions">
    <button class="danger" onclick="resolveWar('${game.selected.replace(/'/g,"\\'")}')">شروع عملیات</button>
    <button onclick="closeModal()">لغو</button>
    </div>`);
}
function resolveWar(name){
    const d=countryDB[name];
    const enemy=d.army;
    const score=game.army+
        game.units.fighters*2+
        game.units.tanks+
        game.units.drones*.5+
        game.units.missiles*3+
        game.economy*500;

    const enemyScore=enemy*(.6+Math.random()*.9);

    if(score>enemyScore){
        const loss=Math.floor(game.army*(.03+Math.random()*.08));
        game.army=Math.max(0,game.army-loss);
        game.money+=Math.floor(15000+Math.random()*30000);
        game.reputation-=4;
        game.wars.push({country:name,days:0});
        game.relations[name]=0;
        closeModal();
        updateStats();
        showToast("پیروزی! سرزمین دشمن تحت کنترل درآمد");
    }else{
        const loss=Math.floor(game.army*(.07+Math.random()*.14));
        game.army=Math.max(0,game.army-loss);
        game.money=Math.max(0,game.money-8000);
        game.reputation-=7;
        closeModal();
        updateStats();
        showToast("عملیات شکست خورد");
    }
}

window.addEventListener("resize",()=>{
    clearTimeout(window.__resize);
    window.__resize=setTimeout(initMap,250);
});

document.addEventListener("keydown",e=>{
    if(e.key==="+")zoomIn();
    if(e.key==="-")zoomOut();
    if(e.key==="Escape")closeModal();
    if(e.key==="r"||e.key==="R")resetMap();
});

game.research=[];
updateStats();
initMap();

</script>

<script>
(function(){
    const topoScript=document.createElement("script");
    topoScript.src="https://cdn.jsdelivr.net/npm/topojson-client@3";
    topoScript.onload=()=>initMap();
    document.head.appendChild(topoScript);
})();
</script>
