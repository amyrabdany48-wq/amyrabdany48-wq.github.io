function GD9Number(
    value,
    fallback=
        0
)
{
    const result=
        Number(
            value
        );

    return Number.isFinite(
        result
    )
    ?
    result
    :
    fallback;
}


function GD9Clamp(
    value,
    minimum,
    maximum
)
{
    return Math.max(
        minimum,
        Math.min(
            maximum,
            GD9Number(
                value,
                minimum
            )
        )
    );
}


function GD9Chance(
    percentage
)
{
    return Math.random()*
    100<
    GD9Clamp(
        percentage,
        0,
        100
    );
}


function GD9Random(
    minimum,
    maximum
)
{
    return minimum+
    Math.random()*
    (

    );
}


function GD9RandomInt(
    minimum,

)
{

function GD9AbsoluteGameDay()
{
    const year=
        GD9Number(
            state.date&&
            state.date.year,
            2026

    const month=
        GD9Number(
            state.date&&
            state.date.month,
            1

            state.date.day,
            1

    return(

}

function GD9Migrate()
{
    if(
        typeof state===
        "undefined"||
        !state
    ){
        return;
    }

    state.tradeSystem=
        state.tradeSystem||
        {};

    state.tradeSystem.offers=
        Array.isArray(
            state.tradeSystem.offers
        )
        ?
        state.tradeSystem.offers
        :
        [];

    state.tradeSystem.history=
        Array.isArray(
            state.tradeSystem.history
        )
        ?
        state.tradeSystem.history
        :
        [];

    state.tradeSystem.selectedCountry=
        state.tradeSystem.selectedCountry||
        null;

    state.tradeSystem.aiResources=
        state.tradeSystem.aiResources||
        {};

    state.tradeSystem.lastProcessedDate=
        state.tradeSystem.lastProcessedDate||
        null;

    state.aiNews=
        Array.isArray(
            state.aiNews
        )
        ?
        state.aiNews
        :
        [];

    state.missileHistory=
        Array.isArray(
            state.missileHistory
        )
        ?
        state.missileHistory
        :
        [];

    state.gd9=
        state.gd9||
        {};

    state.gd9.lastDetailDate=
        state.gd9.lastDetailDate||
        null;

    state.resources=
        state.resources||
        {};

    state.inventory=
        state.inventory||
        {};

    state.inbox=
        Array.isArray(
            state.inbox
        )
        ?
        state.inbox
        :
        [];

    state.economy=
        state.economy||
        {};

    state.nation=
        state.nation||
        {};

    for(
        const resource of
        GD9_RESOURCES
    ){
        state.resources[
            resource.id
        ]=
            GD9Number(
                state.resources[
                    resource.id
                ],
                0
            );
    }

    GD9InitializeAIResources();
}


/* =========================================================
   AI RESOURCE INITIALIZATION
========================================================= */

function GD9StableSeed(
    text
)
{
    try{

        if(
            typeof hashString===
            "function"
        ){
            return(
                hashString(
                    text
                )%
                100000
            )/
            100000;
        }

    }
    catch(
        error
    ){
    }

    let hash=
        2166136261;

    const value=
        String(
            text
        );

    for(
        let index=
            0;
        index<
            value.length;
        index++
    ){
        hash^=
            value.charCodeAt(
                index
            );

        hash=
            Math.imul(
                hash,
                16777619
            );
    }

    return(
        (
            hash>>>
            0
        )%
        100000
    )/
    100000;
}


function GD9InitialAIResource(
    code,
    resourceId
)
{
    const ai=
        GD9AI(
            code
        );

    const economy=
        GD9Number(
            ai.economy,
            50
        );

    const technology=
        GD9Number(
            ai.technology,
            50
        );

    const military=
        GD9Number(
            ai.military,
            50
        );

    const randomFactor=
        GD9StableSeed(
            code+
            ":"+
            resourceId
        );

    if(
        resourceId===
        "food"
    ){
        return 35+
        economy*
        .55+
        randomFactor*
        70;
    }

    if(
        resourceId===
        "energy"
    ){
        return 30+
        economy*
        .55+
        technology*
        .22+
        randomFactor*
        60;
    }

    if(
        resourceId===
        "oil"
    ){
        return 20+
        military*
        .15+
        randomFactor*
        160;
    }

    if(
        resourceId===
        "steel"
    ){
        return 25+
        economy*
        .68+
        randomFactor*
        70;
    }

    if(
        resourceId===
        "electronics"
    ){
        return 12+
        technology*
        .72+
        randomFactor*
        50;
    }

    return 50;
}


function GD9InitializeAIResources()
{
    if(
        !state.tradeSystem||
        !state.tradeSystem.aiResources
    ){
        return;
    }

    for(
        const code of
        GD9CountryCodes()
    ){
        if(
            code===
            GD9PlayerCode()
        ){
            continue;
        }

        state.tradeSystem.aiResources[
            code
        ]=
            state.tradeSystem.aiResources[
                code
            ]||
            {};

        for(
            const resource of
            GD9_RESOURCES
        ){
            const current=
                state.tradeSystem.aiResources[
                    code
                ][
                    resource.id
                ];

            if(
                !Number.isFinite(
                    Number(
                        current
                    )
                )
            ){
                state.tradeSystem.aiResources[
                    code
                ][
                    resource.id
                ]=
                    GD9InitialAIResource(
                        code,
                        resource.id
                    );
            }
        }
    }
}


function GD9AIResource(
    code,
    resourceId
)
{
    GD9InitializeAIResources();

    return GD9Number(
        state.tradeSystem.aiResources[
            code
        ]&&
        state.tradeSystem.aiResources[
            code
        ][
            resourceId
        ],
        0
    );
}


function GD9SetAIResource(
    code,
    resourceId,
    amount
)
{
    GD9InitializeAIResources();

    state.tradeSystem.aiResources[
        code
    ][
        resourceId
    ]=
        Math.max(
            0,
            GD9Number(
                amount
            )
        );
}


/* =========================================================
   AI RESOURCE DAILY ECONOMY
========================================================= */

function GD9ProcessAIResources()
{
    for(
        const code of
        GD9CountryCodes()
    ){
        if(
            code===
            GD9PlayerCode()
        ){
            continue;
        }

        const ai=
            GD9AI(
                code
            );

        const economy=
            GD9Number(
                ai.economy,
                50
            );

        const technology=
            GD9Number(
                ai.technology,
                50
            );

        const military=
            GD9Number(
                ai.military,
                50
            );

        const food=
            GD9AIResource(
                code,
                "food"
            )+
            economy*
            .006-
            military*
            .0025;

        const energy=
            GD9AIResource(
                code,
                "energy"
            )+
            economy*
            .005+
            technology*
            .001-
            military*
            .002;

        const oil=
            GD9AIResource(
                code,
                "oil"
            )+
            GD9StableSeed(
                code+
                ":oil-production"
            )*
            .18-
            military*
            .0018;

        const steel=
            GD9AIResource(
                code,
                "steel"
            )+
            economy*
            .0045-
            military*
            .0015;

        const electronics=
            GD9AIResource(
                code,
                "electronics"
            )+
            technology*
            .0038-
            military*
            .0014;

        GD9SetAIResource(
            code,
            "food",
            food
        );

        GD9SetAIResource(
            code,
            "energy",
            energy
        );

        GD9SetAIResource(
            code,
            "oil",
            oil
        );

        GD9SetAIResource(
            code,
            "steel",
            steel
        );

        GD9SetAIResource(
            code,
            "electronics",
            electronics
        );
    }
}


/* =========================================================
   RESOURCE PRICE
========================================================= */

function GD9ResourcePrice(
    resourceId
)
{
    try{

        if(
            typeof resourcePrice===
            "function"
        ){
            return GD9Number(
                resourcePrice(
                    resourceId
                ),
                50
            );
        }

    }
    catch(
        error
    ){
    }

    const definition=
        GD9_RESOURCES.find(
            item=>
                item.id===
                resourceId
        );

    const base=
        definition
        ?
        definition.basePrice
        :
        50;

    const inflation=
        GD9Number(
            state.economy.inflation,
            0
        );

    const stock=
        GD9Number(
            state.resources[
                resourceId
            ],
            0
        );

    const shortage=
        Math.max(
            0,
            50-
            stock
        );

    const wars=
        Array.isArray(
            state.wars
        )
        ?
        state.wars.filter(
            war=>
                war.status===
                "active"||
                war.status===
                "war"
        ).length
        :
        0;

    return Math.max(
        1,
        base+
        inflation*
        .65+
        shortage*
        .25+
        wars*
        (
            resourceId===
            "oil"
            ?
            5
            :
            2
        )
    );
}

        ],

                                1
                            )
                        );

                    const left=
                        Math.max(
                            0,
                            GD9Number(
                                project.daysLeft,
                                0
                            )
                        );

                        GD9Clamp(
                            (

                            100,
                            0,
                            100
                        );

                    return(
                        '<div class="card">'+
                        '<div class="card-title">'+

                    '</div>'+

/* =========================================================
   TRADE ACCEPTANCE
========================================================= */

function GD9TradeAcceptance(
    countryCode,
    resourceId,
    direction,
    amount,
    unitPrice
)
{
    const ai=
        GD9AI(
            countryCode
        );

    const relationValue=
        GD9Relation(
            countryCode
        );

    const reputation=
        GD9Number(
            state.nation.reputation,
            50
        );

    const tradeInterest=
        GD9Number(
            ai.tradeInterest,
            50
        );

    const aiStock=
        GD9AIResource(
            countryCode,
            resourceId
        );

    const marketPrice=
        Math.max(
            1,
            GD9ResourcePrice(
                resourceId
            )
        );

    let score=
        42;

    score+=
        relationValue*
        .22;

    score+=
        (
            reputation-
            50
        )*
        .12;

    score+=
        (
            tradeInterest-
            50
        )*
        .20;

    if(
        direction===
        "buy"
    ){
        const pricePremium=
            (
                unitPrice/
                marketPrice-
                1
            )*
            100;

        score+=
            GD9Clamp(
                pricePremium*
                .45,
                -22,
                24
            );

        score+=
            GD9Clamp(
                (
                    aiStock-
                    60
                )*
                .12,
                -20,
                20
            );

        if(
            aiStock<
            amount+
            10
        ){
            score-=
                35;
        }
    }
    else{
        const discount=
            (
                1-
                unitPrice/
                marketPrice
            )*
            100;

        score+=
            GD9Clamp(
                discount*
                .45,
                -22,
                24
            );

        score+=
            GD9Clamp(
                (
                    70-
                    aiStock
                )*
                .15,
                -20,
                24
            );
    }

    score-=
        Math.max(
            0,
            amount-
            20
        )*
        .12;

    try{

        if(
            typeof isSanctioned===
            "function"&&
            isSanctioned(
                countryCode
            )
        ){
            score-=
                35;
        }

    }
    catch(
        error
    ){
    }

    if(
        GD9WarWith(
            countryCode
        )
    ){
        score-=
            100;
    }

    score+=
        GD9Random(
            -7,
            7
        );

    return GD9Clamp(
        score,
        0,
        100
    );
}


/* =========================================================
   CREATE PLAYER TRADE OFFER
========================================================= */

function GD9CreateTradeOffer(
    countryCode,
    resourceId,
    direction,
    amount,
    unitPrice
)
{
    GD9Migrate();

    amount=
        Math.max(
            1,
            Math.floor(
                GD9Number(
                    amount,
                    1
                )
            )
        );

    unitPrice=
        Math.max(
            1,
            GD9Number(
                unitPrice,
                GD9ResourcePrice(
                    resourceId
                )
            )
        );

    const player=
        GD9PlayerCode();

    if(
        !countryCode||
        countryCode===
        player
    ){
        GD9Toast(
            "کشور مقصد معتبر نیست"
        );

        return;
    }

    const resource=
        GD9_RESOURCES.find(
            item=>
                item.id===
                resourceId
        );

    if(
        !resource
    ){
        return;
    }

    if(
        GD9WarWith(
            countryCode
        )
    ){
        GD9Toast(
            "در زمان جنگ معامله مستقیم ممکن نیست"
        );

        return;
    }

    if(
        direction===
        "sell"&&
        GD9Number(
            state.resources[
                resourceId
            ],
            0
        )<
        amount
    ){
        GD9Toast(
            "موجودی کافی نیست"
        );

        return;
    }

    const total=
        amount*
        unitPrice;

    if(
        direction===
        "buy"&&
        GD9Number(
            state.economy.money,
            0
        )<
        total
    ){
        GD9Toast(
            "بودجه کافی نیست"
        );

        return;
    }

    const currentDay=
        GD9AbsoluteGameDay();

    const offer=
    {
        id:
            "TRADE-"+Date.now()+"-"+Math.random()
            .toString(
                36
            )
            .slice(
                2
            ),

        countryCode,

        resourceId,

        direction,

        amount,

        unitPrice,

        total,

        status:
            "pending",

        createdDay:
            currentDay,

        resolveDay:
            currentDay+
            GD9RandomInt(
                1,
                2
            ),

        acceptanceScore:
            GD9TradeAcceptance(
                countryCode,
                resourceId,
                direction,
                amount,
                unitPrice
            ),

        createdDate:
            GD9DateKey()
    };

    state.tradeSystem.offers.unshift(
        offer
    );

    state.tradeSystem.history.unshift(
        offer
    );

    GD9PushAINews(
        {
            from:
                countryCode,

            type:
                "trade",

            title:
                "پیشنهاد تجاری در حال بررسی",

            text:
                `${GD9CountryName(countryCode)} پیشنهاد ${direction==="buy"?"فروش":"خرید"} ${amount} واحد ${resource.name} را دریافت کرده و در حال بررسی آن است.`,

            importance:
                1
        }
    );

    GD9Toast(
        "📨 پیشنهاد تجاری ارسال شد"
    );

    GD9Save();

    GD9OpenTradeHub(
        resourceId,
        countryCode
    );
}


/* =========================================================
   RESOLVE PLAYER TRADE OFFERS
========================================================= */

function GD9ResolveTradeOffers()
{
    const currentDay=
        GD9AbsoluteGameDay();

    for(
        const offer of
        state.tradeSystem.offers
    ){
        if(
            offer.status!==
            "pending"||
            currentDay<
            GD9Number(
                offer.resolveDay,
                currentDay
            )
        ){
            continue;
        }

        const resource=
            GD9_RESOURCES.find(
                item=>
                    item.id===
                    offer.resourceId
            );

        if(
            !resource
        ){
            offer.status=
                "cancelled";

            continue;
        }

        if(
            GD9WarWith(
                offer.countryCode
            )
        ){
            offer.status=
                "rejected";

            offer.reason=
                "آغاز جنگ";

            continue;
        }

        let acceptance=
            GD9Number(
                offer.acceptanceScore,
                0
            );

        acceptance+=
            GD9Relation(
                offer.countryCode
            )*
            .03;

        const accepted=
            GD9Chance(
                acceptance
            );

        if(
            !accepted
        ){
            offer.status=
                "rejected";

            offer.resolvedDate=
                GD9DateKey();

            GD9ChangeRelation(
                offer.countryCode,
                -.5
            );

            GD9PushAINews(
                {
                    from:
                        offer.countryCode,

                    type:
                        "trade",

                    title:
                        "پیشنهاد تجاری رد شد",

                    text:
                        `${GD9CountryName(offer.countryCode)} شرایط معامله ${resource.name} را نپذیرفت.`,

                    importance:
                        1
                }
            );

            continue;
        }

        if(
            offer.direction===
            "buy"
        ){
            const aiStock=
                GD9AIResource(
                    offer.countryCode,
                    offer.resourceId
                );

            if(
                aiStock<
                offer.amount
            ){
                offer.status=
                    "rejected";

                offer.reason=
                    "کمبود موجودی طرف مقابل";

                offer.resolvedDate=
                    GD9DateKey();

                continue;
            }

            if(
                GD9Number(
                    state.economy.money,
                    0
                )<
                offer.total
            ){
                offer.status=
                    "cancelled";

                offer.reason=
                    "کمبود بودجه هنگام اجرا";

                offer.resolvedDate=
                    GD9DateKey();

                continue;
            }

            state.economy.money-=
                offer.total;

            state.resources[
                offer.resourceId
            ]+=
                offer.amount;

            GD9SetAIResource(
                offer.countryCode,
                offer.resourceId,
                aiStock-
                offer.amount
            );

            state.economy.imports=
                GD9Number(
                    state.economy.imports,
                    0
                )+
                offer.total;
        }
        else{
            if(
                GD9Number(
                    state.resources[
                        offer.resourceId
                    ],
                    0
                )<
                offer.amount
            ){
                offer.status=
                    "cancelled";

                offer.reason=
                    "موجودی شما هنگام اجرا کافی نبود";

                offer.resolvedDate=
                    GD9DateKey();

                continue;
            }

            state.resources[
                offer.resourceId
            ]-=
                offer.amount;

            state.economy.money+=
                offer.total;

            GD9SetAIResource(
                offer.countryCode,
                offer.resourceId,
                GD9AIResource(
                    offer.countryCode,
                    offer.resourceId
                )+
                offer.amount
            );

            state.economy.exports=
                GD9Number(
                    state.economy.exports,
                    0
                )+
                offer.total;
        }

        offer.status=
            "accepted";

        offer.resolvedDate=
            GD9DateKey();

        GD9ChangeRelation(
            offer.countryCode,
            2+
            Math.min(
                4,
                offer.amount/
                25
            )
        );

        GD9PushAINews(
            {
                from:
                    offer.countryCode,

                type:
                    "trade",

                title:
                    "معامله تجاری پذیرفته شد",

                text:
                    offer.direction===
                    "buy"
                    ?
                    `${GD9CountryName(offer.countryCode)} با فروش ${offer.amount} واحد ${resource.name} به کشور شما موافقت کرد.`
                    :
                    `${GD9CountryName(offer.countryCode)} با خرید ${offer.amount} واحد ${resource.name} از کشور شما موافقت کرد.`,

                importance:
                    2
            }
        );

        GD9Toast(
            "✅ یک پیشنهاد تجاری پذیرفته شد"
        );
    }
}

        GD9CountryCodes()

            code=>
                code!==
                player

            (

                second

                GD9Relation(
                    second
                )-
                GD9Relation(
                    first

        !countries.length

            "کشوری برای تجارت وجود ندارد"

        selectedCountry||
        state.tradeSystem.selectedCountry||

                    '<input id="gd9_amount_'+

                    '</label>'+

                    '<small>قیمت پیشنهادی هر واحد</small>'+
                    '<input id="gd9_price_'+
                    resource.id+

/* =========================================================
   SEND TRADE OFFER FROM UI
========================================================= */

function GD9SendTradeOffer(
    countryCode,
    resourceId,
    direction
)
{
    const amountElement=
        document.getElementById(
            "gd9_amount_"+
            resourceId
        );

    const priceElement=
        document.getElementById(
            "gd9_price_"+
            resourceId
        );

    const amount=
        amountElement
        ?
        GD9Number(
            amountElement.value,
            10
        )
        :
        10;

    const price=
        priceElement
        ?
        GD9Number(
            priceElement.value,
            GD9ResourcePrice(
                resourceId
            )
        )
        :
        GD9ResourcePrice(
            resourceId
        );

    GD9CreateTradeOffer(
        countryCode,
        resourceId,
        direction,
        amount,
        price
    );
}


/* =========================================================
   FILTER TRADE COUNTRIES
========================================================= */

function GD9FilterTradeCountries(
    value
)
{
    const query=
        String(
            value||
            ""
        )
        .trim()
        .toLowerCase();

    const buttons=
        document.querySelectorAll(
            "[data-gd9-country]"
        );

    for(
        const button of
        buttons
    ){
        const code=
            button.dataset.gd9Country;

        const name=
            GD9CountryName(
                code
            )
            .toLowerCase();

        button.style.display=
            (
                !query||
                name.includes(
                    query
                )||
                code.toLowerCase()
                .includes(
                    query
                )
            )
            ?
            ""
            :
            "none";
    }
}

/* =========================================================
   PUSH AI NEWS
========================================================= */

function GD9PushAINews(
    message
)
{
    GD9Migrate();

    state.aiNews.unshift(
        {
            id:
                message.id||
                (
                    "AI-"+
                    Date.now()+
                    "-"+
                    Math.random()
                    .toString(
                        36
                    )
                    .slice(
                        2
                    )
                ),

            from:
                message.from,

            type:
                message.type||
                "diplomatic",

            title:
                message.title||
                "خبر بین‌المللی",

            text:
                message.text||
                "",

            importance:
                GD9Clamp(
                    message.importance||
                    1,
                    1,
                    3
                ),

            date:
                GD9DateKey()
        }
    );

    if(
        state.aiNews.length>
        180
    ){
        state.aiNews.length=
            180;
    }
}


/* =========================================================
   DETAILED AI NEWS GENERATION
========================================================= */

function GD9GenerateAINews()
{
    const countries=
        GD9CountryCodes()
        .filter(
            code=>
                code!==
                GD9PlayerCode()
        );

    if(
        !countries.length
    ){
        return;
    }

    const count=
        state.difficulty===
        "expert"
        ?
        5
        :
        state.difficulty===
        "hard"
        ?
        4
        :
        3;

    for(
        let index=
            0;
        index<
            count;
        index++
    ){
        const code=
            GD9Pick(
                countries
            );

        if(
            !code
        ){
            continue;
        }

        const ai=
            GD9AI(
                code
            );

        const relationValue=
            GD9Relation(
                code
            );

        const types=
        [
            "diplomatic",
            "trade",
            "economic",
            "intelligence"
        ];

        if(
            GD9Number(
                ai.aggression,
                50
            )>
            58
        ){
            types.push(
                "military"
            );
        }

        if(
            GD9Number(
                ai.stability,
                60
            )<
            42
        ){
            types.push(
                "crisis"
            );
        }

        if(
            relationValue>
            42
        ){
            types.push(
                "alliance"
            );
        }

        if(
            relationValue<
            -35
        ){
            types.push(
                "warning"
            );
        }

        const type=
            GD9Pick(
                types
            );

        const template=
            GD9Pick(
                GD9_AI_TEMPLATES[
                    type
                ]
            );

        const titles=
        {
            diplomatic:
                "پیام دیپلماتیک",

            trade:
                "تحولات تجاری",

            economic:
                "گزارش اقتصادی",

            military:
                "تحولات دفاعی",

            warning:
                "هشدار سیاسی",

            crisis:
                "بحران داخلی",

            intelligence:
                "گزارش اطلاعاتی",

            alliance:
                "تحرک راهبردی"
        };

        GD9PushAINews(
            {
                from:
                    code,

                type,

                title:
                    titles[
                        type
                    ],

                text:
                    `${GD9CountryName(code)} ${template}`,

                importance:
                    (
                        type===
                        "crisis"||
                        type===
                        "warning"
                    )
                    ?
                    3
                    :
                    type===
                    "military"
                    ?
                    2
                    :
                    1
            }
        );
    }
}


/* =========================================================
   DIRECT AI PROPOSALS
========================================================= */

function GD9GenerateAIProposal()
{
    const countries=
        GD9CountryCodes()
        .filter(
            code=>
                code!==
                GD9PlayerCode()&&
                !GD9WarWith(
                    code
                )
        );

    if(
        !countries.length
    ){
        return;
    }

    const code=
        GD9Pick(
            countries
        );

    const ai=
        GD9AI(
            code
        );

    const relationValue=
        GD9Relation(
            code
        );

    const roll=
        Math.random();

    if(
        roll<
        .28&&
        GD9Number(
            ai.tradeInterest,
            50
        )>
        40
    ){
        const resource=
            GD9Pick(
                GD9_RESOURCES
            );

        const aiStock=
            GD9AIResource(
                code,
                resource.id
            );

        const playerStock=
            GD9Number(
                state.resources[
                    resource.id
                ],
                0
            );

        const aiWantsBuy=
            aiStock<
            55||
            playerStock>
            100;

        const amount=
            GD9Pick(
                [
                    10,
                    15,
                    20,
                    30
                ]
            );

        const market=
            GD9ResourcePrice(
                resource.id
            );

        const unitPrice=
            aiWantsBuy
            ?
            market*
            GD9Random(
                .94,
                1.12
            )
            :
            market*
            GD9Random(
                .90,
                1.05
            );

        state.inbox.unshift(
            {
                id:
                    "AIPROP-"+
                    Date.now()+
                    "-"+
                    Math.random()
                    .toString(
                        36
                    )
                    .slice(
                        2
                    ),

                from:
                    code,

                type:
                    aiWantsBuy
                    ?
                    "resourceBuyFromPlayer"
                    :
                    "resourceSellToPlayer",

                resourceId:
                    resource.id,

                amount,

                unitPrice,

                title:
                    aiWantsBuy
                    ?
                    "درخواست خرید منبع"
                    :
                    "پیشنهاد فروش منبع",

                text:
                    aiWantsBuy
                    ?
                    `${GD9CountryName(code)} می‌خواهد ${amount} واحد ${resource.name} از کشور شما خریداری کند.`
                    :
                    `${GD9CountryName(code)} پیشنهاد فروش ${amount} واحد ${resource.name} به کشور شما را داده است.`,

                status:
                    "pending"
            }
        );

        GD9Toast(
            "📨 پیشنهاد تجاری جدید"
        );

        return;
    }

    if(
        roll<
        .46&&
        relationValue>
        20
    ){
        state.inbox.unshift(
            {
                id:
                    "AIPROP-"+
                    Date.now(),

                from:
                    code,

                type:
                    "economicCooperation",

                title:
                    "همکاری اقتصادی",

                text:
                    `${GD9CountryName(code)} پیشنهاد برنامه مشترک صنعتی و تجاری داده است.`,

                value:
                    GD9RandomInt(
                        800,
                        2200
                    ),

                status:
                    "pending"
            }
        );

        return;
    }

    if(
        roll<
        .62&&
        relationValue>
        40
    ){
        state.inbox.unshift(
            {
                id:
                    "AIPROP-"+
                    Date.now(),

                from:
                    code,

                type:
                    "research",

                title:
                    "همکاری فناوری",

                text:
                    `${GD9CountryName(code)} پیشنهاد همکاری علمی و فناوری داده است.`,

                status:
                    "pending"
            }
        );

        return;
    }

    if(
        roll<
        .76&&
        relationValue<
        -25
    ){
        state.inbox.unshift(
            {
                id:
                    "AIPROP-"+
                    Date.now(),

                from:
                    code,

                type:
                    "warning",

                title:
                    "درخواست کاهش تنش",

                text:
                    `${GD9CountryName(code)} خواهان کاهش فوری تنش‌های سیاسی شده است.`,

                status:
                    "pending"
            }
        );

        return;
    }

    if(
        roll<
        .88&&
        relationValue>
        10
    ){
        state.inbox.unshift(
            {
                id:
                    "AIPROP-"+
                    Date.now(),

                from:
                    code,

                type:
                    "aid",

                title:
                    "کمک اقتصادی",

                text:
                    `${GD9CountryName(code)} پیشنهاد بسته کمک اقتصادی داده است.`,

                value:
                    GD9RandomInt(
                        500,
                        1900
                    ),

                status:
                    "pending"
            }
        );
    }
}

/* =========================================================
   RESPOND TO AI PROPOSALS
========================================================= */

function GD9RespondProposal(
    proposalId,
    accepted
)
{
    const proposal=
        state.inbox.find(
            item=>
                item.id===
                proposalId
        );

    if(
        !proposal||
        proposal.status!==
        "pending"
    ){
        return;
    }

    if(
        !accepted
    ){
        proposal.status=
            "rejected";

        GD9ChangeRelation(
            proposal.from,
            -3
        );

        GD9PushAINews(
            {
                from:
                    proposal.from,

                type:
                    "diplomatic",

                title:
                    "پیشنهاد رد شد",

                text:
                    `${GD9CountryName(proposal.from)} از رد شدن پیشنهاد خود ابراز نارضایتی کرد.`,

                importance:
                    1
            }
        );

        GD9Save();

        GD9OpenAIInbox(
            "messages"
        );

        return;
    }

    const resource=
        proposal.resourceId
        ?
        GD9_RESOURCES.find(
            item=>
                item.id===
                proposal.resourceId
        )
        :
        null;

    if(
        proposal.type===
        "resourceBuyFromPlayer"
    ){
        const amount=
            GD9Number(
                proposal.amount,
                0
            );

        const unitPrice=
            GD9Number(
                proposal.unitPrice,
                0
            );

        if(
            GD9Number(
                state.resources[
                    proposal.resourceId
                ],
                0
            )<
            amount
        ){
            GD9Toast(
                "موجودی شما برای اجرای معامله کافی نیست"
            );

            return;
        }

        state.resources[
            proposal.resourceId
        ]-=
            amount;

        state.economy.money+=
            amount*
            unitPrice;

        GD9SetAIResource(
            proposal.from,
            proposal.resourceId,
            GD9AIResource(
                proposal.from,
                proposal.resourceId
            )+
            amount
        );

        state.economy.exports=
            GD9Number(
                state.economy.exports,
                0
            )+
            amount*
            unitPrice;

        GD9ChangeRelation(
            proposal.from,
            5
        );
    }

    if(
        proposal.type===
        "resourceSellToPlayer"
    ){
        const amount=
            GD9Number(
                proposal.amount,
                0
            );

        const unitPrice=
            GD9Number(
                proposal.unitPrice,
                0
            );

        const total=
            amount*
            unitPrice;

        if(
            GD9Number(
                state.economy.money,
                0
            )<
            total
        ){
            GD9Toast(
                "بودجه کافی برای اجرای معامله نیست"
            );

            return;
        }

        if(
            GD9AIResource(
                proposal.from,
                proposal.resourceId
            )<
            amount
        ){
            GD9Toast(
                "کشور مقابل دیگر موجودی کافی ندارد"
            );

            proposal.status=
                "cancelled";

            GD9Save();

            GD9OpenAIInbox(
                "messages"
            );

            return;
        }

        state.economy.money-=
            total;

        state.resources[
            proposal.resourceId
        ]+=
            amount;

        GD9SetAIResource(
            proposal.from,
            proposal.resourceId,
            GD9AIResource(
                proposal.from,
                proposal.resourceId
            )-
            amount
        );

        state.economy.imports=
            GD9Number(
                state.economy.imports,
                0
            )+
            total;

        GD9ChangeRelation(
            proposal.from,
            5
        );
    }

    if(
        proposal.type===
        "economicCooperation"
    ){
        state.economy.money+=
            GD9Number(
                proposal.value,
                1000
            )*
            .30;

        state.nation.industry=
            GD9Number(
                state.nation.industry,
                50
            )+
            .8;

        state.nation.trade=
            GD9Number(
                state.nation.trade,
                50
            )+
            1;

        GD9ChangeRelation(
            proposal.from,
            8
        );
    }

    if(
        proposal.type===
        "research"
    ){
        state.nation.technology=
            GD9Number(
                state.nation.technology,
                50
            )+
            .7;

        if(
            state.society
        ){
            state.society.education=
                GD9Number(
                    state.society.education,
                    50
                )+
                .5;
        }

        GD9ChangeRelation(
            proposal.from,
            7
        );
    }

    if(
        proposal.type===
        "warning"
    ){
        GD9ChangeRelation(
            proposal.from,
            10
        );

        state.nation.reputation=
            GD9Clamp(
                GD9Number(
                    state.nation.reputation,
                    50
                )-
                1,
                0,
                100
            );
    }

    if(
        proposal.type===
        "aid"
    ){
        state.economy.money+=
            GD9Number(
                proposal.value,
                1000
            );

        GD9ChangeRelation(
            proposal.from,
            5
        );
    }

    proposal.status=
        "accepted";

    GD9PushAINews(
        {
            from:
                proposal.from,

            type:
                proposal.type.includes(
                    "resource"
                )
                ?
                "trade"
                :
                "diplomatic",

            title:
                "توافق اجرا شد",

            text:
                resource
                ?
                `توافق مربوط به ${resource.name} با ${GD9CountryName(proposal.from)} اجرا شد.`
                :
                `توافق جدید با ${GD9CountryName(proposal.from)} اجرا شد.`,

            importance:
                2
        }
    );

    GD9Toast(
        "✅ پیشنهاد پذیرفته و اجرا شد"
    );

    GD9Save();

    GD9Render();

    GD9OpenAIInbox(
        "messages"
    );
}


/* =========================================================
   WAR CHECK WITH FALLBACK
========================================================= */

function GD9WarWith(
    countryCode
)
{
    try{

        if(
            typeof playerWarAgainst===
            "function"
        ){
            const result=
                playerWarAgainst(
                    countryCode
                );

            if(
                result
            ){
                return result;
            }
        }

    }
    catch(
        error
    ){
    }

    const player=
        GD9PlayerCode();

    if(
        !player||
        !Array.isArray(
            state.wars
        )
    ){
        return null;
    }

    return state.wars.find(
        war=>
        {
            const active=
                war.status===
                "active"||
                war.status===
                "war";

            if(
                !active
            ){
                return false;
            }

            return(
                (
                    war.attacker===
                    player&&
                    war.defender===
                    countryCode
                )||
                (
                    war.defender===
                    player&&
                    war.attacker===
                    countryCode
                )
            );
        }
    )||
    null;
}

            60
        )*
        .20;

    {

            19,

            18,

        KR:
            16,

        JP:
            15,

    }[

/* =========================================================
   PERFECT SVG LOCAL POINT -> SCREEN POINT
========================================================= */

function GD9MapPointToScreen(
    point
)
{
    const svg=
        document.getElementById(
            "worldSvg"
        );

    const camera=
        document.getElementById(
            "camera"
        );

    const viewport=
        document.getElementById(
            "mapViewport"
        );

    if(
        !svg||
        !camera||
        !viewport
    ){
        return{
            x:
                0,

            y:
                0
        };
    }

    const matrix=
        camera.getScreenCTM();

    if(
        !matrix
    ){
        return{
            x:
                0,

            y:
                0
        };
    }

    let screenX=
        0;

    let screenY=
        0;

    if(
        typeof DOMPoint===
        "function"
    ){
        const transformed=
            new DOMPoint(
                point[0],
                point[1]
            )
            .matrixTransform(
                matrix
            );

        screenX=
            transformed.x;

        screenY=
            transformed.y;
    }
    else{
        const svgPoint=
            svg.createSVGPoint();

        svgPoint.x=
            point[0];

        svgPoint.y=
            point[1];

        const transformed=
            svgPoint.matrixTransform(
                matrix
            );

        screenX=
            transformed.x;

        screenY=
            transformed.y;
    }

    const viewportRect=
        viewport.getBoundingClientRect();

    return{
        x:
            screenX-
            viewportRect.left,

        y:
            screenY-
            viewportRect.top
    };
}

/* =========================================================
   CREATE TRAIL
========================================================= */

function GD9CreateTrail(
    from,
    to,
    blue=
        false
)
{
    const layer=
        GD9FxLayer();

    if(
        !layer
    ){
        return null;
    }

    const dx=
        to.x-
        from.x;

    const dy=
        to.y-
        from.y;

    const length=
        Math.hypot(
            dx,
            dy
        );

    const angle=
        Math.atan2(
            dy,
            dx
        )*
        180/
        Math.PI;

    const trail=
        document.createElement(
            "div"
        );

    trail.className=
        "gd9-trail"+
        (
            blue
            ?
            " blue"
            :
            ""
        );

    trail.style.left=
        from.x+
        "px";

    trail.style.top=
        from.y+
        "px";

    trail.style.width=
        length+
        "px";

    trail.style.transform=
        "rotate("+
        angle+
        "deg)";

    layer.appendChild(
        trail
    );

    return trail;
}


/* =========================================================
   PROJECTILE ANIMATION
========================================================= */

function GD9AnimateProjectile(
    element,
    from,
    to,
    duration,
    arcHeight
)
{
    const dx=
        to.x-
        from.x;

    const dy=
        to.y-
        from.y;

    const start=
        performance.now();

    return new Promise(
        resolve=>
        {
            function frame(
                time
            ){
                const linear=
                    GD9Clamp(
                        (
                            time-
                            start
                        )/
                        duration,
                        0,
                        1
                    );

                const eased=
                    linear<
                    .5
                    ?
                    2*
                    linear*
                    linear
                    :
                    1-
                    Math.pow(
                        -2*
                        linear+
                        2,
                        2
                    )/
                    2;

                const arc=
                    Math.sin(
                        Math.PI*
                        linear
                    )*
                    arcHeight;

                const x=
                    from.x+
                    dx*
                    eased;

                const y=
                    from.y+
                    dy*
                    eased-
                    arc;

                const arcDerivative=
                    -Math.cos(
                        Math.PI*
                        linear
                    )*
                    Math.PI*
                    arcHeight;

                const angle=
                    Math.atan2(
                        dy+
                        arcDerivative,
                        dx
                    )*
                    180/
                    Math.PI;

                element.style.left=
                    x+
                    "px";

                element.style.top=
                    y+
                    "px";

                element.style.transform=
                    "rotate("+
                    angle+
                    "deg)";

                if(
                    linear<
                    1
                ){
                    requestAnimationFrame(
                        frame
                    );
                }
                else{
                    resolve();
                }
            }

            requestAnimationFrame(
                frame
            );
        }
    );
}

/* =========================================================
   MISSILE ANIMATION
========================================================= */

async function GD9PlayMissile(
    targetCode,
    intercepted
)
{
    const layer=
        GD9FxLayer();

    if(
        !layer
    ){
        return;
    }

    const sourceMap=
        GD9MapCenter(
            GD9PlayerCode()
        );

    const targetMap=
        GD9MapCenter(
            targetCode
        );

    const source=
        GD9MapPointToScreen(
            sourceMap
        );

    const target=
        GD9MapPointToScreen(
            targetMap
        );

    const distance=
        Math.hypot(
            target.x-
            source.x,
            target.y-
            source.y
        );

    const arcHeight=
        Math.min(
            120,
            Math.max(
                35,
                distance*
                .16
            )
        );

    const missile=
        document.createElement(
            "div"
        );

    missile.className=
        "gd9-missile";

    layer.appendChild(
        missile
    );

    if(
        intercepted
    ){
        const interceptProgress=
            .74+
            Math.random()*
            .10;

        const interceptPoint=
        {
            x:
                source.x+
                (
                    target.x-
                    source.x
                )*
                interceptProgress,

            y:
                source.y+
                (
                    target.y-
                    source.y
                )*
                interceptProgress-
                Math.sin(
                    Math.PI*
                    interceptProgress
                )*
                arcHeight
        };

        const defenseStart=
        {
            x:
                target.x+
                GD9Random(
                    -35,
                    35
                ),

            y:
                target.y+
                GD9Random(
                    18,
                    45
                )
        };

        const interceptor=
            document.createElement(
                "div"
            );

        interceptor.className=
            "gd9-interceptor";

        layer.appendChild(
            interceptor
        );

        const missileTrail=
            GD9CreateTrail(
                source,
                interceptPoint,
                false
            );

        const interceptorTrail=
            GD9CreateTrail(
                defenseStart,
                interceptPoint,
                true
            );

        const missileFlight=
            GD9AnimateProjectile(
                missile,
                source,
                interceptPoint,
                1500,
                arcHeight*
                .68
            );

        await new Promise(
            resolve=>
                setTimeout(
                    resolve,
                    650
                )
        );

        const interceptorFlight=
            GD9AnimateProjectile(
                interceptor,
                defenseStart,
                interceptPoint,
                820,
                24
            );

        await Promise.all(
            [
                missileFlight,
                interceptorFlight
            ]
        );

        missile.remove();

        interceptor.remove();

        if(
            missileTrail
        ){
            missileTrail.remove();
        }

        if(
            interceptorTrail
        ){
            interceptorTrail.remove();
        }

        GD9InterceptRing(
            interceptPoint
        );

        GD9Explosion(
            interceptPoint
        );

        GD9ResultLabel(
            interceptPoint,
            "🛡️ موشک رهگیری شد",
            "intercepted"
        );

        return;
    }

    const trail=
        GD9CreateTrail(
            source,
            target,
            false
        );

    await GD9AnimateProjectile(
        missile,
        source,
        target,
        1800,
        arcHeight
    );

    missile.remove();

    if(
        trail
    ){
        trail.remove();
    }

    GD9Explosion(
        target
    );

    GD9ResultLabel(
        target,
        "💥 اصابت ثبت شد",
        "hit"
    );
}


/* =========================================================
   LAUNCH MISSILE
========================================================= */

async function GD9LaunchMissile(
    targetCode,
    missileId
)
{
    GD9Migrate();

    if(
        !GD9WarWith(
            targetCode
        )
    ){
        GD9Toast(
            "برای حمله موشکی باید با کشور هدف در جنگ باشی"
        );

        return;
    }

    if(
        typeof EQUIPMENT===
        "undefined"
    ){
        return;
    }

    const missile=
        EQUIPMENT.find(
            item=>
                item.id===
                missileId&&
                item.category===
                "missile"
        );

    if(
        !missile
    ){
        GD9Toast(
            "موشک معتبر نیست"
        );

        return;
    }

    const stock=
        GD9Number(
            state.inventory[
                missileId
            ],
            0
        );

    if(
        stock<=
        0
    ){
        GD9Toast(
            "این موشک در انبار موجود نیست"
        );

        return;
    }

    state.inventory[
        missileId
    ]=
        stock-
        1;

    const defense=
        GD9TargetDefense(
            targetCode
        );

    const attackerTechnology=
        GD9Number(
            state.nation.technology,
            50
        );

    const missilePower=
        GD9Number(
            missile.power,
            60
        );

    let interceptChance=
        defense*
        .70-
        attackerTechnology*
        .11-
        missilePower*
        .07+
        17;

    interceptChance=
        GD9Clamp(
            interceptChance,
            7,
            82
        );

    const intercepted=
        GD9Chance(
            interceptChance
        );

    const record=
    {
        id:
            "MISSILE-"+
            Date.now()+
            "-"+
            Math.random()
            .toString(
                36
            )
            .slice(
                2
            ),

        targetCode,

        missileId,

        intercepted,

        interceptChance,

        date:
            GD9DateKey()
    };

    state.missileHistory.unshift(
        record
    );

    if(
        state.missileHistory.length>
        80
    ){
        state.missileHistory.length=
            80;
    }

    GD9Save();

    try{

        if(
            typeof closeModal===
            "function"
        ){
            closeModal();
        }

    }
    catch(
        error
    ){
    }

    await GD9PlayMissile(
        targetCode,
        intercepted
    );

    const targetAI=
        GD9AI(
            targetCode
        );

    if(
        intercepted
    ){
        GD9PushAINews(
            {
                from:
                    targetCode,

                type:
                    "military",

                title:
                    "رهگیری موشک",

                text:
                    `سامانه دفاعی ${GD9CountryName(targetCode)} یک حمله موشکی را در شبیه‌سازی رهگیری کرد.`,

                importance:
                    3
            }
        );

        GD9Toast(
            "🛡️ موشک رهگیری شد"
        );
    }
    else{
        const abstractDamage=
            GD9Clamp(
                missilePower*
                .10+
                GD9Random(
                    1,
                    5
                ),
                2,
                15
            );

        targetAI.readiness=
            GD9Clamp(
                GD9Number(
                    targetAI.readiness,
                    60
                )-
                abstractDamage*
                .35,
                10,
                100
            );

        targetAI.stability=
            GD9Clamp(
                GD9Number(
                    targetAI.stability,
                    60
                )-
                abstractDamage*
                .12,
                10,
                100
            );

        targetAI.military=
            GD9Clamp(
                GD9Number(
                    targetAI.military,
                    50
                )-
                abstractDamage*
                .06,
                10,
                160
            );

        GD9PushAINews(
            {
                from:
                    targetCode,

                type:
                    "military",

                title:
                    "اصابت موشکی",

                text:
                    `یک حمله موشکی در شبیه‌سازی به ${GD9CountryName(targetCode)} اصابت کرد و بخشی از آمادگی آن کشور کاهش یافت.`,

                importance:
                    3
            }
        );

        GD9Toast(
            "💥 موشک اصابت کرد"
        );
    }

    GD9Save();

    GD9Render();
}

                    '\',\''+
                    missile.id+
                    '\')">'+

                    '<div class="card-head">'+
                    '<div class="icon">'+
                    GD9Safe(
                        missile.icon||
                        "🚀"
                    )+
                    '</div>'+
                    '<div>'+
                    '<div class="card-title">'+
                    GD9Safe(
                        missile.name
                    )+
                    '</div>'+
                    '<div class="card-sub">'+
                    'موجودی '+
                    GD9Number(
                        state.inventory[
                            missile.id
                        ],
                        0
                    )+
                    " • قدرت گیم‌پلی "+
                    GD9Number(
                        missile.power,
                        0
                    )+
                    '</div>'+
                    '</div>'+
                    '</div>'+

                    '</button>'
            )
            .join("")+
            '</div>'
            :
            '<div class="notice bad">هیچ موشکی در انبار موجود نیست.</div>'
        )
    );
}


/* =========================================================
   MISSILE HISTORY
========================================================= */

function GD9OpenMissileHistory()
{
    GD9Migrate();

    const records=
        state.missileHistory;

    GD9OpenModal(
        "🚀 گزارش حملات موشکی",
        records.length
        ?
        records
        .slice(
            0,
            40
        )
        .map(
            record=>
            {
                const equipment=
                    typeof EQUIPMENT!==
                    "undefined"
                    ?
                    EQUIPMENT.find(
                        item=>
                            item.id===
                            record.missileId
                    )
                    :
                    null;

                return(
                    '<div class="card gd9-impact-report '+
                    (
                        record.intercepted
                        ?
                        "intercepted"
                        :
                        ""
                    )+
                    '">'+

                    '<div class="card-title">'+
                    (
                        record.intercepted
                        ?
                        "🛡️ رهگیری"
                        :
                        "💥 اصابت"
                    )+
                    " • "+
                    GD9Flag(
                        record.targetCode
                    )+
                    " "+
                    GD9Safe(
                        GD9CountryName(
                            record.targetCode
                        )
                    )+
                    '</div>'+

                    '<div class="card-desc">'+
                    'موشک: '+
                    GD9Safe(
                        equipment
                        ?
                        equipment.name
                        :
                        record.missileId
                    )+
                    '<br>'+
                    'احتمال رهگیری گیم‌پلی: '+
                    GD9Number(
                        record.interceptChance
                    )
                    .toFixed(
                        0
                    )+
                    '%'+
                    '<br>'+
                    'تاریخ: '+
                    GD9Safe(
                        record.date
                    )+
                    '</div>'+

                    '</div>'
                );
            }
        )
        .join("")
        :
        '<div class="notice">هنوز حمله موشکی ثبت نشده است.</div>'
    );
}


/* =========================================================
   PRESERVE ORIGINAL COUNTRY PANEL + ADD ACTIONS
========================================================= */

function GD9OpenCountryPanel(
    code
)
{
    if(
        GD9OriginalOpenCountryPanel
    ){
        GD9OriginalOpenCountryPanel(
            code
        );
    }
    else{
        GD9OpenModal(
            GD9Flag(
                code
            )+
            " "+
            GD9Safe(
                GD9CountryName(
                    code
                )
            ),
            '<div class="notice">اطلاعات کشور</div>'
        );
    }

    if(
        code===
        GD9PlayerCode()
    ){
        return;
    }

    setTimeout(
        function(){

            const body=
                document.getElementById(
                    "modalBody"
                );

            if(
                !body
            ){
                return;
            }

            const old=
                body.querySelector(
                    "#gd9CountryExtraActions"
                );

            if(
                old
            ){
                old.remove();
            }

            const container=
                document.createElement(
                    "div"
                );

            container.id=
                "gd9CountryExtraActions";

            container.className=
                "gd9-additional-actions";

            const war=
                GD9WarWith(
                    code
                );

            container.innerHTML=
                '<div class="section-title">جزئیات و اقدامات جدید</div>'+
                '<div class="row">'+

                '<button class="btn blue" onclick="openTradeHub(\'food\',\''+
                code+
                '\')">📦 تجارت همه منابع</button>'+

                (
                    war
                    ?
                    '<button class="btn red" onclick="openGD9MissilePanel(\''+
                    code+
                    '\')">🚀 حمله موشکی</button>'
                    :
                    ""
                )+

                '</div>';

            body.appendChild(
                container
            );

        },
        0
    );
}


/* =========================================================
   INSTALL DOCK BUTTONS
========================================================= */

function GD9InstallDock()
{
    const dock=
        document.getElementById(
            "dock"
        );

    if(
        !dock
    ){
        return;
    }

    if(
        !document.getElementById(
            "gd9TradeDock"
        )
    ){
        const trade=
            document.createElement(
                "button"
            );

        trade.id=
            "gd9TradeDock";

        trade.className=
            "dock-btn";

        trade.innerHTML=
            '<span>📦</span><small>تجارت</small>';

        trade.addEventListener(
            "click",
            function(){

                GD9OpenTradeHub(
                    "food"
                );

            }
        );

        dock.appendChild(
            trade
        );
    }

    if(
        !document.getElementById(
            "gd9MissileDock"
        )
    ){
        const missile=
            document.createElement(
                "button"
            );

        missile.id=
            "gd9MissileDock";

        missile.className=
            "dock-btn";

        missile.innerHTML=
            '<span>🚀</span><small>گزارش موشک</small>';

        missile.addEventListener(
            "click",
            GD9OpenMissileHistory
        );

        dock.appendChild(
            missile
        );
    }
}


/* =========================================================
   DETAIL DAILY PROCESS WITH DUPLICATE PROTECTION
========================================================= */

function GD9DailyDetailProcess()
{
    GD9Migrate();

    const dateKey=
        GD9DateKey();

    if(
        state.gd9.lastDetailDate===
        dateKey
    ){
        return;
    }

    state.gd9.lastDetailDate=
        dateKey;

    GD9ProcessAIResources();

    GD9ResolveTradeOffers();

    const day=
        GD9Number(
            state.date.day,
            1
        );

    if(
        day%
        2===
        0
    ){
        GD9GenerateAINews();
    }

    if(
        day%
        3===
        0&&
        GD9Chance(
            58
        )
    ){
        GD9GenerateAIProposal();
    }

    GD9Save();
}


/* =========================================================
   NEXT DAY WRAPPER
========================================================= */

function GD9WrappedNextDay()
{
    if(
        GD9OriginalNextDay
    ){
        GD9OriginalNextDay();
    }

    GD9DailyDetailProcess();
}


/* =========================================================
   PROCESS SIMULATION WRAPPER
========================================================= */

function GD9WrappedDailySimulation()
{
    if(
        GD9OriginalProcessDailySimulation
    ){
        GD9OriginalProcessDailySimulation();
    }

    GD9DailyDetailProcess();
}


/* =========================================================
   START GAME WRAPPER
========================================================= */

const GD9OriginalStartGame=
    typeof window.startGame===
    "function"
    ?
    window.startGame
    :
    null;


function GD9WrappedStartGame(
    code
)
{
    if(
        GD9OriginalStartGame
    ){
        GD9OriginalStartGame(
            code
        );
    }

    GD9Migrate();

    GD9InitializeAIResources();

    if(
        state.aiNews.length<
        8
    ){
        GD9GenerateAINews();

        GD9GenerateAINews();

        GD9GenerateAINews();
    }

    GD9InstallDock();

    GD9Save();
}


/* =========================================================
   INITIAL AI NEWS
========================================================= */

function GD9InitialNews()
{
    if(
        !state.started
    ){
        return;
    }

    if(
        state.aiNews.length>=
        10
    ){
        return;
    }

    for(
        let index=
            0;
        index<
            4;
        index++
    ){
        GD9GenerateAINews();
    }
}

function GD9Boot()

    GD9Migrate();

    GD9FxLayer();

    GD9InstallDock();

    GD9InitialNews();

if(
    document.readyState===
